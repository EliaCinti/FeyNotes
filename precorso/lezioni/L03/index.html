        icon: "🌉",
        content: `<p>La geometria analitica, o cartesiana, è una disciplina che fa da <strong>ponte</strong> tra la geometria, basata sul concetto di <strong>punto</strong>, e l'algebra, basata sul concetto di <strong>numero</strong>. L'idea fondamentale è che qualunque problema geometrico può essere trasformato in un problema algebrico e viceversa. Questo ci permette di scegliere ogni volta l'approccio più semplice.</p>`,

            subtitle: "Esempio: intersezione di due circonferenze",
            content: `<p>Consideriamo l'intersezione tra due circonferenze nel piano. È un <strong>problema geometrico</strong>: disegnando due circonferenze di raggio $1$, la prima centrata in $C_1(1,0)$ e la seconda in $C_2(2,1)$, i due bordi si tagliano in due punti distinti. I centri distano infatti $\\sqrt{2} \\approx 1{,}41$, cioè meno della somma dei raggi (che vale $2$) e più della loro differenza (che vale $0$).</p>
<p>La traduzione algebrica è un sistema di due equazioni di secondo grado:</p>
<p>$$\\begin{cases} x^2 + y^2 - 2x = 0 \\\\ x^2 + y^2 - 4x - 2y + 4 = 0 \\end{cases}$$</p>
<p>Risolvere il sistema (problema algebrico) equivale a trovare i punti di intersezione (soluzione geometrica).</p>
<p><em>Esempio illustrativo del calcolo.</em> Sottraendo membro a membro le due equazioni, i termini di secondo grado si semplificano e resta un'equazione di primo grado:</p>
<p>$$(x^2+y^2-2x) - (x^2+y^2-4x-2y+4) = 0 \\;\\Longrightarrow\\; 2x + 2y - 4 = 0 \\;\\Longrightarrow\\; y = 2 - x.$$</p>
<p>Sostituendo $y = 2-x$ nella prima equazione:</p>
<p>$$x^2 + (2-x)^2 - 2x = 2x^2 - 6x + 4 = 0 \\;\\Longrightarrow\\; x^2 - 3x + 2 = 0 \\;\\Longrightarrow\\; x = 1 \\ \\text{oppure} \\ x = 2.$$</p>
<p>I punti di intersezione sono quindi $(1,1)$ e $(2,0)$: <strong>due punti</strong>, esattamente come suggeriva il disegno.</p>`

<li><strong>Pierre de Fermat (1607–1665)</strong>: già nel 1629 scopre che un'equazione del tipo $f(x,y) = 0$ descrive una curva nel piano. Era un genio, ma disordinato. È famoso per l'"Ultimo Teorema di Fermat", che scrisse a margine di un libro aggiungendo: "So la dimostrazione, ma non la scrivo qui perché non c'è spazio". Ci sono voluti più di 300 anni per dimostrarlo.</li>

<ul>
<li>l'<strong>asse delle ascisse</strong> (asse $x$), solitamente orizzontale;</li>
<li>l'<strong>asse delle ordinate</strong> (asse $y$), solitamente verticale.</li>
</ul>
<p>Il loro punto di intersezione è detto <strong>origine</strong> $O(0,0)$. Gli assi dividono il piano in quattro <strong>quadranti</strong>.</p>
<p>Ogni punto $P$ del piano è univocamente identificato da una coppia ordinata di numeri reali $(x_P, y_P)$, dette <strong>coordinate</strong> del punto.</p>`

<li>Le lettere minuscole $a, b, c, \\dots$ o con pedice ($x_1, y_1$) indicano numeri reali noti (<strong>costanti</strong> o parametri).</li>
</ul>`

<p><strong>Forma esplicita:</strong></p>
<p>$$y = mx + q$$</p>
<p>dove $m$ è il <strong>coefficiente angolare</strong> (o pendenza) e $q$ è l'<strong>intercetta</strong> (o ordinata all'origine).</p>
<p><strong>Forma implicita:</strong></p>
<p>$$ax + by + c = 0$$</p>
<p>con $a, b, c$ parametri reali e $a, b$ <strong>non entrambi nulli</strong>.</p>`,

<p>$$ax + by + c = 0 \\quad\\Rightarrow\\quad by = -ax - c \\quad\\Rightarrow\\quad y = -\\frac{a}{b}x - \\frac{c}{b}$$</p>
<p>Confrontando con $y = mx + q$ si ottiene:</p>
<p>$$m = -\\frac{a}{b} \\qquad \\text{e} \\qquad q = -\\frac{c}{b}$$</p>`

        subsections: [

            subtitle: "L'intercetta q",
            content: `<p>L'intercetta $q$ rappresenta l'<strong>ordinata del punto in cui la retta interseca l'asse $y$</strong>. Infatti, ponendo $x=0$ in $y=mx+q$ si ottiene $y=q$.</p>
<ul>
<li>Se $q \\gt 0$, la retta interseca l'asse $y$ sopra l'origine.</li>
<li>Se $q \\lt 0$, la retta interseca l'asse $y$ sotto l'origine.</li>
<li>Se $q = 0$, la retta passa per l'origine $O(0,0)$.</li>
</ul>`
          },

            subtitle: "Il coefficiente angolare m",
            content: `<p>Il coefficiente angolare $m$ misura l'<strong>inclinazione</strong> della retta rispetto all'asse $x$.</p>
<ul>
<li>Se $m \\gt 0$, la retta è <strong>crescente</strong> (sale da sinistra a destra).</li>
<li>Se $m \\lt 0$, la retta è <strong>decrescente</strong> (scende da sinistra a destra).</li>
<li>Se $m = 0$, la retta è <strong>orizzontale</strong>, con equazione $y=q$.</li>
</ul>
<p>Dati due punti qualsiasi $P_1(x_1, y_1)$ e $P_2(x_2, y_2)$ appartenenti alla retta (con $x_1 \\neq x_2$), il coefficiente angolare è il rapporto tra la variazione delle ordinate e quella delle ascisse:</p>
<p>$$m = \\frac{\\Delta y}{\\Delta x} = \\frac{y_2 - y_1}{x_2 - x_1}$$</p>
<p>Questo rapporto è <strong>costante</strong> per qualsiasi coppia di punti scelti sulla retta.</p>`

            subtitle: "Perché serve l'ipotesi x₁ ≠ x₂",
            content: `<p>La condizione $x_1 \\neq x_2$ non è un dettaglio tecnico, ma chiude il cerchio con quanto visto sulla forma implicita. Se due punti distinti della retta avessero la stessa ascissa, cioè $x_1 = x_2$, il denominatore $x_2 - x_1$ sarebbe nullo e il rapporto $\\Delta y/\\Delta x$ non avrebbe significato.</p>
<p>Ma due punti distinti con la stessa ascissa individuano esattamente una <strong>retta verticale</strong> di equazione $x = x_1$: si tratta quindi proprio del caso $b=0$ della forma implicita, per il quale il coefficiente angolare <strong>non esiste</strong>. In sintesi:</p>
<p>$$x_1 \\neq x_2 \\ \\Longleftrightarrow\\ \\text{la retta non è verticale} \\ \\Longleftrightarrow\\ m \\ \\text{è definito}.$$</p>
<p>Intuitivamente: salendo lungo una retta verticale si ha una variazione $\\Delta y \\neq 0$ a fronte di $\\Delta x = 0$, cioè una "pendenza infinita", che non si può rappresentare con un numero reale.</p>`
          },

<p>$$m = \\tan(\\alpha) \\quad \\Rightarrow \\quad \\alpha = \\arctan(m)$$</p>
<p>Anche questa lettura conferma il caso limite: per una retta verticale si ha $\\alpha = 90^\\circ$ e $\\tan(90^\\circ)$ non è definita.</p>
<p>Sulle calcolatrici scientifiche l'arcotangente è spesso indicata come $\\tan^{-1}$.</p>`
          }

<p>Il grafico mostra la retta $y = 2x+1$: l'intercetta $q=1$ è il punto in cui taglia l'asse $y$, mentre passando da $P_1(1,3)$ a $P_2(2,5)$ si legge $\\Delta y / \\Delta x = 2/1 = 2 = m$.</p>`,
        formulas: [
          { label: "Coefficiente angolare da due punti", latex: "m = \\frac{\\Delta y}{\\Delta x} = \\frac{y_2 - y_1}{x_2 - x_1}" },
          { label: "Angolo di inclinazione", latex: "\\alpha = \\arctan(m)" }
        ]
      },
      {
        id: "s03-pendenza-derivata",
        type: "note_box",
        title: "Collegamento con l'Analisi: pendenza e derivata",
        icon: "🔗",
        content: `<p>Per una curva generica descritta da una funzione $y=f(x)$, la pendenza della retta tangente alla curva in un punto è data dalla <strong>derivata prima</strong> della funzione calcolata in quel punto. Per la retta, $f(x)=mx+q$ e la derivata è $f'(x)=m$, costante: questo conferma che la pendenza della retta è la stessa in ogni suo punto.</p>`,
        quote: {
          text: "Il concetto di pendenza, in realtà, è un po' più complesso e generale di come lo abbiamo definito per la retta. Per la retta, la pendenza m è costante: in qualunque punto della retta la calcoliate, il rapporto Δy/Δx sarà sempre lo stesso. Per una funzione qualsiasi, invece, la pendenza è un concetto puntuale, cioè valido solo in un punto specifico della funzione, perché può cambiare spostandosi lungo la curva. Questo concetto più generale è legato alla derivata della funzione, che studierete in dettaglio nel corso di Analisi 1. Per ora, tenete a mente che il modo in cui calcoliamo la pendenza per la retta è un caso particolare e molto semplice, valido perché la retta ha pendenza costante.",
          src: "Nota del Prof."
        }
      },
      {
        id: "s03-fasci",
        type: "section",
        title: "Fasci di rette",
        icon: "✳️",
        content: `<p>Un <strong>fascio</strong> è un insieme infinito di rette che condividono una proprietà. Ne distinguiamo due tipi.</p>`,
        subsections: [
          {
            subtitle: "Fascio proprio",
            content: `<p>Si definisce <strong>fascio proprio</strong> l'insieme di tutte le infinite rette che passano per un punto fisso $P_0(x_0, y_0)$, detto <strong>centro</strong> del fascio.</p>
<p>Per ricavarne l'equazione, consideriamo un punto generico $P(x, y)$ appartenente a una qualsiasi retta del fascio (con $x \\neq x_0$). La pendenza di tale retta è:</p>
<p>$$m = \\frac{y - y_0}{x - x_0}$$</p>
<p>Moltiplicando per $(x - x_0)$ otteniamo l'equazione del fascio proprio:</p>
<p>$$y - y_0 = m(x - x_0)$$</p>
<p>Al variare del parametro $m$ si ottengono tutte le rette del fascio, con <strong>un'unica eccezione</strong>: la retta verticale $x = x_0$, che non ha coefficiente angolare e va aggiunta a parte. Il fascio proprio di centro $P_0$ è dunque:</p>
<p>$$\\{\\, y-y_0 = m(x-x_0) : m \\in \\mathbb{R} \\,\\} \\cup \\{\\, x = x_0 \\,\\}$$</p>

            subtitle: "Fascio improprio",
            content: `<p>Si definisce <strong>fascio improprio</strong> l'insieme di tutte le infinite rette parallele a una direzione fissata, e quindi aventi tutte la stessa pendenza $m_1$.</p>
<p>Poiché la pendenza è comune, l'unico parametro che varia è l'intercetta $q$:</p>
<p>$$y = m_1 x + q$$</p>
<p>Il fascio delle rette verticali $x=k$ è anch'esso improprio, ma le sue rette sono prive di coefficiente angolare.</p>
<p><strong>Esempio.</strong> Il fascio improprio con pendenza $m_1 = 1$ ha equazione $y = x + q$. Al variare di $q$ si ottengono infinite rette parallele alla bisettrice del primo e terzo quadrante.</p>

      {
        id: "s03-problemi-retta",
        type: "section",
        title: "Problemi fondamentali sulla retta",
        icon: "🧩",
        content: `<p>Vediamo come applicare i concetti di fascio e pendenza per risolvere i problemi classici della geometria analitica. <strong>Lo schema è sempre lo stesso: si parte dal fascio proprio di centro il punto assegnato e si impone una condizione che determina $m$.</strong></p>`,
        subsections: [
          {
            subtitle: "Retta per due punti",
            content: `<p>Dati due punti distinti $A(x_1, y_1)$ e $B(x_2, y_2)$:</p>
<ol>
<li>Si scrive il fascio di rette per $A$: $y - y_1 = m(x - x_1)$.</li>
<li>Si impone il passaggio per $B$, da cui $y_2 - y_1 = m(x_2 - x_1)$, cioè $m = \\dfrac{y_2 - y_1}{x_2 - x_1}$ (con $x_1 \\neq x_2$).</li>
<li>Si sostituisce $m$ nell'equazione del fascio.</li>
</ol>
<p>La formula risultante è:</p>
<p>$$\\frac{y - y_1}{y_2 - y_1} = \\frac{x - x_1}{x_2 - x_1}$$</p>
<p>valida quando $x_1 \\neq x_2$ e $y_1 \\neq y_2$, cioè quando nessuno dei due denominatori si annulla. Se $y_1 = y_2$ la retta è l'orizzontale $y = y_1$; se $x_1 = x_2$ è la verticale $x = x_1$.</p>`
          },
          {
            subtitle: "Retta per un punto, parallela a una retta data",
            content: `<p>Due rette non verticali sono <strong>parallele</strong> se e solo se hanno lo <strong>stesso coefficiente angolare</strong>; due rette verticali sono sempre parallele fra loro, pur non avendo coefficiente angolare.</p>
<ol>
<li>Si scrive il fascio per $A(x_1,y_1)$: $y - y_1 = m(x - x_1)$.</li>
<li>Si impone $m = m_1$.</li>
</ol>
<p>$$y - y_1 = m_1(x - x_1)$$</p>`
          },
          {
            subtitle: "Retta per un punto, perpendicolare a una retta data",
            content: `<p>Due rette non verticali sono <strong>perpendicolari</strong> se e solo se il prodotto dei loro coefficienti angolari è $-1$:</p>
<p>$$m_1 \\cdot m_2 = -1 \\quad \\Longleftrightarrow \\quad m_2 = -\\frac{1}{m_1}$$</p>
<p>La pendenza di una retta perpendicolare è l'<strong>antireciproco</strong> della pendenza dell'altra.</p>
<ol>
<li>Si scrive il fascio per $A$: $y - y_1 = m(x - x_1)$.</li>
<li>Si impone $m = -1/m_1$. <strong>Attenzione:</strong> ciò presuppone $m_1 \\neq 0$; se invece $m_1 = 0$ la retta data è orizzontale e la perpendicolare per $A$ è la retta verticale $x = x_1$, priva di coefficiente angolare.</li>
</ol>
<p>$$y - y_1 = -\\frac{1}{m_1}(x - x_1)$$</p>`
          },
          {
            subtitle: "Dimostrazione geometrica della condizione di perpendicolarità",
            content: `<p>Consideriamo due rette $y=m_1x$ e $y=m_2x$ passanti per l'origine e supponiamo che siano perpendicolari. Tracciamo la retta verticale $x=1$, che le interseca nei punti $A(1, m_1)$ e $B(1, m_2)$. Il triangolo $OAB$ è rettangolo in $O$.</p>
<p>Per il <strong>secondo teorema di Euclide</strong> applicato a $OAB$, l'altezza relativa all'ipotenusa (il segmento $OH$, con $H(1,0)$, di lunghezza $1$) è media proporzionale tra le proiezioni dei cateti sull'ipotenusa. Le lunghezze dei segmenti $AH$ e $HB$ sono $|m_1|$ e $|m_2|$. Poiché le pendenze hanno segno opposto, possiamo scrivere $m_1 \\gt 0$ e $m_2 \\lt 0$: le lunghezze sono allora $m_1$ e $-m_2$.</p>
<p>Il teorema di Euclide ci dice che $OH^2 = AH \\cdot HB$, quindi:</p>
<p>$$1^2 = m_1 \\cdot (-m_2) \\quad \\Rightarrow \\quad 1 = -m_1 m_2 \\quad \\Rightarrow \\quad m_1 m_2 = -1$$</p>
<p><strong>Da notare:</strong> questa scelta di segni non toglie generalità. L'identità $m_1 m_2 = -1$ è simmetrica rispetto allo scambio delle due pendenze, e si può verificare che vale in ogni configurazione: il caso $m_1 \\gt 0$, $m_2 \\lt 0$ è solo la configurazione più comoda da disegnare.</p>`
          },
          {
            subtitle: "Distanza di un punto da una retta",
            content: `<p>Dato un punto $P(x_0, y_0)$ e una retta, la distanza è la <strong>lunghezza del segmento di perpendicolare</strong> condotto da $P$ alla retta (cioè la distanza minima).</p>
<p>Se la retta è in forma implicita $ax+by+c=0$:</p>
<p>$$d = \\frac{|ax_0 + by_0 + c|}{\\sqrt{a^2 + b^2}}$$</p>
<p>Se la retta è in forma esplicita $y=mx+q$:</p>
<p>$$d = \\frac{|y_0 - mx_0 - q|}{\\sqrt{1 + m^2}}$$</p>
<p>La procedura per ricavarle è in tre passi, che usano soltanto strumenti già introdotti:</p>
<ol>
<li>Trovare l'equazione della retta perpendicolare a quella data e passante per $P$.</li>
<li>Calcolare il punto di intersezione $H$ (detto <strong>piede della perpendicolare</strong>) tra le due rette.</li>
<li>Calcolare la distanza tra $P$ e $H$ con il teorema di Pitagora.</li>
</ol>
<p>Il docente propone di <strong>provare a ricavare la formula finale seguendo questa procedura</strong>: è un ottimo esercizio per applicare tutti i concetti visti finora. La dimostrazione completa, con tutti i conti, è svolta più avanti nell'esercizio svolto "Dimostrazione della formula della distanza punto-retta": conviene provarci da soli prima di leggerla.</p>`
          }
        ],

          { label: "Distanza punto-retta (implicita)", latex: "d = \\frac{|ax_0 + by_0 + c|}{\\sqrt{a^2 + b^2}}" },
          { label: "Distanza punto-retta (esplicita)", latex: "d = \\frac{|y_0 - mx_0 - q|}{\\sqrt{1 + m^2}}" }

        source: "docente",
        content: `<p>Un rubinetto viene utilizzato per riempire d'acqua una vasca in cui inizialmente ci sono <strong>16 litri</strong>. Il rubinetto eroga $0,1$ l/s per i primi 60 secondi, e successivamente eroga $0,15$ l/s.</p>
<p>Calcolare il volume d'acqua contenuto nella vasca a 3 minuti (180 secondi) dall'apertura del rubinetto e disegnare la funzione $V=f(t)$.</p>`,
        steps: [
          `<strong>Intervallo 1: $0 \\le t \\le 60$ s.</strong> Il volume iniziale è $V_0 = 16$ l e la portata è $0,1$ l/s. L'equazione del volume è una retta: $$V(t) = V_0 + 0{,}1 \\cdot t = 16 + 0{,}1\\,t$$`,
          `Alla fine dei 60 secondi: $$V(60) = 16 + 0{,}1 \\cdot 60 = 16 + 6 = 22 \\ \\text{litri}$$`,
          `<strong>Intervallo 2: $60 \\lt t \\le 180$ s.</strong> Il volume all'inizio dell'intervallo è $V(60) = 22$ l e la nuova portata è $0,15$ l/s. L'equazione è una nuova retta che parte da $t=60$: $$V(t) = V(60) + 0{,}15 \\cdot (t - 60) = 22 + 0{,}15(t-60)$$`,
          `A 3 minuti ($t=180$ s): $$V(180) = 22 + 0{,}15 \\cdot (180 - 60) = 22 + 0{,}15 \\cdot 120 = 22 + 18 = 40 \\ \\text{litri}$$`,
          `<strong>Risposta:</strong> il volume d'acqua dopo 3 minuti è di <strong>40 litri</strong>. La funzione $V(t)$ è una funzione <strong>lineare a tratti</strong>: due segmenti di retta con pendenze diverse ($m_1 = 0{,}1$ e $m_2 = 0{,}15$) raccordati nel punto $(60,\\,22)$.`,
          `<strong>Interpretazione fisica:</strong> la pendenza della retta è proprio la <strong>portata</strong> del rubinetto. Un coefficiente angolare maggiore corrisponde a un riempimento più rapido.`,

      {
        id: "s03-es-retta-perp",
        type: "esercizio_svolto",
        title: "Esercizio svolto — Retta per due punti e retta perpendicolare",
        icon: "✎",
        source: "docente",
        content: `<p>Dati i punti $A(-2, 1)$ e $B(4, 4)$:</p>
<ol>
<li>Determinare l'equazione della retta $r$ passante per $A$ e $B$.</li>
<li>Scrivere l'equazione della retta $s$ perpendicolare a $r$ e passante per il punto $P(0, 2)$.</li>
<li>Trovare il punto di intersezione tra le rette $r$ e $s$.</li>
</ol>`,
        steps: [
          `<strong>Retta $r$ per $A$ e $B$.</strong> Le ascisse sono diverse ($-2 \\neq 4$), quindi $m_r$ esiste: $$m_r = \\frac{y_B - y_A}{x_B - x_A} = \\frac{4 - 1}{4 - (-2)} = \\frac{3}{6} = \\frac{1}{2}$$`,
          `Usiamo il fascio di rette per $A(-2,1)$: $$y - 1 = \\frac{1}{2}\\big(x - (-2)\\big) \\;\\Rightarrow\\; y - 1 = \\frac{1}{2}x + 1 \\;\\Rightarrow\\; y = \\frac{1}{2}x + 2$$ L'equazione di $r$ è $y = \\frac{1}{2}x + 2$.`,
          `<strong>Retta $s$ perpendicolare a $r$ per $P$.</strong> Condizione di perpendicolarità: $$m_s = -\\frac{1}{m_r} = -\\frac{1}{1/2} = -2$$`,
          `Fascio di rette per $P(0,2)$: $$y - 2 = -2(x - 0) \\;\\Rightarrow\\; y = -2x + 2$$ L'equazione di $s$ è $y = -2x + 2$.`,
          `<strong>Punto di intersezione.</strong> Mettiamo a sistema: $$\\begin{cases} y = \\frac{1}{2}x + 2 \\\\ y = -2x + 2 \\end{cases}$$ Uguagliando le espressioni di $y$: $$\\frac{1}{2}x + 2 = -2x + 2 \\;\\Rightarrow\\; \\frac{5}{2}x = 0 \\;\\Rightarrow\\; x = 0$$`,
          `Sostituendo: $y = -2(0) + 2 = 2$. Il punto di intersezione è $(0,2)$, che <strong>coincide con $P$</strong>.`,
          `<strong>Verifica e commento.</strong> Il risultato non è casuale: il punto $P(0,2)$ appartiene già a $r$ (infatti $\\frac{1}{2}\\cdot 0 + 2 = 2$), quindi la perpendicolare condotta da $P$ incontra $r$ proprio in $P$. In questo caso la distanza di $P$ da $r$ è <strong>nulla</strong>.`
        ]
      },
      {
        id: "s03-es-distanza",
        type: "esercizio_svolto",
        title: "Esercizio svolto — Dimostrazione della formula della distanza punto-retta",
        icon: "✎",
        source: "docente",
        content: `<p>Dimostrare che la distanza di un punto $P(x_0, y_0)$ dalla retta $r:\\; y = mx + q$ vale</p>
<p>$$d(P, r) = \\frac{|y_0 - m x_0 - q|}{\\sqrt{1+m^2}},$$</p>
<p>e dedurre da questa la formula in forma implicita</p>
<p>$$d(P, r) = \\frac{|a x_0 + b y_0 + c|}{\\sqrt{a^2+b^2}} \\qquad \\text{per } r:\\; ax+by+c=0.$$</p>`,
        steps: [
          `<strong>Passo 1 — la retta perpendicolare per $P$.</strong> Supponiamo dapprima $m \\neq 0$. La retta $s$ perpendicolare a $r$ e passante per $P$ ha coefficiente angolare $-1/m$, quindi $$s:\\quad y = y_0 - \\frac{1}{m}(x - x_0).$$`,
          `<strong>Passo 2 — il piede della perpendicolare $H = r \\cap s$.</strong> Mettiamo a sistema e uguagliamo le espressioni di $y$: $$mx + q = y_0 - \\frac{1}{m}(x - x_0).$$ Moltiplichiamo entrambi i membri per $m$ (lecito perché $m \\neq 0$): $$m^2 x + mq = m y_0 - x + x_0.$$`,
          `Raccogliamo i termini in $x$: $$x(m^2 + 1) = x_0 + m y_0 - m q \\quad\\Rightarrow\\quad x_H = \\frac{x_0 + m(y_0 - q)}{1+m^2}.$$`,
          `Sostituiamo in $y = mx+q$: $$y_H = m\\,\\frac{x_0 + m y_0 - m q}{1+m^2} + q = \\frac{m x_0 + m^2 y_0 - m^2 q + q + m^2 q}{1+m^2} = \\frac{m x_0 + m^2 y_0 + q}{1+m^2}.$$`,
          `<strong>Passo 3 — la distanza $\\overline{PH}$.</strong> Poniamo per comodità $k = y_0 - m x_0 - q$. Allora: $$x_H - x_0 = \\frac{x_0 + m y_0 - m q - x_0(1+m^2)}{1+m^2} = \\frac{m\\,(y_0 - m x_0 - q)}{1+m^2} = \\frac{m\\,k}{1+m^2}$$`,
          `$$y_H - y_0 = \\frac{m x_0 + m^2 y_0 + q - y_0(1+m^2)}{1+m^2} = \\frac{m x_0 + q - y_0}{1+m^2} = \\frac{-k}{1+m^2}$$`,
          `Applichiamo il teorema di Pitagora (formula della distanza tra due punti): $$d^2 = (x_H - x_0)^2 + (y_H - y_0)^2 = \\frac{m^2 k^2}{(1+m^2)^2} + \\frac{k^2}{(1+m^2)^2} = \\frac{k^2 (m^2 + 1)}{(1+m^2)^2} = \\frac{k^2}{1+m^2}.$$`,
          `Estraendo la radice quadrata (e ricordando che $\\sqrt{k^2} = |k|$, perché la distanza è non negativa): $$d = \\frac{|k|}{\\sqrt{1+m^2}} = \\frac{|y_0 - m x_0 - q|}{\\sqrt{1+m^2}}$$`,
          `<strong>Passo 4 — il caso $m = 0$.</strong> Se $m=0$ la retta è orizzontale, $r:\\;y=q$, e la distanza è semplicemente $|y_0 - q|$. La formula trovata dà $\\frac{|y_0 - 0 - q|}{\\sqrt{1+0}} = |y_0 - q|$: coincide, quindi vale anche in questo caso.`,
          `<strong>Passo 5 — dalla forma esplicita all'implicita.</strong> Sia $r:\\;ax+by+c=0$ con $b \\neq 0$. Sappiamo che $m = -a/b$ e $q = -c/b$. Sostituendo: $$k = y_0 - m x_0 - q = y_0 + \\frac{a}{b}x_0 + \\frac{c}{b} = \\frac{a x_0 + b y_0 + c}{b},$$ $$\\sqrt{1+m^2} = \\sqrt{1 + \\frac{a^2}{b^2}} = \\sqrt{\\frac{a^2+b^2}{b^2}} = \\frac{\\sqrt{a^2+b^2}}{|b|}.$$`,
          `Quindi $$d = \\frac{|k|}{\\sqrt{1+m^2}} = \\frac{\\dfrac{|a x_0 + b y_0 + c|}{|b|}}{\\dfrac{\\sqrt{a^2+b^2}}{|b|}} = \\frac{|a x_0 + b y_0 + c|}{\\sqrt{a^2+b^2}}.$$`,
          `Infine, se $b=0$ la retta è verticale, $x = -c/a$, e la distanza è $\\left|x_0 + \\frac{c}{a}\\right| = \\frac{|a x_0 + c|}{|a|} = \\frac{|a x_0 + b y_0 + c|}{\\sqrt{a^2+b^2}}$: la formula implicita vale dunque <strong>sempre</strong>, anche per le rette verticali.`,
          `<strong>Verifica numerica.</strong> Prendiamo $P(0,0)$ e la retta $r:\\;y = x + 2$, cioè $x - y + 2 = 0$. Con la formula esplicita ($m=1$, $q=2$): $$d = \\frac{|0 - 1\\cdot 0 - 2|}{\\sqrt{1+1}} = \\frac{2}{\\sqrt{2}} = \\sqrt{2} \\approx 1{,}41.$$ Con la formula implicita ($a=1$, $b=-1$, $c=2$): $$d = \\frac{|1\\cdot 0 + (-1)\\cdot 0 + 2|}{\\sqrt{1^2 + (-1)^2}} = \\frac{2}{\\sqrt{2}} = \\sqrt{2}.$$ I due risultati coincidono, come deve essere.`
        ]
      },
      {
        id: "s03-notazione-punto",
        type: "note_box",
        title: "Notazione — il punto sopra una variabile",
        icon: "🔤",
        content: `<p>Nel prossimo esercizio compare la scrittura $\\dot{V}$. Il <strong>punto sopra una variabile</strong> è la notazione di Newton per indicare la <strong>derivata rispetto al tempo</strong> di quella grandezza. Quindi $\\dot{V}$ è la variazione di volume per unità di tempo, cioè la <strong>portata</strong> (in l/s).</p>
<p>È una notazione usatissima in Fisica 1 e in tutti i corsi di ingegneria: $\\dot{x}$ è la velocità, $\\ddot{x}$ l'accelerazione. Per ora basta leggerla come "quanto cresce quella grandezza ogni secondo".</p>`

      {
        id: "s03-es-vasca-bis",
        type: "esercizio_svolto",
        title: "Esercizio svolto — Riempimento di una vasca (ripresa con notazione della portata)",
        icon: "✎",
        source: "docente",
        content: `<p><strong>Nota di lettura:</strong> riprendiamo volutamente l'esempio già visto sopra ("Volume d'acqua in una vasca") per rileggerlo con la notazione della portata $\\dot{V}$ e per organizzare il calcolo per fasi, come si fa in cinematica. I numeri e il risultato sono gli stessi: cambia il linguaggio, non il problema.</p>
<p>Un rubinetto riempie d'acqua una vasca in cui inizialmente ci sono 16 litri. Il rubinetto eroga $0,1$ l/s per i primi 60 secondi, successivamente la portata aumenta a $0,15$ l/s.</p>
<ol>
<li>Calcolare il volume d'acqua contenuto nella vasca a 3 minuti (180 secondi) dall'apertura del rubinetto.</li>
<li>Disegnare la funzione $V=f(t)$ nel piano cartesiano.</li>
</ol>`,
        steps: [
          `<strong>Fase 1: da 0 a 60 secondi.</strong> Il volume iniziale è $V_0 = 16$ litri e la portata è $\\dot{V}_1 = 0{,}1$ l/s. Il volume aggiunto in 60 secondi è $$\\Delta V_1 = \\dot{V}_1 \\cdot \\Delta t_1 = 0{,}1 \\ \\text{l/s} \\cdot 60 \\ \\text{s} = 6 \\ \\text{litri}.$$`,
          `Al tempo $t_1 = 60$ s il volume totale è $V_1 = V_0 + \\Delta V_1 = 16 + 6 = 22$ litri. L'equazione in questa fase è $V(t) = 16 + 0{,}1\\,t$ per $t \\in [0, 60]$.`,
          `<strong>Fase 2: da 60 a 180 secondi.</strong> L'intervallo è $\\Delta t_2 = 180 - 60 = 120$ s e la nuova portata è $\\dot{V}_2 = 0{,}15$ l/s. Il volume aggiunto è $$\\Delta V_2 = \\dot{V}_2 \\cdot \\Delta t_2 = 0{,}15 \\ \\text{l/s} \\cdot 120 \\ \\text{s} = 18 \\ \\text{litri}.$$`,
          `Al tempo finale $t_2 = 180$ s il volume totale è $V_2 = V_1 + \\Delta V_2 = 22 + 18 = 40$ litri. L'equazione in questa fase è $V(t) = 22 + 0{,}15(t-60)$ per $t \\in (60, 180]$.`,
          `<strong>Risposta al primo quesito:</strong> dopo 3 minuti nella vasca ci sono <strong>40 litri</strong> d'acqua.`,
          `<strong>Grafico della funzione $V(t)$:</strong> è una retta a tratti (<em>piecewise linear</em>). Sull'asse $y$ il volume $V$ (in litri), sull'asse $x$ il tempo $t$ (in secondi). La pendenza cambia a $t=60$ s proprio perché aumenta la portata.`,

        content: `<p>Introduciamo ora una famiglia di curve note come <strong>coniche</strong>: prima la loro definizione geometrica, poi la loro forma algebrica generale.</p>`,
        quote: {
          text: "Prima che vi spaventiate e scappiate a gambe levate, vi dico che quello che vedete qui è un concetto molto teorico, il cosiddetto cono matematico. Serve ai matematici per definire cosa sono le coniche. Molto probabilmente lo vedrete oggi e poi non lo vedrete mai più. A me serve semplicemente per introdurre l'argomento, quindi non preoccupatevi, non è così cattivo come sembra.",

          {
            subtitle: "Definizione di cono matematico",
            content: `<p>Il <strong>cono matematico</strong> (o cono a doppia falda) è una superficie generata così:</p>
<ol>
<li>Si prende una circonferenza in un piano, detta <strong>circonferenza di base</strong>.</li>
<li>Si prende un punto $V$, detto <strong>vertice</strong>, esterno al piano della circonferenza.</li>
<li>Si definisce l'<strong>asse</strong> del cono come la retta passante per $V$ e per il centro della circonferenza di base; si suppone inoltre che tale retta sia perpendicolare al piano della circonferenza di base (cono circolare retto).</li>
<li>L'insieme di tutte le rette che passano per $V$ e per un punto della circonferenza di base è detto insieme delle <strong>generatrici</strong>.</li>
</ol>
<p>La superficie formata da tutte le generatrici è il cono matematico. È una superficie <strong>infinita</strong> che si estende in due direzioni opposte rispetto al vertice, formando due "falde" speculari, come una <strong>clessidra</strong>.</p>

<p>La figura mostra la sezione del cono con un piano che contiene l'asse: le due falde hanno la stessa apertura e si toccano solo nel vertice $V$. Le due rette disegnate sono generatrici opposte.</p>`

          {
            subtitle: "Le quattro sezioni coniche",
            content: `<p>Una <strong>sezione conica</strong> (o semplicemente <strong>conica</strong>) è la curva che si ottiene intersecando un cono matematico con un piano. A seconda di come il piano interseca il cono si ottengono figure diverse:</p>
<ul>
<li><strong>Circonferenza</strong>: se il piano è parallelo al piano della circonferenza di base e non passa per il vertice. Se il piano interseca il cono nel vertice si ottiene un punto (caso degenere).</li>
<li><strong>Ellisse</strong>: se il piano è inclinato rispetto al piano di base, ma con inclinazione minore di quella delle generatrici. L'intersezione è una curva chiusa. La circonferenza è un caso particolare di ellisse.</li>
<li><strong>Parabola</strong>: se il piano è inclinato in modo da essere esattamente <strong>parallelo a una sola generatrice</strong> e non passa per il vertice (se passasse per il vertice si otterrebbe il caso degenere di una retta, la generatrice stessa). La curva è aperta.</li>
<li><strong>Iperbole</strong>: se il piano è inclinato più delle generatrici (ad esempio parallelo all'asse del cono). In questo caso il piano interseca <strong>entrambe le falde</strong>, generando due rami di curva aperti e separati.</li>
</ul>
<p>Si chiamano "coniche" proprio perché si ricavano geometricamente dall'intersezione di un piano con un cono matematico.</p>`
          },
          {
            subtitle: "Forma algebrica generale e discriminante",
            content: `<p>Dal punto di vista algebrico, tutte le coniche sono rappresentate da un'unica equazione generale di secondo grado in due variabili:</p>
<p>$$A x^2 + B xy + C y^2 + D x + E y + F = 0$$</p>
<p>Per capire di quale conica si tratta si analizza il <strong>discriminante</strong>, costruito con i coefficienti dei termini di secondo grado:</p>
<p>$$\\Delta = B^2 - 4AC$$</p>
<ul>
<li>Se $\\Delta \\gt 0$: <strong>iperbole</strong>.</li>
<li>Se $\\Delta \\lt 0$: <strong>ellisse</strong> (che può essere una circonferenza in un caso particolare). La classificazione vale per le coniche non degeneri: altrimenti con $\\Delta \\lt 0$ si possono ottenere un solo punto o l'insieme vuoto.</li>
<li>Se $\\Delta = 0$: <strong>parabola</strong>.</li>
</ul>`
          }
        ],
        formulas: [
          { label: "Equazione generale delle coniche", latex: "A x^2 + B xy + C y^2 + D x + E y + F = 0" },
          { label: "Discriminante di classificazione", latex: "\\Delta = B^2 - 4AC" }
        ]
      },
      {
        id: "s03-circonferenza",
        type: "section",
        title: "La circonferenza",
        icon: "⭕",
        content: `<p>La circonferenza è un po' bistrattata negli studi di funzione, ma in realtà è una figura fondamentale che tornerà molto spesso, specialmente in tutti quei problemi di fisica dove è coinvolta la trigonometria (seni, coseni), come le <strong>oscillazioni, le onde e le vibrazioni</strong>.</p>
<p><strong>Definizione (luogo geometrico).</strong> La circonferenza è il luogo dei punti del piano cartesiano che hanno tutti la stessa distanza da un punto fisso detto <strong>centro</strong>. Tale distanza è chiamata <strong>raggio</strong>.</p>`,
        subsections: [
          {
            subtitle: "Equazione dati centro e raggio (forma canonica)",
            content: `<p>Sia $C(x_0, y_0)$ il centro e $R$ il raggio. Un punto generico $P(x, y)$ appartiene alla circonferenza se e solo se la sua distanza da $C$ è uguale a $R$. Usando la formula della distanza tra due punti (che deriva dal teorema di Pitagora):</p>
<p>$$d(P, C) = \\sqrt{(x - x_0)^2 + (y - y_0)^2} = R$$</p>
<p>Elevando al quadrato entrambi i membri:</p>
<p>$$(x - x_0)^2 + (y - y_0)^2 = R^2$$</p>
<p>Questa forma è molto comoda perché <strong>legge immediatamente</strong> le coordinate del centro $(x_0, y_0)$ e il valore del raggio $R$.</p>`
          },
          {
            subtitle: "Equazione in forma implicita",
            content: `<p>Sviluppando i quadrati:</p>
<p>$$(x^2 - 2x_0 x + x_0^2) + (y^2 - 2y_0 y + y_0^2) = R^2$$</p>
<p>$$x^2 + y^2 - 2x_0 x - 2y_0 y + (x_0^2 + y_0^2 - R^2) = 0$$</p>
<p>Ponendo $a = -2x_0$, $b = -2y_0$, $c = x_0^2 + y_0^2 - R^2$ si ottiene l'equazione generale:</p>
<p>$$x^2 + y^2 + ax + by + c = 0$$</p>
<p>Questo è un <strong>caso particolare dell'equazione generale delle coniche</strong>, dove: i coefficienti di $x^2$ e $y^2$ sono uguali (qui a 1) e <strong>manca il termine rettangolare $xy$</strong> (cioè $B=0$).</p>`
          },
          {
            subtitle: "Dalla forma implicita a centro e raggio",
            content: `<p>Invertendo le formule precedenti:</p>
<p>$$x_0 = -\\frac{a}{2}, \\qquad y_0 = -\\frac{b}{2}$$</p>
<p>$$R = \\sqrt{x_0^2 + y_0^2 - c} = \\sqrt{\\left(-\\frac{a}{2}\\right)^2 + \\left(-\\frac{b}{2}\\right)^2 - c}$$</p>`
          },
          {
            subtitle: "Condizione di esistenza",
            content: `<p>Affinché l'equazione rappresenti una circonferenza reale, eventualmente degenere, il raggio deve essere un numero reale non negativo (per una circonferenza non degenere occorre $R \\gt 0$). L'argomento della radice deve quindi essere maggiore o uguale a zero:</p>
<p>$$x_0^2 + y_0^2 - c \\ge 0$$</p>
<ul>
<li>Se l'argomento è <strong>uguale a zero</strong>, la circonferenza degenera in un <strong>punto</strong> (il centro).</li>
<li>Se è <strong>negativo</strong>, l'equazione non ha soluzioni reali e non rappresenta alcuna figura nel piano cartesiano.</li>
</ul>`
          }
        ],
        formulas: [
          { label: "Forma canonica", latex: "(x - x_0)^2 + (y - y_0)^2 = R^2" },
          { label: "Forma implicita", latex: "x^2 + y^2 + ax + by + c = 0" },
          { label: "Centro", latex: "C\\left(-\\frac{a}{2},\\ -\\frac{b}{2}\\right)" },
          { label: "Raggio", latex: "R = \\sqrt{x_0^2 + y_0^2 - c}" }
        ]
      },
      {
        id: "s03-retta-circonferenza",
        type: "section",
        title: "Intersezione tra retta e circonferenza",
        icon: "✂️",
        content: `<p>Per trovare i punti di intersezione si risolve il sistema composto dalle due equazioni:</p>
<p>$$\\begin{cases} x^2 + y^2 + ax + by + c = 0 & \\text{(circonferenza)} \\\\ y = mx + q & \\text{(retta)} \\end{cases}$$</p>
<p>Sostituendo l'espressione di $y$ nell'equazione della circonferenza si ottiene un'equazione di secondo grado in $x$. Se invece la retta è <strong>verticale</strong>, di equazione $x=k$, si sostituisce $x=k$ e si ottiene un'equazione di secondo grado in $y$.</p>
<p>Il numero di soluzioni di questa equazione determina la posizione reciproca. Analizzando il discriminante $\\Delta$ dell'equazione risolvente:</p>
<ul>
<li>$\\Delta \\gt 0$: due soluzioni reali e distinte. La retta è <strong>secante</strong> e interseca la circonferenza in due punti.</li>
<li>$\\Delta = 0$: due soluzioni reali e coincidenti. La retta è <strong>tangente</strong> e tocca la circonferenza in un solo punto.</li>
<li>$\\Delta \\lt 0$: nessuna soluzione reale. La retta è <strong>esterna</strong> e non ha punti in comune con la circonferenza.</li>
</ul>`,

<p>La figura mostra due dei tre casi: la secante taglia la circonferenza in due punti, la tangente la tocca nel solo punto $T$. Il terzo caso — una retta esterna, per esempio $y = x + 3$ — non incontra la circonferenza e non ha punti da mostrare.</p>`

      {
        id: "s03-es-due-circ",
        type: "esercizio_svolto",
        title: "Esercizio svolto — Intersezione tra due circonferenze",
        icon: "✎",
        source: "docente",
        content: `<p>Determinare i punti di intersezione tra le due circonferenze di equazione:</p>
<p>$$\\gamma_1: \\quad x^2 + y^2 - 2x = 0$$</p>
<p>$$\\gamma_2: \\quad x^2 + y^2 - 4x - 2y + 4 = 0$$</p>`,
        steps: [
          `<strong>Impostare il sistema.</strong> Per trovare i punti comuni mettiamo a sistema le due equazioni: $$\\begin{cases} x^2 + y^2 - 2x = 0 \\\\ x^2 + y^2 - 4x - 2y + 4 = 0 \\end{cases}$$`,
          `<strong>Sottrarre le equazioni per linearizzare il problema.</strong> È un sistema di quarto grado, ma possiamo semplificarlo: sottraendo la seconda equazione dalla prima, i termini $x^2$ e $y^2$ si eliminano (metodo di riduzione): $$(x^2 + y^2 - 2x) - (x^2 + y^2 - 4x - 2y + 4) = 0$$ $$-2x + 4x + 2y - 4 = 0 \\;\\Rightarrow\\; 2x + 2y - 4 = 0 \\;\\Rightarrow\\; x + y - 2 = 0$$`,
          `Questa è l'equazione di una retta, chiamata <strong>asse radicale</strong>, che passa per gli eventuali punti di intersezione delle due circonferenze.`,
          `<strong>Risolvere il sistema ridotto.</strong> Sostituiamo il sistema di partenza con uno più semplice, composto da una delle circonferenze e dall'asse radicale: $$\\begin{cases} x^2 + y^2 - 2x = 0 \\\\ y = 2 - x \\end{cases}$$`,
          `<strong>Sostituire e risolvere.</strong> $$x^2 + (2 - x)^2 - 2x = 0 \\;\\Rightarrow\\; x^2 + 4 - 4x + x^2 - 2x = 0 \\;\\Rightarrow\\; 2x^2 - 6x + 4 = 0 \\;\\Rightarrow\\; x^2 - 3x + 2 = 0$$`,
          `Scomponendo il trinomio: $(x-1)(x-2) = 0$, quindi $x_1 = 1$ e $x_2 = 2$.`,
          `<strong>Trovare le ordinate.</strong> Usiamo $y = 2 - x$: per $x_1 = 1 \\Rightarrow y_1 = 1$, cioè $P_1(1,1)$; per $x_2 = 2 \\Rightarrow y_2 = 0$, cioè $P_2(2,0)$.`,
          `<strong>Conclusione:</strong> le due circonferenze si intersecano nei punti $(1,1)$ e $(2,0)$.`
        ]
      },
      {
        id: "s03-soluzione-grafica",
        type: "section",
        title: "Soluzione geometrica dello stesso sistema",
        icon: "🖊️",
        content: `<p>La soluzione algebrica del sistema di due circonferenze è fattibile, ma richiede alcuni passaggi. Vediamo ora come risolverlo <strong>geometricamente</strong>, disegnando le due circonferenze: è qui che il "ponte" tra geometria e algebra mostra tutta la sua utilità.</p>
<p>Per disegnare una circonferenza servono centro e raggio. Data $x^2 + y^2 + ax + by + c = 0$, il centro ha coordinate $C(x_0, y_0) = (-a/2,\\, -b/2)$ e il raggio è $R = \\sqrt{x_0^2 + y_0^2 - c}$, purché sia $x_0^2 + y_0^2 - c \\gt 0$ (se il radicando è nullo l'equazione rappresenta il solo punto $C$, se è negativo nessun punto reale).</p>`,
        subsections: [
          {
            subtitle: "Calcolo degli elementi delle due circonferenze",
            content: `<p><strong>Prima circonferenza:</strong> $x^2 + y^2 - 2x = 0$, con $a = -2$, $b = 0$, $c = 0$.</p>
<p>$$x_{0,1} = -\\frac{a}{2} = -\\frac{-2}{2} = 1, \\qquad y_{0,1} = -\\frac{b}{2} = -\\frac{0}{2} = 0 \\quad \\Rightarrow \\quad C_1 = (1, 0)$$</p>
<p>$$R_1 = \\sqrt{x_{0,1}^2 + y_{0,1}^2 - c} = \\sqrt{1^2 + 0^2 - 0} = \\sqrt{1} = 1$$</p>
<p><strong>Seconda circonferenza:</strong> $x^2 + y^2 - 4x - 2y + 4 = 0$, con $a = -4$, $b = -2$, $c = 4$.</p>
<p>$$x_{0,2} = -\\frac{-4}{2} = 2, \\qquad y_{0,2} = -\\frac{-2}{2} = 1 \\quad \\Rightarrow \\quad C_2 = (2, 1)$$</p>
<p>$$R_2 = \\sqrt{2^2 + 1^2 - 4} = \\sqrt{4 + 1 - 4} = \\sqrt{1} = 1$$</p>
<p>Entrambe le circonferenze hanno raggio $1$.</p>`
          },

<p>La prima circonferenza ha centro in $(1,0)$ e raggio $1$; la seconda ha centro in $(2,1)$ e raggio $1$. Dal grafico vediamo immediatamente dove si toccano:</p>
<ul>
<li>nel punto $A = (2, 0)$;</li>
<li>nel punto $B = (1, 1)$.</li>
</ul>
<p>Sono <strong>le stesse soluzioni</strong> trovate per via algebrica.</p>`

        extra_content: `<p><strong>Osservazione.</strong> Questo esempio mostra come la soluzione geometrica possa essere molto più rapida e intuitiva, specialmente quando i dati (centri e raggi) sono valori interi e facili da disegnare. Può anche servire come <strong>ottima verifica</strong> di una soluzione algebrica, che potrebbe essere soggetta a errori di calcolo dopo due pagine di passaggi.</p>`

        type: "section",
        title: "La parabola",
        icon: "🏀",
        content: `<p><strong>Definizione (luogo geometrico).</strong> Dati una retta fissa $d$ detta <strong>direttrice</strong> e un punto fisso $F$ non appartenente a $d$ detto <strong>fuoco</strong>, la parabola è il luogo geometrico dei punti $P$ del piano equidistanti da $F$ e da $d$:</p>
<p>$$d(P, F) = d(P, d)$$</p>
<p>dove la distanza da un punto a una retta si intende la lunghezza del segmento di perpendicolare.</p>

<p>Nella figura, il punto $P$ sulla curva è equidistante dal fuoco $F$ e dalla direttrice $d$: i due segmenti tratteggiati hanno la stessa lunghezza.</p>`,
        subsections: [
          {
            subtitle: "Equazione della parabola con asse verticale",
            content: `<p>Ci concentriamo sul caso particolare di parabola con <strong>asse di simmetria parallelo all'asse delle $y$</strong>. L'asse della parabola è la retta ortogonale alla direttrice che passa per il fuoco.</p>
<p>L'equazione di una tale parabola è, con $a \\neq 0$:</p>
<p>$$y = ax^2 + bx + c$$</p>
<p>Questa equazione risulterà familiare. Se poniamo $y=0$ otteniamo $ax^2 + bx + c = 0$, cioè un'equazione di secondo grado: <strong>risolvere quell'equazione significa trovare le intersezioni della parabola con l'asse delle ascisse</strong>.</p>`
          },
          {
            subtitle: "Concavità",
            content: `<p>Il segno del coefficiente $a$ determina l'orientamento della parabola:</p>
<ul>
<li>Se $a \\gt 0$, la parabola ha la <strong>concavità rivolta verso l'alto</strong>.</li>
<li>Se $a \\lt 0$, la parabola ha la <strong>concavità rivolta verso il basso</strong>.</li>
</ul>

          {
            subtitle: "Intersezioni con l'asse x e discriminante",
            content: `<p>Le soluzioni di $ax^2 + bx + c = 0$ sono date dalla formula risolutiva e dipendono dal <strong>discriminante</strong> $\\Delta = b^2 - 4ac$:</p>
<ul>
<li>$\\Delta \\gt 0$: due soluzioni reali e distinte. La parabola interseca l'asse $x$ in <strong>due punti</strong>.</li>
<li>$\\Delta = 0$: due soluzioni reali e coincidenti. La parabola è <strong>tangente</strong> all'asse $x$ in un punto (il vertice).</li>

        steps: [
          `<strong>Scomposizione del moto.</strong> Il moto può essere scomposto in due moti indipendenti: lungo l'asse $x$ (orizzontale) un <strong>moto rettilineo uniforme</strong>, poiché non ci sono forze orizzontali (trascurando l'attrito), quindi velocità orizzontale costante; lungo l'asse $y$ (verticale) un <strong>moto uniformemente accelerato</strong>, a causa della forza di gravità che produce un'accelerazione costante $g$ verso il basso.`,
          `<strong>Equazioni del moto.</strong> Le componenti della velocità iniziale sono $v_{0x} = v_0 \\cos \\alpha$ e $v_{0y} = v_0 \\sin \\alpha$. Le leggi orarie sono: $$x(t) = (v_0 \\cos \\alpha)\\, t$$ $$y(t) = (v_0 \\sin \\alpha)\\, t - \\frac{1}{2} g t^2$$ dove $g \\approx 9{,}81 \\ \\text{m/s}^2$ è l'accelerazione di gravità.`,
          `<strong>Equazione della traiettoria.</strong> Per trovarla nel piano $(x,y)$ dobbiamo <strong>eliminare il tempo</strong>. Dalla prima equazione: $$t = \\frac{x}{v_0 \\cos \\alpha}$$`,
          `Sostituendo nella seconda: $$y(x) = (v_0 \\sin \\alpha)\\left( \\frac{x}{v_0 \\cos \\alpha} \\right) - \\frac{1}{2} g \\left( \\frac{x}{v_0 \\cos \\alpha} \\right)^2 = (\\tan \\alpha)\\, x - \\left( \\frac{g}{2 v_0^2 \\cos^2 \\alpha} \\right) x^2$$`,
          `Questa è l'equazione di una <strong>parabola</strong> della forma $y = bx + ax^2$, con $c=0$ (passa per l'origine), $b = \\tan \\alpha$ e $a = -\\dfrac{g}{2 v_0^2 \\cos^2 \\alpha}$. Poiché $a \\lt 0$, la parabola ha concavità verso il basso, come ci aspettiamo.`,
          `<strong>Calcolo della gittata $x_{max}$.</strong> È il punto (diverso dall'origine) in cui il proiettile tocca terra, cioè dove $y(x) = 0$: $$x \\left( \\tan \\alpha - \\frac{g}{2 v_0^2 \\cos^2 \\alpha} x \\right) = 0$$`,
          `Le soluzioni sono $x=0$ (punto di partenza) e $$x_{max} = \\frac{2 v_0^2 \\cos^2 \\alpha \\tan \\alpha}{g} = \\frac{2 v_0^2 \\sin \\alpha \\cos \\alpha}{g} = \\frac{v_0^2 \\sin(2\\alpha)}{g}$$ dove si è usata la formula di duplicazione del seno $2\\sin\\alpha\\cos\\alpha = \\sin(2\\alpha)$.`,
          `<strong>Calcolo dell'altezza massima $H_{max}$.</strong> Si raggiunge nel vertice della parabola, di ascissa $x_V = -b/(2a)$: $$x_V = - \\frac{\\tan \\alpha}{2 \\left( -\\frac{g}{2 v_0^2 \\cos^2 \\alpha} \\right)} = \\frac{v_0^2 \\cos^2 \\alpha \\tan \\alpha}{g} = \\frac{v_0^2 \\sin \\alpha \\cos \\alpha}{g} = \\frac{x_{max}}{2}$$ Come previsto dalla simmetria, l'altezza massima si raggiunge <strong>a metà della gittata</strong>.`,
          `Sostituendo $x_V$ nell'equazione della traiettoria: $$H_{max} = y(x_V) = (\\tan \\alpha)\\frac{v_0^2 \\sin \\alpha \\cos \\alpha}{g} - \\frac{g}{2 v_0^2 \\cos^2 \\alpha}\\left( \\frac{v_0^2 \\sin \\alpha \\cos \\alpha}{g} \\right)^2$$ $$= \\frac{v_0^2 \\sin^2 \\alpha}{g} - \\frac{v_0^2 \\sin^2 \\alpha}{2g} = \\frac{v_0^2 \\sin^2 \\alpha}{2g}$$`
        ]

        title: "Teoria 1",
        kind: "teoria",
        source: "integrazione",
        content: `<p>Spiegare perché nella formula $m=\\dfrac{y_2-y_1}{x_2-x_1}$ si deve richiedere $x_1 \\neq x_2$ e descrivere che cosa accade geometricamente quando $x_1=x_2$.</p>`,
        solution: `<p>Se $P_1(x_1,y_1)$ e $P_2(x_2,y_2)$ sono punti distinti con $x_1=x_2$, il denominatore $x_2-x_1$ è nullo e il rapporto $\\Delta y/\\Delta x$ non è un numero reale: la formula non ha significato.</p>
<p>Geometricamente due punti distinti con la stessa ascissa individuano la <strong>retta verticale</strong> $x=x_1$, che in forma implicita $ax+by+c=0$ corrisponde al caso $b=0$. Tale retta non è il grafico di una funzione $y=f(x)$ (all'unica ascissa $x=x_1$ corrispondono infiniti valori di $y$) e non ammette forma esplicita $y=mx+q$: per essa il coefficiente angolare <strong>non è definito</strong>.</p>
<p>Coerentemente, l'angolo che forma con il semiasse positivo delle $x$ è $\\alpha=90^\\circ$ e $\\tan(90^\\circ)$ non esiste. In sintesi: $x_1 \\neq x_2$ equivale a dire che la retta non è verticale, cioè che $m$ è definito.</p>`

        kind: "teoria",
        source: "integrazione",
        content: `<p>Dare la definizione di fascio proprio di rette di centro $P_0(x_0,y_0)$ e ricavarne l'equazione. Tale equazione descrive davvero <em>tutte</em> le rette del fascio? Giustificare la risposta.</p>`,
        solution: `<p>Il fascio proprio di centro $P_0(x_0,y_0)$ è l'insieme di tutte le rette del piano che passano per il punto fisso $P_0$.</p>
<p>Per ricavarne l'equazione si prende un punto generico $P(x,y)$, con $x \\neq x_0$, appartenente a una retta del fascio: la pendenza di tale retta è $m = \\dfrac{y-y_0}{x-x_0}$ e, moltiplicando per $(x-x_0)$, si ottiene $y-y_0 = m(x-x_0)$.</p>
<p>Al variare di $m \\in \\mathbb{R}$ questa equazione descrive tutte le rette per $P_0$ <strong>tranne una</strong>: la retta verticale $x = x_0$. Infatti la retta verticale non ha coefficiente angolare (il rapporto $\\Delta y/\\Delta x$ avrebbe denominatore nullo) e non si ottiene per alcun valore finito di $m$; non a caso il passaggio iniziale richiedeva $x \\neq x_0$.</p>
<p>Il fascio proprio completo è quindi $\\{\\, y-y_0 = m(x-x_0) : m \\in \\mathbb{R} \\,\\} \\cup \\{\\, x = x_0 \\,\\}$.</p>`

        solution: `<p>La circonferenza di centro $C(x_0,y_0)$ e raggio $R \\gt 0$ è il luogo dei punti $P(x,y)$ del piano tali che $d(P,C)=R$.</p>
<p>Usando la formula della distanza (conseguenza del teorema di Pitagora) si ha $\\sqrt{(x-x_0)^2+(y-y_0)^2}=R$.</p>

        solution: `<p>Dati una retta $d$ (direttrice) e un punto $F \\notin d$ (fuoco), la parabola è l'insieme dei punti $P$ del piano tali che $d(P,F) = d(P,d)$, dove $d(P,d)$ è la lunghezza del segmento di perpendicolare condotto da $P$ a $d$.</p>

        source: "integrazione",
        content: `<p>Dati i punti $A(1,2)$ e $B(3,-2)$, determinare l'equazione della retta $AB$ in forma esplicita e in forma implicita, e calcolare l'angolo $\\alpha$ che essa forma con l'asse delle ascisse.</p>`,

<p>Usando il fascio proprio di centro $A$: $y - 2 = -2(x-1)$, cioè $y = -2x + 2 + 2$, quindi la forma esplicita è <strong>$y = -2x + 4$</strong> (dunque $m=-2$, $q=4$). Verifica: per $x=3$ si ottiene $y = -6+4 = -2$, cioè il punto $B$.</p>

        back: "Una <strong>conica</strong> è la curva ottenuta intersecando un cono matematico (a doppia falda, come una clessidra) con un piano. <strong>Circonferenza</strong>: piano parallelo alla base. <strong>Ellisse</strong>: piano inclinato meno delle generatrici (curva chiusa). <strong>Parabola</strong>: piano parallelo a una sola generatrice, non passante per il vertice (curva aperta). <strong>Iperbole</strong>: piano inclinato più delle generatrici, che taglia entrambe le falde (due rami separati)."
      },
      {
        type: "formula",
        front: "Come si classifica una conica a partire dall'equazione generale?",
        back: "L'equazione generale è $Ax^2 + Bxy + Cy^2 + Dx + Ey + F = 0$ e si calcola il discriminante $\\Delta = B^2 - 4AC$ (solo coefficienti di secondo grado). Se $\\Delta \\gt 0$: <strong>iperbole</strong>. Se $\\Delta \\lt 0$: <strong>ellisse</strong> (circonferenza in un caso particolare). Se $\\Delta = 0$: <strong>parabola</strong>. La classificazione vale per le coniche non degeneri: con $\\Delta \\lt 0$ si possono ottenere anche un solo punto o l'insieme vuoto."
      },
      {

        back: "La circonferenza è il luogo dei punti equidistanti da un punto fisso $C(x_0,y_0)$ (il centro); la distanza comune è il raggio $R$. Quindi $P(x,y)$ vi appartiene se e solo se $\\sqrt{(x-x_0)^2+(y-y_0)^2} = R$. Poiché entrambi i membri sono non negativi, elevare al quadrato è un'<strong>equivalenza</strong> e si ottiene la forma canonica $(x-x_0)^2+(y-y_0)^2 = R^2$. Sviluppando i quadrati si arriva alla forma implicita $x^2+y^2+ax+by+c=0$ con $a=-2x_0$, $b=-2y_0$, $c=x_0^2+y_0^2-R^2$."

      {

      },
      {
        type: "domanda",

        back: "Si mettono a sistema le due equazioni e si <strong>sottraggono membro a membro</strong>: i termini $x^2$ e $y^2$ si eliminano e resta un'equazione di primo grado, cioè una <strong>retta</strong> detta <strong>asse radicale</strong>, che passa per gli eventuali punti di intersezione. Si sostituisce poi il sistema di partenza (di quarto grado) con quello formato da una circonferenza e dall'asse radicale, molto più semplice. Nell'esempio visto a lezione si ottiene $y=2-x$ e i punti $(1,1)$ e $(2,0)$."
      },
      {
        type: "definizione",
        front: "Definisci la parabola come luogo geometrico. Perché il fuoco non deve stare sulla direttrice?",
        back: "Data una retta $d$ (<strong>direttrice</strong>) e un punto $F \\notin d$ (<strong>fuoco</strong>), la parabola è il luogo dei punti $P$ tali che $d(P,F) = d(P,d)$, con la distanza da $d$ intesa come lunghezza del segmento di perpendicolare. Se fosse $F \\in d$, prendendo $d$ come asse $x$ e $F=(0,0)$, la condizione $\\sqrt{x^2+y^2}=|y|$ darebbe $x^2=0$, cioè $x=0$: il luogo <strong>degenera in una retta</strong>, non è una parabola."

        back: "Il coefficiente angolare della retta $V(t)$ è la <strong>portata</strong> del rubinetto, cioè i litri erogati al secondo ($\\dot V$, dove il punto indica la derivata rispetto al tempo). Pendenza maggiore significa riempimento più rapido. Con $V_0=16$ l, portata $0{,}1$ l/s per 60 s e poi $0{,}15$ l/s, si ha $V(t)=16+0{,}1t$ fino a $V(60)=22$ l e poi $V(t)=22+0{,}15(t-60)$, da cui $V(180)=40$ litri. La funzione è <strong>lineare a tratti</strong>: due segmenti raccordati in $(60,22)$."
      }
