          <p>Carichiamo la sfera interna di raggio $R_1$ con una carica $+Q$. Per <strong>induzione elettrostatica completa</strong>, sulla superficie interna del guscio (a raggio $R_2$) si affaccia una carica $-Q$: il campo deve annullarsi all'interno del metallo del guscio, e quindi una superficie gaussiana contenuta nel conduttore deve racchiudere carica totale nulla.</p>`,
        subsections: [
          {
            subtitle: "Perché sulla superficie esterna compare $+Q$",
            content: `<p>La carica $+Q$ sulla superficie esterna <strong>non</strong> è determinata dalla sola induzione: dipende dalla carica totale del guscio. Poiché il guscio è isolato e inizialmente neutro, la sua carica totale resta nulla durante tutto il processo. Dovendo essere</p>
              <p>$$Q_{\\text{tot, guscio}} = Q(R_2) + Q(R_3) = 0, \\qquad Q(R_2) = -Q,$$</p>
              <p>segue necessariamente $Q(R_3) = +Q$.</p>
              <p>Questa configurazione va distinta da quella di un <strong>condensatore</strong> propriamente detto, in cui le due armature portano cariche totali $+Q$ e $-Q$: in tal caso (ad esempio collegando il guscio a terra) la superficie esterna resta scarica e il campo all'esterno è nullo. Nel seguito, parlando di "armature" del condensatore sferico, intendiamo la sfera interna e la superficie $r = R_2$ del guscio.</p>`
          },
          {
            subtitle: "Regione 1: $0 \\le r \\lt R_1$ (interno alla sfera centrale)",
            content: `<p>All'interno della sfera conduttrice il campo elettrico è nullo:</p>
              <p>$$E(r) = 0$$</p>
              <p>Il potenziale è costante e uguale al valore sulla superficie della sfera. Sommiamo i contributi delle tre distribuzioni sferiche, ricordando che il potenziale all'interno di un guscio sferico è costante e pari al valore sulla sua superficie:</p>
              <p>$$V(r) = V_1 = \\frac{1}{4\\pi\\epsilon_0} \\left( \\frac{Q}{R_1} - \\frac{Q}{R_2} + \\frac{Q}{R_3} \\right) = \\text{costante}$$</p>`
          },
          {
            subtitle: "Regione 2: $R_1 \\le r \\lt R_2$ (tra la sfera e il guscio)",
            content: `<p>Con una superficie gaussiana sferica di raggio $r$, la carica interna è solo $+Q$:</p>
              <p>$$E(r) = \\frac{1}{4\\pi\\epsilon_0} \\frac{Q}{r^2}$$</p>
              <p>Il potenziale è la somma del contributo della sfera interna (che varia come $1/r$) e di quelli dei gusci esterni (costanti al loro interno):</p>
              <p>$$V(r) = \\frac{1}{4\\pi\\epsilon_0} \\left( \\frac{Q}{r} - \\frac{Q}{R_2} + \\frac{Q}{R_3} \\right)$$</p>`
          },
          {
            subtitle: "Regione 3: $R_2 \\le r \\lt R_3$ (interno al guscio conduttore)",
            content: `<p>Siamo dentro un conduttore, quindi il campo è nullo. Una superficie gaussiana in questa regione racchiude carica totale $Q - Q = 0$:</p>
              <p>$$E(r) = 0$$</p>
              <p>Il potenziale è costante e lo calcoliamo per $r = R_2$:</p>
              <p>$$V(r) = V_2 = V(R_2) = \\frac{1}{4\\pi\\epsilon_0} \\left( \\frac{Q}{R_2} - \\frac{Q}{R_2} + \\frac{Q}{R_3} \\right) = \\frac{1}{4\\pi\\epsilon_0} \\frac{Q}{R_3} = \\text{costante}$$</p>`
          },
          {
            subtitle: "Regione 4: $r \\ge R_3$ (esterno al condensatore)",
            content: `<p>All'esterno di tutta la struttura la carica totale "vista" è $Q - Q + Q = +Q$: il sistema si comporta come una carica puntiforme $+Q$ nell'origine.</p>
              <p>$$E(r) = \\frac{1}{4\\pi\\epsilon_0} \\frac{Q}{r^2}, \\qquad V(r) = \\frac{1}{4\\pi\\epsilon_0} \\frac{Q}{r}$$</p>`
          }
        ]
      },
      {
        id: "s11-capacita-def",
        type: "section",
        title: "Definizione di capacità e limite a condensatore piano",
        icon: "📏",
        content: `<p>La differenza di potenziale tra le due armature del condensatore (sfera interna e superficie interna del guscio) è:</p>
          <p>$$\\Delta V = V_1 - V_2 = \\frac{Q}{4\\pi\\epsilon_0} \\left( \\frac{1}{R_1} - \\frac{1}{R_2} \\right) = \\frac{Q}{4\\pi\\epsilon_0} \\frac{R_2 - R_1}{R_1 R_2}$$</p>
          <p>Da notare: i contributi della superficie esterna ($Q/R_3$) <strong>si elidono</strong> nella differenza. La d.d.p. fra le armature non dipende dalla carica presente su $R_3$.</p>`,
        subsections: [
          {
            subtitle: "Definizione — Capacità di un condensatore",
            content: `<p>Dato un sistema di due conduttori (<strong>armature</strong>) che portano cariche opposte $+Q$ e $-Q$, fra i quali esiste una differenza di potenziale $\\Delta V = V_{+} - V_{-} \\gt 0$, si definisce <strong>capacità</strong> la grandezza</p>
              <p>$$C = \\frac{Q}{\\Delta V},$$</p>
              <p>dove $Q$ è il <em>modulo</em> della carica presente su ciascuna armatura (non la carica totale del sistema, che è nulla) e $\\Delta V$ è la differenza di potenziale fra le due armature.</p>
              <p>La capacità dipende <strong>solo dalla geometria</strong> del sistema (e dal mezzo interposto), non da $Q$ né da $\\Delta V$. Nel SI si misura in <strong>farad</strong>:</p>
              <p>$$1\\ \\mathrm{F} = 1\\ \\frac{\\mathrm{C}}{\\mathrm{V}}.$$</p>
              <p>Il farad è un'unità molto grande: le capacità di uso comune si misurano in $\\mu$F ($10^{-6}$ F), nF ($10^{-9}$ F) e pF ($10^{-12}$ F).</p>`
          },
          {
            subtitle: "Capacità del condensatore sferico",
            content: `<p>$$C = \\frac{Q}{\\Delta V} = 4\\pi\\epsilon_0 \\frac{R_1 R_2}{R_2 - R_1}$$</p>`
          },
          {
            subtitle: "Approssimazione ad armature vicine",
            content: `<p>Supponiamo che la distanza tra le armature $h = R_2 - R_1$ sia molto piccola <em>rispetto ai raggi</em>, cioè $h \\ll R_1$, cosicché $R_1 \\approx R_2 \\approx R$. (Attenzione alla notazione: in questa sezione $h$ è la distanza fra le armature, mentre nella sezione sul condensatore cilindrico lo stesso simbolo indicherà la lunghezza dei cilindri.)</p>
              <p>$$\\Delta V \\approx \\frac{Q}{4\\pi\\epsilon_0} \\frac{h}{R^2}$$</p>
              <p>La superficie della sfera è $S = 4\\pi R^2$; sostituendo $R^2 = S/(4\\pi)$:</p>
              <p>$$\\Delta V \\approx \\frac{Q}{4\\pi\\epsilon_0} \\frac{h}{S/(4\\pi)} = \\frac{Qh}{\\epsilon_0 S}$$</p>
              <p>e quindi</p>
              <p>$$C = \\frac{Q}{\\Delta V} \\approx \\epsilon_0 \\frac{S}{h}$$</p>
              <p>che è la formula della capacità del condensatore piano: un condensatore sferico con grande raggio e piccola distanza fra le armature si comporta come un condensatore piano.</p>`
          }
        ],
        formulas: [
          { label: "Definizione di capacità", latex: "C = \\frac{Q}{\\Delta V}" },
          { label: "Capacità condensatore sferico", latex: "C = 4\\pi\\epsilon_0 \\frac{R_1 R_2}{R_2 - R_1}" },
          { label: "Limite ad armature vicine", latex: "C \\approx \\epsilon_0 \\frac{S}{h}" }
        ]
      },
      {
        id: "s11-nota-dielettrici",
        type: "note_box",
        title: "Vuoto e dielettrici",
        icon: "💡",
        content: `<p>In tutta questa lezione assumiamo che lo spazio fra le armature sia <strong>vuoto</strong>: la costante che compare nelle formule è quindi la permittività del vuoto $\\epsilon_0 \\simeq 8{,}854 \\cdot 10^{-12}\\ \\mathrm{F/m}$, e non quella di un materiale interposto.</p>
          <p>Se lo spazio fra le armature è invece riempito <em>completamente</em> da un dielettrico lineare, omogeneo e isotropo di costante dielettrica relativa $\\epsilon_r$, tutte le formule restano formalmente valide a patto di effettuare la sostituzione</p>
          <p>$$\\epsilon_0 \\;\\longrightarrow\\; \\epsilon = \\epsilon_0\\,\\epsilon_r,$$</p>
          <p>dove $\\epsilon$ è la permittività del materiale. La trattazione sistematica dei dielettrici verrà svolta nelle lezioni successive.</p>`
      },
      {
        id: "s11-cilindrico",
        type: "section",
        title: "Condensatore cilindrico",
        icon: "🧪",
        content: `<p>Consideriamo un condensatore formato da <strong>due cilindri coassiali</strong> di raggi $R_1 \\lt R_2$ e altezza $h$, nel vuoto.</p>
          <p>Supponiamo di <strong>trasferire</strong> una carica $Q$ dall'armatura esterna a quella interna, per esempio collegando il condensatore a un generatore: in questo modo l'armatura interna porta la carica totale $+Q$ e quella esterna la carica totale $-Q$. <strong>Non è l'induzione a creare la carica netta negativa</strong> sull'armatura esterna: l'induzione <em>ridistribuisce</em> le cariche su un conduttore, lasciandone invariata la somma algebrica. È il trasferimento di carica da un'armatura all'altra a rendere le due cariche totali uguali e opposte.</p>
          <p>La densità di carica lineare è $\\lambda = Q/h$.</p>`,
        subsections: [
          {
            subtitle: "Ipotesi di cilindro lungo",
            content: `<p>Il calcolo che segue è <strong>approssimato</strong>: supponiamo che i cilindri siano sufficientemente lunghi, cioè $h \\gg R_1, R_2$, e trascuriamo gli <strong>effetti alle estremità</strong>. In questa approssimazione la distribuzione di carica è uniforme lungo l'asse e il sistema possiede simmetria cilindrica: il campo è allora puramente radiale, $\\vec{E} = E(r)\\,\\hat{u}_r$, e non dipende dalla coordinata assiale.</p>
              <p>Di conseguenza, su una superficie gaussiana cilindrica coassiale il campo è costante in modulo e perpendicolare alla superficie laterale, mentre è parallelo alle due basi, attraverso le quali il flusso è quindi nullo. Per un cilindro finito queste condizioni valgono solo <em>lontano dai bordi</em>, e la formula ottenuta non è un risultato esatto.</p>`
          },
          {
            subtitle: "Calcolo del campo elettrostatico",
            content: `<p>Consideriamo una superficie gaussiana cilindrica coassiale di raggio $r$ (con $R_1 \\lt r \\lt R_2$) e altezza $\\ell$, scelta <em>lontano dai bordi</em>, in modo che su di essa il campo sia effettivamente radiale e di modulo costante. L'altezza gaussiana $\\ell$ è una grandezza ausiliaria, <strong>distinta</strong> dall'altezza totale $h$ delle armature.</p>

              <p>Il flusso è dato solo dal contributo della superficie laterale:</p>
              <p>$$\\Phi(\\vec{E}) = \\oint_\\Sigma \\vec{E} \\cdot d\\vec{S} = E \\cdot S_{\\text{lat}} = E \\cdot (2\\pi r \\ell)$$</p>
              <p>La carica interna, espressa tramite la densità lineare $\\lambda = Q/h$ (uniforme per l'ipotesi $h \\gg R_1, R_2$), è $Q_{\\text{int}} = \\lambda \\ell$. Dal teorema di Gauss:</p>
              <p>$$E \\cdot (2\\pi r \\ell) = \\frac{\\lambda \\ell}{\\epsilon_0}$$</p>
              <p>Semplificando $\\ell$:</p>
              <p>$$E(r) = \\frac{\\lambda}{2\\pi \\epsilon_0 r}, \\qquad \\vec{E}(r) = \\frac{\\lambda}{2\\pi \\epsilon_0 r} \\hat{r}$$</p>`
          },
          {
            subtitle: "Differenza di potenziale e capacità",
            content: `<p>$$V_1 - V_2 = \\int_{R_1}^{R_2} \\vec{E} \\cdot d\\vec{l} = \\int_{R_1}^{R_2} \\frac{\\lambda}{2\\pi \\epsilon_0 r} dr = \\frac{\\lambda}{2\\pi \\epsilon_0} \\left[ \\ln r \\right]_{R_1}^{R_2} = \\frac{\\lambda}{2\\pi \\epsilon_0} \\ln\\left(\\frac{R_2}{R_1}\\right)$$</p>
              <p>Applicando la definizione $C = Q/\\Delta V$ e osservando che la carica totale sull'armatura interna è $Q = \\lambda h$ (qui compare l'altezza <strong>totale</strong> $h$, non l'altezza gaussiana $\\ell$):</p>
              <p>$$C = \\frac{\\lambda h}{\\frac{\\lambda}{2\\pi \\epsilon_0} \\ln\\left(\\frac{R_2}{R_1}\\right)}$$</p>
              <p>Semplificando $\\lambda$ si ottiene la <strong>capacità del condensatore cilindrico</strong>: per due cilindri coassiali di raggi $R_1 \\lt R_2$ e altezza $h$, nel vuoto, nell'ipotesi $h \\gg R_1, R_2$,</p>
              <p>$$C = \\frac{2\\pi \\epsilon_0 h}{\\ln\\left(\\dfrac{R_2}{R_1}\\right)}$$</p>
              <p>La dipendenza da $\\lambda$ (cioè da $Q$) si cancella, come richiede la definizione di capacità.</p>`
          },
          {
            subtitle: "Limite a condensatore piano",
            content: `<p>Se la distanza tra le armature $d = R_2 - R_1$ è molto piccola rispetto ai raggi ($d \\ll R_1$):</p>
              <p>$$\\frac{R_2}{R_1} = \\frac{R_1 + d}{R_1} = 1 + \\frac{d}{R_1}$$</p>
              <p>Usando lo sviluppo di Taylor $\\ln(1+x) \\approx x$ per $x \\ll 1$:</p>
              <p>$$\\ln\\left(\\frac{R_2}{R_1}\\right) \\approx \\frac{d}{R_1}$$</p>
              <p>e quindi</p>
              <p>$$C \\approx \\frac{2\\pi \\epsilon_0 h}{d/R_1} = \\frac{\\epsilon_0 (2\\pi R_1 h)}{d} = \\epsilon_0 \\frac{S}{d}$$</p>
              <p>dove $S = 2\\pi R_1 h$ è la superficie laterale del cilindro interno. Ritroviamo esattamente la formula del condensatore piano.</p>`
          }
        ],
        formulas: [
          { label: "Campo nel condensatore cilindrico", latex: "E(r) = \\frac{\\lambda}{2\\pi\\epsilon_0 r}" },
          { label: "D.d.p. fra i cilindri", latex: "\\Delta V = \\frac{Q}{2\\pi\\epsilon_0 h} \\ln\\left(\\frac{R_2}{R_1}\\right)" },
          { label: "Capacità cilindrica", latex: "C = \\frac{2\\pi\\epsilon_0 h}{\\ln(R_2/R_1)}" }
        ]
      },
      {
        id: "s11-nota-zero-potenziale",
        type: "note_box",
        title: "Dove porre lo zero del potenziale",
        icon: "⚖️",
        content: `<p>Occorre distinguere due situazioni diverse.</p>
          <p><strong>1. Singolo filo o cilindro infinito con carica lineare netta $\\lambda \\neq 0$.</strong> Il campo decresce come $1/r$ e il potenziale <em>diverge logaritmicamente</em> all'infinito: non è quindi possibile porre $V = 0$ all'infinito. Si lavora con differenze di potenziale fra punti a distanza finita, scegliendo un riferimento arbitrario a distanza finita.</p>
          <p><strong>2. Condensatore coassiale, globalmente neutro.</strong> Qui le due armature portano cariche $+Q$ e $-Q$: la carica lineare netta è nulla e, nell'approssimazione ideale di cilindri infiniti, il campo all'esterno dell'armatura esterna è nullo. Il potenziale esterno è quindi <em>costante</em> e può essere scelto uguale a zero: la divergenza logaritmica riguarda il singolo cilindro carico, non il sistema completo. Per un condensatore reale, di lunghezza finita, il campo lontano decade abbastanza rapidamente e si può adottare il consueto riferimento $V(\\infty) = 0$.</p>`
      },
      {
        id: "s11-ex-coassiale",
        type: "esercizio_svolto",
        title: "Esercizio svolto — Capacità di un cavo coassiale",
        icon: "✎",
        source: "docente",
        content: `<p>Consideriamo un tratto di cavo coassiale (vuoto fra i conduttori) di lunghezza $h = 1{,}0\\ \\mathrm{m}$, con conduttore interno di raggio $R_1 = 1{,}0\\ \\mathrm{mm}$ e schermo esterno di raggio $R_2 = 3{,}0\\ \\mathrm{mm}$. Poiché $h \\gg R_1, R_2$, l'ipotesi di cilindro lungo è ben soddisfatta. Calcolare la capacità, e poi carica ed energia se il cavo è portato a $\\Delta V = 100\\ \\mathrm{V}$.</p>`,
        steps: [
          `<strong>Capacità.</strong> Dalla formula del condensatore cilindrico: $$C = \\frac{2\\pi \\epsilon_0 h}{\\ln(R_2/R_1)} = \\frac{2\\pi \\cdot 8{,}854 \\cdot 10^{-12}\\ \\mathrm{F/m} \\cdot 1{,}0\\ \\mathrm{m}}{\\ln 3{,}0} \\approx \\frac{5{,}56 \\cdot 10^{-11}}{1{,}099}\\ \\mathrm{F} \\approx 5{,}1 \\cdot 10^{-11}\\ \\mathrm{F},$$ cioè circa $51\\ \\mathrm{pF}$ per metro di cavo.`,
          `<strong>Controllo dimensionale.</strong> $[\\epsilon_0] = \\mathrm{F/m}$ e il logaritmo è adimensionale, quindi $\\epsilon_0 h$ ha le dimensioni di una capacità: il risultato è in farad, come deve essere.`,
          `<strong>Carica.</strong> Con $\\Delta V = 100\\ \\mathrm{V}$: $$Q = C \\Delta V \\approx 5{,}1 \\cdot 10^{-11}\\ \\mathrm{F} \\cdot 100\\ \\mathrm{V} \\approx 5{,}1\\ \\mathrm{nC}.$$`,
          `<strong>Energia</strong> (usando la formula $U_e = \\tfrac12 C (\\Delta V)^2$ ricavata nella sezione sull'energia più avanti): $$U_e \\approx \\tfrac{1}{2} \\cdot 5{,}1\\cdot 10^{-11}\\ \\mathrm{F} \\cdot (100\\ \\mathrm{V})^2 \\approx 2{,}5 \\cdot 10^{-7}\\ \\mathrm{J} = 0{,}25\\ \\mu\\mathrm{J}.$$`
        ]
      },
      {
        id: "s11-piano",
        type: "section",
        title: "Condensatore piano",
        icon: "▭",
        content: `<p>Il caso più semplice di condensatore è quello <strong>piano</strong>: due armature metalliche piane e parallele di superficie $S$, poste a distanza $d$ molto piccola rispetto alle dimensioni lineari delle armature.</p>`,
        subsections: [
          {
            subtitle: "Ipotesi e convenzioni del condensatore piano ideale",
            content: `<p>Consideriamo due armature piane e parallele di area $S$, poste nel <strong>vuoto</strong> a distanza $d$, con $d$ molto minore della <strong>minima dimensione laterale</strong> delle armature. Per una lastra rettangolare di lati $a$ e $b$ la condizione corretta è</p>
              <p>$$d \\ll \\min(a,b).$$</p>
              <p>La scrittura compatta $d \\ll \\sqrt{S}$ è lecita <em>solo</em> quando le due dimensioni laterali sono confrontabili fra loro: per armature molto allungate un'area grande può accompagnarsi a una larghezza confrontabile con $d$, e gli effetti di bordo non sono trascurabili.</p>
              <p>In questa approssimazione <strong>trascuriamo gli effetti di bordo</strong>: il campo nella regione compresa tra le armature è <em>uniforme</em> e ortogonale alle armature, mentre all'esterno è praticamente nullo.</p>
              <p><strong>Convenzioni di segno:</strong></p>
              <ul>
                <li>l'armatura $1$ porta la carica $+Q$ con $Q \\gt 0$, l'armatura $2$ la carica $-Q$;</li>
                <li>di conseguenza $V_1 \\gt V_2$ e scriviamo $V = V_1 - V_2 \\gt 0$;</li>
                <li>$E = |\\vec{E}|$ indica il <em>modulo</em> del campo fra le armature, che punta dall'armatura $1$ verso l'armatura $2$.</li>
              </ul>
              <p>Con queste scelte tutte le quantità $Q$, $V$, $E$, $C$ sono positive.</p>`
          },
          {
            subtitle: "Campo e differenza di potenziale",
            content: `<p>Supponiamo di <strong>trasferire</strong> una carica $Q$ da un'armatura all'altra, così che le due armature portino cariche totali opposte $+Q$ e $-Q$; trascurando gli effetti di bordo le densità superficiali risultano uniformi e pari a $+\\sigma = +Q/S$ e $-\\sigma = -Q/S$. Anche qui è il <em>trasferimento</em> di carica, e non la semplice induzione, a produrre le due cariche nette opposte: su un conduttore isolato e inizialmente neutro l'induzione ridistribuisce le cariche senza alterarne la somma algebrica.</p>
              <p>Il campo generato da una singola lastra piana indefinita è $E = \\sigma/(2\\epsilon_0)$. Fra le due armature i campi delle due lastre si sommano (hanno la stessa direzione, dalla positiva alla negativa); all'esterno si annullano:</p>
              <p>$$E_{\\text{int}} = E_+ + E_- = \\frac{\\sigma}{2\\epsilon_0} + \\frac{\\sigma}{2\\epsilon_0} = \\frac{\\sigma}{\\epsilon_0} = \\frac{Q}{\\epsilon_0 S}$$</p>
              <p>Poiché $\\vec{E}$ è uniforme e parallelo al cammino che va dall'armatura $1$ alla $2$, l'integrale di linea del campo lungo tale cammino dà</p>
              <p>$$\\Delta V = V_1 - V_2 = E \\cdot d = \\frac{\\sigma d}{\\epsilon_0} = \\frac{Q d}{\\epsilon_0 S}$$</p>`
          },
          {
            subtitle: "Capacità del condensatore piano",
            content: `<p>Applicando la definizione $C = Q/(V_1 - V_2)$:</p>
              <p>$$C = \\frac{Q}{\\dfrac{Q d}{\\epsilon_0 S}} = Q \\cdot \\frac{\\epsilon_0 S}{Q d} = \\epsilon_0 \\frac{S}{d}$$</p>
              <p>Il risultato è esatto nel limite di armature indefinitamente estese ed è un'ottima approssimazione quando $d$ è molto minore della minima dimensione laterale.</p>
              <p>La capacità dipende da due soli fattori:</p>
              <ol>
                <li><strong>Il mezzo interposto:</strong> la presenza di $\\epsilon_0$ indica che fra le armature c'è il vuoto; con un dielettrico lineare, omogeneo e isotropo che riempie lo spazio fra le armature si sostituisce $\\epsilon = \\epsilon_0 \\epsilon_r$.</li>
                <li><strong>La geometria:</strong> l'area $S$ delle armature e la loro distanza $d$.</li>
              </ol>
              <p>La capacità <strong>non</strong> dipende né dalla carica $Q$ né dalla tensione $V$: $Q$ e $V$ sono proporzionali e il loro rapporto è una costante caratteristica del dispositivo.</p>`
          },
          {
            subtitle: "Quando vale $C \\propto S/d$?",
            content: `<p>La forma $C \\propto S/d$ non vale per <em>qualunque</em> condensatore con armature vicine: la piccolezza della distanza, da sola, non basta, perché non garantisce né che la separazione sia uniforme né che si possa identificare un unico rapporto $S/d$.</p>
              <p>L'approssimazione è legittima quando le armature sono <strong>localmente quasi parallele</strong>, con separazione $d$ uniforme e piccola sia rispetto ai raggi di curvatura delle superfici sia rispetto alle loro dimensioni laterali. I due casi discussi sopra ne sono esempi: il condensatore sferico con $R_2 - R_1 \\ll R_1$ e il condensatore cilindrico con $R_2 - R_1 \\ll R_1$ (e $h \\gg R_2$) ricadono entrambi in questa situazione.</p>`
          },
          {
            subtitle: "Simbolo circuitale",
            content: `<p>D'ora in poi rappresenteremo un condensatore con il simbolo circuitale seguente, che riproduce le due armature parallele: i due segmenti verticali sono le armature, i due segmenti orizzontali i terminali. Si osservi che il filo <strong>non</strong> passa da un'armatura all'altra: fra le armature c'è l'isolante.</p>

      {
        id: "s11-collegamenti",
        type: "section",
        title: "Collegamento di condensatori",
        icon: "🔗",
        content: `<p>Così come possiamo avere più serbatoi d'acqua, possiamo avere più "serbatoi di carica", ovvero più condensatori, e collegarli tra loro. I due collegamenti fondamentali sono il <strong>parallelo</strong> e la <strong>serie</strong>.</p>
          <p><strong>Punto chiave:</strong> la loro definizione corretta è <strong>topologica</strong>, cioè riguarda il modo in cui i componenti sono connessi ai nodi del circuito, e <em>non</em> l'uguaglianza di tensioni o cariche, che è invece una <em>conseguenza</em>.</p>

              <p>Poiché un conduttore in equilibrio è equipotenziale, tutti i punti connessi ad $A$ hanno potenziale $V_A$ e tutti quelli connessi a $B$ hanno potenziale $V_B$: i condensatori in parallelo sono quindi sottoposti alla <strong>stessa</strong> differenza di potenziale $V = V_A - V_B$.</p>
              <p><strong>Attenzione:</strong> l'uguaglianza delle tensioni è una <em>conseguenza</em> del collegamento, non la sua definizione. Due condensatori appartenenti a rami diversi di un circuito possono avere per caso la stessa tensione senza essere in parallelo: ciò che definisce il parallelo è la condivisione dei due nodi terminali.</p>`
          },
          {
            subtitle: "Capacità equivalente in parallelo",
            content: `<p>Supponendo i condensatori <strong>inizialmente scarichi</strong> e applicando la tensione $V$ fra i nodi $A$ e $B$, ogni condensatore accumula una carica proporzionale alla sua capacità:</p>
              <p>$$Q_1 = C_1 V, \\qquad Q_2 = C_2 V$$</p>
              <p>dove $Q_i$ è il modulo della carica su ciascuna armatura dell'$i$-esimo condensatore. La carica totale fornita al sistema (complessivamente trasferita al nodo $A$) è:</p>
              <p>$$Q_{tot} = Q_1 + Q_2 = C_1 V + C_2 V = (C_1 + C_2) V$$</p>
              <p>La <strong>capacità equivalente</strong> è la capacità del singolo condensatore che, sottoposto alla stessa $V$, accumula la stessa carica totale: $Q_{tot} = C_{eq} V$. Confrontando:</p>
              <p>$$C_{eq} = C_1 + C_2 + \\dots + C_n = \\sum_{i=1}^{n} C_i$$</p>
              <p>Nel parallelo <strong>la tensione è comune</strong> e $C_{eq}$ è sempre <em>maggiore</em> della più grande delle capacità collegate. Il sistema può essere sostituito da un unico condensatore $C_{eq}$ collegato agli stessi due nodi $A$ e $B$.</p>

            subtitle: "Analogia con i serbatoi (parallelo)",
            content: `<p>Immaginate di dover raccogliere acqua piovana. Avere due cisterne affiancate e riempite fino allo stesso livello (il livello gioca il ruolo della differenza di potenziale) equivale ad avere un'unica cisterna la cui capacità è la <strong>somma</strong> delle due.</p>
              <p>L'analogia va intesa <strong>solo</strong> in questo senso: riguarda il modo in cui si sommano le capacità, non il comportamento del circuito in caso di avaria di un componente.</p>`
          },
          {
            subtitle: "Definizione — Collegamento in serie",
            content: `<p>Due o più condensatori sono collegati <strong>in serie</strong> quando formano una catena: il secondo terminale di ciascun componente è collegato al primo terminale del successivo, e ogni <strong>nodo intermedio</strong> della catena è connesso <strong>soltanto</strong> ai due componenti adiacenti, senza ulteriori diramazioni.</p>

          {
            subtitle: "Ipotesi necessarie per l'uguaglianza delle cariche",
            content: `<p>Nel ragionamento che segue assumiamo che:</p>
              <ul>
                <li>i condensatori siano <strong>inizialmente scarichi</strong>;</li>
                <li>il nodo intermedio $B$ (il tratto di conduttore che unisce l'armatura destra di $C_1$ all'armatura sinistra di $C_2$) sia <strong>elettricamente isolato</strong> e <strong>inizialmente neutro</strong>;</li>
                <li>da $B$ non partano <strong>altre diramazioni</strong> verso il resto del circuito.</li>
              </ul>
              <p>L'isolamento, da solo, garantisce soltanto la <em>conservazione</em> della carica del nodo: è l'ipotesi di <strong>neutralità iniziale</strong> che permette di concludere che la carica totale del nodo intermedio resta <em>nulla</em>.</p>`
          },
          {
            subtitle: "Carica comune nella serie",
            content: `<p>Colleghiamo i terminali esterni $A$ e $C$ a un <strong>generatore</strong>, che <em>trasferisce</em> carica dal terminale $C$ al terminale $A$: in questo modo sulla prima armatura (in $A$) compare $+Q$ (con $Q \\gt 0$) e sull'ultima (in $C$) compare $-Q$, e il sistema resta globalmente neutro. Da notare: il solo deposito di $+Q$ su un sistema inizialmente neutro non produrrebbe una configurazione globalmente neutra — l'induzione non crea carica netta negativa sull'ultimo conduttore.</p>
              <p>Note le cariche sui terminali esterni, le cariche interne seguono dalla <strong>neutralità del nodo intermedio</strong>. Sull'armatura destra di $C_1$ l'induzione fa comparire $-Q$; il tratto di conduttore attorno a $B$ è isolato e inizialmente neutro, quindi la sua carica totale deve restare nulla: se su una sua estremità compare $-Q$, sull'altra deve comparire $+Q$. Dunque la prima armatura di $C_2$ porta $+Q$, coerentemente con il $-Q$ sull'ultima armatura in $C$.</p>
              <p>Conclusione: nelle ipotesi indicate, <strong>tutti i condensatori della serie portano lo stesso modulo di carica $Q$</strong> su ciascuna armatura. È una conseguenza della conservazione della carica, non della definizione di serie.</p>

            subtitle: "Capacità equivalente in serie",
            content: `<p>Le differenze di potenziale sui singoli condensatori (tutte positive, con $V_A \\gt V_B \\gt V_C$) sono:</p>
              <p>$$V_1 = V_A - V_B = \\frac{Q}{C_1}, \\qquad V_2 = V_B - V_C = \\frac{Q}{C_2}$$</p>
              <p>La tensione totale è la somma:</p>
              <p>$$V = V_A - V_C = (V_A - V_B) + (V_B - V_C) = \\frac{Q}{C_1} + \\frac{Q}{C_2} = Q \\left( \\frac{1}{C_1} + \\frac{1}{C_2} \\right)$$</p>
              <p>La capacità equivalente è definita da $V = Q/C_{eq}$; confrontando:</p>
              <p>$$\\frac{1}{C_{eq}} = \\frac{1}{C_1} + \\frac{1}{C_2} + \\dots + \\frac{1}{C_n} = \\sum_{i=1}^{n} \\frac{1}{C_i}$$</p>
              <p>Per due soli condensatori: $C_{eq} = \\dfrac{C_1 C_2}{C_1 + C_2}$. Nella serie <strong>la carica è comune</strong> e $C_{eq}$ è sempre <em>minore</em> della più piccola delle capacità collegate.</p>`

            subtitle: "Analogia con i serbatoi (serie)",

              <p>L'analogia serve <strong>esclusivamente</strong> a ricordare come si combinano le capacità (gli inversi si sommano), e non va estesa al comportamento in caso di avaria: nei circuiti reali un guasto per <em>interruzione</em> e un guasto per <em>cortocircuito</em> hanno effetti opposti e non si deducono dal tipo di collegamento.</p>`

      {
        id: "s11-energia",
        type: "section",
        title: "Energia immagazzinata in un condensatore",
        icon: "⚡",
        content: `<p>Per caricare un condensatore è necessario compiere un <strong>lavoro</strong>, spostando le cariche da un'armatura all'altra contro il campo elettrico che si viene a creare. Questo lavoro viene immagazzinato come energia potenziale elettrostatica. Ricordiamo che la variazione di energia potenziale elettrostatica è legata al potenziale da $dU = V\\,dQ$.</p>`,
        subsections: [
          {
            subtitle: "Di chi è il lavoro? Il processo quasi-statico",
            content: `<p>Il processo di carica che consideriamo è <strong>ideale e quasi-statico</strong>: un agente esterno trasferisce <em>lentamente</em> piccole quantità di carica $dQ'$ dall'armatura negativa a quella positiva, vincendo la differenza di potenziale $V'$ già presente, in assenza di qualsiasi dissipazione (nessuna resistenza, nessuna irradiazione). La capacità $C$ resta costante e in ogni istante il sistema è in equilibrio elettrostatico, con le armature che portano $+q$ e $-q$ (carica totale sempre nulla).</p>
              <p>Indicando con $dW_{\\text{est}}$ il lavoro dell'<em>agente esterno</em> e con $dW_{\\text{campo}}$ quello delle <em>forze del campo</em>:</p>
              <p>$$dW_{\\text{est}} = +V' \\, dQ' = dU, \\qquad dW_{\\text{campo}} = -V' \\, dQ' = -dU$$</p>
              <p>I due lavori hanno <strong>segno opposto</strong>: è il lavoro esterno, non quello del campo, che si accumula come energia potenziale $U$ del condensatore.</p>
              <p><strong>Attenzione:</strong> $U$ non è in generale l'energia complessivamente erogata da un generatore reale durante la carica. Se il condensatore viene caricato attraverso una resistenza, il generatore fornisce un'energia maggiore e una parte di essa viene dissipata per effetto Joule. Il calcolo che segue riguarda il <em>solo lavoro reversibile di caricamento</em>.</p>`
          },
          {
            subtitle: "Integrazione del lavoro",
            content: `<p>Durante la carica il potenziale $V'$ non è costante, ma aumenta man mano che la carica $Q'$ si accumula; in ogni istante $V' = Q'/C$. Il lavoro esterno infinitesimo per trasferire $dQ'$ è</p>
              <p>$$dU = dW_{\\text{est}} = V'\\, dQ' = \\frac{Q'}{C}\\, dQ'$$</p>
              <p>Integrando da $0$ alla carica finale $Q$:</p>
              <p>$$U = \\int_0^Q \\frac{Q'}{C} dQ' = \\frac{1}{C} \\left[ \\frac{Q'^2}{2} \\right]_0^Q = \\frac{1}{2} \\frac{Q^2}{C}$$</p>
              <p>Usando $Q = CV$ si ottengono le altre due forme: sostituendo $Q = CV$ si ha $U = \\frac{1}{2}\\frac{(CV)^2}{C} = \\frac{1}{2} C V^2$; sostituendo $C = Q/V$ si ha $U = \\frac{1}{2}\\frac{Q^2}{Q/V} = \\frac{1}{2} Q V$.</p>`
          },
          {
            subtitle: "Energia elettrostatica di un condensatore",
            content: `<p>Un condensatore di capacità $C$ costante, caricato quasi-staticamente e senza dissipazioni fino alla carica $Q$ e alla tensione $V = Q/C$, immagazzina l'energia</p>
              <p>$$U_e = \\frac{1}{2} \\frac{Q^2}{C} = \\frac{1}{2} C V^2 = \\frac{1}{2} Q V$$</p>
              <p>Le tre espressioni sono equivalenti in virtù di $Q = CV$: si usa quella che contiene le grandezze assegnate dal problema.</p>
              <p>Il fattore $\\tfrac{1}{2}$ nasce dall'integrazione: la tensione cresce da $0$ a $V$ durante la carica, quindi il lavoro non è $QV$ ma il suo valore medio $\\tfrac12 QV$.</p>`
          }
        ],
        formulas: [
          { label: "Energia (in funzione di Q e C)", latex: "U_e = \\frac{Q^2}{2C}" },
          { label: "Energia (in funzione di C e V)", latex: "U_e = \\frac{1}{2} C V^2" },
          { label: "Energia (in funzione di Q e V)", latex: "U_e = \\frac{1}{2} Q V" }
        ]

        icon: "🌊",

          <p>$$U_e = \\int u_e \\, d\\mathcal{V}, \\qquad\\text{ovvero}\\qquad u_e = \\frac{dU_e}{d\\mathcal{V}},$$</p>

      {
        id: "s11-es-teoria-1",
        type: "esercizio",
        title: "Teoria 1 — Capacità e condensatore piano",
        kind: "teoria",
        source: "integrazione",
        content: `<p>Enuncia la definizione di capacità di un condensatore e la sua unità di misura nel SI; ricava poi l'espressione della capacità di un condensatore piano nel vuoto, specificando le ipotesi usate, e spiega perché il risultato non dipende dalla carica $Q$.</p>`,
        solution: `<p>Dati due conduttori (armature) che portano cariche opposte $+Q$ e $-Q$ e fra i quali esiste la differenza di potenziale $\\Delta V = V_{+} - V_{-} \\gt 0$, si definisce capacità la grandezza $C = Q/\\Delta V$, dove $Q$ è il modulo della carica presente su ciascuna armatura (la carica totale del sistema è nulla).</p>
          <p>Nel SI si misura in farad, $1\\ \\mathrm{F} = 1\\ \\mathrm{C}/\\mathrm{V}$; il farad è un'unità molto grande, per cui in pratica si usano $\\mu$F, nF e pF.</p>
          <p><strong>Ipotesi per il condensatore piano:</strong> armature piane e parallele di area $S$, poste a distanza $d$ piccola rispetto alle dimensioni lineari delle armature (più precisamente $d \\ll \\min(a,b)$ per una lastra rettangolare di lati $a,b$), cosicché si possono trascurare gli effetti di bordo e il campo fra le armature si può considerare uniforme e ortogonale ad esse.</p>
          <p>Posto $\\sigma = Q/S$, il campo fra le armature vale</p>
          <p>$$E = \\frac{\\sigma}{\\epsilon_0} = \\frac{Q}{\\epsilon_0 S},$$</p>
          <p>quindi</p>
          <p>$$\\Delta V = E\\,d = \\frac{Qd}{\\epsilon_0 S}$$</p>
          <p>e dalla definizione</p>
          <p>$$C = \\frac{Q}{\\Delta V} = \\epsilon_0 \\frac{S}{d}.$$</p>
          <p>Il risultato dipende solo dalla geometria (area delle armature e loro distanza) e dal mezzo interposto: infatti il campo, e con esso $\\Delta V$, è proporzionale a $Q$, quindi il rapporto $Q/\\Delta V$ è indipendente sia da $Q$ sia da $\\Delta V$.</p>`
      },
      {
        id: "s11-es-teoria-2",
        type: "esercizio",
        title: "Teoria 2 — Capacità del condensatore cilindrico con Gauss",
        kind: "teoria",
        source: "integrazione",
        content: `<p>Enuncia la definizione di capacità di un condensatore e ricava, con il teorema di Gauss, la capacità di un condensatore cilindrico formato da due cilindri coassiali di raggi $R_1 \\lt R_2$ e altezza $h$ nel vuoto, precisando quale ipotesi geometrica è necessaria e dove viene usata.</p>`,
        solution: `<p>Un condensatore è un sistema di due conduttori che portano cariche totali opposte $+Q$ e $-Q$; detta $\\Delta V$ la differenza di potenziale fra armatura positiva e negativa, si definisce $C = Q/\\Delta V$, grandezza indipendente da $Q$ e dipendente solo dalla geometria e dal mezzo interposto ($1\\,\\mathrm{F} = 1\\,\\mathrm{C}/\\mathrm{V}$).</p>
          <p><strong>Ipotesi:</strong> $h \\gg R_1, R_2$. Serve per trascurare gli effetti di bordo, così che il campo fra le armature sia radiale, dipendente solo da $r$, e la densità lineare $\\lambda = Q/h$ sia uniforme.</p>
          <p><strong>Campo.</strong> Si prende come superficie gaussiana un cilindro coassiale di raggio $r$, con $R_1 \\lt r \\lt R_2$, e altezza $\\ell$ nella regione centrale. Il flusso attraverso le basi è nullo (campo radiale, quindi ortogonale ai vettori superficie delle basi), quindi $\\Phi(\\vec{E}) = E\\,(2\\pi r \\ell)$. La carica interna è $Q_{\\text{int}} = \\lambda \\ell$, e il teorema di Gauss dà $E\\,(2\\pi r\\ell) = \\lambda\\ell/\\epsilon_0$, da cui</p>
          <p>$$E(r) = \\frac{\\lambda}{2\\pi\\epsilon_0 r} \\qquad (R_1 \\lt r \\lt R_2)$$</p>
          <p>diretto radialmente verso l'esterno se $\\lambda \\gt 0$.</p>
          <p><strong>Potenziale.</strong></p>
          <p>$$V_1 - V_2 = \\int_{R_1}^{R_2} \\frac{\\lambda}{2\\pi\\epsilon_0 r}\\,dr = \\frac{\\lambda}{2\\pi\\epsilon_0}\\ln\\left(\\frac{R_2}{R_1}\\right)$$</p>
          <p><strong>Capacità.</strong> Con $Q = \\lambda h$ (altezza totale delle armature, non l'altezza ausiliaria $\\ell$):</p>
          <p>$$C = \\frac{\\lambda h}{\\frac{\\lambda}{2\\pi\\epsilon_0}\\ln(R_2/R_1)} = \\frac{2\\pi\\epsilon_0 h}{\\ln\\left(\\frac{R_2}{R_1}\\right)}$$</p>
          <p>La dipendenza da $\\lambda$ (cioè da $Q$) si cancella, come richiede la definizione. In presenza di un dielettrico lineare, omogeneo e isotropo che riempie lo spazio fra le armature basta sostituire $\\epsilon_0 \\to \\epsilon = \\epsilon_0\\epsilon_r$.</p>`
      },
      {
        id: "s11-es-teoria-3",
        type: "esercizio",
        title: "Teoria 3 — Ipotesi del condensatore piano ideale",
        kind: "teoria",
        source: "integrazione",
        content: `<p>Enuncia le ipotesi del modello di condensatore piano ideale e ricava l'espressione della sua capacità $C = \\epsilon_0 S/d$, giustificando ogni passaggio. Da quali grandezze dipende $C$?</p>`,
        solution: `<p><strong>Ipotesi.</strong> Due armature piane e parallele di area $S$, poste nel vuoto a distanza $d$ con $d$ molto minore della minima dimensione laterale delle armature (per una lastra rettangolare di lati $a,b$: $d \\ll \\min(a,b)$; la scrittura $d \\ll \\sqrt{S}$ è valida solo se le due dimensioni laterali sono confrontabili), così da poter trascurare gli effetti di bordo. In questa approssimazione il campo nella regione fra le armature è uniforme e ortogonale alle armature, mentre all'esterno è nullo.</p>
          <p><strong>Convenzioni.</strong> L'armatura $1$ porta $+Q$ (con $Q \\gt 0$), l'armatura $2$ porta $-Q$, dunque $V_1 \\gt V_2$ e si pone $V = V_1 - V_2 \\gt 0$; $E = |\\vec{E}|$ è il modulo del campo, diretto da $1$ verso $2$.</p>
          <p>Poiché $\\vec{E}$ è uniforme e parallelo al cammino che va da $1$ a $2$, l'integrale di linea del campo lungo il cammino dall'armatura $1$ alla $2$ dà $V_1 - V_2 = E\\,d$ (la conservatività del campo elettrostatico garantisce che il risultato non dipenda dal cammino scelto).</p>
          <p>Per il condensatore piano il campo fra le armature è $E = \\sigma/\\epsilon_0$, con $\\sigma = Q/S$ densità superficiale di carica; quindi</p>
          <p>$$V_1 - V_2 = \\frac{\\sigma}{\\epsilon_0}d = \\frac{Q\\,d}{\\epsilon_0 S}.$$</p>
          <p>Per definizione $C = Q/(V_1 - V_2)$, dunque</p>
          <p>$$C = \\frac{Q}{\\dfrac{Q d}{\\epsilon_0 S}} = \\epsilon_0\\frac{S}{d}.$$</p>
          <p>La capacità dipende solo dalla geometria ($S$ e $d$) e dal mezzo interposto (qui il vuoto, tramite $\\epsilon_0$): non dipende né da $Q$ né da $V$. Infatti $Q$ e $V$ sono proporzionali e il loro rapporto è una costante caratteristica del dispositivo.</p>`
      },
      {
        id: "s11-es-teoria-4",
        type: "esercizio",
        title: "Teoria 4 — Cilindrico e limite piano",
        kind: "teoria",
        source: "integrazione",
        content: `<p>Ricava la capacità di un condensatore cilindrico formato da due cilindri coassiali di raggi $R_1 \\lt R_2$ e lunghezza $h$, elencando le ipotesi necessarie per applicare il teorema di Gauss, e mostra che per $d = R_2 - R_1 \\ll R_1$ si riottiene la formula del condensatore piano.</p>`,
        solution: `<p><strong>Ipotesi.</strong> Cilindri lunghi, $h \\gg R_2$, effetti alle estremità trascurabili; in questa approssimazione la carica è distribuita uniformemente lungo l'asse, con densità lineare $\\lambda = Q/h$, e la simmetria cilindrica garantisce che il campo sia puramente radiale, $\\vec{E} = E(r)\\,\\hat{u}_r$, con $E$ indipendente dalla coordinata assiale e angolare.</p>
          <p><strong>Superficie gaussiana.</strong> Un cilindro coassiale di raggio $r$, con $R_1 \\lt r \\lt R_2$, e altezza $h$: sulle due basi il campo è parallelo alla superficie e il flusso è nullo, sulla superficie laterale il campo è costante in modulo e ortogonale. Dunque</p>
          <p>$$\\Phi(E) = E\\,(2\\pi r h) = \\frac{Q_{int}}{\\epsilon_0} = \\frac{\\lambda h}{\\epsilon_0} \\quad\\Longrightarrow\\quad E(r) = \\frac{\\lambda}{2\\pi\\epsilon_0 r}$$</p>
          <p><strong>Differenza di potenziale e capacità.</strong></p>
          <p>$$\\Delta V = V_1 - V_2 = \\int_{R_1}^{R_2} E(r)\\,dr = \\frac{\\lambda}{2\\pi\\epsilon_0}\\ln\\left(\\frac{R_2}{R_1}\\right) = \\frac{Q}{2\\pi\\epsilon_0 h}\\ln\\left(\\frac{R_2}{R_1}\\right)$$</p>
          <p>$$C = \\frac{Q}{\\Delta V} = \\frac{2\\pi\\epsilon_0 h}{\\ln(R_2/R_1)}$$</p>
          <p><strong>Limite piano.</strong> Se $d = R_2 - R_1 \\ll R_1$, posto $R_1 \\approx R_2 \\approx R$ si ha</p>
          <p>$$\\ln\\left(\\frac{R_2}{R_1}\\right) = \\ln\\left(1 + \\frac{d}{R_1}\\right) \\approx \\frac{d}{R_1} \\approx \\frac{d}{R}$$</p>
          <p>perché $\\ln(1+x) \\approx x$ per $x$ piccolo. Allora</p>
          <p>$$C \\approx \\frac{2\\pi\\epsilon_0 h}{d/R} = \\epsilon_0\\frac{2\\pi R h}{d} = \\epsilon_0\\frac{S}{d},$$</p>
          <p>con $S = 2\\pi R h$ superficie laterale delle armature: è la formula del condensatore piano.</p>`
      },
      {
        id: "s11-es-scritto-1",
        type: "esercizio",
        title: "Scritto 1 — Condensatore piano: capacità, campo, energia",
        kind: "scritto",
        source: "integrazione",
        content: `<p>Un condensatore piano nel vuoto ha armature di area $S = 100\\ \\mathrm{cm}^2$ poste a distanza $d = 0{,}50\\ \\mathrm{mm}$ ed è collegato a un generatore che impone $V = 100\\ \\mathrm{V}$. Calcolare:</p>
          <p>(a) la capacità $C$;<br>
          (b) la carica $Q$ su ciascuna armatura;<br>
          (c) il campo elettrico fra le armature e la densità di energia $u_e$;<br>
          (d) l'energia immagazzinata, verificando l'accordo fra $U_e = \\tfrac{1}{2}CV^2$ e $u_e\\,\\mathcal{V}$.</p>
          <p>Usare $\\epsilon_0 = 8{,}85\\cdot 10^{-12}\\ \\mathrm{F/m}$.</p>`,
        solution: `<p><strong>Passo 0 — Dati in unità SI.</strong></p>
          <p>$$S = 100\\ \\mathrm{cm}^2 = 1{,}00\\cdot 10^{-2}\\ \\mathrm{m}^2, \\qquad d = 0{,}50\\ \\mathrm{mm} = 5{,}0\\cdot 10^{-4}\\ \\mathrm{m}, \\qquad V = 100\\ \\mathrm{V}$$</p>
          <p><strong>Passo 1 — Capacità.</strong></p>
          <p>$$C = \\epsilon_0 \\frac{S}{d} = \\frac{(8{,}85\\cdot 10^{-12})(1{,}00\\cdot 10^{-2})}{5{,}0\\cdot 10^{-4}} = 1{,}77\\cdot 10^{-10}\\ \\mathrm{F} = 177\\ \\mathrm{pF}$$</p>
          <p><strong>Passo 2 — Carica su ciascuna armatura.</strong></p>
          <p>$$Q = CV = (1{,}77\\cdot 10^{-10})(100) = 1{,}77\\cdot 10^{-8}\\ \\mathrm{C} = 17{,}7\\ \\mathrm{nC}$$</p>
          <p><strong>Passo 3 — Campo elettrico.</strong> Il campo fra le armature è uniforme (effetti di bordo trascurati):</p>
          <p>$$E = \\frac{V}{d} = \\frac{100}{5{,}0\\cdot 10^{-4}} = 2{,}0\\cdot 10^{5}\\ \\mathrm{V/m}$$</p>
          <p>Verifica indipendente con $E = \\sigma/\\epsilon_0 = Q/(\\epsilon_0 S)$:</p>
          <p>$$E = \\frac{1{,}77\\cdot 10^{-8}}{(8{,}85\\cdot 10^{-12})(1{,}00\\cdot 10^{-2})} = 2{,}0\\cdot 10^{5}\\ \\mathrm{V/m} \\quad \\checkmark$$</p>
          <p><strong>Passo 4 — Densità di energia.</strong></p>
          <p>$$u_e = \\tfrac{1}{2}\\epsilon_0 E^2 = \\tfrac{1}{2}(8{,}85\\cdot 10^{-12})(2{,}0\\cdot 10^{5})^2 = 0{,}177\\ \\mathrm{J/m^3}$$</p>
          <p><strong>Passo 5 — Energia dalla formula circuitale.</strong></p>
          <p>$$U_e = \\tfrac{1}{2}CV^2 = \\tfrac{1}{2}(1{,}77\\cdot 10^{-10})(100)^2 = 8{,}85\\cdot 10^{-7}\\ \\mathrm{J} = 0{,}885\\ \\mu\\mathrm{J}$$</p>
          <p><strong>Passo 6 — Verifica tramite la densità di energia.</strong> Il volume fra le armature è</p>
          <p>$$\\mathcal{V} = S\\,d = (1{,}00\\cdot 10^{-2})(5{,}0\\cdot 10^{-4}) = 5{,}0\\cdot 10^{-6}\\ \\mathrm{m}^3$$</p>
          <p>$$u_e\\,\\mathcal{V} = (0{,}177)(5{,}0\\cdot 10^{-6}) = 8{,}85\\cdot 10^{-7}\\ \\mathrm{J} \\quad \\checkmark$$</p>
          <p>I due calcoli coincidono, come deve essere perché il campo è uniforme in tutto il volume.</p>`
      },
      {
        id: "s11-es-scritto-2",
        type: "esercizio",
        title: "Scritto 2 — Piano: carica, densità superficiale, energia",
        kind: "scritto",
        source: "integrazione",
        content: `<p>Un condensatore piano nel vuoto ha armature di area $S = 200\\ \\mathrm{cm^2}$ separate da $d = 0{,}50\\ \\mathrm{mm}$ ed è collegato a una tensione $V = 50\\ \\mathrm{V}$. Calcola la capacità $C$, la carica $Q$ su ciascuna armatura, la densità superficiale $\\sigma$, il campo $E$ fra le armature, l'energia $U_e$ e verifica il valore di $U_e$ tramite la densità di energia.</p>`,
        solution: `<p><strong>Dati in unità SI:</strong> $S = 200\\ \\mathrm{cm^2} = 2{,}0\\cdot 10^{-2}\\ \\mathrm{m^2}$, $d = 5{,}0\\cdot 10^{-4}\\ \\mathrm{m}$, $V = 50\\ \\mathrm{V}$.</p>
          <p><strong>Capacità.</strong></p>
          <p>$$C = \\epsilon_0\\frac{S}{d} = 8{,}854\\cdot 10^{-12}\\ \\mathrm{F/m}\\cdot\\frac{2{,}0\\cdot 10^{-2}\\ \\mathrm{m^2}}{5{,}0\\cdot 10^{-4}\\ \\mathrm{m}} = 8{,}854\\cdot 10^{-12}\\cdot 40 \\approx 3{,}5\\cdot 10^{-10}\\ \\mathrm{F} = 354\\ \\mathrm{pF}$$</p>
          <p><strong>Carica.</strong></p>
          <p>$$Q = CV \\approx 3{,}54\\cdot 10^{-10}\\ \\mathrm{F}\\cdot 50\\ \\mathrm{V} \\approx 1{,}8\\cdot 10^{-8}\\ \\mathrm{C} = 17{,}7\\ \\mathrm{nC}$$</p>
          <p><strong>Densità superficiale.</strong></p>
          <p>$$\\sigma = \\frac{Q}{S} \\approx \\frac{1{,}77\\cdot 10^{-8}\\ \\mathrm{C}}{2{,}0\\cdot 10^{-2}\\ \\mathrm{m^2}} \\approx 8{,}85\\cdot 10^{-7}\\ \\mathrm{C/m^2}$$</p>
          <p><strong>Campo.</strong></p>
          <p>$$E = \\frac{V}{d} = \\frac{50\\ \\mathrm{V}}{5{,}0\\cdot 10^{-4}\\ \\mathrm{m}} = 1{,}0\\cdot 10^{5}\\ \\mathrm{V/m}$$</p>
          <p>in accordo con $E = \\sigma/\\epsilon_0 = (8{,}85\\cdot 10^{-7})/(8{,}854\\cdot 10^{-12}) \\approx 1{,}0\\cdot 10^{5}\\ \\mathrm{V/m}$.</p>
          <p><strong>Energia.</strong></p>
          <p>$$U_e = \\tfrac{1}{2}CV^2 \\approx \\tfrac{1}{2}\\cdot 3{,}54\\cdot 10^{-10}\\ \\mathrm{F}\\cdot (50\\ \\mathrm{V})^2 \\approx 4{,}4\\cdot 10^{-7}\\ \\mathrm{J}$$</p>
          <p><strong>Verifica con la densità di energia.</strong></p>
          <p>$$u_e = \\tfrac{1}{2}\\epsilon_0 E^2 = \\tfrac{1}{2}\\cdot 8{,}854\\cdot 10^{-12}\\cdot (1{,}0\\cdot 10^{5})^2 \\approx 4{,}4\\cdot 10^{-2}\\ \\mathrm{J/m^3}$$</p>
          <p>$$\\mathcal{V} = Sd = 2{,}0\\cdot 10^{-2}\\cdot 5{,}0\\cdot 10^{-4} = 1{,}0\\cdot 10^{-5}\\ \\mathrm{m^3}$$</p>
          <p>$$U_e = u_e\\mathcal{V} \\approx 4{,}4\\cdot 10^{-2}\\cdot 1{,}0\\cdot 10^{-5} \\approx 4{,}4\\cdot 10^{-7}\\ \\mathrm{J} \\quad \\checkmark$$</p>
          <p><strong>Controllo delle unità:</strong> $\\mathrm{F/m\\cdot (V/m)^2 = J/m^3}$.</p>`
      },
      {
        id: "s11-es-scritto-3",
        type: "esercizio",
        title: "Scritto 3 — Due condensatori in parallelo",
        kind: "scritto",
        source: "integrazione",
        content: `<p>Due condensatori $C_1 = 3{,}0\\ \\mu\\mathrm{F}$ e $C_2 = 6{,}0\\ \\mu\\mathrm{F}$, inizialmente scarichi, sono collegati in parallelo a una differenza di potenziale $V = 10\\ \\mathrm{V}$. Calcola la capacità equivalente, la tensione e la carica di ciascun condensatore, la carica totale e l'energia immagazzinata, verificando che essa sia la somma delle energie dei due condensatori.</p>`,
        solution: `<p><strong>Capacità equivalente</strong> (stessi due nodi):</p>
          <p>$$C_{eq} = C_1 + C_2 = 3{,}0 + 6{,}0 = 9{,}0\\ \\mu\\mathrm{F}$$</p>
          <p>maggiore della più grande delle due, come previsto.</p>
          <p><strong>Tensioni:</strong> entrambi i condensatori sono collegati agli stessi nodi, quindi $V_1 = V_2 = V = 10\\ \\mathrm{V}$.</p>
          <p><strong>Cariche:</strong></p>
          <p>$$Q_1 = C_1V = (3{,}0\\times10^{-6})(10) = 30\\ \\mu\\mathrm{C}, \\qquad Q_2 = C_2V = (6{,}0\\times10^{-6})(10) = 60\\ \\mu\\mathrm{C}$$</p>
          <p>$$Q_{tot} = Q_1 + Q_2 = 90\\ \\mu\\mathrm{C} = C_{eq}V = (9{,}0\\times10^{-6})(10)\\ \\mathrm{C} \\quad \\checkmark$$</p>
          <p><strong>Energia:</strong></p>
          <p>$$U_e = \\frac{1}{2}C_{eq}V^2 = \\frac{1}{2}(9{,}0\\times10^{-6})(10)^2 = 4{,}5\\times10^{-4}\\ \\mathrm{J} = 0{,}45\\ \\mathrm{mJ}$$</p>
          <p><strong>Verifica:</strong> $\\tfrac12 C_1V^2 = 1{,}5\\times10^{-4}\\ \\mathrm{J}$ e $\\tfrac12 C_2V^2 = 3{,}0\\times10^{-4}\\ \\mathrm{J}$, la cui somma è $4{,}5\\times10^{-4}\\ \\mathrm{J}$: poiché la tensione è comune, le energie si sommano come le capacità.</p>`
      },
      {
        id: "s11-es-scritto-4",
        type: "esercizio",
        title: "Scritto 4 — Serie e parallelo combinati",
        kind: "scritto",
        source: "integrazione",
        content: `<p>Tre condensatori $C_1 = 3{,}0\\ \\mu\\mathrm{F}$, $C_2 = 2{,}0\\ \\mu\\mathrm{F}$, $C_3 = 4{,}0\\ \\mu\\mathrm{F}$, <strong>tutti inizialmente scarichi</strong>, sono collegati come segue: $C_2$ e $C_3$ sono in parallelo fra i nodi $M$ e $B$, e questo parallelo è in serie con $C_1$, collegato fra i nodi $A$ e $M$. Il nodo $M$ non ha altre diramazioni ed è <strong>inizialmente neutro</strong>. Fra $A$ e $B$ è applicata la tensione $V = 30\\ \\mathrm{V}$.</p>
          <p>Calcolare la capacità equivalente, la carica e la tensione di ciascun condensatore e l'energia totale, verificando che essa sia la somma delle energie dei singoli condensatori.</p>`,
        solution: `<p><strong>Passo 1 — Parallelo di $C_2$ e $C_3$</strong> (stessi due nodi $M$ e $B$, dunque stessa tensione):</p>
          <p>$$C_{23} = C_2 + C_3 = 2{,}0 + 4{,}0 = 6{,}0\\ \\mu\\mathrm{F}$$</p>
          <p><strong>Passo 2 — Serie di $C_1$ con $C_{23}$.</strong></p>
          <p>$$\\frac{1}{C_{eq}} = \\frac{1}{3{,}0} + \\frac{1}{6{,}0} = \\frac{1}{2{,}0}\\ (\\mu\\mathrm{F})^{-1} \\quad\\Longrightarrow\\quad C_{eq} = 2{,}0\\ \\mu\\mathrm{F}$$</p>
          <p>minore della più piccola delle due capacità in serie, come previsto.</p>
          <p><strong>Passo 3 — Carica comune nella serie.</strong> Poiché i condensatori sono inizialmente scarichi e il nodo $M$ è isolato, inizialmente neutro e senza diramazioni, la sua carica totale resta nulla: la grandezza comune nella serie è dunque la carica.</p>
          <p>$$Q = C_{eq}V = (2{,}0\\cdot 10^{-6})(30) = 6{,}0\\cdot 10^{-5}\\ \\mathrm{C} = 60\\ \\mu\\mathrm{C}$$</p>
          <p><strong>Passo 4 — Tensioni sui due blocchi in serie.</strong></p>
          <p>$$V_1 = \\frac{Q}{C_1} = \\frac{60}{3{,}0} = 20\\ \\mathrm{V}, \\qquad V_{23} = \\frac{Q}{C_{23}} = \\frac{60}{6{,}0} = 10\\ \\mathrm{V}$$</p>
          <p>Verifica: $V_1 + V_{23} = 20 + 10 = 30\\ \\mathrm{V} = V$ $\\checkmark$</p>
          <p><strong>Passo 5 — Cariche nel parallelo.</strong> La tensione è comune e le cariche si dividono in proporzione alle capacità:</p>
          <p>$$Q_2 = C_2 V_{23} = (2{,}0)(10) = 20\\ \\mu\\mathrm{C}, \\qquad Q_3 = C_3 V_{23} = (4{,}0)(10) = 40\\ \\mu\\mathrm{C}$$</p>
          <p>con $Q_2 + Q_3 = 60\\ \\mu\\mathrm{C} = Q$, come richiede la conservazione della carica sul conduttore isolato che contiene il nodo $M$. Inoltre $Q_1 = Q = 60\\ \\mu\\mathrm{C}$.</p>
          <p><strong>Passo 6 — Energia totale.</strong></p>
          <p>$$U_e = \\tfrac{1}{2}C_{eq}V^2 = \\tfrac{1}{2}(2{,}0\\cdot 10^{-6})(30)^2 = 9{,}0\\cdot 10^{-4}\\ \\mathrm{J} = 900\\ \\mu\\mathrm{J}$$</p>
          <p><strong>Passo 7 — Verifica per componenti.</strong></p>
          <p>$$U_1 = \\tfrac{1}{2}C_1V_1^2 = \\tfrac{1}{2}(3{,}0\\cdot 10^{-6})(20)^2 = 600\\ \\mu\\mathrm{J}$$</p>
          <p>$$U_2 = \\tfrac{1}{2}C_2V_{23}^2 = \\tfrac{1}{2}(2{,}0\\cdot 10^{-6})(10)^2 = 100\\ \\mu\\mathrm{J}$$</p>
          <p>$$U_3 = \\tfrac{1}{2}C_3V_{23}^2 = \\tfrac{1}{2}(4{,}0\\cdot 10^{-6})(10)^2 = 200\\ \\mu\\mathrm{J}$$</p>
          <p>La somma è $600 + 100 + 200 = 900\\ \\mu\\mathrm{J}$, in accordo col calcolo globale. $\\checkmark$</p>`
      }
    ],

    oral_cards: [

        back: "Dato un sistema di due conduttori (armature) che portano cariche opposte $+Q$ e $-Q$, con differenza di potenziale $\\Delta V = V_+ - V_- \\gt 0$, si definisce $C = Q/\\Delta V$. Attenzione: $Q$ è il <strong>modulo della carica su ciascuna armatura</strong>, non la carica totale del sistema, che è nulla. $C$ dipende solo dalla geometria e dal mezzo interposto, non da $Q$ né da $\\Delta V$. Unità SI: farad, $1\\ \\mathrm{F} = 1\\ \\mathrm{C}/\\mathrm{V}$ (unità molto grande: in pratica si usano $\\mu$F, nF, pF)."

      {
        type: "dimostrazione",
        front: "Mostra che il condensatore cilindrico si riduce a quello piano per armature vicine.",
        back: "Con $d = R_2 - R_1 \\ll R_1$ si ha $\\frac{R_2}{R_1} = 1 + \\frac{d}{R_1}$ e, per lo sviluppo $\\ln(1+x) \\approx x$, $\\ln(R_2/R_1) \\approx d/R_1$. Allora $C \\approx \\frac{2\\pi\\epsilon_0 h}{d/R_1} = \\frac{\\epsilon_0 (2\\pi R_1 h)}{d} = \\epsilon_0 \\frac{S}{d}$, riconoscendo $S = 2\\pi R_1 h$. Lo stesso accade per lo sferico con $h = R_2 - R_1 \\ll R_1$: $C \\approx \\epsilon_0 \\frac{4\\pi R^2}{h} = \\epsilon_0 S/h$."
      },
      {
        type: "tranello",
        front: "La condizione per trascurare gli effetti di bordo in un condensatore piano è $d \\ll \\sqrt{S}$. Sempre corretta?",
        back: "No. La condizione corretta è che $d$ sia molto minore della <strong>minima dimensione laterale</strong>: per una lastra rettangolare di lati $a$ e $b$, $d \\ll \\min(a,b)$. La scrittura $d \\ll \\sqrt{S}$ vale solo se le due dimensioni laterali sono confrontabili: per armature molto allungate un'area grande può accompagnarsi a una larghezza confrontabile con $d$, e gli effetti di bordo diventano importanti."
      },
      {
        type: "tranello",
        front: "Due condensatori hanno la stessa tensione: sono necessariamente in parallelo?",
        back: "No. La definizione di parallelo è <strong>topologica</strong>: entrambi i terminali devono essere connessi agli <em>stessi due nodi</em> $A$ e $B$. L'uguaglianza delle tensioni è una <em>conseguenza</em> (i nodi sono equipotenziali), non la definizione: due condensatori in rami diversi possono avere per caso la stessa tensione senza essere in parallelo. Analogamente, nella serie l'uguaglianza delle cariche è conseguenza della conservazione della carica sul nodo intermedio, non della definizione."
      },
      {
        type: "domanda",
        front: "Nella serie di due condensatori, quali ipotesi servono per dire che portano la stessa carica $Q$?",
        back: "Servono tre ipotesi: (i) i condensatori sono <strong>inizialmente scarichi</strong>; (ii) il nodo intermedio $B$ è <strong>elettricamente isolato</strong> e <strong>inizialmente neutro</strong>; (iii) da $B$ non partono <strong>altre diramazioni</strong>. L'isolamento da solo garantisce solo la <em>conservazione</em> della carica del nodo: è la neutralità iniziale che permette di concludere che la carica totale del nodo resta <em>nulla</em>, e quindi che se su una faccia compare $-Q$ sull'altra compare $+Q$."
      },
      {
        type: "domanda",
        front: "Un generatore collegato a una serie di condensatori: come nascono $+Q$ e $-Q$ sui terminali esterni?",
        back: "Il generatore <strong>trasferisce</strong> carica dal terminale $C$ al terminale $A$: compare $+Q$ in $A$ e $-Q$ in $C$, e il sistema resta <strong>globalmente neutro</strong>. Depositare soltanto $+Q$ su un sistema inizialmente neutro non produrrebbe una configurazione neutra — l'induzione non crea carica netta negativa sull'ultimo conduttore, la ridistribuisce soltanto. Note le cariche ai terminali esterni, quelle interne si ricavano dalla neutralità del nodo intermedio $B$."
      },
      {
        type: "formula",
        front: "Formule della capacità equivalente in serie e in parallelo. Quale grandezza è comune nei due casi?",
        back: "<strong>Parallelo</strong> (stessi due nodi): $C_{eq} = \\sum_i C_i$; la grandezza comune è la <strong>tensione</strong>, le cariche si ripartiscono in proporzione <em>diretta</em> alle capacità, e $C_{eq}$ è maggiore della più grande.<br><strong>Serie</strong> (nodi intermedi isolati e neutri): $\\frac{1}{C_{eq}} = \\sum_i \\frac{1}{C_i}$, per due $C_{eq} = \\frac{C_1C_2}{C_1+C_2}$; la grandezza comune è la <strong>carica</strong>, le tensioni si ripartiscono in proporzione <em>inversa</em>, e $C_{eq}$ è minore della più piccola. Nella serie la tensione maggiore cade sul condensatore più piccolo: dato critico per la tenuta dielettrica."
      },
      {
        type: "dimostrazione",
        front: "Ricava $U_e = Q^2/(2C)$. Da dove viene il fattore $1/2$? Di chi è il lavoro?",
        back: "Processo <strong>quasi-statico e senza dissipazioni</strong>: un agente esterno trasferisce lentamente $dQ'$ da un'armatura all'altra, vincendo la d.d.p. istantanea $V' = Q'/C$. Il lavoro esterno è $dW_{\\text{est}} = +V'dQ' = dU$, mentre quello del campo è $dW_{\\text{campo}} = -V'dQ'$: i due hanno <strong>segno opposto</strong> ed è il lavoro esterno ad accumularsi come energia potenziale. Integrando: $U_e = \\int_0^Q \\frac{Q'}{C}dQ' = \\frac{Q^2}{2C} = \\frac12 CV^2 = \\frac12 QV$. Il fattore $\\frac12$ viene dall'integrazione: la tensione cresce da $0$ a $V$, quindi il lavoro è $\\frac12 QV$ (valore medio), non $QV$."
      },
      {
        type: "tranello",
        front: "$U_e = Q^2/(2C)$ è sempre l'energia totale del sistema?",
        back: "No. Nei <strong>modelli ideali senza effetti di bordo</strong> (es. condensatore sferico concentrico, piano indefinito) descrive l'energia del campo confinato fra le armature. Per un condensatore finito, calcolata con la capacità effettiva, comprende anche l'energia del campo di bordo: la sola neutralità totale non annulla il campo esterno. Nel caso sferico con <strong>guscio neutro e isolato</strong>, invece, non è l'energia totale: su $r=R_3$ c'è $+Q$ e all'esterno esiste un campo coulombiano, che aggiunge $U_{\\text{est}} = \\frac{Q^2}{8\\pi\\epsilon_0 R_3}$, cosicché $U_{\\text{tot}} = \\frac{Q^2}{2C} + \\frac{Q^2}{8\\pi\\epsilon_0 R_3}$."
      },
      {
        type: "dimostrazione",
        front: "Ricava la densità di energia del campo elettrostatico nel vuoto partendo dal condensatore piano.",
        back: "Con $C = \\epsilon_0 S/d$ e $V = Ed$: $U_e = \\frac12 CV^2 = \\frac12 \\epsilon_0 \\frac{S}{d}(Ed)^2 = \\frac12 \\epsilon_0 E^2 (S\\cdot d)$. Poiché $S\\cdot d = \\mathcal{V}$ è il volume in cui il campo è non nullo, dividendo si ottiene $u_e = \\frac12 \\epsilon_0 E^2$ ($\\mathrm{J/m^3}$). Da notare: la derivazione mostra la consistenza nel caso particolare, <strong>non dimostra</strong> la validità generale, che verrà giustificata in seguito. Per un dielettrico lineare omogeneo isotropo si sostituisce $\\epsilon = \\epsilon_0\\epsilon_r$."
      },
      {
        type: "tranello",
        front: "Si può sempre scrivere $u_e = U_e/\\mathcal{V}$?",
        back: "No: $U_e/\\mathcal{V}$ è una densità <strong>media</strong>, la grandezza fisica è quella <strong>locale</strong> $u_e(\\vec{r}) = \\frac12\\epsilon_0|\\vec{E}(\\vec{r})|^2$. Le due coincidono solo se il campo è <em>uniforme</em> (condensatore piano ideale). Per campo non uniforme (carica puntiforme, condensatore sferico) $u_e$ varia punto per punto e $U_e/\\mathcal{V}$ è solo un valor medio: vale la legge locale più l'integrazione $U_e = \\int_{\\mathcal{V}} u_e\\,d\\mathcal{V}$, ma <strong>non</strong> $u_e = U_e/\\mathcal{V}$."
      },
      {
        type: "domanda",
        front: "Dove si pone lo zero del potenziale in una geometria cilindrica?",
        back: "Dipende dal caso. <strong>Singolo filo/cilindro infinito con $\\lambda \\neq 0$</strong>: il campo va come $1/r$, il potenziale diverge logaritmicamente all'infinito, quindi non si può porre $V(\\infty)=0$; si usa un riferimento a distanza finita e si lavora con differenze. <strong>Condensatore coassiale globalmente neutro</strong>: carica lineare netta nulla, nel limite ideale il campo esterno è nullo, il potenziale esterno è costante e lo si può porre a zero. Per un condensatore reale finito il campo lontano decade abbastanza rapidamente e si adotta $V(\\infty)=0$."
      },
      {
        type: "domanda",
        front: "La capacità di un condensatore piano dipende dalla carica immagazzinata?",
        back: "No. $C = \\epsilon_0 S/d$ dipende <strong>solo</strong> dalla geometria ($S$ e $d$) e dal mezzo interposto ($\\epsilon_0$ nel vuoto, $\\epsilon = \\epsilon_0\\epsilon_r$ con un dielettrico che riempie lo spazio fra le armature). Il motivo: il campo, e con esso $\\Delta V$, è <em>proporzionale</em> a $Q$, quindi il rapporto $Q/\\Delta V$ è una costante caratteristica del dispositivo, indipendente sia da $Q$ sia da $V$."
      }
    ]
};
