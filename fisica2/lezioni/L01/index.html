        content: `<p>Iniziamo a definire il concetto di campo elettrostatico. Supponiamo di avere una carica $Q$ grande. Abbiamo già definito la forza di Coulomb che essa esercita su una seconda carica $q$ come</p>
        <p>$$\\vec{F} = \\frac{1}{4\\pi\\varepsilon_0} \\frac{Q q}{r^2} \\hat{r}$$</p>
        <p>Fissiamo con precisione il significato dei simboli, perché da esso dipende tutto il seguito:</p>
        <ul>
          <li>$Q$ e $q$ sono le cariche <strong>algebriche</strong> (possono essere positive o negative), misurate in coulomb (C);</li>
          <li>$r \\gt 0$ è la distanza tra la carica sorgente e il <strong>punto di osservazione</strong>, cioè il punto in cui si trova la carica su cui si valuta la forza;</li>

        <p>Con questa convenzione <strong>il segno del prodotto $Qq$ contiene tutta l'informazione sul verso</strong>: se $Qq \\gt 0$ la forza è concorde con $\\hat{r}$ (repulsiva, allontana dalla sorgente); se $Qq \\lt 0$ è opposta a $\\hat{r}$ (attrattiva, punta verso la sorgente).</p>
        <p>Ora immaginiamo che la carica $Q$ sia molto grande, mentre abbiamo un'altra carica $q$ molto piccola. La carica $Q$ è la <strong>sorgente</strong> del campo, mentre $q$ è una <strong>carica di prova</strong> che usiamo per sondare lo spazio.</p>`

        title: "Definizione di Campo Elettrostatico",
        icon: "📐",
        content: `<p>Possiamo definire il campo elettrostatico $\\vec{E}$ prodotto dalla carica sorgente $Q$ in un punto dello spazio $P$ come il rapporto tra la forza $\\vec{F}$ che agisce su una carica di prova $q$ posta in $P$ e la carica di prova stessa.</p>`,
        subsections: [
          {
            subtitle: "Definizione — Campo elettrostatico",
            content: `<p>Il campo elettrostatico $\\vec{E}$ generato da una carica sorgente in un punto $P$ dello spazio è definito come la forza di Coulomb $\\vec{F}$ che agirebbe su una carica di prova puntiforme $q \\neq 0$ posta in quel punto, divisa per il valore <strong>algebrico</strong> della carica di prova stessa:</p>
            <p>$$\\vec{E} = \\frac{\\vec{F}}{q} , \\qquad q \\neq 0$$</p>
            <p>Questa relazione vettoriale è valida per <strong>entrambi i segni</strong> di $q$: se $q \\gt 0$ il campo ha lo stesso verso della forza, se $q \\lt 0$ il campo ha verso opposto a quello della forza. Passando ai moduli si ottiene</p>
            <p>$$E = \\frac{F}{|q|}$$</p>
            <p>dove il valore assoluto garantisce che il modulo del campo sia, come deve essere, una quantità positiva. Nel seguito, quando non specificato diversamente, si assume per comodità una carica di prova positiva ($q \\gt 0$), così che $\\vec{E}$ e $\\vec{F}$ risultino sempre paralleli e concordi e si possa scrivere $E = F/q$.</p>
            <p>L'<strong>unità di misura</strong> del campo elettrostatico nel Sistema Internazionale è il newton su coulomb, $\\mathrm{N/C}$.</p>`
          },
          {
            subtitle: "La carica di prova si semplifica",
            content: `<p>Sostituendo l'espressione della forza di Coulomb nella definizione, il fattore $q$ della carica di prova si semplifica:</p>
            <p>$$\\vec{E} = \\frac{1}{q} \\left( \\frac{1}{4\\pi\\varepsilon_0} \\frac{Q q}{r^2} \\hat{r} \\right) = \\frac{1}{4\\pi\\varepsilon_0} \\frac{Q}{r^2} \\hat{r}$$</p>
            <p>Questo è il <strong>risultato centrale</strong> di questa prima parte: la carica di prova è scomparsa dal risultato finale. Il campo è dunque una <strong>proprietà dello spazio</strong> dovuta <em>soltanto</em> alla sorgente $Q$, e non dipende dalla sonda che usiamo per misurarlo.</p>`
          },
          {
            subtitle: "Proposizione — Campo di una carica puntiforme",
            content: `<p>Una carica puntiforme $Q$ (algebrica) genera, in un punto $P$ posto a distanza $r \\gt 0$ da essa, il campo elettrostatico</p>
            <p>$$\\vec{E} = \\frac{1}{4\\pi\\varepsilon_0} \\frac{Q}{r^2} \\hat{r}$$</p>
            <p>dove $\\hat{r}$ è il versore diretto dalla carica $Q$ verso il punto $P$. Il modulo è</p>
            <p>$$E = \\frac{1}{4\\pi\\varepsilon_0} \\frac{|Q|}{r^2}$$</p>
            <p>e il campo è diretto <strong>secondo</strong> $\\hat{r}$ (uscente dalla sorgente) se $Q \\gt 0$, <strong>in senso opposto</strong> a $\\hat{r}$ (entrante nella sorgente) se $Q \\lt 0$. La formula <strong>non è definita per $r = 0$</strong>, cioè nella posizione della carica stessa.</p>`
          }
        ],
        formulas: [
          { label: "Definizione di campo (vettoriale)", latex: "\\vec{E} = \\frac{\\vec{F}}{q}, \\qquad q \\neq 0" },
          { label: "Definizione di campo (moduli)", latex: "E = \\frac{F}{|q|}" },
          { label: "Campo di una carica puntiforme", latex: "\\vec{E} = \\frac{1}{4\\pi\\varepsilon_0} \\frac{Q}{r^2} \\hat{r}" }
        ],
        extra_content: `<p>L'idea è questa: io metto una carica $Q$ grande nello spazio. Questa carica mi produce una <strong>perturbazione dello spazio circostante</strong>, un qualcosa di misterioso che definisco come campo elettrostatico. Per capire come è fatto questo campo, devo mettere nello spazio una sonda, un «probe».</p>`
      },

      {
        id: "s11-analogia-torta",
        type: "note_box",
        title: "Analogia della torta (e perché la sonda deve essere piccola)",
        icon: "🍰",
        content: `<p>Immaginate vostra madre o vostro padre che prepara una torta. Come fa a capire se la torta è pronta? Infila uno <strong>stuzzicadenti</strong>. Perché non usa un cucchiaio grosso o un mestolo? Perché vuole usare qualcosa di piccolino che non perturba lo stato della torta, che non la distrugge. Lo stuzzicadenti perturba un po' la torta, ma in modo <strong>trascurabile</strong>, e le permette di capire com'è fatta dentro.</p>
        <p>La stessa cosa facciamo qui. La carica grande $Q$ è la nostra «torta», che modifica lo spazio. Per misurare questa modifica (il campo elettrostatico) usiamo uno «stuzzicadenti»: una carica di prova $q$ piccolissima. La mettiamo in un punto $P$ e misuriamo la forza che subisce. Questa carica di prova deve essere abbastanza piccola da non perturbare significativamente il campo che vogliamo misurare: più piccola è, più veritiera sarà la nostra misura del campo generato solo da $Q$.</p>`,
        quote: {
          text: "Uno studente ha chiesto: «Ma se metto una carica puntiforme per misurare il campo di altre cariche puntiformi, non perturbo comunque il sistema?». La risposta è sì. Ogni volta che facciamo una misura, un esperimento, noi perturbiamo sempre il sistema. Anche con la torta, il buchetto rimane. Non ci possiamo fare niente. Il nostro lavoro come fisici e sperimentali è quello di perturbare il sistema il meno possibile.",
          src: "Nota del Prof."
        }
      },

      {
        id: "s12-linee-campo",
        type: "section",
        title: "Linee di Campo per una Carica Puntiforme",
        icon: "🧭",

        <p>Nella figura ogni vettore ha la <strong>coda nel punto a cui si riferisce</strong> ed è diretto radialmente verso l'esterno, lungo il prolungamento della congiungente sorgente–punto (linee tratteggiate).</p>
        <p>Se invece la carica sorgente è negativa, $Q \\lt 0$, la forza sulla carica di prova positiva sarà attrattiva. Di conseguenza il campo elettrostatico $\\vec{E}$ sarà un vettore che punta <strong>radialmente verso l'interno</strong>, cioè verso la carica $Q \\lt 0$, in verso opposto a $\\hat{r}$. Si noti che qui $Q$ è la carica algebrica: il modulo della carica è $|Q|$.</p>

        <p>Anche qui ogni vettore parte dal punto a cui si riferisce (coda in $P$, in $A$, in $B$) ed è diretto radialmente verso l'interno, cioè verso la sorgente.</p>`,
        extra_content: `<p><strong>Da ricordare.</strong> Il campo elettrostatico generato da una carica puntiforme è di tipo <strong>radiale</strong>. C'è un punto in cui il campo non è definito: il punto stesso in cui si trova la carica, dove la distanza $r$ va a zero e si ha una <strong>singolarità</strong>. A distanza infinita, invece, il campo tende asintoticamente a zero come $1/r^2$.</p>`
      },

      {
        id: "s13-sovrapposizione",
        type: "section",
        title: "Principio di Sovrapposizione",
        icon: "➕",
        content: `<p>Cosa succede se abbiamo un sistema di $N$ cariche puntiformi $Q_1, Q_2, \\dots, Q_N$? Ognuna di queste cariche produce un proprio campo elettrostatico in tutto lo spazio. Per calcolare il campo totale in un punto $P$ si applica il <strong>principio di sovrapposizione</strong>.</p>`,
        subsections: [
          {
            subtitle: "Proposizione — Principio di sovrapposizione",
            content: `<p>Il campo elettrostatico totale $\\vec{E}_{tot}$ in un punto $P$, generato da un sistema di $N$ cariche puntiformi, è dato dalla <strong>somma vettoriale</strong> dei campi elettrostatici che ogni singola carica genererebbe in quel punto <em>in assenza delle altre</em>:</p>
            <p>$$\\vec{E}_{tot} = \\vec{E}_1 + \\vec{E}_2 + \\dots + \\vec{E}_N = \\sum_{i=1}^{N} \\vec{E}_i = \\frac{1}{4\\pi\\varepsilon_0} \\sum_{i=1}^{N} \\frac{Q_i}{r_i^2} \\hat{r}_i$$</p>
            <p>dove $r_i$ è la distanza della $i$-esima carica dal punto $P$ e $\\hat{r}_i$ è il versore diretto da $Q_i$ verso $P$.</p>`
          },
          {
            subtitle: "Ricetta operativa in quattro passi",
            content: `<p>In pratica si procede sempre nello stesso modo:</p>
            <ol>
              <li>si individua, per ogni carica, la congiungente $Q_i \\to P$ e quindi la distanza $r_i$ e il versore $\\hat{r}_i$;</li>
              <li>si calcola il <strong>modulo</strong> di ciascun contributo, $E_i = \\dfrac{1}{4\\pi\\varepsilon_0}\\dfrac{|Q_i|}{r_i^2}$;</li>
              <li>si assegna il <strong>verso</strong>: lungo $\\hat{r}_i$ (uscente da $Q_i$) se $Q_i \\gt 0$, opposto se $Q_i \\lt 0$;</li>
              <li>si <strong>scompongono</strong> i vettori in componenti cartesiane e si sommano separatamente le $x$ e le $y$.</li>
            </ol>

            <p>La figura mostra la costruzione geometrica per quattro cariche positive: poiché tutte le cariche sono positive, ogni $\\vec{E}_i$ giace sulla congiungente $Q_i P$ (tratteggiata) ed è diretto <em>da $Q_i$ verso $P$</em>, cioè uscente dalla sorgente. Le lunghezze, nell'ipotesi di quattro cariche di uguale valore assoluto, sono proporzionali a $1/r_i^2$: il contributo più intenso è quello della carica più vicina ($Q_3$), il più debole quello della carica più lontana ($Q_4$).</p>`
          }
        ],
        formulas: [
          { label: "Sovrapposizione", latex: "\\vec{E}_{tot} = \\frac{1}{4\\pi\\varepsilon_0} \\sum_{i=1}^{N} \\frac{Q_i}{r_i^2} \\hat{r}_i" }
        ]
      },

      {
        id: "s14-integrazione-esempio-due-cariche",
        type: "integrazione_box",
        title: "Integrazione — non detto dal docente",
        icon: "➕",
        content: `<p><strong>Esempio illustrativo: sovrapposizione di due cariche.</strong> Questo esempio non è stato svolto a lezione: serve a mostrare concretamente come si passa dalle posizioni e dai segni delle cariche alle componenti del campo totale.</p>
        <p>Consideriamo due cariche poste nel piano $xy$ (coordinate in metri):</p>
        <p>$$Q_1 = +5{,}0\\ \\mathrm{nC} \\ \\text{in } A=(0;\\,0), \\qquad Q_2 = -5{,}0\\ \\mathrm{nC} \\ \\text{in } B=(0{,}30;\\,0)$$</p>
        <p>e calcoliamo il campo totale nel punto $P=(0{,}30;\\,0{,}40)$.</p>
        <p><strong>Passo 1 — distanze e versori.</strong></p>
        <p>$$\\vec{r}_1 = P - A = (0{,}30;\\,0{,}40), \\quad r_1 = \\sqrt{0{,}30^2+0{,}40^2} = 0{,}50\\ \\mathrm{m}, \\quad \\hat{r}_1 = (0{,}60;\\,0{,}80)$$</p>
        <p>$$\\vec{r}_2 = P - B = (0;\\,0{,}40), \\quad r_2 = 0{,}40\\ \\mathrm{m}, \\quad \\hat{r}_2 = (0;\\,1)$$</p>
        <p><strong>Passo 2 — moduli.</strong> Con $\\dfrac{1}{4\\pi\\varepsilon_0} = 8{,}99\\times 10^{9}\\ \\mathrm{N\\,m^2/C^2}$:</p>
        <p>$$E_1 = \\frac{1}{4\\pi\\varepsilon_0}\\frac{|Q_1|}{r_1^2} = \\frac{(8{,}99\\times 10^{9})(5{,}0\\times 10^{-9})}{0{,}25} \\simeq 1{,}80\\times 10^{2}\\ \\mathrm{N/C}$$</p>
        <p>$$E_2 = \\frac{1}{4\\pi\\varepsilon_0}\\frac{|Q_2|}{r_2^2} = \\frac{(8{,}99\\times 10^{9})(5{,}0\\times 10^{-9})}{0{,}16} \\simeq 2{,}81\\times 10^{2}\\ \\mathrm{N/C}$$</p>
        <p><strong>Passo 3 — versi.</strong> $Q_1 \\gt 0$, quindi $\\vec{E}_1$ è concorde con $\\hat{r}_1$ (uscente da $A$, verso l'alto a destra); $Q_2 \\lt 0$, quindi $\\vec{E}_2$ è opposto a $\\hat{r}_2$, cioè diretto <em>da $P$ verso $B$</em>, verso il basso.</p>
        <p><strong>Passo 4 — componenti e somma.</strong></p>
        <p>$$\\vec{E}_1 = E_1\\,\\hat{r}_1 \\simeq (108;\\ 144)\\ \\mathrm{N/C}, \\qquad \\vec{E}_2 = -E_2\\,\\hat{r}_2 \\simeq (0;\\ -281)\\ \\mathrm{N/C}$$</p>
        <p>$$\\vec{E}_{tot} = \\vec{E}_1 + \\vec{E}_2 \\simeq (108;\\ -137)\\ \\mathrm{N/C}$$</p>
        <p>Modulo e direzione del campo risultante:</p>
        <p>$$E_{tot} = \\sqrt{108^2 + 137^2} \\simeq 1{,}7\\times 10^{2}\\ \\mathrm{N/C}, \\qquad \\theta = \\arctan\\!\\left(\\frac{-137}{108}\\right) \\simeq -52^{\\circ}$$</p>
        <p>rispetto all'asse $x$: il campo totale punta verso destra e verso il basso.</p>

        content: `<p>E se abbiamo infinite cariche, ad esempio distribuite su un corpo continuo? Supponiamo di avere un oggetto di forma qualsiasi, un «corpo rigido» che contiene una carica totale $Q$ distribuita al suo interno.</p>

        <p>L'elemento illustrato in figura è <strong>positivo</strong> ($dq \\gt 0$): il contributo $d\\vec{E}$ ha la coda in $P$ ed è parallelo alla congiungente $dq \\to P$, cioè diretto allontanandosi dall'elemento sorgente. Se l'elemento fosse negativo, la freccia andrebbe invertita (da $P$ verso $dq$).</p>
        <p>Come facciamo a calcolare il campo in un punto $P$? L'idea è di <strong>suddividere il corpo in un numero infinito di pezzettini infinitesimali</strong>. Prendiamo una porzione infinitesima di questo corpo, un cubetto piccolissimo: questo cubetto conterrà una carica infinitesima $dq$.</p>
        <p>Questa carica $dq$ può essere trattata come una carica puntiforme, e quindi genererà nel punto $P$ un campo elettrostatico infinitesimo</p>
        <p>$$d\\vec{E} = \\frac{1}{4\\pi\\varepsilon_0} \\frac{dq}{r^2} \\hat{r}$$</p>
        <p>dove $r$ è la distanza tra l'elemento $dq$ e il punto $P$, e $\\hat{r}$ è il versore che va <em>da $dq$ verso $P$</em>. È essenziale notare che, mentre $P$ resta fisso, <strong>sia $r$ sia $\\hat{r}$ cambiano</strong> man mano che scegliamo elementi $dq$ diversi all'interno del corpo: sono funzioni della posizione della sorgente.</p>
        <p>Il campo totale $\\vec{E}$ generato da tutta la distribuzione di carica sarà la «somma» di tutti questi contributi infinitesimali. La somma di infiniti termini infinitesimali è un <strong>integrale</strong>.</p>`,
        subsections: [
          {
            subtitle: "Proposizione — Campo di una distribuzione continua",
            content: `<p>Sia $\\mathcal{V}$ la regione (volume, superficie o linea) occupata dalla carica, e sia $P$ un punto fissato dello spazio. Il campo elettrostatico generato in $P$ dalla distribuzione continua è dato dall'integrale dei campi infinitesimali $d\\vec{E}$ prodotti da ciascun elemento di carica $dq$:</p>
            <p>$$\\vec{E}(P) = \\int_{\\mathcal{V}} d\\vec{E} = \\frac{1}{4\\pi\\varepsilon_0} \\int_{\\mathcal{V}} \\frac{dq}{r^2}\\, \\hat{r}$$</p>
            <p>dove per ogni elemento $dq$ la distanza $r = r(dq, P)$ e il versore $\\hat{r} = \\hat{r}(dq, P)$ sono misurati dalla posizione di quell'elemento al punto $P$.</p>
            <p><strong>Attenzione:</strong> poiché $r$ e $\\hat{r}$ dipendono dalla variabile di integrazione, <em>non</em> possono essere portati fuori dall'integrale. In particolare l'integrale è <strong>vettoriale</strong> e in pratica si risolve componente per componente.</p>`
          }
        ],
        formulas: [
          { label: "Contributo infinitesimo", latex: "d\\vec{E} = \\frac{1}{4\\pi\\varepsilon_0} \\frac{dq}{r^2} \\hat{r}" },
          { label: "Campo di una distribuzione continua", latex: "\\vec{E}(P) = \\frac{1}{4\\pi\\varepsilon_0} \\int_{\\mathcal{V}} \\frac{dq}{r^2}\\, \\hat{r}" }
        ],
        extra_content: `<p><strong>Osservazione.</strong> Risolvere questo integrale per una forma geometrica strana è molto difficile, se non impossibile analiticamente. Tuttavia, per distribuzioni di carica con particolari <strong>simmetrie</strong> (sferiche, cilindriche, piane) il calcolo diventa fattibile e ci permetterà di trovare il campo elettrostatico in modo esatto. I casi notevoli (filo carico, anello, disco, sfera) verranno svolti esplicitamente nelle lezioni successive.</p>`

      {

        title: "Integrazione — non detto dal docente",
        icon: "➕",
        content: `<p><strong>Come si rende operativa la formula.</strong> Per calcolare effettivamente l'integrale occorre esprimere $dq$ in funzione delle variabili geometriche, tramite le <strong>densità di carica</strong>:</p>
        <p>$$dq = \\rho\\, dV \\quad \\text{(distribuzione di volume, } \\rho \\text{ in } \\mathrm{C/m^3})$$</p>
        <p>$$dq = \\sigma\\, dA \\quad \\text{(distribuzione superficiale, } \\sigma \\text{ in } \\mathrm{C/m^2})$$</p>
        <p>$$dq = \\lambda\\, d\\ell \\quad \\text{(distribuzione lineare, } \\lambda \\text{ in } \\mathrm{C/m})$$</p>
        <p>Per una distribuzione di volume, per esempio, si scrive</p>
        <p>$$\\vec{E}(P) = \\frac{1}{4\\pi\\varepsilon_0} \\int_{\\mathcal{V}} \\frac{\\rho\\, dV}{r^2}\\, \\hat{r}$$</p>
        <p>e la carica totale è $Q = \\int_{\\mathcal{V}} \\rho\\, dV$.</p>
        <p>Il procedimento tipico è: si scelgono coordinate adatte alla simmetria del problema, si esprimono $r$ e le componenti di $\\hat{r}$ in funzione di tali coordinate, si proiettano i contributi sugli assi e si integra componente per componente, sfruttando le eventuali simmetrie per annullare a priori alcune componenti.</p>`

      {
        id: "s18-es-teoria-1",
        type: "esercizio",
        title: "Teoria 1",
        kind: "teoria",
        source: "integrazione",
        icon: "✎",
        content: `<p>Che cosa significa che il campo elettrostatico è <strong>conservativo</strong>? Scrivi la proprietà del lavoro della forza elettrostatica lungo un cammino da $A$ a $B$ e deduci quanto vale il lavoro lungo un percorso chiuso.</p>`,
        solution: `<p><strong>Definizione.</strong> Un campo di forze si dice conservativo se il lavoro che esso compie per spostare la «sorgente di prova» (qui una carica $q$) da un punto $A$ a un punto $B$ dipende solo dai punti estremi e non dal cammino seguito: $L_{A\\to B}=f(A,B)$, senza dipendenza dal percorso.</p>
        <p><strong>Conseguenza immediata.</strong> Se si va da $A$ a $B$ lungo un cammino $\\gamma_1$ e si torna da $B$ ad $A$ lungo un cammino $\\gamma_2$, si ha</p>
        <p>$$L_{\\gamma_1}(A\\to B)=L_{\\gamma_2}(A\\to B)=-L_{\\gamma_2}(B\\to A)$$</p>
        <p>e quindi il lavoro totale lungo la linea chiusa è nullo:</p>
        <p>$$\\oint \\vec{F}\\cdot d\\vec{s}=0 \\quad \\Rightarrow \\quad \\oint \\vec{E}\\cdot d\\vec{s}=0$$</p>
        <p>(la seconda si ottiene dividendo per la carica di prova $q$).</p>
        <p><strong>Ulteriore conseguenza.</strong> Questo permette di definire un'energia potenziale $U$ (e quindi un potenziale $V=U/q$) tale che $L_{A\\to B}=U(A)-U(B)$.</p>
        <p><strong>Limiti di validità.</strong> La proprietà vale per il campo <em>elettrostatico</em>, cioè generato da cariche ferme; non vale in generale per i campi elettrici variabili nel tempo.</p>`
      },

      {
        id: "s19-es-teoria-2",
        type: "esercizio",
        title: "Teoria 2",
        kind: "teoria",
        source: "integrazione",
        icon: "✎",
        content: `<p>Enuncia la definizione di campo elettrostatico $\\vec{E}$ a partire dalla forza di Coulomb e mostra, con il calcolo, che il campo generato da una carica puntiforme $Q$ non dipende dalla carica di prova $q$ usata per misurarlo. Precisa cosa cambia se la carica di prova è negativa e indica l'unità di misura di $\\vec{E}$ nel Sistema Internazionale.</p>`,
        solution: `<p><strong>Definizione.</strong> Posta in $P$ una carica di prova puntiforme $q\\neq 0$ e detta $\\vec{F}$ la forza di Coulomb che essa subisce, si definisce</p>
        <p>$$\\vec{E}(P)=\\frac{\\vec{F}}{q}$$</p>
        <p>dove $q$ è il valore <em>algebrico</em> della carica di prova.</p>
        <p><strong>Calcolo.</strong> Per una sorgente puntiforme $Q$ si ha $\\vec{F}=\\dfrac{1}{4\\pi\\varepsilon_0}\\dfrac{Qq}{r^2}\\hat{r}$, con $\\hat{r}$ versore diretto da $Q$ verso $P$ e $r \\gt 0$ la loro distanza. Segue</p>
        <p>$$\\vec{E}=\\frac{1}{q}\\left(\\frac{1}{4\\pi\\varepsilon_0}\\frac{Qq}{r^2}\\hat{r}\\right)=\\frac{1}{4\\pi\\varepsilon_0}\\frac{Q}{r^2}\\hat{r}$$</p>
        <p>Il fattore $q$ si semplifica: nel risultato finale non compare più né il valore né il segno della carica di prova. Il campo è dunque una <strong>proprietà dello spazio</strong> dovuta soltanto alla sorgente.</p>
        <p><strong>Carica di prova negativa.</strong> Se $q \\lt 0$ il rapporto $\\vec{F}/q$ inverte il verso della forza, quindi $\\vec{E}$ e $\\vec{F}$ sono <strong>antiparalleli</strong>: la relazione vettoriale resta valida, mentre sui moduli si deve scrivere $E=F/|q|$ (il modulo di $\\vec{E}$ è positivo).</p>
        <p><strong>Unità di misura.</strong> $\\mathrm{N/C}$.</p>
        <p><strong>Nota operativa.</strong> Dal punto di vista sperimentale $q$ va presa la più piccola possibile, così che il campo da essa prodotto non perturbi la distribuzione sorgente che si vuole misurare.</p>`
      },

      {
        id: "s20-es-teoria-3",
        type: "esercizio",
        title: "Teoria 3",
        kind: "teoria",
        source: "integrazione",
        icon: "✎",
        content: `<p>Enuncia la legge di Coulomb specificando tutte le ipotesi e confrontala con la legge di gravitazione universale di Newton: elenca due analogie e due differenze.</p>`,
        solution: `<p><strong>Legge di Coulomb.</strong> Date due cariche <em>puntiformi</em> $q_1$ e $q_2$, <em>in quiete</em>, poste <em>nel vuoto</em> a distanza $r$, il modulo della forza che ciascuna esercita sull'altra è</p>
        <p>$$F=\\frac{1}{4\\pi\\varepsilon_0}\\frac{|q_1q_2|}{r^2}$$</p>
        <p>diretta lungo la congiungente. In forma vettoriale, usando la notazione già introdotta (versore dalla sorgente al punto di osservazione), la forza che la carica $1$ esercita sulla carica $2$ è</p>
        <p>$$\\vec{F}_{1\\to 2}=\\frac{1}{4\\pi\\varepsilon_0}\\frac{q_1q_2}{r^2}\\,\\hat{u}_{1\\to 2}$$</p>
        <p>dove $\\hat{u}_{1\\to 2}$ è il versore che punta <strong>dalla carica $1$ (sorgente) verso la carica $2$ (punto di osservazione)</strong>. Se $q_1q_2 \\gt 0$ la forza è concorde con $\\hat{u}_{1\\to 2}$ (repulsiva), se $q_1q_2 \\lt 0$ è opposta (attrattiva). Per il terzo principio, $\\vec{F}_{2\\to 1}=-\\vec{F}_{1\\to 2}$.</p>
        <p><strong>Legge di Newton.</strong> $F_G=G\\dfrac{m_1m_2}{r^2}$.</p>
        <p><strong>Analogie.</strong> (i) Entrambe sono proporzionali al prodotto delle sorgenti (cariche o masse) e vanno come $1/r^2$. (ii) Entrambe sono forze <strong>centrali</strong>, dirette lungo la congiungente, e <strong>conservative</strong>.</p>
        <p><strong>Differenze.</strong> (i) La gravitazione è sempre attrattiva perché le masse sono solo positive, mentre la forza di Coulomb è repulsiva per cariche concordi e attrattiva per cariche discordi. (ii) L'intensità è incomparabile: per due elettroni $F_C/F_G\\sim 10^{42}$, per cui a livello atomico la gravità è trascurabile. Inoltre la costante elettrica dipende dal mezzo ($\\varepsilon_0$ va sostituita da $\\varepsilon=\\varepsilon_r\\varepsilon_0$), mentre $G$ è universale.</p>`
      },

      {
        id: "s21-es-teoria-4",
        type: "esercizio",
        title: "Teoria 4",
        kind: "teoria",
        source: "integrazione",
        icon: "✎",
        content: `<p>Per una carica puntiforme $Q$ discuti modulo, direzione e verso di $\\vec{E}$ nei due casi $Q \\gt 0$ e $Q \\lt 0$; spiega perché la formula non è definita in $r=0$ e con quale legge il campo tende a zero all'infinito.</p>`,
        solution: `<p><strong>Modulo.</strong> Dalla $\\vec{E}=\\dfrac{1}{4\\pi\\varepsilon_0}\\dfrac{Q}{r^2}\\hat{r}$ segue</p>
        <p>$$E=\\frac{1}{4\\pi\\varepsilon_0}\\frac{|Q|}{r^2}$$</p>
        <p>che dipende solo dalla distanza: il campo ha <strong>simmetria radiale</strong> (su ogni sfera centrata in $Q$ il modulo è costante).</p>
        <p><strong>Direzione.</strong> È sempre quella della congiungente carica–punto.</p>
        <p><strong>Verso.</strong> È dato dal segno di $Q$: se $Q \\gt 0$ il coefficiente $Q/r^2$ è positivo e $\\vec{E}$ è concorde con $\\hat{r}$, cioè radialmente <strong>uscente</strong> dalla sorgente; se $Q \\lt 0$ il coefficiente è negativo e $\\vec{E}$ è opposto a $\\hat{r}$, cioè radialmente <strong>entrante</strong>, diretto verso la carica.</p>
        <p><strong>Singolarità in $r=0$.</strong> Nel punto occupato dalla carica l'espressione contiene $1/r^2$ e non è definita: si ha una singolarità (il modello di carica puntiforme perde senso in quel punto, e del resto $\\hat{r}$ stesso non è definito).</p>
        <p><strong>Comportamento all'infinito.</strong> Per $r\\to+\\infty$ si ha $E\\to 0$ come $1/r^2$: raddoppiando la distanza il modulo del campo si riduce a un quarto.</p>`
      },

      {
        id: "s22-es-scritto-1",
        type: "esercizio",
        title: "Scritto 1",
        kind: "scritto",
        source: "integrazione",
        icon: "✎",
        content: `<p>Due cariche puntiformi $q_1=+2{,}0\\ \\mu\\mathrm{C}$ e $q_2=-3{,}0\\ \\mu\\mathrm{C}$ sono ferme nel vuoto a distanza $r=5{,}0\\ \\mathrm{cm}$. Calcola il modulo della forza di Coulomb che agisce su ciascuna carica e dine il verso. Si assuma $\\dfrac{1}{4\\pi\\varepsilon_0}=8{,}99\\times10^{9}\\ \\mathrm{N\\,m^2/C^2}$.</p>`,
        solution: `<p><strong>Dati in unità SI.</strong> $|q_1|=2{,}0\\times10^{-6}\\ \\mathrm{C}$, $|q_2|=3{,}0\\times10^{-6}\\ \\mathrm{C}$, $r=5{,}0\\times10^{-2}\\ \\mathrm{m}$.</p>
        <p><strong>Legge di Coulomb.</strong></p>
        <p>$$F=\\frac{1}{4\\pi\\varepsilon_0}\\frac{|q_1q_2|}{r^2}=8{,}99\\times10^{9}\\cdot\\frac{(2{,}0\\times10^{-6})(3{,}0\\times10^{-6})}{(5{,}0\\times10^{-2})^2}$$</p>
        <p><strong>Passaggi numerici.</strong> Numeratore: $(2{,}0\\times10^{-6})(3{,}0\\times10^{-6})=6{,}0\\times10^{-12}\\ \\mathrm{C^2}$; denominatore: $(5{,}0\\times10^{-2})^2=2{,}5\\times10^{-3}\\ \\mathrm{m^2}$. Quindi</p>
        <p>$$F=8{,}99\\times10^{9}\\cdot\\frac{6{,}0\\times10^{-12}}{2{,}5\\times10^{-3}}=8{,}99\\times10^{9}\\cdot 2{,}4\\times10^{-9}=21{,}6\\ \\mathrm{N}$$</p>
        <p><strong>Verso.</strong> Poiché le cariche hanno segno opposto la forza è <strong>attrattiva</strong>: su ciascuna carica agisce una forza di modulo $F\\simeq 22\\ \\mathrm{N}$ diretta lungo la congiungente e rivolta verso l'altra carica. Le due forze sono uguali in modulo e opposte in verso (terzo principio della dinamica).</p>`
      },

      {
        id: "s23-es-scritto-2",
        type: "esercizio",
        title: "Scritto 2",
        kind: "scritto",
        source: "integrazione",
        icon: "✎",
        content: `<p>Una carica puntiforme $Q=-4{,}0\\ \\mathrm{nC}$ è posta nell'origine. Calcola modulo, direzione e verso del campo elettrostatico nel punto $P$ posto a distanza $r=0{,}20\\ \\mathrm{m}$ dalla carica, e la forza che agirebbe in $P$ su una carica di prova $q=+2{,}0\\ \\mathrm{nC}$. Usa $\\dfrac{1}{4\\pi\\varepsilon_0}=8{,}99\\times 10^{9}\\ \\mathrm{N\\,m^2/C^2}$.</p>`,
        solution: `<p><strong>Modulo del campo.</strong></p>
        <p>$$E=\\frac{1}{4\\pi\\varepsilon_0}\\frac{|Q|}{r^2}=\\frac{(8{,}99\\times 10^{9})(4{,}0\\times 10^{-9})}{(0{,}20)^2}=\\frac{35{,}96}{0{,}040}\\simeq 9{,}0\\times 10^{2}\\ \\mathrm{N/C}$$</p>
        <p><strong>Direzione.</strong> Quella della congiungente carica–punto (radiale).</p>
        <p><strong>Verso.</strong> Poiché $Q \\lt 0$, il campo è opposto al versore $\\hat{r}$ (che va dalla carica verso $P$), cioè è <strong>entrante</strong>, diretto da $P$ verso la carica. In forma vettoriale</p>
        <p>$$\\vec{E}=\\frac{1}{4\\pi\\varepsilon_0}\\frac{Q}{r^2}\\hat{r}\\simeq -9{,}0\\times 10^{2}\\,\\hat{r}\\ \\mathrm{N/C}$$</p>
        <p><strong>Forza sulla carica di prova.</strong> $\\vec{F}=q\\vec{E}$; essendo $q \\gt 0$, $\\vec{F}$ è concorde con $\\vec{E}$ e ha modulo</p>
        <p>$$F=qE=(2{,}0\\times 10^{-9})(8{,}99\\times 10^{2})\\simeq 1{,}8\\times 10^{-6}\\ \\mathrm{N}$$</p>
        <p>diretta da $P$ verso la carica (attrattiva), come deve essere perché $Qq \\lt 0$.</p>
        <p><strong>Osservazione.</strong> Il campo in $P$ non dipende da $q$: se al posto di $q$ si usasse $q'=-2{,}0\\ \\mathrm{nC}$, il campo resterebbe lo stesso mentre la forza avrebbe lo stesso modulo e verso opposto (repulsiva).</p>`
      },

      {
        id: "s24-es-scritto-3",
        type: "esercizio",
        title: "Scritto 3",
        kind: "scritto",
        source: "integrazione",
        icon: "✎",
        content: `<p>In un conduttore la corrente varia nel tempo secondo $i(t)=\\alpha t^2$, con $\\alpha=3{,}0\\ \\mathrm{A/s^2}$. Calcola la carica totale $q$ che attraversa una sezione del conduttore tra $t=0$ e $t=2{,}0\\ \\mathrm{s}$ e il numero di elettroni corrispondente, sapendo che $e=1{,}6022\\times10^{-19}\\ \\mathrm{C}$.</p>`,
        solution: `<p><strong>Impostazione.</strong> Per definizione $i=\\dfrac{dq}{dt}$, dove $q$ è la carica transitata attraverso la sezione orientata. Quindi $dq=i(t)\\,dt$ e la carica transitata si ottiene integrando:</p>
        <p>$$q=\\int_{0}^{T} i(t)\\,dt=\\int_{0}^{T}\\alpha t^2\\,dt=\\alpha\\left[\\frac{t^3}{3}\\right]_0^{T}=\\frac{\\alpha T^3}{3}$$</p>
        <p><strong>Sostituzione numerica.</strong> Con $\\alpha=3{,}0\\ \\mathrm{A/s^2}$ e $T=2{,}0\\ \\mathrm{s}$:</p>
        <p>$$q=\\frac{3{,}0\\cdot (2{,}0)^3}{3}=\\frac{3{,}0\\cdot 8{,}0}{3}=8{,}0\\ \\mathrm{C}$$</p>
        <p><strong>Controllo dimensionale.</strong> $[\\alpha][t^3]=\\dfrac{\\mathrm{A}}{\\mathrm{s^2}}\\cdot\\mathrm{s^3}=\\mathrm{A\\cdot s}=\\mathrm{C}$: corretto.</p>
        <p><strong>Numero di elettroni.</strong> Poiché la carica è quantizzata, $q=Ne$, da cui</p>
        <p>$$N=\\frac{q}{e}=\\frac{8{,}0}{1{,}6022\\times10^{-19}}\\simeq 5{,}0\\times10^{19} \\ \\text{elettroni}$$</p>
        <p>Per confronto, la corrente media nell'intervallo è $\\bar{i}=q/T=4{,}0\\ \\mathrm{A}$.</p>`
      },

      {
        id: "s25-es-scritto-4",
        type: "esercizio",
        title: "Scritto 4",
        kind: "scritto",
        source: "integrazione",
        icon: "✎",
        content: `<p>Due cariche puntiformi sono poste nel piano $xy$ (coordinate in metri): $Q_1=+3{,}0\\ \\mathrm{nC}$ in $A=(-0{,}10;\\,0)$ e $Q_2=+3{,}0\\ \\mathrm{nC}$ in $B=(+0{,}10;\\,0)$.</p>
        <p><strong>(a)</strong> Calcola $\\vec{E}_{tot}$ nel punto $P=(0;\\,0{,}10)$.</p>
        <p><strong>(b)</strong> Ripeti il calcolo sostituendo $Q_2$ con $-3{,}0\\ \\mathrm{nC}$.</p>
        <p>Usa $\\dfrac{1}{4\\pi\\varepsilon_0}=8{,}99\\times 10^{9}\\ \\mathrm{N\\,m^2/C^2}$.</p>`,
        solution: `<p><strong>Passo 1 — Geometria (comune ai due casi).</strong></p>
        <p>$$\\vec{r}_1=P-A=(0{,}10;\\,0{,}10), \\qquad r_1=\\sqrt{0{,}010+0{,}010}\\simeq 0{,}141\\ \\mathrm{m}, \\qquad r_1^2=0{,}020\\ \\mathrm{m^2}$$</p>
        <p>$$\\hat{r}_1\\simeq(0{,}707;\\,0{,}707)$$</p>
        <p>$$\\vec{r}_2=P-B=(-0{,}10;\\,0{,}10), \\qquad r_2\\simeq 0{,}141\\ \\mathrm{m}, \\qquad r_2^2=0{,}020\\ \\mathrm{m^2}$$</p>
        <p>$$\\hat{r}_2\\simeq(-0{,}707;\\,0{,}707)$$</p>
        <p><strong>Passo 2 — Moduli dei contributi.</strong> Le due cariche hanno lo stesso valore assoluto e la stessa distanza da $P$, quindi</p>
        <p>$$E_1=E_2=\\frac{(8{,}99\\times 10^{9})(3{,}0\\times 10^{-9})}{0{,}020}=\\frac{26{,}97}{0{,}020}\\simeq 1{,}35\\times 10^{3}\\ \\mathrm{N/C}$$</p>
        <p><strong>Passo 3 — Caso (a): entrambe positive.</strong> Essendo $Q_i \\gt 0$, si ha $\\vec{E}_i=E_i\\hat{r}_i$:</p>
        <p>$$\\vec{E}_1\\simeq(954;\\,954)\\ \\mathrm{N/C}, \\qquad \\vec{E}_2\\simeq(-954;\\,954)\\ \\mathrm{N/C}$$</p>
        <p>Le componenti $x$ si cancellano per simmetria:</p>
        <p>$$\\vec{E}_{tot}\\simeq(0;\\,1{,}9\\times 10^{3})\\ \\mathrm{N/C}$$</p>
        <p>Campo diretto lungo $+y$, di modulo</p>
        <p>$$E_{tot}=2E_1\\cos 45^{\\circ}\\simeq 1{,}9\\times 10^{3}\\ \\mathrm{N/C}$$</p>
        <p><strong>Passo 4 — Caso (b): $Q_2=-3{,}0\\ \\mathrm{nC}$.</strong> Ora il contributo di $Q_2$ è opposto a $\\hat{r}_2$, mentre $\\vec{E}_1$ resta invariato:</p>
        <p>$$\\vec{E}_2=-E_2\\hat{r}_2\\simeq(954;\\,-954)\\ \\mathrm{N/C}, \\qquad \\vec{E}_1\\simeq(954;\\,954)\\ \\mathrm{N/C}$$</p>
        <p>Si cancellano le componenti $y$:</p>
        <p>$$\\vec{E}_{tot}\\simeq(1{,}9\\times 10^{3};\\,0)\\ \\mathrm{N/C}$$</p>
        <p>Campo diretto lungo $+x$, cioè <strong>parallelo alla congiungente dalla carica positiva a quella negativa</strong>, con modulo $\\simeq 1{,}9\\times 10^{3}\\ \\mathrm{N/C}$.</p>`
      }
    ],

    oral_cards: [
