<script>
const LESSON = {
  "id": "L14",
  "date": "Lezione 14 — 6 Nov 2026",
  "title": "Effetto Joule e Circuiti RC",
  "abstract": "Dissipazione di energia in un conduttore percorso da corrente (effetto Joule), generatori di tensione e forza elettromotrice, e analisi completa del circuito RC: transitorio di carica, bilancio energetico e processo di scarica.",
  "sections": [
    {
      "id": "s14-joule",
      "type": "section",
      "title": "L'effetto Joule",
      "icon": "🔥",
      "content": "<p>Avete mai sentito parlare dell'effetto Joule? È un fenomeno molto comune: quando una corrente elettrica attraversa un conduttore, questo tende a <strong>scaldarsi</strong>.</p>\n<p>Consideriamo un conduttore ai cui capi è applicata una differenza di potenziale $\\Delta V = V_A - V_B$. Le cariche elettriche si muovono, ma urtano tra di loro e contro il reticolo cristallino del materiale. Questi urti e attriti causano un riscaldamento del conduttore.</p>",
      "subsections": [
        {
          "subtitle": "Esempi di effetto Joule",
          "content": "<p>Incontriamo l'effetto Joule in molti dispositivi di uso quotidiano:</p>\n<ul>\n<li>La <strong>lampadina a incandescenza</strong>: la corrente passa attraverso un filamento che si scalda a tal punto da emettere luce.</li>\n<li>Il <strong>forno elettrico</strong> o la <strong>stufa elettrica</strong>: una resistenza percorsa da corrente si scalda e irradia calore.</li>\n<li>La <strong>lavatrice</strong>: quando impostiamo una temperatura per l'acqua, una serpentina immersa nell'acqua viene attraversata da corrente, si scalda per effetto Joule e riscalda l'acqua.</li>\n</ul>"
        },
        {
          "subtitle": "Derivazione della potenza dissipata",
          "content": "<p>Vogliamo quantificare l'energia dissipata. La quantità di carica $dq$ che attraversa una sezione del conduttore in un intervallo di tempo $dt$ è data da</p>\n<p>$$dq = i \\, dt$$</p>\n<p>dove $i$ è l'intensità di corrente.</p>\n<p>Il lavoro infinitesimo $dW$ compiuto dal campo elettrico per spostare questa carica $dq$ attraverso la differenza di potenziale $\\Delta V$ è</p>\n<p>$$dW = dq \\cdot \\Delta V = (i \\, dt)\\, \\Delta V$$</p>\n<p>La potenza $P$ è definita come il lavoro compiuto nell'unità di tempo. Dividendo per $dt$:</p>\n<p>$$P = \\frac{dW}{dt} = i \\cdot \\Delta V$$</p>\n<p>Per un conduttore ohmico vale la prima legge di Ohm, $\\Delta V = iR$. Sostituendo questa relazione nell'espressione della potenza troviamo la <strong>legge di Joule</strong>.</p>"
        },
        {
          "subtitle": "Teorema — Legge di Joule",
          "content": "<p>Sia un conduttore ohmico di resistenza $R$ costante, percorso da una corrente di intensità $i$ e sottoposto alla differenza di potenziale $\\Delta V = iR$ tra i suoi capi. La potenza dissipata in calore all'interno del conduttore è</p>\n<p>$$P = i \\cdot \\Delta V = i \\cdot (iR) = i^2 R = \\frac{(\\Delta V)^2}{R}$$</p>\n<p>L'energia dissipata in un intervallo di tempo finito $[t_1, t_2]$ è dunque</p>\n<p>$$W = \\int_{t_1}^{t_2} i^2(t)\\, R \\, dt$$</p>"
        },
        {
          "subtitle": "Lettura della legge di Joule",
          "content": "<p>Le tre forme $P = i\\,\\Delta V$, $P = i^2 R$ e $P = (\\Delta V)^2/R$ sono equivalenti <strong>solo per un conduttore ohmico</strong>. Nella pratica si usa:</p>\n<ul>\n<li>$P = i^2R$ quando è nota la corrente (per esempio in un circuito in <strong>serie</strong>, dove la corrente è la stessa in tutti gli elementi);</li>\n<li>$P = (\\Delta V)^2/R$ quando è nota la tensione (per esempio in un <strong>parallelo</strong>, dove la tensione è comune).</li>\n</ul>\n<p>Si noti che la potenza è sempre positiva: il conduttore ohmico assorbe energia dal circuito e la cede all'ambiente come calore.</p>"
        }
      ],
      "formulas": [
        {
          "label": "Potenza dissipata (generale)",
          "latex": "P = i \\cdot \\Delta V"
        },
        {
          "label": "Legge di Joule (ohmico)",
          "latex": "P = i^2 R = \\frac{(\\Delta V)^2}{R}"
        },
        {
          "label": "Energia dissipata",
          "latex": "W = \\int_{t_1}^{t_2} i^2(t)\\, R \\, dt"
        }
      ]
    },
    {
      "id": "s14-ohm-ripasso",
      "type": "note_box",
      "title": "Riepilogo delle leggi di Ohm",
      "icon": "📐",
      "content": "<p>Ricordiamo brevemente le due leggi di Ohm che abbiamo utilizzato:</p>\n<p><strong>1. Prima legge di Ohm.</strong> La differenza di potenziale $\\Delta V$ ai capi di un conduttore è direttamente proporzionale all'intensità di corrente $i$ che lo attraversa. La costante di proporzionalità è la resistenza $R$:</p>\n<p>$$\\Delta V = iR$$</p>\n<p><strong>2. Seconda legge di Ohm.</strong> La resistenza $R$ di un conduttore è direttamente proporzionale alla sua lunghezza $L$ e inversamente proporzionale alla sua area trasversale $A$. La costante di proporzionalità $\\rho$ è la resistività, una proprietà intrinseca del materiale:</p>\n<p>$$R = \\rho \\frac{L}{A}$$</p>"
    },
    {
      "id": "s14-generatori",
      "type": "section",
      "title": "Generatori di Tensione e Circuiti Elettrici",
      "icon": "🔋",
      "content": "<p><strong>Definizione — Generatore ideale di tensione.</strong> Un <strong>generatore ideale di tensione</strong> è un dispositivo che mantiene una differenza di potenziale fissata tra i suoi due terminali, indipendentemente dal circuito collegato; la corrente che lo attraversa <em>non</em> è imposta dal generatore, ma è determinata dal resto del circuito. In questa lezione consideriamo sempre un generatore di tensione <strong>continua</strong>, cioè con differenza di potenziale costante nel tempo. Un esempio comune è una batteria.</p>",
      "subsections": [
        {
          "subtitle": "Generatore di tensione e generatore di corrente",
          "content": "<p>Non bisogna confondere i due dispositivi:</p>\n<ul>\n<li>un <strong>generatore ideale di tensione</strong> impone la tensione $f$ ai suoi terminali e lascia che la corrente si adatti al circuito: collegandolo a un resistore $R$ si ottiene $i = f/R$, collegandolo a $2R$ si ottiene $i = f/(2R)$;</li>\n<li>un <strong>generatore ideale di corrente</strong> impone invece l'intensità di corrente $i$ e lascia che sia la tensione ai suoi capi ad adattarsi al circuito.</li>\n</ul>\n<p>Questa distinzione è essenziale per il circuito RC che studieremo: la tensione del generatore rimane costante, mentre la corrente nel circuito <strong>varia nel tempo</strong> durante il transitorio di carica.</p>"
        },
        {
          "subtitle": "Come funziona un generatore?",
          "content": "<p>Senza entrare nei dettagli, un generatore sfrutta processi (chimici, meccanici, etc.) per creare una differenza di potenziale tra i suoi due terminali (poli). Ad esempio, una <strong>batteria</strong> utilizza reazioni chimiche tra due elettrodi (catodo e anodo) immersi in una soluzione elettrolitica per separare le cariche. Una <strong>centrale idroelettrica</strong> usa l'energia dell'acqua per far ruotare una turbina; questa, accoppiata a un alternatore (una spira che ruota in un campo magnetico), genera corrente.</p>"
        },
        {
          "subtitle": "Definizione — Campo elettromotore",
          "content": "<p>All'interno di un generatore agisce una <strong>forza motrice per unità di carica</strong>, che indichiamo con $\\vec{E}_m$ e chiamiamo <strong>campo elettromotore</strong>. Il campo elettromotore <em>non</em> è necessariamente un campo elettrico: è la grandezza che descrive, per unità di carica, l'azione non elettrostatica che sposta le cariche dal polo negativo al polo positivo, <strong>contro</strong> il campo elettrostatico presente tra i poli.</p>\n<p>Nella batteria descritta sopra, $\\vec{E}_m$ rappresenta l'effetto delle forze di natura chimica che avvengono agli elettrodi; nell'alternatore rappresenta l'azione di natura magnetica dovuta al movimento della spira. In ogni caso la <strong>circuitazione</strong> di $\\vec{E}_m$ lungo il circuito non è nulla: è questo il motivo per cui l'azione del generatore non è descrivibile con un potenziale, a differenza del campo elettrostatico.</p>"
        },
        {
          "subtitle": "Definizione — Forza Elettromotrice (f.e.m.)",
          "content": "<p>La <strong>forza elettromotrice</strong> (f.e.m.), indicata con $f$ o $\\mathcal{E}$, di un generatore è definita come il lavoro per unità di carica compiuto dal campo elettromotore per spostare una carica dal polo negativo al polo positivo all'interno del generatore:</p>\n<p>$$f = \\int_{A(-)}^{B(+)} \\vec{E}_m \\cdot d\\vec{l}$$</p>\n<p>In un generatore ideale, la f.e.m. coincide con la differenza di potenziale <strong>a vuoto</strong> (cioè senza un circuito collegato) tra i suoi terminali:</p>\n<p>$$f = V_B - V_A$$</p>\n<p>Dimensionalmente la f.e.m. è un'energia per unità di carica e si misura quindi in <strong>volt</strong>, nonostante il nome storico di «forza».</p>"
        },
        {
          "subtitle": "Esempio — Generatore e singolo resistore",
          "content": "<p>Colleghiamo un generatore di f.e.m. $f$ a un resistore $R$. La differenza di potenziale ai capi del resistore è $f$, quindi per la legge di Ohm la corrente vale</p>\n<p>$$f = iR \\Rightarrow i = \\frac{f}{R}$$</p>\n<p>La potenza dissipata nel resistore è, per la legge di Joule, $P = i^2R = f^2/R$, e coincide con la potenza $P = i f$ erogata dal generatore: tutta l'energia fornita dal generatore viene dissipata in calore.</p>"
        },
        {
          "subtitle": "Esempio — Resistori in serie",
          "content": "<p>Se due resistori $R_1$ e $R_2$ sono collegati in serie a un generatore, la <strong>stessa corrente</strong> $i$ li attraversa (non ci sono nodi intermedi in cui la corrente possa dividersi). La f.e.m. si ripartisce tra i due:</p>\n<p>$$f = \\Delta V_1 + \\Delta V_2 = iR_1 + iR_2 = i(R_1 + R_2) = i R_{eq}, \\qquad R_{eq} = R_1 + R_2$$</p>\n<p>La corrente è dunque $i = f/(R_1+R_2)$ ed è il resistore <strong>maggiore</strong> a dissipare più potenza, poiché $P_k = i^2 R_k$ con $i$ comune.</p>"
        },
        {
          "subtitle": "Esempio — Resistori in parallelo",
          "content": "<p>Se i due resistori sono in parallelo, la differenza di potenziale ai loro capi è la stessa ed è pari a $f$, mentre la corrente totale $i$ erogata dal generatore si divide nei due rami:</p>\n<p>$$i = i_1 + i_2 = \\frac{f}{R_1} + \\frac{f}{R_2} = \\frac{f}{R_{eq}}, \\qquad R_{eq} = \\frac{R_1 R_2}{R_1 + R_2}$$</p>\n<p>cioè $f = i R_{eq}$. In questo caso è il resistore <strong>minore</strong> a dissipare più potenza, poiché $P_k = f^2/R_k$ con $f$ comune.</p>"
        }
      ],
      "formulas": [

        },

          "label": "Resistenze in serie",
          "latex": "R_{eq} = R_1 + R_2"
        },
        {
          "label": "Resistenze in parallelo",
          "latex": "R_{eq} = \\frac{R_1 R_2}{R_1 + R_2}"
        }
      ]
    },

      "id": "s14-rc-carica",
      "type": "section",
      "title": "Il Circuito RC: Processo di Carica",
      "icon": "⚡",

9358,0,0,-0.99358,28.814798,128.81566)\"/>\n<path style=\" stroke:none;fill-rule:nonzero;fill:rgb(0%,0%,0%);fill-opacity:1;\" d=\"M 70.796875 128.816406 C 70.796875 128.027344 70.160156 127.390625 69.371094 127.390625 C 68.585938 127.390625 67.945312 128.027344 67.945312 128.816406 C 67.945312 129.601562 68.585938 130.242188 69.371094 130.242188 C 70.160156 130.242188 70.796875 129.601562 70.796875 128.816406 Z M 70.796875 128.816406 \"/>\n<path style=\" stroke:none;fill-rule:nonzero;fill:rgb(0%,0%,0%);fill-opacity:1;\" d=\"M 47.140625 128.816406 C 47.140625 128.027344 46.5 127.390625 45.714844 127.390625 C 44.925781 127.390625 44.289062 128.027344 44.289062 128.816406 C 44.289062 129.601562 44.925781 130.242188 45.714844 130.242188 C 46.5 130.242188 47.140625 129.601562 47.140625 128.816406 Z M 47.140625 128.816406 \"/>\n</g>\n</svg><figcaption>Circuito RC serie prima della chiusura dell’interruttore: il polo positivo del generatore è la piastra lunga superiore. Il verso positivo di $i$ porta carica all’armatura $+q(t)$, quindi $i=dq/dt$.</figcaption></figure>\n<p>Nello schema la piastra lunga della batteria indica il polo positivo, quella corta il polo negativo. La freccia fissa il verso positivo della corrente $i$, scelto in modo che la corrente scorra verso l'armatura superiore del condensatore, su cui si accumula la carica $+q(t)$ (sull'altra armatura si trova $-q(t)$). L'interruttore è rappresentato <em>aperto</em>, cioè prima della chiusura all'istante $t=0$.</p>",
      "subsections": [
        {
          "subtitle": "Convenzioni di segno ed equazione di maglia",
          "content": "<p>Prima di scrivere le equazioni fissiamo con precisione le convenzioni, perché da esse dipendono tutti i segni che seguono:</p>\n<ul>\n<li>$q(t)$ indica la carica dell'armatura del condensatore collegata, attraverso il resistore, al <strong>polo positivo</strong> del generatore (l'armatura superiore nella figura); sull'altra armatura si trova la carica $-q(t)$. La carica <em>totale</em> del condensatore resta quindi nulla durante tutta la carica: ciò che cambia è la <em>separazione</em> delle cariche sulle due armature.</li>\n<li>il verso positivo della corrente è quello indicato dalla freccia in figura, cioè il verso che porta carica positiva <em>verso</em> l'armatura a carica $+q$. Con questa scelta la corrente coincide con la rapidità di accumulo della carica su quell'armatura: $i = +\\dfrac{dq}{dt}$. Con il verso opposto si avrebbe $i = -dq/dt$: il segno non ha un valore assoluto, dipende dalla convenzione adottata.</li>\n</ul>\n<p>Supponiamo che al tempo $t=0$ il condensatore sia inizialmente scarico, cioè che la carica sull'armatura considerata sia $q(0)=0$, e che in quell'istante l'interruttore venga chiuso. Inizia a scorrere una corrente $i$ che carica il condensatore.</p>\n<p>Percorrendo la maglia nel verso della corrente, la f.e.m. del generatore ($f_{gen}$) deve eguagliare la somma delle cadute di potenziale ai capi del resistore ($\\Delta V_R$) e del condensatore ($\\Delta V_C$):</p>\n<p>$$f_{gen} = \\Delta V_R + \\Delta V_C$$</p>\n<p>dove $\\Delta V_R = iR$ (legge di Ohm) e $\\Delta V_C = \\dfrac{q}{C}$ (definizione di capacità, con $q$ la carica dell'armatura positiva). Inoltre, per la convenzione fissata sopra, $i = \\dfrac{dq}{dt}$.</p>\n<p>Sostituendo queste relazioni, otteniamo l'<strong>equazione differenziale</strong> che descrive il circuito:</p>\n<p>$$f_{gen} = R \\frac{dq}{dt} + \\frac{q}{C}$$</p>\n<p>È un'equazione differenziale lineare del primo ordine, con la condizione iniziale $q(0)=0$. Per risolverla utilizziamo il metodo di separazione delle variabili.</p>"
        },
        {
          "subtitle": "Risoluzione dell'equazione differenziale",
          "content": "<p>Riorganizziamo l'equazione per separare le variabili $q$ e $t$:</p>\n<p>$$R \\frac{dq}{dt} = f_{gen} - \\frac{q}{C} = \\frac{C f_{gen} - q}{C}$$</p>\n<p>$$\\frac{dq}{C f_{gen} - q} = \\frac{dt}{RC}$$</p>\n<p>Ora integriamo entrambi i membri. A sinistra integriamo la carica da $0$ (valore iniziale) a $q(t)$; a destra integriamo il tempo da $0$ a $t$:</p>\n<p>$$\\int_0^{q(t)} \\frac{dq'}{C f_{gen} - q'} = \\int_0^t \\frac{dt'}{RC}$$</p>\n<p>L'integrale a destra è immediato:</p>\n<p>$$\\int_0^t \\frac{dt'}{RC} = \\frac{1}{RC} [t']_0^t = \\frac{t}{RC}$$</p>\n<p>Per l'integrale a sinistra, notiamo che la derivata del denominatore $(C f_{gen} - q')$ rispetto a $q'$ è $-1$. Quindi</p>\n<p>$$\\int_0^{q(t)} \\frac{dq'}{C f_{gen} - q'} = \\left[ -\\ln(C f_{gen} - q') \\right]_0^{q(t)} = -\\ln\\left(\\frac{C f_{gen} - q(t)}{C f_{gen}}\\right) = \\ln\\left(\\frac{C f_{gen}}{C f_{gen} - q(t)}\\right)$$</p>\n<p>Uguagliando i due risultati:</p>\n<p>$$\\ln\\left(\\frac{C f_{gen}}{C f_{gen} - q(t)}\\right) = \\frac{t}{RC}$$</p>\n<p>Applichiamo l'esponenziale a entrambi i membri:</p>\n<p>$$\\frac{C f_{gen}}{C f_{gen} - q(t)} = e^{t/RC} \\quad\\Rightarrow\\quad C f_{gen} - q(t) = C f_{gen} \\, e^{-t/RC}$$</p>\n<p>Otteniamo infine l'espressione della carica sul condensatore in funzione del tempo:</p>\n<p>$$q(t) = C f_{gen} \\left(1 - e^{-t/RC}\\right)$$</p>"
        },
        {
          "subtitle": "Teorema — Carica di un circuito RC serie",
          "content": "<p>Si consideri un circuito serie costituito da un generatore ideale di tensione continua di f.e.m. $f_{gen}$ costante, un resistore di resistenza $R$ costante e un condensatore di capacità $C$ costante, <strong>inizialmente scarico</strong>. Detta $q(t)$ la carica dell'armatura collegata al polo positivo del generatore e scelto il verso positivo della corrente verso tale armatura ($i = dq/dt$), per $t \\ge 0$ (interruttore chiuso in $t=0$, con $q(0)=0$) si ha</p>\n<p>$$q(t) = C f_{gen} \\left(1 - e^{-t/\\tau}\\right), \\qquad V_C(t) = \\frac{q(t)}{C} = f_{gen}\\left(1 - e^{-t/\\tau}\\right), \\qquad i(t) = \\frac{f_{gen}}{R}\\, e^{-t/\\tau}$$</p>\n<p>dove $\\tau = RC$ è la <strong>costante di tempo</strong> del circuito. In particolare la carica finale è $Q_{max} = C f_{gen}$ e la corrente iniziale è $i_0 = f_{gen}/R$, mentre la tensione ai capi del resistore vale $V_R(t) = f_{gen} e^{-t/\\tau}$ e soddisfa in ogni istante $V_R(t) + V_C(t) = f_{gen}$.</p>"
        },
        {
          "subtitle": "Analisi della soluzione: carica e tensione",
          "content": "<p>Analizziamo il comportamento della carica $q(t)$:</p>\n<ul>\n<li><strong>Per $t=0$</strong>: $q(0) = C f_{gen} (1 - e^0) = 0$. Questo conferma la condizione iniziale: il condensatore è scarico.</li>\n<li><strong>Per $t \\to \\infty$</strong>: $e^{-t/RC} \\to 0$, quindi $q(\\infty) = C f_{gen}$. Questa è la <strong>carica massima</strong> ($Q_{max}$) che il condensatore può accumulare. Si tratta di un valore <em>limite</em>: la carica vi tende asintoticamente, senza raggiungerlo in alcun istante finito.</li>\n</ul>\n<p>La differenza di potenziale ai capi del condensatore è $V_C(t) = q(t)/C = f_{gen}\\left(1 - e^{-t/RC}\\right)$, con $V_C(0) = 0$ e $V_C(\\infty) = f_{gen}$: a transitorio concluso, la tensione ai capi del condensatore eguaglia (asintoticamente) la f.e.m. del generatore.</p>\n<figure class=\"figura\" data-id=\"fisica2_lez14a_d2\"><svg id=\"fisica2_lez14a_d2\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"380.051pt\" height=\"153.087pt\" viewBox=\"0 0 380.051 153.087\" version=\"1.2\"><style>#fisica2_lez14a_d2 [fill=\"rgb(0%,0%,0%)\"],#fisica2_lez14a_d2 [style*=\"fill:rgb(0%,0%,0%)\"]{fill:var(--text-primary)!important}#fisica2_lez14a_d2 [stroke=\"rgb(0%,0%,0%)\"],#fisica2_lez14a_d2 [style*=\"stroke:rgb(0%,0%,0%)\"]{stroke:var(--text-primary)!important}#fisica2_lez14a_d2 [fill=\"rgb(100%,0%,0%)\"],#fisica2_lez14a_d2 [style*=\"fill:rgb(100%,0%,0%)\"]{fill:#ff5c5c!important}[data-mode=\"light\"] #fisica2_lez14a_d2 [fill=\"rgb(100%,0%,0%)\"],[data-mode=\"light\"] #fisica2_lez14a_d2 [style*=\"fill:rgb(100%,0%,0%)\"]{fill:#ff0000!important}#fisica2_lez14a_d2 [stroke=\"rgb(100%,0%,0%)\"],#fisica2_lez14a_d2 [style*=\"stroke:rgb(100%,0%,0%)\"]{stroke:#ff5c5c!important}[data-mode=\"light\"] #fisica2_lez14a_d2 [stroke=\"rgb(100%,0%,0%)\"],[data-mode=\"light\"] #fisica2_lez14a_d2 [style*=\"stroke:rgb(100%,0%,0%)\"]{stroke:#ff0000!important}#fisica2_lez14a_d2 [fill=\"rgb(0%,0%,100%)\"],#fisica2_lez )$, con $Q_{max}=Cf_{gen}$ e $\\tau=RC$. A $t=\\tau$ si raggiunge il $63.2\\%$ del valore finale.</figcaption></figure>\n<p>La carica tende asintoticamente al valore massimo $Q_{max} = C f_{gen}$ (linea tratteggiata), raggiungendo circa il $63\\%$ di tale valore dopo una costante di tempo $\\tau$.</p>"
        },
        {
          "subtitle": "Analisi della soluzione: corrente",
          "content": "<p>La corrente $i(t)$ si ottiene derivando la carica $q(t)$ rispetto al tempo:</p>\n<p>$$i(t) = \\frac{dq}{dt} = \\frac{d}{dt} \\left[ C f_{gen} \\left(1 - e^{-t/RC}\\right) \\right] = C f_{gen} \\left( - e^{-t/RC} \\cdot \\left(-\\frac{1}{RC}\\right) \\right) = \\frac{C f_{gen}}{RC} e^{-t/RC}$$</p>\n<p>$$i(t) = \\frac{f_{gen}}{R} e^{-t/RC}$$</p>\n<ul>\n<li><strong>Per $t=0$</strong>: $i(0) = \\dfrac{f_{gen}}{R} e^0 = \\dfrac{f_{gen}}{R}$. All'istante iniziale, il condensatore scarico si comporta come un <strong>cortocircuito</strong>, e la corrente è massima, limitata solo dal resistore.</li>\n<li><strong>Per $t \\to \\infty$</strong>: $i(\\infty) = 0$. A transitorio concluso la corrente è praticamente nulla e il condensatore si comporta come un <strong>circuito aperto</strong>; anche qui l'annullamento è asintotico.</li>\n</ul>\n<figure class=\"figura\" data-id=\"fisica2_lez14a_d3\"><svg id=\"fisica2_lez14a_d3\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"375.607pt\" height=\"153.087pt\" viewBox=\"0 0 375.607 153.087\" version=\"1.2\"><style>#fisica2_lez14a_d3 [fill=\"rgb(0%,0%,0%)\"],#fisica2_lez14a_d3 [style*=\"fill:rgb(0%,0%,0%)\"]{fill:var(--text-primary)!important}#fisica2_lez14a_d3 [stroke=\"rgb(0%,0%,0%)\"],#fisica2_lez14a_d3 [style*=\"stroke:rgb(0%,0%,0%)\"]{stroke:var(--text-primary)!important}#fisica2_lez14a_d3 [fill=\"rgb(0%,0%,100%)\"],#fisica2_lez14a_d3 [style*=\"fill:rgb(0%,0%,100%)\"]{fill:#5c5cff!important}[data-mode=\"light\"] #fisica2_lez14a_d3 [fill=\"rgb(0%,0%,100%)\"],[data-mode=\"light\"] #fisica2_lez14a_d3 [style*=\"fill:rgb(0%,0%,100%)\"]{fill:#0000ff!important}#fisica2_lez14a_d3 [stroke=\"rgb(0%,0%,100%)\"],#fisica2_lez14a_d3 [style*=\"stroke:rgb(0%,0%,100%)\"]{stroke:#5c5cff!important}[data-mode=\"light\"] #fisica2_lez14a_d3 [stroke=\"rgb(0%,0%,100%)\"],[data-mode=\"light\"] #fisica2_lez14a_d3 [style*=\"stroke:rgb(0%,0%,100%)\"]{stroke:#0000ff!important}</style>\n<defs>\n         {
          "subtitle": "Definizione — Costante di tempo $\\tau$",
          "content": "<p>Il prodotto $RC$ ha le dimensioni di un tempo e viene chiamato <strong>costante di tempo</strong> del circuito RC, indicata con $\\tau$:</p>\n<p>$$\\tau = RC$$</p>\n<p>Essa rappresenta il tempo necessario affinché la carica sul condensatore raggiunga circa il $63\\%$ ($1 - 1/e$) del suo valore massimo, o affinché la corrente si riduca a circa il $37\\%$ ($1/e$) del suo valore iniziale.</p>"
        },
        {
          "subtitle": "Quando il transitorio è «finito»?",
          "content": "<p>Nel modello ideale la carica completa si raggiunge solo nel limite $t \\to \\infty$: non esiste alcun istante finito in cui la corrente si annulli esattamente o in cui si abbia $q = Q_{max}$. Nella pratica si considera concluso il transitorio quando lo scarto dal valore finale è sufficientemente piccolo rispetto alla precisione delle misure. Poiché lo scarto relativo è</p>\n<p>$$\\frac{Q_{max} - q(t)}{Q_{max}} = e^{-t/\\tau}$$</p>\n<p>si ha $e^{-1} \\simeq 37\\%$ dopo $\\tau$, $e^{-3}\\simeq 5\\%$ dopo $3\\tau$ e $e^{-5} \\simeq 0{,}67\\%$ dopo $5\\tau$. La regola operativa più diffusa è proprio quella dei <strong>$5\\tau$</strong>: dopo cinque costanti di tempo il circuito si considera a regime stazionario entro meno dell'$1\\%$.</p>"
        },
        {
          "subtitle": "Interpretazione fisica del processo di carica",
          "content": "<ol>\n<li>All'inizio ($t=0$), il condensatore è scarico ($V_C=0$) e non oppone resistenza al passaggio di corrente. La corrente è massima, $i_0 = f_{gen}/R$, come se ci fosse solo il resistore.</li>\n<li>Man mano che la corrente scorre, la carica si accumula sulle armature del condensatore ($+q$ su quella collegata al polo positivo, $-q$ sull'altra). Questa separazione di carica crea una differenza di potenziale $V_C = q/C$ che si <strong>oppone</strong> alla f.e.m. del generatore.</li>\n<li>La «forza» netta che spinge la corrente diminuisce: $f_{net} = f_{gen} - V_C(t)$. Di conseguenza la corrente nel circuito, data da $i(t) = f_{net}/R$, diminuisce esponenzialmente.</li>\n<li>Il processo tende asintoticamente a una situazione limite in cui $V_C \\to f_{gen}$, la forza netta tende a zero e la corrente si annulla: il circuito raggiunge (in pratica dopo alcune costanti di tempo, convenzionalmente $5\\tau$) uno stato di equilibrio, cioè il <strong>regime stazionario</strong>.</li>\n</ol>"
        }

          "label": "Equazione di maglia RC",
          "latex": "f_{gen} = R \\frac{dq}{dt} + \\frac{q}{C}"

      "id": "s14-esempio-rc",
      "type": "esercizio_svolto",
      "title": "Esercizio svolto — Transitorio di carica RC",
      "icon": "✎",
      "source": "docente",
      "content": "<p>Un generatore ideale di tensione continua con $f_{gen} = 10{,}0$ V è collegato in serie a un resistore $R = 2{,}0$ k$\\Omega$ e a un condensatore $C = 5{,}0$ $\\mu$F inizialmente scarico. All'istante $t=0$ si chiude l'interruttore. Calcolare: (a) la costante di tempo, (b) la corrente iniziale, (c) la carica e la tensione sul condensatore a $t=\\tau$, (d) la potenza dissipata nel resistore all'istante iniziale, (e) la durata pratica del transitorio.</p>",
      "steps": [
        "<strong>(a) Costante di tempo.</strong><br>$$\\tau = RC = (2{,}0 \\times 10^{3}\\ \\Omega)(5{,}0 \\times 10^{-6}\\ \\text{F}) = 1{,}0 \\times 10^{-2}\\ \\text{s} = 10\\ \\text{ms}$$",
        "<strong>(b) Corrente iniziale.</strong> A $t=0$ il condensatore è scarico, $V_C(0)=0$, quindi tutta la f.e.m. cade sul resistore:<br>$$i_0 = \\frac{f_{gen}}{R} = \\frac{10{,}0\\ \\text{V}}{2{,}0\\times 10^{3}\\ \\Omega} = 5{,}0 \\times 10^{-3}\\ \\text{A} = 5{,}0\\ \\text{mA}$$",
        "<strong>(c) Carica e tensione a $t = \\tau$.</strong> La carica finale è<br>$$Q_{max} = C f_{gen} = (5{,}0\\times10^{-6}\\ \\text{F})(10{,}0\\ \\text{V}) = 5{,}0\\times 10^{-5}\\ \\text{C} = 50\\ \\mu\\text{C}$$<br>e a $t=\\tau$ si ha $1 - e^{-1} \\simeq 0{,}632$, dunque<br>$$q(\\tau) \\simeq 0{,}632 \\cdot 50\\ \\mu\\text{C} \\simeq 32\\ \\mu\\text{C}, \\qquad V_C(\\tau) = \\frac{q(\\tau)}{C} \\simeq 6{,}3\\ \\text{V}$$<br>In quell'istante la corrente è scesa a $i(\\tau) = i_0 e^{-1} \\simeq 1{,}8$ mA, coerentemente con $V_R(\\tau) = f_{gen} - V_C(\\tau) \\simeq 3{,}7$ V.",
        "<strong>(d) Potenza dissipata iniziale.</strong> Per la legge di Joule,<br>$$P(0) = i_0^2 R = (5{,}0\\times10^{-3}\\ \\text{A})^2 (2{,}0\\times10^{3}\\ \\Omega) = 5{,}0 \\times 10^{-2}\\ \\text{W} = 50\\ \\text{mW}$$<br>È il valore massimo della potenza dissipata, poiché $P(t) = i^2(t) R = P(0)\\, e^{-2t/\\tau}$ decresce nel tempo.",
        "<strong>(e) Durata pratica del transitorio.</strong> Dopo $5\\tau = 50$ ms lo scarto dal valore finale è $e^{-5} \\simeq 0{,}67\\%$: la carica vale circa $49{,}7\\ \\mu$C e la corrente circa $34\\ \\mu$A. A tutti gli effetti pratici il circuito è a regime, pur senza che la carica sia mai esattamente $Q_{max}$."

    {
      "id": "s14-strategia",
      "type": "note_box",
      "title": "Strategia per gli esercizi sul circuito RC",
      "icon": "🧭",
      "content": "<p>Negli esercizi d'esame conviene procedere sempre nello stesso ordine:</p>\n<ol>\n<li>identificare $R$, $C$ e $f_{gen}$ e verificare che il condensatore sia <strong>inizialmente scarico</strong> (altrimenti la soluzione va riscritta con la condizione iniziale corretta);</li>\n<li>calcolare subito $\\tau = RC$, $Q_{max} = C f_{gen}$ e $i_0 = f_{gen}/R$: sono i tre parametri che fissano le scale del problema;</li>\n<li>scrivere le leggi $q(t)$, $V_C(t)$, $i(t)$ e valutarle negli istanti richiesti;</li>\n<li>per le domande energetiche, usare $P(t) = i^2(t)R$ per la potenza dissipata e $U_C = q^2/(2C)$ per l'energia immagazzinata nel condensatore.</li>\n</ol>"
    },
    {
      "id": "s14-richiamo-modello",
      "type": "section",
      "title": "Corrente e Andamenti Temporali: richiamo del modello",
      "icon": "🔁",
      "content": "<p>Continuiamo l'analisi del circuito RC, che abbiamo iniziato a studiare nel processo di carica. Ora determineremo l'andamento della corrente e faremo un <strong>bilancio energetico</strong> completo, per poi passare al processo di scarica.</p>\n<p>Il circuito considerato è un <strong>circuito RC in serie</strong>, costituito da:</p>\n<ul>\n<li>un <strong>generatore ideale</strong> di forza elettromotrice costante $f_{gen}$ (nessuna resistenza interna);</li>\n<li>una <strong>resistenza</strong> $R$, che rappresenta la resistenza complessiva del ramo di alimentazione;</li>\n<li>un <strong>condensatore</strong> di capacità $C$, <strong>inizialmente scarico</strong> ($q(0)=0$).</li>\n</ul>\n<p>Manteniamo per tutta la lezione la stessa notazione: $q(t)$ è la carica istantanea dell'armatura collegata al morsetto positivo del generatore, $V_C(t)=q(t)/C$ la tensione ai capi del condensatore e $V_R(t)=R\\,i(t)$ quella ai capi della resistenza; i simboli $Q_0$ e $Q_{max}$ sono riservati rispettivamente al valore iniziale e al valore di regime della carica. Il verso di riferimento della corrente è scelto in modo che sia $i(t)=dq/dt$, cioè concorde con il flusso di carica che alimenta l'armatura di carica $+q$.</p>",
      "subsections": [
        {
          "subtitle": "Derivazione della corrente",
          "content": "<p>Nella parte precedente, sotto queste ipotesi, abbiamo trovato l'espressione della carica accumulata sul condensatore:</p>\n<p>$$q(t) = C f_{gen} \\left( 1 - e^{-t/RC} \\right)$$</p>\n<p>Per trovare l'intensità di corrente basta derivare questa espressione rispetto al tempo, poiché per definizione $i(t) = \\dfrac{dq}{dt}$:</p>\n<p>$$i(t) = C f_{gen} \\frac{d}{dt} \\left( 1 - e^{-t/RC} \\right) = C f_{gen} \\left( - \\left(-\\frac{1}{RC}\\right) e^{-t/RC} \\right) = \\frac{C f_{gen}}{RC} e^{-t/RC}$$</p>\n<p>Semplificando:</p>\n<p>$$i(t) = \\frac{f_{gen}}{R} e^{-t/RC}$$</p>\n<p>La corrente <strong>non è costante</strong>, ma varia nel tempo con un andamento esponenziale decrescente.</p>"
        },
        {
          "subtitle": "Comportamento ai limiti",
          "content": "<ul>\n<li><strong>All'istante iniziale ($t=0$):</strong> l'esponenziale vale $e^0 = 1$ e la corrente assume il suo valore massimo $i(0) = \\dfrac{f_{gen}}{R} = i_0$. Questo è intuitivo: all'inizio il condensatore è scarico e non oppone alcuna resistenza al flusso di carica, quindi il circuito si comporta come se ci fosse solo la resistenza $R$.</li>\n<li><strong>Per tempi molto lunghi ($t \\to \\infty$):</strong> l'esponenziale tende a zero e la corrente si annulla, $i(\\infty) = 0$. Questo accade perché, una volta che il condensatore è completamente carico, si crea al suo interno un campo elettrico costante che si oppone a un ulteriore flusso di carica. Il circuito si comporta come se fosse aperto e la corrente cessa di scorrere.</li>\n</ul>"
        },
        {
          "subtitle": "Definizione — Costante di tempo di un circuito RC",
          "content": "<p>Si definisce <strong>costante di tempo</strong> del circuito RC la grandezza</p>\n<p>$$\\tau = RC$$</p>\n<p>Essa ha le dimensioni di un tempo e rappresenta il tempo caratteristico di carica e di scarica del condensatore: dopo un intervallo $t=\\tau$ la carica ha raggiunto circa il $63\\%$ del suo valore di regime, mentre la corrente è scesa a circa il $37\\%$ del suo valore iniziale.</p>"
        },
        {
          "subtitle": "Teorema — Leggi della carica di un circuito RC",
          "content": "<p>Sia dato un circuito RC in serie con generatore ideale di forza elettromotrice costante $f_{gen}$, resistenza $R$ e condensatore di capacità $C$ inizialmente scarico, cioè con condizione iniziale $q(0) = 0$. Detta $\\tau = RC$ la costante di tempo, per $t \\ge 0$ valgono le leggi</p>\n<p>$$q(t) = C f_{gen} \\left( 1 - e^{-t/\\tau} \\right), \\qquad V_C(t) = f_{gen} \\left( 1 - e^{-t/\\tau} \\right)$$</p>\n<p>$$i(t) = \\frac{f_{gen}}{R}\\, e^{-t/\\tau} = i_0 e^{-t/\\tau}, \\qquad V_R(t) = f_{gen}\\, e^{-t/\\tau}$$</p>\n<p>con $i_0 = f_{gen}/R$ corrente iniziale massima.</p>"
        }
      ]
    },
    {
      "id": "s14-int-90",
      "type": "integrazione_box",
      "title": "Integrazione — non detto dal docente",
      "icon": "➕",
      "content": "<p><strong>Esempio illustrativo: tempo necessario a raggiungere il $90\\%$ della tensione finale.</strong></p>\n<p>Il teorema precedente si applica tipicamente «al contrario»: si fissa una frazione della tensione di regime e si chiede dopo quanto tempo viene raggiunta. Questo è l'uso naturale del termine $1 - e^{-t/\\tau}$ della fase di carica.</p>\n<p><strong>Problema.</strong> Un condensatore di capacità $C$, inizialmente scarico, viene caricato attraverso una resistenza $R$ da un generatore di forza elettromotrice $f_{gen}$. Dopo quanto tempo la tensione ai capi del condensatore raggiunge il $90\\%$ del suo valore finale?</p>\n<p><strong>Soluzione.</strong> La legge di carica della tensione è</p>\n<p>$$V_C(t) = f_{gen}\\left(1 - e^{-t/\\tau}\\right), \\qquad \\tau = RC$$</p>\n<p>Imponiamo $V_C(t) = 0{,}9\\, f_{gen}$ e dividiamo entrambi i membri per $f_{gen} \\ne 0$:</p>\n<p>$$0{,}9 = 1 - e^{-t/\\tau} \\quad\\Rightarrow\\quad e^{-t/\\tau} = 1 - 0{,}9 = 0{,}1 = \\frac{1}{10}$$</p>\n<p>Prendendo il logaritmo naturale di entrambi i membri:</p>\n<p>$$-\\frac{t}{\\tau} = \\ln\\frac{1}{10} = -\\ln 10 \\quad\\Rightarrow\\quad t = \\tau \\ln 10 = RC \\ln 10 \\approx 2{,}30\\, RC$$</p>\n<p><strong>Verifica numerica.</strong> Con $R = 1\\ \\mathrm{k\\Omega}$ e $C = 2\\ \\mu\\mathrm{F}$:</p>\n<p>$$\\tau = RC = (10^3\\ \\Omega)(2 \\cdot 10^{-6}\\ \\mathrm{F}) = 2\\ \\mathrm{ms}, \\qquad t = (2\\ \\mathrm{ms})\\ln 10 \\approx 4{,}6\\ \\mathrm{ms}$$</p>\n<p>Si noti che il risultato <strong>non dipende da</strong> $f_{gen}$: la scala dei tempi è fissata soltanto dal prodotto $RC$. Lo stesso procedimento, imponendo $V_C(t) = \\alpha f_{gen}$ con $0 \\lt \\alpha \\lt 1$, fornisce in generale</p>\n<p>$$t = \\tau \\ln\\frac{1}{1-\\alpha}$$</p>\n<p>che per $\\alpha = 0{,}63$ restituisce $t \\approx \\tau$, coerentemente con il significato della costante di tempo.</p>"
    },
    {
      "id": "s14-grafici",
      "type": "section",
      "title": "Grafici degli andamenti nella fase di carica",
      "icon": "📈",
      "content": "<p>Visualizziamo l'evoluzione temporale delle principali grandezze del circuito RC durante la fase di carica, misurando il tempo in unità della costante di tempo $\\tau = RC$. L'asse orizzontale riporta dunque la variabile <strong>adimensionale</strong> $t/\\tau$: il valore $1$ su tale asse corrisponde all'istante $t = \\tau$, il valore $2$ a $t = 2\\tau$, e così via.</p>\n<figure class=\"figura\" data-id=\"fisica2_lez14b_d1\"><svg id=\"fisica2_lez14b_d1\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"425.807pt\" height=\"155.531pt\" viewBox=\"0 0 425.807 155.531\" version=\"1.2\"><style>#fisica2_lez14b_d1 [fill=\"rgb(0%,0%,0%)\"],#fisica2_lez14b_d1 [style*=\"fill:rgb(0%,0%,0%)\"]{fill:var(--text-primary)!important}#fisica2_lez14b_d1 [stroke=\"rgb(0%,0%,0%)\"],#fisica2_lez14b_d1 [style*=\"stroke:rgb(0%,0%,0%)\"]{stroke:var(--text-primary)!important}#fisica2_lez14b_d1 [fill=\"rgb(39.99939%,39.99939%,39.99939%)\"],#fisica2_lez14b_d1 [style*=\"fill:rgb(39.99939%,39.99939%,39.99939%)\"]{fill:#adadad!important}[data-mode=\"light\"] #fisica2_lez14b_d1 [fill=\"rgb(39.99939%,39.99939%,39.99939%)\"],[data-mode=\"light\"] #fisica2_lez14b_d1 [style*=\"fill:rgb(39.99939%,39.99939%,39.99939%)\"]{fill:#666666!important}#fisica2_lez14b_d1 [stroke=\"rgb(39.99939%,39.99939%,39.99939%)\"],#fisica2_lez14b_d1 [style*=\"stroke:rgb(39.99939%,39.99939%,39.99939%)\"]{stroke:#adadad!important}[data-mode=\"light\"] #fisica2_lez14b_d1 [stroke=\"rgb(39.99939%,39.99939%,39.99939%)\"],[data-mode=\"light\"] #fisica2_lez14b_d1 [style*=\"stroke:rgb(39.99939%,39.99939%,39.99939%)\"]{stroke:#666666!important}#fisica2_lez14b_d1 [fill=\"rgb(12.156677%,33.724976%,62.745667%)\"],#fisica2_lez14b_d1 [style*=\"fill:rgb(12.156677%,33.724976%,62.745667%)\"]{fill:#76a5e5!important}[data-mode=\"light\"] #fisica2_lez14b_d1 [fill=\"rgb(12.156677%,33.724976%,62.745667%)\"],[data-mode=\"light\"] #fisica2_lez14b_d1 [style*=\"fill:rgb(12.156677%,33.724976% e $i(t)$ e tensione $V_R(t)$ ai capi della resistenza decrescono invece esponenzialmente dal loro valore massimo ($i_0 = f_{gen}/R$ e $f_{gen}$) a $0$: in $t = \\tau$ entrambe si sono ridotte a circa il $37\\%$ del valore iniziale.</p>",
      "subsections": [
        {
          "subtitle": "Legge di Kirchhoff e ridistribuzione della tensione",
          "content": "<p>In ogni istante, la legge di Kirchhoff per la maglia deve essere soddisfatta: $f_{gen} = V_R(t) + V_C(t)$. Verifichiamolo:</p>\n<p>$$V_R(t) + V_C(t) = f_{gen} e^{-t/\\tau} + f_{gen}\\left(1-e^{-t/\\tau}\\right) = f_{gen} e^{-t/\\tau} + f_{gen} - f_{gen} e^{-t/\\tau} = f_{gen}$$</p>\n<p>L'equazione è sempre valida. Questo ci dà un'interpretazione fisica interessante:</p>\n<ul>\n<li>A $t=0$: $V_C(0)=0$ e $V_R(0)=f_{gen}$. <strong>Tutta</strong> la tensione del generatore cade sulla resistenza.</li>\n<li>A $t \\to \\infty$: $V_C(\\infty)=f_{gen}$ e $V_R(\\infty)=0$. <strong>Tutta</strong> la tensione del generatore cade sul condensatore.</li>\n</ul>\n<p>Durante il processo di carica, assistiamo a una «ridistribuzione» della tensione dalla resistenza al condensatore.</p>"
        }
      ]
    },
    {
      "id": "s14-bilancio",
      "type": "section",
      "title": "Bilancio Energetico nel Processo di Carica",
      "icon": "⚖️",
      "content": "<p>Analizziamo ora il circuito dal punto di vista energetico, studiando le potenze e le energie in gioco.</p>",
      "subsections": [
        {
          "subtitle": "Potenze istantanee",
          "content": "<p>La <strong>potenza erogata dal generatore</strong> è data da $P = f \\cdot i$. Nel nostro caso:</p>\n<p>$$P_{gen}(t) = f_{gen} \\cdot i(t) = f_{gen} \\left( \\frac{f_{gen}}{R} e^{-t/\\tau} \\right) = \\frac{f_{gen}^2}{R} e^{-t/\\tau}$$</p>\n<p>La potenza massima viene erogata all'istante $t=0$ e decresce esponenzialmente.</p>\n<p>La <strong>potenza dissipata dalla resistenza</strong> per effetto Joule è $P = R i^2$:</p>\n<p>$$P_R(t) = R \\cdot [i(t)]^2 = R \\frac{f_{gen}^2}{R^2} e^{-2t/\\tau} = \\frac{f_{gen}^2}{R} e^{-2t/\\tau}$$</p>\n<p>Notare il <strong>fattore 2 nell'esponente</strong>, che indica un decadimento più rapido rispetto alla potenza del generatore.</p>\n<p>La <strong>potenza immagazzinata nel condensatore</strong> rappresenta la rapidità con cui l'energia viene accumulata nel suo campo elettrico. Per il principio di conservazione dell'energia:</p>\n<p>$$P_{gen}(t) = P_R(t) + P_C(t) \\quad\\Rightarrow\\quad P_C(t) = P_{gen}(t) - P_R(t)$$</p>\n<p>$$P_C(t) = \\frac{f_{gen}^2}{R} e^{-t/\\tau} - \\frac{f_{gen}^2}{R} e^{-2t/\\tau} = \\frac{f_{gen}^2}{R} \\left( e^{-t/\\tau} - e^{-2t/\\tau} \\right)$$</p>"
        },
        {
          "subtitle": "Riepilogo: le tre potenze istantanee e il bilancio",
          "content": "<p>Per la fase di carica di un circuito RC serie con condensatore inizialmente scarico, le tre potenze istantanee sono</p>\n<p>$$P_{gen}(t) = f_{gen}\\, i(t) = \\frac{f_{gen}^2}{R}\\, e^{-t/\\tau} \\qquad \\text{(erogata dal generatore)}$$</p>\n<p>$$P_R(t) = R\\,[i(t)]^2 = \\frac{f_{gen}^2}{R}\\, e^{-2t/\\tau} \\qquad \\text{(dissipata per effetto Joule)}$$</p>\n<p>$$P_C(t) = \\frac{dU_C}{dt} = V_C(t)\\, i(t) = \\frac{f_{gen}^2}{R}\\left( e^{-t/\\tau} - e^{-2t/\\tau} \\right) \\qquad \\text{(assorbita dal condensatore)}$$</p>\n<p>In ogni istante vale il <strong>bilancio energetico</strong> $P_{gen}(t) = P_R(t) + P_C(t)$.</p>\n<p><strong>Attenzione al significato di $P_C$.</strong> $P_C$ non è una potenza dissipata, ma la <em>derivata temporale</em> dell'energia $U_C = \\frac{1}{2}\\,q^2/C$ immagazzinata nel campo elettrico del condensatore: è dunque la <strong>rapidità di accumulo dell'energia</strong> nel condensatore. Nel condensatore ideale l'energia accumulata resta disponibile; nella scarica attraverso $R$ essa viene interamente trasferita al resistore e qui convertita in calore — non è quindi energia «recuperata» in forma utile, come vedremo nel bilancio della scarica.</p>\n<p>Si osservi inoltre che $P_C(0) = 0$ (a $t=0$ si ha $V_C = 0$) e $P_C(\\infty) = 0$ (a regime la corrente è nulla): la potenza assorbita dal condensatore è massima a un istante <strong>intermedio</strong>, mentre $P_{gen}$ e $P_R$ sono massime a $t = 0$.</p>"
        },
        {
          "subtitle": "Energie totali",
          "content": "<p>Per trovare l'energia totale scambiata durante l'intero processo di carica (da $t=0$ a $t=\\infty$), integriamo le potenze nel tempo.</p>\n<p><strong>Energia totale erogata dal generatore</strong> ($L_{gen}$):</p>\n<p>$$L_{gen} = \\int_0^\\infty \\frac{f_{gen}^2}{R} e^{-t/\\tau} dt = \\frac{f_{gen}^2}{R} \\left[ -\\tau e^{-t/\\tau} \\right]_0^\\infty = \\frac{f_{gen}^2}{R} \\tau = \\frac{f_{gen}^2}{R} (RC) = C f_{gen}^2$$</p>\n<p><strong>Energia totale dissipata dalla resistenza</strong> ($L_R$):</p>\n<p>$$L_R = \\int_0^\\infty \\frac{f_{gen}^2}{R} e^{-2t/\\tau} dt = \\frac{f_{gen}^2}{R} \\left[ -\\frac{\\tau}{2} e^{-2t/\\tau} \\right]_0^\\infty = \\frac{f_{gen}^2}{R} \\frac{\\tau}{2} = \\frac{1}{2} C f_{gen}^2$$</p>\n<p><strong>Energia finale immagazzinata nel condensatore</strong> ($U_C$). Per la conservazione dell'energia, $U_C = L_{gen} - L_R$:</p>\n<p>$$U_C = C f_{gen}^2 - \\frac{1}{2} C f_{gen}^2 = \\frac{1}{2} C f_{gen}^2$$</p>\n<p>Questo risultato coincide perfettamente con la formula dell'energia immagazzinata in un condensatore carico a una tensione $V = f_{gen}$.</p>"
        }
      ],
      "formulas": [
        {
          "label": "Potenza del generatore",

          "label": "Potenza dissipata in R",

          "label": "Potenza assorbita da C",

    {
      "id": "s14-rendimento",
      "type": "alert_box",
      "title": "Il «rendimento» del 50%",
      "icon": "⚠️",
      "content": "<p>Questo risultato è fondamentale: per <strong>caricare completamente un condensatore inizialmente scarico attraverso una resistenza $R \\gt 0$, mediante un generatore ideale a tensione costante $f_{gen}$</strong>, il generatore deve fornire un'energia totale $L_{gen} = C f_{gen}^2$. Di questa energia:</p>\n<ul>\n<li><strong>Metà</strong> ($\\frac{1}{2} C f_{gen}^2$) viene immagazzinata nel campo elettrico del condensatore;</li>\n<li><strong>l'altra metà</strong> ($\\frac{1}{2} C f_{gen}^2$) viene irrimediabilmente persa, dissipata come calore nella resistenza per effetto Joule.</li>\n</ul>\n<p>Sotto queste ipotesi il «rendimento» del $50\\%$ <strong>non dipende dal valore di $R$</strong>: anche una resistenza molto piccola dissiperà sempre metà dell'energia fornita dal generatore (cambia solo la <em>rapidità</em> del processo, tramite $\\tau = RC$).</p>\n<p><strong>Attenzione:</strong> il risultato richiede tutte le ipotesi elencate. Se il condensatore è inizialmente già carico, oppure se la tensione di alimentazione varia nel tempo, il bilancio va rifatto e la frazione dissipata non è in generale $1/2$.</p>"
    },
    {
      "id": "s14-scarica",
      "type": "section",
      "title": "Il Circuito RC: Processo di Scarica",
      "icon": "🪫",
      "content": "<p>Consideriamo ora un condensatore, inizialmente carico con una carica $Q_0$ e una tensione $V_0 = Q_0/C$, che viene collegato a una resistenza $R$. Il generatore viene rimosso dal circuito, che resta però chiuso sulla sola maglia condensatore–resistenza. Il condensatore si comporterà ora come una <strong>sorgente</strong> di tensione, e la sua energia immagazzinata verrà dissipata dalla resistenza.</p>",
      "subsections": [
        {
          "subtitle": "Convenzioni di segno per la scarica",
          "content": "<p>Prima di scrivere le equazioni è indispensabile fissare le convenzioni, altrimenti le relazioni fra carica e corrente risultano ambigue.</p>\n<ul>\n<li>$q(t)$ indica la carica dell'<strong>armatura superiore</strong> del condensatore, che all'istante iniziale è positiva e pari a $Q_0$ (per questo è contrassegnata con il segno $+$);</li>\n<li>il <strong>verso di riferimento</strong> della corrente è scelto <strong>antiorario</strong>, cioè diretto verso destra nel ramo inferiore, poi verso l'alto nel ramo di destra e verso sinistra nel ramo superiore. Con questa scelta la corrente di riferimento positiva porterebbe carica positiva <em>sull'armatura superiore</em>, e dunque vale esattamente $i(t) = \\dfrac{dq}{dt}$.</li>\n</ul>\n<p>Poiché durante la scarica $q(t)$ diminuisce, si ha $dq/dt \\lt 0$ e quindi $i(t) \\lt 0$: la <strong>corrente fisica</strong> percorre il circuito nel verso <strong>opposto</strong> a quello di riferimento (cioè in senso orario), uscendo dall'armatura positiva e attraversando la resistenza da destra verso sinistra. Il segno negativo non indica dunque alcuna anomalia, ma solo che il verso reale è opposto a quello scelto come riferimento.</p>\n<figure class=\"figura\" data-id=\"fisica2_lez14b_d3\"><svg id=\"fisica2_lez14b_d3\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"128.636pt\" height=\"98.028pt\" viewBox=\"0 0 128.636 98.028\" version=\"1.2\"><style>#fisica2_lez14b_d3 [fill=\"rgb(0%,0%,0%)\"],#fisica2_lez14b_d3 [style*=\"fill:rgb(0%,0%,0%)\"]{fill:var(--text-primary)!important}#fisica2_lez14b_d3 [stroke=\"rgb(0%,0%,0%)\"],#fisica2_lez14b_d3 [style*=\"stroke:rgb(0%,0%,0%)\"]{stroke:var(--text-primary)!important}#fisica2_lez14b_d3 [fill=\"rgb(0%,0%,100%)\"],#fisica2_lez14b_d3 [style*=\"fill:rgb(0%,0%,100%)\"]{fill:#5c5cff!important}[data-mode=\"light\"] #fisica2_lez14b_d3 [fill=\"rgb(0%,0%,100%)\"],[data-mode=\"light\"] #fisica2_lez14b_d3 [style*=\"fill:rgb(0%,0%,100%)\ 0.363567 -0.00189447 0.000628994 C -1.047315 -0.362309 -2.084845 -1.245985 -2.550353 -3.111962 \" transform=\"matrix(0.990182,0,0,-0.990182,120.283126,73.672498)\"/>\n<g style=\"fill:rgb(0%,0%,100%);fill-opacity:1;\">\n  <use xlink:href=\"#fisica2_lez14b_d3-glyph0-4\" x=\"103.536131\" y=\"87.365722\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,100%);fill-opacity:1;\">\n  <use xlink:href=\"#fisica2_lez14b_d3-glyph1-2\" x=\"106.934435\" y=\"87.365722\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,100%);fill-opacity:1;\">\n  <use xlink:href=\"#fisica2_lez14b_d3-glyph0-5\" x=\"110.77139\" y=\"87.365722\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,100%);fill-opacity:1;\">\n  <use xlink:href=\"#fisica2_lez14b_d3-glyph1-3\" x=\"114.333074\" y=\"87.365722\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#fisica2_lez14b_d3-glyph1-1\" x=\"43.862824\" y=\"12.985244\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#fisica2_lez14b_d3-glyph2-1\" x=\"43.862824\" y=\"85.962635\"/>\n</g>\n</g>\n</svg><figcaption>Scarica: la freccia indica il verso di riferimento antiorario, per cui $i=dq/dt&lt;0$. La corrente fisica scorre in senso opposto alla freccia, dall’armatura positiva attraverso il resistore.</figcaption></figure>\n<p>Nella figura, $q$ è la carica dell'armatura superiore (inizialmente $Q_0 \\gt 0$) e la freccia blu indica il verso di riferimento della corrente, scelto antiorario.</p>"
        },
        {
          "subtitle": "Equazione e risoluzione",
          "content": "<p>La legge di Kirchhoff per questa maglia, in assenza di generatore, è</p>\n<p>$$V_R(t) + V_C(t) = 0$$</p>\n<p>Sostituendo le espressioni $V_R = iR$ e $V_C = q/C$, e ricordando che con le convenzioni fissate $i = dq/dt$:</p>\n<p>$$R \\frac{dq}{dt} + \\frac{q}{C} = 0$$</p>\n<p>È un'equazione differenziale a variabili separabili:</p>\n<p>$$R \\frac{dq}{dt} = -\\frac{q}{C} \\quad\\Rightarrow\\quad \\frac{dq}{q} = -\\frac{1}{RC} dt$$</p>\n<p>Integriamo entrambi i membri, con la condizione iniziale che a $t=0$ la carica sia $Q_0$:</p>\n<p>$$\\int_{Q_0}^{q(t)} \\frac{dq'}{q'} = \\int_0^t -\\frac{1}{RC} dt' \\quad\\Rightarrow\\quad \\ln\\left(\\frac{q(t)}{Q_0}\\right) = -\\frac{t}{RC}$$</p>\n<p>Applicando l'esponenziale a entrambi i membri, otteniamo la legge di scarica:</p>\n<p>$$q(t) = Q_0 e^{-t/RC}$$</p>\n<p>La carica sul condensatore decade esponenzialmente a zero.</p>"
        },
        {
          "subtitle": "Corrente di scarica",
          "content": "<p>Per la corrente, deriviamo $q(t)$:</p>\n<p>$$i(t) = \\frac{dq}{dt} = Q_0 \\left(-\\frac{1}{RC}\\right) e^{-t/RC} = -\\frac{Q_0}{RC} e^{-t/RC}$$</p>\n<p>Ricordando che $Q_0 = C V_0$, dove $V_0$ è la tensione iniziale ai capi del condensatore, si ottiene la forma più comoda</p>\n<p>$$i(t) = -\\frac{C V_0}{RC} e^{-t/\\tau} = -\\frac{V_0}{R} e^{-t/\\tau}$$</p>\n<p>In particolare, se il condensatore era stato caricato dal generatore del paragrafo precedente fino alla tensione $V_0 = f_{gen}$ (cioè $Q_0 = C f_{gen}$), allora</p>\n<p>$$i(t) = -\\frac{f_{gen}}{R} e^{-t/\\tau} = -i_0 e^{-t/\\tau}, \\qquad i_0 = \\frac{f_{gen}}{R} = \\frac{V_0}{R}$$</p>\n<p>Il segno negativo, come già osservato, indica che la corrente di scarica fluisce in verso opposto a quello di riferimento (e quindi opposto a quello della corrente di carica).</p>"
        },
        {
          "subtitle": "Teorema — Leggi della scarica di un circuito RC",
          "content": "<p>Sia dato un condensatore di capacità $C$, inizialmente carico con carica $Q_0$ e tensione $V_0 = Q_0/C$, chiuso su una resistenza $R$ in assenza di generatore. Con la condizione iniziale $q(0) = Q_0$ e detta $\\tau = RC$ la costante di tempo, per $t \\ge 0$ valgono le leggi</p>\n<p>$$q(t) = Q_0 e^{-t/\\tau}, \\qquad V_C(t) = V_0 e^{-t/\\tau}$$</p>\n<p>$$i(t) = -\\frac{V_0}{R} e^{-t/\\tau}, \\qquad V_R(t) = -V_0 e^{-t/\\tau}$$</p>\n<p>dove il segno negativo della corrente si riferisce al verso antiorario scelto come riferimento (quello per cui $i = dq/dt$).</p>"
        },
        {
          "subtitle": "Grafici della scarica",
          "content": "<ul>\n<li><strong>Carica e tensione:</strong> $q(t)$ e $V_C(t) = q(t)/C$ partono dal loro valore massimo $Q_0$ (o $V_0$) e decadono esponenzialmente a zero.</li>\n<li><strong>Corrente:</strong> $i(t)$ parte dal valore negativo $-V_0/R$ e tende a zero «da sotto».</li>\n</ul>\n<figure class=\"figura\" data-id=\"fisica2_lez14b_d4\"><svg id=\"fisica2_lez14b_d4\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"357.105pt\" height=\"208.258pt\" viewBox=\"0 0 357.105 208.258\" version=\"1.2\"><style>#fisica2_lez14b_d4 [fill=\"rgb(0%,0%,0%)\"],#fisica2_lez14b_d4 [style*=\"fill:rgb(0%,0%,0%)\"]{fill:var(--text-primary)!important}#fisica2_lez14b_d4 [stroke=\"rgb(0%,0%,0%)\"],#fisica2_lez14b_d4 [style*=\"stroke:rgb(0%,0%,0%)\"]{stroke:var(--text-primary)!important}#fisica2_lez14b_d4 [fill=\"rgb(0%,0%,100%)\"],#fisica2_lez14b_d4 [style*=\"fill:rgb(0%,0%,100%)\"]{fill:#5c5cff!important}[data-mode=\"light\"] #fisica2_lez14b_d4 [fill=\"rgb(0%,0%,100%)\"],[data-mode=\"light\"] #fisica2_lez14b_d4 [style*=\"fill:rgb(0%,0%,100%)\"]{fill:#0000ff!important}#fisica2_lez14b_d4 [stroke=\"rgb(0%,0%,100%)\"],#fisica2_lez14b_d4 [style*=\"stroke:rgb(0%,0%,100%)\"]{stroke:#5c5cff!important}[data-mode=\"light\"] #fisica2_lez14b_d4 [stroke=\"rgb(0%,0%,100%)\"],[data-mode=\"light\"] #fisica2_lez14b_d4 [style*=\"stroke:rgb(0%,0%,100%)\"]{stroke:#0000ff!important}</style>\n<defs>\n<g>\n<symbol overflow=\"visible\" id=\"fisica2_lez14b_d4-glyph0-0\">\n<path style=\"stroke:none;\" d=\"\"/>\n</symbol>\n<symbol overflow=\"visible\" id=\"fisica2_lez14b_d4-glyph0-1\">\n<path style=\"stroke:none;\" d=\"M 3.109375 -1.421875 C 3.109375 -1.515625 3.03125 -1.515625 3 -1.515625 C 2.90625 -1.515625 2.890625 -1.484375 2.84375 -1.375 C 2.421875 -0.34375 1.890625 -0.109375 1.5625 -0.109375 C 1.34375 -0.109375 1.25 -0.234375 1.25 -0.5625 C 1.25 -0.796875 1.265625 -0.875 1.3125 -1.046875 L 2.046875 -3.96875 L 2.96875 -3.96875 C 3.171875 -3.96875 3.28125 -3 >\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#fisica2_lez14b_d4-glyph1-2\" x=\"298.023837\" y=\"197.757412\"/>\n</g>\n</g>\n</svg><figcaption>Scarica con $i=dq/dt$: la carica resta positiva e tende a zero; la corrente di riferimento è negativa e tende a zero dal basso. L’ascissa è $t/\\tau$.</figcaption></figure>\n<p>In entrambi i grafici l'asse orizzontale è la variabile adimensionale $t/\\tau$, con $\\tau = RC$: l'ascissa $t/\\tau = 1$ corrisponde all'istante $t = \\tau$, in cui la carica residua è circa il $37\\%$ di $Q_0$. Il segno negativo indica che il flusso reale di carica avviene nel verso opposto a quello di riferimento.</p>"
        },
        {
          "subtitle": "Bilancio energetico della scarica",
          "content": "<p>L'energia iniziale immagazzinata nel condensatore è $U_{C,0} = \\dfrac{1}{2} \\dfrac{Q_0^2}{C} = \\dfrac{1}{2} C V_0^2$. Durante la scarica, questa energia viene <strong>completamente dissipata</strong> per effetto Joule nella resistenza. Usando direttamente $i(t) = -\\dfrac{V_0}{R} e^{-t/\\tau}$:</p>\n<p>$$L_R = \\int_0^\\infty R\\,[i(t)]^2 dt = \\int_0^\\infty R \\left(-\\frac{V_0}{R} e^{-t/\\tau}\\right)^2 dt = \\frac{V_0^2}{R} \\int_0^\\infty e^{-2t/\\tau} dt$$</p>\n<p>$$L_R = \\frac{V_0^2}{R} \\left[ -\\frac{\\tau}{2} e^{-2t/\\tau} \\right]_0^\\infty = \\frac{V_0^2}{R} \\cdot \\frac{\\tau}{2} = \\frac{V_0^2}{R} \\cdot \\frac{RC}{2} = \\frac{1}{2} C V_0^2$$</p>\n<p>Il calcolo è formalmente identico a quello della fase di carica (si ottiene da esso ponendo $f_{gen} \\to V_0$), e conferma che</p>\n<p>$$L_R = \\frac{1}{2} C V_0^2 = U_{C,0}$$</p>\n<p>cioè che <strong>tutta</strong> l'energia inizialmente immagazzinata nel condensatore viene convertita in calore nella resistenza, indipendentemente dal valore di $R$ (che influenza solo la <em>rapidità</em> con cui ciò avviene, attraverso $\\tau = RC$).</p>"
        }
      ],
      "formulas": [

          "label": "Carica (scarica)",

        },
        {
          "label": "Energia dissipata nella scarica",

        }

      "id": "s14-lampadina",
      "type": "esercizio_svolto",
      "title": "Esercizio svolto — Condensatore come alimentazione temporanea",
      "icon": "💡",
      "source": "docente",
      "content": "<p>Immaginiamo un circuito con un generatore di forza elettromotrice $f_{gen}$, un condensatore $C$ e una lampadina (che modellizziamo come una resistenza $R$). Il condensatore e la lampadina sono collegati <strong>in parallelo</strong> fra loro, e questo blocco è alimentato dal generatore attraverso un ramo in cui è presente un <strong>interruttore</strong> e la resistenza complessiva $R_{al}$ del ramo di alimentazione (resistenza interna del generatore, conduttori, eventuali resistori). Determiniamo tensione di regime e costanti di tempo nelle due fasi.</p>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px;align-items:start;\"><figure class=\"figura\" data-id=\"fisica2_lez14b_d5\"><svg id=\"fisica2_lez14b_d5\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"248.928pt\" height=\"178.701pt\" viewBox=\"0 0 248.928 178.701\" version=\"1.2\"><style>#fisica2_lez14b_d5 [fill=\"rgb(0%,0%,0%)\"],#fisica2_lez14b_d5 [style*=\"fill:rgb(0%,0%,0%)\"]{fill:var(--text-primary)!important}#fisica2_lez14b_d5 [stroke=\"rgb(0%,0%,0%)\"],#fisica2_lez14b_d5 [style*=\"stroke:rgb(0%,0%,0%)\"]{stroke:var(--text-primary)!important}#fisica2_lez14b_d5 [fill=\"rgb(0%,0%,100%)\"],#fisica2_lez14b_d5 [style*=\"fill:rgb(0%,0%,100%)\"]{fill:#5c5cff!important}[data-mode=\"light\"] #fisica2_lez14b_d5 [fill=\"rgb(0%,0%,100%)\"],[data-mode=\"light\"] #fisica2_lez14b_d5 [style*=\"fill:rgb(0%,0%,100%)\"]{fill:#0000ff!important}#fisica2_lez14b_d5 [stroke=\"rgb(0%,0%,100%)\"],#fisica2_lez14b_d5 [style*=\"stroke:rgb(0%,0%,100%)\"]{stroke:#5c5cff!important}[data-mode=\"light\"] #fisica2_lez14b_d5 [stroke=\"rgb(0%,0%,100%)\"],[data-mode=\"light\"] #fisica2_lez14b_d5 [style*=\"stroke:rgb(0%,0%,100%)\"]{stroke:#0000ff!important}</style>\n<defs>\n<g>\n<symbol overflow=\"visible\" id=\"fisica2_lez14b_d5-glyph0-0\">\n<path style=\"stroke:none;\" d=\"\"/>\n</symbol>\n<symbol overflow=\"visible\" id=\"fis acity:1;\">\n  <use xlink:href=\"#fisica2_lez14b_d6-glyph3-2\" x=\"168.867237\" y=\"164.039643\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#fisica2_lez14b_d6-glyph1-7\" x=\"179.348178\" y=\"164.039643\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#fisica2_lez14b_d6-glyph6-2\" x=\"185.139255\" y=\"165.528521\"/>\n</g>\n</g>\n</svg><figcaption>Fase 2, interruttore aperto: il ramo del generatore non forma più una maglia chiusa. Il condensatore si scarica soltanto sulla lampadina, con $\\tau=RC$ e tensione iniziale $V_0=V_\\infty$. La freccia $I_R$ indica il verso fisico della corrente nella lampadina.</figcaption></figure></div><p>Nei due schemi il terminale superiore del generatore è positivo e il condensatore ha la stessa polarità iniziale. La freccia $I_R$ indica la corrente fisica nella lampadina: nella scarica $I_R=-dq/dt>0$, mentre con la convenzione di riferimento del paragrafo precedente $i=dq/dt\\lt0$.</p>",
      "steps": [
        "<strong>Fase 1 (interruttore chiuso) — tensione di regime.</strong> Il generatore alimenta la lampadina e contemporaneamente carica il condensatore. A regime la corrente nel condensatore è nulla, quindi la sua tensione è quella imposta dal <strong>partitore</strong> fra $R_{al}$ e $R$:<br>$$V_\\infty = f_{gen}\\, \\frac{R}{R_{al} + R}$$",
        "<strong>Fase 1 — costante di tempo.</strong> Per determinare la <em>rapidità</em> della carica occorre chiedersi quale resistenza «vede» il condensatore. Scriviamo la legge dei nodi al morsetto superiore del condensatore: la corrente che arriva dal ramo di alimentazione si divide fra il condensatore e la lampadina,<br>$$\\frac{f_{gen} - V_C}{R_{al}} = C \\frac{dV_C}{dt} + \\frac{V_C}{R}$$<br>Riordinando,<br>$$C \\frac{dV_C}{dt} + \\left(\\frac{1}{R_{al}} + \\frac{1}{R}\\right) V_C = \\frac{f_{gen}}{R_{al}}$$<br>si riconosce il coefficiente di decadimento $\\dfrac{1}{C}\\left(\\dfrac{1}{R_{al}}+\\dfrac{1}{R}\\right)$, cioè una costante di tempo pari al prodotto di $C$ per il <strong>parallelo</strong> di $R_{al}$ e $R$:<br>$$R_{eq} = R_{al} \\parallel R = \\frac{R_{al}\\, R}{R_{al} + R}, \\qquad \\tau_{carica} = R_{eq}\\, C = \\frac{C\\, R_{al}\\, R}{R_{al} + R}$$<br>Questo è anche il contenuto della regola pratica «si annulla la f.e.m. del generatore e si guarda la resistenza vista dal condensatore»: annullando $f_{gen}$ il ramo di alimentazione si riduce alla sola $R_{al}$, che risulta in parallelo a $R$ ai capi di $C$. La regola non è un postulato: è la lettura del coefficiente dell'equazione differenziale appena scritta, e va applicata solo dopo aver scritto (o saputo scrivere) quell'equazione.",
        "<strong>Fase 1 — caso pratico tipico.</strong> Soltanto nell'<strong>approssimazione</strong> $R_{al} \\ll R$ si ha $R_{eq} \\approx R_{al}$, e quindi $\\tau_{carica} \\approx R_{al} C$ e $V_\\infty \\approx f_{gen}$: è il caso pratico tipico, in cui il ramo di alimentazione è molto meno resistivo della lampadina, ma <strong>non</strong> è il caso generale.",
        "<strong>Fase 2 (interruttore aperto).</strong> L'interruttore <strong>scollega il ramo del generatore</strong>, eliminando $R_{al}$ dal circuito e lasciando chiuso il solo circuito condensatore–lampadina. Il condensatore, carico alla tensione $V_0 = V_\\infty$, inizia a scaricarsi attraverso la sola lampadina, con<br>$$\\tau_{scarica} = RC$$",
        "<strong>Gerarchia dei tempi e interpretazione.</strong> Poiché $R_{eq} \\le R$, si ha sempre $\\tau_{carica} \\le \\tau_{scarica}$. Nel caso tipico $R_{al} \\ll R$ la carica è molto più rapida della scarica, ed è proprio questo che rende il dispositivo utile: il condensatore si ricarica quasi istantaneamente e si scarica lentamente. La lampadina rimarrà accesa per un breve periodo, alimentata dall'energia immagazzinata nel condensatore; la potenza dissipata nella lampadina, nel modello resistivo adottato, vale $P_R(t)=V_0^2e^{-2t/(RC)}/R$ e diminuisce esponenzialmente; anche la luminosità diminuisce, ma la sua relazione con la potenza dipende dalle caratteristiche reali della lampadina. Questo principio è alla base di molti dispositivi di backup o di alimentazione temporanea."
      ]

      "id": "s14-interruttore",
      "type": "alert_box",
      "title": "Perché serve l'interruttore",
      "icon": "🚨",
      "content": "<p>Nell'esempio precedente è essenziale distinguere <strong>«generatore spento»</strong> da <strong>«generatore staccato»</strong>. Un generatore semplicemente <strong>spento</strong> non equivale in generale a un circuito aperto: esso resta un bipolo collegato, con la propria resistenza interna, attraverso il quale il condensatore può scaricarsi (in parte o del tutto), spesso molto più rapidamente che attraverso la lampadina.</p>\n<p>Nel modello in cui «spegnere» significa porre $f_{gen}=0$ lasciando collegata la stessa resistenza $R_{al}$, la costante di tempo della scarica non è $RC$ ma $C\\,\\dfrac{R_{al}R}{R_{al}+R}$, cioè la stessa della carica: con $R_{al} \\ll R$ il condensatore si svuoterebbe quasi istantaneamente nel ramo di alimentazione, senza accendere la lampadina.</p>\n<p>Le leggi di scarica scritte sopra, con $\\tau = RC$, descrivono il circuito <strong>solo se il ramo del generatore è effettivamente interrotto</strong>, così che l'unica maglia chiusa sia quella condensatore–resistenza.</p>"

      "id": "s14-int-dimezzamento",
      "type": "integrazione_box",
      "title": "Integrazione — non detto dal docente",
      "icon": "➕",
      "content": "<p><strong>Esercizio illustrativo: tempo di dimezzamento della tensione.</strong></p>\n<p>Le leggi della scarica si usano tipicamente «al contrario»: note le grandezze elettriche, si chiede <em>quanto tempo</em> occorre perché il condensatore raggiunga una certa condizione. Vediamo il caso più frequente.</p>\n<p><strong>Problema.</strong> Un condensatore di capacità $C$, carico alla tensione iniziale $V_0$, si scarica su una resistenza $R$. Dopo quanto tempo la tensione ai suoi capi si è ridotta alla metà del valore iniziale?</p>\n<p><strong>Soluzione.</strong> La legge di scarica della tensione è $V_C(t) = V_0 e^{-t/\\tau}$ con $\\tau = RC$. Imponiamo la condizione richiesta $V_C(t) = V_0/2$:</p>\n<p>$$\\frac{V_0}{2} = V_0 e^{-t/\\tau} \\quad\\Rightarrow\\quad \\frac{1}{2} = e^{-t/\\tau}$$</p>\n<p>Prendendo il logaritmo naturale di entrambi i membri:</p>\n<p>$$\\ln\\frac{1}{2} = -\\frac{t}{\\tau} \\quad\\Rightarrow\\quad -\\ln 2 = -\\frac{t}{\\tau}$$</p>\n<p>da cui il <strong>tempo di dimezzamento</strong></p>\n<p>$$t_{1/2} = \\tau \\ln 2 = RC \\ln 2 \\approx 0{,}693\\, RC$$</p>\n<p><strong>Verifica numerica.</strong> Con $R = 10\\ \\mathrm{k\\Omega}$ e $C = 100\\ \\mu\\mathrm{F}$:</p>\n<p>$$\\tau = RC = (10^4\\ \\Omega)(10^{-4}\\ \\mathrm{F}) = 1\\ \\mathrm{s}, \\qquad t_{1/2} = (1\\ \\mathrm{s})\\ln 2 \\approx 0{,}69\\ \\mathrm{s}$$</p>\n<p>Si noti che il risultato <strong>non dipende da</strong> $V_0$: il tempo di dimezzamento è una proprietà del solo circuito. Lo stesso procedimento, con $V_C(t) = \\alpha V_0$, fornisce in generale $t = \\tau \\ln(1/\\alpha)$; ad esempio per scendere al $10\\%$ del valore iniziale servono $t = \\tau \\ln 10 \\approx 2{,}3\\,\\tau$. Si osservi la simmetria con l'esempio di carica visto in precedenza: lo stesso $\\tau \\ln 10$ che porta la scarica al $10\\%$ del valore iniziale porta la carica al $90\\%$ del valore finale.</p>"
    },

    {
      "id": "s14-ex-teoria1",
      "type": "esercizio",
      "title": "Teoria 1",
      "kind": "teoria",
      "source": "integrazione",
      "icon": "📘",
      "content": "<p>Ricava la legge di Joule partendo dalla definizione di potenza, elencane le tre forme equivalenti e spiega quale conviene usare per un resistore inserito in serie e quale per un resistore inserito in parallelo. Scrivi infine l'energia dissipata in un intervallo $[t_1,t_2]$ quando la corrente dipende dal tempo.</p>",
      "solution": "<p><strong>Derivazione.</strong> In un intervallo $dt$ attraverso una sezione del conduttore passa la carica $dq = i\\,dt$. Il lavoro compiuto dal campo per portare questa carica attraverso la differenza di potenziale $\\Delta V$ applicata ai capi del conduttore è</p>\n<p>$$dW = \\Delta V\\,dq = \\Delta V\\, i\\,dt \\quad\\Rightarrow\\quad P = \\frac{dW}{dt} = i\\,\\Delta V$$</p>\n<p><strong>Le tre forme.</strong> Se il conduttore è ohmico vale $\\Delta V = iR$ e sostituendo si ottengono</p>\n<p>$$P = i\\,\\Delta V = i^2R = \\frac{(\\Delta V)^2}{R}$$</p>\n<p>L'equivalenza delle ultime due con la prima richiede l'ipotesi di conduttore ohmico con $R$ costante.</p>\n<p><strong>Quale forma conviene.</strong> In un collegamento in <strong>serie</strong> la corrente $i$ è comune a tutti gli elementi, quindi conviene $P_k = i^2R_k$: dissipa più potenza il resistore con resistenza <em>maggiore</em>. In un collegamento in <strong>parallelo</strong> è comune la tensione $\\Delta V$, quindi conviene $P_k = (\\Delta V)^2/R_k$: dissipa più potenza il resistore con resistenza <em>minore</em>.</p>\n<p><strong>Energia con corrente variabile.</strong> Se la corrente varia nel tempo, la potenza istantanea è $P(t) = i^2(t)R$ e l'energia dissipata è</p>\n<p>$$W = \\int_{t_1}^{t_2} i^2(t)\\,R\\,dt$$</p>"
    },
    {
      "id": "s14-ex-teoria2",
      "type": "esercizio",
      "title": "Teoria 2",
      "kind": "teoria",
      "source": "integrazione",
      "icon": "📘",
      "content": "<p>Partendo dalla legge di carica $q(t)=C f_{gen}\\left(1-e^{-t/\\tau}\\right)$ di un circuito RC serie con condensatore inizialmente scarico e $\\tau=RC$, ricava l'espressione della corrente $i(t)$, calcola $i(0)$ e $\\lim_{t\\to+\\infty} i(t)$ interpretandoli fisicamente, e verifica che in ogni istante vale $f_{gen}=V_R(t)+V_C(t)$.</p>",
      "solution": "<p><strong>Derivazione della corrente.</strong> Poiché il verso di riferimento della corrente è scelto in modo che $i(t)=\\dfrac{dq}{dt}$, si deriva:</p>\n<p>$$i(t)=\\frac{d}{dt}\\left[C f_{gen}\\left(1-e^{-t/\\tau}\\right)\\right]=C f_{gen}\\cdot\\frac{1}{\\tau}e^{-t/\\tau}=\\frac{C f_{gen}}{RC}e^{-t/\\tau}$$</p>\n<p>cioè</p>\n<p>$$i(t)=\\frac{f_{gen}}{R}e^{-t/\\tau}=i_0e^{-t/\\tau}, \\qquad i_0=\\frac{f_{gen}}{R}$$</p>\n<p><strong>Istante iniziale.</strong> Per $t=0$ si ha $e^0=1$ e quindi $i(0)=\\dfrac{f_{gen}}{R}=i_0$, valore massimo: il condensatore scarico ha $V_C(0)=q(0)/C=0$ e si comporta come un corto circuito, dunque la corrente è limitata dalla sola $R$.</p>\n<p><strong>Regime.</strong> Per $t\\to+\\infty$ si ha $e^{-t/\\tau}\\to 0$ e quindi $i(\\infty)=0$: a regime $V_C=f_{gen}$, la tensione del generatore è interamente equilibrata da quella del condensatore e il ramo si comporta come un circuito aperto.</p>\n<p><strong>Verifica di Kirchhoff.</strong> Si ha $V_C(t)=\\dfrac{q(t)}{C}=f_{gen}\\left(1-e^{-t/\\tau}\\right)$ e $V_R(t)=R\\,i(t)=f_{gen}e^{-t/\\tau}$, quindi</p>\n<p>$$V_R(t)+V_C(t)=f_{gen}e^{-t/\\tau}+f_{gen}-f_{gen}e^{-t/\\tau}=f_{gen} \\qquad \\forall\\, t\\ge 0$$</p>\n<p>La legge di Kirchhoff è soddisfatta istante per istante, con una progressiva ridistribuzione della tensione da $R$ a $C$.</p>"
    },

      "id": "s14-ex-teoria3",
      "type": "esercizio",
      "title": "Teoria 3",
      "kind": "teoria",
      "source": "integrazione",
      "icon": "📘",
      "content": "<p>Definisci la forza elettromotrice di un generatore e spiega perché l'azione del generatore non può essere descritta da un potenziale, a differenza del campo elettrostatico. Chiarisci inoltre la differenza fra generatore ideale di tensione e generatore ideale di corrente.</p>",
      "solution": "<p><strong>Definizione di f.e.m.</strong> All'interno del generatore agisce una forza motrice per unità di carica $\\vec{E}_m$, detta <em>campo elettromotore</em>, di natura non elettrostatica (chimica, magnetica, meccanica). La forza elettromotrice è il lavoro per unità di carica compiuto da $\\vec{E}_m$ per portare una carica dal polo negativo $A$ al polo positivo $B$ all'interno del generatore:</p>\n<p>$$f = \\int_{A(-)}^{B(+)} \\vec{E}_m\\cdot d\\vec{l}$$</p>\n<p>Dimensionalmente è un'energia per unità di carica e si misura in volt; per un generatore ideale coincide con la differenza di potenziale fra i terminali, $f = V_B - V_A$.</p>\n<p><strong>Perché non esiste un potenziale.</strong> Il campo elettrostatico è conservativo, cioè $\\oint \\vec{E}\\cdot d\\vec{l} = 0$: da solo non potrebbe mantenere una corrente lungo una linea chiusa, perché il lavoro totale su un giro sarebbe nullo mentre nel circuito si dissipa energia per effetto Joule. Il campo elettromotore ha invece <strong>circuitazione non nulla</strong> lungo la maglia (pari a $f$) e proprio per questo non è esprimibile come $-\\nabla V$ di una funzione potenziale: dentro il generatore esso sposta le cariche positive dal polo negativo al polo positivo, cioè <em>contro</em> il campo elettrostatico presente fra i poli.</p>\n<p><strong>Tensione vs corrente.</strong> Un generatore ideale di <em>tensione</em> impone la differenza di potenziale $f$ ai suoi terminali e lascia che la corrente sia determinata dal resto del circuito (con un resistore $R$ si ha $i = f/R$, con $2R$ si ha $i = f/(2R)$); un generatore ideale di <em>corrente</em> impone l'intensità $i$ ed è la tensione ai suoi capi ad adattarsi al circuito.</p>"
    },
    {
      "id": "s14-ex-teoria4",
      "type": "esercizio",
      "title": "Teoria 4",
      "kind": "teoria",
      "source": "integrazione",
      "icon": "📘",
      "content": "<p>Scrivi le tre potenze istantanee $P_{gen}(t)$, $P_R(t)$ e $P_C(t)$ nella fase di carica di un circuito RC serie con condensatore inizialmente scarico, dimostra il bilancio $P_{gen}=P_R+P_C$ e, integrando le potenze su $[0,+\\infty)$, mostra che solo metà dell'energia erogata dal generatore si ritrova immagazzinata nel condensatore. Determina inoltre l'istante in cui $P_C$ è massima.</p>",
      "solution": "<p><strong>Le tre potenze.</strong> Con $i(t)=\\dfrac{f_{gen}}{R}e^{-t/\\tau}$ e $V_C(t)=f_{gen}\\left(1-e^{-t/\\tau}\\right)$:</p>\n<p>$$P_{gen}(t)=f_{gen}\\,i(t)=\\frac{f_{gen}^2}{R}e^{-t/\\tau}$$</p>\n<p>$$P_R(t)=R\\,i^2(t)=\\frac{f_{gen}^2}{R}e^{-2t/\\tau}$$</p>\n<p>$$P_C(t)=\\frac{dU_C}{dt}=V_C(t)\\,i(t)=\\frac{f_{gen}^2}{R}\\left(e^{-t/\\tau}-e^{-2t/\\tau}\\right)$$</p>\n<p><strong>Bilancio.</strong> Sommando le ultime due:</p>\n<p>$$P_R+P_C=\\frac{f_{gen}^2}{R}e^{-2t/\\tau}+\\frac{f_{gen}^2}{R}e^{-t/\\tau}-\\frac{f_{gen}^2}{R}e^{-2t/\\tau}=\\frac{f_{gen}^2}{R}e^{-t/\\tau}=P_{gen}$$</p>\n<p>cioè il bilancio è verificato in ogni istante.</p>\n<p><strong>Energie totali.</strong> Integrando su $[0,+\\infty)$:</p>\n<p>$$L_{gen}=\\int_0^{+\\infty}\\frac{f_{gen}^2}{R}e^{-t/\\tau}\\,dt=\\frac{f_{gen}^2}{R}\\,\\tau=\\frac{f_{gen}^2}{R}\\,RC=C f_{gen}^2$$</p>\n<p>$$L_R=\\int_0^{+\\infty}\\frac{f_{gen}^2}{R}e^{-2t/\\tau}\\,dt=\\frac{f_{gen}^2}{R}\\cdot\\frac{\\tau}{2}=\\frac{1}{2}C f_{gen}^2$$</p>\n<p>$$U_C=L_{gen}-L_R=C f_{gen}^2-\\frac{1}{2}C f_{gen}^2=\\frac{1}{2}C f_{gen}^2$$</p>\n<p>in accordo con $U_C=\\frac{1}{2}CV^2$ per $V=f_{gen}$. Il rendimento è esattamente $50\\%$ e non dipende da $R$, che fissa solo la scala temporale $\\tau=RC$.</p>\n<p><strong>Massimo di $P_C$.</strong> Ponendo $x=e^{-t/\\tau}\\in(0,1)$ si ha $P_C=\\dfrac{f_{gen}^2}{R}(x-x^2)$. Completando il quadrato,</p>\n<p>$$x-x^2=\\frac{1}{4}-\\left(x-\\frac{1}{2}\\right)^2$$</p>\n<p>da cui si legge immediatamente che il massimo si ha per $x=\\dfrac{1}{2}$, cioè $e^{-t/\\tau}=\\dfrac{1}{2}$ e quindi</p>\n<p>$$t=\\tau\\ln 2, \\qquad P_C^{max}=\\frac{f_{gen}^2}{4R}$$</p>\n<p>Si noti che $P_C(0)=0$ perché $V_C(0)=0$ e $P_C(\\infty)=0$ perché $i(\\infty)=0$.</p>"
    },
    {
      "id": "s14-ex-scritto1",
      "type": "esercizio",
      "title": "Scritto 1",
      "kind": "scritto",
      "source": "integrazione",
      "icon": "✏️",
      "content": "<p>Un asciugacapelli funziona alla tensione $\\Delta V = 220\\ \\mathrm{V}$ e ha potenza nominale $P = 1100\\ \\mathrm{W}$. Assumendo che si comporti come un resistore ohmico, calcola la resistenza $R$, l'intensità di corrente $i$ e l'energia dissipata in $10$ minuti di funzionamento.</p>",
      "solution": "<p><strong>Resistenza.</strong> Dalla legge di Joule nella forma $P = \\dfrac{(\\Delta V)^2}{R}$:</p>\n<p>$$R = \\frac{(\\Delta V)^2}{P} = \\frac{(220\\ \\mathrm{V})^2}{1100\\ \\mathrm{W}} = \\frac{4{,}84\\times10^{4}}{1{,}1\\times10^{3}}\\ \\Omega = 44\\ \\Omega$$</p>\n<p><strong>Corrente.</strong> Dalla forma $P = i\\,\\Delta V$ (o equivalentemente dalla prima legge di Ohm):</p>\n<p>$$i = \\frac{P}{\\Delta V} = \\frac{1100\\ \\mathrm{W}}{220\\ \\mathrm{V}} = 5{,}0\\ \\mathrm{A}$$</p>\n<p>e infatti $\\Delta V/R = 220/44 = 5{,}0\\ \\mathrm{A}$.</p>\n<p><strong>Energia.</strong> Poiché la corrente è costante, la potenza è costante e l'energia dissipata in $\\Delta t = 10\\ \\mathrm{min} = 600\\ \\mathrm{s}$ è</p>\n<p>$$W = P\\,\\Delta t = (1100\\ \\mathrm{W})(600\\ \\mathrm{s}) = 6{,}6\\times10^{5}\\ \\mathrm{J} \\approx 0{,}18\\ \\mathrm{kWh}$$</p>\n<p>Si può verificare anche con $W = i^2R\\,\\Delta t = (5{,}0)^2(44)(600)\\ \\mathrm{J} = 6{,}6\\times10^{5}\\ \\mathrm{J}$.</p>"
    },
    {
      "id": "s14-ex-scritto2",
      "type": "esercizio",
      "title": "Scritto 2",
      "kind": "scritto",
      "source": "integrazione",
      "icon": "✏️",
      "content": "<p>Un condensatore di capacità $C=5\\ \\mu\\mathrm{F}$, inizialmente scarico, viene caricato da un generatore ideale di f.e.m. $f_{gen}=12\\ \\mathrm{V}$ attraverso una resistenza $R=2\\ \\mathrm{k}\\Omega$. Calcola: (a) la costante di tempo $\\tau$ e la corrente iniziale $i_0$; (b) la carica di regime $Q_\\infty$; (c) corrente, $V_C$ e $V_R$ all'istante $t=3\\ \\mathrm{ms}$; (d) l'istante in cui la tensione sul condensatore raggiunge il $90\\%$ del valore finale.</p>",
      "solution": "<p><strong>(a)</strong> Costante di tempo e corrente iniziale:</p>\n<p>$$\\tau=RC=(2\\cdot 10^{3}\\ \\Omega)(5\\cdot 10^{-6}\\ \\mathrm{F})=10^{-2}\\ \\mathrm{s}=10\\ \\mathrm{ms}$$</p>\n<p>$$i_0=\\frac{f_{gen}}{R}=\\frac{12}{2\\cdot 10^{3}}=6\\cdot 10^{-3}\\ \\mathrm{A}=6\\ \\mathrm{mA}$$</p>\n<p><strong>(b)</strong> Carica di regime:</p>\n<p>$$Q_\\infty=C f_{gen}=(5\\cdot 10^{-6})(12)=6\\cdot 10^{-5}\\ \\mathrm{C}=60\\ \\mu\\mathrm{C}$$</p>\n<p><strong>(c)</strong> Con $\\dfrac{t}{\\tau}=\\dfrac{3}{10}=0{,}3$ e $e^{-0{,}3}\\approx 0{,}741$:</p>\n<p>$$i(t)=i_0e^{-t/\\tau}\\approx (6\\ \\mathrm{mA})(0{,}741)\\approx 4{,}4\\ \\mathrm{mA}$$</p>\n<p>$$V_C(t)=f_{gen}\\left(1-e^{-t/\\tau}\\right)\\approx 12\\,(1-0{,}741)=12\\cdot 0{,}259\\approx 3{,}1\\ \\mathrm{V}$$</p>\n<p>$$V_R(t)=f_{gen}e^{-t/\\tau}=12e^{-0{,}3}\\ \\mathrm{V}\\approx 8{,}9\\ \\mathrm{V}$$</p>\n<p>Verifica: $V_C+V_R\\approx 3{,}1+8{,}9=12\\ \\mathrm{V}=f_{gen}$, come richiede la legge di Kirchhoff.</p>\n<p><strong>(d)</strong> Imponendo $V_C(t)=0{,}9\\,f_{gen}$ si ha $e^{-t/\\tau}=0{,}1$, cioè</p>\n<p>$$t=\\tau\\ln 10\\approx (10\\ \\mathrm{ms})(2{,}303)\\approx 23\\ \\mathrm{ms}$$</p>\n<p>Il risultato non dipende da $f_{gen}$.</p>"
    },
    {
      "id": "s14-ex-scritto3",
      "type": "esercizio",
      "title": "Scritto 3",
      "kind": "scritto",
      "source": "integrazione",
      "icon": "✏️",
      "content": "<p>Due resistori $R_1 = 100\\ \\Omega$ e $R_2 = 300\\ \\Omega$ sono collegati a un generatore ideale di f.e.m. $f = 12\\ \\mathrm{V}$. Calcola la resistenza equivalente, la corrente erogata dal generatore e la potenza dissipata da ciascun resistore nel caso di collegamento in serie e nel caso di collegamento in parallelo, indicando in ciascun caso quale resistore dissipa più potenza. Verifica il bilancio energetico con la potenza erogata dal generatore.</p>",
      "solution": "<p><strong>Caso serie.</strong> La corrente è la stessa nei due resistori e $f = iR_1 + iR_2 = iR_{eq}$ con $R_{eq} = R_1+R_2 = 400\\ \\Omega$, quindi</p>\n<p>$$i = \\frac{12\\ \\mathrm{V}}{400\\ \\Omega} = 3{,}0\\times10^{-2}\\ \\mathrm{A} = 30\\ \\mathrm{mA}$$</p>\n<p>Essendo $i$ comune conviene $P_k = i^2R_k$:</p>\n<p>$$P_1 = (3{,}0\\times10^{-2})^2(100)\\ \\mathrm{W} = 9{,}0\\times10^{-2}\\ \\mathrm{W}, \\qquad P_2 = (3{,}0\\times10^{-2})^2(300)\\ \\mathrm{W} = 0{,}27\\ \\mathrm{W}$$</p>\n<p>Dissipa più potenza il resistore <strong>maggiore</strong>, $R_2$. Bilancio: $P_1+P_2 = 0{,}36\\ \\mathrm{W} = f\\,i = (12)(3{,}0\\times10^{-2})\\ \\mathrm{W}$.</p>\n<p><strong>Caso parallelo.</strong> La tensione ai capi di entrambi è $f = 12\\ \\mathrm{V}$ e</p>\n<p>$$R_{eq} = \\frac{R_1R_2}{R_1+R_2} = \\frac{(100)(300)}{400}\\ \\Omega = 75\\ \\Omega \\quad\\Rightarrow\\quad i = \\frac{12\\ \\mathrm{V}}{75\\ \\Omega} = 0{,}16\\ \\mathrm{A}$$</p>\n<p>ripartita in $i_1 = f/R_1 = 0{,}12\\ \\mathrm{A}$ e $i_2 = f/R_2 = 4{,}0\\times10^{-2}\\ \\mathrm{A}$ (e infatti $i_1+i_2 = 0{,}16\\ \\mathrm{A}$). Essendo $f$ comune conviene $P_k = f^2/R_k$:</p>\n<p>$$P_1 = \\frac{144}{100}\\ \\mathrm{W} = 1{,}44\\ \\mathrm{W}, \\qquad P_2 = \\frac{144}{300}\\ \\mathrm{W} = 0{,}48\\ \\mathrm{W}$$</p>\n<p>Dissipa più potenza il resistore <strong>minore</strong>, $R_1$. Bilancio: $P_1+P_2 = 1{,}92\\ \\mathrm{W} = f\\,i = (12)(0{,}16)\\ \\mathrm{W}$.</p>"
    },
    {
      "id": "s14-ex-scritto4",
      "type": "esercizio",
      "title": "Scritto 4",
      "kind": "scritto",
      "source": "integrazione",
      "icon": "✏️",
      "content": "<p>Nel circuito RC serie con $f_{gen}=24\\ \\mathrm{V}$, $R=1\\ \\mathrm{k}\\Omega$ e $C=10\\ \\mu\\mathrm{F}$ (condensatore inizialmente scarico) calcola: (a) l'energia totale erogata dal generatore, quella dissipata in $R$ e quella finale immagazzinata in $C$ durante l'intero processo di carica; (b) l'istante in cui la potenza assorbita dal condensatore è massima e il suo valore; (c) di quanto cambiano i risultati del punto (a) se si raddoppia $R$.</p>",
      "solution": "<p><strong>(a)</strong> Costante di tempo:</p>\n<p>$$\\tau=RC=(10^{3})(10\\cdot 10^{-6})=10^{-2}\\ \\mathrm{s}=10\\ \\mathrm{ms}$$</p>\n<p>Energia erogata dal generatore:</p>\n<p>$$L_{gen}=\\int_0^{+\\infty}\\frac{f_{gen}^2}{R}e^{-t/\\tau}\\,dt=\\frac{f_{gen}^2}{R}\\,\\tau=C f_{gen}^2=(10\\cdot 10^{-6})(24)^2=5{,}76\\ \\mathrm{mJ}$$</p>\n<p>Energia dissipata nella resistenza:</p>\n<p>$$L_R=\\frac{f_{gen}^2}{R}\\cdot\\frac{\\tau}{2}=\\frac{1}{2}C f_{gen}^2=2{,}88\\ \\mathrm{mJ}$$</p>\n<p>Energia immagazzinata nel condensatore:</p>\n<p>$$U_C=L_{gen}-L_R=\\frac{1}{2}C f_{gen}^2=2{,}88\\ \\mathrm{mJ}$$</p>\n<p>coerente con $U_C=\\frac{1}{2}Cf_{gen}^2$.</p>\n<p><strong>(b)</strong> Si ha $P_C(t)=\\dfrac{f_{gen}^2}{R}\\left(e^{-t/\\tau}-e^{-2t/\\tau}\\right)$; posto $x=e^{-t/\\tau}$, dalla scomposizione</p>\n<p>$$x-x^2=\\frac{1}{4}-\\left(x-\\frac{1}{2}\\right)^2$$</p>\n<p>si vede che il massimo è per $x=\\frac{1}{2}$, cioè</p>\n<p>$$t=\\tau\\ln 2\\approx (10\\ \\mathrm{ms})(0{,}693)\\approx 6{,}9\\ \\mathrm{ms}, \\qquad P_C^{max}=\\frac{f_{gen}^2}{4R}=\\frac{576}{4\\cdot 10^{3}}=0{,}144\\ \\mathrm{W}$$</p>\n<p><strong>(c)</strong> Le energie $L_{gen}=Cf_{gen}^2$ e $L_R=U_C=\\frac{1}{2}Cf_{gen}^2$ non contengono $R$: raddoppiando $R$ restano $5{,}76\\ \\mathrm{mJ}$, $2{,}88\\ \\mathrm{mJ}$ e $2{,}88\\ \\mathrm{mJ}$, con rendimento sempre del $50\\%$. Cambia soltanto la scala dei tempi ($\\tau=20\\ \\mathrm{ms}$), la corrente iniziale ($i_0=12\\ \\mathrm{mA}$ invece di $24\\ \\mathrm{mA}$) e la potenza massima assorbita dal condensatore ($P_C^{max}=0{,}072\\ \\mathrm{W}$).</p>"
    },

      "back": "Con $q$ carica dell'armatura superiore ($q(0)=Q_0 \\gt 0$) e verso di riferimento antiorario, tale che $i = dq/dt$, Kirchhoff dà $V_R+V_C = 0$, cioè $R\\frac{dq}{dt}+\\frac{q}{C}=0$. Separando: $\\frac{dq}{q} = -\\frac{dt}{RC}$, da cui $\\ln\\frac{q(t)}{Q_0} = -\\frac{t}{RC}$ e $q(t) = Q_0e^{-t/\\tau}$. Derivando e usando $Q_0 = CV_0$: $i(t) = -\\frac{V_0}{R}e^{-t/\\tau}$. Il segno negativo significa solo che la corrente fisica scorre nel verso opposto a quello di riferimento (orario), non che vi sia un'anomalia."
    },
    {
      "type": "domanda",
      "front": "Nel circuito con condensatore in parallelo a una lampadina $R$ e alimentazione attraverso $R_{al}$, quali sono $V_\\infty$ e le due costanti di tempo?",
      "back": "A regime, partitore: $V_\\infty = f_{gen}\\frac{R}{R_{al}+R}$. Per la carica, la legge dei nodi dà $\\frac{f_{gen}-V_C}{R_{al}} = C\\frac{dV_C}{dt}+\\frac{V_C}{R}$, cioè $C\\frac{dV_C}{dt}+\\left(\\frac{1}{R_{al}}+\\frac{1}{R}\\right)V_C = \\frac{f_{gen}}{R_{al}}$: il coefficiente di decadimento corrisponde a $\\tau_{carica} = C\\,(R_{al}\\parallel R) = \\frac{CR_{al}R}{R_{al}+R}$. Aperto l'interruttore, resta la sola maglia $C$–$R$ e $\\tau_{scarica} = RC$. Poiché $R_{al}\\parallel R \\le R$, si ha sempre $\\tau_{carica} \\le \\tau_{scarica}$; con $R_{al} \\ll R$ si ha $V_\\infty \\approx f_{gen}$ e carica molto più rapida della scarica."
    },
    {
      "type": "tranello",
      "front": "Perché nell'esempio della lampadina serve un interruttore e non basta «spegnere» il generatore?",
      "back": "Un generatore <strong>spento</strong> non equivale a un circuito aperto: resta un bipolo collegato con la sua resistenza interna, attraverso cui il condensatore può scaricarsi. Se il generatore spento è modellato con $f_{gen}=0$ e la stessa $R_{al}$ collegata, la costante di tempo della scarica non è $RC$ ma $C\\frac{R_{al}R}{R_{al}+R}$, la stessa della carica: con $R_{al} \\ll R$ il condensatore si svuoterebbe quasi istantaneamente nel ramo di alimentazione, senza accendere la lampadina. Le leggi con $\\tau = RC$ valgono solo se il ramo del generatore è effettivamente <strong>interrotto</strong>."
    },
    {
      "type": "formula",
      "front": "Tempo per raggiungere una frazione assegnata: come si ricavano $t_{1/2}$ nella scarica e il $90\\%$ nella carica?",
      "back": "Scarica: da $V_C = V_0e^{-t/\\tau} = \\alpha V_0$ segue $t = \\tau\\ln(1/\\alpha)$; per $\\alpha = 1/2$ si ha $t_{1/2} = \\tau\\ln 2 \\approx 0{,}693\\,RC$. Carica: da $V_C = f_{gen}(1-e^{-t/\\tau}) = \\alpha f_{gen}$ segue $t = \\tau\\ln\\frac{1}{1-\\alpha}$; per $\\alpha = 0{,}9$ si ha $t = \\tau\\ln 10 \\approx 2{,}30\\,RC$. In entrambi i casi il risultato <strong>non dipende</strong> da $V_0$ né da $f_{gen}$: la scala dei tempi è fissata solo da $\\tau = RC$."
    }
  ]
};
