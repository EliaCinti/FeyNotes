      {
        id: "s09-es-teoria-1",
        type: "esercizio",
        title: "Teoria 1",
        kind: "teoria",
        source: "integrazione",
        content: `<p>Definisci il momento di dipolo elettrico $\\vec{p}$ di una coppia di cariche $+q$ e $-q$ poste a distanza $d$, precisandone modulo, direzione e verso, e scrivi il potenziale del dipolo in forma vettoriale specificando con quale convenzione sullo zero del potenziale e in quale regione dello spazio la formula è valida.</p>`,
        solution: `<p>Si definisce momento di dipolo elettrico il vettore $\\vec{p} = q\\vec{d}$, dove $q \\gt 0$ è il valore assoluto di ciascuna carica e $\\vec{d} = d\\,\\hat{u}_p$ è il vettore che va dalla carica $-q$ alla carica $+q$. Il modulo è $p = qd$, la direzione è quella della retta che congiunge le due cariche e il verso va dalla carica negativa verso quella positiva.</p>
        <p>Posto $V = 0$ all'infinito, il potenziale è esattamente</p>
        <p>$$V_P = \\frac{q}{4\\pi\\epsilon_0}\\left(\\frac{1}{d_1}-\\frac{1}{d_2}\\right) = \\frac{q}{4\\pi\\epsilon_0}\\frac{d_2-d_1}{d_1d_2}$$</p>
        <p>in ogni punto distinto dalle posizioni delle cariche. Se il punto di osservazione soddisfa $R \\gg d$, con $R = \\overline{OP}$ distanza dal punto medio $O$, valgono $d_1d_2 \\approx R^2$ e $d_2-d_1 \\approx d\\cos\\theta$, e si ottiene</p>
        <p>$$V_P \\approx \\frac{1}{4\\pi\\epsilon_0}\\frac{p\\cos\\theta}{R^2} = \\frac{1}{4\\pi\\epsilon_0}\\frac{\\vec{p}\\cdot\\hat{u}_R}{R^2}$$</p>
        <p>dove $\\hat{u}_R$ è il versore che va da $O$ a $P$ e $\\theta \\in [0,\\pi]$ è l'angolo tra $\\vec{p}$ e $\\overrightarrow{OP}$. La scrittura con il prodotto scalare è preferibile a quella con una lunghezza perché $\\vec{d}\\cdot\\hat{u}_R = d\\cos\\theta$ è una proiezione orientata e conserva il segno corretto anche per $\\theta \\gt \\pi/2$.</p>
        <p>La formula è soltanto approssimata: per due cariche a distanza finita le correzioni trascurate sono relativamente dell'ordine di $(d/R)^2$. Il potenziale è positivo per $0 \\le \\theta \\lt \\pi/2$ (lato di $+q$), nullo per $\\theta = \\pi/2$ (piano equatoriale, dove il risultato è perfino esatto perché $d_1 = d_2$) e negativo per $\\pi/2 \\lt \\theta \\le \\pi$; a grande distanza decresce come $1/R^2$, più rapidamente del potenziale $1/R$ di una carica isolata.</p>`
      },

      {
        id: "s09-es-teoria-2",
        type: "esercizio",
        title: "Teoria 2",
        kind: "teoria",
        source: "integrazione",
        content: `<p>Dimostra che, nei punti in cui $\\vec{E}\\neq\\vec{0}$, il campo elettrostatico è ortogonale alla superficie equipotenziale che passa per quel punto. Spiega poi perché è sbagliato dire che «su una superficie equipotenziale la carica non sente alcuna forza».</p>`,
        solution: `<p>Sia $S$ la superficie equipotenziale $V=V_0$ e sia $P\\in S$ un punto in cui $\\vec{E}(P)\\neq\\vec{0}$. Per uno spostamento infinitesimo $d\\vec{l}$ vale la relazione fondamentale $dV=-\\vec{E}\\cdot d\\vec{l}$. Se $d\\vec{l}$ è tangente a $S$ in $P$, il punto resta su $S$ e quindi $dV=0$, da cui $\\vec{E}(P)\\cdot d\\vec{l}=0$. Poiché questo accade per ogni $d\\vec{l}$ tangente, $\\vec{E}(P)$ è ortogonale a tutto il piano tangente a $S$ in $P$, cioè è perpendicolare alla superficie equipotenziale (ed è diretto verso i potenziali decrescenti, essendo $\\vec{E}=-\\nabla V$). La condizione $\\vec{E}(P)\\neq\\vec{0}$ serve solo perché la direzione di un vettore nullo non è definita.</p>
        <p>La frase citata è sbagliata perché la forza sulla carica è $\\vec{F}=q\\vec{E}$ e non è affatto nulla: quello che si annulla è il <strong>lavoro</strong> per spostamenti lungo la superficie, $dW=q\\vec{E}\\cdot d\\vec{l}=0$, dato che $\\vec{E}\\perp d\\vec{l}$. È la stessa situazione di un corpo sdraiato su un pavimento orizzontale: il peso $m\\vec{g}$ continua ad agire (bilanciato dalla reazione normale), ma per spostamenti orizzontali $m\\vec{g}\\cdot d\\vec{s}=0$ e la quota, cioè l'energia potenziale, non cambia.</p>`
      },

      {
        id: "s09-es-teoria-3",
        type: "esercizio",
        title: "Teoria 3",
        kind: "teoria",
        source: "integrazione",
        content: `<p>Definisci la circuitazione di un campo vettoriale $\\vec{E}$ lungo una linea chiusa orientata $\\gamma$ e dimostra, partendo dalla conservatività del campo elettrostatico, che essa è nulla. Che cosa accade alla circuitazione se si inverte il verso di percorrenza di $\\gamma$?</p>`,
        solution: `<p>Si chiama circuitazione di $\\vec{E}$ lungo la linea chiusa orientata $\\gamma$ l'integrale di linea $\\oint_\\gamma \\vec{E}\\cdot d\\vec{s}$, dove $d\\vec{s}$ è l'elemento di linea, vettore infinitesimo tangente a $\\gamma$ il cui verso è fissato dal verso di percorrenza scelto. Il prodotto scalare $\\vec{E}\\cdot d\\vec{s}$ seleziona in ogni punto la sola componente del campo tangente alla curva.</p>
        <p>Il campo elettrostatico è conservativo: esiste un potenziale $V$ tale che $\\vec{E}=-\\nabla V$ e per ogni cammino da $A$ a $B$ vale $\\int_A^B \\vec{E}\\cdot d\\vec{s} = V(A)-V(B)$, indipendentemente dal percorso. Su una linea chiusa il punto iniziale e quello finale coincidono, $A\\equiv B$, dunque $V(A)=V(B)$ e</p>
        <p>$$\\oint_\\gamma \\vec{E}\\cdot d\\vec{s} = V(A)-V(A) = 0$$</p>
        <p>Equivalentemente: fissati due punti $A,B$ su $\\gamma$, la curva si spezza nei due archi $\\gamma_1$ (da $A$ a $B$) e $\\gamma_2$ (da $B$ ad $A$); per l'indipendenza dal percorso $\\int_{\\gamma_1}\\vec{E}\\cdot d\\vec{s} = -\\int_{\\gamma_2}\\vec{E}\\cdot d\\vec{s}$ e la somma è nulla. Per una carica puntiforme si vede direttamente che $\\int_A^B \\vec{E}\\cdot d\\vec{s} = \\frac{q}{4\\pi\\epsilon_0}\\left(\\frac{1}{r_A}-\\frac{1}{r_B}\\right)$, che si annulla quando $r_A=r_B$, in particolare se $A\\equiv B$.</p>
        <p>Invertendo il verso di percorrenza ogni $d\\vec{s}$ cambia segno, quindi la circuitazione cambia segno: essendo nulla, resta nulla. Si noti che il risultato richiede che il campo sia definito e regolare lungo tutta la curva.</p>`
      },

      {
        id: "s09-es-teoria-4",
        type: "esercizio",
        title: "Teoria 4",
        kind: "teoria",
        source: "integrazione",
        content: `<p>Enuncia e dimostra la proprietà di ortogonalità tra campo elettrico e superfici equipotenziali, precisando l'ipotesi necessaria perché l'enunciato abbia senso. Spiega inoltre il ruolo del segno nella relazione $\\vec{E} = -\\nabla V$.</p>`,
        solution: `<p><strong>Enunciato.</strong> In ogni punto in cui $\\vec{E} \\neq \\vec{0}$ e in cui l'equipotenziale è una superficie regolare, il campo elettrico è perpendicolare alla superficie equipotenziale passante per quel punto.</p>
        <p><strong>Dimostrazione.</strong> Una superficie equipotenziale è il luogo dei punti in cui $V$ assume un valore costante, quindi per uno spostamento infinitesimo $d\\vec{l}$ che giace sulla superficie si ha $dV = 0$. Poiché $dV = -\\vec{E}\\cdot d\\vec{l}$, segue $\\vec{E}\\cdot d\\vec{l} = 0$ per ogni $d\\vec{l}$ tangente alla superficie. Se $\\vec{E} \\neq \\vec{0}$, l'annullarsi del prodotto scalare con tutti i vettori tangenti significa che $\\vec{E}$ è ortogonale al piano tangente, cioè normale alla superficie. L'ipotesi $\\vec{E}\\neq\\vec{0}$ è indispensabile: dove il campo si annulla il prodotto scalare è nullo per qualunque $d\\vec{l}$, ma non si può parlare di direzione del campo.</p>
        <p><strong>Il segno.</strong> $\\nabla V$ è per definizione il vettore che punta nella direzione di massima crescita di $V$ e ha modulo pari alla massima derivata direzionale; il campo è il suo opposto, $\\vec{E} = -\\nabla V$, dunque punta verso i potenziali decrescenti. Dire che il gradiente di $V$ è il campo elettrico è scorretto: il gradiente di $V$ è $-\\vec{E}$.</p>
        <p><strong>Esempio di controllo.</strong> Per una carica puntiforme $Q \\gt 0$ si ha $V(r) = \\frac{1}{4\\pi\\epsilon_0}\\frac{Q}{r}$, le equipotenziali sono sfere $r = \\text{cost}$, e $\\vec{E} = \\frac{1}{4\\pi\\epsilon_0}\\frac{Q}{r^2}\\hat{u}_r$ è radiale, cioè normale alle sfere e diretto verso l'esterno, dove $V$ diminuisce.</p>`
      },

      {
        id: "s09-es-scritto-1",
        type: "esercizio",
        title: "Scritto 1",
        kind: "scritto",
        source: "integrazione",
        content: `<p>Un dipolo è formato dalle cariche $+q$ e $-q$ con $q = 2{,}0\\times 10^{-9}\\ \\text{C}$, poste a distanza $d = 1{,}0\\ \\text{mm}$. Assumendo $V=0$ all'infinito, calcolare il momento di dipolo e il potenziale nel punto $P$ a distanza $R = 5{,}0\\ \\text{cm}$ dal centro del dipolo, nella direzione che forma un angolo $\\theta = 60^\\circ$ con $\\vec{p}$. Quanto vale il potenziale nel punto $P'$ alla stessa distanza con $\\theta' = 120^\\circ$? Verificare la liceità dell'approssimazione usata.</p>`,
        solution: `<p><strong>Controllo preliminare.</strong> $R = 5{,}0\\times 10^{-2}\\ \\text{m}$ e $d = 1{,}0\\times 10^{-3}\\ \\text{m}$, dunque $R/d = 50 \\gg 1$ e l'approssimazione di dipolo è lecita, con correzioni relative dell'ordine di $(d/R)^2 = 4\\times 10^{-4}$.</p>
        <p><strong>Momento di dipolo.</strong> $p = qd = (2{,}0\\times 10^{-9})(1{,}0\\times 10^{-3}) = 2{,}0\\times 10^{-12}\\ \\text{C}\\cdot\\text{m}$, diretto da $-q$ verso $+q$.</p>
        <p><strong>Potenziale.</strong> $V \\approx \\frac{1}{4\\pi\\epsilon_0}\\frac{p\\cos\\theta}{R^2}$ con $\\frac{1}{4\\pi\\epsilon_0} \\approx 9{,}0\\times 10^{9}\\ \\text{N}\\,\\text{m}^2/\\text{C}^2$ e $R^2 = 2{,}5\\times 10^{-3}\\ \\text{m}^2$. Il fattore comune è</p>
        <p>$$\\frac{1}{4\\pi\\epsilon_0}\\frac{p}{R^2} = 9{,}0\\times 10^{9}\\cdot\\frac{2{,}0\\times 10^{-12}}{2{,}5\\times 10^{-3}} = 7{,}2\\ \\text{V}$$</p>
        <p>Con $\\cos 60^\\circ = 0{,}50$ si ottiene $V_P \\approx (7{,}2)(0{,}50) = 3{,}6\\ \\text{V}$, positivo perché $P$ sta dal lato della carica positiva.</p>
        <p>Nel punto $P'$ si ha $\\cos 120^\\circ = -0{,}50$, quindi $V_{P'} \\approx -3{,}6\\ \\text{V}$: lo stesso valore con segno opposto, come deve essere perché $P'$ sta dal lato della carica negativa e il fattore $\\cos\\theta$, cioè la proiezione orientata $\\vec{p}\\cdot\\hat{u}_R$, fornisce automaticamente il segno. I due punti stanno su equipotenziali diverse, e il piano equatoriale ($\\theta = 90^\\circ$) che li separa è a potenziale nullo.</p>`
      },

      {
        id: "s09-es-scritto-2",
        type: "esercizio",
        title: "Scritto 2",
        kind: "scritto",
        source: "integrazione",
        content: `<p>Un condensatore piano ha piastre parallele a distanza $d=5{,}0\\ \\text{mm}$ e differenza di potenziale $V_+-V_-=200\\ \\text{V}$; nella regione interna il campo è uniforme. Si considerino $e=1{,}602\\times10^{-19}\\ \\text{C}$ e $m_e=9{,}11\\times10^{-31}\\ \\text{kg}$ e si trascuri la gravità. Calcola: (a) il modulo del campo $E$; (b) il modulo della forza su un elettrone; (c) il lavoro della forza elettrica, in joule e in eV, su un elettrone che parte da fermo dalla piastra negativa e raggiunge quella positiva; (d) la sua velocità di arrivo.</p>`,
        solution: `<p><strong>(a)</strong> Con campo uniforme e potenziale che varia linearmente, $V(x)=V_+-Ex$ fra le piastre, quindi $E=\\dfrac{V_+-V_-}{d}=\\dfrac{200\\ \\text{V}}{5{,}0\\times10^{-3}\\ \\text{m}}=4{,}0\\times10^{4}\\ \\text{V/m}$, diretto dalla piastra positiva a quella negativa.</p>
        <p><strong>(b)</strong> $F=|q|E=eE=(1{,}602\\times10^{-19})(4{,}0\\times10^{4})\\approx6{,}4\\times10^{-15}\\ \\text{N}$, diretta perpendicolarmente alle piastre e verso la piastra positiva (la forza su una carica negativa è opposta a $\\vec{E}$).</p>
        <p><strong>(c)</strong> Prendendo $A$ sulla piastra negativa e $B$ su quella positiva, $V_A-V_B=V_--V_+=-200\\ \\text{V}$ e $q=-e$, dunque</p>
        <p>$$W^{\\text{el}}_{A\\to B}=q(V_A-V_B)=(-e)(-200\\ \\text{V})=(1{,}602\\times10^{-19})(200)\\approx3{,}20\\times10^{-17}\\ \\text{J}$$</p>
        <p>In elettronvolt, $W^{\\text{el}}=200\\ \\text{eV}$: il lavoro è positivo, l'elettrone viene accelerato verso la piastra positiva.</p>
        <p><strong>(d)</strong> Nel vuoto agisce solo la forza elettrica, quindi siamo nelle ipotesi del bilancio energetico: $\\Delta K=\\tfrac{1}{2}m_ev_B^2-0=W^{\\text{el}}$, da cui</p>
        <p>$$v_B=\\sqrt{\\frac{2W^{\\text{el}}}{m_e}}=\\sqrt{\\frac{2\\cdot3{,}20\\times10^{-17}}{9{,}11\\times10^{-31}}}=\\sqrt{7{,}03\\times10^{13}}\\approx8{,}4\\times10^{6}\\ \\text{m/s}$$</p>
        <p>cioè circa il $2{,}8\\%$ della velocità della luce (trattazione non relativistica accettabile).</p>`
      },

      {
        id: "s09-es-scritto-3",
        type: "esercizio",
        title: "Scritto 3",
        kind: "scritto",
        source: "integrazione",
        content: `<p>In una regione dello spazio il potenziale elettrostatico è $V(x,y,z)=x^2y+yz$ (unità SI). (a) Determina $\\vec{E}=-\\nabla V$. (b) Verifica per calcolo diretto che $\\nabla\\times\\vec{E}=\\vec{0}$. (c) Calcola il lavoro per unità di carica compiuto dal campo per portare una carica da $A=(1,1,0)$ a $B=(0,2,1)$, dicendo se il risultato dipende dal percorso.</p>`,
        solution: `<p><strong>(a)</strong> Le derivate parziali sono $\\frac{\\partial V}{\\partial x}=2xy$, $\\frac{\\partial V}{\\partial y}=x^2+z$, $\\frac{\\partial V}{\\partial z}=y$, quindi</p>
        <p>$$\\vec{E}=-\\nabla V = -2xy\\,\\hat{\\imath}-(x^2+z)\\,\\hat{\\jmath}-y\\,\\hat{k}$$</p>
        <p>cioè $E_x=-2xy$, $E_y=-(x^2+z)$, $E_z=-y$.</p>
        <p><strong>(b)</strong> Componente $x$: $(\\nabla\\times\\vec{E})_x=\\frac{\\partial E_z}{\\partial y}-\\frac{\\partial E_y}{\\partial z}=-1-(-1)=0$. Componente $y$: $(\\nabla\\times\\vec{E})_y=\\frac{\\partial E_x}{\\partial z}-\\frac{\\partial E_z}{\\partial x}=0-0=0$. Componente $z$: $(\\nabla\\times\\vec{E})_z=\\frac{\\partial E_y}{\\partial x}-\\frac{\\partial E_x}{\\partial y}=-2x-(-2x)=0$. Dunque $\\nabla\\times\\vec{E}=\\vec{0}$ in ogni punto, come previsto dalla proposizione: $V$ è un polinomio, quindi di classe $C^2$ in tutto lo spazio, e il teorema di Schwarz garantisce la cancellazione delle derivate miste.</p>
        <p><strong>(c)</strong> Poiché il campo è conservativo, $\\frac{W_{A\\to B}}{q}=V(A)-V(B)$. Si ha $V(A)=1^2\\cdot 1+1\\cdot 0=1$ e $V(B)=0^2\\cdot 2+2\\cdot 1=2$, quindi $\\frac{W_{A\\to B}}{q}=1-2=-1$ J/C $=-1$ V. Il lavoro del campo è negativo: se la carica si muovesse liberamente da $A$ a $B$ partendo con energia cinetica sufficiente, perderebbe energia cinetica pari a $1$ J per unità di carica. Il risultato non dipende dal percorso, proprio perché $\\oint\\vec{E}\\cdot d\\vec{s}=0$ su ogni linea chiusa.</p>`
      },

      {
        id: "s09-es-scritto-4",
        type: "esercizio",
        title: "Scritto 4",
        kind: "scritto",
        source: "integrazione",
        content: `<p>Un dipolo rigido di momento $p = 3{,}0\\times 10^{-29}\\ \\text{C}\\cdot\\text{m}$ è immerso in un campo elettrico uniforme di modulo $E = 2{,}0\\times 10^{5}\\ \\text{V/m}$; il vettore $\\vec{p}$ forma con $\\vec{E}$ un angolo $\\theta = 60^\\circ$. Determinare la forza risultante sul dipolo, il momento torcente (modulo, direzione e verso) e il valore massimo del momento al variare di $\\theta$. Stabilire infine se, lasciato da fermo in quella posizione in assenza di dissipazione, il dipolo si arresta nella posizione allineata.</p>`,
        solution: `<p><strong>Forza risultante.</strong> Le due cariche subiscono $\\vec{F}_+ = q\\vec{E}$ e $\\vec{F}_- = -q\\vec{E}$ e, poiché il campo è uniforme, il valore di $\\vec{E}$ è lo stesso nei due punti di applicazione, quindi $\\vec{F}_{tot} = q\\vec{E} - q\\vec{E} = \\vec{0}$.</p>
        <p><strong>Momento torcente.</strong> $\\vec{M} = \\vec{p}\\times\\vec{E}$, di modulo</p>
        <p>$$M = pE\\sin\\theta = (3{,}0\\times 10^{-29})(2{,}0\\times 10^{5})\\sin 60^\\circ = (6{,}0\\times 10^{-24})(0{,}866) \\approx 5{,}2\\times 10^{-24}\\ \\text{N}\\cdot\\text{m}$$</p>
        <p>La direzione di $\\vec{M}$ è perpendicolare al piano individuato da $\\vec{p}$ ed $\\vec{E}$; il verso si ottiene con la regola della mano destra applicata a $\\vec{p}\\times\\vec{E}$ ed è tale che la rotazione indotta faccia diminuire $\\theta$, portando $\\vec{p}$ verso $\\vec{E}$ lungo l'angolo minore. Poiché la forza risultante è nulla, il momento ha lo stesso valore rispetto a qualunque polo.</p>
        <p><strong>Valore massimo.</strong> $M$ è massimo per $\\theta = 90^\\circ$, con $M_{max} = pE = 6{,}0\\times 10^{-24}\\ \\text{N}\\cdot\\text{m}$; si annulla per $\\theta = 0$ (equilibrio stabile) e per $\\theta = 180^\\circ$ (equilibrio instabile).</p>
        <p><strong>Il dipolo non si arresta</strong> nella posizione allineata: la coppia lo accelera verso $\\theta = 0$, dove il momento è nullo ma la velocità angolare è massima, cosicché esso oltrepassa l'allineamento e, in assenza di dissipazione, oscilla periodicamente tra $+60^\\circ$ e $-60^\\circ$. Solo in presenza di dissipazione (attriti, urti, interazione con l'ambiente) l'energia in eccesso viene sottratta ed esso si assesta nella configurazione $\\vec{p}\\parallel\\vec{E}$.</p>`
      }
    ],
