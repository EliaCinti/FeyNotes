        <p>Nello schema, $d_1$ e $d_2$ sono le distanze di $P$ rispettivamente da $+q$ e da $-q$; $R = \\overline{OP}$ è la distanza dal punto medio $O$ e $\\theta$ è l'angolo tra l'asse orientato del dipolo (da $-q$ verso $+q$) e il vettore $\\overrightarrow{OP}$.</p>`,
        subsections: [
          {
            subtitle: "Convenzione sullo zero del potenziale",
            content: `<p>Prima di scrivere i potenziali fissiamo la convenzione: <strong>poniamo $V = 0$ all'infinito</strong>. Tutti i valori e tutti i segni del potenziale riportati di seguito si riferiscono a questa scelta.</p>`
          },
          {
            subtitle: "Sovrapposizione dei due contributi",
            content: `<p>Il potenziale generato dalla carica $+q$ nel punto $P$ è</p>
            <p>$$V_{+q} = \\frac{1}{4\\pi\\epsilon_0} \\frac{q}{d_1}$$</p>
            <p>mentre quello generato dalla carica $-q$ è</p>
            <p>$$V_{-q} = \\frac{1}{4\\pi\\epsilon_0} \\frac{-q}{d_2}$$</p>
            <p>Per il principio di sovrapposizione, il potenziale totale è la <strong>somma algebrica</strong> dei due:</p>
            <p>$$V_P = \\frac{1}{4\\pi\\epsilon_0} \\frac{q}{d_1} + \\frac{1}{4\\pi\\epsilon_0} \\frac{-q}{d_2}$$</p>
            <p>Raccogliendo i termini comuni:</p>
            <p>$$V_P = \\frac{q}{4\\pi\\epsilon_0} \\left( \\frac{1}{d_1} - \\frac{1}{d_2} \\right) = \\frac{q}{4\\pi\\epsilon_0} \\frac{d_2 - d_1}{d_1 d_2}$$</p>
            <p>Questa espressione è <strong>esatta</strong>: vale in ogni punto $P$ dello spazio distinto dalle posizioni delle due cariche (cioè per $d_1 \\neq 0$ e $d_2 \\neq 0$), senza alcuna ipotesi sulla distanza.</p>`
          }
        ],
        formulas: [
          { label: "Potenziale esatto del dipolo", latex: "V_P = \\frac{q}{4\\pi\\epsilon_0}\\,\\frac{d_2 - d_1}{d_1 d_2}" }
        ]
      },

      {
        id: "s09-approssimazione-dipolo",
        type: "section",
        title: "L'Approssimazione di Dipolo ($R \\gg d$)",
        icon: "📐",
        content: `<p>Spesso siamo interessati al potenziale in un punto $P$ <strong>molto lontano</strong> dal dipolo. In questo caso si introduce l'<strong>approssimazione di dipolo</strong>. Prima di procedere occorre fissare con cura l'angolo che comparirà nel risultato.</p>`,
        subsections: [
          {
            subtitle: "Definizione — Angolo polare del dipolo",
            content: `<p>Chiamiamo <strong>asse del dipolo orientato</strong> la retta per le due cariche, percorsa nel verso che va dalla carica negativa $-q$ alla carica positiva $+q$, e indichiamo con $\\hat{u}_p$ il versore corrispondente. Definiamo $\\theta$ come l'angolo compreso tra $\\hat{u}_p$ e il vettore $\\overrightarrow{OP}$, con</p>
            <p>$$0 \\leq \\theta \\leq \\pi$$</p>
            <p>Con questa scelta dell'origine, le due cariche occupano le posizioni $\\pm \\frac{d}{2}\\hat{u}_p$.</p>

            <p>Nella costruzione geometrica il punto $P$ non sta sul piano equatoriale. $H$ è il piede della perpendicolare condotta da $+q$ alla retta che unisce $-q$ a $P$. Si distinguano i due angoli: $\\theta$ è misurato <em>in</em> $O$ tra l'asse orientato e $\\overrightarrow{OP}$, mentre $\\theta'$ è misurato <em>in</em> $-q$ tra l'asse orientato e la direzione da $-q$ verso $P$. Solo nel limite $R \\gg d$ le rette $(-q)P$ e $OP$ diventano parallele e $\\theta' \\to \\theta$.</p>`
          },
          {
            subtitle: "La via algebrica: una relazione esatta per $d_2 - d_1$",
            content: `<p>Conviene ricavare la differenza $d_2 - d_1$ per via algebrica, perché in questo modo si ottiene un'espressione <strong>esatta</strong>, valida per ogni valore di $\\theta$ e <strong>con il segno corretto</strong>. Applicando il teorema di Carnot ai triangoli di vertici $O$, $+q$, $P$ e $O$, $-q$, $P$ (l'angolo in $O$ vale $\\theta$ nel primo caso e $\\pi - \\theta$ nel secondo):</p>
            <p>$$d_1^2 = R^2 + \\frac{d^2}{4} - R\\,d\\cos\\theta , \\qquad d_2^2 = R^2 + \\frac{d^2}{4} + R\\,d\\cos\\theta$$</p>
            <p>Sottraendo membro a membro, i termini in $R^2$ e $d^2/4$ si cancellano:</p>
            <p>$$d_2^2 - d_1^2 = 2 R\\, d \\cos\\theta$$</p>
            <p>da cui, poiché $d_1 + d_2 \\gt 0$,</p>
            <p>$$d_2 - d_1 = \\frac{2 R\\, d \\cos\\theta}{d_1 + d_2}$$</p>
            <p>Anche questa uguaglianza è esatta e porta con sé automaticamente il segno giusto: per $\\theta \\gt \\pi/2$ il secondo membro è negativo, coerentemente col fatto che in quel caso $P$ è più vicino a $-q$ e dunque $d_2 \\lt d_1$.</p>`
          },
          {
            subtitle: "Le due approssimazioni per $R \\gg d$",
            content: `<p>Quando $R \\gg d$ le due linee che congiungono le cariche al punto $P$ sono quasi parallele, ed entrambe le distanze $d_1$, $d_2$ differiscono da $R$ per una quantità dell'ordine di $d$. Possiamo quindi fare due approssimazioni:</p>
            <ol>
              <li>per il prodotto al denominatore, dato che $d_1$ e $d_2$ sono entrambe molto vicine a $R$: $$d_1 d_2 \\approx R^2$$</li>
              <li>per la differenza al numeratore, sostituendo $d_1 + d_2 \\approx 2R$ nella relazione esatta: $$d_2 - d_1 = \\frac{2 R\\, d \\cos\\theta}{d_1 + d_2} \\approx \\frac{2 R\\, d \\cos\\theta}{2R} = d \\cos\\theta$$</li>
            </ol>`
          },
          {
            subtitle: "Osservazione — Lettura geometrica della differenza $d_2 - d_1$",
            content: `<p>Lo stesso risultato si può «leggere» sulla figura, a patto di non confondere due angoli diversi. Conducendo da $+q$ la perpendicolare alla retta che unisce $-q$ a $P$, e detto $H$ il suo piede, nel triangolo rettangolo di vertici $-q$, $H$, $+q$ l'angolo nel vertice $-q$ <strong>non</strong> è $\\theta$ (misurato in $O$) ma l'angolo $\\theta'$. Si ha dunque $\\overline{(-q)H} = d\\cos\\theta'$, e non $d\\cos\\theta$.</p>
            <p>Inoltre, poiché $P$ è molto lontano, nel triangolo rettangolo di vertici $+q$, $H$, $P$ si ha $\\overline{HP} = \\sqrt{d_1^2 - d^2\\sin^2\\theta'} \\approx d_1$, mentre $d_2 = \\overline{(-q)H} + \\overline{HP}$; da cui</p>
            <p>$$d_2 - d_1 \\approx d_2 - \\overline{HP} = \\overline{(-q)H} = d \\cos\\theta' \\approx d\\cos\\theta$$</p>
            <p>La costruzione è quindi una lettura <em>approssimata</em> del risultato esatto, e va maneggiata con due cautele: le uguaglianze intermedie valgono solo a meno di termini di ordine $d/R$, e una lunghezza (quantità non negativa) non può rappresentare $d\\cos\\theta$ quando $\\theta \\gt \\pi/2$. In quel caso il piede $H$ cade dalla parte opposta rispetto a $P$ e la quantità corretta è la <strong>proiezione orientata</strong> $\\vec{d}\\cdot\\hat{u}_R$, che risulta negativa. <strong>La via algebrica evita in blocco questo problema.</strong></p>`
          },
          {
            subtitle: "Proposizione — Potenziale di dipolo a grande distanza",
            content: `<p>Se il punto di osservazione $P$ soddisfa la condizione $R \\gg d$, il potenziale elettrostatico del dipolo vale</p>
            <p>$$V_P \\approx \\frac{q}{4\\pi\\epsilon_0} \\frac{d \\cos\\theta}{R^2}$$</p>
            <p>con $\\theta$ angolo tra il versore $\\hat{u}_p$ orientato da $-q$ verso $+q$ e il vettore $\\overrightarrow{OP}$. Le correzioni trascurate sono relativamente dell'ordine di $(d/R)^2$.</p>`
          },
          {
            subtitle: "Osservazione — Il segno del potenziale e il decadimento $1/R^2$",
            content: `<p>Il fattore $\\cos\\theta$ porta con sé il segno del potenziale (riferito, come sempre, allo zero all'infinito), e per questo l'orientamento dell'asse non può essere lasciato indeterminato:</p>
            <ul>
              <li>per $0 \\leq \\theta \\lt \\pi/2$ (lato della carica positiva): $\\cos\\theta \\gt 0$ e quindi $V_P \\gt 0$;</li>
              <li>per $\\theta = \\pi/2$ (piano equatoriale): $\\cos\\theta = 0$ e quindi $V_P = 0$; in questo caso il risultato è <strong>perfino esatto</strong>, perché $d_1 = d_2$;</li>
              <li>per $\\pi/2 \\lt \\theta \\leq \\pi$ (lato della carica negativa): $\\cos\\theta \\lt 0$ e quindi $V_P \\lt 0$.</li>
            </ul>
            <p>Il potenziale cambia dunque segno attraversando il piano equatoriale. Si noti inoltre che il potenziale di dipolo decresce come $1/R^2$, <strong>più rapidamente</strong> del potenziale $1/R$ di una carica isolata: a grande distanza le due cariche opposte si «schermano» a vicenda.</p>`
          }
        ],
        formulas: [
          { label: "Differenza esatta delle distanze", latex: "d_2 - d_1 = \\frac{2 R\\, d \\cos\\theta}{d_1 + d_2}" },
          { label: "Potenziale di dipolo (R ≫ d)", latex: "V_P \\approx \\frac{q}{4\\pi\\epsilon_0}\\,\\frac{d\\cos\\theta}{R^2}" }
        ]
      },

      {
        id: "s09-momento-dipolo",
        type: "section",
        title: "Il Momento di Dipolo Elettrico",
        icon: "🧭",
        content: `<p>L'espressione $q\\,d \\cos\\theta$ può essere interpretata come un <strong>prodotto scalare</strong>. Per farlo introduciamo una nuova grandezza vettoriale.</p>`,
        subsections: [
          {
            subtitle: "Definizione — Momento di dipolo elettrico",
            content: `<p>Si definisce <strong>momento di dipolo elettrico</strong> $\\vec{p}$ il vettore</p>
            <p>$$\\vec{p} = q \\vec{d}$$</p>
            <p>dove $\\vec{d} = d\\,\\hat{u}_p$ è il vettore spostamento che va dalla carica negativa $-q$ alla carica positiva $+q$. Il modulo è $p = qd$.</p>`
          },
          {
            subtitle: "Attenzione al verso",
            content: `<p>La direzione del vettore momento di dipolo $\\vec{p}$ va <strong>convenzionalmente dalla carica negativa a quella positiva</strong>. Questo è importante da ricordare: è esattamente l'orientamento dell'asse rispetto al quale abbiamo misurato l'angolo $\\theta$, quindi <strong>$\\theta$ è l'angolo tra $\\vec{p}$ e $\\overrightarrow{OP}$</strong>.</p>`
          },
          {
            subtitle: "Forma vettoriale del potenziale",
            content: `<p>Se introduciamo un versore $\\hat{u}_R$ che punta dal centro $O$ del dipolo al punto $P$, il termine $d \\cos\\theta$ è esattamente la proiezione orientata di $\\vec{d}$ su $\\hat{u}_R$:</p>
            <p>$$d \\cos\\theta = \\vec{d} \\cdot \\hat{u}_R$$</p>
            <p>scrittura che, a differenza di una lunghezza, resta valida <strong>con il segno corretto</strong> anche per $\\theta \\gt \\pi/2$. Il potenziale del dipolo diventa allora:</p>
            <p>$$V_P \\approx \\frac{1}{4\\pi\\epsilon_0} \\frac{q (\\vec{d} \\cdot \\hat{u}_R)}{R^2} = \\frac{1}{4\\pi\\epsilon_0} \\frac{\\vec{p} \\cdot \\hat{u}_R}{R^2}, \\qquad \\text{valida per } R \\gg d$$</p>
            <p>Il simbolo di approssimazione va mantenuto: per due cariche poste a distanza finita $d$ questa espressione non è esatta in un punto generico. L'uguaglianza tra le due forme a destra, invece, è esatta, trattandosi solo di una riscrittura di $\\vec{p} = q\\vec{d}$.</p>
            <p>La formula mostra che il potenziale di un dipolo dipende non solo dalla distanza $R$, ma anche dall'<strong>orientazione relativa</strong> tra il dipolo e la direzione del punto di osservazione.</p>`
          }
        ],
        formulas: [
          { label: "Momento di dipolo", latex: "\\vec{p} = q\\vec{d}, \\qquad p = qd" },
          { label: "Potenziale in forma vettoriale", latex: "V_P \\approx \\frac{1}{4\\pi\\epsilon_0}\\,\\frac{\\vec{p}\\cdot\\hat{u}_R}{R^2}" }
        ]
      },

      {
        id: "s09-dipolo-campo-esterno",
        type: "section",
        title: "Dipolo in un Campo Elettrico Esterno Uniforme",
        icon: "🔄",
        content: `<p>Cosa succede se un dipolo viene immerso in un campo elettrico esterno $\\vec{E}$, ad esempio un campo uniforme?</p>
        <ul>
          <li>La carica $+q$ subisce una forza $\\vec{F}_+ = q\\vec{E}$.</li>
          <li>La carica $-q$ subisce una forza $\\vec{F}_- = -q\\vec{E}$.</li>
        </ul>
        <p>La forza totale è la somma vettoriale delle due:</p>
        <p>$$\\vec{F}_{tot} = \\vec{F}_+ + \\vec{F}_- = q\\vec{E} - q\\vec{E} = 0$$</p>
        <p>In un campo elettrico uniforme la <strong>forza netta su un dipolo è nulla</strong>. Tuttavia le due forze, essendo applicate in punti diversi, generano un <strong>momento meccanico</strong> (o coppia) che tende a far ruotare il dipolo.</p>

        subsections: [
          {
            subtitle: "Proposizione — Dipolo in campo uniforme",
            content: `<p>Un dipolo di momento $\\vec{p}$ immerso in un campo elettrico esterno <strong>uniforme</strong> $\\vec{E}$ subisce</p>
            <p>$$\\vec{F}_{tot} = \\vec{0}, \\qquad \\vec{M} = \\vec{p} \\times \\vec{E}$$</p>
            <p>con modulo $M = pE\\sin\\theta$, dove $\\theta$ è l'angolo tra $\\vec{p}$ ed $\\vec{E}$. Il momento è nullo quando $\\vec{p}$ è parallelo a $\\vec{E}$ (<strong>equilibrio stabile</strong>) oppure antiparallelo (<strong>equilibrio instabile</strong>).</p>`
          },
          {
            subtitle: "Osservazione — «Tende ad allineare» non significa «si ferma allineato»",
            content: `<p>La coppia $\\vec{M} = \\vec{p} \\times \\vec{E}$ <em>tende</em> ad allineare $\\vec{p}$ con $\\vec{E}$, nel senso che il suo verso è sempre quello che riduce l'angolo $\\theta$. Ciò <strong>non</strong> significa però che il dipolo si fermi spontaneamente nella posizione di allineamento: nella configurazione $\\theta = 0$ la coppia è nulla, ma la velocità angolare in generale non lo è. Il comportamento effettivo dipende dalle condizioni iniziali:</p>
            <ul>
              <li>un dipolo rigido lasciato <strong>da fermo</strong> con $0 \\lt \\theta \\lt \\pi$, libero di ruotare in un piano in un campo uniforme e costante, <strong>oscilla</strong> attorno alla posizione di allineamento $\\theta = 0$ in assenza di dissipazione: la coppia lo accelera verso l'allineamento, esso lo oltrepassa con la velocità angolare acquisita e il moto si ripete periodicamente;</li>
              <li>un dipolo lasciato da fermo già allineato ($\\theta = 0$, equilibrio stabile) oppure antiallineato ($\\theta = \\pi$, equilibrio instabile) resta invece <strong>fermo</strong>, perché la coppia è nulla;</li>
              <li>se il dipolo possiede energia cinetica iniziale sufficiente a superare la barriera in $\\theta = \\pi$, non oscilla affatto ma compie <strong>rotazioni complete</strong> nello stesso verso.</li>
            </ul>
            <p>Solo in presenza di dissipazione (urti, attrito viscoso, interazione con l'ambiente) l'energia in eccesso viene sottratta ed esso può assestarsi nell'equilibrio stabile $\\vec{p} \\parallel \\vec{E}$.</p>`
          }
        ],
        formulas: [
          { label: "Forza su dipolo in campo uniforme", latex: "\\vec{F}_{tot} = \\vec{0}" },
          { label: "Momento torcente", latex: "\\vec{M} = \\vec{p}\\times\\vec{E}, \\qquad M = pE\\sin\\theta" }
        ]
      },

      {
        id: "s09-integr-coppia",

        title: "Integrazione — non detto dal docente",

      {
        id: "s09-es-coppia",
        type: "esercizio_svolto",
        title: "Esercizio svolto — Modulo e verso della coppia su un dipolo",
        icon: "✎",
        source: "docente",
        content: `<p>Una molecola d'acqua, con momento di dipolo $p = 6{,}0 \\times 10^{-30}\\ \\text{C}\\cdot\\text{m}$, si trova in un campo elettrico uniforme di modulo $E = 1{,}0 \\times 10^{4}\\ \\text{V/m}$. Il vettore $\\vec{p}$ forma con $\\vec{E}$ un angolo $\\theta = 30^\\circ$. Determinare modulo, direzione e verso della coppia.</p>`,
        steps: [
          `<strong>Modulo.</strong> Dalla definizione di prodotto vettoriale: $$M = pE\\sin\\theta = (6{,}0\\times 10^{-30})(1{,}0\\times 10^{4})\\,\\sin 30^\\circ = (6{,}0\\times 10^{-26})(0{,}50) = 3{,}0 \\times 10^{-26}\\ \\text{N}\\cdot\\text{m}$$`,
          `<strong>Direzione.</strong> $\\vec{M}$ è perpendicolare al piano individuato da $\\vec{p}$ ed $\\vec{E}$.`,
          `<strong>Verso.</strong> Si trova con la regola della mano destra applicata a $\\vec{p} \\times \\vec{E}$: è tale che la rotazione indotta porti $\\vec{p}$ a sovrapporsi a $\\vec{E}$ percorrendo l'angolo minore, cioè riducendo $\\theta$ da $30^\\circ$ verso $0$.`,
          `<strong>Casi limite.</strong> Per $\\theta = 90^\\circ$ la coppia sarebbe massima, $M_{max} = pE = 6{,}0\\times 10^{-26}\\ \\text{N}\\cdot\\text{m}$; per $\\theta = 0$ e $\\theta = 180^\\circ$ si annullerebbe. Se la molecola fosse lasciata da fermo con $\\theta = 30^\\circ$ e il campo fosse uniforme e costante, in assenza di dissipazione essa oscillerebbe attorno a $\\theta = 0$ tra $+30^\\circ$ e $-30^\\circ$.`
        ]
      },

      {
        id: "s09-applicazioni",
        type: "section",
        title: "Esempi e Applicazioni",
        icon: "💧",
        content: `<p>Il dipolo non è un'astrazione: è il modello che spiega il comportamento dell'acqua e il funzionamento di un elettrodomestico che tutti abbiamo in casa.</p>`,
        subsections: [
          {
            subtitle: "La molecola d'acqua: un dipolo permanente",
            content: `<p>Un esempio importantissimo di dipolo naturale è la molecola d'acqua ($H_2O$). L'atomo di ossigeno è più elettronegativo degli atomi di idrogeno, cioè tende ad attrarre a sé gli elettroni di legame. Di conseguenza, la regione intorno all'ossigeno ha carica parzialmente negativa ($\\delta-$), mentre le regioni intorno ai due idrogeni hanno carica parzialmente positiva ($\\delta+$).</p>
            <p>A causa della sua geometria «a V», i contributi dei due legami <strong>non si cancellano</strong> e la molecola d'acqua possiede un <strong>momento di dipolo elettrico permanente</strong>, orientato dalla zona negativa (ossigeno) verso la zona positiva (idrogeni), coerentemente con la convenzione $\\vec{p} = q\\vec{d}$.</p>

            subtitle: "Il forno a microonde",
            content: `<p>Il funzionamento del forno a microonde si basa proprio sulla natura dipolare delle molecole d'acqua presenti nei cibi:</p>
            <ol>
              <li>Il forno genera un campo elettrico che oscilla molto rapidamente (a una frequenza tipica delle microonde).</li>
              <li>Questo campo variabile nel tempo esercita un momento torcente anch'esso variabile sulle molecole d'acqua, secondo $\\vec{M} = \\vec{p} \\times \\vec{E}$.</li>
              <li>Le molecole d'acqua (i dipoli) tentano continuamente di riorientarsi seguendo il campo che cambia direzione, e vengono quindi messe in rapida agitazione rotazionale.</li>
              <li>Questa agitazione è <strong>dissipativa</strong>: l'energia sottratta al campo si trasforma in energia termica nelle regioni del cibo effettivamente raggiunte dalle microonde. La distribuzione della temperatura dipende da quanto in profondità le microonde penetrano e da come l'alimento conduce il calore: <strong>non è corretto affermare in generale che la cottura cominci dall'interno</strong>.</li>
            </ol>`
          }
        ],
        quote: {
          text: "Se mettete un pezzo di ceramica o un pezzo di metallo nel forno a microonde, non succede niente... o meglio, col metallo distruggete il forno. Il cibo si scalda perché contiene acqua. Il campo elettrico fa girare le molecole d'acqua all'impazzata, e questo sfregamento le scalda.",
          src: "Nota del Prof."
        },
        extra_content: `<p><strong>Precisazione.</strong> La citazione va intesa come immagine qualitativa, non come legge fisica. La risposta di un materiale al campo oscillante dipende dalle sue proprietà (presenza di dipoli permanenti, conducibilità, geometria): un materiale privo di dipoli mobili e poco conduttore si scalda poco, mentre con un conduttore gli effetti dipendono dalla forma e dalla disposizione dell'oggetto, e non si traducono necessariamente in un danno al forno. L'idea fisica da trattenere è una sola: il campo oscillante agisce sui dipoli tramite la coppia $\\vec{M} = \\vec{p}\\times\\vec{E}$ e, in presenza di dissipazione, il lavoro svolto si trasforma in energia termica.</p>`
      },

      {
        id: "s09-equipotenziali",
        type: "section",
        title: "Campo Elettrico e Superfici Equipotenziali",
        icon: "🌐",
        content: `<p>Abbiamo visto la relazione che lega il campo elettrico al potenziale:</p>
        <p>$$\\vec{E} = -\\nabla V$$</p>
        <p>dove $\\nabla$ è l'operatore gradiente, che associa a una funzione scalare (il potenziale $V$) un campo vettoriale.</p>`,
        subsections: [
          {
            subtitle: "Il segno meno non è un dettaglio di scrittura",
            content: `<p>Il gradiente $\\nabla V$ è il vettore che punta nella direzione di <strong>massima crescita</strong> del potenziale, mentre il campo elettrico ne è l'opposto, $\\vec{E} = -\\nabla V$, e punta quindi verso i potenziali <strong>decrescenti</strong>. Dire che «il gradiente di $V$ è il campo elettrico» sarebbe scorretto: il gradiente di $V$ è $-\\vec{E}$.</p>`
          },
          {
            subtitle: "Definizione — Superficie equipotenziale",
            content: `<p>Una <strong>superficie equipotenziale</strong> è un luogo di punti dello spazio in cui il potenziale elettrico $V$ assume un valore costante.</p>
            <p><em>Analogia gravitazionale.</em> Se prendiamo un tavolo perfettamente orizzontale, tutti i punti sulla sua superficie si trovano alla stessa altezza dal suolo e quindi hanno la stessa energia potenziale gravitazionale. Il piano del tavolo è una superficie equipotenziale per il campo gravitazionale, e infatti la forza peso è perpendicolare ad esso.</p>`
          },
          {
            subtitle: "Proposizione — Ortogonalità (e dimostrazione)",
            content: `<p>Il campo elettrico $\\vec{E}$ è perpendicolare alle superfici equipotenziali in ogni punto in cui $\\vec{E} \\neq \\vec{0}$ e in cui l'equipotenziale è una superficie regolare; dove $\\vec{E} = \\vec{0}$ l'enunciato è privo di contenuto, perché la direzione del campo non è definita.</p>
            <p><strong>Dimostrazione.</strong> Consideriamo uno spostamento infinitesimo $d\\vec{l}$ che giace interamente su una superficie equipotenziale. Poiché il potenziale è costante su tale superficie, la variazione di potenziale lungo questo spostamento è nulla:</p>
            <p>$$dV = 0$$</p>
            <p>Sappiamo anche che $dV = -\\vec{E} \\cdot d\\vec{l}$. Uguagliando:</p>
            <p>$$-\\vec{E} \\cdot d\\vec{l} = 0$$</p>
            <p>Il prodotto scalare tra $\\vec{E}$ e un qualsiasi vettore spostamento $d\\vec{l}$ sulla superficie è nullo; per definizione di prodotto scalare, ciò implica che $\\vec{E}$ è ortogonale a $d\\vec{l}$. Dato che questo vale per <strong>qualsiasi</strong> spostamento sulla superficie, $\\vec{E}$ è perpendicolare alla superficie stessa in quel punto. $\\blacksquare$</p>

      {
        id: "s09-es-equip-carica",
        type: "esercizio_svolto",
        title: "Esercizio svolto — Equipotenziali di una carica puntiforme",
        icon: "✎",
        source: "docente",
        content: `<p>Determinare le superfici equipotenziali del campo generato da una carica puntiforme $Q$ posta nell'origine e verificare direttamente che il campo elettrico è ad esse ortogonale.</p>`,
        steps: [
          `<strong>Potenziale.</strong> Con riferimento nullo all'infinito: $$V(r) = \\frac{1}{4\\pi\\epsilon_0}\\frac{Q}{r}, \\qquad r = |\\vec{r}|$$`,
          `<strong>Imposizione $V = V_0$ costante</strong> (supponendo $Q \\neq 0$; per $Q = 0$ il potenziale è identicamente nullo e la domanda perde significato): $$\\frac{1}{4\\pi\\epsilon_0}\\frac{Q}{r} = V_0 \\quad \\Rightarrow \\quad r = \\frac{1}{4\\pi\\epsilon_0}\\frac{Q}{V_0} = \\text{costante}$$`,
          `<strong>Quali $V_0$ sono ammissibili?</strong> Avendo diviso per $V_0$ occorre discutere: (i) se $V_0 \\neq 0$ e ha lo <em>stesso segno</em> di $Q$, il secondo membro è positivo e individua un raggio finito $r \\gt 0$: la superficie esiste; (ii) se $V_0 = 0$ la divisione non è lecita e nessun punto a distanza finita ha quel potenziale, dato che $V(r) \\to 0$ soltanto per $r \\to \\infty$; (iii) se $V_0$ ha segno <em>opposto</em> a $Q$, si otterrebbe $r \\lt 0$, privo di senso: non esistono punti con quel valore del potenziale.`,
          `<strong>Geometria.</strong> Nei casi ammissibili la condizione $r = \\text{costante}$ individua una <strong>sfera</strong> centrata sulla carica: le equipotenziali sono sfere concentriche, che nel piano del disegno appaiono come circonferenze.`,
          `<strong>Verifica dell'ortogonalità.</strong> Il campo è radiale, $\\vec{E} = \\frac{1}{4\\pi\\epsilon_0}\\frac{Q}{r^2}\\hat{u}_r$. Un qualunque spostamento $d\\vec{l}$ che resti sulla sfera non cambia $r$, quindi è tangente alla sfera e ortogonale a $\\hat{u}_r$: $$\\vec{E}\\cdot d\\vec{l} = \\frac{1}{4\\pi\\epsilon_0}\\frac{Q}{r^2}\\,\\hat{u}_r \\cdot d\\vec{l} = 0$$ ossia $dV = -\\vec{E}\\cdot d\\vec{l} = 0$, in accordo con la proposizione.`,
          `<strong>Controllo del segno.</strong> Per $Q \\gt 0$ il potenziale decresce al crescere di $r$ e il campo punta verso l'esterno, cioè proprio verso i potenziali decrescenti, come deve essere per $\\vec{E} = -\\nabla V$.`
        ]

      {
        id: "s09-sfera-conduttrice",
        type: "section",
        title: "Equipotenziali di una Sfera Conduttrice",
        icon: "⚪",
        content: `<p>Riprendiamo l'analisi: se mi sposto lungo una superficie equipotenziale, percorrendo un tratto infinitesimo $d\\vec{l}$, il potenziale per definizione non varia. Da $\\vec{E} \\cdot d\\vec{l} = -dV$ e $dV = 0$ segue $\\vec{E} \\cdot d\\vec{l} = 0$: poiché né $\\vec{E}$ né $d\\vec{l}$ sono in generale nulli, i due vettori sono <strong>ortogonali</strong>.</p>
        <p><strong>Proposizione.</strong> Nei punti in cui il campo elettrostatico $\\vec{E}$ non è nullo, esso è perpendicolare alla superficie equipotenziale che passa per quel punto.</p>`,
        subsections: [
          {
            subtitle: "Esempio — Sfera conduttrice isolata",
            content: `<p>Consideriamo una sfera conduttrice <em>isolata</em> di raggio $R$ e carica totale $Q$, in condizioni di equilibrio elettrostatico e in assenza di campi esterni; fissiamo come sempre $V(\\infty) = 0$.</p>
            <p>Sotto queste ipotesi il potenziale sulla superficie e in tutto il volume interno è costante:</p>
            <p>$$V(r \\le R) = \\frac{1}{4\\pi\\epsilon_0} \\frac{Q}{R} = \\text{costante}$$</p>
            <p>All'esterno il potenziale decade come $1/r$:</p>
            <p>$$V(r \\gt R) = \\frac{1}{4\\pi\\epsilon_0}\\frac{Q}{r}$$</p>
            <p>La superficie della sfera è quindi una superficie equipotenziale.</p>`
          },
          {
            subtitle: "Attenzione: il campo è discontinuo attraverso la superficie",
            content: `<p>Per il campo elettrico occorre distinguere con cura le due regioni:</p>
            <p>$$\\vec{E}(r \\lt R) = \\vec{0}, \\qquad \\vec{E}(r \\gt R) = \\frac{1}{4\\pi\\epsilon_0} \\frac{Q}{r^2} \\hat{u}_r$$</p>
            <p><strong>Sulla superficie il campo non è definito come valore unico</strong>: ha senso parlare del limite dall'esterno,</p>
            <p>$$\\vec{E}(R^+) = \\frac{1}{4\\pi\\epsilon_0} \\frac{Q}{R^2} \\hat{u}_r$$</p>
            <p>mentre il limite dall'interno è $\\vec{E}(R^-) = \\vec{0}$.</p>
            <p>All'esterno il vettore $\\vec{E}$ è diretto lungo il raggio, e quindi è perpendicolare alla superficie sferica in ogni punto, confermando la proposizione generale.</p>`
          }
        ],
        quote: {
          text: "Se sono sdraiato su un pavimento perfettamente orizzontale, mi trovo su una superficie equipotenziale gravitazionale. Attenzione però: sdraiarsi non fa sparire né il campo né la forza peso. Il mio peso $m\\vec{g}$ continua ad agire esattamente come prima, ed è semplicemente bilanciato dalla reazione normale del pavimento, così che la risultante delle forze sia nulla e io stia fermo.",
          src: "Nota del Prof."
        },
        extra_content: `<p>Ciò che cambia, muovendosi lungo l'equipotenziale, è il <strong>lavoro</strong>: se mi sposto orizzontalmente, il peso è perpendicolare allo spostamento e dunque $m\\vec{g} \\cdot d\\vec{s} = 0$, cioè il peso non compie lavoro e la quota (l'energia potenziale) non cambia.</p>
        <p>Allo stesso modo, una carica che si muove lungo una superficie equipotenziale può essere soggetta a una forza elettrica $q\\vec{E}$ tutt'altro che nulla: è solo il <strong>lavoro</strong> di tale forza a essere nullo, perché $\\vec{E} \\perp d\\vec{l}$. Quindi la frase corretta non è «la carica non sente il campo», ma <strong>«il campo non compie lavoro sulla carica»</strong>.</p>`

      {
        id: "s09-energia-potenziale",
        type: "section",
        title: "Energia Potenziale Elettrostatica",
        icon: "🔋",
        content: `<p>Abbiamo parlato a lungo del potenziale, ma qual è il suo significato fisico più profondo? Quando collegate un apparecchio alla presa di corrente leggete «220 V». Quel valore è una <strong>differenza di potenziale</strong>. Dove c'è una differenza di potenziale può scorrere una corrente, cioè le cariche si mettono in moto: la differenza di potenziale agisce come una «pendenza» o un «dislivello» per le cariche elettriche.</p>`,
        subsections: [
          {
            subtitle: "Definizione — Energia potenziale elettrostatica",
            content: `<p>Siano assegnate alcune cariche <em>sorgenti</em> che generano nello spazio un potenziale elettrostatico $V$ (detto potenziale <em>esterno</em>, perché non include il contributo della carica che vi immergiamo). Se poniamo una carica $q$ in un punto $P$ dove tale potenziale vale $V(P)$, la sua <strong>energia potenziale elettrostatica</strong> è</p>
            <p>$$U(P) = q\\,V(P)$$</p>`
          },
          {
            subtitle: "Che cosa rappresenta (e cosa non rappresenta) $U = qV$",
            content: `<p>Tre precisazioni importanti:</p>
            <ul>
              <li>Il potenziale $V$ che compare in $U = qV$ è quello generato <strong>dalle altre cariche</strong> (le sorgenti), valutato nel punto occupato da $q$. Non vi si include il potenziale generato da $q$ stessa, che nella posizione di $q$ divergerebbe per una carica puntiforme.</li>
              <li>Di conseguenza $U = qV$ è l'energia di <strong>interazione</strong> fra la carica $q$ e le sorgenti, non l'energia totale del sistema di cariche: quest'ultima richiede di sommare anche le interazioni mutue delle sorgenti fra loro (e, per la carica di prova, si trascura l'autoenergia).</li>
              <li>$U$ e $V$ vanno riferiti allo <strong>stesso</strong> punto e allo <strong>stesso</strong> livello zero: se si pone $V(\\infty) = 0$, allora anche $U(\\infty) = 0$.</li>
            </ul>`
          },
          {
            subtitle: "Due enunciati da tenere distinti",
            content: `<p>Ricordiamo che l'energia potenziale $U_P$ associata a una forza conservativa $\\vec{F}$ è l'opposto del lavoro compiuto dalla forza per spostare un corpo da un punto di riferimento $O$ (dove $U_O = 0$) al punto $P$:</p>
            <p>$$U_P = - \\int_{O}^{P} \\vec{F} \\cdot d\\vec{s}$$</p>
            <p><strong>(1) Teorema dell'energia cinetica.</strong> La variazione di energia cinetica è uguale al lavoro <em>totale</em> compiuto da <em>tutte</em> le forze agenti:</p>
            <p>$$\\Delta K = K_B - K_A = W^{\\text{tot}}_{A \\to B} = \\sum_i \\int_{A}^{B} \\vec{F}_i \\cdot d\\vec{s}$$</p>
            <p>Qui non si richiede alcuna ipotesi di conservatività: <strong>vale sempre</strong>.</p>
            <p><strong>(2) Lavoro di una forza conservativa.</strong> Se la forza $\\vec{F}$ è conservativa, ad essa si può associare un'energia potenziale $U$ e il <em>suo</em> lavoro (solo il suo) vale</p>
            <p>$$W_{A \\to B} = \\int_{A}^{B} \\vec{F} \\cdot d\\vec{s} = - \\Delta U = U_A - U_B$$</p>
            <p>Combinando i due enunciati si ottiene la conservazione dell'energia meccanica, <strong>ma soltanto se</strong> il lavoro totale coincide con quello della forza conservativa, cioè se non agiscono altre forze oppure se le altre forze compiono lavoro complessivamente nullo (per esempio perché sempre perpendicolari allo spostamento, come una reazione vincolare ideale). In tal caso:</p>
            <p>$$K_B - K_A = W^{\\text{tot}}_{A \\to B} = U_A - U_B \\quad \\Rightarrow \\quad K_A + U_A = K_B + U_B$$</p>
            <p>$$\\frac{1}{2} m v_A^2 + U_A = \\frac{1}{2} m v_B^2 + U_B$$</p>`
          },
          {
            subtitle: "Applicazione al campo elettrostatico",
            content: `<p>La forza elettrica $\\vec{F} = q\\vec{E}$ è conservativa e la sua energia potenziale è $U = qV$. Il lavoro compiuto dalla forza elettrica su una carica $q$ che si sposta da $A$ a $B$ è dunque:</p>
            <p>$$W^{\\text{el}}_{A \\to B} = U_A - U_B = qV_A - qV_B = q(V_A - V_B)$$</p>`
          },
          {
            subtitle: "Proposizione — Relazioni operative per l'energia in elettrostatica",
            content: `<p>Sia $q$ una carica che si sposta da $A$ a $B$ in un campo elettrostatico $\\vec{E}$ generato da sorgenti fisse, e sia $U = qV$.</p>
            <ol>
              <li><strong>Sempre valida</strong> (lavoro della sola forza elettrica): $$W^{\\text{el}}_{A \\to B} = -\\Delta U = U_A - U_B = q\\,(V_A - V_B)$$ In particolare $W^{\\text{el}}$ dipende solo dagli estremi $A$ e $B$ e non dal percorso.</li>
              <li><strong>Valida sotto ipotesi</strong> (bilancio energetico): se sulla carica agisce <em>soltanto</em> la forza elettrica, oppure se le eventuali altre forze compiono lavoro complessivamente nullo lungo il percorso, allora $W^{\\text{tot}} = W^{\\text{el}}$ e quindi $$\\Delta K = W^{\\text{el}}_{A \\to B} = -\\Delta U = q\\,(V_A - V_B), \\qquad K_A + U_A = K_B + U_B$$</li>
            </ol>
            <p>Se invece sono presenti altre forze con lavoro non nullo (attriti, forze applicate dall'esterno, gravità su spostamenti non orizzontali), la relazione corretta è $\\Delta K = W^{\\text{el}} + W^{\\text{altre}}$ e l'energia meccanica $K + U$ <strong>non si conserva</strong>.</p>
            <p>Nel caso particolare in cui valgano le ipotesi del punto 2, la catena di uguaglianze che riassume la dinamica di una carica in un campo elettrostatico è:</p>
            <p>$$\\Delta K = K_B - K_A = W^{\\text{el}}_{A \\to B} = -\\Delta U = -(U_B - U_A) = q(V_A - V_B)$$</p>`
          }
        ],
        formulas: [
          { label: "Energia potenziale elettrostatica", latex: "U(P) = q\\,V(P)" },
          { label: "Lavoro della forza elettrica (sempre valido)", latex: "W^{\\text{el}}_{A \\to B} = U_A - U_B = q(V_A - V_B)" },
          { label: "Bilancio energetico (sotto ipotesi)", latex: "K_A + U_A = K_B + U_B" }
        ]
      },

      {
        id: "s09-verso-forza-moto",
        type: "alert_box",
        title: "Verso della Forza e Verso del Moto: non confonderli",
        icon: "⚠️",
        content: `<p>Consideriamo una carica <strong>lasciata inizialmente ferma</strong> e libera di muoversi (nessun vincolo, nessuna forza oltre a quella elettrica). Il moto parte nella direzione della forza $\\vec{F} = q\\vec{E}$; poiché la carica parte da ferma e la forza netta è nella direzione del moto iniziale, si ha $K_B \\gt K_A = 0$ lungo il tratto considerato, cioè $\\Delta K \\gt 0$:</p>
        <ul>
          <li><strong>Carica positiva ($q \\gt 0$):</strong> la forza è concorde con $\\vec{E}$; perché sia $\\Delta K = q(V_A - V_B) \\gt 0$ deve essere $V_A \\gt V_B$. Partendo da ferma, la carica positiva si muove verso <strong>potenziali decrescenti</strong>: va «in discesa» lungo il potenziale.</li>
          <li><strong>Carica negativa ($q \\lt 0$):</strong> la forza è discorde da $\\vec{E}$; perché sia $q(V_A - V_B) \\gt 0$ deve essere $V_A - V_B \\lt 0$, cioè $V_A \\lt V_B$. Partendo da ferma, la carica negativa si muove verso <strong>potenziali crescenti</strong>: va «in salita» lungo il potenziale.</li>
        </ul>
        <p><strong>Attenzione a non confondere forza e moto.</strong> Il segno di $q$ determina il <em>verso della forza</em> rispetto a $\\vec{E}$, e quindi il verso dell'accelerazione; il <em>verso della velocità</em> dipende anche dalle condizioni iniziali. Una carica positiva lanciata con velocità iniziale verso potenziali crescenti si muoverà effettivamente «in salita», rallentando (la forza è opposta alla velocità, $\\Delta K \\lt 0$), eventualmente fermandosi e tornando indietro. Le conclusioni dell'elenco precedente descrivono dunque il moto <strong>spontaneo da fermo</strong>, non il moto in generale.</p>`
      },

            <p>Se inseriamo <strong>inizialmente ferma</strong> una carica di prova positiva ($q \\gt 0$) tra i piatti, la forza $q\\vec{E}$ è diretta verso il piatto negativo e la carica viene accelerata lungo $+x$, <strong>perpendicolarmente</strong> alle piastre: si muove da un potenziale più alto a uno più basso, come un sasso che rotola giù da un piano inclinato.</p>
            <p>Se invece inseriamo, sempre da ferma, una carica negativa ($q \\lt 0$, come un elettrone), la forza è diretta verso il piatto positivo: la carica viene accelerata lungo $-x$, muovendosi da un potenziale più basso a uno più alto. In entrambi i casi la traiettoria è un segmento rettilineo ortogonale alle piastre: non c'è alcuna componente obliqua, perché il campo ha solo componente lungo $x$ e la velocità iniziale è nulla.</p>`
          },
          {
            subtitle: "Definizione — Elettronvolt",
            content: `<p>In fisica atomica e subatomica si usa spesso un'unità di misura dell'energia chiamata <strong>elettronvolt</strong> (simbolo eV). È definito come l'energia cinetica acquistata da un elettrone, inizialmente fermo, quando viene accelerato da una differenza di potenziale di 1 Volt:</p>
            <p>$$1 \\text{ eV} = |q_e| \\cdot (1 \\text{ V}) = (1.602 \\times 10^{-19} \\text{ C}) \\cdot (1 \\text{ V}) = 1.602 \\times 10^{-19} \\text{ J}$$</p>`
          },
          {
            subtitle: "Esempio — Tubo a raggi catodici (CRT)",
            content: `<p>I vecchi televisori e monitor a tubo catodico funzionavano su questo principio. All'interno del tubo a vuoto, un filamento metallico (il catodo, $A$) veniva riscaldato: il calore forniva energia sufficiente agli elettroni per «evaporare» dalla superficie del metallo (effetto termoionico), partendo con velocità iniziale quasi nulla. Dall'altra parte si trovava lo schermo (l'anodo, $B$), rivestito di fosfori, con $V_B \\gt V_A$. L'elettrone, essendo una carica negativa, veniva accelerato da $A$ (potenziale basso) verso $B$ (potenziale alto).</p>
            <p>Nel tubo a vuoto non ci sono urti né attriti, e l'effetto del peso è del tutto trascurabile rispetto alla forza elettrica: siamo quindi nelle ipotesi del <strong>punto 2 della proposizione sulle relazioni operative per l'energia</strong> e possiamo usare $\\Delta K = q(V_A - V_B)$. Se un elettrone parte da fermo da $A$ ($v_A = 0$):</p>
            <p>$$\\Delta K = \\frac{1}{2}m_e v_B^2 - 0 = q_e(V_A - V_B) = -e(V_A - V_B) = e(V_B - V_A)$$</p>
            <p>dove $e$ è la carica elementare (positiva). La velocità finale è quindi</p>
            <p>$$v_B = \\sqrt{\\frac{2e(V_B - V_A)}{m_e}}$$</p>
            <p>Quando l'elettrone ad alta velocità colpiva lo schermo, l'energia cinetica veniva ceduta ai fosfori, che si illuminavano emettendo un puntino di luce. Deflettendo il fascio con altri campi elettrici o magnetici si poteva «disegnare» l'immagine.</p>`
          },
          {
            subtitle: "Esempio illustrativo — Numeri per il condensatore",
            content: `<p>Supponiamo $V_+ - V_- = 100$ V e una distanza fra le piastre $d = 2$ cm $= 2 \\times 10^{-2}$ m. Il campo uniforme vale</p>
            <p>$$E = \\frac{V_+ - V_-}{d} = \\frac{100 \\text{ V}}{2 \\times 10^{-2} \\text{ m}} = 5 \\times 10^{3} \\ \\text{V/m}$$</p>
            <p>Un protone ($q = +e = 1.602 \\times 10^{-19}$ C, $m_p = 1.673 \\times 10^{-27}$ kg) lasciato fermo a contatto con la piastra positiva subisce una forza</p>
            <p>$$F = qE = (1.602 \\times 10^{-19})(5 \\times 10^{3}) \\approx 8.0 \\times 10^{-16} \\ \\text{N}$$</p>
            <p>diretta perpendicolarmente alle piastre, verso il piatto negativo. Il lavoro della forza elettrica nel traversare tutto il condensatore è</p>
            <p>$$W^{\\text{el}} = q(V_A - V_B) = (1.602 \\times 10^{-19} \\text{ C})(100 \\text{ V}) \\approx 1.60 \\times 10^{-17} \\ \\text{J} = 100 \\ \\text{eV}$$</p>
            <p>Poiché nel vuoto agisce solo la forza elettrica, $\\Delta K = W^{\\text{el}}$ e quindi</p>
            <p>$$v_B = \\sqrt{\\frac{2 \\cdot 1.60 \\times 10^{-17}}{1.673 \\times 10^{-27}}} \\approx 1.4 \\times 10^{5} \\ \\text{m/s}$$</p>
            <p>Si noti come l'uso dell'elettronvolt renda immediata la lettura: «100 V di differenza di potenziale» equivale a «100 eV di energia cinetica acquistata» per una particella di carica $\\pm e$ partita da ferma.</p>`
          }
        ],
        formulas: [
          { label: "Potenziale nel condensatore piano", latex: "V(x) = V_+ - E\\,x, \\qquad 0 \\le x \\le d" },
          { label: "Elettronvolt", latex: "1\\ \\text{eV} = 1.602\\times10^{-19}\\ \\text{J}" },
          { label: "Velocità di un elettrone accelerato", latex: "v_B = \\sqrt{\\frac{2e(V_B - V_A)}{m_e}}" }
        ]
      },

      {
        id: "s09-circuitazione",
        type: "section",
        title: "La Circuitazione del Campo Elettrostatico",
        icon: "🔁",
        content: `<p><strong>Dove stiamo andando.</strong> Il percorso è il seguente: partiamo dalla conservatività del campo elettrostatico, la riscriviamo come annullamento della <em>circuitazione</em> su ogni linea chiusa (proprietà <strong>globale</strong>, riferita a un circuito intero), e poi la traduciamo nella corrispondente proprietà <strong>locale</strong>, punto per punto: l'annullamento del <em>rotore</em>. Quest'ultima forma è una delle equazioni di Maxwell per i campi statici.</p>
        <p>Il campo elettrostatico è conservativo: il lavoro compiuto dalla forza elettrica per spostare una carica da $A$ a $B$ non dipende dal percorso seguito, ma solo dalla posizione iniziale e finale. Per una carica puntiforme $q$ che genera il campo:</p>
        <p>$$\\int_A^B \\vec{E} \\cdot d\\vec{s} = \\frac{q}{4\\pi\\epsilon_0} \\left( \\frac{1}{r_A} - \\frac{1}{r_B} \\right) = V(A) - V(B)$$</p>
        <p>Cosa succede se il punto di partenza $A$ coincide con il punto di arrivo $B$? Stiamo calcolando l'integrale lungo un <strong>percorso chiuso</strong>: se $A \\equiv B$ allora $V(A) = V(B)$, e l'integrale diventa nullo.</p>`,
        subsections: [
          {
            subtitle: "Definizione — Circuitazione",
            content: `<p>Si definisce <strong>circuitazione</strong> di un campo vettoriale $\\vec{E}$ lungo una linea chiusa $\\gamma$ l'integrale di linea di $\\vec{E}$ lungo quella linea:</p>
            <p>$$\\oint_\\gamma \\vec{E} \\cdot d\\vec{s}$$</p>
            <p>Qui $d\\vec{s}$ è l'<strong>elemento di linea</strong>: un vettore infinitesimo <em>tangente</em> alla curva, il cui verso è fissato dal verso di percorrenza scelto su $\\gamma$. Invertendo il verso di percorrenza, la circuitazione cambia segno.</p>

            <p>La figura mostra gli ingredienti geometrici della definizione: la curva chiusa con il suo verso di percorrenza, l'elemento tangente $d\\vec{s}$ e il campo $\\vec{E}$ nel punto considerato. Il prodotto scalare $\\vec{E} \\cdot d\\vec{s}$ seleziona, punto per punto, la sola componente del campo <strong>lungo</strong> la curva.</p>`
          },
          {
            subtitle: "Il risultato",
            content: `<p>Per un campo conservativo come il campo elettrostatico la circuitazione è sempre nulla:</p>
            <p>$$\\oint_\\gamma \\vec{E} \\cdot d\\vec{s} = 0 \\qquad \\text{per ogni linea chiusa } \\gamma$$</p>
            <p>Questa proprietà è una caratteristica fondamentale di tutti i campi conservativi.</p>`
          }
        ],
        formulas: [
          { label: "Circuitazione nulla (forma globale)", latex: "\\oint_\\gamma \\vec{E}\\cdot d\\vec{s} = 0" }
        ]
      },

      {
        id: "s09-rotore",
        type: "section",
        title: "Il Rotore di un Campo Vettoriale",
        icon: "🌀",
        content: `<p>La relazione $\\oint_\\gamma \\vec{E} \\cdot d\\vec{s} = 0$ è una proprietà <strong>globale</strong>: coinvolge un intero circuito. Vogliamo ora una formulazione <strong>locale</strong>, cioè una condizione verificabile punto per punto. L'idea è naturale: se la circuitazione è nulla su <em>ogni</em> circuito, lo è in particolare su circuiti piccolissimi attorno a un punto fissato. Lo strumento che misura esattamente questa «circuitazione per unità di area» è un operatore differenziale chiamato <strong>rotore</strong>, indicato con $\\nabla \\times \\vec{E}$ (si legge «nabla cross E») oppure $\\text{rot}(\\vec{E})$.</p>`,
        subsections: [
          {
            subtitle: "Definizione — Rotore",
            content: `<p>Il rotore di un campo vettoriale $\\vec{E} = E_x \\hat{\\imath} + E_y \\hat{\\jmath} + E_z \\hat{k}$ è definito formalmente come il prodotto vettoriale $\\nabla \\times \\vec{E}$, dove $\\nabla = \\hat{\\imath} \\frac{\\partial}{\\partial x} + \\hat{\\jmath} \\frac{\\partial}{\\partial y} + \\hat{k} \\frac{\\partial}{\\partial z}$ è l'operatore nabla. Il risultato è <strong>un altro campo vettoriale</strong>. Si calcola con il determinante simbolico:</p>
            <p>$$\\nabla \\times \\vec{E} = \\begin{vmatrix} \\hat{\\imath} & \\hat{\\jmath} & \\hat{k} \\\\ \\frac{\\partial}{\\partial x} & \\frac{\\partial}{\\partial y} & \\frac{\\partial}{\\partial z} \\\\ E_x & E_y & E_z \\end{vmatrix}$$</p>
            <p>Sviluppando:</p>
            <p>$$\\nabla \\times \\vec{E} = \\left( \\frac{\\partial E_z}{\\partial y} - \\frac{\\partial E_y}{\\partial z} \\right) \\hat{\\imath} - \\left( \\frac{\\partial E_z}{\\partial x} - \\frac{\\partial E_x}{\\partial z} \\right) \\hat{\\jmath} + \\left( \\frac{\\partial E_y}{\\partial x} - \\frac{\\partial E_x}{\\partial y} \\right) \\hat{k}$$</p>`
          },
          {
            subtitle: "Che cosa misura il rotore: il raccordo con la circuitazione",
            content: `<p>Il rotore è un vettore, e come ogni vettore acquista significato quando lo si proietta lungo una direzione. Fissiamo un punto $P$ e una direzione individuata dal versore $\\hat{n}$. Consideriamo un piccolo circuito chiuso $\\gamma$ che circonda $P$, contenuto nel piano perpendicolare a $\\hat{n}$, di area $\\Delta S$, percorso nel verso associato a $\\hat{n}$ dalla <strong>regola della mano destra</strong> (se il pollice destro indica $\\hat{n}$, le altre dita indicano il verso di percorrenza). Allora</p>
            <p>$$(\\nabla \\times \\vec{E}) \\cdot \\hat{n} = \\lim_{\\Delta S \\to 0} \\frac{1}{\\Delta S} \\oint_\\gamma \\vec{E} \\cdot d\\vec{s}$$</p>
            <p>cioè proprio la <strong>circuitazione per unità di area</strong> di un circuito infinitesimo orientato.</p>

      {
        id: "s09-integr-stokes",
        type: "integrazione_box",
        title: "Integrazione — Il teorema di Stokes",
        content: `<p>L'approfondimento che segue va oltre quanto strettamente svolto a lezione, ma rende rigoroso il legame appena descritto. Il <strong>teorema di Stokes</strong> afferma che, per un campo $\\vec{E}$ regolare e una superficie $S$ orientata con bordo la curva chiusa $\\partial S$ (orientata coerentemente con la normale $\\hat{n}$ secondo la regola della mano destra),</p>
        <p>$$\\oint_{\\partial S} \\vec{E} \\cdot d\\vec{s} = \\int_S (\\nabla \\times \\vec{E}) \\cdot \\hat{n} \\, dS$$</p>
        <p>Da questa identità si legge l'equivalenza nei due sensi:</p>
        <ul>
          <li>se $\\nabla \\times \\vec{E} = \\vec{0}$ in tutta una regione (semplicemente connessa), il membro di destra è nullo e quindi la circuitazione è nulla su ogni curva chiusa contenuta nella regione;</li>
          <li>viceversa, se la circuitazione è nulla su ogni curva chiusa, applicando l'identità a circuiti sempre più piccoli attorno a un punto e dividendo per l'area si riottiene la formula del limite, dunque $(\\nabla \\times \\vec{E}) \\cdot \\hat{n} = 0$ per ogni $\\hat{n}$, cioè $\\nabla \\times \\vec{E} = \\vec{0}$.</li>
        </ul>
        <p>L'ipotesi di regolarità è essenziale: la regione non deve contenere punti in cui il campo (o il potenziale) sia singolare.</p>`
      },

      {
        id: "s09-irrotazionale",
        type: "section",
        title: "Il Campo Elettrostatico è Irrotazionale",
        icon: "🧮",
        content: `<p>Vediamo con precisione come dalla proprietà integrale si passa a quella locale. Dal teorema del rotore (o di Stokes), poiché il membro di sinistra è nullo per <em>ogni</em> curva chiusa, anche il membro di destra è nullo per ogni superficie $S$. Fissiamo un punto $P$ in cui il campo è di classe $C^1$ e prendiamo una superficie piana molto piccola, di area $\\Delta S$, centrata in $P$ e con normale $\\hat{n}$ assegnata: per $\\Delta S \\to 0$ si ottiene</p>
        <p>$$(\\nabla \\times \\vec{E})(P) \\cdot \\hat{n} = \\lim_{\\Delta S \\to 0} \\frac{1}{\\Delta S}\\oint_{\\partial S} \\vec{E} \\cdot d\\vec{l} = 0$$</p>
        <p>Questo vale per <strong>qualsiasi</strong> orientazione $\\hat{n}$: scegliendo successivamente $\\hat{n} = \\hat{\\imath}, \\hat{\\jmath}, \\hat{k}$ si annullano tutte e tre le componenti, dunque $(\\nabla \\times \\vec{E})(P) = \\vec{0}$. Il ragionamento richiede che il campo sia sufficientemente regolare in $P$: nei punti singolari, per esempio dove sta una carica puntiforme o attraverso una superficie carica, il rotore <strong>non è nemmeno definito</strong>.</p>`,
        subsections: [
          {
            subtitle: "Proposizione — Seconda equazione di Maxwell per l'elettrostatica",
            content: `<p>Il campo elettrostatico $\\vec{E}$ è un campo <strong>irrotazionale</strong>: in ogni punto in cui $\\vec{E}$ è di classe $C^1$ (derivabile con derivate parziali continue) vale</p>
            <p>$$\\nabla \\times \\vec{E} = \\vec{0}$$</p>
            <p>Equivalentemente, in ogni regione semplicemente connessa in cui il campo è regolare, $\\vec{E} = -\\nabla V$ con $V$ di classe $C^2$. Questa è la seconda equazione di Maxwell in forma differenziale (o locale) per il caso statico; la corrispondente forma integrale, valida anche in presenza di singolarità isolate, è $\\oint_\\gamma \\vec{E} \\cdot d\\vec{l} = 0$.</p>`

          {
            subtitle: "Dimostrazione: il rotore di un gradiente è nullo",
            content: `<p>Partiamo da $\\vec{E} = -\\nabla V$, supponendo $V$ di classe $C^2$ nella regione di interesse:</p>
            <p>$$\\nabla \\times \\vec{E} = \\nabla \\times (-\\nabla V) = - (\\nabla \\times \\nabla V)$$</p>
            <p>Il gradiente di $V$ è $\\nabla V = \\frac{\\partial V}{\\partial x}\\hat{\\imath} + \\frac{\\partial V}{\\partial y}\\hat{\\jmath} + \\frac{\\partial V}{\\partial z}\\hat{k}$, e il rotore si calcola con il determinante simbolico:</p>
            <p>$$\\nabla \\times (\\nabla V) = \\begin{vmatrix} \\hat{\\imath} & \\hat{\\jmath} & \\hat{k} \\\\ \\frac{\\partial}{\\partial x} & \\frac{\\partial}{\\partial y} & \\frac{\\partial}{\\partial z} \\\\ \\frac{\\partial V}{\\partial x} & \\frac{\\partial V}{\\partial y} & \\frac{\\partial V}{\\partial z} \\end{vmatrix}$$</p>
            <p>$$= \\hat{\\imath} \\left( \\frac{\\partial^2 V}{\\partial y \\partial z} - \\frac{\\partial^2 V}{\\partial z \\partial y} \\right) - \\hat{\\jmath} \\left( \\frac{\\partial^2 V}{\\partial x \\partial z} - \\frac{\\partial^2 V}{\\partial z \\partial x} \\right) + \\hat{k} \\left( \\frac{\\partial^2 V}{\\partial x \\partial y} - \\frac{\\partial^2 V}{\\partial y \\partial x} \\right)$$</p>
            <p>Per il <strong>teorema di Schwarz</strong>, se le derivate seconde sono continue l'ordine di derivazione è ininfluente (es. $\\frac{\\partial^2 V}{\\partial y \\partial z} = \\frac{\\partial^2 V}{\\partial z \\partial y}$). Pertanto tutte le componenti tra parentesi sono nulle e</p>
            <p>$$\\nabla \\times \\vec{E} = -(\\vec{0}) = \\vec{0}$$</p>
            <p>L'ipotesi di regolarità è proprio quella richiamata nell'enunciato: la conclusione vale nei punti in cui $V$ è $C^2$, cioè dove $\\vec{E}$ è $C^1$. $\\blacksquare$</p>`
          },
          {
            subtitle: "Le quattro formulazioni sono equivalenti",
            content: `<p>Vale la pena notare che le due vie seguite (Stokes a partire dalla circuitazione nulla, e il calcolo diretto del rotore del gradiente) sono due facce della stessa medaglia: «conservativo», «circuitazione nulla su ogni cammino chiuso», «esiste un potenziale $V$ con $\\vec{E} = -\\nabla V$» e «irrotazionale» sono proprietà <strong>equivalenti</strong>, purché la regione in cui si lavora sia semplicemente connessa e il campo sia regolare. In regioni più complicate l'implicazione «irrotazionale $\\Rightarrow$ conservativo» può cadere: è un punto che si incontra di nuovo studiando il campo magnetico.</p>`
          },
          {
            subtitle: "Esempio — Potenziale quadratico $V = \\frac{1}{2}kr^2$",
            content: `<p>Consideriamo $V = \\frac{1}{2}k(x^2+y^2+z^2) = \\frac{1}{2}k r^2$. La funzione è un polinomio, dunque di classe $C^\\infty$ su tutto lo spazio: siamo pienamente nelle ipotesi della proposizione. Le derivate parziali sono $\\frac{\\partial V}{\\partial x} = kx$, $\\frac{\\partial V}{\\partial y} = ky$, $\\frac{\\partial V}{\\partial z} = kz$, quindi</p>
            <p>$$\\vec{E} = -\\nabla V = - (kx\\hat{\\imath} + ky\\hat{\\jmath} + kz\\hat{k}) = -k \\vec{r}$$</p>
            <p>Questo campo, derivando da un potenziale regolare, è conservativo e quindi irrotazionale in ogni punto. Potete verificare per esercizio che $\\nabla \\times \\vec{E} = \\vec{0}$: per esempio la componente $z$ del rotore è $\\partial_x(-ky) - \\partial_y(-kx) = 0 - 0 = 0$, e analogamente per le altre due.</p>
            <p>Si osservi inoltre che le superfici equipotenziali $V = \\text{costante}$ sono qui le sfere $r = \\text{costante}$, e il campo $\\vec{E} = -k\\vec{r}$ è radiale: di nuovo, <strong>campo perpendicolare alle equipotenziali</strong>.</p>`

          text: "Quando il mio professore mi chiese cosa volessi fare da grande, risposi «il fisico». Lui mi disse: «Ma cosa vuoi studiare? Dopo le equazioni di Maxwell, in fisica è già stato scoperto tutto». Questo per farvi capire l'importanza e la completezza di queste equazioni. Fortunatamente per la fisica (e per me), si sbagliava. Proprio studiando le «piccole cose» che non tornavano, un giovane di nome Max Planck aprì le porte alla meccanica quantistica, partendo proprio da un problema legato all'elettromagnetismo: l'irraggiamento del corpo nero.",

      {
        id: "s09-nota-storica",
        type: "note_box",
        title: "Nota Storica — La catastrofe ultravioletta e il «rivoluzionario riluttante»",
        icon: "📜",
        content: `<p>Alla fine dell'Ottocento molti fisici pensavano che la fisica fosse quasi completa. Con la meccanica classica di Newton e l'elettromagnetismo di Maxwell sembrava che l'universo fosse completamente descritto. Tuttavia c'erano alcuni problemi inspiegabili, come il motivo per cui i corpi scaldati emettono luce, un fenomeno noto come problema del <em>corpo nero</em>. I calcoli basati sulla fisica classica portavano a un risultato assurdo, la cosiddetta <em>catastrofe ultravioletta</em>.</p>
        <p>Fu Max Planck che, per risolvere l'enigma, propose un'idea rivoluzionaria: ipotizzò che i corpi caldi potessero essere modellizzati come un insieme di oscillatori armonici la cui energia non poteva assumere qualsiasi valore, ma solo valori discreti, «quantizzati». Con questa ipotesi i conti tornavano.</p>
        <p>Planck stesso era molto cauto riguardo alla sua idea, tanto da essere definito il «rivoluzionario riluttante». Nonostante lo scetticismo iniziale, la sua ipotesi si rivelò corretta e aprì le porte alla meccanica quantistica. Pochi anni dopo Albert Einstein usò lo stesso concetto di quantizzazione per spiegare l'effetto fotoelettrico, e Niels Bohr lo applicò al modello dell'atomo. Questo ci insegna che anche quando un modello sembra perfetto, come le equazioni di Maxwell, <strong>c'è sempre la possibilità di andare oltre</strong>.</p>`
      },

      {
        id: "s09-significato-irrotazionale",
        type: "alert_box",
        title: "Che cosa significa (e che cosa NON significa) «irrotazionale»",
        icon: "🚩",
        content: `<p>Un campo vettoriale il cui rotore è nullo è detto <em>irrotazionale</em>. Attenzione però al significato fisico corretto: rotore nullo in un punto significa <strong>assenza di circuitazione locale</strong>, cioè che la circuitazione del campo lungo un circuito infinitesimo attorno a quel punto, divisa per l'area racchiusa, tende a zero qualunque sia l'orientazione $\\hat{n}$ del circuito (e, se il rotore è nullo in tutta una regione semplicemente connessa, la circuitazione è esattamente nulla su ogni curva chiusa contenuta in essa).</p>
        <p><strong>NON significa che il campo sia incapace di mettere in rotazione un corpo:</strong> un campo elettrostatico <em>uniforme</em> ha rotore nullo, e tuttavia esercita un momento torcente $\\vec{\\tau} = \\vec{p} \\times \\vec{E}$ su un dipolo elettrico $\\vec{p}$ non allineato con il campo, facendolo ruotare.</p>
        <p><strong>Seconda confusione frequente.</strong> Il campo di una <em>singola</em> carica puntiforme è radiale, e in questo caso particolare la mancanza di «vortici» è evidente a occhio. Ma il campo di una distribuzione di carica generica non è affatto radiale: si pensi al campo di un dipolo, o a quello di due cariche uguali affiancate, le cui linee di campo sono curve e non uscenti da un unico centro. Nonostante ciò, anche questi campi restano irrotazionali in tutte le regioni in cui il potenziale è regolare, perché <strong>l'irrotazionalità non dipende dalla geometria particolare delle linee di campo, ma solo dall'esistenza del potenziale</strong>.</p>`
      },

      {
        id: "s09-esempi-rotore",
        type: "section",
        title: "Esempi di Calcolo del Rotore",
        icon: "✏️",
        content: `<p>Mettiamo alla prova la definizione su due campi concreti.</p>`,
        subsections: [
          {
            subtitle: "Esempio — Campo di una carica puntiforme (esercizio proposto)",
            content: `<p>Consideriamo il campo generato da una carica puntiforme $q$ posta nell'origine, in tutti i punti con $r \\gt 0$ (l'origine, dove il campo non è definito, va esclusa):</p>
            <p>$$\\vec{E} = \\frac{q}{4\\pi\\epsilon_0} \\frac{\\vec{r}}{r^3} = \\frac{q}{4\\pi\\epsilon_0} \\frac{x\\hat{\\imath} + y\\hat{\\jmath} + z\\hat{k}}{(x^2+y^2+z^2)^{3/2}}$$</p>
            <p>Le componenti sono $E_x = \\frac{K x}{r^3}$, $E_y = \\frac{K y}{r^3}$, $E_z = \\frac{K z}{r^3}$, con $K = q/(4\\pi\\epsilon_0)$ e $r = \\sqrt{x^2+y^2+z^2}$.</p>
            <p><strong>Questo è un esercizio proposto:</strong> calcolate le derivate parziali necessarie (ad esempio $\\partial E_z / \\partial y$ e $\\partial E_y / \\partial z$) e verificate che, componente per componente, il risultato è zero nel dominio $r \\gt 0$, confermando che $\\nabla \\times \\vec{E} = \\vec{0}$. Nell'integrazione che segue è svolta una componente, così da avere un riferimento per lo studio autonomo.</p>`
          },
          {
            subtitle: "Esempio — Potenziale quadratico $V = \\frac{1}{2}(x^2+y^2+z^2)$",
            content: `<p>Le derivate parziali sono $\\frac{\\partial V}{\\partial x} = x$, $\\frac{\\partial V}{\\partial y} = y$, $\\frac{\\partial V}{\\partial z} = z$, quindi</p>
            <p>$$\\vec{E} = -\\nabla V = -x\\hat{\\imath} - y\\hat{\\jmath} - z\\hat{k}$$</p>
            <p>Il campo è conservativo per costruzione, poiché deriva da un potenziale che in questo caso è un polinomio, dunque di classe $C^2$ in tutto lo spazio: non ci sono punti da escludere. Verifichiamo che è anche irrotazionale:</p>
            <p>$$(\\nabla \\times \\vec{E})_x = \\frac{\\partial E_z}{\\partial y} - \\frac{\\partial E_y}{\\partial z} = \\frac{\\partial(-z)}{\\partial y} - \\frac{\\partial(-y)}{\\partial z} = 0 - 0 = 0$$</p>
            <p>Qui le derivate sono immediate perché ogni componente del campo dipende da una sola variabile, e le derivate «incrociate» sono nulle; nel caso della carica puntiforme, invece, ogni componente dipende da tutte e tre le variabili tramite $r$, e la cancellazione emerge solo dopo aver applicato la regola della catena. Analogamente le altre componenti sono nulle, quindi $\\nabla \\times \\vec{E} = \\vec{0}$ in ogni punto.</p>
            <p><strong>Analogia con la forza elastica.</strong> Questo potenziale ha la stessa forma dell'energia potenziale elastica di una molla tridimensionale, $U = \\frac{1}{2}k r^2$. La forza associata, $\\vec{F} = -\\nabla U = -k\\vec{r}$, è la legge di Hooke, e sappiamo dalla meccanica che la forza elastica è conservativa. Questo esempio mostra come la struttura matematica che lega potenziale, campo e conservatività sia la stessa in diversi ambiti della fisica.</p>`
          }

        <ol>

          <li><strong>forma globale:</strong> $\\oint_\\gamma \\vec{E} \\cdot d\\vec{s} = 0$ per ogni linea chiusa $\\gamma$;</li>
          <li><strong>forma locale:</strong> $\\nabla \\times \\vec{E} = \\vec{0}$ in ogni punto delle regioni in cui $V$ è di classe $C^2$, dove la componente del rotore lungo $\\hat{n}$ è la circuitazione per unità di area di un circuito infinitesimo orientato secondo la regola della mano destra.</li>

        content: `<p>Calcoliamo la componente $x$ del rotore, valida per $r \\gt 0$:</p>
        <p>$$(\\nabla \\times \\vec{E})_x = \\frac{\\partial E_z}{\\partial y} - \\frac{\\partial E_y}{\\partial z}$$</p>
        <p>Serve una sola osservazione preliminare, da usare con la regola della catena: poiché $r = (x^2+y^2+z^2)^{1/2}$,</p>
        <p>$$\\frac{\\partial r}{\\partial y} = \\frac{y}{r}, \\qquad \\frac{\\partial r}{\\partial z} = \\frac{z}{r}$$</p>
        <p><strong>Primo termine.</strong> La funzione $E_z = K z \\, r^{-3}$ dipende da $y$ solo attraverso $r$, perché il fattore $z$ è costante rispetto a $y$:</p>
        <p>$$\\frac{\\partial E_z}{\\partial y} = K z \\, \\frac{\\partial}{\\partial y}\\!\\left( r^{-3} \\right) = K z \\left( -3 r^{-4} \\right) \\frac{y}{r} = -\\frac{3 K z y}{r^5}$$</p>
        <p><strong>Secondo termine.</strong> Analogamente, $E_y = K y \\, r^{-3}$ dipende da $z$ solo attraverso $r$:</p>
        <p>$$\\frac{\\partial E_y}{\\partial z} = K y \\left( -3 r^{-4} \\right) \\frac{z}{r} = -\\frac{3 K y z}{r^5}$$</p>
        <p>I due risultati sono <strong>identici</strong>, perché il prodotto $zy$ è commutativo e la dipendenza da $r$ è la stessa. Sottraendo:</p>
        <p>$$(\\nabla \\times \\vec{E})_x = -\\frac{3 K z y}{r^5} + \\frac{3 K y z}{r^5} = 0 \\qquad (r \\gt 0)$$</p>
        <p>Le componenti $y$ e $z$ si trattano allo stesso modo, scambiando i ruoli delle variabili: in ciascuna si ottiene la differenza di due termini uguali, che si cancellano. Quindi $\\nabla \\times \\vec{E} = \\vec{0}$ in tutto il dominio $r \\gt 0$.</p>
        <p><strong>Due avvertenze.</strong> La prima: la cancellazione richiede $r \\neq 0$, perché il fattore $r^{-5}$ non è definito nell'origine; il calcolo non dice nulla sul punto in cui si trova la carica. La seconda: il risultato non è una coincidenza algebrica, ma era prevedibile, perché questo campo deriva dal potenziale $V = K/r$, regolare per $r \\gt 0$, e quindi ricade nella proposizione dimostrata con il teorema di Schwarz.</p>`
      },
