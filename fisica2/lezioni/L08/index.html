<script>
const LESSON = {

    abstract: "Dal ripasso del cilindro carico al potenziale di sbarretta, disco e dipolo; poi filo e piano indefiniti, condensatore piano e la relazione differenziale fra campo e potenziale: gradiente, Laplaciano, equazioni di Poisson e Laplace.",

    sections: [
      {
        id: "s08-ripasso-cilindro",
        type: "section",
        title: "Ripasso: campo del cilindro carico",
        icon: "🛢️",
        content: `<p>Nella lezione precedente abbiamo analizzato il campo elettrostatico generato da un cilindro di raggio $R$ e altezza infinita, con densità di carica volumetrica uniforme $\\rho$. Riepiloghiamo i risultati principali ottenuti con il teorema di Gauss: il campo $\\vec{E}$ ha un andamento diverso all'interno e all'esterno del cilindro.</p>
        <p>Per $r \\gt R$ (all'esterno) il campo decresce con la distanza dall'asse come $1/r$:</p>
        <p>$$E(r) \\propto \\frac{1}{r}$$</p>
        <p>Per $r \\lt R$ (all'interno) il campo cresce linearmente con la distanza dall'asse:</p>
        <p>$$E(r) \\propto r$$</p>
        <p>Questo perché, costruendo una superficie Gaussiana cilindrica di raggio $r \\lt R$, la carica contenuta aumenta con il volume, cioè con $r^2$, mentre la superficie laterale del cilindro di Gauss aumenta con $r$. Il rapporto tra i due dà un campo che va come $r$.</p>`,
        subsections: [
          {
            subtitle: "Definizione: differenza di potenziale elettrostatico",
            content: `<p>Dati due punti $A$ e $B$, la differenza di potenziale fra essi è la circuitazione parziale del campo elettrostatico lungo un qualunque cammino che li congiunge:</p>
            <p>$$V(A) - V(B) = \\int_A^B \\vec{E} \\cdot d\\vec{l}$$</p>
            <p>L'integrale non dipende dal cammino scelto, perché il campo elettrostatico è conservativo. <strong>Si noti che la definizione fissa soltanto <em>differenze</em> di potenziale</strong>: il valore assoluto di $V$ richiede la scelta di un punto di riferimento.</p>`
          },
          {
            subtitle: "Potenziale all'esterno del cilindro ($r_1, r_2 \\gt R$)",
            content: `<p>Il campo elettrostatico all'esterno è $E(r) = \\dfrac{\\rho R^2}{2\\epsilon_0 r}$. Calcoliamo la differenza di potenziale tra due punti esterni:</p>
            <p>$$\\begin{align*} V(r_1) - V(r_2) &= \\int_{r_1}^{r_2} E(r)\\, dr = \\int_{r_1}^{r_2} \\frac{\\rho R^2}{2\\epsilon_0 r}\\, dr \\\\ &= \\frac{\\rho R^2}{2\\epsilon_0} \\int_{r_1}^{r_2} \\frac{1}{r}\\, dr = \\frac{\\rho R^2}{2\\epsilon_0} [\\ln r]_{r_1}^{r_2} \\\\ &= \\frac{\\rho R^2}{2\\epsilon_0} \\ln\\left(\\frac{r_2}{r_1}\\right) \\end{align*}$$</p>
            <p>Si osservi che il risultato dipende soltanto dal <em>rapporto</em> $r_2/r_1$, che è una quantità adimensionale: è la forma corretta in cui deve comparire un logaritmo in fisica. La primitiva $\\ln r$, presa da sola, non avrebbe significato dimensionale autonomo.</p>`
          },
          {
            subtitle: "Potenziale all'interno del cilindro ($r_1 \\lt R$)",
            content: `<p>All'interno il campo è $E(r) = \\dfrac{\\rho}{2\\epsilon_0} r$. Calcoliamo la differenza di potenziale tra un punto a distanza $r_1 \\lt R$ e un punto sulla superficie:</p>
            <p>$$\\begin{align*} V(r_1) - V(R) &= \\int_{r_1}^{R} E(r)\\, dr = \\int_{r_1}^{R} \\frac{\\rho}{2\\epsilon_0} r\\, dr \\\\ &= \\frac{\\rho}{2\\epsilon_0} \\left[ \\frac{r^2}{2} \\right]_{r_1}^{R} = \\frac{\\rho}{4\\epsilon_0} (R^2 - r_1^2) \\end{align*}$$</p>
            <p>Possiamo esprimere questo risultato in termini della densità di carica lineare $\\lambda = \\rho (\\pi R^2)$, da cui $\\rho = \\dfrac{\\lambda}{\\pi R^2}$:</p>
            <p>$$V(r_1) - V(R) = \\frac{\\lambda}{4\\pi\\epsilon_0 R^2} (R^2 - r_1^2)$$</p>`
          }
        ],
        formulas: [
          { label: "Differenza di potenziale (definizione)", latex: "V(A) - V(B) = \\int_A^B \\vec{E} \\cdot d\\vec{l}" },
          { label: "Cilindro, esterno", latex: "V(r_1) - V(r_2) = \\frac{\\rho R^2}{2\\epsilon_0} \\ln\\left(\\frac{r_2}{r_1}\\right)" },
          { label: "Cilindro, interno", latex: "V(r_1) - V(R) = \\frac{\\rho}{4\\epsilon_0} (R^2 - r_1^2)" }
        ]
      },
      {
        id: "s08-alert-infinito",
        type: "alert_box",
        title: "Potenziale all'infinito: non sempre si può porre $V(\\infty)=0$",
        icon: "⚠️",
        content: `<p>Per una distribuzione di carica infinita come un cilindro di altezza infinita, <strong>non è possibile porre il potenziale uguale a zero all'infinito</strong>. La dipendenza logaritmica del potenziale, infatti, diverge per $r \\to \\infty$. Questo è dovuto al fatto che la carica totale del sistema è infinita.</p>
        <p>Per il cilindro si può dunque parlare solo di <strong>differenze</strong> di potenziale, oppure fissare arbitrariamente $V=0$ a una distanza finita di riferimento.</p>`

        content: `<p>È istruttivo confrontare l'andamento del campo elettrico e del potenziale per diverse geometrie con simmetria sferica o cilindrica. Il confronto che segue è <strong>puramente qualitativo</strong>: i grafici sono tracciati in coordinate e grandezze normalizzate (numeri puri), con $R=2$ in unità arbitrarie, e le ampiezze dei vari andamenti sono state scelte soltanto per rendere le curve distinguibili a occhio.</p>

        <p>Le curve rappresentano il campo e il potenziale per un cilindro carico, una sfera carica volumetricamente e uno strato sferico carico superficialmente. Per il cilindro $V_{\\text{int}} = C + 2 - r^2/2$ e $V_{\\text{est}} = C - 4\\ln(r/2)$; per la sfera $V_{\\text{int}} = 4{,}5 - 0{,}375\\,r^2$ e $V_{\\text{est}} = 6/r$; per lo strato $V_{\\text{int}} = 4$ e $V_{\\text{est}} = 8/r$ (i coefficienti $4$, $6$, $8$ sono scelte di normalizzazione del disegno, non costanti fisiche). La curva del cilindro è definita a meno della costante additiva $C$ e scende sotto lo zero: per una distribuzione infinita non si può imporre $V(\\infty)=0$.</p>`,
        subsections: [
          {
            subtitle: "Continuità del raccordo in $r=R$",
            content: `<p>Per le distribuzioni volumetriche qui considerate (cilindro e sfera piena) il campo radiale è continuo attraverso la superficie $r=R$: di conseguenza anche la derivata del potenziale, $dV/dr = -E$, deve essere continua. Nei grafici le curve interne ed esterne si raccordano quindi <strong>senza spigoli</strong>: le pendenze coincidono in $r=R$.</p>
            <p>Fa eccezione lo strato sferico carico in superficie, per il quale $E$ salta da $0$ a $8/R^2$ (nelle unità normalizzate del disegno): il potenziale resta continuo (non ci sono salti di $V$) ma la sua derivata no, e il raccordo mostra effettivamente un punto angoloso.</p>
            <p><strong>Da ricordare:</strong> se in un vostro grafico comparisse uno spigolo dove il campo è continuo, il disegno sarebbe sbagliato.</p>`
          }
        ],
        quote: {
          text: "Ricordate una regola fondamentale: dove il campo elettrostatico è nullo, il potenziale è costante. Lo vediamo chiaramente nel caso dello strato sferico: per $r \\lt R$, il campo $\\vec{E}=0$ e il potenziale $V$ è costante. Non è necessariamente zero, ma è costante.",
          src: "Nota del Prof."
        }
      },
      {
        id: "s08-note-zero-potenziale",
        type: "note_box",
        title: "Scelta dello zero del potenziale per distribuzioni finite",
        icon: "📝",
        content: `<p>A differenza del cilindro infinito, la sbarretta, il disco e il dipolo che studieremo adesso sono distribuzioni di carica <strong>finite</strong>, confinate in una regione limitata dello spazio. Per esse il potenziale tende a zero all'infinito e la scelta naturale è $V(\\infty)=0$.</p>
        <p>Con questa convenzione il potenziale si ottiene semplicemente sommando (integrando) i contributi coulombiani $\\dfrac{1}{4\\pi\\epsilon_0}\\dfrac{dq}{s}$ delle cariche elementari, dove $s$ è la distanza dell'elemento $dq$ dal punto di osservazione. Useremo questa stessa scelta anche per il disco e per il dipolo.</p>`
      },
      {
        id: "s08-sbarretta-geometria",
        type: "section",
        title: "Potenziale di una sbarretta finita: geometria",
        icon: "📏",
        content: `<p>Consideriamo una sbarretta di lunghezza $2L$ disposta lungo l'asse $z$ da $-L$ a $+L$, con una densità di carica lineare uniforme $\\lambda$. Vogliamo calcolare il potenziale in un punto $P$ sull'asse mediano, a distanza $r$ dalla sbarretta.</p>

        <p>Il punto $P$ si trova sull'asse mediano, a distanza $r$ dalla sbarretta, e l'elemento di carica $dq=\\lambda\\,dz$ dista $\\sqrt{r^2+z^2}$ da $P$.</p>`
      },
      {
        id: "s08-es-sbarretta",
        type: "esercizio_svolto",
        title: "Esercizio svolto — Potenziale di una sbarretta carica di lunghezza finita",
        icon: "✎",
        source: "docente",
        content: `<p>Calcolare il potenziale generato nel punto $P$ dell'asse mediano, a distanza $r$, da una sbarretta di lunghezza $2L$ con densità lineare uniforme $\\lambda$, adottando la convenzione $V(\\infty)=0$. Discutere poi il limite $L \\gg r$ di filo infinito.</p>`,
        steps: [
          `Contributo dell'elemento $dz$ con carica $dq = \\lambda\\, dz$: $$dV = \\frac{1}{4\\pi\\epsilon_0} \\frac{dq}{\\sqrt{r^2+z^2}} = \\frac{\\lambda}{4\\pi\\epsilon_0} \\frac{dz}{\\sqrt{r^2+z^2}}$$ Il potenziale è una grandezza <strong>scalare</strong>: per ottenere il totale basta sommare algebricamente i contributi, senza preoccuparsi di componenti vettoriali.`,
          `Integriamo lungo tutta la sbarretta, da $-L$ a $+L$; sfruttando la simmetria, integriamo da $0$ a $L$ e moltiplichiamo per 2: $$\\begin{align*} V(r) &= \\int_{-L}^{L} \\frac{\\lambda}{4\\pi\\epsilon_0} \\frac{dz}{\\sqrt{r^2+z^2}} = 2 \\int_{0}^{L} \\frac{\\lambda}{4\\pi\\epsilon_0} \\frac{dz}{\\sqrt{r^2+z^2}} \\\\ &= \\frac{\\lambda}{2\\pi\\epsilon_0} \\left[ \\ln\\left(z + \\sqrt{r^2+z^2}\\right) \\right]_0^L \\\\ &= \\frac{\\lambda}{2\\pi\\epsilon_0} \\left( \\ln\\left(L + \\sqrt{r^2+L^2}\\right) - \\ln(r) \\right) \\\\ &= \\frac{\\lambda}{2\\pi\\epsilon_0} \\ln\\left( \\frac{L + \\sqrt{r^2+L^2}}{r} \\right) \\end{align*}$$`,
          `Nei passaggi intermedi compaiono logaritmi di lunghezze, che sono primitive formali: solo la loro <em>differenza</em> ha senso fisico, e infatti nel risultato finale l'argomento del logaritmo è il rapporto adimensionale $\\bigl(L+\\sqrt{r^2+L^2}\\bigr)/r$. Questo risultato è <strong>esatto</strong> per ogni $r \\gt 0$ e ogni $L$ finito.`,
          `<strong>Limite per filo infinito ($L \\gg r$).</strong> Se la sbarretta è molto lunga rispetto alla distanza $r$, approssimiamo $\\sqrt{r^2+L^2} \\approx L$: $$V(r) \\approx \\frac{\\lambda}{2\\pi\\epsilon_0} \\ln\\left( \\frac{2L}{r} \\right)$$ dove l'argomento è, di nuovo, un rapporto adimensionale fra due lunghezze.`,
          `Per separare la dipendenza da $r$ da quella da $L$ bisogna introdurre esplicitamente una <strong>lunghezza di riferimento ausiliaria</strong> $r_0$: $$\\ln\\left(\\frac{2L}{r}\\right) = -\\ln\\left(\\frac{r}{r_0}\\right) + \\ln\\left(\\frac{2L}{r_0}\\right)$$ da cui $$V(r) \\approx -\\frac{\\lambda}{2\\pi\\epsilon_0}\\ln\\left(\\frac{r}{r_0}\\right) + \\frac{\\lambda}{2\\pi\\epsilon_0}\\ln\\left(\\frac{2L}{r_0}\\right)$$`,
          `Si ritrova così la dipendenza logaritmica $-\\ln(r/r_0)$ attesa per un filo infinito, più un termine additivo costante in $r$, pari a $\\dfrac{\\lambda}{2\\pi\\epsilon_0}\\ln(2L/r_0)$, che dipende dalla lunghezza finita della sbarretta e che diverge per $L \\to \\infty$. <strong>Attenzione a non confondere due cose diverse:</strong> $r_0$ qui è solo la lunghezza ausiliaria introdotta per spezzare il logaritmo, <em>non</em> il punto in cui $V$ si annulla. Infatti con l'espressione scritta sopra $V(r_0) \\approx \\dfrac{\\lambda}{2\\pi\\epsilon_0}\\ln(2L/r_0) \\neq 0$. È solo sottraendo $V(r_0)$ che si ottiene il potenziale relativo $V(r)-V(r_0) \\approx -\\dfrac{\\lambda}{2\\pi\\epsilon_0}\\ln(r/r_0)$, che è l'espressione che sopravvive al limite $L\\to\\infty$.`,
          `È importante notare che né $\\ln(1/r)$ né $\\ln(2L)$, scritti senza riferimento, sarebbero espressioni fisicamente sensate: il contenuto fisico sta nei rapporti $r/r_0$ e $2L/r_0$. È la stessa patologia incontrata con il cilindro infinito: <strong>la scelta $V(\\infty)=0$, lecita per la sbarretta finita, non sopravvive al limite $L\\to\\infty$.</strong>`
        ]
      },
      {
        id: "s08-note-filo-gauss",
        type: "note_box",
        title: "Campo del filo infinito e coerenza con il potenziale",
        icon: "🔗",
        content: `<p>Per calcolare il campo elettrico di un filo infinito si può usare il teorema di Gauss con una superficie cilindrica coassiale al filo. Questo porta al noto risultato:</p>
        <p>$$E(r) = \\frac{\\lambda}{2\\pi\\epsilon_0 r}$$</p>
        <p>che è proprio $-\\dfrac{dV}{dr}$ calcolato a partire dall'espressione approssimata sopra: il termine $\\ln(2L/r_0)$, divergente ma <strong>costante in $r$</strong>, e la scelta stessa di $r_0$ non contribuiscono al campo, perché la derivata di una costante è nulla.</p>`
      },
      {
        id: "s08-disco-geometria",
        type: "section",
        title: "Potenziale di un disco carico: geometria e simboli",
        icon: "💿",
        content: `<p>Consideriamo un disco di raggio $R$ con densità di carica superficiale uniforme $\\sigma$. Calcoliamo il potenziale in un punto $P$ sull'asse del disco a distanza $x$. Anche qui la distribuzione è finita, quindi adottiamo la convenzione $V(\\infty)=0$ e sommiamo i contributi coulombiani degli elementi di carica.</p>
        <p>Conviene fissare con precisione la geometria e i simboli, perché nel calcolo compaiono <strong>tre lunghezze diverse</strong>: il raggio $R$ del disco (fisso), il raggio $r'$ dell'anello generico su cui integriamo (variabile da $0$ a $R$) e la coordinata assiale $x$ del punto di osservazione.</p>`,
        subsections: [
          {
            subtitle: "Definizione: coordinata assiale $x$",
            content: `<p>Scegliamo l'origine $O$ nel centro del disco e orientiamo l'asse perpendicolare al disco; $x$ è la coordinata <strong>orientata</strong> del punto $P$ su tale asse. Dunque $x \\gt 0$ per i punti da un lato del disco e $x \\lt 0$ per i punti dal lato opposto, mentre la distanza di $P$ dal centro è $|x|$. Questa distinzione è essenziale, perché nelle formule comparirà $|x|$ e non $x$.</p>`
          }
        ],

        <p>Il disco viene suddiviso in anelli concentrici di raggio $r'$ (con $0\\le r'\\le R$) e spessore infinitesimo $dr'$, di area $2\\pi r'\\,dr'$. Il punto di osservazione $P$ sta sull'asse, alla coordinata assiale orientata $x$; tutti i punti dell'anello evidenziato distano da $P$ la stessa quantità $\\sqrt{(r')^2+x^2}$, ed è per questo che <strong>l'integrazione angolare non è necessaria</strong>.</p>`

        content: `<p>Calcolare il potenziale $V(x)$ e la componente assiale del campo $E_x(x)$ sull'asse di un disco di raggio $R$ con densità superficiale uniforme $\\sigma$, con $V(\\infty)=0$. Verificare poi il limite di grande distanza.</p>`,
        steps: [
          `La strategia è suddividere il disco in anelli concentrici infinitesimi di raggio $r'$ e spessore $dr'$: tutti i punti di un anello distano $\\sqrt{(r')^2+x^2}$ dal punto $P$, quindi il loro contributo si somma senza ulteriori integrazioni angolari. La carica di un anello è $dq = \\sigma \\cdot (2\\pi r'\\, dr')$.`,
          `Potenziale generato dall'anello in $P$: $$dV = \\frac{1}{4\\pi\\epsilon_0} \\frac{dq}{\\sqrt{(r')^2+x^2}} = \\frac{\\sigma (2\\pi r'\\, dr')}{4\\pi\\epsilon_0 \\sqrt{(r')^2+x^2}}$$`,
          `Integriamo da $r'=0$ a $r'=R$: $$\\begin{align*} V(x) &= \\int_0^R \\frac{\\sigma r'}{2\\epsilon_0 \\sqrt{(r')^2+x^2}}\\, dr' \\\\ &= \\frac{\\sigma}{2\\epsilon_0} \\int_0^R ((r')^2+x^2)^{-1/2} r'\\, dr' \\\\ &= \\frac{\\sigma}{2\\epsilon_0} \\left[ \\sqrt{(r')^2+x^2} \\right]_0^R \\\\ &= \\frac{\\sigma}{2\\epsilon_0} \\left( \\sqrt{R^2+x^2} - \\sqrt{x^2} \\right) = \\frac{\\sigma}{2\\epsilon_0} \\left( \\sqrt{R^2+x^2} - |x| \\right) \\end{align*}$$`,
          `La comparsa di $|x|$ e non di $x$ è la traccia algebrica del fatto che $x$ è una coordinata orientata: <strong>il potenziale è simmetrico rispetto al piano del disco</strong>. Anche questo risultato è esatto, per ogni $x$ sull'asse.`,
          `<strong>Limite a grande distanza ($|x| \\gg R$).</strong> A grande distanza il disco deve apparire come una carica puntiforme $Q = \\sigma \\pi R^2$. Sviluppo di Taylor: $$\\sqrt{R^2+x^2} = |x|\\sqrt{1+\\left(\\frac{R}{x}\\right)^2} \\approx |x|\\left(1 + \\frac{1}{2}\\frac{R^2}{x^2}\\right)$$`,
          `Sostituendo: $$V(x) \\approx \\frac{\\sigma}{2\\epsilon_0} \\left( |x| + \\frac{R^2}{2|x|} - |x| \\right) = \\frac{\\sigma R^2}{4\\epsilon_0 |x|} = \\frac{Q}{4\\pi\\epsilon_0 |x|}$$ Il risultato è corretto: si tratta di un'<strong>approssimazione</strong> valida per $|x|\\gg R$, non di un'uguaglianza.`,
          `<strong>Campo elettrico sull'asse.</strong> Il campo si ottiene derivando il potenziale: $E_x = -\\dfrac{dV}{dx}$. Per $x \\gt 0$ si ha $|x|=x$ e quindi: $$\\begin{align*} E_x(x) &= -\\frac{d}{dx} \\left[ \\frac{\\sigma}{2\\epsilon_0} \\left( \\sqrt{R^2+x^2} - x \\right) \\right] \\\\ &= -\\frac{\\sigma}{2\\epsilon_0} \\left( \\frac{2x}{2\\sqrt{R^2+x^2}} - 1 \\right) \\\\ &= \\frac{\\sigma}{2\\epsilon_0} \\left( 1 - \\frac{x}{\\sqrt{R^2+x^2}} \\right) \\end{align*}$$ valida appunto per $x \\gt 0$ (per $x \\lt 0$ il campo ha lo stesso modulo e verso opposto, coerentemente con la simmetria del potenziale in $|x|$).`
        ]
      },
      {
        id: "s08-alert-due-limiti",
        type: "alert_box",
        title: "Due limiti da non confondere",
        icon: "⚠️",
        content: `<p>Poiché il calcolo del campo è stato fatto per $x \\gt 0$, il limite verso il centro del disco va preso in modo <strong>unilaterale</strong>:</p>
        <p>$$\\lim_{x\\to 0^+} E_x(x) = \\frac{\\sigma}{2\\epsilon_0}$$</p>
        <p>che è lo stesso valore del campo di un piano infinito carico, considerato sul lato positivo. Più in generale, per $0 \\lt x \\ll R$ il rapporto $x/\\sqrt{R^2+x^2}$ è trascurabile e il disco si comporta <em>come se</em> fosse un piano infinito: è un'<strong>approssimazione di piano</strong>, valida vicino al disco.</p>
        <p>Il piano infinito vero e proprio si ottiene invece con un limite geometrico diverso: $R\\to\\infty$ a $x$ fissato, nel qual caso $x/\\sqrt{R^2+x^2}\\to 0$ e il campo vale esattamente $\\sigma/(2\\epsilon_0)$ a ogni distanza.</p>
        <p><strong>I due limiti conducono allo stesso numero ma descrivono situazioni fisiche distinte:</strong> nel primo caso il disco resta finito e l'approssimazione decade non appena $x$ diventa confrontabile con $R$; nel secondo la distribuzione è davvero illimitata.</p>`
      },
      {
        id: "s08-dipolo-definizioni",
        type: "section",
        title: "Il dipolo elettrico: definizioni",
        icon: "🧲",
        content: `<p><strong>Dipolo elettrico.</strong> Un dipolo elettrico è un sistema composto da due cariche puntiformi di uguale modulo e segno opposto, $+q$ e $-q$, separate da una distanza $d$.</p>
        <p><strong>Momento di dipolo elettrico.</strong> Si definisce momento di dipolo elettrico il vettore</p>
        <p>$$\\vec{p} = q\\vec{d}$$</p>
        <p>dove $q \\gt 0$ è il modulo di ciascuna carica e $\\vec{d}$ è il vettore spostamento che va <strong>dalla carica negativa alla carica positiva</strong>. Il modulo è $p=qd$ e la direzione è quella dell'asse del dipolo, orientata dalla carica negativa verso quella positiva.</p>`,
        subsections: [
          {
            subtitle: "Definizione: angolo polare $\\theta$",
            content: `<p>In tutto questo calcolo $\\theta$ indica l'angolo compreso tra il <strong>semiasse $z$ positivo</strong> (cioè la direzione e il verso di $\\vec{p}$) e il vettore posizione $\\vec{r}$ del punto di osservazione. Con questa convenzione $\\theta=0$ individua i punti sopra la carica positiva, $\\theta=\\pi$ quelli sotto la carica negativa e $\\theta=\\pi/2$ i punti del piano equatoriale.</p>`
          }
        ],

        <p>L'angolo $\\theta$ è misurato <em>a partire dal semiasse $z$ positivo</em> (direzione di $\\vec{p}$) fino al vettore $\\vec{r}$: è questo l'angolo che compare nel teorema del coseno e nel prodotto scalare $\\vec{p}\\cdot\\hat{r}=p\\cos\\theta$.</p>`,

      {
        id: "s08-dipolo-potenziale",
        type: "section",
        title: "Potenziale generato da un dipolo a grande distanza",
        icon: "🌐",
        content: `<p>Vogliamo calcolare il potenziale in un punto $P$ molto distante dal dipolo ($r \\gg d$). Essendo la distribuzione finita, continuiamo ad adottare la convenzione $V(\\infty)=0$, sommando i due contributi coulombiani. Posizioniamo il dipolo sull'asse $z$ con il centro nell'origine: la carica $+q$ in $(0,0,d/2)$ e la carica $-q$ in $(0,0,-d/2)$. Il punto $P$ è individuato dal vettore posizione $\\vec{r}$.</p>
        <p>Il potenziale totale è la somma dei potenziali delle due cariche:</p>
        <p>$$V(P) = \\frac{1}{4\\pi\\epsilon_0} \\left( \\frac{q}{r_+} - \\frac{q}{r_-} \\right)$$</p>`,
        subsections: [
          {
            subtitle: "Distanze esatte dal teorema del coseno",
            content: `<p>Con $\\theta$ misurato dal semiasse $z$ positivo:</p>
            <p>$$\\begin{align*} r_+^2 &= r^2 + (d/2)^2 - 2r(d/2)\\cos\\theta = r^2 - rd\\cos\\theta + d^2/4 \\\\ r_-^2 &= r^2 + (d/2)^2 - 2r(d/2)\\cos(\\pi-\\theta) = r^2 + rd\\cos\\theta + d^2/4 \\end{align*}$$</p>
            <p>Queste due espressioni sono <strong>esatte</strong>.</p>`
          },
          {
            subtitle: "Approssimazione di dipolo ($r \\gg d$)",
            content: `<p>Nell'approssimazione di dipolo il termine $d^2/4$ è di ordine superiore rispetto a $rd$ e può essere trascurato:</p>
            <p>$$r_{\\pm} \\approx \\sqrt{r^2 \\mp rd\\cos\\theta} = r \\sqrt{1 \\mp \\frac{d}{r}\\cos\\theta}$$</p>
            <p>Sviluppando al primo ordine in $d/r$:</p>
            <p>$$\\frac{1}{r_{\\pm}} \\approx \\frac{1}{r} \\left(1 \\mp \\frac{d}{r}\\cos\\theta\\right)^{-1/2} \\approx \\frac{1}{r} \\left(1 \\pm \\frac{1}{2}\\frac{d}{r}\\cos\\theta\\right)$$</p>
            <p>Sostituendo nell'espressione del potenziale:</p>
            <p>$$\\begin{align*} V(P) &\\approx \\frac{q}{4\\pi\\epsilon_0} \\left[ \\frac{1}{r}\\left(1 + \\frac{d}{2r}\\cos\\theta\\right) - \\frac{1}{r}\\left(1 - \\frac{d}{2r}\\cos\\theta\\right) \\right] \\\\ &\\approx \\frac{q}{4\\pi\\epsilon_0 r} \\left[ 1 + \\frac{d}{2r}\\cos\\theta - 1 + \\frac{d}{2r}\\cos\\theta \\right] \\\\ &\\approx \\frac{q}{4\\pi\\epsilon_0 r} \\left( \\frac{d\\cos\\theta}{r} \\right) = \\frac{qd\\cos\\theta}{4\\pi\\epsilon_0 r^2} \\end{align*}$$</p>`
          },
          {
            subtitle: "Teorema: potenziale del dipolo a grande distanza",
            content: `<p>Sia dato un dipolo elettrico di momento $\\vec{p}=q\\vec{d}$, con centro nell'origine, e sia $\\hat{r}=\\dfrac{\\vec{r}}{r}$ il versore radiale del punto di osservazione $P$, con $r=|\\vec{r}|$. Con la convenzione $V(\\infty)=0$ e nell'approssimazione $r \\gg d$, il potenziale elettrostatico vale</p>
            <p>$$V(\\vec{r}) \\approx \\frac{p\\cos\\theta}{4\\pi\\epsilon_0 r^2} = \\frac{\\vec{p} \\cdot \\hat{r}}{4\\pi\\epsilon_0 r^2} = \\frac{\\vec{p} \\cdot \\vec{r}}{4\\pi\\epsilon_0 r^3} \\qquad (r \\gg d)$$</p>
            <p>dove $\\theta$ è l'angolo tra $\\vec{p}$ e $\\vec{r}$. <strong>Questo è il risultato centrale della sezione, ed è quello da ricordare.</strong></p>`
          }
        ],
        formulas: [
          { label: "Potenziale del dipolo ($r \\gg d$)", latex: "V(\\vec{r}) \\approx \\frac{\\vec{p} \\cdot \\hat{r}}{4\\pi\\epsilon_0 r^2} = \\frac{p\\cos\\theta}{4\\pi\\epsilon_0 r^2}" }
        ]
      },
      {
        id: "s08-alert-approssimazione-dipolo",
        type: "alert_box",
        title: "Il segno $\\approx$ è essenziale",
        icon: "⚠️",
        content: `<p>Il segno $\\approx$ nella formula del dipolo <strong>non va mai sostituito con un'uguaglianza</strong>: l'espressione non è il potenziale esatto di due cariche poste a distanza finita $d$, ma il primo termine non nullo del suo sviluppo a grande distanza.</p>
        <p>Le tre condizioni da ricordare insieme alla formula sono dunque:</p>
        <p>(i) lo zero del potenziale è posto all'infinito, $V(\\infty)=0$;<br>
        (ii) l'approssimazione richiede $r\\gg d$;<br>
        (iii) $\\hat{r}=\\vec{r}/r$ è il versore radiale, e $\\theta$ si misura a partire dalla direzione di $\\vec{p}$.</p>`
      },
      {
        id: "s08-dipolo-letture",
        type: "section",
        title: "Lettura del potenziale di dipolo: segno, angolo e numeri",
        icon: "🔍",
        content: `<p>A differenza di una carica singola il cui potenziale decresce come $1/r$, il potenziale di un dipolo decresce <strong>più rapidamente, come $1/r^2$</strong>. Questo perché, a grande distanza, gli effetti delle due cariche opposte tendono a cancellarsi: il termine di monopolo è nullo perché la carica totale $q+(-q)$ è zero, e sopravvive solo il termine di dipolo.</p>`,
        subsections: [
          {
            subtitle: "Lettura del segno e della dipendenza angolare",
            content: `<p>Fissiamo $q \\gt 0$, così che $\\vec{p}$ punti nel verso delle $z$ positive, e valutiamo $V \\approx \\dfrac{p\\cos\\theta}{4\\pi\\epsilon_0 r^2}$ in tre direzioni notevoli, a parità di distanza $r \\gg d$:</p>
            <p><strong>Semiasse $z$ positivo</strong> ($\\theta = 0$, $\\cos\\theta = 1$): $V \\approx \\dfrac{p}{4\\pi\\epsilon_0 r^2} \\gt 0$. Il punto è più vicino alla carica $+q$ che alla $-q$, quindi prevale il contributo positivo. Questo è anche il valore massimo del potenziale a quella distanza.</p>
            <p><strong>Semiasse $z$ negativo</strong> ($\\theta = \\pi$, $\\cos\\theta = -1$): $V \\approx -\\dfrac{p}{4\\pi\\epsilon_0 r^2} \\lt 0$. Qui domina la carica negativa, più vicina: il potenziale è l'opposto del caso precedente, come impone la simmetria del sistema.</p>
            <p><strong>Piano equatoriale</strong> ($\\theta = \\pi/2$, $\\cos\\theta = 0$): $V \\approx 0$. I punti di questo piano sono equidistanti dalle due cariche, $r_+ = r_-$, quindi i due contributi coulombiani si cancellano <em>esattamente</em>, non solo nell'approssimazione: il piano equatoriale è una superficie equipotenziale a potenziale nullo.</p>
            <p>Il fattore $\\cos\\theta$ codifica dunque la polarità del sistema: il potenziale è positivo nel semispazio dalla parte di $+q$, negativo dalla parte di $-q$, e cambia segno attraversando il piano equatoriale.</p>`
          },
          {
            subtitle: "Esempio illustrativo numerico",
            content: `<p>Consideriamo due cariche $q = 1{,}0\\,\\text{nC}$ separate da $d = 2{,}0\\,\\text{mm}$, così che</p>
            <p>$$p = qd = (1{,}0\\times 10^{-9}\\,\\text{C})(2{,}0\\times 10^{-3}\\,\\text{m}) = 2{,}0\\times10^{-12}\\,\\text{C}\\cdot\\text{m}$$</p>
            <p>Consideriamo il punto posto a $r = 10\\,\\text{cm} = 1{,}0\\times10^{-1}\\,\\text{m}$ sul semiasse positivo ($\\theta=0$), avendo verificato che $r/d = 50 \\gg 1$ giustifica l'approssimazione di dipolo. Con $\\dfrac{1}{4\\pi\\epsilon_0} = 8{,}99\\times10^{9}\\ \\text{N}\\cdot\\text{m}^2/\\text{C}^2$:</p>
            <p>$$\\begin{align*} V &\\approx \\frac{1}{4\\pi\\epsilon_0}\\frac{p}{r^2} = \\frac{(8{,}99\\times10^{9})\\,(2{,}0\\times10^{-12})}{(1{,}0\\times10^{-1})^2}\\ \\text{V} \\\\ &= \\frac{1{,}798\\times10^{-2}}{1{,}0\\times10^{-2}}\\ \\text{V} = 1{,}798\\ \\text{V} \\approx 1{,}8\\ \\text{V} \\end{align*}$$</p>
            <p>Nel punto simmetrico sul semiasse negativo ($\\theta=\\pi$) si ottiene $V \\approx -1{,}8\\ \\text{V}$, mentre a $10\\,\\text{cm}$ sul piano equatoriale ($\\theta=\\pi/2$) si ha $V \\approx 0$. Raddoppiando la distanza a $20\\,\\text{cm}$, il potenziale sull'asse si riduce di un fattore $4$ (e non di $2$ come per una carica puntiforme), scendendo a circa $1{,}798/4 \\approx 0{,}45\\ \\text{V}$.</p>`
          }
        ]
      },
      {
        id: "s08-note-segni",
        type: "note_box",
        title: "Convenzione sui segni: modulo contro componente orientata",
        icon: "±",
        content: `<p>Nel seguito le grandezze $\\lambda$ e $\\sigma$ denotano <strong>densità di carica con segno</strong>, che può dunque essere positivo o negativo. Per questo motivo distingueremo sempre:</p>
        <p>— il <strong>modulo</strong> del campo (quantità non negativa, che contiene $|\\lambda|$ oppure $|\\sigma|$);<br>
        — le sue <strong>componenti orientate</strong> rispetto agli assi scelti (quantità con segno).</p>
        <p>Confondere le due cose è uno degli errori più frequenti negli esercizi.</p>`
      },
      {
        id: "s08-filo-infinito",
        type: "section",
        title: "Campo e potenziale di un filo infinito",
        icon: "🧵",
        content: `<p>Consideriamo un filo rettilineo infinitamente esteso con una densità di carica lineare uniforme $\\lambda$.</p>
        <p>Come per il cilindro infinito, anche per un filo infinito <strong>non</strong> è possibile scegliere lo zero del potenziale all'infinito: l'integrale del campo da un punto fino all'infinito diverge (logaritmicamente), quindi la richiesta $V(\\infty) = 0$ è incompatibile con un potenziale finito a distanza finita.</p>
        <p>È invece perfettamente lecito, e in pratica necessario, <strong>fissare il riferimento a distanza finita</strong>: si scelga un raggio $r_0 \\gt 0$ e si ponga $V(r_0) = 0$. Il punto a distanza $r_0$ dal filo è allora un punto in cui il potenziale è nullo, pur essendovi un campo elettrico non nullo.</p>
        <blockquote><em>La presenza di un campo elettrico in un punto non impedisce al potenziale di essere nullo in quel punto</em>: il campo è legato alla <strong>derivata</strong> del potenziale, non al suo valore.</blockquote>
        <p>Resta vero che il potenziale è definito a meno di una costante additiva e che l'unica quantità dotata di significato fisico è la <em>differenza</em> di potenziale tra due punti: ciò che cambia rispetto alla carica puntiforme è solo che la costante non può essere fissata con la condizione all'infinito.</p>`,
        subsections: [
          {
            subtitle: "Calcolo del campo con il teorema di Gauss",
            content: `<p>Data la simmetria cilindrica, consideriamo una superficie gaussiana cilindrica di raggio $r$ e altezza $H$, coassiale con il filo.</p>
            <p>— Per simmetria, il campo $\\vec{E}$ deve essere radiale (uscente dal filo se $\\lambda \\gt 0$, entrante se $\\lambda \\lt 0$), e il suo modulo può dipendere solo dalla distanza radiale $r$.</p>
            <p>— Il flusso attraverso le due basi del cilindro è nullo, poiché $\\vec{E}$ è perpendicolare al vettore superficie $d\\vec{A}$ delle basi.</p>
            <p>— Il flusso è non nullo solo attraverso la superficie laterale, dove $\\vec{E}$ e $d\\vec{A}$ sono paralleli.</p>
            <p>Scrivendo $\\vec{E} = E_r(r)\\,\\hat{u}_r$ con $\\hat{u}_r$ versore radiale uscente ed $E_r$ componente radiale (con segno), il teorema di Gauss $\\Phi(\\vec{E}) = \\dfrac{Q_{\\text{int}}}{\\epsilon_0}$ dà:</p>
            <p>$$E_r \\cdot (2\\pi r H) = \\frac{\\lambda H}{\\epsilon_0}$$</p>
            <p>L'altezza $H$ si semplifica, come deve essere per un filo infinito:</p>
            <p>$$E_r(r) = \\frac{\\lambda}{2\\pi \\epsilon_0 r}, \\qquad |\\vec{E}(r)| = \\frac{|\\lambda|}{2\\pi \\epsilon_0 r}$$</p>
            <p>Si noti la differenza: $E_r$ ha il segno di $\\lambda$ (campo uscente per $\\lambda \\gt 0$, entrante per $\\lambda \\lt 0$), mentre il modulo è sempre positivo. Il campo decresce con la distanza come $1/r$.</p>`
          },
          {
            subtitle: "Indistinguibilità filo / cilindro",
            content: `<p>Dal punto di vista di un osservatore esterno, il campo elettrico generato da un filo infinito è <strong>identico</strong> a quello generato da un cilindro infinito con la stessa densità di carica lineare. Non è possibile distinguere le due distribuzioni di carica basandosi unicamente sulla misura del campo esterno.</p>`
          },
          {
            subtitle: "Calcolo della differenza di potenziale",
            content: `<p>Siano $A$ e $B$ due punti a distanza radiale $r_A \\gt 0$ e $r_B \\gt 0$ dal filo. Scegliendo un cammino radiale, $\\vec{E}\\cdot d\\vec{l} = E_r\\,dr$:</p>
            <p>$$\\begin{align*} V(A) - V(B) &= \\int_A^B \\vec{E} \\cdot d\\vec{l} = \\int_{r_A}^{r_B} \\frac{\\lambda}{2\\pi\\epsilon_0 r}\\,dr \\\\ &= \\frac{\\lambda}{2\\pi\\epsilon_0} \\big[\\ln r\\big]_{r_A}^{r_B} = \\frac{\\lambda}{2\\pi\\epsilon_0} \\ln\\!\\left(\\frac{r_B}{r_A}\\right) \\end{align*}$$</p>
            <p>ossia, nella forma equivalente richiesta più spesso negli esercizi:</p>
            <p>$$V(B) - V(A) = -\\frac{\\lambda}{2\\pi\\epsilon_0} \\int_{r_A}^{r_B} \\frac{dr}{r} = -\\frac{\\lambda}{2\\pi\\epsilon_0} \\ln\\!\\left(\\frac{r_B}{r_A}\\right), \\qquad r_A, r_B \\gt 0$$</p>
            <p>Il risultato dipende solo dal <em>rapporto</em> delle distanze, coerentemente con il fatto che il logaritmo di una lunghezza non è definito in modo assoluto.</p>
            <p>Fissando il riferimento a distanza finita ponendo $V(r_0) = 0$ per un certo $r_0 \\gt 0$ scelto a piacere, la funzione potenziale diventa:</p>
            <p>$$V(r) = -\\frac{\\lambda}{2\\pi\\epsilon_0} \\ln\\!\\left(\\frac{r}{r_0}\\right)$$</p>
            <p>Con questa scelta $V$ è nullo sul cilindro di raggio $r_0$, positivo per $r \\lt r_0$ e negativo per $r \\gt r_0$ (nel caso $\\lambda \\gt 0$). Facendo tendere $r \\to \\infty$ il potenziale diverge: da qui l'impossibilità di porre $V(\\infty) = 0$.</p>`
          }
        ],
        formulas: [
          { label: "Componente radiale (filo)", latex: "E_r(r) = \\frac{\\lambda}{2\\pi\\epsilon_0 r}" },

        extra_content: `<p><strong>Sintesi — filo indefinito.</strong> Nell'ipotesi di simmetria cilindrica esatta (filo infinito, nessun'altra carica nello spazio): componente radiale $E_r(r) = \\dfrac{\\lambda}{2\\pi\\epsilon_0 r}$ con $r \\gt 0$; modulo $|\\vec{E}(r)| = \\dfrac{|\\lambda|}{2\\pi\\epsilon_0 r}$; differenza di potenziale $V(A) - V(B) = \\dfrac{\\lambda}{2\\pi\\epsilon_0}\\ln\\!\\left(\\dfrac{r_B}{r_A}\\right)$; riferimento $V(r_0)=0$ con $r_0 \\gt 0$ finito, <strong>non</strong> si può porre $V(\\infty)=0$.</p>`
      },
      {
        id: "s08-piano-infinito",
        type: "section",
        title: "Campo e potenziale di un piano infinito",
        icon: "🟦",
        content: `<p>Consideriamo un piano indefinito con densità di carica superficiale uniforme $\\sigma$. Collochiamo il piano in $x = 0$, con l'asse $x$ perpendicolare ad esso. Sappiamo già che il campo generato è uniforme in ciascuno dei due semispazi e ha modulo:</p>
        <p>$$|\\vec{E}| = \\frac{|\\sigma|}{2\\epsilon_0}$$</p>
        <p>Il campo è diretto perpendicolarmente al piano, uscente se $\\sigma \\gt 0$ ed entrante se $\\sigma \\lt 0$. In termini di componente orientata lungo $x$:</p>
        <p>$$E_x(x) = \\frac{\\sigma}{2\\epsilon_0}\\,\\mathrm{sgn}(x) = \\begin{cases} +\\dfrac{\\sigma}{2\\epsilon_0} & x \\gt 0 \\\\[2mm] -\\dfrac{\\sigma}{2\\epsilon_0} & x \\lt 0 \\end{cases}$$</p>
        <p>cioè $\\vec{E} = +\\dfrac{\\sigma}{2\\epsilon_0}\\hat{\\imath}$ per $x \\gt 0$ e $\\vec{E} = -\\dfrac{\\sigma}{2\\epsilon_0}\\hat{\\imath}$ per $x \\lt 0$. <strong>Si noti che la componente $E_x$ cambia segno attraversando il piano</strong>: è questa discontinuità che va tenuta presente nel calcolo del potenziale.</p>`,
        subsections: [
          {
            subtitle: "Differenza di potenziale, caso $x_A, x_B \\gt 0$",
            content: `<p>Calcoliamo prima la differenza di potenziale tra due punti $A$ e $B$ <strong>entrambi nel semispazio positivo</strong>. In questo caso, e solo in questo caso, lungo tutto il cammino vale $E_x = +\\sigma/(2\\epsilon_0)$, costante:</p>
            <p>$$\\begin{align*} V(A) - V(B) &= \\int_A^B \\vec{E} \\cdot d\\vec{l} = \\int_{x_A}^{x_B} E_x\\, dx \\\\ &= \\int_{x_A}^{x_B} \\frac{\\sigma}{2\\epsilon_0}\\, dx = \\frac{\\sigma}{2\\epsilon_0} [x]_{x_A}^{x_B} \\\\ &= \\frac{\\sigma}{2\\epsilon_0} (x_B - x_A) \\qquad (x_A, x_B \\gt 0) \\end{align*}$$</p>`
          },
          {
            subtitle: "Formula generale con il valore assoluto",
            content: `<p>Se i due punti si trovano in semispazi diversi, oppure se vogliamo una formula valida in generale, bisogna tenere conto del cambio di segno di $E_x$. Poiché $\\dfrac{d}{dx}|x| = \\mathrm{sgn}(x)$, l'integrale si calcola in un colpo solo:</p>
            <p>$$V(A) - V(B) = \\int_{x_A}^{x_B} \\frac{\\sigma}{2\\epsilon_0}\\,\\mathrm{sgn}(x)\\, dx = \\frac{\\sigma}{2\\epsilon_0}\\big[\\,|x|\\,\\big]_{x_A}^{x_B} = \\frac{\\sigma}{2\\epsilon_0}\\big(|x_B| - |x_A|\\big)$$</p>
            <p>Questa è la formula generale: si riduce alla precedente quando $x_A, x_B \\gt 0$. <strong>Attenzione a leggerla correttamente:</strong> ciò che cambia segno attraversando il piano è la <em>componente del campo</em> $E_x$; il segno di $V(A)-V(B)$ dipende invece dalla differenza delle <strong>distanze assolute</strong> $|x_B|-|x_A|$ e dal segno di $\\sigma$. Riflettere uno dei due punti rispetto al piano, lasciandone invariata la distanza, non cambia il risultato: in particolare due punti simmetrici rispetto al piano ($x_B = -x_A$) hanno lo stesso potenziale, come deve essere per simmetria.</p>
            <p>Equivalentemente, scegliendo il riferimento $V(0) = 0$ <strong>sul piano stesso</strong>, si ottiene la funzione potenziale:</p>
            <p>$$V(x) = -\\frac{\\sigma}{2\\epsilon_0}\\,|x|$$</p>`
          },
          {
            subtitle: "Il riferimento per il piano indefinito",
            content: `<p>Anche qui l'impossibilità riguarda <strong>soltanto l'infinito</strong>: poiché $|V(x)| \\to \\infty$ per $|x| \\to \\infty$, non si può imporre $V(\\infty) = 0$. Nulla vieta invece di scegliere lo zero del potenziale a distanza finita, per esempio proprio sul piano, $V(0) = 0$: in tal caso tutti i punti del piano sono punti a potenziale nullo, pur essendovi campo non nullo a ridosso di essi.</p>
            <p>Dire che «non esiste un punto di potenziale nullo» sarebbe dunque <strong>sbagliato</strong>; la corretta affermazione è che <em>non si può fissare il riferimento all'infinito</em>.</p>`
          }
        ],
        formulas: [

          { label: "Componente orientata (piano)", latex: "E_x = \\frac{\\sigma}{2\\epsilon_0}\\,\\mathrm{sgn}(x)" },

          { label: "Potenziale con $V(0)=0$", latex: "V(x) = -\\frac{\\sigma}{2\\epsilon_0}|x|" }

      {

        title: "Il condensatore a piastre piane e parallele",
        icon: "🔋",
        content: `<p>Un sistema di grande importanza pratica è il condensatore a piastre piane e parallele, costituito da due piani infiniti paralleli, uno con densità di carica $+\\sigma$ e l'altro con $-\\sigma$. Nel seguito assumiamo $\\sigma \\gt 0$ per fissare le idee.</p>`,

          {
            subtitle: "Campo elettrico tra le armature",
            content: `<p>Analizziamo il campo nelle tre regioni di spazio definite dalle due piastre, applicando il principio di sovrapposizione.</p>
            <p><strong>Regione esterna:</strong> nello spazio esterno alle due piastre, i campi generati dalla piastra positiva ($\\vec{E}_+$) e da quella negativa ($\\vec{E}_-$) sono uguali in modulo ma opposti in verso. Pertanto si annullano a vicenda:</p>
            <p>$$\\vec{E}_{\\text{ext}} = \\vec{E}_+ + \\vec{E}_- = 0$$</p>
            <p><strong>Regione interna:</strong> nello spazio compreso tra le due piastre, i campi $\\vec{E}_+$ e $\\vec{E}_-$ hanno lo stesso verso (entrambi puntano dalla piastra positiva a quella negativa). I loro moduli si sommano:</p>
            <p>$$|\\vec{E}_{\\text{int}}| = |\\vec{E}_+| + |\\vec{E}_-| = \\frac{\\sigma}{2\\epsilon_0} + \\frac{\\sigma}{2\\epsilon_0} = \\frac{\\sigma}{\\epsilon_0}$$</p>
            <p>Il campo è dunque nullo all'esterno e uniforme, con modulo $|\\vec{E}| = \\sigma/\\epsilon_0$, all'interno.</p>`

            subtitle: "Differenza di potenziale fra le armature",
            content: `<p>Sia $d$ la distanza tra le due piastre. Poniamo l'asse $z$ perpendicolare alle piastre, con la piastra positiva in $z=0$ e quella negativa in $z=d$. Il campo interno punta nella direzione positiva dell'asse $z$, dunque $E_z = +\\sigma/\\epsilon_0$ per $0 \\lt z \\lt d$.</p>
            <p>$$\\begin{align*} V_+ - V_- &= V(0) - V(d) = \\int_0^d \\vec{E} \\cdot d\\vec{l} = \\int_0^d E_z\\, dz \\\\ &= \\int_0^d \\frac{\\sigma}{\\epsilon_0}\\, dz = \\frac{\\sigma}{\\epsilon_0} [z]_0^d = \\frac{\\sigma d}{\\epsilon_0} \\end{align*}$$</p>
            <p>Questa relazione fondamentale lega la differenza di potenziale $\\Delta V = V_+ - V_-$ alla densità di carica $\\sigma$ e alla distanza $d$. Si noti che $\\Delta V \\gt 0$ per $\\sigma \\gt 0$: la piastra positiva è, come atteso, a potenziale maggiore.</p>`

            <p>Il potenziale <strong>decresce linearmente</strong> dalla piastra positiva a quella negativa.</p>`

            subtitle: "Esempio illustrativo: valori numerici",

        icon: "🏃",
        content: `<p>Quanto al moto di una carica, conviene ragionare in termini di forza e accelerazione, che sono le grandezze direttamente determinate dal campo:</p>
        <p>$$\\vec{F} = q\\vec{E}, \\qquad \\vec{a} = \\frac{q\\vec{E}}{m}, \\qquad U = qV$$</p>
        <p>Su una carica $q \\gt 0$ posta tra le armature agisce una forza diretta come $\\vec{E}$, cioè verso la piastra negativa, verso i potenziali minori (dove la sua energia potenziale $U=qV$ è minore); su una carica $q \\lt 0$ la forza è opposta al campo, verso la piastra positiva.</p>
        <p>Se la carica è <strong>libera, inizialmente ferma e soggetta alla sola forza elettrica</strong>, allora essa si mette effettivamente in moto nel verso della forza: una carica positiva verso i potenziali minori, una negativa verso quelli maggiori.</p>

        id: "s08-gradiente",
        type: "section",
        title: "Relazione differenziale tra campo e potenziale: il gradiente",
        icon: "∇",
        content: `<p>La relazione integrale $V(A) - V(B) = \\displaystyle\\int_A^B \\vec{E} \\cdot d\\vec{l}$ può essere espressa in forma differenziale. Per uno spostamento infinitesimo $d\\vec{l}$, la variazione di potenziale è $dV = - \\vec{E} \\cdot d\\vec{l}$.</p>
        <p>Esplicitiamo questa relazione in coordinate cartesiane. Lo spostamento infinitesimo è $d\\vec{l} = dx\\,\\hat{\\imath} + dy\\,\\hat{\\jmath} + dz\\,\\hat{k}$, e il campo è $\\vec{E} = E_x\\,\\hat{\\imath} + E_y\\,\\hat{\\jmath} + E_z\\,\\hat{k}$. Il loro prodotto scalare è:</p>
        <p>$$\\vec{E} \\cdot d\\vec{l} = E_x dx + E_y dy + E_z dz$$</p>
        <p>D'altra parte, il potenziale $V$ è una funzione delle coordinate $V(x,y,z)$, e il suo differenziale totale è:</p>
        <p>$$dV = \\frac{\\partial V}{\\partial x} dx + \\frac{\\partial V}{\\partial y} dy + \\frac{\\partial V}{\\partial z} dz$$</p>
        <p>Confrontando $dV = - (E_x dx + E_y dy + E_z dz)$ con il differenziale totale, ed eguagliando i coefficienti di $dx$, $dy$ e $dz$, otteniamo le componenti del campo come derivate parziali del potenziale:</p>
        <p>$$\\begin{align*} E_x &= - \\frac{\\partial V}{\\partial x} \\\\ E_y &= - \\frac{\\partial V}{\\partial y} \\\\ E_z &= - \\frac{\\partial V}{\\partial z} \\end{align*}$$</p>`,
        subsections: [
          {
            subtitle: "Definizione: gradiente di un campo scalare",
            content: `<p>Questa relazione può essere scritta in modo compatto utilizzando l'operatore vettoriale <strong>gradiente</strong>, indicato con $\\nabla$ (nabla):</p>
            <p>$$\\vec{E} = - \\nabla V$$</p>
            <p>dove l'operatore gradiente in coordinate cartesiane è definito come:</p>
            <p>$$\\nabla = \\hat{\\imath} \\frac{\\partial}{\\partial x} + \\hat{\\jmath} \\frac{\\partial}{\\partial y} + \\hat{k} \\frac{\\partial}{\\partial z}$$</p>
            <p>così che, applicato a una funzione scalare $V(x,y,z)$:</p>
            <p>$$\\nabla V = \\frac{\\partial V}{\\partial x}\\hat{\\imath} + \\frac{\\partial V}{\\partial y}\\hat{\\jmath} + \\frac{\\partial V}{\\partial z}\\hat{k}$$</p>
            <p><strong>Il campo elettrostatico è l'opposto del gradiente del potenziale elettrostatico.</strong></p>`

            <p>$$V(x,y,z) = V_- + \\frac{\\sigma}{\\epsilon_0}(d - z)$$</p>

            <p>$$\\frac{\\partial V}{\\partial x} = 0, \\qquad \\frac{\\partial V}{\\partial y} = 0$$</p>
            <p>mentre, derivando rispetto a $z$ (ricordando che $V_-$, $\\sigma$, $\\epsilon_0$ e $d$ sono costanti):</p>
            <p>$$\\frac{\\partial V}{\\partial z} = \\frac{\\sigma}{\\epsilon_0}\\frac{\\partial}{\\partial z}(d-z) = -\\frac{\\sigma}{\\epsilon_0}$$</p>
            <p>Applicando $\\vec{E} = -\\nabla V$ componente per componente:</p>
            <p>$$E_x = -\\frac{\\partial V}{\\partial x} = 0, \\qquad E_y = -\\frac{\\partial V}{\\partial y} = 0, \\qquad E_z = -\\frac{\\partial V}{\\partial z} = +\\frac{\\sigma}{\\epsilon_0}$$</p>

      {
        id: "s08-gradiente-divergenza",
        type: "alert_box",
        title: "Gradiente e divergenza non sono operatori inversi",
        icon: "⚠️",
        content: `<p>È importante notare la natura differente degli operatori gradiente e divergenza.</p>
        <p>Il <strong>gradiente</strong> agisce su un campo <em>scalare</em> (il potenziale $V$) e restituisce un campo <em>vettoriale</em>; nel nostro caso $\\nabla V = -\\vec{E}$. Attenzione al segno: il gradiente del potenziale è l'<strong>opposto</strong> del campo, non il campo.</p>
        <p>La <strong>divergenza</strong> agisce su un campo <em>vettoriale</em> (il campo $\\vec{E}$) e restituisce uno <em>scalare</em>: $\\nabla \\cdot \\vec{E} = \\dfrac{\\rho}{\\epsilon_0}$, legato alla densità volumica di carica $\\rho$.</p>
        <p>In questo senso va intesa l'osservazione del professore secondo cui «gradiente e divergenza fanno cose opposte»: i due operatori <em>scambiano</em> il tipo di oggetto in ingresso con quello in uscita (scalare $\\to$ vettore nel primo caso, vettore $\\to$ scalare nel secondo).</p>
        <p>Questo scambio <strong>non</strong> significa in alcun modo che siano operatori l'uno inverso dell'altro: applicare la divergenza al gradiente non restituisce la funzione di partenza, ma un nuovo operatore, il Laplaciano.</p>`,

        content: `<p>Combinando la legge di Gauss in forma differenziale ($\\nabla \\cdot \\vec{E} = \\rho/\\epsilon_0$) con la relazione $\\vec{E} = -\\nabla V$, otteniamo:</p>

            subtitle: "Definizione: Laplaciano",
            content: `<p>L'operatore ottenuto applicando la divergenza al gradiente, $\\nabla \\cdot \\nabla \\equiv \\nabla^2$, è detto <strong>Laplaciano</strong>. Il simbolo $\\nabla^2$ non va letto come un quadrato ordinario: esso indica un operatore differenziale del secondo ordine che, in coordinate cartesiane, agisce su una funzione scalare $V(x,y,z)$ come</p>
            <p>$$\\nabla^2 V = \\nabla\\cdot(\\nabla V) = \\frac{\\partial^2 V}{\\partial x^2} + \\frac{\\partial^2 V}{\\partial y^2} + \\frac{\\partial^2 V}{\\partial z^2}$$</p>
            <p>Si ottiene infatti sostituendo nella definizione di divergenza le componenti del gradiente, $\\bigl(\\partial V/\\partial x,\\ \\partial V/\\partial y,\\ \\partial V/\\partial z\\bigr)$, e derivando ciascuna rispetto alla propria variabile. Il risultato è uno <strong>scalare</strong>.</p>`

            content: `<p>Con la definizione precedente, la relazione $-(\\nabla\\cdot\\nabla)V = \\rho/\\epsilon_0$ si riscrive nell'<strong>equazione di Poisson</strong>:</p>
            <p>$$\\nabla^2 V = - \\frac{\\rho}{\\epsilon_0} \\qquad\\text{ossia}\\qquad \\frac{\\partial^2 V}{\\partial x^2} + \\frac{\\partial^2 V}{\\partial y^2} + \\frac{\\partial^2 V}{\\partial z^2} = -\\frac{\\rho}{\\epsilon_0}$$</p>

      {
        id: "s08-ex-teoria1",
        type: "esercizio",
        title: "Teoria 1",
        kind: "teoria",
        source: "integrazione",
        content: `<p>Spiega perché per un cilindro indefinito uniformemente carico non si può porre $V(\\infty)=0$, mentre per una sbarretta di lunghezza finita $2L$ tale scelta è lecita. Mostra esplicitamente in quale termine del risultato della sbarretta si manifesta la patologia quando si prende il limite $L\\to\\infty$.</p>`,
        solution: `<p><strong>Cilindro indefinito.</strong> Il campo esterno è $E(r)=\\dfrac{\\rho R^2}{2\\epsilon_0 r}$, quindi</p>
        <p>$$V(r_1)-V(r_2)=\\frac{\\rho R^2}{2\\epsilon_0}\\ln\\frac{r_2}{r_1}$$</p>
        <p>Questa espressione diverge logaritmicamente per $r_2\\to\\infty$: non esiste un valore finito di $V$ all'infinito da porre uguale a zero, coerentemente col fatto che la carica totale della distribuzione è infinita. Si possono dunque dare solo differenze di potenziale, oppure fissare arbitrariamente $V=0$ a una distanza finita $r_0$. Se si sceglie $r_0 \\ge R$ (riferimento esterno al cilindro) la funzione potenziale per $r \\gt R$ è</p>
        <p>$$V(r)=-\\frac{\\rho R^2}{2\\epsilon_0}\\ln\\frac{r}{r_0} \\qquad (r_0 \\ge R)$$</p>
        <p>Se invece il riferimento è <strong>interno</strong> al cilindro ($r_0 \\lt R$), questa formula non vale: bisogna integrare separatamente il campo interno e quello esterno, scrivendo $V(r)=V(R)-\\dfrac{\\rho R^2}{2\\epsilon_0}\\ln\\dfrac{r}{R}$ per $r \\gt R$ e determinando $V(R)$ dalla formula interna $V(r_0)-V(R)=\\dfrac{\\rho}{4\\epsilon_0}(R^2-r_0^2)=0$.</p>
        <p><strong>Sbarretta finita, limite $r\\gg L$.</strong> Con $V(\\infty)=0$ il calcolo esatto dà $V(r)=\\dfrac{\\lambda}{2\\pi\\epsilon_0}\\ln\\dfrac{L+\\sqrt{r^2+L^2}}{r}$. Per $r\\gg L$ si ha $\\sqrt{r^2+L^2}\\approx r$, l'argomento tende a $1+\\dfrac{L}{r}$ e dunque</p>
        <p>$$\\begin{align*} V(r) &\\approx \\frac{\\lambda}{2\\pi\\epsilon_0}\\frac{L}{r} = \\frac{2\\lambda L}{4\\pi\\epsilon_0 r} = \\frac{Q}{4\\pi\\epsilon_0 r} \\to 0 \\end{align*}$$</p>
        <p>con $Q=2\\lambda L$ carica totale (finita): la distribuzione finita si comporta a grande distanza come una carica puntiforme e lo zero all'infinito è consistente.</p>
        <p><strong>Limite opposto $L\\gg r$ e patologia.</strong> Si trova</p>
        <p>$$\\begin{align*} V(r) &\\approx \\frac{\\lambda}{2\\pi\\epsilon_0}\\ln\\frac{2L}{r} \\\\ &= -\\frac{\\lambda}{2\\pi\\epsilon_0}\\ln\\frac{r}{r_0} + \\frac{\\lambda}{2\\pi\\epsilon_0}\\ln\\frac{2L}{r_0} \\end{align*}$$</p>
        <p>Il primo termine è la dipendenza logaritmica del filo indefinito; il secondo è costante in $r$ (e quindi non contribuisce a $E=-dV/dr$) ma <strong>diverge per $L\\to\\infty$</strong>. È proprio questo termine additivo divergente a impedire la scelta $V(\\infty)=0$ nel limite di distribuzione infinita. Si noti infine che il contenuto fisico sta sempre nei rapporti adimensionali $r/r_0$ e $2L/r_0$, mai in $\\ln r$ preso da solo.</p>`
      },
      {
        id: "s08-ex-teoria2",
        type: "esercizio",
        title: "Teoria 2",
        kind: "teoria",
        source: "integrazione",
        content: `<p>Spiega perché, per un filo rettilineo indefinito con densità lineare uniforme $\\lambda$, non è possibile imporre $V(\\infty)=0$, e ricava la funzione potenziale corrispondente alla scelta $V(r_0)=0$ con $r_0 \\gt 0$. Può il potenziale essere nullo in un punto in cui il campo elettrico non è nullo?</p>`,
        solution: `<p><strong>Campo.</strong> Dal teorema di Gauss su un cilindro coassiale di raggio $r$ e altezza $H$ si ottiene $E_r(2\\pi r H)=\\lambda H/\\epsilon_0$, cioè</p>
        <p>$$E_r(r)=\\frac{\\lambda}{2\\pi\\epsilon_0 r}, \\qquad |\\vec E|=\\frac{|\\lambda|}{2\\pi\\epsilon_0 r}$$</p>
        <p><strong>Potenziale.</strong> Lungo un cammino radiale $\\vec E\\cdot d\\vec l=E_r\\,dr$, quindi</p>
        <p>$$\\begin{align*} V(A)-V(B) &= \\int_{r_A}^{r_B}\\frac{\\lambda}{2\\pi\\epsilon_0 r}\\,dr = \\frac{\\lambda}{2\\pi\\epsilon_0}\\ln\\!\\left(\\frac{r_B}{r_A}\\right) \\end{align*}$$</p>
        <p>Se si manda $r_B\\to\\infty$ l'integrale $\\int^{\\infty}dr/r$ diverge logaritmicamente: la differenza di potenziale tra un punto a distanza finita e l'infinito è infinita, dunque la condizione $V(\\infty)=0$ è incompatibile con un potenziale finito a distanza finita.</p>
        <p><strong>Riferimento a distanza finita.</strong> Ponendo $V(r_0)=0$:</p>
        <p>$$V(r)=V(r)-V(r_0)=-\\frac{\\lambda}{2\\pi\\epsilon_0}\\ln\\!\\left(\\frac{r}{r_0}\\right)$$</p>
        <p>che per $\\lambda \\gt 0$ è positivo per $r \\lt r_0$, nullo per $r=r_0$ e negativo per $r \\gt r_0$.</p>
        <p><strong>Risposta all'ultima domanda: sì.</strong> Il potenziale può essere nullo dove il campo non lo è, perché il campo è legato alla <em>derivata</em> del potenziale ($\\vec E=-\\nabla V$) e non al suo valore; sul cilindro $r=r_0$ si ha $V=0$ ma $|\\vec E|=\\dfrac{|\\lambda|}{2\\pi\\epsilon_0 r_0}\\neq 0$. Il potenziale è comunque definito a meno di una costante additiva: solo le differenze hanno significato fisico.</p>`
      },
      {
        id: "s08-ex-teoria3",
        type: "esercizio",
        title: "Teoria 3",
        kind: "teoria",
        source: "integrazione",
        content: `<p>Dimostra che se la componente radiale del campo elettrostatico è continua attraverso la superficie $r=R$ allora il grafico di $V(r)$ non presenta punti angolosi in $r=R$, e verificalo per il cilindro pieno uniformemente carico. Discuti poi il caso dello strato sferico carico solo in superficie, dicendo cosa succede a $V$ e a $dV/dr$ e quale valore ha $V$ all'interno.</p>`,
        solution: `<p><strong>Dimostrazione generale.</strong> Per un campo radiale vale $E_r(r)=-\\dfrac{dV}{dr}$. Poiché $V(r_1)-V(r_2)=\\displaystyle\\int_{r_1}^{r_2}E_r\\,dr$ con $E_r$ limitato, $V$ è sempre continua (un campo finito non può produrre salti di potenziale). Se inoltre $E_r$ è continua in $r=R$:</p>
        <p>$$\\frac{dV}{dr}(R^-)=-E_r(R^-)=-E_r(R^+)=\\frac{dV}{dr}(R^+)$$</p>
        <p>Le due pendenze coincidono e il raccordo è liscio, senza spigoli.</p>
        <p><strong>Cilindro pieno.</strong> All'interno $E(r)=\\dfrac{\\rho r}{2\\epsilon_0}$, dunque $E(R^-)=\\dfrac{\\rho R}{2\\epsilon_0}$; all'esterno $E(r)=\\dfrac{\\rho R^2}{2\\epsilon_0 r}$, dunque</p>
        <p>$$E(R^+)=\\frac{\\rho R^2}{2\\epsilon_0 R}=\\frac{\\rho R}{2\\epsilon_0} = E(R^-)$$</p>
        <p>Il campo è continuo. Il potenziale vale</p>
        <p>$$\\begin{align*} V(r) &= V(R)+\\frac{\\rho}{4\\epsilon_0}(R^2-r^2) \\qquad (r \\lt R) \\\\ V(r) &= V(R)-\\frac{\\rho R^2}{2\\epsilon_0}\\ln\\frac{r}{R} \\qquad (r \\gt R) \\end{align*}$$</p>
        <p>e ha in $r=R$ la stessa derivata $-\\dfrac{\\rho R}{2\\epsilon_0}$ da entrambi i lati: parabola con vertice sull'asse raccordata al logaritmo senza spigolo.</p>
        <p><strong>Strato sferico.</strong> Con carica $Q$ distribuita sulla superficie di raggio $R$, per Gauss $E=0$ per $r \\lt R$ e $E(r)=\\dfrac{Q}{4\\pi\\epsilon_0 r^2}$ per $r \\gt R$: il campo <strong>salta</strong> da $0$ a $\\dfrac{Q}{4\\pi\\epsilon_0R^2}$. Il potenziale resta continuo, ma la sua derivata no: il grafico di $V$ mostra un <strong>punto angoloso</strong> in $r=R$ (tratto orizzontale all'interno, raccordato a una curva di pendenza non nulla all'esterno).</p>
        <p>All'interno, essendo $E=0$, si ha $dV/dr=0$ e quindi $V$ costante; la costante è fissata dalla continuità in $r=R$:</p>
        <p>$$V=\\frac{Q}{4\\pi\\epsilon_0 R} \\qquad (r \\le R, \\text{ con } V(\\infty)=0)$$</p>
        <p>Dove il campo è nullo il potenziale è costante, <strong>non necessariamente nullo</strong>.</p>`
      },
      {
        id: "s08-ex-teoria4",
        type: "esercizio",
        title: "Teoria 4",
        kind: "teoria",
        source: "integrazione",
        content: `<p>Partendo dalla relazione integrale $V(A)-V(B)=\\int_A^B \\vec E\\cdot d\\vec l$, ricava in coordinate cartesiane la relazione differenziale $\\vec E=-\\nabla V$. Spiega poi la differenza di natura tra gradiente e divergenza e perché non sono operatori l'uno inverso dell'altro, introducendo il Laplaciano e le equazioni di Poisson e di Laplace.</p>`,
        solution: `<p><strong>Derivazione.</strong> Per uno spostamento infinitesimo la relazione integrale dà $dV=-\\vec E\\cdot d\\vec l$. Con $d\\vec l=dx\\,\\hat\\imath+dy\\,\\hat\\jmath+dz\\,\\hat k$ e $\\vec E=E_x\\hat\\imath+E_y\\hat\\jmath+E_z\\hat k$:</p>
        <p>$$\\begin{align*} \\vec E\\cdot d\\vec l &= E_x\\,dx+E_y\\,dy+E_z\\,dz \\\\ dV &= \\frac{\\partial V}{\\partial x}dx+\\frac{\\partial V}{\\partial y}dy+\\frac{\\partial V}{\\partial z}dz \\end{align*}$$</p>
        <p>Poiché $dx,dy,dz$ sono arbitrari e indipendenti, uguagliando i coefficienti si ottiene</p>
        <p>$$E_x=-\\frac{\\partial V}{\\partial x}, \\qquad E_y=-\\frac{\\partial V}{\\partial y}, \\qquad E_z=-\\frac{\\partial V}{\\partial z}$$</p>
        <p>ossia $\\vec E=-\\nabla V$ con $\\nabla=\\hat\\imath\\,\\partial_x+\\hat\\jmath\\,\\partial_y+\\hat k\\,\\partial_z$.</p>
        <p><strong>Natura dei due operatori.</strong> Il gradiente agisce su un campo scalare e restituisce un campo vettoriale ($V\\mapsto \\nabla V=-\\vec E$); la divergenza agisce su un campo vettoriale e restituisce uno scalare ($\\vec E\\mapsto \\nabla\\cdot\\vec E=\\rho/\\epsilon_0$). I due operatori <em>scambiano</em> il tipo di oggetto in ingresso con quello in uscita, ma questo non li rende inversi.</p>
        <p><strong>Laplaciano.</strong> Applicando la divergenza al gradiente non si riottiene $V$, bensì un nuovo operatore del secondo ordine:</p>
        <p>$$\\nabla^2V=\\nabla\\cdot(\\nabla V)=\\frac{\\partial^2V}{\\partial x^2}+\\frac{\\partial^2V}{\\partial y^2}+\\frac{\\partial^2V}{\\partial z^2}$$</p>
        <p>il cui risultato è uno scalare.</p>
        <p><strong>Poisson e Laplace.</strong> Sostituendo $\\vec E=-\\nabla V$ in $\\nabla\\cdot\\vec E=\\rho/\\epsilon_0$:</p>
        <p>$$\\nabla^2V=-\\frac{\\rho}{\\epsilon_0} \\qquad\\text{(Poisson)}$$</p>
        <p>che nelle regioni prive di carica ($\\rho=0$) diventa</p>
        <p>$$\\nabla^2V=0 \\qquad\\text{(Laplace)}$$</p>
        <p>Esse costituiscono la formulazione locale dell'elettrostatica, equivalente al teorema di Gauss in forma integrale, e determinano $V$ (e quindi $\\vec E=-\\nabla V$) assegnate le sorgenti e le condizioni al contorno.</p>`
      },
      {
        id: "s08-ex-scritto1",
        type: "esercizio",
        title: "Scritto 1",
        kind: "scritto",
        source: "integrazione",
        content: `<p>Un cilindro indefinito di raggio $R=5{,}0\\ \\text{cm}$ è carico con densità volumetrica uniforme $\\rho=1{,}0\\times10^{-6}\\ \\text{C/m}^3$. Usando $\\epsilon_0=8{,}85\\times10^{-12}\\ \\text{C}^2/(\\text{N}\\cdot\\text{m}^2)$:</p>
        <p>(a) calcola $V(R)-V(3R)$;<br>
        (b) calcola $V(0)-V(R)$;<br>
        (c) di' se è possibile porre $V=0$ all'infinito e, in caso negativo, come si fissa lo zero del potenziale.</p>`,
        solution: `<p><strong>(a)</strong> Per $r \\gt R$ il teorema di Gauss su un cilindro coassiale di raggio $r$ e altezza $h$ dà $E\\,2\\pi r h=\\dfrac{\\rho\\pi R^2h}{\\epsilon_0}$, cioè $E(r)=\\dfrac{\\rho R^2}{2\\epsilon_0 r}$. Allora</p>
        <p>$$\\begin{align*} V(R)-V(3R) &= \\int_R^{3R}E\\,dr = \\frac{\\rho R^2}{2\\epsilon_0}\\ln\\frac{3R}{R} = \\frac{\\rho R^2}{2\\epsilon_0}\\ln 3 \\end{align*}$$</p>
        <p>Numericamente</p>
        <p>$$\\begin{align*} \\frac{\\rho R^2}{2\\epsilon_0} &= \\frac{(1{,}0\\times10^{-6})(2{,}5\\times10^{-3})}{2(8{,}85\\times10^{-12})} = 1{,}41\\times10^{2}\\ \\text{V} \\\\ V(R)-V(3R) &= 1{,}41\\times10^{2}\\times1{,}0986 \\approx 1{,}6\\times10^{2}\\ \\text{V} \\end{align*}$$</p>
        <p>positiva: il potenziale decresce allontanandosi, come deve essere per carica positiva.</p>
        <p><strong>(b)</strong> Per $r \\lt R$ la carica interna è $\\rho\\pi r^2h$ e si ottiene $E(r)=\\dfrac{\\rho r}{2\\epsilon_0}$, quindi</p>
        <p>$$\\begin{align*} V(0)-V(R) &= \\int_0^{R}\\frac{\\rho r}{2\\epsilon_0}dr = \\frac{\\rho R^2}{4\\epsilon_0} = \\frac{1}{2}\\left(\\frac{\\rho R^2}{2\\epsilon_0}\\right) \\approx 71\\ \\text{V} \\end{align*}$$</p>
        <p>In generale $V(r)-V(R)=\\dfrac{\\rho}{4\\epsilon_0}(R^2-r^2)$ per $r \\lt R$.</p>
        <p><strong>(c)</strong> No, non è possibile: la distribuzione è infinita e</p>
        <p>$$V(R)-V(r)=+\\frac{\\rho R^2}{2\\epsilon_0}\\ln\\frac{r}{R}$$</p>
        <p>diverge per $r\\to\\infty$. (Il segno è positivo, coerentemente con il punto (a): per carica positiva e $r \\gt R$ il potenziale sulla superficie è maggiore di quello lontano.) Si possono dare solo differenze di potenziale, oppure scegliere arbitrariamente una distanza finita $r_0$ dove porre $V=0$. Se $r_0 \\ge R$ si scrive</p>
        <p>$$V(r)=-\\frac{\\rho R^2}{2\\epsilon_0}\\ln\\frac{r}{r_0} \\qquad (r \\gt R,\\ r_0 \\ge R)$$</p>
        <p>Se invece il riferimento è interno al cilindro ($r_0 \\lt R$) occorre integrare separatamente campo interno ed esterno: $V(r)=V(R)-\\dfrac{\\rho R^2}{2\\epsilon_0}\\ln\\dfrac{r}{R}$ per $r \\gt R$, con $V(R)$ determinato dalla formula interna. In ogni caso l'argomento del logaritmo è sempre un rapporto adimensionale.</p>`
      },
      {
        id: "s08-ex-scritto2",
        type: "esercizio",
        title: "Scritto 2",
        kind: "scritto",
        source: "integrazione",
        content: `<p>Un filo rettilineo indefinito ha densità lineare uniforme $\\lambda=2{,}0\\times10^{-8}\\ \\mathrm{C/m}$. Calcola:</p>
        <p>(a) il modulo del campo elettrico a distanza $r_A=5{,}0\\ \\mathrm{cm}$ dal filo;<br>
        (b) la differenza di potenziale $V(A)-V(B)$ fra il punto $A$ e un punto $B$ a distanza $r_B=20{,}0\\ \\mathrm{cm}$;<br>
        (c) la distanza $r_C$ di un punto $C$ tale che $V(A)-V(C)=1{,}0\\times10^{3}\\ \\mathrm{V}$.</p>
        <p>Usa $\\epsilon_0=8{,}85\\times10^{-12}\\ \\mathrm{C^2/(N\\,m^2)}$.</p>`,
        solution: `<p><strong>(a)</strong> $|\\vec E(r)|=\\dfrac{|\\lambda|}{2\\pi\\epsilon_0 r}$. Con $2\\pi\\epsilon_0=5{,}56\\times10^{-11}$:</p>
        <p>$$|\\vec E(r_A)|=\\frac{2{,}0\\times10^{-8}}{5{,}56\\times10^{-11}\\cdot 5{,}0\\times10^{-2}}\\approx 7{,}2\\times10^{3}\\ \\mathrm{V/m}$$</p>
        <p>diretto radialmente verso l'esterno ($\\lambda \\gt 0$).</p>
        <p><strong>(b)</strong> $V(A)-V(B)=\\dfrac{\\lambda}{2\\pi\\epsilon_0}\\ln\\!\\left(\\dfrac{r_B}{r_A}\\right)$. Il fattore vale</p>
        <p>$$\\frac{\\lambda}{2\\pi\\epsilon_0}=\\frac{2{,}0\\times10^{-8}}{5{,}56\\times10^{-11}}\\approx 3{,}6\\times10^{2}\\ \\mathrm{V}$$</p>
        <p>e $\\ln(20{,}0/5{,}0)=\\ln 4\\approx 1{,}386$, quindi</p>
        <p>$$V(A)-V(B)\\approx 3{,}6\\times10^{2}\\cdot 1{,}386\\approx 5{,}0\\times10^{2}\\ \\mathrm{V}$$</p>
        <p>Il segno positivo è corretto: per $\\lambda \\gt 0$ il potenziale decresce allontanandosi dal filo.</p>
        <p><strong>(c)</strong> Da $V(A)-V(C)=\\dfrac{\\lambda}{2\\pi\\epsilon_0}\\ln\\!\\left(\\dfrac{r_C}{r_A}\\right)$ segue</p>
        <p>$$\\begin{align*} \\ln\\!\\left(\\frac{r_C}{r_A}\\right) &= \\frac{1{,}0\\times10^{3}}{3{,}60\\times10^{2}}\\approx 2{,}78 \\\\ r_C &= r_A e^{2{,}78}\\approx 5{,}0\\times10^{-2}\\cdot 16{,}1\\approx 0{,}81\\ \\mathrm{m} \\end{align*}$$</p>
        <p>Si noti che il risultato dipende solo dal rapporto delle distanze, coerentemente con l'impossibilità di fissare il riferimento all'infinito.</p>`
      },
      {
        id: "s08-ex-scritto3",
        type: "esercizio",
        title: "Scritto 3",
        kind: "scritto",
        source: "integrazione",
        content: `<p>Un disco di raggio $R=10\\ \\text{cm}$ porta densità superficiale uniforme $\\sigma=1{,}0\\times10^{-6}\\ \\text{C/m}^2$; si assuma $V(\\infty)=0$ e $\\dfrac{1}{4\\pi\\epsilon_0}=8{,}99\\times10^{9}\\ \\text{N}\\cdot\\text{m}^2/\\text{C}^2$.</p>
        <p>(a) Ricava $V(x)$ ed $E_x(x)$ sull'asse per $x \\gt 0$ e calcolane i valori in $x=5{,}0\\ \\text{cm}$.<br>
        (b) Confronta $E_x$ con il campo di un piano indefinito di pari $\\sigma$ e commenta la validità dell'approssimazione di piano.<br>
        (c) Verifica in $x=1{,}0\\ \\text{m}$ che il disco si comporta come una carica puntiforme.</p>`,
        solution: `<p><strong>(a)</strong> Suddividendo il disco in anelli di raggio $r'$ e spessore $dr'$, di carica $dq=\\sigma\\,2\\pi r'\\,dr'$ e tutti i cui punti distano $\\sqrt{(r')^2+x^2}$ da $P$:</p>
        <p>$$\\begin{align*} dV &= \\frac{\\sigma\\,2\\pi r'\\,dr'}{4\\pi\\epsilon_0\\sqrt{(r')^2+x^2}} \\\\ V(x) &= \\frac{\\sigma}{2\\epsilon_0}\\int_0^R\\frac{r'\\,dr'}{\\sqrt{(r')^2+x^2}} = \\frac{\\sigma}{2\\epsilon_0}\\left(\\sqrt{R^2+x^2}-|x|\\right) \\end{align*}$$</p>
        <p>Per $x \\gt 0$:</p>
        <p>$$E_x=-\\frac{dV}{dx}=\\frac{\\sigma}{2\\epsilon_0}\\left(1-\\frac{x}{\\sqrt{R^2+x^2}}\\right)$$</p>
        <p>Con $\\dfrac{\\sigma}{2\\epsilon_0}=\\dfrac{1{,}0\\times10^{-6}}{2(8{,}85\\times10^{-12})}=5{,}65\\times10^{4}\\ \\text{V/m}$ e $\\sqrt{R^2+x^2}=\\sqrt{0{,}0100+0{,}0025}=0{,}1118\\ \\text{m}$:</p>
        <p>$$\\begin{align*} V &= 5{,}65\\times10^{4}\\,(0{,}1118-0{,}0500)\\approx 3{,}5\\times10^{3}\\ \\text{V} \\\\ E_x &= 5{,}65\\times10^{4}\\left(1-\\frac{0{,}050}{0{,}1118}\\right) = 5{,}65\\times10^{4}(1-0{,}447) \\approx 3{,}1\\times10^{4}\\ \\text{V/m} \\end{align*}$$</p>
        <p><strong>(b)</strong> Il piano indefinito dà $E_{\\text{piano}}=\\dfrac{\\sigma}{2\\epsilon_0}=5{,}65\\times10^{4}\\ \\text{V/m}$: a $x=R/2$ il disco fornisce solo il $55\\%$ di tale valore, quindi l'approssimazione di piano <strong>non è buona</strong>. Essa vale per $0 \\lt x \\ll R$, dove $x/\\sqrt{R^2+x^2}\\to 0$ e $E_x\\to\\dfrac{\\sigma}{2\\epsilon_0}$ (il limite $x\\to0^+$ riproduce esattamente il valore del piano, sul lato positivo); è invece un'approssimazione, non un'uguaglianza, appena $x$ diventa confrontabile con $R$. Il piano vero si ottiene con il limite diverso $R\\to\\infty$ a $x$ fissato.</p>
        <p><strong>(c)</strong> La carica totale è</p>
        <p>$$Q=\\sigma\\pi R^2=(1{,}0\\times10^{-6})\\pi(0{,}10)^2=3{,}14\\times10^{-8}\\ \\text{C}$$</p>
        <p>La formula di carica puntiforme dà</p>
        <p>$$V\\approx\\frac{Q}{4\\pi\\epsilon_0 x}=\\frac{(8{,}99\\times10^{9})(3{,}14\\times10^{-8})}{1{,}0}\\approx 2{,}8\\times10^{2}\\ \\text{V}$$</p>
        <p>Il valore esatto è</p>
        <p>$$V=5{,}65\\times10^{4}\\left(\\sqrt{1{,}01}-1\\right)=5{,}65\\times10^{4}(4{,}99\\times10^{-3})\\approx 2{,}8\\times10^{2}\\ \\text{V}$$</p>
        <p>I due risultati coincidono entro lo $0{,}5\\%$, come atteso per $|x|\\gg R$: lo sviluppo $\\sqrt{R^2+x^2}\\approx|x|+\\dfrac{R^2}{2|x|}$ dà infatti $V\\approx\\dfrac{\\sigma R^2}{4\\epsilon_0|x|}=\\dfrac{Q}{4\\pi\\epsilon_0|x|}$.</p>`
      },
      {
        id: "s08-ex-scritto4",
        type: "esercizio",
        title: "Scritto 4",
        kind: "scritto",
        source: "integrazione",
        content: `<p>Un condensatore a piastre piane e parallele, con armature di estensione molto maggiore della loro distanza $d=1{,}0\\ \\mathrm{mm}$, è mantenuto a una differenza di potenziale $\\Delta V=V_+-V_-=100\\ \\mathrm{V}$. Poniamo l'asse $z$ perpendicolare alle armature, con la piastra positiva in $z=0$ e quella negativa in $z=d$. Determina:</p>
        <p>(a) il modulo e il verso del campo fra le armature e la densità superficiale $\\sigma$;<br>
        (b) il potenziale $V(z)$ con la scelta $V_-=0$ e il suo valore a metà fra le piastre;<br>
        (c) la velocità con cui un elettrone, inizialmente fermo sull'armatura negativa e soggetto alla sola forza elettrica, raggiunge l'altra armatura.</p>
        <p>Usa $\\epsilon_0=8{,}85\\times10^{-12}\\ \\mathrm{C^2/(N\\,m^2)}$, $e=1{,}60\\times10^{-19}\\ \\mathrm{C}$, $m_e=9{,}11\\times10^{-31}\\ \\mathrm{kg}$.</p>`,
        solution: `<p><strong>(a)</strong> Fra le armature il campo è uniforme e $\\Delta V=E\\,d$, quindi</p>
        <p>$$E=\\frac{\\Delta V}{d}=\\frac{100}{1{,}0\\times10^{-3}}=1{,}0\\times10^{5}\\ \\mathrm{V/m}$$</p>
        <p>diretto dalla piastra positiva a quella negativa, cioè $E_z=+1{,}0\\times10^{5}\\ \\mathrm{V/m}$. Poiché $E=\\dfrac{\\sigma}{\\epsilon_0}$:</p>
        <p>$$\\sigma=\\epsilon_0E=8{,}85\\times10^{-12}\\cdot 1{,}0\\times10^{5}\\approx 8{,}9\\times10^{-7}\\ \\mathrm{C/m^2}$$</p>
        <p>All'esterno il campo è nullo.</p>
        <p><strong>(b)</strong> $V(z)=V_-+\\dfrac{\\sigma}{\\epsilon_0}(d-z)=1{,}0\\times10^{5}\\,(1{,}0\\times10^{-3}-z)$ volt, lineare e decrescente in $z$: $V(0)=100\\ \\mathrm{V}=V_+$ e $V(d)=0$. A metà, $V(d/2)=50\\ \\mathrm{V}$.</p>
        <p>Verifica col gradiente: $E_z=-\\dfrac{dV}{dz}=+\\dfrac{\\sigma}{\\epsilon_0}=1{,}0\\times10^{5}\\ \\mathrm{V/m}$, in accordo con (a).</p>
        <p><strong>(c)</strong> L'elettrone ha carica $q=-e \\lt 0$: la forza $\\vec F=q\\vec E$ è opposta al campo, cioè diretta verso la piastra positiva (verso i potenziali maggiori), quindi partendo fermo da $z=d$ si mette in moto verso $z=0$. Conservazione dell'energia con $U=qV$:</p>
        <p>$$\\begin{align*} \\frac12 m_ev^2 &= U_i-U_f=(-e)V(d)-(-e)V(0)=e\\,\\Delta V \\\\ &= 1{,}60\\times10^{-19}\\cdot100=1{,}60\\times10^{-17}\\ \\mathrm{J} \\end{align*}$$</p>
        <p>Dunque</p>
        <p>$$v=\\sqrt{\\frac{2e\\Delta V}{m_e}}=\\sqrt{\\frac{2\\cdot1{,}60\\times10^{-17}}{9{,}11\\times10^{-31}}}\\approx\\sqrt{3{,}51\\times10^{13}}\\approx 5{,}9\\times10^{6}\\ \\mathrm{m/s}$$</p>
        <p>Equivalentemente $a=eE/m_e\\approx1{,}8\\times10^{16}\\ \\mathrm{m/s^2}$ e $v=\\sqrt{2ad}$.</p>`
      }
    ],
