8\" y=\"97.864893\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#fisica2_lez13a_d1-glyph2-1\" x=\"35.502851\" y=\"99.351899\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#fisica2_lez13a_d1-glyph4-2\" x=\"44.893369\" y=\"97.864893\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#fisica2_lez13a_d1-glyph1-1\" x=\"49.847735\" y=\"97.864893\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#fisica2_lez13a_d1-glyph4-1\" x=\"56.217492\" y=\"97.864893\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#fisica2_lez13a_d1-glyph0-1\" x=\"60.621815\" y=\"97.864893\"/>\n  <use xlink:href=\"#fisica2_lez13a_d1-glyph0-3\" x=\"65.779621\" y=\"97.864893\"/>\n</g>\n</g>\n</svg></figure>\n<p>Nel tempo $dt$ i portatori si spostano di $\\vec{v}_D\\,dt$: attraversano $dS$ tutti e soli i portatori contenuti nel cilindretto, la cui altezza è la proiezione dello spostamento sulla normale $\\hat{n}$. Da qui la comparsa del prodotto scalare.</p>\n<p>Il valore assoluto è essenziale: <strong>un volume non può essere negativo</strong>, mentre $\\vec{v}_D \\cdot \\hat{n}$ cambia segno se i portatori attraversano la superficie nel verso opposto a $\\hat{n}$.</p>\n<h4>Carica transitata con segno e corrente infinitesima</h4>\n<p>Quello che ci interessa fisicamente non è il volume ma la carica <em>transitata con segno</em> attraverso $dS$ nel verso di $\\hat{n}$. Questa quantità è orientata e vale</p>\n<p>$$dQ_{\\text{transitata}} = n q \\, (\\vec{v}_D \\cdot \\hat{n}) \\, dS \\, dt = n q \\, (\\vec{v}_D \\cdot d\\vec{S}) \\, dt .$$</p>\n<p>Dividendo per $dt$ otteniamo la corrente infinitesima $dI$ che attraversa $d\\vec{S}$:</p>\n<p>$$dI = \\frac{dQ_{\\text{transitata}}}{dt} = n q \\, (\\vec{v}_D \\cdot d\\vec{S}) .$$</p>\n<p>L'unità di misura della corrente è l'Ampere (A), che corrisponde a Coulomb al secondo (C/s).</p>\n<p><strong>Elemento di superficie orientato</strong></p><p>$$d\\vec{S} = \\hat{n} \\, dS$$</p>\n<p><strong>Volume geometrico del cilindretto</strong></p><p>$$dV = \\left| \\vec{v}_D \\cdot \\hat{n} \\right| dS \\, dt$$</p>\n<p><strong>Corrente infinitesima</strong></p><p>$$dI = n q \\, (\\vec{v}_D \\cdot d\\vec{S})$$</p>\n</details>\n<details id=\"s13-doppio-segno\"><summary><strong>Il doppio segno</strong></summary><p>Il segno di $dQ_{\\text{transitata}}$ dipende da <strong>due</strong> fattori indipendenti:</p>\n<ul>\n  <li>il segno della carica $q$ dei portatori;</li>\n  <li>il verso del moto rispetto a $\\hat{n}$, cioè il segno di $\\vec{v}_D \\cdot \\hat{n}$.</li>\n</ul>\n<p>Per questo motivo elettroni ($q \\lt 0$) che si muovono nel verso $-\\hat{n}$ danno lo stesso contributo <em>positivo</em> di cariche positive che si muovono nel verso $+\\hat{n}$: i due segni negativi si compensano. È esattamente la ragione per cui il verso convenzionale della corrente nei metalli è opposto al moto effettivo degli elettroni.</p>\n</details>\n<details id=\"s13-densita-corrente\"><summary><strong>Vettore Densità di Corrente</strong></summary><p>Per descrivere il flusso di cariche in modo <em>locale</em> (punto per punto, e non globalmente attraverso una superficie) introduciamo una grandezza vettoriale.</p>\n<h4>Definizione di $\\vec{J}$</h4>\n<p>Si definisce <strong>vettore densità di corrente</strong>, indicato con $\\vec{J}$, il prodotto tra la densità numerica di portatori $n$, la loro carica $q$ e la loro velocità di deriva $\\vec{v}_D$:</p>\n<p>$$\\vec{J} = n q \\vec{v}_D .$$</p>\n<p>Se nel materiale sono presenti più specie mobili (indicizzate da $s$), la densità di corrente è la somma dei contributi di tutte le specie:</p>\n<p>$$\\vec{J} = \\sum_s n_s q_s \\vec{v}_s .$$</p>\n<p>L'unità di misura di $\\vec{J}$ è $A/m^2$.</p>\n<h4>Intensità di corrente come flusso di $\\vec{J}$</h4>\n<p>Data una superficie $S$ orientata tramite la normale $\\hat{n}$ (con $d\\vec{S} = \\hat{n}\\,dS$), si definisce <strong>intensità di corrente</strong> attraverso $S$ la carica netta che transita attraverso $S$ nel verso di $\\hat{n}$ per unità di tempo:</p>\n<p>$$dI = \\vec{J} \\cdot d\\vec{S}, \\qquad I = \\int_S \\vec{J} \\cdot d\\vec{S} .$$</p>\n<p>L'intensità di corrente è dunque il <strong>flusso del vettore densità di corrente</strong> $\\vec{J}$ attraverso la superficie $S$. Il suo segno dipende dall'orientazione scelta per $\\hat{n}$: invertendo $\\hat{n}$ si inverte il segno di $I$. L'unità di misura è l'Ampere, $1\\,A = 1\\,C/s$.</p>\n<h4>Perché due grandezze e non una</h4>\n<p>$I$ è una grandezza <em>integrale</em>: dipende dalla superficie scelta e non dice nulla su come il flusso di carica sia distribuito. $\\vec{J}$ è invece una grandezza <em>locale</em>: è definita in ogni punto e descrive direzione, verso e intensità del trasporto di carica. Le equazioni fondamentali dell'elettromagnetismo sono scritte in termini di $\\vec{J}$ proprio perché sono <strong>leggi locali</strong>.</p>\n<p><strong>Densità di corrente (una specie)</strong></p><p>$$\\vec{J} = n q \\vec{v}_D$$</p>\n<p><strong>Densità di corrente (più specie)</strong></p><p>$$\\vec{J} = \\sum_s n_s q_s \\vec{v}_s$$</p>\n<p><strong>Intensità di corrente</strong></p><p>$$I = \\int_S \\vec{J} \\cdot d\\vec{S}$$</p>\n</details>\n<details id=\"s13-rho-specie-totale\"><summary><strong>Attenzione: $\\rho_s \\neq \\rho_{tot}$</strong></summary><p>Per una singola specie mobile, il prodotto $nq$ ha le dimensioni di una carica per unità di volume: è la densità di carica <em>di quella specie</em>, $\\rho_s = n_s q_s$, cosicché (per una sola specie) $\\vec{J} = \\rho_s \\vec{v}_D$.</p>\n<p>Questo è un punto delicato e fonte di <strong>errori frequenti</strong>. La densità di carica che compare nell'equazione di continuità e nella legge di Gauss è la densità di carica <strong>totale</strong>, somma dei contributi di <em>tutte</em> le cariche presenti, comprese quelle <em>immobili</em>:</p>\n<p>$$\\rho_{tot} = \\sum_s n_s q_s \\; + \\; \\rho_{\\text{fissa}} , \\qquad \\vec{J} = \\sum_s n_s q_s \\vec{v}_s .$$</p>\n<p>Un filo di rame percorso da corrente è l'esempio tipico: gli elettroni di conduzione hanno $n_e q_e \\neq 0$ e velocità di deriva non nulla, quindi $\\vec{J} \\neq 0$; ma il reticolo di ioni positivi, immobile, compensa esattamente la loro carica, cosicché $\\rho_{tot} = 0$.</p>\n<p>Dunque <strong>un conduttore complessivamente neutro può avere corrente non nulla</strong>: la relazione $\\vec{J} = \\rho_{tot}\\vec{v}_D$ sarebbe falsa in questo caso. La scrittura $\\vec{J} = \\rho \\vec{v}_D$ è lecita <strong>solo</strong> quando $\\rho$ è la densità della singola specie in moto.</p>\n</details>\n<details id=\"s13-esempio-rame\"><summary><strong>Esempio illustrativo — Ordini di grandezza in un filo di rame</strong></summary><p>Un filo di rame di sezione $A = 1{,}0\\;mm^2 = 1{,}0\\cdot 10^{-6}\\;m^2$ porta una corrente $I = 1{,}0\\;A$. La densità di corrente è</p>\n<p>$$J = \\frac{I}{A} = \\frac{1{,}0}{1{,}0 \\cdot 10^{-6}} = 1{,}0 \\cdot 10^{6} \\; A/m^2 .$$</p>\n<p>Assumendo una densità di elettroni di conduzione $n \\approx 8{,}5 \\cdot 10^{28}\\;m^{-3}$, la velocità di deriva vale in modulo</p>\n<p>$$v_D = \\frac{J}{n e} = \\frac{1{,}0 \\cdot 10^{6}}{(8{,}5 \\cdot 10^{28})(1{,}6 \\cdot 10^{-19})} \\approx 7 \\cdot 10^{-5} \\; m/s ,$$</p>\n<p>cioè <strong>meno di un decimo di millimetro al secondo</strong>. La densità di carica degli elettroni mobili è enorme in modulo, $\\rho_e = -n e \\approx -1{,}4 \\cdot 10^{10}\\;C/m^3$, ma è compensata dagli ioni fissi: la densità totale $\\rho_{tot}$ resta nulla. Questo conferma concretamente che $\\vec{J}$ dipende dalla specie mobile, non dalla densità di carica totale.</p>\n</details>\n<details id=\"s13-esempio-divergenza\"><summary><strong>Esempio illustrativo — Uso locale dell'equazione di continuità</strong></summary><p>Vediamo come si usa l'equazione di continuità quando la divergenza <em>non</em> è nulla. Supponiamo che in una certa regione di spazio la densità di corrente sia</p>\n<p>$$\\vec{J}(\\vec{r}) = \\alpha \\, x \\, \\hat{x} , \\qquad \\alpha \\gt 0 \\ \\text{costante},$$</p>\n<p>cioè diretta lungo $x$, con la <strong>componente</strong> $J_x = \\alpha x$ che cresce linearmente con $x$. Attenzione: il <em>modulo</em> è $|J| = \\alpha|x|$, quindi per fissare le idee limitiamo la discussione intuitiva alla regione $x \\geq 0$ (il calcolo della divergenza è comunque valido ovunque).</p>\n<h4>Passo 1 — Calcolo della divergenza</h4>\n<p>In coordinate cartesiane</p>\n<p>$$\\nabla \\cdot \\vec{J} = \\frac{\\partial J_x}{\\partial x} + \\frac{\\partial J_y}{\\partial y} + \\frac{\\partial J_z}{\\partial z} = \\frac{\\partial (\\alpha x)}{\\partial x} + 0 + 0 = \\alpha .$$</p>\n<h4>Passo 2 — Uso dell'equazione di continuità</h4>\n<p>$$\\frac{\\partial \\rho}{\\partial t} = - \\nabla \\cdot \\vec{J} = - \\alpha .$$</p>\n<h4>Passo 3 — Interpretazione del segno</h4>\n<p>Essendo $\\alpha \\gt 0$, risulta $\\partial\\rho/\\partial t \\lt 0$: la densità di carica <strong>diminuisce</strong> nel tempo, in ogni punto e con la stessa rapidità.</p>\n<p>Il motivo si legge nel bilancio dei flussi orientati sulle due facce di un volumetto perpendicolari a $\\hat{x}$: sulla faccia a $x$ maggiore la componente $J_x$ è più grande che sulla faccia a $x$ minore, dunque <em>esce</em> più corrente di quanta ne <em>entri</em>. Il volumetto si \"svuota\" di carica.</p>\n<h4>Passo 4 — Valori numerici</h4>\n<p>Se $\\alpha = 2{,}0\\;A/m^3$, allora</p>\n<p>$$\\frac{\\partial \\rho}{\\partial t} = -2{,}0 \\; \\frac{C}{m^3 \\cdot s} ,$$</p>\n<p>cioè in un millisecondo la densità di carica diminuisce di $2{,}0\\cdot 10^{-3}\\;C/m^3$.</p>\n<p>Si noti che questa situazione <em>non</em> è stazionaria: $\\rho$ dipende dal tempo e dunque la legge di Ampere nella forma originale non sarebbe applicabile.</p>\n</details>\n<details id=\"s13-generalizzazione-no\"><summary><strong>Una generalizzazione da NON fare</strong></summary><p>Attenzione a non estendere il controesempio precedente a tutti i circuiti in corrente alternata: <strong>la corrente alternata non esclude accumuli locali di carica</strong>.</p>\n<p>In un circuito contenente un condensatore alimentato in alternata, la carica sulle armature varia nel tempo, dunque in quella regione $\\partial\\rho/\\partial t \\neq 0$ e di conseguenza $\\nabla\\cdot\\vec{J} \\neq 0$.</p>\n<p>Il controesempio costruito sopra è un caso <em>ideale</em>, scelto proprio perché $\\vec{J}_0$ è uniforme nello spazio: è <strong>l'uniformità spaziale, non l'andamento temporale</strong>, a garantire la divergenza nulla.</p>\n</details>\n<details id=\"s13-errore-linee-chiuse\"><summary><strong>Un errore da evitare — \"le linee di un campo solenoidale sono chiuse\"</strong></summary><p>Si sente spesso dire che \"le linee di un campo solenoidale sono chiuse\": <strong>questa affermazione non segue dalla divergenza nulla</strong> ed è in generale falsa.</p>\n<p>Il controesempio più semplice è il <em>campo uniforme</em> $\\vec{F} = F_0\\hat{x}$: la sua divergenza è identicamente nulla, eppure le sue linee di campo sono rette illimitate, non curve chiuse. Si veda la figura della superficie chiusa immersa in $\\vec{J}$ uniforme: lì le linee sono rette, e tuttavia il flusso attraverso la superficie chiusa è nullo perché quanto entra da sinistra esce da destra.</p>\n<p>La proprietà corretta da ricordare è dunque quella del <strong>flusso netto nullo attraverso ogni superficie chiusa</strong>, cioè l'assenza di sorgenti e pozzi; le linee non devono necessariamente chiudersi su sé stesse.</p>\n</details>\n<details id=\"s13-dielettrici-convenzioni\"><summary><strong>Dielettrici: due convenzioni equivalenti (da non mescolare)</strong></summary><p>La relazione $\\nabla\\cdot\\left(\\vec{J} + \\epsilon_0\\,\\partial\\vec{E}/\\partial t\\right) = 0$ è stata ricavata utilizzando la densità di carica <em>totale</em> e la densità di corrente <em>totale</em>. Resta quindi valida anche nella materia, <strong>purché $\\vec{J}$ comprenda tutte le correnti di carica</strong>: non solo quelle di conduzione delle cariche libere, ma anche quelle associate al moto delle cariche legate, in particolare la corrente di polarizzazione $\\partial\\vec{P}/\\partial t$. In questa convenzione $\\vec{E}$ è il campo elettrico totale e $\\rho$ la densità totale:</p>\n<p>$$\\nabla \\cdot \\left( \\vec{J}_{\\mathrm{cariche}} + \\epsilon_0 \\frac{\\partial \\vec{E}}{\\partial t} \\right) = 0 .$$</p>\n<p>Se invece si preferisce separare le cariche libere da quelle legate, si introduce $\\vec{D} = \\epsilon_0\\vec{E} + \\vec{P}$ e si scrive</p>\n<p>$$\\nabla \\cdot \\left( \\vec{J}_{\\text{libera}} + \\frac{\\partial \\vec{D}}{\\partial t} \\right) = 0 ,$$</p>\n<p>dove ora $\\vec{J}_{\\text{libera}}$ contiene solo le cariche libere, mentre il contributo di polarizzazione è stato riassorbito nel termine $\\partial\\vec{D}/\\partial t$.</p>\n<p>Le due scritture sono <strong>equivalenti</strong>: cambiano soltanto quali contributi vengono resi espliciti in $\\vec{J}$ e quali nascosti nel termine di spostamento. <strong>Errore comune da evitare:</strong> mescolare le due convenzioni, cioè usare la corrente libera assieme a $\\epsilon_0\\,\\partial\\vec{E}/\\partial t$ — in un dielettrico mancherebbe il contributo di polarizzazione. Nel vuoto si ha $\\vec{P} = 0$, $\\vec{D} = \\epsilon_0\\vec{E}$, e le due coincidono.</p>\n</details>\n<details id=\"s13-oral-spostamento-indotta\"><summary><strong>Domanda dall'aula — \"La corrente di spostamento è chiamata anche corrente indotta?\"</strong></summary><p><strong>No, sono due concetti diversi.</strong></p>\n<p>La <strong>corrente indotta</strong> è una corrente <em>reale</em> (di cariche in movimento) generata da una variazione del flusso del campo magnetico.</p>\n<p>La <strong>corrente di spostamento</strong> non è un movimento di cariche, ma una variazione del campo elettrico.</p>\n</details>\n<details id=\"s13-sintesi-continuita\"><summary><strong>Sintesi — i tre risultati da portare a casa</strong></summary><ul>\n  <li>$I = \\displaystyle\\int_S \\vec{J}\\cdot d\\vec{S}$: la corrente è il <strong>flusso</strong> della densità di corrente, e il suo segno dipende dall'orientazione scelta;</li>\n  <li>$\\nabla\\cdot\\vec{J} + \\dfrac{\\partial\\rho}{\\partial t} = 0$ (equivalentemente $\\oint_S \\vec{J}\\cdot d\\vec{S} = -\\,dQ_{int}/dt$): la carica si conserva <strong>localmente</strong>, con $\\rho$ densità <em>totale</em>;</li>\n  <li>$\\nabla\\cdot\\left(\\vec{J} + \\epsilon_0\\dfrac{\\partial\\vec{E}}{\\partial t}\\right) = 0$: la corrente <em>totale</em>, conduzione più spostamento, è <strong>sempre solenoidale</strong>, cioè ha flusso netto nullo attraverso ogni superficie chiusa. Da qui la forma corretta della legge di Ampere, $\\nabla\\times\\vec{B} = \\mu_0\\left(\\vec{J} + \\epsilon_0\\,\\partial\\vec{E}/\\partial t\\right)$.</li>\n</ul>\n</details>\n<details id=\"s13-confronto-capacita\"><summary><strong>Resistenze vs Capacità — comportamento opposto</strong></summary><p>Il comportamento delle resistenze è <strong>l'opposto</strong> di quello delle capacità:</p>\n<ul><li>Serie; $R_{eq} = R_1 + R_2$ (si sommano); $1/C_{eq} = 1/C_1 + 1/C_2$ (si sommano gli inversi)</li><li>Parallelo; $1/R_{eq} = 1/R_1 + 1/R_2$ (si sommano gli inversi); $C_{eq} = C_1 + C_2$ (si sommano)</li></ul>\n</details>\n<details id=\"s13-resistivita-materiali\"><summary><strong>Resistività di Vari Materiali</strong></summary><p>La resistività è una proprietà che varia <strong>enormemente</strong> tra i diversi materiali, coprendo molti ordini di grandezza. Questo permette di classificarli in conduttori, semiconduttori e isolanti.</p>\n<p>Valori indicativi a temperatura ambiente ($\\approx 20^\\circ C$):</p>\n<ul><li>Argento; $1.59 \\times 10^{-8}$</li><li>Rame; $1.68 \\times 10^{-8}$</li><li>Platino; $10.6 \\times 10^{-8}$</li><li>Acqua (distillata); $\\approx 2.5 \\times 10^{5}$</li><li>Legno; $10^8 - 10^{11}$</li><li>Vetro; $10^{10} - 10^{14}$</li></ul>\n</details>\n<details id=\"s13-extra-0\"><summary><strong>Stazionarietà e assenza di accumulo: due condizioni distinte</strong></summary><p>È importante non confondere le due richieste:</p>\n<ul>\n  <li>$\\dfrac{\\partial\\rho}{\\partial t} = 0$ (assenza di accumulo locale di carica) <strong>implica</strong> $\\nabla\\cdot\\vec{J} = 0$: è esattamente l'equazione di continuità;</li>\n  <li>ma $\\dfrac{\\partial\\rho}{\\partial t} = 0$ <strong>non implica</strong> $\\dfrac{\\partial\\vec{J}}{\\partial t} = 0$.</li>\n</ul>\n<p>Una densità di corrente può infatti variare nel tempo mantenendo la divergenza nulla. Il controesempio più semplice è</p>\n<p>$$\\vec{J}(\\vec{r},t) = \\vec{J}_0 \\cos(\\omega t), \\qquad \\vec{J}_0 \\ \\text{vettore costante e uniforme nello spazio},$$</p>\n<p>per cui</p>\n<p>$$\\nabla \\cdot \\vec{J} = \\cos(\\omega t) \\, (\\nabla \\cdot \\vec{J}_0) = 0 \\quad \\text{in ogni istante},$$</p>\n<p>$$\\text{mentre} \\qquad \\frac{\\partial \\vec{J}}{\\partial t} = - \\omega \\vec{J}_0 \\sin(\\omega t) \\neq 0 .$$</p>\n<p>Qui non c'è alcun accumulo di carica in nessun punto, eppure il regime non è stazionario. Per questo <strong>la stazionarietà è una richiesta più forte dell'assenza di accumulo</strong>.</p>\n<p>Va inoltre evitata la deduzione inversa: dal fatto che la corrente <em>non</em> sia stazionaria non segue che ci sia accumulo di carica da qualche parte. L'accumulo è legato <strong>esclusivamente</strong> a $\\nabla\\cdot\\vec{J} \\neq 0$.</p></details>\n<details id=\"s13-extra-1\"><summary><strong>Regolarità del campo e significato di solenoidalità</strong></summary><p>Un campo vettoriale a divergenza nulla si dice <strong>solenoidale</strong>.</p>\n<p>Un campo vettoriale $\\vec{F}$ si dice solenoidale se $\\nabla\\cdot\\vec{F} = 0$ in ogni punto. Equivalentemente (per il teorema della divergenza), se $\\vec{F}$ è <strong>regolare in tutto il volume racchiuso</strong>, il suo flusso netto attraverso <em>qualunque</em> superficie chiusa è nullo:</p>\n<p>$$\\oint_S \\vec{F} \\cdot d\\vec{S} = 0 \\quad \\text{per ogni } S \\text{ chiusa}.$$</p>\n<p>L'ipotesi di regolarità è essenziale: il campo coulombiano $\\hat{r}/r^2$ ha divergenza nulla fuori dall'origine, ma flusso non nullo attraverso una superficie che racchiude l'origine.</p>\n<p>Un campo solenoidale non possiede dunque sorgenti né pozzi locali: in ogni volumetto, quanto \"entra\" è esattamente quanto \"esce\".</p></details>\n<details id=\"s13-extra-2\"><summary><strong>Di quale \"problema\" si tratta</strong></summary><p>La condizione $\\nabla\\cdot\\vec{J} = 0$ <strong>non è in conflitto con la legge di Gauss</strong>: le due relazioni sono perfettamente compatibili, e infatti nel regime stazionario valgono entrambe.</p>\n<p>Il problema storico riguarda invece la <strong>legge di Ampere</strong>: nella sua forma originale, $\\nabla\\times\\vec{B} = \\mu_0\\vec{J}$, essa impone $\\nabla\\cdot\\vec{J} = 0$ (la divergenza di un rotore è identicamente nulla) e dunque è <strong>inapplicabile</strong> ogni volta che le distribuzioni di carica variano nel tempo, come nella carica di un condensatore.</p>\n<p>La manipolazione che segue individua esattamente il termine che va aggiunto per sanare questa incoerenza.</p></details>\n<details id=\"s13-extra-3\"><summary><strong>Anticipazione: la legge di Ampere-Maxwell</strong></summary><p>Il termine individuato sopra è esattamente quello che va aggiunto alla legge di Ampere per renderla coerente con la conservazione della carica. La forma corretta è</p>\n<p>$$\\nabla \\times \\vec{B} = \\mu_0 \\left( \\vec{J} + \\epsilon_0 \\frac{\\partial \\vec{E}}{\\partial t} \\right) = \\mu_0 \\, \\vec{J}_{tot} .$$</p>\n<p>Prendendo la divergenza di entrambi i membri, il primo membro si annulla identicamente (la divergenza di un rotore è nulla) e si ritrova $\\nabla\\cdot\\vec{J}_{tot} = 0$: la relazione ottenuta in questa lezione è dunque automaticamente soddisfatta, qualunque sia la dipendenza dal tempo di $\\rho$.</p>\n<p>In forma integrale, per una curva chiusa $\\gamma$,</p>\n<p>$$\\oint_\\gamma \\vec{B} \\cdot d\\vec{l} = \\mu_0 \\int_\\Sigma \\vec{J}_{tot} \\cdot d\\vec{S} ,$$</p>\n<p>dove $\\Sigma$ è una qualunque superficie aperta che abbia $\\gamma$ come bordo. Poiché $\\vec{J}_{tot}$ è solenoidale, il suo flusso attraverso <em>due</em> superfici diverse $\\Sigma_1$ e $\\Sigma_2$ con lo stesso bordo $\\gamma$ è lo stesso: unendole si ottiene infatti una superficie chiusa, attraverso la quale il flusso netto è nullo. L'indipendenza dalla superficie riguarda dunque, in senso proprio, il <em>flusso della corrente totale</em>, e di conseguenza il valore della circuitazione di $\\vec{B}$ lungo $\\gamma$ è ben definito.</p></details>\n<details id=\"s13-extra-4\"><summary><strong>Esempio numerico sulla corrente di spostamento</strong></summary><p>Un condensatore piano nel vuoto ha armature di area $A = 100\\;cm^2 = 1{,}0\\cdot 10^{-2}\\;m^2$ ed è caricato da una corrente costante $I = 2{,}0\\;mA$.</p>\n<p>Densità di corrente di spostamento fra le armature:</p>\n<p>$$J_S = \\frac{I}{A} = \\frac{2{,}0 \\cdot 10^{-3}}{1{,}0 \\cdot 10^{-2}} = 0{,}20 \\; A/m^2 .$$</p>\n<p>Rapidità di variazione del campo elettrico:</p>\n<p>$$\\frac{\\partial E}{\\partial t} = \\frac{J_S}{\\epsilon_0} = \\frac{0{,}20}{8{,}85 \\cdot 10^{-12}} \\approx 2{,}3 \\cdot 10^{10} \\; \\frac{V}{m \\cdot s} .$$</p>\n<p>Corrente di spostamento totale: $I_S = A J_S = 2{,}0\\;mA = I$, come previsto.</p>\n<p>Si osservi che, pur essendo $\\vec{J} = 0$ fra le armature, la corrente di spostamento <strong>riproduce integralmente la corrente del circuito</strong>.</p></details>\n<details id=\"s13-extra-5\"><summary><strong>Ipotesi della legge di Ohm locale</strong></summary><p><strong>Precisazione sulle ipotesi:</strong> l'isotropia è ciò che garantisce che $\\sigma$ sia uno <em>scalare</em> (altrimenti sarebbe un tensore e $\\vec{J}$ non sarebbe parallelo a $\\vec{E}$); l'ohmicità garantisce che $\\sigma$ non dipenda dall'intensità dei campi; una conducibilità <em>uguale in tutti i punti</em> richiede inoltre che il materiale sia <strong>omogeneo</strong>. Attenzione a non confondere questa $\\sigma$ (conducibilità, $(\\Omega\\cdot m)^{-1}$) con la densità superficiale di carica.</p></details>"
    }
  ],
  "oral_cards": [
    {
      "type": "definizione",
      "front": "Definisci il vettore densità di corrente $\\vec{J}$ e l'intensità di corrente $I$.",
      "back": "Per una specie mobile: $\\vec{J} = n q \\vec{v}_D$; per più specie $\\vec{J} = \\sum_s n_s q_s \\vec{v}_s$ (unità $A/m^2$). L'intensità di corrente è il flusso di $\\vec{J}$: $I = \\int_S \\vec{J}\\cdot d\\vec{S}$, con $d\\vec{S} = \\hat{n}\\,dS$. $\\vec{J}$ è locale, $I$ è integrale e il suo segno dipende dall'orientazione scelta per $\\hat{n}$."

      "back": "No: mescolerebbe due convenzioni distinte, perdendo il contributo di polarizzazione. Le forme corrette sono: con <em>tutte</em> le correnti di carica (libere e legate, inclusa $\\partial\\vec{P}/\\partial t$) $\\nabla\\cdot(\\vec{J}_{\\mathrm{cariche}} + \\epsilon_0\\partial_t\\vec{E}) = 0$; oppure con la <em>sola</em> corrente libera $\\nabla\\cdot(\\vec{J}_{\\text{libera}} + \\partial_t\\vec{D}) = 0$, con $\\vec{D} = \\epsilon_0\\vec{E} + \\vec{P}$. Nel vuoto ($\\vec{P}=0$) coincidono."
