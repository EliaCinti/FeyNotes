      "icon": "🔄",
      "content": "<p>La lezione riparte dal flusso della densità di corrente attraverso una <strong>superficie chiusa</strong> $S$, che racchiude un volume fisso $V$. La normale $\\hat n$ è, per convenzione, <strong>uscente</strong>.</p>\n<p>Richiamiamo soltanto le grandezze che servono: $\\vec J$ è la densità di corrente, in $\\mathrm{A/m^2}$; la corrente attraverso un elemento orientato è $dI=\\vec J\\cdot\\hat n\\,dS$.</p><figure class=\"figura\" data-id=\"fisica2_lez13_doc_surface\"><svg id=\"fisica2_lez13_doc_surface\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"237.262pt\" height=\"187.411pt\" viewBox=\"0 0 237.262 187.411\" version=\"1.2\"><style>#fisica2_lez13_doc_surface [fill=\"rgb(15.684509%,40.391541%,78.039551%)\"],#fisica2_lez13_doc_surface [style*=\"fill:rgb(15.684509%,40.391541%,78.039551%)\"]{fill:#77a2e4!important}[data-mode=\"light\"] #fisica2_lez13_doc_surface [fill=\"rgb(15.684509%,40.391541%,78.039551%)\"],[data-mode=\"light\"] #fisica2_lez13_doc_surface [style*=\"fill:rgb(15.684509%,40.391541%,78.039551%)\"]{fill:#2867c7!important}#fisica2_lez13_doc_surface [stroke=\"rgb(15.684509%,40.391541%,78.039551%)\"],#fisica2_lez13_doc_surface [style*=\"stroke:rgb(15.684509%,40.391541%,78.039551%)\"]{stroke:#77a2e4!important}[data-mode=\"light\"] #fisica2_lez13_doc_surface [stroke=\"rgb(15.684509%,40.391541%,78.039551%)\"],[data-mode=\"light\"] #fisica2_lez13_doc_surface [style*=\"stroke:rgb(15.684509%,40.391541%,78.039551%)\"]{stroke:#2867c7!important}#fisica2_lez13_doc_surface [fill=\"rgb(0%,0%,0%)\"],#fisica2_lez13_doc_surface [style*=\"fill:rgb(0%,0%,0%)\"]{fill:var(--text-primary)!important}#fisica2_lez13_doc_surface [stroke=\"rgb(0%,0%,0%)\"],#fisica2_lez13_doc_surface [style*=\"stroke:rgb(0%,0%,0%)\"]{stroke:var(--text-primary)!important}#fisica2_lez13_doc_surface [fill=\"rgb(76.075745%,23.136902%,20.783997%)\"],#fisica2_lez13_doc_surface [style*=\"fill:rgb(76.075745%,23.136902%,20.783997%)\"]{fill:#d doc_surface-glyph3-1\" x=\"175.157348\" y=\"179.085167\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#fisica2_lez13_doc_surface-glyph2-1\" x=\"180.22542\" y=\"179.085167\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#fisica2_lez13_doc_surface-glyph1-3\" x=\"179.750911\" y=\"179.085167\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#fisica2_lez13_doc_surface-glyph1-7\" x=\"187.84008\" y=\"179.085167\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#fisica2_lez13_doc_surface-glyph2-2\" x=\"197.541\" y=\"179.085167\"/>\n</g>\n</g>\n</svg><figcaption><strong>Superficie chiusa e convenzione dei segni</strong><span class=\"figure-explanation\">Come negli appunti: $\\vec J$ in rosso, normale uscente $\\hat n$ in blu. Il segno del prodotto scalare distingue i contributi entranti da quelli uscenti.</span></figcaption></figure>\n<p>Il segno del prodotto scalare ha il significato indicato negli appunti:</p>\n<ul><li>$\\vec J\\cdot\\hat n\\gt0$: escono cariche positive, oppure entrano cariche negative;</li>\n<li>$\\vec J\\cdot\\hat n\\lt0$: entrano cariche positive, oppure escono cariche negative.</li></ul>\n<p>Un flusso netto uscente positivo diminuisce la carica contenuta nel volume; un flusso netto entrante la aumenta. È questo bilancio che porta all'equazione di continuità. Qui $\\rho_{tot}$ è la <strong>densità di carica totale</strong>, incluse le cariche immobili.</p>",
      "subsections": [
        {
          "subtitle": "Conservazione della carica in forma integrale",
          "content": "<p>Per ogni superficie chiusa $S$ <strong>fissa</strong>, con normale uscente, che racchiude il volume $V$, vale</p>\n<p>$$I_{uscente} = \\oint_S \\vec{J} \\cdot d\\vec{S} = - \\frac{dQ_{int}}{dt}, \\qquad Q_{int} = \\int_V \\rho_{tot} \\, dV .$$</p>\n<p>Il segno meno indica che una corrente uscente positiva corrisponde a una diminuzione della carica contenuta nel volume. La carica elettrica <strong>non viene né creata né distrutta</strong>: può soltanto essere trasportata attraverso la frontiera del volume.</p>"
        },
        {
          "subtitle": "Passaggio alla forma differenziale",
          "content": "<p>Sostituendo l'espressione di $Q_{int}$ otteniamo</p>\n<p>$$\\oint_S \\vec{J} \\cdot d\\vec{S} = - \\frac{d}{dt} \\int_V \\rho_{tot} \\, dV .$$</p>\n<p>Applichiamo ora il <strong>teorema della divergenza</strong> al primo membro, trasformando l'integrale di superficie in un integrale di volume:</p>\n<p>$$\\oint_S \\vec{J} \\cdot d\\vec{S} = \\int_V (\\nabla \\cdot \\vec{J}) \\, dV .$$</p>\n<p>Assumendo che il volume $V$ sia <strong>fisso nel tempo</strong>, possiamo portare l'operatore di derivata temporale all'interno dell'integrale al secondo membro, dove diventa una derivata parziale (perché $\\rho_{tot}$ dipende anche dalla posizione):</p>\n<p>$$- \\frac{d}{dt} \\int_V \\rho_{tot} \\, dV = - \\int_V \\frac{\\partial \\rho_{tot}}{\\partial t} \\, dV .$$</p>\n<p>Uguagliando i due integrali di volume:</p>\n<p>$$\\int_V (\\nabla \\cdot \\vec{J}) \\, dV = - \\int_V \\frac{\\partial \\rho_{tot}}{\\partial t} \\, dV .$$</p>\n<p>Poiché questa uguaglianza deve valere per un volume $V$ <em>arbitrario</em>, gli integrandi devono coincidere punto per punto:</p>\n<p>$$\\nabla \\cdot \\vec{J} = - \\frac{\\partial \\rho_{tot}}{\\partial t} .$$</p>"
        },
        {
          "subtitle": "Equazione di continuità",
          "content": "<p>L'equazione che lega la divergenza della densità di corrente alla variazione temporale della densità di carica <strong>totale</strong> è nota come <strong>equazione di continuità</strong> in forma differenziale:</p>\n<p>$$\\nabla \\cdot \\vec{J} + \\frac{\\partial \\rho_{tot}}{\\partial t} = 0 .$$</p>\n<p>Essa esprime la conservazione della carica elettrica a livello <em>locale</em>: la divergenza di $\\vec{J}$ in un punto misura la carica che \"sgorga\" per unità di volume e di tempo, e questa può avvenire solo a spese della carica lì presente.</p>"
        },
        {
          "subtitle": "Come leggere l'equazione",
          "content": "<p>Si tratta della stessa struttura che si incontra per qualunque grandezza conservata (massa in fluidodinamica, numero di particelle, energia): un termine di <em>flusso</em> ($\\nabla\\cdot\\vec{J}$) bilanciato da un termine di <em>accumulo</em> ($\\partial\\rho_{tot}/\\partial t$).</p>\n<p>Nel seguito, per alleggerire la notazione, scriveremo semplicemente $\\rho$ intendendo <strong>sempre la densità di carica totale</strong>.</p>"
        }
      ],
      "formulas": [
        {
          "label": "Forma integrale",
          "latex": "\\oint_S \\vec{J} \\cdot d\\vec{S} = - \\frac{dQ_{int}}{dt}"
        },
        {
          "label": "Teorema della divergenza",
          "latex": "\\oint_S \\vec{J} \\cdot d\\vec{S} = \\int_V (\\nabla \\cdot \\vec{J}) \\, dV"
        },
        {
          "label": "Equazione di continuità",
          "latex": "\\nabla \\cdot \\vec{J} + \\frac{\\partial \\rho}{\\partial t} = 0"
        }
      ]
    },
    {
      "id": "s13-regime-stazionario",
      "type": "section",
      "title": "Regime stazionario: quanto entra, tanto esce",
      "icon": "⏸️",
      "content": "<p>Un caso di particolare interesse è quello delle <strong>correnti stazionarie</strong>.</p>",
      "subsections": [
        {
          "subtitle": "Regime stazionario",
          "content": "<p>Si dice che un sistema è in <strong>regime stazionario</strong> quando le distribuzioni di carica e di corrente sono <em>indipendenti dal tempo</em> in ogni punto dello spazio:</p>\n<p>$$\\frac{\\partial \\rho}{\\partial t} = 0 \\qquad \\text{e} \\qquad \\frac{\\partial \\vec{J}}{\\partial t} = 0 .$$</p>\n<p>In tali condizioni l'equazione di continuità si riduce a</p>\n<p>$$\\nabla \\cdot \\vec{J} = 0 .$$</p>"
        },
        {
          "subtitle": "Bilancio delle correnti",

"105.512156\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#fisica2_lez13_doc_balance-glyph4-1\" x=\"128.324878\" y=\"104.516984\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#fisica2_lez13_doc_balance-glyph4-2\" x=\"138.04085\" y=\"104.516984\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#fisica2_lez13_doc_balance-glyph0-1\" x=\"144.154699\" y=\"102.252869\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#fisica2_lez13_doc_balance-glyph0-2\" x=\"142.647953\" y=\"104.516984\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#fisica2_lez13_doc_balance-glyph3-1\" x=\"151.13189\" y=\"104.516984\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#fisica2_lez13_doc_balance-glyph3-2\" x=\"160.855925\" y=\"104.516984\"/>\n</g>\n</g>\n</svg><figcaption><strong>Regime stazionario: quanto entra, tanto esce</strong><span class=\"figure-explanation\">Il volume non accumula carica: la corrente entrante e quella uscente si compensano. Con sezioni uguali e corrente uniforme coincidono anche i moduli di $\\vec J_{in}$ e $\\vec J_{out}$.</span></figcaption></figure>\n<p>Se $\\partial\\rho/\\partial t=0$, la carica in un volume fisso non cambia. Dalla forma integrale della continuità segue</p>\n<p>$$I_{out}-I_{in}=0\\quad\\Longrightarrow\\quad I_{in}=I_{out}.$$</p>\n<p>Questo è il senso del disegno del docente: tanta carica entra, tanta ne esce. Per un filo con sezioni uguali e densità di corrente uniforme, si può scrivere anche $J_{in}=J_{out}$.</p>\n<p>Un campo con divergenza nulla si dice <strong>solenoidale</strong>: non presenta sorgenti o pozzi locali. Per ogni superficie chiusa il suo flusso netto è nullo.</p>\n<p>La stazionarietà richiede anche che $\\vec J$ non vari nel tempo; il solo annullarsi della divergenza garantisce l'assenza di accumulo. L'esempio che distingue le due condizioni è conservato negli approfondimenti.</p>"

    {
      "id": "s13-correzione-maxwell",
      "type": "section",
      "title": "Dalla continuità alla corrente di spostamento",
      "icon": "✨",
      "content": "<p>Torniamo al caso <em>generale</em>, in cui $\\partial\\rho/\\partial t$ può essere diversa da zero, e riscriviamo l'equazione di continuità eliminando $\\rho$ a favore del campo elettrico. Lo strumento è la prima equazione di Maxwell (legge di Gauss in forma locale), nella quale $\\rho$ è la densità di carica <em>totale</em>, incluse le cariche immobili:</p>\n<p>$$\\nabla \\cdot \\vec{E} = \\frac{\\rho}{\\epsilon_0} \\quad \\Rightarrow \\quad \\rho = \\epsilon_0 (\\nabla \\cdot \\vec{E}) .$$</p>",
      "subsections": [
        {
          "subtitle": "Sostituire la legge di Gauss nella continuità",
          "content": "<p>Sostituiamo l'espressione di $\\rho$ nell'equazione di continuità generale:</p>\n<p>$$\\nabla \\cdot \\vec{J} + \\frac{\\partial}{\\partial t} \\left( \\epsilon_0 (\\nabla \\cdot \\vec{E}) \\right) = 0 .$$</p>\n<p>Poiché $\\epsilon_0$ è una costante e gli operatori di derivata spaziale (divergenza) e di derivata temporale agiscono su variabili indipendenti, possiamo scambiarli:</p>\n<p>$$\\nabla \\cdot \\vec{J} + \\epsilon_0 \\left( \\nabla \\cdot \\frac{\\partial \\vec{E}}{\\partial t} \\right) = 0 .$$</p>\n<p>Raccogliendo l'operatore di divergenza:</p>\n<p>$$\\nabla \\cdot \\left( \\vec{J} + \\epsilon_0 \\frac{\\partial \\vec{E}}{\\partial t} \\right) = 0 .$$</p>\n<p>Questa equazione ci dice che, <strong>anche quando $\\vec{J}$ da solo non è solenoidale</strong>, il vettore combinato $\\left(\\vec{J} + \\epsilon_0\\,\\partial\\vec{E}/\\partial t\\right)$ lo è <em>sempre</em>. Maxwell ha dato un nome al secondo termine.</p>"
        },
        {
          "subtitle": "Densità di corrente di spostamento",
          "content": "<p>Il termine</p>\n<p>$$\\vec{J}_S = \\epsilon_0 \\frac{\\partial \\vec{E}}{\\partial t}$$</p>\n<p>è chiamato <strong>densità di corrente di spostamento</strong> (nel vuoto).</p>\n<p>La corrente di spostamento $\\vec{J}_S$ <strong>non rappresenta un moto fisico di cariche</strong>, a differenza della corrente di conduzione $\\vec{J}$: essa è generata da una <strong>variazione del campo elettrico nel tempo</strong>. Dal punto di vista dimensionale, però, è a tutti gli effetti una densità di corrente ($A/m^2$), e nelle equazioni compare esattamente al pari di $\\vec{J}$.</p>\n<p>La relazione fondamentale diventa quindi</p>\n<p>$$\\nabla \\cdot (\\vec{J} + \\vec{J}_S) = 0 .$$</p>\n<p>Il vettore \"corrente totale\" $\\vec{J}_{tot} = \\vec{J} + \\vec{J}_S$ è <strong>sempre solenoidale</strong>: il suo flusso netto attraverso qualunque superficie chiusa è nullo. Questa fu la geniale intuizione di Maxwell, che completò il quadro dell'elettromagnetismo.</p><p>Negli appunti il punto centrale è questo: fra le armature di un condensatore nel vuoto <strong>non passano cariche</strong>, ma la variazione del campo elettrico contribuisce al bilancio attraverso il termine di spostamento. La corrente di spostamento su una superficie aperta $A$ è il flusso $I_S=\\int_A\\vec J_S\\cdot d\\vec S$; quando $\\vec J_S$ è uniforme e perpendicolare alla superficie, $I_S=J_S A$.</p>"
        }
      ],
      "formulas": [
        {
          "label": "Gauss in forma locale",
          "latex": "\\nabla \\cdot \\vec{E} = \\frac{\\rho}{\\epsilon_0}"
        },
        {
          "label": "Corrente di spostamento (vuoto)",
          "latex": "\\vec{J}_S = \\epsilon_0 \\frac{\\partial \\vec{E}}{\\partial t}"
        },
        {
          "label": "Corrente totale solenoidale",
          "latex": "\\nabla \\cdot \\left( \\vec{J} + \\epsilon_0 \\frac{\\partial \\vec{E}}{\\partial t} \\right) = 0"
        }
      ]
    },
    {
      "id": "s13-condensatore-carica",
      "type": "section",
      "title": "Il condensatore in carica: i due disegni degli appunti",
      "icon": "🔌",
      "content": "<p>Consideriamo la carica di un condensatore a facce piane e parallele, con armature di area $A$, separate dal vuoto, collegato a un generatore tramite due fili.</p>",
      "subsections": [
        {
          "subtitle": "Durante la carica",
          "content": "<p>La corrente nel filo porta carica su un'armatura; attraverso l'altro collegamento il circuito sottrae la stessa carica all'altra. Le armature acquistano quindi cariche $+Q(t)$ e $-Q(t)$. Non viene creata carica: le variazioni di carica netta richiedono lo scambio con il circuito.</p>\n<p>Tra le armature, separate dal vuoto, la densità di corrente di conduzione è $\\vec J=0$. Tuttavia il campo elettrico cresce durante la carica e quindi $\\partial\\vec E/\\partial t\\neq0$.</p><figure class=\"figura\" data-id=\"fisica2_lez13_doc_capacitor\"><svg id=\"fisica2_lez13_doc_capacitor\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"238.039pt\" height=\"304.455pt\" viewBox=\"0 0 238.039 304.455\" version=\"1.2\"><style>#fisica2_lez13_doc_capacitor [fill=\"rgb(0%,0%,0%)\"],#fisica2_lez13_doc_capacitor [style*=\"fill:rgb(0%,0%,0%)\"]{fill:var(--text-primary)!important}#fisica2_lez13_doc_capacitor [stroke=\"rgb(0%,0%,0%)\"],#fisica2_lez13_doc_capacitor [style*=\"stroke:rgb(0%,0%,0%)\"]{stroke:var(--text-primary)!important}#fisica2_lez13_doc_capacitor [fill=\"rgb(15.684509%,40.391541%,78.039551%)\"],#fisica2_lez13_doc_capacitor [style*=\"fill:rgb(15.684509%,40.391541%,78.039551%)\"]{fill:#77a2e4!important}[data-mode=\"light\"] #fisica2_lez13_doc_capacitor [fill=\"rgb(15.684509%,40.391541%,78.039551%)\"],[data-mode=\"light\"] #fisica2_lez13_doc_capacitor [style*=\"fill:rgb(15.684509%,40.391541%,78.039551%)\"]{fill:#2867c7!important}#fisica2_lez13_doc_capacitor [stroke=\"rgb(15.684509%,40.391541%,78.039551%)\"],#fisica2_lez13_doc_capacitor [style*=\"stroke:rgb(15.684509%,40.391541%,78.039551%)\"]{stroke:#77a2e4!important}[data-mode=\"light\"] #fisica2_lez13_doc_capacitor [stroke=\"rgb(15.684509%,40.391541%,78.039551%)\"],[data-mode=\"light\"] #fisica2_lez13_doc_capacitor [style*=\"stroke:rgb(15.684509%,40.391541%,78.039551%)\"]{stroke:#2867c7!important}#fisica2_lez13_doc_capacitor [fill=\"rgb(85.096741%,46.665955 l-opacity:1;\">\n  <use xlink:href=\"#fisica2_lez13_doc_capacitor-glyph0-1\" x=\"157.884596\" y=\"286.014382\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#fisica2_lez13_doc_capacitor-glyph3-1\" x=\"161.896399\" y=\"287.006377\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#fisica2_lez13_doc_capacitor-glyph1-4\" x=\"169.762642\" y=\"286.014382\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#fisica2_lez13_doc_capacitor-glyph1-5\" x=\"179.44671\" y=\"286.014382\"/>\n</g>\n</g>\n</svg><figcaption><strong>Condensatore in carica e superficie che racchiude un’armatura</strong><span class=\"figure-explanation\">I due disegni del docente: prima il condensatore in carica, poi la superficie chiusa $\\Sigma_c$ che racchiude l’armatura positiva. Dal filo entra $I$; attraverso la parte di superficie nel vuoto esce $I_S=I$.</span></figcaption></figure>"
        },
        {
          "subtitle": "Il calcolo: la corrente di spostamento vale quanto quella nel filo",
          "content": "<p>Nel modello ideale (armature molto estese, effetti di bordo trascurabili) il campo tra le armature è uniforme e vale, per la legge di Gauss,</p>\n<p>$$E = \\frac{\\sigma}{\\epsilon_0} = \\frac{Q}{\\epsilon_0 A} .$$</p>\n<p>Poiché $Q$ varia nel tempo, si ha $\\partial\\vec{E}/\\partial t \\neq 0$ e dunque una densità di corrente di spostamento di modulo</p>\n<p>$$J_S = \\epsilon_0 \\frac{\\partial E}{\\partial t} = \\epsilon_0 \\cdot \\frac{1}{\\epsilon_0 A} \\frac{dQ}{dt} = \\frac{1}{A} \\frac{dQ}{dt} .$$</p>\n<p>Integrando su una superficie piana che taglia lo spazio fra le armature, la corrente di spostamento totale è</p>\n<p>$$I_S = A \\, J_S = \\frac{dQ}{dt} = I .$$</p>\n<p><strong>La corrente di spostamento tra le armature è dunque esattamente uguale alla corrente di conduzione nei fili.</strong></p>\n\n"
        },
        {
          "subtitle": "La superficie chiusa che racchiude l’armatura",
          "content": "<p>Guardiamo il secondo disegno: la superficie chiusa $\\Sigma_c$ racchiude l'armatura positiva e attraversa il filo da un lato e lo spazio fra le armature dall'altro. La normale è uscente.</p>\n<p>Dal filo entra la corrente $I$, che dà contributo $-I$; attraverso la porzione nel vuoto esce la corrente di spostamento $I_S$, che dà contributo $+I_S$. Per la somma $\\vec J+\\vec J_S$ vale</p>\n<p>$$\\oint_{\\Sigma_c}(\\vec J+\\vec J_S)\\cdot d\\vec S=-I+I_S=0.$$</p>\n<p>La carica sull'armatura può aumentare: il flusso della <strong>sola conduzione</strong> non è nullo. È il flusso della somma conduzione più spostamento a essere nullo, come ricavato dalla legge di Gauss e dalla continuità.</p>"
        },
        {
          "subtitle": "Quando il condensatore è completamente carico",
          "content": "<ol>\n  <li>Le cariche si sono accumulate sulle armature fino al valore massimo, determinato dalla capacità e dalla differenza di potenziale applicata. La densità di carica superficiale diventa costante.</li>\n  <li>Il campo elettrico tra le armature, $E = \\sigma_s/\\epsilon_0$ (dove $\\sigma_s$ è la densità superficiale di carica sulle armature, <strong>da non confondere con la conducibilità $\\sigma$</strong> introdotta nel seguito), diventa anch'esso costante nel tempo.</li>\n  <li>Di conseguenza la sua derivata temporale si annulla: $\\dfrac{\\partial\\vec{E}}{\\partial t} = 0$.</li>\n  <li>La corrente di spostamento $\\vec{J}_S$ diventa nulla.</li>\n  <li>Il circuito si comporta come un <strong>circuito aperto</strong> e la corrente di conduzione $I$ cessa di scorrere.</li>\n</ol>\n<p>In sostanza, il processo di carica è un <strong>transitorio</strong> durante il quale il campo elettrico varia, generando una corrente di spostamento. A regime, tutto diventa stazionario e la corrente si arresta.</p>"
        }
      ],
      "formulas": [
        {
          "label": "Campo fra le armature",
          "latex": "E = \\frac{\\sigma}{\\epsilon_0} = \\frac{Q}{\\epsilon_0 A}"
        },
        {
          "label": "Corrente di spostamento totale",
          "latex": "I_S = A J_S = \\frac{dQ}{dt} = I"
        },
        {
          "label": "Bilancio del flusso su $\\Sigma_c$",
          "latex": "\\oint_{\\Sigma_c} \\vec{J}_{tot} \\cdot d\\vec{S} = -I + I_S = 0"
        }
      ]
    },
    {
      "id": "s13-leggi-ohm",
      "type": "section",
      "title": "Leggi di Ohm e Resistenza",
      "icon": "🧲",
      "content": "<p>Passiamo ora a descrivere le correnti in <strong>regime stazionario</strong> all'interno di materiali conduttori.</p>\n<p><strong>Avviso sul simbolo $\\rho$:</strong> fino a qui $\\rho$ ha indicato la <em>densità di carica totale</em> ($C/m^3$). Da questo punto in poi lo stesso simbolo indica la <em>resistività</em> del materiale ($\\Omega\\cdot m$). Sono grandezze con dimensioni diverse: dove serve chiarezza scriveremo $\\rho_q$ per la densità di carica e $\\rho_{\\mathrm{el}}$ per la resistività.</p>",
      "subsections": [
        {

251102\" y=\"94.041709\"/>\n</g>\n</g>\n</svg><figcaption><strong>Prima legge di Ohm: differenza di potenziale tra A e B</strong><span class=\"figure-explanation\">Il conduttore tra $A$ e $B$ riprende il disegno degli appunti. Nel verso convenzionale della corrente si ha $V_A&gt;V_B$ e $V_A-V_B=RI$.</span></figcaption></figure><p>La prima legge di Ohm, determinata sperimentalmente, stabilisce una relazione di proporzionalità tra la differenza di potenziale $\\Delta V$ applicata ai capi di un conduttore e la corrente $I$ che lo attraversa.</p>\n<p><strong>Enunciato.</strong> Dati due punti A e B di un conduttore <strong>ohmico</strong> (cioè tale che $R$ non dipenda né da $I$ né da $\\Delta V$, a temperatura fissata), percorso da corrente nel verso da A a B, la differenza di potenziale $V_A - V_B$ è direttamente proporzionale all'intensità di corrente $I$ che fluisce tra di essi:</p>\n<p>$$\\Delta V = V_A - V_B = R \\cdot I .$$</p>\n<p>La costante di proporzionalità $R$ è chiamata <strong>resistenza</strong> del conduttore. L'unità di misura è l'Ohm ($\\Omega$), definito come Volt/Ampere:</p>\n<p>$$[R] = [\\Omega] = \\frac{V}{A} .$$</p>"

href=\"#fisica2_lez13_doc_bulk-glyph0-5\" x=\"97.010615\" y=\"119.067442\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#fisica2_lez13_doc_bulk-glyph2-1\" x=\"101.74593\" y=\"120.094907\"/>\n  <use xlink:href=\"#fisica2_lez13_doc_bulk-glyph2-2\" x=\"105.003455\" y=\"120.094907\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#fisica2_lez13_doc_bulk-glyph0-3\" x=\"109.954674\" y=\"113.282717\"/>\n</g>\n<path style=\"fill:none;stroke-width:0.398;stroke-linecap:butt;stroke-linejoin:miter;stroke:rgb(0%,0%,0%);stroke-opacity:1;stroke-miterlimit:10;\" d=\"M -0.00148824 -0.0000729681 L 6.138626 -0.0000729681 \" transform=\"matrix(0.997538,0,0,-0.997538,108.790547,116.831958)\"/>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#fisica2_lez13_doc_bulk-glyph0-1\" x=\"108.790547\" y=\"125.133474\"/>\n</g>\n</g>\n</svg><figcaption><strong>Seconda legge di Ohm: lunghezza e sezione del filo</strong><span class=\"figure-explanation\">Filo omogeneo di lunghezza $\\ell$ e sezione costante $S$: la resistenza cresce con la lunghezza e diminuisce aumentando la sezione.</span></figcaption></figure><p>La resistenza di un conduttore dipende dalla sua <strong>geometria</strong> e dal <strong>materiale</strong> di cui è composto.</p>\n<p><strong>Enunciato.</strong> La resistenza $R$ di un conduttore <strong>omogeneo e isotropo</strong>, di lunghezza $\\ell$ e sezione trasversale $S$ <strong>costante</strong>, percorso da una corrente uniformemente distribuita sulla sezione, è data da</p>\n<p>$$R = \\rho_{\\mathrm{el}} \\frac{\\ell}{S} ,$$</p>\n<p>dove $\\rho_{\\mathrm{el}}$ (scritta semplicemente $\\rho$ quando non c'è ambiguità) è una costante caratteristica del materiale chiamata <strong>resistività</strong>, misurata in $\\Omega\\cdot m$.</p>\n<p><strong>Estrinseco vs intrinseco.</strong> La resistenza $R$ è una grandezza <strong>estrinseca</strong> (non intrinseca al materiale), poiché dipende dalle dimensioni geometriche del corpo; non è però estensiva in senso stretto: scalando tutte le dimensioni lineari di un fattore $k$ si ha $R \\to R/k$, dato che $\\ell$ cresce come $k$ e $S$ come $k^2$. La resistività $\\rho_{\\mathrm{el}}$, invece, è una grandezza <strong>intensiva</strong>, una proprietà intrinseca del materiale, indipendente dalla forma o dimensione del campione.</p>"
        },
        {
          "subtitle": "Dipendenza dalla temperatura",
          "content": "<p>La resistività dei materiali dipende dalla temperatura. Per molti conduttori, in un intervallo di temperature non troppo ampio, questa dipendenza è approssimativamente lineare:</p>\n<p>$$\\rho(T) = \\rho_0 \\left[ 1 + \\alpha (T - T_0) \\right]$$</p>\n<p>dove:</p>\n<ul>\n  <li>$\\rho_0$ è la resistività alla temperatura di riferimento $T_0$ (spesso $20^\\circ C$ o $293\\;K$);</li>\n  <li>$T$ è la temperatura;</li>\n  <li>$\\alpha$ è il <strong>coefficiente di temperatura</strong>, caratteristico del materiale.</li>\n</ul>\n<p>Per i metalli $\\alpha$ è <strong>positivo</strong>: la loro resistività (e quindi la resistenza) <strong>aumenta</strong> con la temperatura. Questo avviene perché l'aumento dell'agitazione termica degli atomi nel reticolo cristallino aumenta la probabilità di collisione per gli elettroni di conduzione, ostacolandone il moto.</p>"
        }
      ],
      "formulas": [
        {
          "label": "Prima legge di Ohm",
          "latex": "\\Delta V = V_A - V_B = R \\, I"

          "latex": "\\rho(T) = \\rho_0 \\left[ 1 + \\alpha (T - T_0) \\right]"

      "icon": "📍",
      "content": "<p>Le leggi di Ohm possono essere espresse in una forma <strong>locale</strong> (o puntuale), che lega i campi $\\vec{E}$ e $\\vec{J}$ punto per punto all'interno del materiale, indipendentemente dalla geometria complessiva.</p>",

ca2_lez13_doc_local-glyph0-9\" x=\"125.516394\" y=\"119.619576\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#fisica2_lez13_doc_local-glyph0-1\" x=\"147.977336\" y=\"119.619576\"/>\n  <use xlink:href=\"#fisica2_lez13_doc_local-glyph0-3\" x=\"152.737714\" y=\"119.619576\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#fisica2_lez13_doc_local-glyph1-2\" x=\"160.006723\" y=\"119.619576\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#fisica2_lez13_doc_local-glyph0-6\" x=\"169.705732\" y=\"119.619576\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#fisica2_lez13_doc_local-glyph0-1\" x=\"177.155166\" y=\"119.619576\"/>\n  <use xlink:href=\"#fisica2_lez13_doc_local-glyph0-2\" x=\"181.915544\" y=\"119.619576\"/>\n</g>\n</g>\n</svg><figcaption><strong>Il cilindretto infinitesimo per la legge di Ohm locale</strong><span class=\"figure-explanation\">Come negli appunti, si applica $\\Delta V=dR\\,dI$ al cilindretto di lunghezza $d\\ell$ e sezione $dS$. Le relazioni $\\Delta V=E\\,d\\ell$ e $dI=J\\,dS$ conducono a $\\vec E=\\rho_{\\mathrm{el}}\\vec J$.</span></figcaption></figure><p>Consideriamo un elemento infinitesimo di conduttore, un cilindretto di lunghezza $d\\ell$ e sezione $dS$, con l'asse <strong>orientato lungo il campo</strong>: chiamiamo A l'estremo di ingresso e B quello di uscita, con l'asse diretto da A a B parallelo a $\\vec{E}$.</p>\n<ul>\n  <li>La <strong>caduta di potenziale</strong> ai suoi capi (quantità positiva) è $\\Delta V_{\\mathrm{caduta}} = V_A - V_B = E\\,d\\ell$. Si noti che questa quantità va distinta dal differenziale del potenziale lungo lo spostamento, che vale $dV = -\\vec{E}\\cdot d\\vec{l}$ (di segno opposto).</li>\n  <li>La corrente che lo attraversa è $dI = J\\,dS$.</li>\n  <li>La sua resistenza è $dR = \\rho_{\\mathrm{el}} \\dfrac{d\\ell}{dS}$.</li>\n</ul>\n<p>Applicando la prima legge di Ohm in forma differenziale, $\\Delta V_{\\mathrm{caduta}} = dR \\cdot dI$, otteniamo</p>\n<p>$$E \\, d\\ell = \\left( \\rho_{\\mathrm{el}} \\frac{d\\ell}{dS} \\right) (J \\, dS) .$$</p>\n<p>Semplificando $d\\ell$ e $dS$ si ottiene la relazione tra i moduli dei campi:</p>\n<p>$$E = \\rho_{\\mathrm{el}} \\, J .$$</p>\n<p>Questa relazione può essere scritta in forma vettoriale, poiché in un materiale <strong>isotropo</strong> la corrente fluisce nella stessa direzione del campo elettrico che la genera.</p>"
        },
        {
          "subtitle": "Legge di Ohm in forma locale",
          "content": "<p><strong>In un materiale ohmico e isotropo, a temperatura fissata</strong>, il vettore densità di corrente $\\vec{J}$ è direttamente proporzionale al campo elettrico $\\vec{E}$:</p>\n<p>$$\\vec{J} = \\sigma \\vec{E} .$$</p>\n<p>La costante di proporzionalità $\\sigma$ è la <strong>conducibilità</strong> del materiale, definita come l'inverso della resistività:</p>\n<p>$$\\sigma = \\frac{1}{\\rho_{\\mathrm{el}}} .$$</p>\n<p>La relazione vale per un materiale <strong>ohmico e isotropo</strong>, a temperatura fissata. La conducibilità $\\sigma$ ha unità $\\mathrm{S/m}=(\\Omega\\,\\mathrm m)^{-1}$ e non va confusa con la densità superficiale di carica del condensatore.</p>"
        }
      ],
      "formulas": [
        {
          "label": "Relazione tra moduli",
          "latex": "E = \\rho_{\\mathrm{el}} J"
        },
        {
          "label": "Ohm in forma locale",
          "latex": "\\vec{J} = \\sigma \\vec{E}"
        },
        {
          "label": "Conducibilità",
          "latex": "\\sigma = \\frac{1}{\\rho_{\\mathrm{el}}}"
        }
      ]
    },
    {
      "id": "s13-modello-microscopico",
      "type": "section",
      "title": "Modello Microscopico della Conducibilità",
      "icon": "🔬",
      "content": "<p>La legge di Ohm in forma locale può essere derivata da un semplice <strong>modello classico</strong> del moto degli elettroni in un metallo.</p>",
      "subsections": [
        {
          "subtitle": "Ipotesi del modello",
          "content": "<ol>\n  <li>Gli elettroni di conduzione sono liberi di muoversi, ma subiscono continue <strong>collisioni</strong> con gli ioni del reticolo cristallino.</li>\n  <li>Tra una collisione e l'altra, un campo elettrico $\\vec{E}$ accelera gli elettroni con accelerazione $\\vec{a} = \\dfrac{\\vec{F}}{m} = \\dfrac{q\\vec{E}}{m}$, dove $q = -e$ e $m$ è la massa dell'elettrone.</li>\n  <li>Il moto complessivo non è un'accelerazione continua, ma una velocità media costante, detta <strong>velocità di deriva</strong> $\\vec{v}_d$, risultante dall'equilibrio tra l'accelerazione dovuta al campo e il \"freno\" dovuto agli urti.</li>\n</ol>"
        },
        {
          "subtitle": "Dal tempo fra gli urti alla conducibilità",
          "content": "<p>Fra due urti il campo accelera un portatore di carica $q$ e massa $m$ secondo $\\vec a=q\\vec E/m$. Introduciamo il tempo medio di rilassamento $\\tau$, che rappresenta l'effetto medio degli urti. Nel modello classico la velocità media di deriva è</p>\n<p>$$\\vec v_d=\\frac{q\\tau}{m}\\vec E.$$</p>\n<p>$\\tau$ non è un tempo di accelerazione che cresce senza limite: gli urti impediscono una deriva indefinitamente accelerata. È questo il significato da attribuire al tempo $t$ usato nella stima degli appunti.</p>\n<p>Con $n$ portatori per unità di volume (indicati con $N$ negli appunti),</p>\n<p>$$\\vec J=nq\\vec v_d=nq\\left(\\frac{q\\tau}{m}\\vec E\\right)=\\frac{nq^2\\tau}{m}\\vec E.$$</p>\n<p>Confrontando con $\\vec J=\\sigma\\vec E$ si riconosce</p>\n<p>$$\\sigma=\\frac{nq^2\\tau}{m}.$$</p>\n<p>Per gli elettroni $q=-e$: la deriva è opposta al campo, ma $q^2=e^2$ rende la conducibilità positiva e la corrente convenzionale concorde con il campo.</p>"
        }
      ],
      "formulas": [
        {
          "label": "Velocità di deriva",
          "latex": "\\vec v_d=\\frac{q\\tau}{m}\\vec E"
        },
        {
          "label": "Conducibilità microscopica",
          "latex": "\\sigma=\\frac{nq^2\\tau}{m}"
        }
      ]
    },
    {
      "id": "s13-resistenze-serie",
      "type": "section",
      "title": "Collegamento di Resistenze — Serie",
      "icon": "🔗",
      "content": "<p>Nei circuiti elettrici, le resistenze possono essere collegate in due modi fondamentali: <strong>in serie</strong> o <strong>in parallelo</strong>.</p>",
      "subsections": [
        {
          "subtitle": "Definizione di collegamento in serie",
          "content": "<p>Due o più resistenze sono <strong>in serie</strong> quando sono collegate una di seguito all'altra, in modo da essere attraversate <strong>dalla stessa corrente</strong>.</p>\n\n<p>Due resistenze $R_1$ e $R_2$ collegate in serie fra i nodi A e C, con nodo intermedio B.</p><figure class=\"figura\" data-id=\"fisica2_lez13_doc_series\"><svg id=\"fisica2_lez13_doc_series\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"319.445pt\" height=\"148.302pt\" viewBox=\"0 0 319.445 148.302\" version=\"1.2\"><style>#fisica2_lez13_doc_series [fill=\"rgb(0%,0%,0%)\"],#fisica2_lez13_doc_series [style*=\"fill:rgb(0%,0%,0%)\"]{fill:var(--text-primary)!important}#fisica2_lez13_doc_series [stroke=\"rgb(0%,0%,0%)\"],#fisica2_lez13_doc_series [style*=\"stroke:rgb(0%,0%,0%)\"]{stroke:var(--text-primary)!important}</style>\n<defs>\n<g>\n<symbol overflow=\"visible\" id=\"fisica2_lez13_doc_series-glyph0-0\">\n<path style=\"stroke:none;\" d=\"\"/>\n</symbol>\n<symbol overflow=\"visible\" id=\"fisica2_lez13_doc_series-glyph0-1\">\n<path style=\"stroke:none;\" d=\"M 3.046875 2.125 C 3.046875 2.078125 3.015625 2.046875 2.96875 1.984375 C 1.8125 0.9375 1.46875 -0.671875 1.46875 -2.234375 C 1.46875 -3.609375 1.734375 -5.296875 2.984375 -6.484375 C 3.03125 -6.515625 3.046875 -6.546875 3.046875 -6.59375 C 3.046875 -6.65625 3 -6.6875 2.9375 -6.6875 C 2.828125 -6.6875 2.03125 -6.046875 1.546875 -5.078125 C 1.109375 -4.21875 0.90625 -3.296875 0.90625 -2.234375 C 0.90625 -1.59375 0.984375 -0.578125 1.46875 0.46875 C 2 1.5625 2.828125 2.21875 2.9375 2.21875 C 3 2.21875 3.046875 2.1875 3.046875 2.125 Z M 3.046875 2.125 \"/>\n</symbol>\n<symbol overflow=\"visible\" id=\"fisica2_lez13_doc_series-glyph0-2\">\n<path style=\"stroke:none;\" d=\"M 4.4375 -0.796875 L 4.4375 -1.296875 L 4.1875 -1.296875 L 4.1875 -0.796875 C 4.1875 -0.703125 4.1875 -0.265625 3.859375 -0.265625 C 3.546875 -0.265625 3.546875 -0.6875 3.546875 -0.828125 L 3.546875 -2.39 =\"181.497016\" y=\"139.096328\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#fisica2_lez13_doc_series-glyph5-4\" x=\"185.62857\" y=\"138.104993\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#fisica2_lez13_doc_series-glyph5-1\" x=\"191.739104\" y=\"138.104993\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#fisica2_lez13_doc_series-glyph1-5\" x=\"201.425221\" y=\"138.104993\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#fisica2_lez13_doc_series-glyph1-1\" x=\"206.131056\" y=\"138.104993\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#fisica2_lez13_doc_series-glyph3-4\" x=\"213.073398\" y=\"139.096328\"/>\n  <use xlink:href=\"#fisica2_lez13_doc_series-glyph3-5\" x=\"216.577711\" y=\"139.096328\"/>\n</g>\n</g>\n</svg><figcaption><strong>Una resistenza e due resistenze in serie</strong><span class=\"figure-explanation\">Gli stessi nodi del PDF: il singolo resistore è tra $A$ e $B$; nella serie il nodo intermedio è $B$ e i capi complessivi sono $A$ e $C$. La corrente è la stessa nei due resistori.</span></figcaption></figure>"
        },
        {
          "subtitle": "Resistenza equivalente della serie",
          "content": "<p>La differenza di potenziale totale ai capi della serie, $V_A - V_C$, è la somma delle differenze di potenziale ai capi di ciascuna resistenza:</p>\n<p>$$V_A - V_C = (V_A - V_B) + (V_B - V_C) = I R_1 + I R_2 = I (R_1 + R_2) .$$</p>\n<p>Il sistema si comporta come un'unica resistenza, detta <strong>resistenza equivalente</strong> $R_{eq}$, data dalla <strong>somma</strong> delle singole resistenze:</p>\n<p>$$R_{eq} = R_1 + R_2 + \\dots + R_N = \\sum_{i=1}^N R_i .$$</p>"
        }
      ],
      "formulas": [
        {
          "label": "Resistenze in serie",
          "latex": "R_{eq} = \\sum_{i=1}^N R_i"
        }
      ],
      "extra_content": "<p><strong>Le luci dell'albero di Natale.</strong> Le vecchie luci dell'albero di Natale erano collegate in serie. Se una lampadina si bruciava, il circuito si interrompeva ($R_i \\to \\infty$) e tutte le luci si spegnevano, rendendo difficile trovare quella guasta.</p>"
    },
    {
      "id": "s13-resistenze-parallelo",
      "type": "section",
      "title": "Collegamento di Resistenze — Parallelo",
      "icon": "⚖️",

      "subsections": [
        {
          "subtitle": "Derivazione della resistenza equivalente",
          "content": "<p>La corrente totale $I$ che entra nel nodo A si suddivide in due correnti, $I_1$ e $I_2$, che attraversano rispettivamente $R_1$ e $R_2$:</p>\n<p>$$I = I_1 + I_2 .$$</p>\n<p>La differenza di potenziale $\\Delta V = V_A - V_B$ è la stessa per entrambe le resistenze:</p>\n<p>$$\\Delta V = I_1 R_1 \\quad \\Rightarrow \\quad I_1 = \\frac{\\Delta V}{R_1} ,$$</p>\n<p>$$\\Delta V = I_2 R_2 \\quad \\Rightarrow \\quad I_2 = \\frac{\\Delta V}{R_2} .$$</p>\n<p>Sostituendo nella legge dei nodi:</p>\n<p>$$I = \\frac{\\Delta V}{R_1} + \\frac{\\Delta V}{R_2} = \\Delta V \\left( \\frac{1}{R_1} + \\frac{1}{R_2} \\right) .$$</p>\n<p>Il sistema è equivalente a una singola resistenza $R_{eq}$ tale che $I = \\dfrac{\\Delta V}{R_{eq}}$. Confrontando le espressioni, <strong>l'inverso della resistenza equivalente è la somma degli inversi</strong> delle singole resistenze:</p>\n<p>$$\\frac{1}{R_{eq}} = \\frac{1}{R_1} + \\frac{1}{R_2} + \\dots + \\frac{1}{R_N} = \\sum_{i=1}^N \\frac{1}{R_i} .$$</p>"
        }
      ],
      "formulas": [

          "label": "Resistenze in parallelo",
          "latex": "\\frac{1}{R_{eq}} = \\sum_{i=1}^N \\frac{1}{R_i}"

          "label": "Legge dei nodi",
          "latex": "I = I_1 + I_2"
        }

      "title": "Teoria 1",
      "kind": "teoria",
      "source": "integrazione",
      "content": "<p>Definisci il vettore densità di corrente $\\vec{J}$ nel caso di più specie di portatori mobili e l'intensità di corrente $I$ attraverso una superficie orientata. Spiega poi perché la relazione $\\vec{J} = \\rho_{tot}\\,\\vec{v}_D$ è in generale falsa, usando come esempio un filo di rame percorso da corrente.</p>",
      "solution": "<p><strong>Definizione di $\\vec{J}$.</strong> Per una sola specie mobile di densità numerica $n$, carica $q$ (con il suo segno) e velocità di deriva $\\vec{v}_D$ si definisce $\\vec{J} = n q \\vec{v}_D$; se sono presenti più specie,</p>\n<p>$$\\vec{J} = \\sum_s n_s q_s \\vec{v}_s .$$</p>\n<p>L'unità SI è $A/m^2$.</p>\n<p><strong>Definizione di $I$.</strong> Data una superficie $S$ orientata da $\\hat{n}$, con $d\\vec{S} = \\hat{n}\\,dS$,</p>\n<p>$$I = \\int_S \\vec{J}\\cdot d\\vec{S} :$$</p>\n<p>$I$ è la carica netta che transita attraverso $S$ nel verso di $\\hat{n}$ per unità di tempo, si misura in Ampere ($1\\,A = 1\\,C/s$) e il suo segno dipende dall'orientazione scelta (invertendo $\\hat{n}$ si inverte il segno di $I$). $\\vec{J}$ è una grandezza <em>locale</em>, $I$ una grandezza <em>integrale</em> legata a una particolare superficie.</p>\n<p><strong>Perché $\\vec{J} = \\rho_{tot}\\vec{v}_D$ è falsa.</strong> La densità di carica totale è</p>\n<p>$$\\rho_{tot} = \\sum_s n_s q_s + \\rho_{\\text{fissa}} ,$$</p>\n<p>dove $\\rho_{\\text{fissa}}$ è il contributo delle cariche immobili. In $\\vec{J}$ entrano <em>solo</em> le cariche in moto, pesate dalla loro velocità, mentre in $\\rho_{tot}$ entrano <em>tutte</em> le cariche. Perciò $\\vec{J} = \\rho\\,\\vec{v}_D$ è lecita solo se $\\rho$ è la densità della singola specie in moto.</p>\n<p><strong>Esempio del rame.</strong> Gli elettroni di conduzione hanno</p>\n<p>$$\\rho_e = n q_e = -n e \\approx -1{,}4\\cdot 10^{10}\\;C/m^3 , \\qquad \\vec{v}_D \\neq 0 ,$$</p>\n<p>dunque $\\vec{J} = \\rho_e \\vec{v}_D \\neq 0$. Il reticolo di ioni positivi immobili fornisce $\\rho_{\\text{fissa}} = +n e$, cosicché $\\rho_{tot} = 0$. Se si scrivesse $\\vec{J} = \\rho_{tot}\\vec{v}_D$ si otterrebbe $\\vec{J} = 0$: <strong>assurdo</strong>. Quindi un conduttore globalmente neutro può avere corrente non nulla.</p>"
    },
    {
      "id": "s13-es-teoria-2",
      "type": "esercizio",
      "title": "Teoria 2",
      "kind": "teoria",
      "source": "integrazione",
      "content": "<p>Enuncia l'equazione di continuità della carica e spiega perché, durante la carica di un condensatore, essa è incompatibile con la condizione $\\nabla\\cdot\\vec{J} = 0$. Definisci poi la densità di corrente di spostamento e dimostra che il campo $\\vec{J} + \\vec{J}_S$ è sempre solenoidale.</p>",
      "solution": "<p><strong>1) Equazione di continuità.</strong></p>\n<p>$$\\nabla \\cdot \\vec{J} + \\frac{\\partial \\rho}{\\partial t} = 0 .$$</p>\n<p>Quando non vi è accumulo locale, cioè quando $\\partial\\rho/\\partial t = 0$, segue $\\nabla\\cdot\\vec{J} = 0$, cioè $\\vec{J}$ solenoidale. Questo vale in regime stazionario, ma anche per alcune correnti variabili nel tempo (ad esempio $\\vec{J} = \\vec{J}_0\\cos\\omega t$ con $\\vec{J}_0$ uniforme nello spazio).</p>\n<p><strong>2) Il condensatore in carica.</strong> Prendendo una superficie chiusa $\\Sigma$ che racchiude una sola armatura, entra la corrente di conduzione $I$ dal filo e non esce nulla (tra le armature non ci sono cariche libere in moto):</p>\n<p>$$\\oint_\\Sigma \\vec{J} \\cdot d\\vec{S} = -I \\neq 0 \\quad \\Rightarrow \\quad \\nabla \\cdot \\vec{J} \\neq 0 .$$</p>\n<p>Coerentemente la carica sull'armatura cresce, $\\dfrac{dQ}{dt} = I \\gt 0$, cioè $\\partial\\rho/\\partial t \\neq 0$.</p>\n<p><strong>3) Corrente di spostamento.</strong> Nel vuoto si definisce</p>\n<p>$$\\vec{J}_S = \\epsilon_0 \\frac{\\partial \\vec{E}}{\\partial t} ,$$</p>\n<p>mentre in un dielettrico, se si usa la sola corrente libera, $\\vec{J}_S = \\partial\\vec{D}/\\partial t$ (le due convenzioni non vanno mescolate).</p>\n<p><strong>4) Dimostrazione della solenoidalità.</strong> Dalla legge di Gauss in forma locale $\\nabla\\cdot\\vec{E} = \\rho/\\epsilon_0$ segue, scambiando le derivate spaziali e temporale,</p>\n<p>$$\\nabla \\cdot \\vec{J}_S = \\epsilon_0 \\frac{\\partial}{\\partial t}(\\nabla \\cdot \\vec{E}) = \\frac{\\partial \\rho}{\\partial t} .$$</p>\n<p>Sommando con l'equazione di continuità:</p>\n<p>$$\\nabla \\cdot (\\vec{J} + \\vec{J}_S) = -\\frac{\\partial \\rho}{\\partial t} + \\frac{\\partial \\rho}{\\partial t} = 0$$</p>\n<p><strong>sempre</strong>, anche in regime non stazionario.</p>\n<p><strong>5) Verifica sul condensatore.</strong> La corrente di conduzione $I$ che arriva sull'armatura è esattamente uguale alla corrente di spostamento che attraversa l'intercapedine: da $Q = \\epsilon_0 E S$ segue</p>\n<p>$$I = \\frac{dQ}{dt} = \\epsilon_0 S \\frac{dE}{dt} = I_S .$$</p>"
    },
    {
      "id": "s13-es-teoria-3",
      "type": "esercizio",
      "title": "Teoria 3",
      "kind": "teoria",
      "source": "integrazione",
      "content": "<p>Ricava l'equazione di continuità in forma differenziale a partire dal bilancio di carica in forma integrale, elencando tutte le ipotesi usate e precisando quale densità di carica vi compare. Mostra poi con un controesempio che $\\partial\\rho/\\partial t = 0$ non implica $\\partial\\vec{J}/\\partial t = 0$.</p>",
      "solution": "<p><strong>1) Bilancio in forma integrale.</strong> Si consideri una superficie chiusa $S$ <em>fissa nel tempo</em>, con normale <em>uscente</em>, che racchiude il volume $V$. La conservazione della carica afferma che la corrente netta uscente uguaglia la diminuzione della carica interna:</p>\n<p>$$\\oint_S \\vec{J}\\cdot d\\vec{S} = -\\frac{dQ_{int}}{dt}, \\qquad Q_{int} = \\int_V \\rho_{tot}\\,dV ,$$</p>\n<p>con $\\rho_{tot}$ densità di carica <strong>totale</strong> (comprese le cariche immobili), la stessa che compare nella legge di Gauss.</p>\n<p><strong>2) Teorema della divergenza</strong> (applicabile perché $\\vec{J}$ è regolare in $V$):</p>\n<p>$$\\oint_S \\vec{J}\\cdot d\\vec{S} = \\int_V (\\nabla\\cdot\\vec{J})\\,dV .$$</p>\n<p><strong>3) Derivata temporale dentro l'integrale</strong> (lecito perché $V$ è fisso):</p>\n<p>$$-\\frac{d}{dt}\\int_V \\rho_{tot}\\,dV = -\\int_V \\frac{\\partial\\rho_{tot}}{\\partial t}\\,dV .$$</p>\n<p><strong>4) Localizzazione.</strong> Si ottiene</p>\n<p>$$\\int_V \\left(\\nabla\\cdot\\vec{J} + \\frac{\\partial\\rho_{tot}}{\\partial t}\\right) dV = 0$$</p>\n<p>e, dovendo valere per $V$ <em>arbitrario</em> con integrando continuo, l'integrando è nullo punto per punto:</p>\n<p>$$\\nabla\\cdot\\vec{J} + \\frac{\\partial\\rho_{tot}}{\\partial t} = 0 .$$</p>\n<p><strong>Ipotesi usate:</strong> $S$ chiusa e fissa, normale uscente, $V$ fisso e arbitrario, campi regolari, $\\rho$ densità <em>totale</em>.</p>\n<p><strong>5) Controesempio.</strong> $\\partial\\rho/\\partial t = 0$ equivale, per l'equazione appena ricavata, a $\\nabla\\cdot\\vec{J} = 0$, cioè assenza di accumulo locale; ma non dice nulla sulla dipendenza temporale di $\\vec{J}$. Si prenda</p>\n<p>$$\\vec{J}(\\vec{r},t) = \\vec{J}_0 \\cos(\\omega t), \\qquad \\vec{J}_0 \\ \\text{costante e uniforme nello spazio}.$$</p>\n<p>Allora</p>\n<p>$$\\nabla\\cdot\\vec{J} = \\cos(\\omega t)\\,(\\nabla\\cdot\\vec{J}_0) = 0 \\quad \\text{in ogni istante} \\quad \\Rightarrow \\quad \\frac{\\partial\\rho}{\\partial t} = 0 ,$$</p>\n<p>$$\\text{mentre} \\qquad \\frac{\\partial\\vec{J}}{\\partial t} = -\\omega \\vec{J}_0 \\sin(\\omega t) \\neq 0 :$$</p>\n<p>nessun accumulo di carica, ma regime non stazionario. La stazionarietà ($\\partial\\rho/\\partial t = 0$ <em>e</em> $\\partial\\vec{J}/\\partial t = 0$) è dunque una richiesta più forte.</p>\n<p><strong>6) Avvertenza.</strong> È l'<strong>uniformità spaziale</strong>, non l'andamento temporale, a garantire la divergenza nulla: in un circuito in alternata con condensatore si ha $\\partial\\rho/\\partial t \\neq 0$ sulle armature e quindi $\\nabla\\cdot\\vec{J} \\neq 0$.</p>"
    },
    {
      "id": "s13-es-teoria-4",
      "type": "esercizio",
      "title": "Teoria 4",
      "kind": "teoria",
      "source": "integrazione",
      "content": "<p>Ricava la legge di Ohm in forma locale $\\vec{J} = \\sigma\\vec{E}$ applicando le due leggi di Ohm a un cilindretto infinitesimo di conduttore; ricava poi l'espressione microscopica della conducibilità col modello classico degli urti e spiega perché nei metalli il coefficiente $\\alpha$ è positivo.</p>",
      "solution": "<p><strong>1) Derivazione locale.</strong> Cilindretto di lunghezza $dL$ e sezione $dS$, con $\\vec{E}$ parallelo all'asse (orientato da A a B):</p>\n<p>$$\\Delta V_{\\mathrm{caduta}} = V_A - V_B = E\\,dL, \\qquad dI = J\\,dS, \\qquad dR = \\rho_{\\mathrm{el}} \\frac{dL}{dS} .$$</p>\n<p>La prima legge di Ohm $\\Delta V_{\\mathrm{caduta}} = dR\\,dI$ dà</p>\n<p>$$E\\,dL = \\rho_{\\mathrm{el}} \\frac{dL}{dS} \\, J\\,dS = \\rho_{\\mathrm{el}} J\\,dL ,$$</p>\n<p>da cui $E = \\rho_{\\mathrm{el}} J$, cioè</p>\n<p>$$J = \\frac{1}{\\rho_{\\mathrm{el}}} E = \\sigma E .$$</p>\n<p>In un materiale omogeneo e isotropo $\\vec{J}$ è parallelo a $\\vec{E}$ e quindi $\\vec{J} = \\sigma\\vec{E}$ con $\\sigma = 1/\\rho_{\\mathrm{el}}$.</p>\n<p><strong>2) Modello microscopico.</strong> Tra due urti successivi il campo accelera i portatori con $\\vec{a} = q\\vec{E}/m$; se $\\tau$ è il tempo medio tra due urti, la velocità media di deriva è</p>\n<p>$$\\vec{v}_d = \\frac{q\\vec{E}}{m}\\tau$$</p>\n<p>(per gli elettroni $q = -e$, quindi $\\vec{v}_d$ è antiparallela a $\\vec{E}$). Da $\\vec{J} = n q \\vec{v}_d$ segue</p>\n<p>$$\\vec{J} = \\frac{n q^2 \\tau}{m}\\vec{E} \\quad \\Rightarrow \\quad \\sigma = \\frac{n q^2 \\tau}{m} = \\frac{n e^2 \\tau}{m}, \\qquad \\rho_{\\mathrm{el}} = \\frac{m}{n e^2 \\tau} .$$</p>\n<p><strong>3) Perché $\\alpha \\gt 0$ nei metalli.</strong> Nei metalli $n$ è praticamente indipendente da $T$, mentre l'agitazione termica del reticolo aumenta la frequenza degli urti, cioè fa <strong>diminuire</strong> $\\tau$. Quindi $\\rho_{\\mathrm{el}} = m/(ne^2\\tau)$ cresce con $T$ e nella legge $\\rho(T) = \\rho_0[1 + \\alpha(T - T_0)]$ risulta $\\alpha \\gt 0$.</p>"
    },
    {
      "id": "s13-es-scritto-1",
      "type": "esercizio",
      "title": "Scritto 1",
      "kind": "scritto",
      "source": "integrazione",
      "content": "<p>In un filo cilindrico rettilineo di raggio $R = 1{,}0\\;mm$ la densità di corrente è parallela all'asse e dipende dalla distanza $r$ dall'asse secondo $\\vec{J}(r) = J_0 \\dfrac{r}{R}\\,\\hat{z}$, con $J_0 = 1{,}5\\cdot 10^{6}\\;A/m^2$.</p>\n<p>(a) Calcola l'intensità di corrente $I$ che attraversa la sezione del filo.<br>\n(b) Determina la densità di corrente media $J_{med} = I/(\\pi R^2)$.<br>\n(c) Verifica che $\\nabla\\cdot\\vec{J} = 0$ e di' se il regime può essere stazionario.<br>\n(d) Stima il modulo della velocità di deriva degli elettroni sul bordo $r = R$, assumendo $n = 8{,}5\\cdot 10^{28}\\;m^{-3}$ e $e = 1{,}6\\cdot 10^{-19}\\;C$.</p>",
      "solution": "<p><strong>(a) Intensità di corrente.</strong> Orientiamo la sezione con $\\hat{n} = \\hat{z}$, così $d\\vec{S} = \\hat{z}\\,dS$ e, usando corone circolari $dS = 2\\pi r\\,dr$:</p>\n<p>$$I = \\int_S \\vec{J}\\cdot d\\vec{S} = \\int_0^R J_0\\frac{r}{R}\\,2\\pi r\\,dr$$</p>\n<p>$$= \\frac{2\\pi J_0}{R}\\int_0^R r^2\\,dr = \\frac{2\\pi J_0}{R}\\cdot\\frac{R^3}{3} = \\frac{2}{3}\\pi J_0 R^2 .$$</p>\n<p>Numericamente, con $R^2 = 1{,}0\\cdot 10^{-6}\\;m^2$:</p>\n<p>$$I = \\frac{2}{3}\\pi (1{,}5\\cdot 10^{6})(1{,}0\\cdot 10^{-6}) = \\pi \\approx 3{,}1\\;A .$$</p>\n<p><strong>(b) Densità media.</strong></p>\n<p>$$J_{med} = \\frac{I}{\\pi R^2} = \\frac{(2/3)\\pi J_0 R^2}{\\pi R^2} = \\frac{2}{3}J_0 = 1{,}0\\cdot 10^{6}\\;A/m^2 ,$$</p>\n<p>minore di $J_0$ perché la corrente è addensata verso il bordo.</p>\n<p><strong>(c) Divergenza e stazionarietà.</strong> Il campo ha una sola componente, $J_z = J_0 r/R$, che non dipende da $z$; quindi</p>\n<p>$$\\nabla\\cdot\\vec{J} = \\frac{\\partial J_x}{\\partial x} + \\frac{\\partial J_y}{\\partial y} + \\frac{\\partial J_z}{\\partial z} = 0 + 0 + 0 = 0 .$$</p>\n<p>Per l'equazione di continuità $\\partial\\rho/\\partial t = -\\nabla\\cdot\\vec{J} = 0$: non c'è accumulo di carica in alcun punto, dunque il regime è compatibile con la stazionarietà (e, non dipendendo $\\vec{J}$ dal tempo, è effettivamente stazionario). Il campo $\\vec{J}$ è solenoidale: il flusso attraverso due sezioni diverse del filo è lo stesso.</p>\n<p><strong>(d) Velocità di deriva al bordo.</strong> Sul bordo $J(R) = J_0$ e, dal modulo di $\\vec{J} = n q \\vec{v}_D$ con $|q| = e$:</p>\n<p>$$v_D = \\frac{J_0}{n e} = \\frac{1{,}5\\cdot 10^{6}}{(8{,}5\\cdot 10^{28})(1{,}6\\cdot 10^{-19})} = \\frac{1{,}5\\cdot 10^{6}}{1{,}36\\cdot 10^{10}} \\approx 1{,}1\\cdot 10^{-4}\\;m/s ,$$</p>\n<p>cioè circa un decimo di millimetro al secondo; il verso del moto degli elettroni è opposto a $\\hat{z}$, essendo $q = -e$.</p>"
    },
    {
      "id": "s13-es-scritto-2",
      "type": "esercizio",
      "title": "Scritto 2",
      "kind": "scritto",
      "source": "integrazione",
      "content": "<p>Un filo di rame di lunghezza $L = 10\\;m$ e diametro $d = 1.0\\;mm$ ha resistività $\\rho_0 = 1.68\\times 10^{-8}\\;\\Omega\\cdot m$ a $T_0 = 20\\,{}^\\circ C$ e coefficiente di temperatura $\\alpha = 3.9\\times 10^{-3}\\;K^{-1}$. Ai suoi capi è applicata una d.d.p. costante $\\Delta V = 1.5\\;V$.</p>\n<p>Calcola: (a) la resistenza a $20\\,{}^\\circ C$; (b) la corrente, il modulo di $\\vec{J}$ e quello di $\\vec{E}$ nel filo; (c) la velocità di deriva degli elettroni sapendo che $n = 8.5\\times 10^{28}\\;m^{-3}$; (d) la resistenza e la corrente se il filo viene portato a $120\\,{}^\\circ C$.</p>",
      "solution": "<p><strong>(a) Resistenza a $20\\,{}^\\circ C$.</strong> Sezione:</p>\n<p>$$S = \\frac{\\pi d^2}{4} = \\frac{\\pi (1.0\\times 10^{-3})^2}{4} = 7.85\\times 10^{-7}\\;m^2 .$$</p>\n<p>Seconda legge di Ohm:</p>\n<p>$$R = \\rho_0 \\frac{L}{S} = \\frac{1.68\\times 10^{-8}\\cdot 10}{7.85\\times 10^{-7}} = 0.214\\;\\Omega .$$</p>\n<p><strong>(b) Corrente, $J$ ed $E$.</strong> Prima legge di Ohm:</p>\n<p>$$I = \\frac{\\Delta V}{R} = \\frac{1.5}{0.214} = 7.0\\;A .$$</p>\n<p>$$J = \\frac{I}{S} = \\frac{7.0}{7.85\\times 10^{-7}} = 8.9\\times 10^{6}\\;A/m^2 .$$</p>\n<p>$$E = \\rho_0 J = 1.68\\times 10^{-8}\\cdot 8.9\\times 10^{6} = 0.15\\;V/m ,$$</p>\n<p>in accordo con $E = \\Delta V/L = 1.5/10 = 0.15\\;V/m$.</p>\n<p><strong>(c) Velocità di deriva.</strong> Da $J = n e v_d$:</p>\n<p>$$v_d = \\frac{J}{n e} = \\frac{8.9\\times 10^{6}}{8.5\\times 10^{28}\\cdot 1.60\\times 10^{-19}} = 6.6\\times 10^{-4}\\;m/s \\approx 0.66\\;mm/s ,$$</p>\n<p>diretta in senso opposto a $\\vec{E}$, perché la carica dell'elettrone è negativa.</p>\n<p><strong>(d) A $120\\,{}^\\circ C$.</strong></p>\n<p>$$\\rho(120\\,{}^\\circ C) = \\rho_0[1 + \\alpha (T - T_0)] = 1.68\\times 10^{-8}[1 + 3.9\\times 10^{-3}\\cdot 100]$$</p>\n<p>$$= 1.68\\times 10^{-8}\\cdot 1.39 = 2.34\\times 10^{-8}\\;\\Omega\\cdot m ,$$</p>\n<p>quindi</p>\n<p>$$R(120\\,{}^\\circ C) = R\\cdot 1.39 = 0.297\\;\\Omega , \\qquad I = \\frac{1.5}{0.297} = 5.1\\;A :$$</p>\n<p>la corrente diminuisce perché nei metalli $\\alpha \\gt 0$.</p>"
    },
    {
      "id": "s13-es-scritto-3",
      "type": "esercizio",
      "title": "Scritto 3",
      "kind": "scritto",
      "source": "integrazione",
      "content": "<p>In una regione di spazio la densità di corrente è $\\vec{J}(\\vec{r},t) = \\beta\\,x\\,e^{-t/\\tau}\\,\\hat{x}$, con $\\beta = 3{,}0\\;A/m^3$ e $\\tau = 2{,}0\\;ms$; all'istante $t = 0$ la densità di carica è nulla in ogni punto.</p>\n<p>(a) Calcola $\\nabla\\cdot\\vec{J}$.<br>\n(b) Scrivi $\\partial\\rho/\\partial t$ e ricava $\\rho(t)$.<br>\n(c) Calcola $\\rho$ per $t\\to+\\infty$.<br>\n(d) Calcola la corrente netta uscente da un cubo di lato $L = 10\\;cm$ interno alla regione all'istante $t = 0$.<br>\n(e) Il regime è stazionario? La legge di Ampere nella forma $\\nabla\\times\\vec{B} = \\mu_0\\vec{J}$ è applicabile?</p>",
      "solution": "<p><strong>(a) Divergenza.</strong> Il campo ha solo componente $x$, $J_x = \\beta x e^{-t/\\tau}$, mentre $J_y = J_z = 0$; dunque</p>\n<p>$$\\nabla\\cdot\\vec{J} = \\frac{\\partial}{\\partial x}\\left(\\beta x e^{-t/\\tau}\\right) = \\beta e^{-t/\\tau} ,$$</p>\n<p>uniforme nello spazio e positiva.</p>\n<p><strong>(b) Densità di carica.</strong> Dall'equazione di continuità</p>\n<p>$$\\frac{\\partial\\rho}{\\partial t} = -\\nabla\\cdot\\vec{J} = -\\beta e^{-t/\\tau} \\lt 0 :$$</p>\n<p>la densità di carica diminuisce, in ogni punto allo stesso modo (da ogni volumetto esce più corrente di quanta ne entri, perché la componente $J_x$ cresce con $x$). Integrando in $t$ con $\\rho(0) = 0$:</p>\n<p>$$\\rho(t) = -\\beta\\int_0^t e^{-t'/\\tau}dt' = -\\beta\\tau\\left(1 - e^{-t/\\tau}\\right) .$$</p>\n<p><strong>(c) Limite asintotico.</strong></p>\n<p>$$\\rho(\\infty) = -\\beta\\tau = -(3{,}0)(2{,}0\\cdot 10^{-3}) = -6{,}0\\cdot 10^{-3}\\;C/m^3 ;$$</p>\n<p>la carica negativa accumulata è finita perché la corrente si spegne esponenzialmente.</p>\n<p><strong>(d) Corrente uscente dal cubo.</strong> Con il teorema della divergenza, per un cubo di volume $V = L^3 = 1{,}0\\cdot 10^{-3}\\;m^3$ e normale uscente:</p>\n<p>$$I_{usc} = \\oint_S \\vec{J}\\cdot d\\vec{S} = \\int_V (\\nabla\\cdot\\vec{J})\\,dV = \\beta e^{-t/\\tau} L^3 ,$$</p>\n<p>che a $t = 0$ vale</p>\n<p>$$I_{usc}(0) = (3{,}0)(1{,}0\\cdot 10^{-3}) = 3{,}0\\cdot 10^{-3}\\;A = 3{,}0\\;mA$$</p>\n<p>(indipendente dalla posizione del cubo, perché la divergenza è uniforme). Coerentemente $dQ_{int}/dt = -I_{usc} = -3{,}0\\;mA$ a $t = 0$.</p>\n<p><strong>(e) Regime e legge di Ampere.</strong> Il regime <strong>non</strong> è stazionario: sia $\\rho$ sia $\\vec{J}$ dipendono dal tempo e, soprattutto, $\\nabla\\cdot\\vec{J} \\neq 0$, cioè c'è accumulo locale di carica.</p>\n<p>La legge di Ampere nella forma $\\nabla\\times\\vec{B} = \\mu_0\\vec{J}$ <strong>non è applicabile</strong>, perché imporrebbe $\\nabla\\cdot\\vec{J} = 0$ (la divergenza di un rotore è identicamente nulla), in contrasto con il risultato del punto (a); occorre la forma di Ampere-Maxwell con la corrente di spostamento, per cui $\\nabla\\cdot(\\vec{J} + \\epsilon_0\\,\\partial\\vec{E}/\\partial t) = 0$.</p>"
    },
    {
      "id": "s13-es-scritto-4",
      "type": "esercizio",
      "title": "Scritto 4",
      "kind": "scritto",
      "source": "integrazione",
      "content": "<p>Le resistenze $R_2 = 6.0\\;\\Omega$ e $R_3 = 3.0\\;\\Omega$ sono collegate in parallelo e l'insieme è in serie con $R_1 = 4.0\\;\\Omega$. Ai capi dell'intera rete è applicata una d.d.p. $\\Delta V = 12\\;V$.</p>\n<p>Calcola la resistenza equivalente, la corrente erogata, le d.d.p. ai capi di $R_1$ e del parallelo, le correnti in $R_2$ e $R_3$, e verifica la legge dei nodi.</p>",
      "solution": "<p><strong>1) Parallelo $R_2 \\parallel R_3$.</strong></p>\n<p>$$\\frac{1}{R_{23}} = \\frac{1}{6.0} + \\frac{1}{3.0} = \\frac{1}{6.0} + \\frac{2}{6.0} = \\frac{3}{6.0} \\quad \\Rightarrow \\quad R_{23} = 2.0\\;\\Omega$$</p>\n<p>(coerentemente $R_{23} \\lt \\min(R_2,R_3) = 3.0\\;\\Omega$).</p>\n<p><strong>2) Serie.</strong></p>\n<p>$$R_{eq} = R_1 + R_{23} = 4.0 + 2.0 = 6.0\\;\\Omega .$$</p>\n<p><strong>3) Corrente erogata.</strong></p>\n<p>$$I = \\frac{\\Delta V}{R_{eq}} = \\frac{12}{6.0} = 2.0\\;A .$$</p>\n<p><strong>4) D.d.p. parziali.</strong> Poiché $R_1$ è in serie, è percorsa da tutta la corrente:</p>\n<p>$$\\Delta V_1 = R_1 I = 4.0\\cdot 2.0 = 8.0\\;V .$$</p>\n<p>$$\\Delta V_{23} = \\Delta V - \\Delta V_1 = 12 - 8.0 = 4.0\\;V$$</p>\n<p>(verifica: $R_{23} I = 2.0\\cdot 2.0 = 4.0\\;V$).</p>\n<p><strong>5) Correnti nei rami.</strong></p>\n<p>$$I_2 = \\frac{\\Delta V_{23}}{R_2} = \\frac{4.0}{6.0} = 0.67\\;A , \\qquad I_3 = \\frac{\\Delta V_{23}}{R_3} = \\frac{4.0}{3.0} = 1.33\\;A .$$</p>\n<p><strong>6) Legge dei nodi.</strong></p>\n<p>$$I_2 + I_3 = 0.67 + 1.33 = 2.0\\;A = I ,$$</p>\n<p>verificata. Il ramo di resistenza minore porta la corrente maggiore, con $I_2/I_3 = R_3/R_2 = 1/2$.</p>"
    },
    {
      "id": "s13-approfondimenti",
      "type": "section",
      "title": "Approfondimenti e richiami facoltativi",
      "icon": "📚",
      "content": "<p>Il percorso principale segue gli appunti della lezione. Qui restano disponibili i richiami alla lezione precedente, gli esempi aggiuntivi e le precisazioni utili per approfondire.</p><details id=\"s13-richiami-corrente\"><summary><strong>Richiami sulla Corrente e Densità di Corrente</strong></summary><p>Consideriamo un conduttore di forma qualsiasi in cui si muovono dei portatori di carica. Per studiare il flusso di carica, costruiamo un cilindretto infinitesimo di volume $dV$ appoggiato su un elemento di superficie $dS$.</p>\n<p>Conviene fissare subito le <strong>convenzioni di orientazione</strong>. Scegliamo sulla superficie una normale $\\hat{n}$ e poniamo</p>\n<p>$$d\\vec{S} = \\hat{n} \\, dS .$$</p>\n<p>La scelta di $\\hat{n}$ è arbitraria per una superficie aperta (ma va mantenuta coerentemente in tutto il calcolo); per una superficie chiusa si adotta la convenzione della normale <em>uscente</em>.</p>\n<h4>Carica contenuta in un volumetto</h4>\n<p>Consideriamo per il momento <em>una sola specie</em> di portatori mobili, con densità numerica $n$ e carica $q$ per portatore. La carica contenuta in un volumetto $dV$ è</p>\n<p>$$dQ = n q \\, dV$$</p>\n<p>dove:</p>\n<ul>\n  <li>$n$ è il numero di portatori di carica <em>di quella specie</em> per unità di volume (dimensione $[L^{-3}]$, si misura in $m^{-3}$, essendo il numero di portatori adimensionale);</li>\n  <li>$q$ è la carica di un singolo portatore, <strong>con il suo segno</strong> (per gli elettroni di conduzione $q = -e$);</li>\n  <li>$dV$ è il volume infinitesimo del cilindretto.</li>\n</ul>\n<h4>Il cilindretto obliquo e la proiezione sulla normale</h4>\n<p>Se i portatori si muovono con velocità di deriva $\\vec{v}_D$, nel tempo $dt$ essi compiono lo spostamento $\\vec{v}_D \\, dt$. Il cilindretto che effettivamente attraversa $dS$ ha come altezza la <em>proiezione</em> di tale spostamento sulla normale, dunque il suo volume geometrico (una quantità intrinsecamente positiva) è</p>\n<p>$$dV = \\left| \\vec{v}_D \\cdot \\hat{n} \\right| dS \\, dt .$$</p>\n<figure class=\"figura\" data-id=\"fisica2_lez13a_d1\"><?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<svg id=\"fisica2_lez13a_d1\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"231.855pt\" height=\"120.353pt\" viewBox=\"0 0 231.855 120.353\" version=\"1.2\"><style>#fisica2_lez13a_d1 [fill=\"rgb(95.999146%,95.999146%,100%)\"],#fisica2_lez13a_d1 [style*=\"fill:rgb(95.999146%,95.999146%,100%)\"]{fill:var(--bg-primary)!important}#fisica2_lez13a_d1 [stroke=\"rgb(95.999146%,95.999146%,100%)\"],#fisica2_lez13a_d1 [style*=\"stroke:rgb(95.999146%,95.999146%,100%)\"]{stroke:var(--bg-primary)!important}#fisica2_lez13a_d1 [fill=\"rgb(39.99939%,39.99939%,100%)\"],#fisica2_lez13a_d1 [style*=\"fill:rgb(39.99939%,39.99939%,100%)\"]{fill:#6666ff!important}[data-mode=\"light\"] #fisica2_lez13a_d1 [fill=\"rgb(39.99939%,39.99939%,100%)\"],[data-mode=\"light\"] #fisica2_lez13a_d1 [style*=\"fill:rgb(39.99939%,39.99939%,100%)\"]{fill:#6666ff!important}#fisica2_lez13a_d1 [stroke=\"rgb(39.99939%,39.99939%,100%)\"],#fisica2_lez13a_d1 [style*=\"stroke:rgb(39.99939%,39.99939%,100%)\"]{stroke:#6666ff!important}[data-mode=\"light\"] #fisica2_lez13a_d1 [stroke=\"rgb(39.99939%,39.99939%,100%)\"],[data-mode=\"light\"] #fisica2_lez13a_d1 [style*=\"stroke:rgb(39.99939%,39.99939%,100%)\"]{stroke:#6666ff!important}#fisica2_lez13a_d1 [fill=\"rgb(39.99939%,39.99939%,39.99939%)\"],#fisica2_lez13a_d1 [style*=\"fill:rgb(39.99939%,39.99939%,39.99939%)\"]{fill:#adadad!important}[data-mode=\"light\"] #fisica2_lez13a_d1 [fill=\"rgb(39.99939%,39.99939%,39.99939%)\"],[data-mode=\"light\"] #fisica2_lez13a_d1 [style*=\"fill:rgb(39.99939%,39.99939%,39.99939%)\"]{fill:#666666!important}#fisica2_lez13a_d1 [stroke=\"rgb(39.99939%,39.99939%,39.99939%)\"],#fisica2_lez13a_d1 [style*=\"stroke:rgb(39.99939%,39.99939%,39.99939%)\"]{stroke:#adadad!important}[data-mode=\"light\"] #fisica2_lez13a_d1 [stroke=\"rgb(39.
