            content: `<p>Sia $A$ un insieme non vuoto, chiamato <strong>alfabeto</strong>. L'insieme $A^*$ contiene tutte le sequenze finite di elementi di $A$, chiamate <strong>parole</strong>:</p><p>$$A^*:=\\bigcup_{n=0}^{\\infty}A^n.$$</p><p>$A^n$ è l'insieme delle sequenze di lunghezza $n$. L'unico elemento di $A^0$ è la <strong>parola vuota</strong>.</p><p>Definiamo la <strong>concatenazione</strong>, o <strong>giustapposizione</strong>:</p><p>$$\\cdot:A^*\\times A^*\\to A^*,\\qquad(p,q)\\mapsto p\\cdot q.$$</p><p>Se $p=a_1a_2\\dots a_r\\in A^r$ e $q=a'_1a'_2\\dots a'_s\\in A^s$, allora:</p><p>$$p\\cdot q:=a_1a_2\\dots a_r a'_1a'_2\\dots a'_s\\in A^{r+s}.$$</p><p>La struttura $(A^*,\\cdot)$ è un <strong>monoide</strong>: la concatenazione è associativa e il neutro è la parola vuota.</p><p>Non è un gruppo: l'unico elemento invertibile è la parola vuota. In genere non è commutativo. Si chiama <strong>monoide libero</strong> o <strong>linguaggio libero</strong> su $A$.</p>`

            content: `<p>Dimostrare che l'elemento neutro di un gruppoide, quando esiste, è unico. Dimostrare inoltre che in un monoide ogni elemento invertibile ha un unico inverso, indicando dove interviene l'associatività.</p>`,
            solution: `<p><strong>Unicità del neutro.</strong> Se $e$ ed $e'$ sono entrambi elementi neutri, allora $e*e'=e$ perché $e'$ è neutro, mentre $e*e'=e'$ perché $e$ è neutro. Quindi $e=e'$.</p><p><strong>Unicità dell'inverso.</strong> Siano $b$ e $c$ due inversi dello stesso elemento $a$ di un monoide con neutro $e$. Si ha:</p><p>$$b=b*e=b*(a*c)=(b*a)*c=e*c=c.$$</p><p>L'associatività interviene nell'uguaglianza $b*(a*c)=(b*a)*c$; per l'unicità del neutro non serve.</p>`

            solution: `<p>Il neutro appartiene a $U(M)$ perché $e*e=e$.</p><p>Se $a,b\\in U(M)$, l'associatività permette di calcolare:</p><p>$$(a*b)*(b^{-1}*a^{-1})=a*(b*b^{-1})*a^{-1}=e,$$</p><p>$$(b^{-1}*a^{-1})*(a*b)=b^{-1}*(a^{-1}*a)*b=e.$$</p><p>Pertanto $a*b\\in U(M)$ e:</p><p>$$(a*b)^{-1}=b^{-1}*a^{-1}.$$</p><p>L'operazione si restringe dunque a $U(M)$ e rimane associativa. Il suo neutro è $e$.</p><p>Infine, se $a\\in U(M)$, le uguaglianze $a*a^{-1}=e=a^{-1}*a$ mostrano che anche $a^{-1}$ è invertibile, con inverso $a$.</p><p>Quindi ogni elemento di $U(M)$ ha il proprio inverso in $U(M)$ e questa struttura è un gruppo.</p>`

            kind: "teoria",
            source: "integrazione",
            content: `<p>Enunciare e dimostrare il criterio che caratterizza gli interi $n\\ge2$ per cui $\\mathbb{Z}_n$ è un campo.</p>`,
            solution: `<p><strong>Enunciato.</strong> $\\mathbb{Z}_n$ è un campo se e solo se $n$ è primo.</p><p>Le operazioni sulle classi ereditano dagli interi associatività, commutatività e distributività. I neutri sono $\\bar{0}$ e $\\bar{1}$; l'opposto di $\\bar{x}$ è $\\overline{-x}$. Inoltre $\\bar{0}\\ne\\bar{1}$ perché $n\\ge2$.</p><p><strong>Se $n=p$ è primo.</strong> Per $\\bar{a}\\ne\\bar{0}$, consideriamo:</p><p>$$T_a:\\mathbb{Z}_p\\to\\mathbb{Z}_p,\\qquad T_a(\\bar{x})=\\overline{ax}.$$</p><p>Se $T_a(\\bar{x})=T_a(\\bar{y})$, allora $p\\mid a(x-y)$. Qui si usa la proprietà dei numeri primi: se un primo divide un prodotto, divide almeno uno dei fattori. Poiché $p\\nmid a$, segue $p\\mid x-y$, cioè $\\bar{x}=\\bar{y}$.</p><p>La funzione è quindi iniettiva. Essendo una funzione da un insieme di $p$ elementi in se stesso, ha $p$ immagini distinte, che esauriscono il codominio: è anche suriettiva. Esiste perciò $\\bar{b}$ tale che:</p><p>$$\\bar{a}\\bar{b}=\\bar{1}.$$</p><p>Inoltre il prodotto di due classi non nulle è non nullo, perché $p\\mid ab$ implicherebbe $p\\mid a$ oppure $p\\mid b$. Le classi non nulle formano dunque un gruppo abeliano moltiplicativo e $\\mathbb{Z}_p$ è un campo.</p><p><strong>Se $n$ è composto.</strong> Possiamo scrivere $n=ab$ con $1\\lt a,b\\lt n$. Le classi $\\bar{a}$ e $\\bar{b}$ sono non nulle, ma:</p><p>$$\\bar{a}\\bar{b}=\\bar{0}.$$</p><p>Se $\\bar{a}$ avesse un inverso, moltiplicando questa uguaglianza per esso otterremmo $\\bar{b}=\\bar{0}$, assurdo. Pertanto $\\mathbb{Z}_n$ non è un campo.</p>`

            source: "integrazione",
            content: `<p>Su $\\mathbb{Z}$ si definisce $a*b=a+b+1$. Stabilire se $(\\mathbb{Z},*)$ è un semigruppo, un monoide o un gruppo e se è commutativo. Determinare l'eventuale elemento neutro e gli inversi. Risolvere infine $3*x=7$.</p>`,
            solution: `<p><strong>Operazione interna, associativa e commutativa.</strong> L'operazione è interna perché $a+b+1\\in\\mathbb{Z}$ per ogni $a,b\\in\\mathbb{Z}$. Inoltre:</p><p>$$(a*b)*c=a+b+c+2=a*(b*c),$$</p><p>quindi è associativa. È commutativa perché $a+b+1=b+a+1$.</p><p><strong>Elemento neutro.</strong> L'equazione $a*e=a$ equivale ad $a+e+1=a$, quindi $e=-1$. Si verifica anche $(-1)*a=a$.</p><p><strong>Inversi.</strong> L'inverso di $a$ rispetto a $*$ è l'intero $b$ che soddisfa $a*b=-1$, ossia $a+b+1=-1$. Pertanto:</p><p>$$b=-a-2.$$</p><p>Per commutatività vale anche $b*a=-1$. La struttura è quindi un <strong>gruppo abeliano</strong> e, di conseguenza, anche un monoide e un semigruppo.</p><p><strong>Equazione.</strong> $3*x=7$ equivale a $3+x+1=7$, da cui l'unica soluzione è $x=3$.</p>`

            type: "esercizio",
            title: "Scritto 2",
            kind: "scritto",
            source: "integrazione",
            content: `<p>Nel campo $\\mathbb{Z}_5$, determinare l'inverso moltiplicativo di ogni elemento non nullo e risolvere l'equazione:</p><p>$$\\bar{2}x^2+\\bar{3}x+\\bar{1}=\\bar{0}.$$</p>`,
            solution: `<p><strong>Inversi moltiplicativi.</strong> Si ricavano dalle uguaglianze:</p><p>$$\\bar{1}\\cdot\\bar{1}=\\bar{1},\\qquad\\bar{2}\\cdot\\bar{3}=\\bar{6}=\\bar{1},\\qquad\\bar{4}\\cdot\\bar{4}=\\overline{16}=\\bar{1}.$$</p><p>Quindi:</p><p>$$\\bar{1}^{-1}=\\bar{1},\\qquad\\bar{2}^{-1}=\\bar{3},\\qquad\\bar{3}^{-1}=\\bar{2},\\qquad\\bar{4}^{-1}=\\bar{4}.$$</p><p><strong>Risoluzione dell'equazione.</strong> Il polinomio si fattorizza come:</p><p>$$\\bar{2}x^2+\\bar{3}x+\\bar{1}=(\\bar{2}x+\\bar{1})(x+\\bar{1}).$$</p><p>In un campo un prodotto è nullo soltanto se almeno un fattore è nullo: se il primo fattore fosse non nullo, si potrebbe moltiplicare per il suo inverso. Pertanto:</p><p>$$\\bar{2}x+\\bar{1}=\\bar{0}\\qquad\\text{oppure}\\qquad x+\\bar{1}=\\bar{0}.$$</p><p>Nel primo caso:</p><p>$$x=\\bar{3}\\cdot\\bar{4}=\\overline{12}=\\bar{2}.$$</p><p>Nel secondo caso $x=\\bar{4}$. Entrambi i valori annullano uno dei fattori, quindi l'insieme delle soluzioni è:</p><p>$$\\{\\bar{2},\\bar{4}\\}.$$</p>`

            kind: "scritto",
            source: "integrazione",
            content: `<p>Nell'anello $(\\mathcal{P}(E),\\oplus,\\cap)$, determinare gli elementi invertibili rispetto al prodotto e stabilire per quali insiemi $E$ si ottiene un campo.</p><p>Dati $A,B,C\\subseteq E$, determinare poi tutte le soluzioni $X\\subseteq E$ dell'equazione:</p><p>$$(A\\cap X)\\oplus B=C.$$</p><p>Applicare il risultato a $E=\\{1,2,3,4\\}$, $A=\\{1,2,3\\}$, $B=\\{1,4\\}$ e $C=\\{2,4\\}$.</p>`,
            solution: `<p><strong>Elementi invertibili.</strong> Il neutro moltiplicativo è $E$. Un sottoinsieme $D$ è invertibile se esiste $F\\subseteq E$ tale che $D\\cap F=E$. Poiché $D,F\\subseteq E$, questa uguaglianza impone $D=F=E$. Viceversa $E\\cap E=E$: l'unico elemento invertibile è $E$.</p><p><strong>Quando si ottiene un campo?</strong></p><ul><li>Se $E=\\emptyset$, l'anello ha un solo elemento e non è un campo, perché il neutro additivo coincide con quello moltiplicativo.</li><li>Se $E$ ha un solo elemento, $\\mathcal{P}(E)=\\{\\emptyset,E\\}$ e l'unico elemento non nullo è invertibile: si ottiene un campo.</li><li>Se $E$ ha almeno due elementi, esiste un sottoinsieme non vuoto proprio, che è non nullo e non invertibile: non si ottiene un campo.</li></ul><p>La struttura è dunque un campo esattamente quando $|E|=1$.</p><p><strong>Risoluzione dell'equazione.</strong> Applichiamo la differenza simmetrica con $B$ a entrambi i membri:</p><p>$$((A\\cap X)\\oplus B)\\oplus B=C\\oplus B.$$</p><p>Per associatività, usando $B\\oplus B=\\emptyset$, il neutro $\\emptyset$ e la commutatività:</p><p>$$A\\cap X=C\\oplus B=B\\oplus C.$$</p><p>Poniamo $D=B\\oplus C$. È necessario che $D\\subseteq A$, perché $A\\cap X\\subseteq A$. Se questa condizione vale, tutte e sole le soluzioni sono:</p><p>$$X=D\\cup Y,\\qquad Y\\subseteq E\\setminus A.$$</p><p>Infatti l'intersezione con $A$ è esattamente $D$, mentre gli elementi esterni ad $A$ sono liberi. Se $D\\nsubseteq A$, non esistono soluzioni.</p><p><strong>Applicazione.</strong> Nell'esempio:</p><p>$$D=\\{1,4\\}\\oplus\\{2,4\\}=\\{1,2\\}\\subseteq A,\\qquad E\\setminus A=\\{4\\}.$$</p><p>Le soluzioni sono quindi:</p><p>$$X=\\{1,2\\}\\qquad\\text{oppure}\\qquad X=\\{1,2,4\\}.$$</p>`

            front: "Perché l'elemento neutro di un gruppoide è unico?",
            back: "Se $e$ ed $e'$ sono neutri, allora $e'*e=e'$ perché $e$ è neutro, ed $e'*e=e$ perché $e'$ è neutro. Quindi $e=e'$. Non serve l'associatività."
        },
        {
            type: "dimostrazione",
            front: "Dimostra l'unicità dell'inverso in un monoide.",
            back: "Se $s'$ e $s''$ sono inversi di $s$, allora $s'=s'*e=s'*(s*s'')=(s'*s)*s''=e*s''=s''$. L'associatività permette di passare da $s'*(s*s'')$ a $(s'*s)*s''$."
        },
        {
            type: "tranello",
            front: "In un gruppoide con elemento neutro l'inverso è sempre unico?",
            back: "No. L'associatività è cruciale nella dimostrazione dell'unicità: esistono gruppoidi non associativi in cui un elemento ha più di un inverso."
        },
        {
            type: "definizione",
            front: "Distingui semigruppo, gruppoide unitario, monoide e gruppo.",
            back: "Un semigruppo è un gruppoide associativo. Un gruppoide unitario ha un neutro. Un monoide è associativo e ha un neutro. Un gruppo è un monoide in cui ogni elemento è invertibile; è abeliano se l'operazione è commutativa."
        },
        {
            type: "domanda",
            front: "Come si interpretano neutro e inversione come operazioni?",
            back: "Il neutro è individuato da un'operazione nullaria $\\zeta:\\{\\text{pt}\\}\\to S$ con $\\zeta(\\text{pt})=e$. In un gruppo, l'inversione è un'operazione unaria $i:S\\to S$ che associa a ogni $s$ il suo unico inverso $s^{-1}$."
        },
        {
            type: "dimostrazione",
            front: "Perché gli elementi invertibili di un monoide formano un gruppo?",
            back: "Il prodotto di invertibili è invertibile: $(a*b)*(b^{-1}*a^{-1})=e$ e $(b^{-1}*a^{-1})*(a*b)=e$. L'associatività si eredita dal monoide; il neutro appartiene a $U(M)$; l'inverso di un invertibile è ancora invertibile, perché $(a^{-1})^{-1}=a$."
        },
        {
            type: "formula",
            front: "Qual è l'inverso di un prodotto di elementi invertibili?",
            back: "$(a*b)^{-1}=b^{-1}*a^{-1}$. L'ordine dei fattori si inverte."
        },
        {
            type: "definizione",
            front: "Che cos'è la differenza simmetrica e quale struttura definisce su $\\mathcal{P}(E)$?",
            back: "$A\\oplus B=(A\\setminus B)\\cup(B\\setminus A)$: contiene gli elementi appartenenti esattamente a uno dei due insiemi. $(\\mathcal{P}(E),\\oplus)$ è un gruppo abeliano con neutro $\\emptyset$ e ogni elemento inverso di se stesso, perché $A\\oplus A=\\emptyset$."
        },
        {
            type: "domanda",
            front: "Perché $(\\mathbb{N},+)$ non è un gruppo? Quali sono gli invertibili di $(\\mathbb{Z},\\cdot)$?",
            back: "Assumendo $\\mathbb{N}=\\{0,1,2,\\dots\\}$, $(\\mathbb{N},+)$ è un monoide commutativo ma $1$ non ha inverso additivo in $\\mathbb{N}$. In $(\\mathbb{Z},\\cdot)$ gli unici invertibili sono $1$ e $-1$."
        },
        {
            type: "tranello",
            front: "Nella composizione $f\\circ g$, quale funzione si applica per prima?",
            back: "Si applica prima $g$, perché $(f\\circ g)(x)=f(g(x))$. Su $E=\\{1,2\\}$, se $f$ è costante di valore $1$ e $g$ di valore $2$, allora $f\\circ g=f$ e $g\\circ f=g$: la composizione non è commutativa."
        },
        {
            type: "domanda",
            front: "Qual è il gruppo degli invertibili di $(E^E,\\circ)$? Quando non è abeliano?",
            back: "È $S(E)$, l'insieme delle biiezioni da $E$ in se stesso. Non è abeliano se $|E|\\ge3$: su $\\{1,2,3\\}$, scambiando rispettivamente $1,2$ e $2,3$, si ottiene $(\\sigma\\circ\\tau)(1)=2$ mentre $(\\tau\\circ\\sigma)(1)=3$."
        },
        {
            type: "definizione",
            front: "Che cos'è il monoide libero su un alfabeto non vuoto $A$?",
            back: "È $A^*=\\bigcup_{n=0}^{\\infty}A^n$, l'insieme delle parole finite su $A$, con la concatenazione. L'operazione è associativa e il neutro è la parola vuota. Solo la parola vuota è invertibile; il monoide non è un gruppo e in genere non è commutativo."
        },
        {
            type: "definizione",
            front: "Quando $*$ è distributiva rispetto a $\\bullet$?",

        },
        {

        },
        {
            type: "definizione",
            front: "Quali proprietà caratterizzano un campo?",
            back: "La somma forma un gruppo abeliano su tutto l'insieme; il prodotto forma un gruppo abeliano sugli elementi diversi dal neutro additivo; il prodotto è distributivo rispetto alla somma. Si può dividere per ogni elemento diverso da zero."
        },
        {
            type: "tranello",
            front: "La distributività del prodotto rispetto alla somma implica quella della somma rispetto al prodotto?",
            back: "No. Per esempio $1+(2\\cdot3)=7$, mentre $(1+2)\\cdot(1+3)=12$."
        },
        {
            type: "domanda",
            front: "Perché $(\\mathbb{Z},+,\\cdot)$ non è un campo? Quale proprietà manca a $(3\\mathbb{Z},+,\\cdot)$ per essere unitario?",
            back: "In $\\mathbb{Z}$ non tutti gli elementi non nulli hanno un inverso moltiplicativo: per esempio $2$ non lo ha. L'anello dei multipli di $3$ è commutativo ma non ha un elemento neutro moltiplicativo."
        },
        {
            type: "tranello",
            front: "Che cosa significa $\\bar{7}=\\bar{2}$ in $\\mathbb{Z}_5$?",
            back: "Significa che $7$ e $2$ individuano la stessa classe di resto, perché differiscono di un multiplo di $5$. Non significa che siano uguali come interi. La classe è $\\bar{x}=\\{x+5k\\mid k\\in\\mathbb{Z}\\}$."
        },
        {
            type: "formula",
            front: "Come si definiscono somma e prodotto in $\\mathbb{Z}_n$?",
            back: "$\\bar{x}+\\bar{y}=\\overline{x+y}$ e $\\bar{x}\\cdot\\bar{y}=\\overline{x\\cdot y}$. Si opera sui rappresentanti e si prende la classe del risultato."
        },
        {
            type: "formula",
            front: "Quali sono gli inversi moltiplicativi degli elementi non nulli di $\\mathbb{Z}_5$?",
            back: "$\\bar{1}^{-1}=\\bar{1}$, $\\bar{2}^{-1}=\\bar{3}$, $\\bar{3}^{-1}=\\bar{2}$ e $\\bar{4}^{-1}=\\bar{4}$. Nella tavola del prodotto si cerca $\\bar{1}$ nella riga dell'elemento."
        },
        {
            type: "domanda",
            front: "Per $n\\ge2$, quando $\\mathbb{Z}_n$ è un campo?",
            back: "$\\mathbb{Z}_n$ è un campo se e solo se $n$ è un numero primo."
        },
        {
            type: "dimostrazione",
            front: "Nell'esercizio integrativo Teoria 3, come si prova l'esistenza degli inversi quando il modulo $p$ è primo?",
            back: "Per $\\bar{a}\\ne\\bar{0}$ si considera $T_a(\\bar{x})=\\overline{ax}$. Se due immagini coincidono, $p\\mid a(x-y)$; essendo $p$ primo e $p\\nmid a$, segue $p\\mid x-y$. Quindi $T_a$ è iniettiva e, sull'insieme finito $\\mathbb{Z}_p$, suriettiva. Esiste allora $\\bar{b}$ con $\\bar{a}\\bar{b}=\\bar{1}$."
        },
        {
            type: "dimostrazione",
            front: "Nell'esercizio integrativo Teoria 3, perché un modulo composto impedisce a $\\mathbb{Z}_n$ di essere un campo?",
            back: "Se $n=ab$ con $1\\lt a,b\\lt n$, le classi $\\bar{a}$ e $\\bar{b}$ sono non nulle ma $\\bar{a}\\bar{b}=\\bar{0}$. Se $\\bar{a}$ avesse inverso, moltiplicando per esso si otterrebbe $\\bar{b}=\\bar{0}$, assurdo."
        },
        {
            type: "domanda",
            front: "Nell'esercizio integrativo Scritto 3, quali sottoinsiemi sono invertibili per $\\cap$ e quando $(\\mathcal{P}(E),\\oplus,\\cap)$ è un campo?",
            back: "L'unico invertibile è $E$: se $D\\cap F=E$ con $D,F\\subseteq E$, allora $D=F=E$. La struttura è un campo esattamente quando $|E|=1$. Se $E=\\emptyset$, i due neutri coincidono; se $|E|\\ge2$, esistono sottoinsiemi non nulli non invertibili."
        },
        {
            type: "formula",
            front: "Nell'esercizio integrativo Scritto 3, quali sono le soluzioni di $(A\\cap X)\\oplus B=C$?",
            back: "Posto $D=B\\oplus C$, l'equazione equivale ad $A\\cap X=D$. Se $D\\nsubseteq A$ non ci sono soluzioni. Se $D\\subseteq A$, tutte e sole le soluzioni sono $X=D\\cup Y$, con $Y\\subseteq E\\setminus A$."
        }
    ]
