    {
      "id": "s25-introduzione",
      "type": "section",
      "title": "Introduzione: la ricerca delle soluzioni",
      "icon": "🔎",
      "content": "<p>Quando vi trovate di fronte a un'equazione, cosa significa cercare una soluzione? Prendiamo un esempio semplice:</p>\n        <p>$$x^2 - 2x - 2 = 0$$</p>\n        <p>Cercare le soluzioni di questa equazione significa trovare quei valori di $x \\in \\mathbb{R}$ per i quali l'uguaglianza è verificata. In questo caso si tratta di un'equazione di secondo grado e possiamo usare la formula risolutiva per trovare le radici.</p>\n        <p>In generale possiamo vedere il problema in un'ottica più ampia. L'espressione a sinistra dell'uguale può essere vista come una <strong>funzione</strong>:</p>\n        <p>$$f(x) = x^2 - 2x - 2$$</p>\n        <p>Risolvere l'equazione $f(x) = 0$ equivale a cercare i punti in cui la funzione si annulla. Questi punti hanno un nome specifico.</p>",

        {
          "subtitle": "Quando non possiamo calcolare gli zeri",
          "content": "<p>Non sempre è possibile o facile trovare esplicitamente gli zeri di una funzione. A volte, però, possiamo almeno <strong>garantire che uno zero esista</strong> all'interno di un certo intervallo. Ci serve una condizione che ci assicuri l'esistenza di almeno una soluzione.</p>"
        }
      ]
    },

      "id": "s25-teorema-zeri",
      "type": "section",
      "title": "Il Teorema degli Zeri",
      "icon": "🎯",
      "content": "<p>Riflettiamo insieme: quand'è che siamo sicuri che una funzione abbia almeno uno zero in un intervallo $[a, b]$? Immaginiamo di disegnare il grafico di una funzione. Se la funzione parte da un valore negativo in $a$ (cioè $f(a) \\lt 0$) e arriva a un valore positivo in $b$ (cioè $f(b) \\gt 0$), e se la disegniamo \"senza staccare la penna dal foglio\", sembra inevitabile che debba attraversare l'asse $x$ in almeno un punto.</p>\n        <p><figure class=\"figura\" data-id=\"analisi1_lez25a_g2\"><svg xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"640pt\" height=\"400pt\" viewBox=\"0 0 640 400\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\">\n <metadata>\n  <rdf:RDF xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:cc=\"http://creativecommons.org/ns#\" xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\">\n   <cc:Work>\n    <dc:type rdf:resource=\"http://purl.org/dc/dcmitype/StillImage\"/>\n    <dc:format>image/svg+xml</dc:format>\n    <dc:creator>\n     <cc:Agent>\n      <dc:title>Matplotlib v3.11.2, https://matplotlib.org/</dc:title>\n     </cc:Agent>\n    </dc:creator>\n   </cc:Work>\n  </rdf:RDF>\n </metadata>\n <defs>\n  <style type=\"text/css\">*{stroke-linejoin: round; stroke-linecap: butt}</style>\n </defs>\n <g id=\"analisi1_lez25a_g2-figure_1\">\n  <g id=\"analisi1_lez25a_g2-patch_1\">\n   <path d=\"M 0 400 \nL 640 400 \nL 640 0 \nL 0 0 \nL 0 400 \nz\n\" style=\"fill: none; opacity: 0\"/>\n  </g>\n  <g id=\"analisi1_lez25a_g2-axes_1\">\n   <g id=\"analisi1_lez25a_g2-patch_2\">\n    <path d=\"M 44.8 364 \nL 614.4 364 \nL 614.4 24 \nL 44.8 24 \nL 44.8 364 \nz\n\" style=\"fill: none\"/>\n   </g>\n   <g id=\"analisi1_lez25a_g2-matplotlib.axis_1\">\n    <g id=\"analisi1_lez25a_g2-xtick_1\">\n     <g id=\"analisi1_lez25a_g2-line2d_1\">\n      <path d=\"M 44.8 364 \nL 44.8 24 \n\" clip-path=\"url(#analisi1_lez25a_g2-p69039bc63d)\" style=\"fill: none; stroke: #9aa4b2; stroke-opacity: 0.3; stroke-width: 0.6; stroke-linecap: squ idth=\"569.6\" height=\"340\"/>\n  </clipPath>\n </defs>\n</svg></figure></p>\n        <p>L'idea di \"disegnare senza staccare la penna dal foglio\" corrisponde alla proprietà matematica di <strong>continuità</strong>. Se la funzione non fosse continua, potrebbe \"saltare\" l'asse delle $x$ e il risultato non sarebbe più garantito.</p>",

        {
          "subtitle": "Esempio — controesempio con funzione non continua",
          "content": "<p>Consideriamo una funzione definita a tratti che passa da un valore negativo a uno positivo, ma è discontinua. Ad esempio, una funzione che vale $-1$ per $x \\lt c$ e $+1$ per $x \\ge c$. In un intervallo che contiene $c$, la funzione assume valori di segno opposto agli estremi, ma <strong>non si annulla mai</strong>.</p><figure class=\"figura\" data-id=\"analisi1_lez25a_g3\"><svg xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"720pt\" height=\"430pt\" viewBox=\"0 0 720 430\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\">\n <metadata>\n  <rdf:RDF xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:cc=\"http://creativecommons.org/ns#\" xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\">\n   <cc:Work>\n    <dc:type rdf:resource=\"http://purl.org/dc/dcmitype/StillImage\"/>\n    <dc:date>2026-11-05T05:36:15.807726</dc:date>\n    <dc:format>image/svg+xml</dc:format>\n    <dc:creator>\n     <cc:Agent>\n      <dc:title>Matplotlib v3.11.2, https://matplotlib.org/</dc:title>\n     </cc:Agent>\n    </dc:creator>\n   </cc:Work>\n  </rdf:RDF>\n </metadata>\n <defs>\n  <style type=\"text/css\">*{stroke-linejoin: round; stroke-linecap: butt}</style>\n </defs>\n <g id=\"analisi1_lez25a_g3-figure_1\">\n  <g id=\"analisi1_lez25a_g3-patch_1\">\n   <path d=\"M 0 430 \nL 720 430 \nL 720 0 \nL 0 0 \nL 0 430 \nz\n\" style=\"fill: none; opacity: 0\"/>\n  </g>\n  <g id=\"analisi1_lez25a_g3-axes_1\">\n   <g id=\"analisi1_lez25a_g3-patch_2\">\n    <path d=\"M 50.4 391.3 \nL 691.2 391.3 \nL 691.2 25.8 \nL 50.4 25.8 \nL 50.4 391.3 \nz\n\" style=\"fill: none\"/>\n   </g>\n   <g id=\"analisi1_lez25a_g3-matplotlib.axis_1\">\n    <g id=\"analisi1_lez25a_g3-xtick_1\">\n     <g id=\"analisi1_lez25a_g3-line2d_1\">\n      <path d=\"M 101.664 391.3 \nL 101.664 25.8 \n\" clip-path=\"url(#analisi1_lez25a_g3-pd455dbde24)\" style=\"fill: none; stroke: #9aa4b2; stroke-opacity: 0.3; stroke-width: 0.6; stroke-linecap: square\"/>\n     </g>\n     <g id=\"analisi1_lez2         {
          "subtitle": "Le due condizioni chiave",
          "content": "<ol>\n              <li>La funzione deve essere <strong>continua</strong> sull'intervallo.</li>\n              <li>La funzione deve assumere <strong>valori di segno opposto</strong> agli estremi dell'intervallo.</li>\n            </ol>\n            <p>Queste intuizioni sono formalizzate nel seguente, importante teorema.</p>"
        },
        {
          "subtitle": "Teorema degli Zeri (enunciato)",
          "content": "<p>Sia $f: [a, b] \\to \\mathbb{R}$ una funzione <strong>continua</strong> in $[a, b]$, con $a, b \\in \\mathbb{R}$ e $a \\lt b$. Se</p>\n            <p>$$f(a) \\cdot f(b) \\lt 0$$</p>\n            <p>(cioè se la funzione assume valori di segno opposto agli estremi dell'intervallo), allora esiste almeno un punto $x_0 \\in (a, b)$ tale che $f(x_0) = 0$.</p>"
        },
        {
          "subtitle": "Osservazione sull'enunciato",

      "id": "s25-dim-zeri",
      "type": "section",
      "title": "Dimostrazione: il metodo di bisezione",
      "icon": "✂️",
      "content": "<p>La dimostrazione che segue è <strong>costruttiva</strong>: non si limita a dimostrare l'esistenza dello zero, ma fornisce un metodo per approssimarlo con la precisione desiderata. Questo metodo è noto come <strong>metodo di bisezione</strong>.</p>\n        <p>Senza perdere di generalità, supponiamo che $f(a) \\lt 0$ e $f(b) \\gt 0$. Il caso opposto ($f(a) \\gt 0$ e $f(b) \\lt 0$) si dimostra in modo del tutto analogo.</p>\n        <p>Definiamo due successioni $(a_n)_{n \\in \\mathbb{N}}$ e $(b_n)_{n \\in \\mathbb{N}}$ in modo ricorsivo.</p>",
      "subsections": [
        {
          "subtitle": "Passo base ($n=0$)",
          "content": "<p>Poniamo $a_0 = a$ e $b_0 = b$. Consideriamo il punto medio dell'intervallo $[a_0, b_0]$:</p>\n            <p>$$c_0 = \\frac{a_0 + b_0}{2}$$</p>\n            <p>Valutiamo la funzione in $c_0$. Si presentano tre casi:</p>\n            <ul>\n              <li>Se $f(c_0) = 0$, abbiamo trovato uno zero $x_0 = c_0$ e la dimostrazione è conclusa.</li>\n              <li>Se $f(c_0) \\gt 0$, allora la funzione cambia segno nell'intervallo $[a_0, c_0]$. Poniamo quindi $a_1 = a_0$ e $b_1 = c_0$.</li>\n              <li>Se $f(c_0) \\lt 0$, allora la funzione cambia segno nell'intervallo $[c_0, b_0]$. Poniamo quindi $a_1 = c_0$ e $b_1 = b_0$.</li>\n            </ul>\n            <p>Nei due casi in cui $f(c_0)$ non è zero abbiamo costruito un nuovo intervallo $[a_1, b_1] \\subset [a_0, b_0]$ tale che $f(a_1) \\lt 0$ e $f(b_1) \\gt 0$, e la cui ampiezza è la metà di quella precedente.</p><figure class=\"figura\" data-id=\"analisi1_lez25_doc_bisezione\"><svg id=\"analisi1_lez25_doc_bisezione\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"359.972pt\" height=\"178.21pt\" viewBox=\"0 0 359.972 178.21\" version=\"1.2\"><style>#analisi1_lez25_doc_bisezione [fill=\"rgb(8.625793%,52.549744%,37.644958%)\"],#analisi1_lez25_doc_bisezione [style*=\"fill:rgb(8.625793%,52.549744%,37.644958%)\"]{fill:#73e8c0!important}[data-mode=\"light\"] #analisi1_lez25_doc_bisezione [fill=\"rgb(8.625793%,52.549744%,37.644958%)\"],[data-mode=\"light\"] #analisi1_lez25_doc_bisezione [style*=\"fill:rgb(8.625793%,52.549744%,37.644958%)\"]{fill:#168660!important}#analisi1_lez25_doc_bisezione [stroke=\"rgb(8.625793%,52.549744%,37.644958%)\"],#analisi1_lez25_doc_bisezione [style*=\"stroke:rgb(8.625793%,52.549744%,37.644958%)\"]{stroke:#73e8c0!important}[data-mode=\"light\"] #analisi1_lez25_doc_bisezione [stroke=\"rgb(8.625793%,52.549744%,37.644958%)\"],[data-mode=\"light\"] #analisi1_lez25_doc_bisezione [style*=\"stroke:rgb(8.625793%,52.549744%,37 nalisi1_lez25_doc_bisezione-glyph2-1\" x=\"124.133592\" y=\"164.095569\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#analisi1_lez25_doc_bisezione-glyph0-2\" x=\"135.008385\" y=\"158.322162\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#analisi1_lez25_doc_bisezione-glyph3-2\" x=\"140.978917\" y=\"158.322162\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#analisi1_lez25_doc_bisezione-glyph0-1\" x=\"150.154243\" y=\"158.322162\"/>\n</g>\n<path style=\"fill:none;stroke-width:0.398;stroke-linecap:butt;stroke-linejoin:miter;stroke:rgb(0%,0%,0%);stroke-opacity:1;stroke-miterlimit:10;\" d=\"M -0.000574561 0.0011833 L 20.095932 0.0011833 \" transform=\"matrix(0.995587,0,0,-0.995587,135.008385,161.864459)\"/>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#analisi1_lez25_doc_bisezione-glyph2-5\" x=\"140.179461\" y=\"170.149731\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#analisi1_lez25_doc_bisezione-glyph4-1\" x=\"144.767124\" y=\"167.588087\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#analisi1_lez25_doc_bisezione-glyph3-2\" x=\"158.753125\" y=\"164.095569\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#analisi1_lez25_doc_bisezione-glyph3-3\" x=\"164.362743\" y=\"164.095569\"/>\n</g>\n<g style=\"fill:rgb(0%,0%,0%);fill-opacity:1;\">\n  <use xlink:href=\"#analisi1_lez25_doc_bisezione-glyph2-4\" x=\"176.083301\" y=\"164.095569\"/>\n</g>\n</g>\n</svg>\n<figcaption>Lo schema degli appunti: nel caso illustrato $f(c_0)&gt;0$ e $f(c_1)&lt;0$. Si conservano quindi prima $[a_0,c_0]$, poi $[c_1,c_0]$, mantenendo segni opposti agli estremi e dimezzando ogni volta la lunghezza.</figcaption></figure>"
        },
        {
          "subtitle": "Passo induttivo",
          "content": "<p>Supponiamo di aver costruito l'intervallo $[a_n, b_n]$ tale che $f(a_n) \\lt 0$ e $f(b_n) \\gt 0$. Definiamo il punto medio:</p>\n            <p>$$c_n = \\frac{a_n + b_n}{2}$$</p>\n            <p>Se $f(c_n) = 0$, abbiamo trovato lo zero. Altrimenti definiamo il nuovo intervallo come segue:</p>\n            <p>$$[a_{n+1}, b_{n+1}] = \\begin{cases} [a_n, c_n] & \\text{se } f(c_n) \\gt 0 \\\\ [c_n, b_n] & \\text{se } f(c_n) \\lt 0 \\end{cases}$$</p>\n            <p>Per costruzione avremo sempre $f(a_{n+1}) \\lt 0$ e $f(b_{n+1}) \\gt 0$.</p>"
        },
        {
          "subtitle": "Analisi delle successioni",
          "content": "<p>Supponiamo ora che nessun punto medio sia uno zero; altrimenti la dimostrazione è già conclusa. Il procedimento iterativo genera allora due successioni:</p>\n            <ul>\n              <li>$(a_n)_{n \\in \\mathbb{N}}$ è <strong>monotona non decrescente</strong> ($a_n \\le a_{n+1}$);</li>\n              <li>$(b_n)_{n \\in \\mathbb{N}}$ è <strong>monotona non crescente</strong> ($b_n \\ge b_{n+1}$).</li>\n            </ul>\n            <p>Inoltre $(a_n)$ è limitata superiormente (ad esempio da $b_0 = b$) e $(b_n)$ è limitata inferiormente (ad esempio da $a_0 = a$). Per il teorema di esistenza del limite delle successioni monotone, entrambe ammettono limite finito:</p>\n            <p>$$\\lim_{n \\to \\infty} a_n = x_0 \\quad \\text{e} \\quad \\lim_{n \\to \\infty} b_n = x_1$$</p>\n            <p>dove $x_0 = \\sup_{n \\in \\mathbb{N}} \\{a_n\\}$ e $x_1 = \\inf_{n \\in \\mathbb{N}} \\{b_n\\}$.</p>"
        },
        {
          "subtitle": "I due limiti coincidono",
          "content": "<p>L'ampiezza dell'intervallo $[a_n, b_n]$ si dimezza ad ogni passo:</p>\n            <p>$$b_n - a_n = \\frac{b_{n-1} - a_{n-1}}{2} = \\dots = \\frac{b_0 - a_0}{2^n} = \\frac{b-a}{2^n}$$</p>\n            <p>Passando al limite per $n \\to \\infty$:</p>\n            <p>$$\\lim_{n \\to \\infty} (b_n - a_n) = \\lim_{n \\to \\infty} \\frac{b-a}{2^n} = 0$$</p>\n            <p>Poiché il limite della differenza è la differenza dei limiti:</p>\n            <p>$$x_1 - x_0 = 0 \\Rightarrow x_1 = x_0$$</p>\n            <p>Entrambe le successioni convergono allo stesso punto $x_0$.</p>"
        },
        {
          "subtitle": "Conclusione con la continuità",
          "content": "<p>Ora usiamo l'ipotesi fondamentale che $f$ sia <strong>continua</strong>. Per il <strong>teorema ponte</strong> (continuità sequenziale), se $a_n \\to x_0$ allora $f(a_n) \\to f(x_0)$; lo stesso vale per $b_n$:</p>\n            <p>$$\\lim_{n \\to \\infty} f(a_n) = f(x_0) \\quad \\text{e} \\quad \\lim_{n \\to \\infty} f(b_n) = f(x_0)$$</p>\n            <p>Per costruzione $f(a_n) \\lt 0$ per ogni $n$. Per il teorema della permanenza del segno (nella versione più generale che include l'uguaglianza), il limite di una successione di termini non positivi deve essere non positivo:</p>\n            <p>$$f(x_0) = \\lim_{n \\to \\infty} f(a_n) \\le 0$$</p>\n            <p>Analogamente, poiché $f(b_n) \\gt 0$ per ogni $n$, il suo limite deve essere non negativo:</p>\n            <p>$$f(x_0) = \\lim_{n \\to \\infty} f(b_n) \\ge 0$$</p>\n            <p>L'unica possibilità per cui $f(x_0)$ sia contemporaneamente $\\le 0$ e $\\ge 0$ è che sia nullo:</p>\n            <p>$$f(x_0) = 0$$</p>"
        },
        {
          "subtitle": "Lo zero è interno",
          "content": "<p>Infine dobbiamo assicurarci che $x_0 \\in (a, b)$. Poiché $a_n \\ge a$ e $b_n \\le b$ per ogni $n$, il loro limite comune $x_0$ deve appartenere all'intervallo chiuso $[a, b]$. Tuttavia, per ipotesi $f(a) \\lt 0$ e $f(b) \\gt 0$, mentre $f(x_0) = 0$: dunque $x_0$ non può coincidere né con $a$ né con $b$. Pertanto $x_0 \\in (a, b)$. $\\blacksquare$</p>"
        }
      ],
      "formulas": [
        {
          "label": "Punto medio",
          "latex": "c_n = \\frac{a_n + b_n}{2}"
        },
        {
          "label": "Ampiezza dopo n passi",
          "latex": "b_n - a_n = \\frac{b-a}{2^n}"
        }
      ]
    },
    {
      "id": "s25-problema-maxmin",
      "type": "section",
      "title": "Il problema della ricerca di massimi e minimi",
      "icon": "⛰️",
      "content": "<p>Un altro problema fondamentale dell'analisi matematica, strettamente legato alla risoluzione di equazioni, è quello di determinare se una data funzione ammette un valore massimo o un valore minimo all'interno del suo dominio.</p>\n        <p>Non è affatto scontato che una funzione possegga sempre un massimo o un minimo. Consideriamo alcuni semplici esempi grafici per capire quali situazioni possono impedirlo.</p>",
      "subsections": [
        {
          "subtitle": "Esempio 1 — funzione illimitata superiormente",
          "content": "<p>Una funzione può non ammettere massimo se il suo valore cresce indefinitamente. Consideriamo</p>\n            <p>$$f(x) = \\frac{1}{2-x}, \\qquad x \\in [-2, 2).$$</p>\n            <p>Il dominio che stiamo considerando è l'intervallo $[-2,2)$, <strong>limitato ma non chiuso</strong>, e la retta $x = 2$ è un asintoto verticale: quando $x$ tende a $2$ da sinistra il denominatore $2-x$ tende a $0^+$, dunque $f(x) \\to +\\infty$.</p>\n            <p><figure class=\"figura\" data-id=\"analisi1_lez25b_g1\"><svg xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"720pt\" height=\"430pt\" viewBox=\"0 0 720 430\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\">\n <metadata>\n  <rdf:RDF xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:cc=\"http://creativecommons.org/ns#\" xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\">\n   <cc:Work>\n    <dc:type rdf:resource=\"http://purl.org/dc/dcmitype/StillImage\"/>\n    <dc:date>2026-11-05T05:36:15.997912</dc:date>\n    <dc:format>image/svg+xml</dc:format>\n    <dc:creator>\n     <cc:Agent>\n      <dc:title>Matplotlib v3.11.2, https://matplotlib.org/</dc:title>\n     </cc:Agent>\n    </dc:creator>\n   </cc:Work>\n  </rdf:RDF>\n </metadata>\n <defs>\n  <style type=\"text/css\">*{stroke-linejoin: round; stroke-linecap: butt}</style>\n </defs>\n <g id=\"analisi1_lez25b_g1-figure_1\">\n  <g id=\"analisi1_lez25b_g1-patch_1\">\n   <path d=\"M 0 430 \nL 720 430 \nL 720 0 \nL 0 0 \nL 0 430 \nz\n\" style=\"fill: none; opacity: 0\"/>\n  </g>\n  <g id=\"analisi1_lez25b_g1-axes_1\">\n   <g id=\"analisi1_lez25b_g1-patch_2\">\n    <path d=\"M 50.4 391.3 \nL 691.2 391.3 \nL 691.2 25.8 \nL 50.4 25.8 \nL 50.4 391.3 \nz\n\" style=\"fill: none\"/>\n   </g>\n   <g id=\"analisi1_lez25b_g1-matplotlib.axis_1\">\n    <g id=\"analisi1_lez25b_g1-xtick_1\">\n     <g id=\"analisi1_lez25b_g1-line2d_1\">\n      <path d=\"M 113.845545 391.3 \nL 113.845545 25.8 \n\" clip-path=\"url(#analisi1_lez25b_g1-p46a8371802)\" style=\" tura del grafico.</em> La finestra mostra soltanto una <em>porzione</em> del dominio, cioè i valori di $x$ fino a $1.9$: in quella porzione la funzione ha effettivamente un valore più grande, $f(1.9) = 10$. Il dominio matematico che stiamo considerando è però tutto $[-2,2)$, e su di esso nessun valore è il più grande, perché la curva continua a salire avvicinandosi all'asintoto. Bisogna sempre distinguere il <strong>dominio dichiarato</strong> nel testo dalla <strong>parte di esso che il disegno riesce a visualizzare</strong>.</p>\n            <p>Questa funzione non ha dunque un massimo su $[-2,2)$. Il suo estremo superiore è $+\\infty$, ma non esiste alcun punto del dominio in cui la funzione assuma questo valore (del resto $+\\infty$ non è un numero reale, quindi non può essere un valore di $f$).</p>"
        },
        {
          "subtitle": "Esempio 2 — intervallo aperto",
          "content": "<p>Una funzione definita su un intervallo aperto potrebbe non raggiungere i suoi valori estremi, poiché questi potrebbero trovarsi in corrispondenza dei punti esclusi dal dominio. Consideriamo $f(x) = x$ sull'intervallo aperto $(-1,1)$.</p>\n            <p><figure class=\"figura\" data-id=\"analisi1_lez25b_g2\"><svg xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"720pt\" height=\"430pt\" viewBox=\"0 0 720 430\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\">\n <metadata>\n  <rdf:RDF xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:cc=\"http://creativecommons.org/ns#\" xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\">\n   <cc:Work>\n    <dc:type rdf:resource=\"http://purl.org/dc/dcmitype/StillImage\"/>\n    <dc:date>2026-11-05T05:36:15.905048</dc:date>\n    <dc:format>image/svg+xml</dc:format>\n    <dc:creator>\n     <cc:Agent>\n      <dc:title>Matplotlib v3.11.2, https://matplotlib.org/</dc:title>\n     </cc:Agent>\n    </dc:creator>\n   </cc:Work>\n  </rdf:RDF>\n </metadata>\n <defs>\n  <style type=\"text/css\">*{stroke-linejoin: round; stroke-linecap: butt}</style>\n </defs>\n <g id=\"analisi1_lez25b_g2-figure_1\">\n  <g id=\"analisi1_lez25b_g2-patch_1\">\n   <path d=\"M 0 430 \nL 720 430 \nL 720 0 \nL 0 0 \nL 0 430 \nz\n\" style=\"fill: none; opacity: 0\"/>\n  </g>\n  <g id=\"analisi1_lez25b_g2-axes_1\">\n   <g id=\"analisi1_lez25b_g2-patch_2\">\n    <path d=\"M 50.4 391.3 \nL 691.2 391.3 \nL 691.2 25.8 \nL 50.4 25.8 \nL 50.4 391.3 \nz\n\" style=\"fill: none\"/>\n   </g>\n   <g id=\"analisi1_lez25b_g2-matplotlib.axis_1\">\n    <g id=\"analisi1_lez25b_g2-xtick_1\">\n     <g id=\"analisi1_lez25b_g2-line2d_1\">\n      <path d=\"M 149.834483 391.3 \nL 149.834483 25.8 \n\" clip-path=\"url(#analisi1_lez25b_g2-padd9c91dec)\" style=\"fill: none; stroke: #9aa4b2; stroke-opacity: 0.3; stroke-width: 0.6; stroke-linecap: square\"/>\n     </g>\n     <g id=\"analisi1_lez25b_g2-line2d_2\">\n      <defs>\n       <path id=\"analisi1_le form=\"translate(526.999892 129.764899) scale(0.12 -0.12)\">\n     <use xlink:href=\"#analisi1_lez25b_g2-DejaVuSans-48\"/>\n     <use xlink:href=\"#analisi1_lez25b_g2-DejaVuSans-56\" transform=\"translate(61.53125 0)\"/>\n     <use xlink:href=\"#analisi1_lez25b_g2-DejaVuSans-46\" transform=\"translate(113.625 0)\"/>\n     <use xlink:href=\"#analisi1_lez25b_g2-DejaVuSans-4f\" transform=\"translate(168.609375 0)\"/>\n     <use xlink:href=\"#analisi1_lez25b_g2-DejaVuSans-58\" transform=\"translate(196.390625 0)\"/>\n     <use xlink:href=\"#analisi1_lez25b_g2-DejaVuSans-56\" transform=\"translate(259.765625 0)\"/>\n     <use xlink:href=\"#analisi1_lez25b_g2-DejaVuSans-52\" transform=\"translate(311.859375 0)\"/>\n    </g>\n   </g>\n  </g>\n </g>\n <defs>\n  <clipPath id=\"analisi1_lez25b_g2-padd9c91dec\">\n   <rect x=\"50.4\" y=\"25.8\" width=\"640.8\" height=\"365.5\"/>\n  </clipPath>\n </defs>\n</svg>\n<figcaption>$f(x)=x$ su $(-1,1)$: gli estremi sono esclusi. Supremum $1$ e infimum $-1$ non sono raggiunti.</figcaption></figure></p>\n            <p>Nel disegno la <strong>finestra degli assi</strong> è leggermente più ampia del dominio, per rendere visibili i due cerchietti vuoti in $(-1,-1)$ e $(1,1)$; il <strong>grafico di $f$</strong> è però soltanto il tratto con $-1 \\lt x \\lt 1$, con estremi esclusi.</p>\n            <p>In questo caso l'estremo inferiore della funzione è $-1$ e l'estremo superiore è $1$, ma <strong>nessuno dei due valori viene mai raggiunto</strong>, poiché i punti $-1$ e $1$ non appartengono al dominio.</p>"
        },
        {
          "subtitle": "sup e max: la differenza fondamentale",
          "content": "<ul>\n              <li>Il <strong>supremum</strong> (sup) di un insieme di valori è il più piccolo dei maggioranti.</li>\n              <li>Il <strong>massimo</strong> (max) è il supremum quando esso è anche un valore raggiunto dalla funzione, cioè appartiene all'immagine della funzione.</li>\n            </ul>\n            <p>Analogamente, l'<strong>infimum</strong> (inf) è il più grande dei minoranti, e diventa <strong>minimo</strong> (min) se viene raggiunto dalla funzione.</p>"
        }
      ]

    {
      "id": "s25-sup-inf",
      "type": "section",
      "title": "Supremum e infimum di una funzione",
      "icon": "📏",
      "content": "<p>Formalizziamo le idee appena viste.</p>\n        <p><strong>Definizione.</strong> Sia $f: A \\to \\mathbb{R}$ una funzione.</p>\n        <p>L'<strong>estremo superiore</strong> di $f$ su $A$ è l'estremo superiore della sua immagine:</p>\n        <p>$$\\sup_{x \\in A} f(x) = \\sup(\\text{Im}(f)) = \\sup \\{ f(x) \\mid x \\in A \\}$$</p>\n        <p>L'<strong>estremo inferiore</strong> di $f$ su $A$ è l'estremo inferiore della sua immagine:</p>\n        <p>$$\\inf_{x \\in A} f(x) = \\inf(\\text{Im}(f)) = \\inf \\{ f(x) \\mid x \\in A \\}$$</p>",
      "subsections": [
        {
          "subtitle": "Caratterizzazione del supremum finito",
          "content": "<p>Poniamo $M = \\sup_{x \\in A} f(x)$ e supponiamo che $M$ sia <strong>finito</strong>, cioè $M \\in \\mathbb{R}$ (equivalentemente: $f$ è superiormente limitata su $A$). Allora valgono due condizioni:</p>\n            <ol>\n              <li>$M$ è un maggiorante per l'immagine di $f$:\n              <p>$$f(x) \\le M \\quad \\forall x \\in A$$</p></li>\n              <li>Per ogni $\\varepsilon \\gt 0$, il valore $M - \\varepsilon$ non è più un maggiorante, cioè esiste almeno un punto del dominio la cui immagine supera $M-\\varepsilon$:\n              <p>$$\\forall \\varepsilon \\gt 0, \\ \\exists x \\in A \\ \\text{tale che} \\ f(x) \\gt M - \\varepsilon$$</p></li>\n            </ol>\n            <p>Una proprietà analoga vale per l'infimum finito: per ogni $\\varepsilon \\gt 0$ esiste $x \\in A$ con $f(x) \\lt \\inf_{x \\in A} f(x) + \\varepsilon$.</p>"
        },
        {
          "subtitle": "Il caso del supremum infinito",
          "content": "<p>La scrittura $M - \\varepsilon$ ha senso solo se $M$ è un numero reale: per questo la caratterizzazione appena vista <strong>richiede $M$ finito</strong>. Se invece $f$ non è superiormente limitata, si scrive $\\sup_{x \\in A} f(x) = +\\infty$ e la proprietà corretta da usare è:</p>\n            <p>$$\\sup_{x \\in A} f(x) = +\\infty \\iff \\forall K \\in \\mathbb{R} \\ \\exists x \\in A \\ \\text{tale che} \\ f(x) \\gt K.$$</p>\n            <p>In particolare, scegliendo $K = n$ con $n \\in \\mathbb{N}$, si ottiene una successione di punti $x_n \\in A$ con $f(x_n) \\gt n$. Terremo conto di questa distinzione nella dimostrazione del teorema di Weierstrass.</p>"
        }
      ],
      "formulas": [
        {
          "label": "Caratterizzazione sup finito",
          "latex": "\\forall \\varepsilon \\gt 0 \\ \\exists x \\in A : f(x) \\gt M - \\varepsilon"
        },
        {
          "label": "Caratterizzazione sup infinito",
          "latex": "\\sup_{x \\in A} f(x) = +\\infty \\iff \\forall K \\in \\mathbb{R} \\ \\exists x \\in A : f(x) \\gt K"
        }
      ]
    },
    {
      "id": "s25-weierstrass",
      "type": "section",
      "title": "Il Teorema di Weierstrass",
      "icon": "🏔️",
      "content": "<p>Ci chiediamo: sotto quali condizioni possiamo garantire che una funzione ammetta massimo e minimo? Come suggerito dai controesempi, le ipotesi cruciali riguarderanno la <strong>continuità</strong> della funzione e la natura del suo <strong>dominio</strong> (che dovrà essere chiuso e limitato).</p>",
      "subsections": [
        {
          "subtitle": "Definizione — punto di massimo e minimo assoluto",
          "content": "<p>Sia $f: A \\to \\mathbb{R}$ una funzione, con $A \\subseteq \\mathbb{R}$.</p>\n            <p>Un punto $x_M \\in A$ si dice <strong>punto di massimo assoluto</strong> per $f$ in $A$ se la sua immagine è maggiore o uguale all'immagine di qualsiasi altro punto del dominio:</p>\n            <p>$$f(x_M) \\ge f(x) \\quad \\forall x \\in A$$</p>\n            <p>In questo caso il valore $f(x_M)$ si dice <strong>valore massimo</strong> di $f$ in $A$. Ciò è equivalente a dire che il supremum viene raggiunto:</p>\n            <p>$$f(x_M) = \\sup_{x \\in A} f(x)$$</p>\n            <p>Un punto $x_m \\in A$ si dice <strong>punto di minimo assoluto</strong> per $f$ in $A$ se:</p>\n            <p>$$f(x_m) \\le f(x) \\quad \\forall x \\in A$$</p>\n            <p>e in questo caso $f(x_m) = \\inf_{x \\in A} f(x)$.</p>\n            <p><em>Osservazione.</em> Un punto di massimo (o minimo) non è necessariamente unico: ad esempio una funzione costante $f(x) = c$ su $[a,b]$ ha ogni punto dell'intervallo sia come punto di massimo che di minimo.</p>"
        },
        {
          "subtitle": "Teorema di Weierstrass (enunciato)",
          "content": "<p>Sia $f: [a, b] \\to \\mathbb{R}$ una funzione <strong>continua</strong> definita su un intervallo <strong>chiuso e limitato</strong>. Allora $f$ ammette massimo e minimo assoluti in $[a, b]$, cioè esistono $x_m, x_M \\in [a, b]$ tali che:</p>\n            <p>$$f(x_m) \\le f(x) \\le f(x_M) \\quad \\forall x \\in [a, b]$$</p>"
        },
        {
          "subtitle": "Esempio — applicazione positiva del teorema",
          "content": "<p>Prima di passare alla dimostrazione, vediamo il teorema all'opera su una funzione non costante. Sia</p>\n            <p>$$f(x) = x^2, \\qquad x \\in [-1, 2].$$</p>\n            <p>La funzione è continua (è un polinomio) e il dominio $[-1,2]$ è un intervallo chiuso e limitato: le ipotesi di Weierstrass sono soddisfatte, quindi il teorema <strong>garantisce</strong> che massimo e minimo assoluti esistono. Il teorema, da solo, non ci dice però <em>dove</em> si trovano.</p>\n            <p>In questo caso basta una stima diretta. Per ogni $x \\in [-1,2]$ si ha $|x| \\le 2$, dunque</p>\n            <p>$$0 \\le x^2 \\le 4.$$</p>\n            <p>Entrambe le disuguaglianze sono ottimali, perché i due valori estremi vengono effettivamente assunti nel dominio:</p>\n            <p>$$f(0) = 0 \\quad \\text{con } 0 \\in [-1,2], \\qquad f(2) = 4 \\quad \\text{con } 2 \\in [-1,2].$$</p>\n            <p>Quindi $x_m = 0$ è punto di minimo assoluto con valore minimo $0$, e $x_M = 2$ è punto di massimo assoluto con valore massimo $4$. Si noti che $x=-1$ non è punto di massimo: $f(-1) = 1 \\lt 4$. Il massimo sta su un estremo del dominio, il minimo al suo interno: il teorema <strong>non dice nulla sulla posizione</strong> dei punti estremi.</p>"
        },
        {
          "subtitle": "Esistenza e determinazione sono due cose diverse",
          "content": "<ul>\n              <li><strong>Verificare l'esistenza</strong> significa controllare le ipotesi del teorema (continuità, dominio chiuso e limitato) e concludere che massimo e minimo ci sono.</li>\n              <li><strong>Determinare</strong> massimo e minimo significa esibire i punti $x_m, x_M$ e i valori $f(x_m), f(x_M)$, e per questo serve uno studio della funzione (stime, monotonia, più avanti la derivata).</li>\n            </ul>\n            <p>Weierstrass fornisce solo il primo dei due passi, ma è un passo essenziale: senza di esso non sapremmo nemmeno se la ricerca ha senso.</p>"
        }
      ],
      "formulas": [
        {
          "label": "Tesi di Weierstrass",
          "latex": "f(x_m) \\le f(x) \\le f(x_M) \\quad \\forall x \\in [a,b]"
        }
      ]
    },
    {
      "id": "s25-dim-weierstrass",
      "type": "section",
      "title": "Dimostrazione del Teorema di Weierstrass",
      "icon": "🧩",
      "content": "<p>Dimostriamo l'esistenza del punto di massimo; l'esistenza del punto di minimo sarà dedotta al termine applicando il risultato alla funzione $-f$.</p>\n        <p>Sia</p>\n        <p>$$p = \\sup \\{f(x) \\mid x \\in [a, b]\\}.$$</p>\n        <p>A priori $p$ potrebbe essere un numero reale finito oppure $+\\infty$: i due casi richiedono argomenti diversi, perché la caratterizzazione con $p - \\varepsilon$ ha senso soltanto per $p$ finito. Trattiamo quindi separatamente le due possibilità, e mostriamo subito che la seconda non può verificarsi.</p><figure class=\"figura\" data-id=\"analisi1_lez25_doc_massimo\"><svg id=\"analisi1_lez25_doc_massimo\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"301.379pt\" height=\"146.867pt\" viewBox=\"0 0 301.379 146.867\" version=\"1.2\"><style>#analisi1_lez25_doc_massimo [fill=\"rgb(0%,0%,0%)\"],#analisi1_lez25_doc_massimo [style*=\"fill:rgb(0%,0%,0%)\"]{fill:var(--text-primary)!important}#analisi1_lez25_doc_massimo [stroke=\"rgb(0%,0%,0%)\"],#analisi1_lez25_doc_massimo [style*=\"stroke:rgb(0%,0%,0%)\"]{stroke:var(--text-primary)!important}#analisi1_lez25_doc_massimo [fill=\"rgb(8.625793%,52.549744%,37.644958%)\"],#analisi1_lez25_doc_massimo [style*=\"fill:rgb(8.625793%,52.549744%,37.644958%)\"]{fill:#73e8c0!important}[data-mode=\"light\"] #analisi1_lez25_doc_massimo [fill=\"rgb(8.625793%,52.549744%,37.644958%)\"],[data-mode=\"light\"] #analisi1_lez25_doc_massimo [style*=\"fill:rgb(8.625793%,52.549744%,37.644958%)\"]{fill:#168660!important}#analisi1_lez25_doc_massimo [stroke=\"rgb(8.625793%,52.549744%,37.644958%)\"],#analisi1_lez25_doc_massimo [style*=\"stroke:rgb(8.625793%,52.549744%,37.644958%)\"]{stroke:#73e8c0!important}[data-mode=\"light\"] #analisi1_lez25_doc_massimo [stroke=\"rgb(8.625793%,52.549744%,37.644958%)\"],[data-mode=\"light\"] #analisi1_lez25_doc_massimo [style*=\"stroke:rgb(8.625793%,52.549744%,37.644958%)\"]{stroke:#168660!important}</style>\n<defs>\n e.</figcaption></figure>",
      "subsections": [
        {
          "subtitle": "Passo 0 — il caso $p = +\\infty$ è impossibile",
          "content": "<p>Supponiamo per assurdo che $f$ non sia superiormente limitata, cioè $p = +\\infty$. Per la caratterizzazione del supremum infinito, per ogni $n \\in \\mathbb{N}$, $n \\ge 1$, esiste un punto $x_n \\in [a,b]$ tale che</p>\n            <p>$$f(x_n) \\gt n.$$</p>\n            <p>La successione $\\{x_n\\}$ vive in $[a,b]$, quindi è limitata; per il <strong>Teorema di Bolzano-Weierstrass</strong> esiste una sottosuccessione $\\{x_{k_n}\\}$ convergente a un punto $x_0 \\in \\mathbb{R}$, e poiché $a \\le x_{k_n} \\le b$ per ogni $n$, per il teorema del confronto si ha $x_0 \\in [a,b]$ (qui si usa che il dominio è <em>chiuso</em> e <em>limitato</em>).</p>\n            <p>Essendo $f$ continua in $x_0$, per il teorema ponte</p>\n            <p>$$\\lim_{n \\to \\infty} f(x_{k_n}) = f(x_0) \\in \\mathbb{R},$$</p>\n            <p>dunque la successione $\\{f(x_{k_n})\\}$ è convergente e in particolare limitata. Ma per costruzione</p>\n            <p>$$f(x_{k_n}) \\gt k_n \\overset{n \\to \\infty}{\\longrightarrow} +\\infty,$$</p>\n            <p>cioè $f(x_{k_n}) \\to +\\infty$: una successione non può convergere al numero reale $f(x_0)$ e allo stesso tempo divergere a $+\\infty$. Assurdo.</p>\n            <p>Concludiamo che $p \\in \\mathbb{R}$: <strong>una funzione continua su un intervallo chiuso e limitato è superiormente limitata</strong>. Da qui in avanti possiamo quindi usare liberamente la caratterizzazione del supremum finito.</p>"
        },
        {
          "subtitle": "Passo 1 — costruzione di una successione",
          "content": "<p>Poiché $p$ è finito, per la seconda proprietà del supremum, per ogni $\\varepsilon \\gt 0$ esiste un $x \\in [a, b]$ tale che $f(x) \\gt p - \\varepsilon$. Scegliamo $\\varepsilon_n = 1/n$ per $n \\in \\mathbb{N}$, $n \\ge 1$. Per ogni $n$ esiste un punto $x_n \\in [a, b]$ tale che:</p>\n            <p>$$p - \\frac{1}{n} \\lt f(x_n) \\le p$$</p>\n            <p>(la disuguaglianza di destra vale perché $p$ è un maggiorante dell'immagine). Questo ci fornisce una successione di punti $\\{x_n\\}_{n \\in \\mathbb{N}}$ nel dominio $[a,b]$.</p>"
        },
        {
          "subtitle": "Passo 2 — Teorema di Bolzano-Weierstrass",
          "content": "<p>La successione $\\{x_n\\}$ è costruita nell'intervallo $[a,b]$. Poiché l'intervallo è limitato, anche la successione è limitata ($a \\le x_n \\le b$ per ogni $n$). Per il <strong>Teorema di Bolzano-Weierstrass</strong>, ogni successione limitata ammette almeno una sottosuccessione convergente. Quindi esistono una sottosuccessione $\\{x_{k_n}\\}$ e un punto $x_0 \\in \\mathbb{R}$ tali che:</p>\n            <p>$$\\lim_{n \\to \\infty} x_{k_n} = x_0$$</p>\n            <p>Poiché $a \\le x_{k_n} \\le b$ per ogni $n$, per il teorema del confronto (o della permanenza del segno) anche il limite appartiene all'intervallo chiuso: $x_0 \\in [a,b]$.</p>"
        },
        {
          "subtitle": "Passo 3 — uso della continuità (teorema ponte)",
          "content": "<p>Poiché $x_{k_n} \\to x_0$ e $f$ è continua in $x_0$, per il teorema ponte (continuità sequenziale):</p>\n            <p>$$\\lim_{n \\to \\infty} f(x_{k_n}) = f(x_0)$$</p>"
        },
        {
          "subtitle": "Passo 4 — conclusione per unicità del limite",
          "content": "<p>Dalla costruzione del passo 1 sappiamo che $p - 1/n \\lt f(x_n) \\le p$. Questo vale anche per la sottosuccessione:</p>\n            <p>$$p - \\frac{1}{k_n} \\lt f(x_{k_n}) \\le p$$</p>\n            <p>Poiché $k_n \\to \\infty$ per $n \\to \\infty$, si ha $1/k_n \\to 0$. Per il teorema dei due carabinieri la successione $\\{f(x_{k_n})\\}$ è \"stretta\" tra due successioni che tendono entrambe a $p$. Quindi:</p>\n            <p>$$\\lim_{n \\to \\infty} f(x_{k_n}) = p$$</p>\n            <p>Confrontando i passi 3 e 4, per l'unicità del limite:</p>\n            <p>$$f(x_0) = p$$</p>\n            <p>Questo significa che $f(x_0) = \\sup_{x \\in [a,b]} f(x)$: abbiamo trovato un punto $x_0 \\in [a,b]$ in cui la funzione raggiunge il suo estremo superiore. Per definizione $x_0$ è un punto di massimo assoluto: poniamo $x_M = x_0$.</p>"
        },
        {
          "subtitle": "Passo 5 — esistenza del minimo",
          "content": "<p>Non serve ripetere l'argomento: basta applicare quanto dimostrato alla funzione $g = -f$. Anche $g$ è continua su $[a,b]$ (opposto di una funzione continua), quindi per la parte già dimostrata esiste $x_m \\in [a,b]$ tale che</p>\n            <p>$$g(x_m) \\ge g(x) \\quad \\forall x \\in [a,b], \\qquad \\text{cioè} \\qquad -f(x_m) \\ge -f(x).$$</p>\n            <p>Moltiplicando per $-1$ (e invertendo il verso della disuguaglianza) si ottiene</p>\n            <p>$$f(x_m) \\le f(x) \\quad \\forall x \\in [a,b],$$</p>\n            <p>cioè $x_m$ è un punto di minimo assoluto per $f$. In particolare $f(x_m) = \\inf_{x \\in [a,b]} f(x)$, e tale infimum è finito.</p>\n            <p>In alternativa si può ripetere passo per passo la stessa dimostrazione partendo da $m = \\inf \\{f(x) \\mid x \\in [a, b]\\}$: si esclude prima il caso $m = -\\infty$ (scegliendo $x_n$ con $f(x_n) \\lt -n$) e poi si costruisce una successione $\\{x_n\\}$ tale che $m \\le f(x_n) \\lt m + 1/n$. $\\blacksquare$</p>"
        }
      ],
      "extra_content": "<p><strong>Limitatezza come corollario.</strong> Il Passo 0 e il Passo 5 insieme mostrano un fatto importante di per sé: una funzione continua su un intervallo chiuso e limitato è <strong>limitata</strong>, cioè esiste $C \\gt 0$ con $|f(x)| \\le C$ per ogni $x \\in [a,b]$. Infatti basta prendere $C = \\max\\{|f(x_m)|, |f(x_M)|\\} + 1$ (l'aggiunta di $1$ serve a garantire $C \\gt 0$ anche nel caso in cui $f$ sia identicamente nulla). Anche qui tutte le ipotesi servono: $f(x) = 1/(2-x)$ su $[-2,2)$ è continua ma illimitata, perché il dominio non è chiuso.</p>"
    },
    {
      "id": "s25-ipotesi-sufficienti",
      "type": "alert_box",
      "title": "Ipotesi sufficienti, non necessarie",
      "icon": "⚠️",
      "content": "<p>Attenzione a come si leggono i controesempi. Le ipotesi dei due teoremi sono <strong>sufficienti</strong> a garantire la conclusione: se sono tutte verificate, la tesi è certamente vera. Se invece una di esse manca, la conclusione <strong>può ancora essere vera</strong>, semplicemente non è più garantita dal teorema.</p>\n        <p>Per esempio $f(x) = \\sin x$ su $\\mathbb{R}$ (dominio chiuso ma illimitato) ha massimo $1$ e minimo $-1$, pur non soddisfacendo le ipotesi di Weierstrass.</p>\n        <p>Ciò che i controesempi mostrano è precisamente questo: togliendo una sola ipotesi si trova <em>almeno una</em> funzione per cui la tesi cade. Dunque quell'ipotesi non può essere eliminata dall'enunciato, anche se non è una condizione necessaria per la singola funzione.</p><p>Un esempio generato insieme agli esercizi rende visibile lo stesso principio anche quando manca la continuità: su $[-1,2]$ poniamo</p><p>$$f(x)=\\begin{cases}x^2 & -1\\leq x<1\\\\3-x & 1\\leq x\\leq2.\\end{cases}$$</p><p>La funzione salta in $x=1$, ma raggiunge comunque minimo $0$ in $x=0$ e massimo $2$ in $x=1$. Questo conferma che le ipotesi sono sufficienti, non necessarie per la singola funzione.</p><figure class=\"figura\" data-id=\"analisi1_lez25b_gp3\"><svg xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"720pt\" height=\"430pt\" viewBox=\"0 0 720 430\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\">\n <metadata>\n  <rdf:RDF xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:cc=\"http://creativecommons.org/ns#\" xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\">\n   <cc:Work>\n    <dc:type rdf:resource=\"http://purl.org/dc/dcmitype/StillImage\"/>\n    <dc:date>2026-11-05T05:36:16.286356</dc:date>\n    <dc:format>image/svg+xml</dc:format>\n    <dc:creator>\n     <cc:Agent>\n      <dc:title>Matplotlib v3.11.2, https://matplotlib.org/</dc:title>\n     </cc:Agent>\n    </dc:creator>\n   </cc:Work>\n  </rdf:RDF>\n </metadata>\n <defs>\n  <style type=\"text/     {
      "id": "s25-ipotesi-zeri",
      "type": "section",
      "title": "Analisi delle ipotesi: Teorema degli Zeri",
      "icon": "🔬",
      "content": "<p>Le ipotesi del teorema degli zeri sono:</p>\n        <ol>\n          <li>$f$ è continua su $[a, b]$;</li>\n          <li>$f(a) \\cdot f(b) \\lt 0$ (segni discordi agli estremi).</li>\n        </ol>\n        <p>Vediamo cosa succede se una di esse viene a mancare.</p>",
      "subsections": [
        {
          "subtitle": "Cosa succede se $f$ non è continua?",
          "content": "<p>Se la funzione non è continua, può \"saltare\" l'asse delle $x$ senza attraversarlo. Consideriamo la funzione definita a tratti:</p>\n            <p>$$f(x) = \\begin{cases} x-1 & \\text{se } x \\in [-1, 0) \\\\ x+1 & \\text{se } x \\in [0, 1] \\end{cases}$$</p>\n            <p>Questa funzione è definita sull'intervallo $[-1, 1]$. Agli estremi abbiamo $f(-1) = -2$ e $f(1) = 2$, quindi i segni sono discordi. Tuttavia la funzione <strong>non si annulla mai</strong>. Il teorema non si applica perché $f$ ha una discontinuità a salto in $x=0$.</p>\n            <p><figure class=\"figura\" data-id=\"analisi1_lez25b_g3\"><svg xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"720pt\" height=\"430pt\" viewBox=\"0 0 720 430\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\">\n <metadata>\n  <rdf:RDF xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:cc=\"http://creativecommons.org/ns#\" xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\">\n   <cc:Work>\n    <dc:type rdf:resource=\"http://purl.org/dc/dcmitype/StillImage\"/>\n    <dc:date>2026-11-05T05:36:16.124093</dc:date>\n    <dc:format>image/svg+xml</dc:format>\n    <dc:creator>\n     <cc:Agent>\n      <dc:title>Matplotlib v3.11.2, https://matplotlib.org/</dc:title>\n     </cc:Agent>\n    </dc:creator>\n   </cc:Work>\n  </rdf:RDF>\n </metadata>\n <defs>\n  <style type=\"text/css\">*{stroke-linejoin: round; stroke-linecap: butt}</style>\n </defs>\n <g id=\"analisi1_lez25b_g3-figure_1\">\n  <g id=\"analisi1_lez25b_g3-patch_1\">\n   <path d=\"M 0 430 \nL 720 430 \nL 720 0 \nL 0 0 \nL 0 430 \nz\n\" style=\"fill: none; opacity: 0\"/>\n  </g>\n  <g id=\"analisi1_lez25b_g3-axes_1\">\n   <g id=\"analisi1_lez25b_g3-patch_2\">\n    <path d=\"M 50.4 391.3 \nL 691.2 391.3 \nL 691.2 25.8 \nL 50.4 25.8 \nL 50.4 391.3 \nz\n\" style=\"fill: none\"/>\n   </g>\n   <g id=\"analisi1_lez25b_g3-matplotlib.axis_1\">\n    <g id=\"analisi1_lez25b_g3-xtick_1\">\n     <g id=\"analisi1_lez25b_g3-line2d_1\">\n estremi, ma nessuno zero: in $0$ la funzione salta da $-1$ a $1$.</figcaption></figure></p>\n            <p>I rami sono limitati ai rispettivi intervalli: il cerchietto vuoto in $(0,-1)$ esclude quel punto, mentre il punto pieno in $(0,1)$ indica che $f(0)=1$. Non compare alcuna intersezione con l’asse delle ascisse.</p>"

        {
          "subtitle": "Cosa succede se $f(a)$ e $f(b)$ hanno lo stesso segno?",
          "content": "<p>Se $f(a) \\cdot f(b) \\gt 0$, il teorema non garantisce l'esistenza di uno zero: la funzione potrebbe benissimo rimanere sempre positiva o sempre negativa.</p>\n            <p>Sia $f(x) = x^2 + 1$ sull'intervallo $[-1, 1]$. La funzione è continua. Agli estremi vale $f(-1) = 2$ e $f(1) = 2$: i segni sono concordi. Infatti la funzione è sempre positiva e non ha zeri.</p>\n            <p><figure class=\"figura\" data-id=\"analisi1_lez25b_g4\"><svg xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"640pt\" height=\"400pt\" viewBox=\"0 0 640 400\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\">\n <metadata>\n  <rdf:RDF xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:cc=\"http://creativecommons.org/ns#\" xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\">\n   <cc:Work>\n    <dc:type rdf:resource=\"http://purl.org/dc/dcmitype/StillImage\"/>\n    <dc:format>image/svg+xml</dc:format>\n    <dc:creator>\n     <cc:Agent>\n      <dc:title>Matplotlib v3.11.2, https://matplotlib.org/</dc:title>\n     </cc:Agent>\n    </dc:creator>\n   </cc:Work>\n  </rdf:RDF>\n </metadata>\n <defs>\n  <style type=\"text/css\">*{stroke-linejoin: round; stroke-linecap: butt}</style>\n </defs>\n <g id=\"analisi1_lez25b_g4-figure_1\">\n  <g id=\"analisi1_lez25b_g4-patch_1\">\n   <path d=\"M 0 400 \nL 640 400 \nL 640 0 \nL 0 0 \nL 0 400 \nz\n\" style=\"fill: none; opacity: 0\"/>\n  </g>\n  <g id=\"analisi1_lez25b_g4-axes_1\">\n   <g id=\"analisi1_lez25b_g4-patch_2\">\n    <path d=\"M 44.8 364 \nL 614.4 364 \nL 614.4 24 \nL 44.8 24 \nL 44.8 364 \nz\n\" style=\"fill: none\"/>\n   </g>\n   <g id=\"analisi1_lez25b_g4-matplotlib.axis_1\">\n    <g id=\"analisi1_lez25b_g4-xtick_1\">\n     <g id=\"analisi1_lez25b_g4-line2d_1\">\n      <path d=\"M 139.733333 364 \nL 139.733333 24 \n\" clip-path=\"url(#analisi1_lez25b_g4-pfaf7c85f11)\" style=\"fill: none; stroke: #9aa4b2; stroke-opacity: 0.3; stroke-width: 0.6; stroke-linecap: square\"/>\n     </g>\n     <g id=\"analis >\n       <path id=\"analisi1_lez25b_g4-DejaVuSans-c\" d=\"M 513 4856 \nL 1013 4856 \nQ 1481 4119 1714 3412 \nQ 1947 2706 1947 2009 \nQ 1947 1309 1714 600 \nQ 1481 -109 1013 -844 \nL 513 -844 \nQ 928 -128 1133 580 \nQ 1338 1288 1338 2009 \nQ 1338 2731 1133 3434 \nQ 928 4138 513 4856 \nz\n\" transform=\"scale(0.015625)\"/>\n      </defs>\n      <use xlink:href=\"#analisi1_lez25b_g4-DejaVuSans-49\"/>\n      <use xlink:href=\"#analisi1_lez25b_g4-DejaVuSans-b\" transform=\"translate(35.203125 0)\"/>\n      <use xlink:href=\"#analisi1_lez25b_g4-DejaVuSans-5b\" transform=\"translate(74.21875 0)\"/>\n      <use xlink:href=\"#analisi1_lez25b_g4-DejaVuSans-c\" transform=\"translate(133.40625 0)\"/>\n     </g>\n    </g>\n   </g>\n  </g>\n </g>\n <defs>\n  <clipPath id=\"analisi1_lez25b_g4-pfaf7c85f11\">\n   <rect x=\"44.8\" y=\"24\" width=\"569.6\" height=\"340\"/>\n  </clipPath>\n </defs>\n</svg></figure></p>\n            <p>Anche qui la parabola è tracciata in una finestra più ampia del dominio $[-1,1]$: i due punti marcati $(-1,2)$ e $(1,2)$ individuano gli estremi dell'intervallo su cui stiamo ragionando.</p>"

    {
      "id": "s25-ipotesi-weierstrass",
      "type": "section",
      "title": "Analisi delle ipotesi: Teorema di Weierstrass",
      "icon": "🧪",
      "content": "<p>Le ipotesi del teorema di Weierstrass sono:</p>\n        <ol>\n          <li>$f$ è continua;</li>\n          <li>il dominio è un intervallo <strong>chiuso</strong> ($[a,b]$);</li>\n          <li>il dominio è un intervallo <strong>limitato</strong>.</li>\n        </ol>\n        <p>Costruiamo un controesempio per ciascuna.</p>",
      "subsections": [
        {
          "subtitle": "Cosa succede se $f$ non è continua?",
          "content": "<p>Una discontinuità può \"eliminare\" un punto di massimo o di minimo. Consideriamo:</p>\n            <p>$$f(x) = \\begin{cases} x^2 & \\text{se } x \\in [-1, 1],\\ x \\ne 0 \\\\ 2 & \\text{se } x = 0 \\end{cases}$$</p>\n            <p>La funzione è definita su $[-1, 1]$, intervallo chiuso e limitato: le ipotesi sul dominio sono soddisfatte, manca solo la continuità in $x=0$. Essa ha un massimo in $x=0$, dove vale $2$. Tuttavia <strong>non ha un minimo</strong>: l'infimum dei suoi valori è $0$, ma questo valore non viene mai raggiunto, perché l'unico punto in cui $x^2$ varrebbe $0$ è $x=0$, e proprio lì la funzione è stata ridefinita con il valore $2$.</p>\n            <p><figure class=\"figura\" data-id=\"analisi1_lez25b_g5\"><svg xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"720pt\" height=\"430pt\" viewBox=\"0 0 720 430\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\">\n <metadata>\n  <rdf:RDF xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:cc=\"http://creativecommons.org/ns#\" xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\">\n   <cc:Work>\n    <dc:type rdf:resource=\"http://purl.org/dc/dcmitype/StillImage\"/>\n    <dc:date>2026-11-05T05:36:16.180250</dc:date>\n    <dc:format>image/svg+xml</dc:format>\n    <dc:creator>\n     <cc:Agent>\n      <dc:title>Matplotlib v3.11.2, https://matplotlib.org/</dc:title>\n     </cc:Agent>\n    </dc:creator>\n   </cc:Work>\n  </rdf:RDF>\n </metadata>\n <defs>\n  <style type=\"text/css\">*{stroke-linejoin: round; stroke-linecap: butt}</style>\n </defs>\n <g id=\"analisi1_lez25b_g5-figure_1\">\n  <g id=\"analisi1_lez25b_g5-patch_1\">\n   <path d=\"M 0 430 \nL 720 430 \nL 720 0 \nL 0 0 \nL 0 430 \nz\n\" style=\"fill: none; opacity: 0\"/>\n  </g>\n  <g id=\"analisi1_lez25b_g5-axes_1\">\n   <g id=\"analisi1_lez25b_g5-patch_2\">\n    <path d=\"M 50.4 391.3 \nL 691.2 391.3 \nL 691.2 25.8 \nL 50.4 25.8 \nL 50.4 391.3 \nz\n\" style=\"fill: none\"/>\n   </g>\n   <g id=\"analisi1_lez25b_g5-         {
          "subtitle": "Cosa succede se l'intervallo non è chiuso?",
          "content": "<p>Se l'intervallo è aperto, la funzione può \"tendere\" ai suoi valori estremi senza mai raggiungerli. Sia $f(x) = -x$ sull'intervallo aperto $(-1, 1)$. La funzione è continua e il dominio è limitato, ma non chiuso. L'immagine è l'intervallo $(-1, 1)$: l'estremo superiore è $1$ e l'estremo inferiore è $-1$, ma nessuno dei due è un valore della funzione. Quindi <strong>non esistono né massimo né minimo</strong>.</p>\n            <p><figure class=\"figura\" data-id=\"analisi1_lez25b_g6\"><svg xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"720pt\" height=\"430pt\" viewBox=\"0 0 720 430\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\">\n <metadata>\n  <rdf:RDF xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:cc=\"http://creativecommons.org/ns#\" xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\">\n   <cc:Work>\n    <dc:type rdf:resource=\"http://purl.org/dc/dcmitype/StillImage\"/>\n    <dc:date>2026-11-05T05:36:15.950664</dc:date>\n    <dc:format>image/svg+xml</dc:format>\n    <dc:creator>\n     <cc:Agent>\n      <dc:title>Matplotlib v3.11.2, https://matplotlib.org/</dc:title>\n     </cc:Agent>\n    </dc:creator>\n   </cc:Work>\n  </rdf:RDF>\n </metadata>\n <defs>\n  <style type=\"text/css\">*{stroke-linejoin: round; stroke-linecap: butt}</style>\n </defs>\n <g id=\"analisi1_lez25b_g6-figure_1\">\n  <g id=\"analisi1_lez25b_g6-patch_1\">\n   <path d=\"M 0 430 \nL 720 430 \nL 720 0 \nL 0 0 \nL 0 430 \nz\n\" style=\"fill: none; opacity: 0\"/>\n  </g>\n  <g id=\"analisi1_lez25b_g6-axes_1\">\n   <g id=\"analisi1_lez25b_g6-patch_2\">\n    <path d=\"M 50.4 391.3 \nL 691.2 391.3 \nL 691.2 25.8 \nL 50.4 25.8 \nL 50.4 391.3 \nz\n\" style=\"fill: none\"/>\n   </g>\n   <g id=\"analisi1_lez25b_g6-matplotlib.axis_1\">\n    <g id=\"analisi1_lez25b_g6-xtick_1\">\n     <g id=\"analisi1_lez25b_g6-line2d_1\">\n      <path d=\"M 149.834483 391.3 \nL 149.834483 25.8 \n\" clip-path=\"url(#analisi1_lez25b_g6-p4438068c0a)\" style=\"fill: none; strok         {
          "subtitle": "Cosa succede se l'intervallo non è limitato?",
          "content": "<p>Se il dominio è illimitato, la funzione può crescere o decrescere indefinitamente. Sia $f(x) = e^x$ sull'intervallo $[1, +\\infty)$. L'intervallo è chiuso ma non limitato. La funzione è continua e crescente. Ammette un minimo assoluto nel punto $x=1$, dove vale $f(1)=e$. Tuttavia non ammette massimo, poiché è superiormente illimitata:</p>\n            <p>$$\\sup_{x \\in [1, +\\infty)} e^x = +\\infty$$</p>\n            <p><figure class=\"figura\" data-id=\"analisi1_lez25b_g7\"><svg xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"640pt\" height=\"400pt\" viewBox=\"0 0 640 400\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\">\n <metadata>\n  <rdf:RDF xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:cc=\"http://creativecommons.org/ns#\" xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\">\n   <cc:Work>\n    <dc:type rdf:resource=\"http://purl.org/dc/dcmitype/StillImage\"/>\n    <dc:format>image/svg+xml</dc:format>\n    <dc:creator>\n     <cc:Agent>\n      <dc:title>Matplotlib v3.11.2, https://matplotlib.org/</dc:title>\n     </cc:Agent>\n    </dc:creator>\n   </cc:Work>\n  </rdf:RDF>\n </metadata>\n <defs>\n  <style type=\"text/css\">*{stroke-linejoin: round; stroke-linecap: butt}</style>\n </defs>\n <g id=\"analisi1_lez25b_g7-figure_1\">\n  <g id=\"analisi1_lez25b_g7-patch_1\">\n   <path d=\"M 0 400 \nL 640 400 \nL 640 0 \nL 0 0 \nL 0 400 \nz\n\" style=\"fill: none; opacity: 0\"/>\n  </g>\n  <g id=\"analisi1_lez25b_g7-axes_1\">\n   <g id=\"analisi1_lez25b_g7-patch_2\">\n    <path d=\"M 44.8 364 \nL 614.4 364 \nL 614.4 24 \nL 44.8 24 \nL 44.8 364 \nz\n\" style=\"fill: none\"/>\n   </g>\n   <g id=\"analisi1_lez25b_g7-matplotlib.axis_1\">\n    <g id=\"analisi1_lez25b_g7-xtick_1\">\n     <g id=\"analisi1_lez25b_g7-line2d_1\">\n      <path d=\"M 44.8 364 \nL 44.8 24 \n\" clip-path=\"url(#analisi1_lez25b_g7-p90b2306d22)\" style=\"fill: none; stroke: #9aa4b2; stroke-opacity: 0.3; stroke-width: 0.6; stroke-linecap: square\"/>\n     {
      "id": "s25-es-teoria1",
      "type": "esercizio",
      "title": "Teoria 1",
      "kind": "teoria",
      "source": "integrazione",
      "content": "<p>Dai la definizione di zero di una funzione ed enuncia il teorema degli zeri precisando tutte le ipotesi. Perché nella tesi si può affermare che lo zero appartiene all'intervallo <em>aperto</em> $(a,b)$ e non soltanto a $[a,b]$?</p>",
      "solution": "<p><strong>Definizione.</strong> Data $f : D \\to \\mathbb{R}$, si dicono <strong>zeri</strong> di $f$ i punti $x \\in D$ tali che $f(x)=0$; geometricamente sono le ascisse dei punti in cui il grafico di $f$ interseca l'asse $x$.</p>\n        <p><strong>Teorema degli zeri.</strong> Sia $f : [a,b] \\to \\mathbb{R}$ con $a,b \\in \\mathbb{R}$, $a \\lt b$, $f$ continua in tutto $[a,b]$ e $f(a)\\cdot f(b) \\lt 0$; allora esiste almeno un punto $x_0 \\in (a,b)$ tale che $f(x_0)=0$.</p>\n        <p><strong>Ipotesi essenziali:</strong></p>\n        <ul>\n          <li>dominio che contiene l'intervallo chiuso e limitato $[a,b]$;</li>\n          <li>continuità su tutto $[a,b]$;</li>\n          <li>valori di segno opposto agli estremi.</li>\n        </ul>\n        <p><strong>Perché lo zero è interno.</strong> Dalla condizione $f(a)\\cdot f(b) \\lt 0$ segue</p>\n        <p>$$f(a) \\neq 0 \\quad \\text{e} \\quad f(b) \\neq 0,$$</p>\n        <p>dunque nessuno dei due estremi può essere uno zero: ogni zero di $f$ in $[a,b]$ è necessariamente interno, cioè sta in $(a,b)$.</p>\n        <p><strong>Osservazione finale.</strong> Il teorema afferma soltanto l'esistenza di <em>almeno</em> uno zero: non dice nulla sull'unicità.</p>"
    },
    {
      "id": "s25-es-teoria2",
      "type": "esercizio",
      "title": "Teoria 2",
      "kind": "teoria",
      "source": "integrazione",
      "content": "<p>Sia $f : A \\to \\mathbb{R}$ con $A \\subseteq \\mathbb{R}$ non vuoto. Dare la definizione di $\\sup_{x\\in A} f(x)$ e di punto di massimo assoluto, enunciare la caratterizzazione del supremum nel caso finito e nel caso infinito, e spiegare con un esempio perché il supremum può non essere un massimo.</p>",
      "solution": "<p><strong>Definizioni.</strong> Per definizione</p>\n        <p>$$\\sup_{x\\in A} f(x) = \\sup\\{f(x) \\mid x \\in A\\} = \\sup(\\mathrm{Im}(f)),$$</p>\n        <p>cioè il più piccolo dei maggioranti dell'immagine di $f$. Un punto $x_M \\in A$ si dice punto di massimo assoluto se $f(x_M) \\ge f(x)$ per ogni $x \\in A$; in tal caso $f(x_M) = \\sup_{x\\in A} f(x)$ e si dice che il supremum è raggiunto, cioè che è un <strong>massimo</strong>.</p>\n        <p><strong>Caso finito.</strong> Se $M = \\sup_{x\\in A} f(x) \\in \\mathbb{R}$ (equivalentemente $f$ è superiormente limitata), allora valgono:</p>\n        <ol>\n          <li>$f(x) \\le M$ per ogni $x \\in A$;</li>\n          <li>per ogni $\\varepsilon \\gt 0$ esiste $x \\in A$ con $f(x) \\gt M-\\varepsilon$, cioè $M-\\varepsilon$ non è più un maggiorante.</li>\n        </ol>\n        <p><strong>Caso infinito.</strong> La scrittura $M-\\varepsilon$ non ha senso se $M = +\\infty$; la caratterizzazione corretta è</p>\n        <p>$$\\sup_{x\\in A} f(x) = +\\infty \\iff \\forall K \\in \\mathbb{R} \\ \\exists x \\in A : f(x) \\gt K.$$</p>\n        <p><strong>Esempio in cui il sup non è massimo.</strong> Sia $f(x)=x$ su $A=(-1,1)$. Si ha $f(x) \\lt 1$ per ogni $x \\in A$, quindi $1$ è un maggiorante. Per ogni $\\varepsilon \\in (0,2)$ il punto $x = 1-\\varepsilon/2 \\in (-1,1)$ dà</p>\n        <p>$$f(x) = 1-\\frac{\\varepsilon}{2} \\gt 1-\\varepsilon,$$</p>\n        <p>dunque $\\sup_{x\\in A} f(x) = 1$. Ma non esiste $x \\in (-1,1)$ con $f(x)=1$: perciò il massimo non esiste.</p>\n        <p>Se invece $A=[-1,1]$, allora $\\sup f = 1 = f(1)$ e $x_M = 1$ è punto di massimo assoluto.</p>"
    },
    {
      "id": "s25-es-teoria3",
      "type": "esercizio",
      "title": "Teoria 3",
      "kind": "teoria",
      "source": "integrazione",
      "content": "<p>Mostra con un controesempio che l'ipotesi di continuità nel teorema degli zeri non può essere omessa. Stabilisci poi se la condizione $f(a)\\cdot f(b) \\lt 0$ è <em>necessaria</em> per l'esistenza di uno zero in $[a,b]$, giustificando la risposta con un esempio.</p>",
      "solution": "<p><strong>1) La continuità è indispensabile.</strong> Sia $f : [-1,1] \\to \\mathbb{R}$ definita da $f(x)=-1$ per $x \\lt 0$ e $f(x)=+1$ per $x \\ge 0$. Si ha</p>\n        <p>$$f(-1) = -1 \\lt 0, \\qquad f(1) = +1 \\gt 0, \\qquad f(-1)\\cdot f(1) = -1 \\lt 0,$$</p>\n        <p>ma $f$ assume solo i valori $-1$ e $+1$ e dunque non si annulla in nessun punto: la tesi cade perché $f$ non è continua in $x=0$ (i limiti laterali valgono $-1$ e $+1$). Questo mostra che l'ipotesi di continuità non può essere eliminata.</p>\n        <p><strong>2) La condizione sui segni è sufficiente ma non necessaria.</strong> Sia $f(x)=x^2$ su $[-1,1]$: è continua e</p>\n        <p>$$f(-1)\\cdot f(1) = 1 \\cdot 1 = 1 \\gt 0,$$</p>\n        <p>ciononostante $f(0)=0$, quindi uno zero esiste.</p>\n        <p>In generale, se $f(a)\\cdot f(b) \\gt 0$ il teorema non dà nessuna informazione: gli zeri possono esserci oppure no (ad esempio $f(x)=x^2+1$ su $[-1,1]$ non ne ha).</p>"
    },
    {
      "id": "s25-es-teoria4",
      "type": "esercizio",
      "title": "Teoria 4",
      "kind": "teoria",
      "source": "integrazione",
      "content": "<p>Enunciare il teorema di Weierstrass e mostrare, con un controesempio per ciascuna, che nessuna delle sue ipotesi può essere omessa. Spiegare infine in che senso tali ipotesi sono sufficienti ma non necessarie.</p>",
      "solution": "<p><strong>Enunciato.</strong> Se $f : [a,b] \\to \\mathbb{R}$ è continua su un intervallo chiuso e limitato $[a,b]$, allora $f$ ammette massimo e minimo assoluti, cioè esistono $x_m, x_M \\in [a,b]$ tali che</p>\n        <p>$$f(x_m) \\le f(x) \\le f(x_M) \\qquad \\forall x \\in [a,b].$$</p>\n        <p>Le ipotesi sono tre: continuità di $f$, dominio chiuso, dominio limitato.</p>\n        <p><strong>(1) Senza continuità.</strong> $f(x)=x^2$ per $x \\in [-1,1]$, $x \\ne 0$, e $f(0)=2$. Il dominio è chiuso e limitato; $f$ ha massimo $2$ in $x=0$, ma $\\inf f = 0$ non viene raggiunto, perché l'unico punto in cui $x^2$ varrebbe $0$ è $x=0$, dove $f$ vale $2$: il minimo non esiste.</p>\n        <p><strong>(2) Senza dominio chiuso.</strong> $f(x)=-x$ su $(-1,1)$ è continua e il dominio è limitato; l'immagine è $(-1,1)$, dunque $\\sup f = 1$ e $\\inf f = -1$, nessuno dei due raggiunto: non esistono né massimo né minimo. Un altro esempio di fallimento della conclusione di Weierstrass è $f(x)=1/(2-x)$ su $[-2,2)$: ha minimo $1/4$ in $x=-2$, ma non ha massimo perché è illimitata superiormente.</p>\n        <p><strong>(3) Senza dominio limitato.</strong> $f(x)=e^x$ su $[1,+\\infty)$ è continua e il dominio è chiuso; esiste il minimo $f(1)=e$, ma</p>\n        <p>$$\\sup_{x \\ge 1} e^x = +\\infty,$$</p>\n        <p>quindi il massimo non esiste.</p>\n        <p><strong>Sufficienti e non necessarie.</strong> Se tutte le ipotesi sono verificate la tesi è certamente vera; se una manca la tesi può ancora valere, semplicemente non è più garantita dal teorema. Ad esempio $f(x)=\\sin x$ su $\\mathbb{R}$ (dominio chiuso ma non limitato) ha massimo $1$ e minimo $-1$. I controesempi mostrano soltanto che, togliendo una singola ipotesi, esiste <em>almeno una</em> funzione per cui la tesi cade: perciò quell'ipotesi non può essere eliminata dall'enunciato.</p>"
    },

      "id": "s25-es-scritto1",
      "type": "esercizio",
      "title": "Scritto 1",
      "kind": "scritto",
      "source": "integrazione",
      "content": "<p>Determina gli zeri della funzione $f(x)=x^2-2x-2$ e risolvi la disequazione $x^2-2x-2 \\ge 0$.</p>",
      "solution": "<p><strong>Zeri.</strong> La funzione $f(x)=x^2-2x-2$ è un polinomio, dunque continua su $\\mathbb{R}$. Dalla formula risolutiva:</p>\n        <p>$$x = \\frac{2 \\pm \\sqrt{4+8}}{2} = \\frac{2 \\pm 2\\sqrt{3}}{2} = 1 \\pm \\sqrt{3},$$</p>\n        <p>cioè $x_1 = 1-\\sqrt{3} \\approx -0.73$ e $x_2 = 1+\\sqrt{3} \\approx 2.73$.</p>\n        <p><strong>Segno.</strong> Il coefficiente di $x^2$ è positivo, quindi la parabola ha concavità verso l'alto: $f$ è negativa fra le due radici e positiva al loro esterno. Verifica numerica:</p>\n        <p>$$f(0) = -2 \\lt 0 \\quad \\text{con } 0 \\in (1-\\sqrt{3},\\,1+\\sqrt{3}), \\qquad f(4) = 16-8-2 = 6 \\gt 0.$$</p>\n        <p><strong>Soluzione della disequazione.</strong> Poiché la disequazione non è stretta, gli zeri vanno inclusi:</p>\n        <p>$$S = \\left(-\\infty,\\, 1-\\sqrt{3}\\right] \\cup \\left[1+\\sqrt{3},\\, +\\infty\\right).$$</p>\n        <p><figure class=\"figura\" data-id=\"analisi1_lez25a_gp1\"><svg xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"640pt\" height=\"400pt\" viewBox=\"0 0 640 400\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\">\n <metadata>\n  <rdf:RDF xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:cc=\"http://creativecommons.org/ns#\" xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\">\n   <cc:Work>\n    <dc:type rdf:resource=\"http://purl.org/dc/dcmitype/StillImage\"/>\n    <dc:format>image/svg+xml</dc:format>\n    <dc:creator>\n     <cc:Agent>\n      <dc:title>Matplotlib v3.11.2, https://matplotlib.org/</dc:title>\n     </cc:Agent>\n    </dc:creator>\n   </cc:Work>\n  </rdf:RDF>\n </metadata>\n <defs>\n  <style type=\"text/css\">*{stroke-linejoin: round; stroke-linecap: butt}</style>\n </defs>\n <g id=\"analisi1_lez25a_gp1-figure_1\">\n  <g id=\"analisi1_lez25a_gp1-patch_1\">\n   <path d=\"M 0 400 \nL 640 400 \nL 640 0 \nL 0 0 \nL 0 400 \nz\n\" style=\"fill: none; opacity: 0\"/>\n  </g>\n  <g id=\"analisi1_lez25a_gp1-axes_1\">\n   <g id=\"analisi1_l     {
      "id": "s25-es-scritto2",
      "type": "esercizio",
      "title": "Scritto 2",
      "kind": "scritto",
      "source": "integrazione",
      "content": "<p>Sia $f(x)=2x-x^2$ su $[0,3]$. Verificare le ipotesi del teorema di Weierstrass e determinare esplicitamente punti e valori di massimo e minimo assoluti.</p>",
      "solution": "<p><strong>Verifica delle ipotesi.</strong> La funzione $f(x)=2x-x^2$ è un polinomio, quindi continua su tutto $\\mathbb{R}$ e in particolare su $[0,3]$, che è un intervallo chiuso e limitato. Le ipotesi di Weierstrass sono soddisfatte: massimo e minimo assoluti <strong>esistono</strong>.</p>\n        <p><strong>Completamento del quadrato.</strong> Poiché $x^2-2x = (x-1)^2-1$, si ha</p>\n        <p>$$f(x) = -(x^2-2x) = -\\left[(x-1)^2-1\\right] = 1-(x-1)^2 .$$</p>\n        <p><strong>Massimo.</strong> Essendo $(x-1)^2 \\ge 0$, segue</p>\n        <p>$$f(x) = 1-(x-1)^2 \\le 1 \\qquad \\forall x,$$</p>\n        <p>con uguaglianza se e solo se $x=1$. Dato che $1 \\in [0,3]$, il punto $x_M = 1$ è punto di massimo assoluto e il valore massimo è $f(1)=1$.</p>\n        <p><strong>Minimo.</strong> Se $x \\in [0,3]$ allora</p>\n        <p>$$-1 \\le x-1 \\le 2 \\ \\Longrightarrow \\ 0 \\le (x-1)^2 \\le 4 \\ \\Longrightarrow \\ f(x) = 1-(x-1)^2 \\ge 1-4 = -3,$$</p>\n        <p>con uguaglianza se e solo se $(x-1)^2 = 4$, cioè $x=3$ oppure $x=-1$. Poiché $-1 \\notin [0,3]$, l'unico punto di minimo assoluto è $x_m = 3$, con valore minimo $f(3)=-3$.</p>\n        <p><strong>Conclusione.</strong></p>\n        <p>$$\\max_{[0,3]} f = \\sup_{[0,3]} f = 1, \\qquad \\min_{[0,3]} f = \\inf_{[0,3]} f = -3 .$$</p>\n        <p>Si noti che il massimo cade all'interno dell'intervallo e il minimo in un estremo, coerentemente col fatto che il teorema non dice nulla sulla posizione dei punti estremi.</p>\n        <p><figure class=\"figura\" data-id=\"analisi1_lez25b_gp1\"><svg xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"720pt\" height=\"430pt\" viewBox=\"0 0 720 430\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\">\n <metadata>\n  <rdf:RDF xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:cc=\"http://creativecommons.org/ns#\" xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\">\n   <cc:Work>\n    <dc:type rdf:resource=\"http://purl.org/dc/dcmitype/StillIma     {
      "id": "s25-es-scritto3",
      "type": "esercizio",
      "title": "Scritto 3",
      "kind": "scritto",
      "source": "integrazione",
      "content": "<p>Dimostra che l'equazione $x^3+x-1=0$ ha una e una sola soluzione reale e che essa appartiene a $(0,1)$; localizzala poi in un intervallo di ampiezza $\\frac{1}{4}$ eseguendo due passi del metodo di bisezione.</p>",
      "solution": "<p><strong>Esistenza.</strong> Sia $f(x)=x^3+x-1$: è un polinomio, quindi continua su $\\mathbb{R}$ e in particolare su $[0,1]$. Si ha</p>\n        <p>$$f(0) = -1 \\lt 0, \\qquad f(1) = 1+1-1 = 1 \\gt 0, \\qquad f(0)\\cdot f(1) = -1 \\lt 0 .$$</p>\n        <p>Per il teorema degli zeri esiste almeno un $x_0 \\in (0,1)$ con $f(x_0)=0$.</p>\n        <p><strong>Unicità (con la sola monotonia).</strong> Siano $u \\lt v$. Allora $u^3 \\lt v^3$ (la funzione cubo è strettamente crescente) e $u \\lt v$; sommando le due disuguaglianze e sottraendo $1$ a entrambi i membri:</p>\n        <p>$$u^3 + u - 1 \\lt v^3 + v - 1, \\qquad \\text{cioè} \\qquad f(u) \\lt f(v).$$</p>\n        <p>Dunque $f$ è strettamente crescente su $\\mathbb{R}$. Se fosse $f(u)=f(v)=0$ con $u \\lt v$, dalla stretta crescenza seguirebbe $f(u) \\lt f(v)$: assurdo. Due zeri distinti sono quindi impossibili e la soluzione reale è unica.</p>\n        <p><strong>Primo passo di bisezione.</strong></p>\n        <p>$$c_0 = \\frac{0+1}{2} = \\frac{1}{2}, \\qquad f\\!\\left(\\frac{1}{2}\\right) = \\frac{1}{8}+\\frac{1}{2}-1 = -\\frac{3}{8} \\lt 0,$$</p>\n        <p>dello stesso segno di $f(0)$. Il cambio di segno avviene allora in $\\left[\\frac{1}{2},1\\right]$: poniamo $a_1 = \\frac{1}{2}$, $b_1 = 1$.</p>\n        <p><strong>Secondo passo.</strong></p>\n        <p>$$c_1 = \\frac{1/2+1}{2} = \\frac{3}{4}, \\qquad f\\!\\left(\\frac{3}{4}\\right) = \\frac{27}{64}+\\frac{3}{4}-1 = \\frac{11}{64} \\gt 0,$$</p>\n        <p>dello stesso segno di $f(1)$. Quindi $a_2 = \\frac{1}{2}$, $b_2 = \\frac{3}{4}$ e</p>\n        <p>$$x_0 \\in \\left(\\frac{1}{2},\\frac{3}{4}\\right), \\qquad \\text{ampiezza} = \\frac{1-0}{2^2} = \\frac{1}{4}.$$</p>\n        <p>In effetti $x_0 \\approx 0.682$.</p>\n        <p><figure class=\"figura\" data-id=\"analisi1_lez25a_gp2\"><svg xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"640pt\" height=\"400pt\" viewBox=\"0 0 640 400\" xmlns=\"http://www.w3.org/2000/svg\" version=     {
      "id": "s25-es-scritto4",
      "type": "esercizio",
      "title": "Scritto 4",
      "kind": "scritto",
      "source": "integrazione",
      "content": "<p>Sia $f(x)=\\dfrac{x}{x-2}$ su $[0,2)$. Stabilire se le ipotesi di Weierstrass sono soddisfatte e determinare $\\sup f$, $\\inf f$ e, quando esistono, massimo e minimo.</p>",
      "solution": "<p><strong>Verifica delle ipotesi.</strong> Il dominio $[0,2)$ è limitato ma <strong>non chiuso</strong>; su di esso $f$ è continua, perché il denominatore si annulla solo in $x=2 \\notin [0,2)$. Manca quindi l'ipotesi di chiusura del dominio e l'esistenza di massimo e minimo non è garantita.</p>\n        <p><strong>Monotonia.</strong> Riscriviamo</p>\n        <p>$$f(x) = \\frac{x-2+2}{x-2} = 1+\\frac{2}{x-2}.$$</p>\n        <p>Per $x \\in [0,2)$ si ha $x-2 \\lt 0$; al crescere di $x$ la quantità $x-2$ cresce restando negativa, quindi $\\frac{2}{x-2}$ decresce e $f$ è <strong>strettamente decrescente</strong> su $[0,2)$.</p>\n        <p><strong>Massimo.</strong> Il valore più grande è assunto nell'estremo sinistro:</p>\n        <p>$$f(0) = \\frac{0}{-2} = 0 \\ \\Longrightarrow \\ \\sup_{[0,2)} f = \\max_{[0,2)} f = 0, \\quad x_M = 0 .$$</p>\n        <p><strong>Minimo.</strong> Inoltre</p>\n        <p>$$\\lim_{x \\to 2^-} \\frac{x}{x-2} = -\\infty,$$</p>\n        <p>poiché il numeratore tende a $2 \\gt 0$ e il denominatore a $0^-$. Quindi $f$ non è inferiormente limitata, $\\inf_{[0,2)} f = -\\infty$ e il minimo <strong>non esiste</strong> (del resto $-\\infty$ non è un numero reale, quindi non può essere un valore di $f$).</p>\n        <p><strong>Immagine.</strong> $\\mathrm{Im}(f) = (-\\infty, 0]$.</p>\n        <p>L'esempio mostra che l'ipotesi di dominio chiuso non può essere omessa nel teorema di Weierstrass.</p>\n        <p><figure class=\"figura\" data-id=\"analisi1_lez25b_gp2\"><svg xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"720pt\" height=\"430pt\" viewBox=\"0 0 720 430\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\">\n <metadata>\n  <rdf:RDF xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:cc=\"http://creativecommons.org/ns#\" xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\">\n   <cc:Work>\n    <dc:type rdf:resource=\"http://purl.org/dc/dcmitype/StillImage\"/>\n    <dc:date>2026-11-05T05:36:16.069381</dc:date>\   "oral_cards": [
    {
      "type": "definizione",
      "front": "Che cosa sono gli zeri di una funzione?",
      "back": "Data $f: D \\to \\mathbb{R}$, si dicono <strong>zeri</strong> di $f$ tutti i punti $x \\in D$ tali che $f(x) = 0$. Geometricamente sono le ascisse dei punti in cui il grafico interseca l'asse $x$."
    },
    {
      "type": "formula",
      "front": "Enuncia il Teorema degli Zeri con tutte le ipotesi.",
      "back": "Sia $f: [a,b] \\to \\mathbb{R}$ continua in $[a,b]$, con $a,b \\in \\mathbb{R}$ e $a \\lt b$. Se $f(a)\\cdot f(b) \\lt 0$, allora esiste almeno un $x_0 \\in (a,b)$ tale che $f(x_0)=0$. Ipotesi: continuità su tutto $[a,b]$ e segni discordi agli estremi."
    },
    {
      "type": "domanda",
      "front": "Perché nel Teorema degli Zeri lo zero si trova nell'intervallo APERTO $(a,b)$?",
      "back": "Perché $f(a)\\cdot f(b) \\lt 0$ implica $f(a) \\neq 0$ e $f(b) \\neq 0$: nessuno dei due estremi può essere uno zero, quindi ogni zero è necessariamente interno."
    },
    {
      "type": "dimostrazione",
      "front": "Come funziona il metodo di bisezione nella dimostrazione del Teorema degli Zeri?",
      "back": "Con $f(a) \\lt 0$ e $f(b) \\gt 0$, si pone $a_0=a$, $b_0=b$ e $c_n = \\frac{a_n+b_n}{2}$. Si tiene la metà dove $f$ cambia segno. Le successioni $(a_n)$ non decrescente e $(b_n)$ non crescente sono limitate, quindi convergono; poiché $b_n - a_n = \\frac{b-a}{2^n} \\to 0$ hanno lo stesso limite $x_0$. Per il teorema ponte $f(a_n) \\to f(x_0)$ e $f(b_n) \\to f(x_0)$; per la permanenza del segno $f(x_0) \\le 0$ e $f(x_0) \\ge 0$, dunque $f(x_0)=0$."
    },
    {
      "type": "tranello",
      "front": "Il Teorema degli Zeri garantisce l'unicità dello zero?",
      "back": "NO. Garantisce l'esistenza di <em>almeno</em> uno zero. Potrebbero essercene più di uno. Per l'unicità serve un argomento aggiuntivo, ad esempio la stretta monotonia della funzione."
    },
    {
      "type": "tranello",
      "front": "Se $f(a)\\cdot f(b) \\gt 0$, posso concludere che $f$ non ha zeri in $[a,b]$?",
      "back": "NO. La condizione sui segni è <strong>sufficiente ma non necessaria</strong>. Esempio: $f(x)=x^2$ su $[-1,1]$ ha $f(-1)\\cdot f(1) = 1 \\gt 0$, ma $f(0)=0$. Mentre $f(x)=x^2+1$ su $[-1,1]$ non ha zeri. Con segni concordi il teorema semplicemente non dà informazioni."
    },
    {
      "type": "definizione",
      "front": "Qual è la differenza tra sup e max di una funzione?",
      "back": "Il <strong>sup</strong> è il più piccolo dei maggioranti dell'immagine di $f$. Diventa <strong>massimo</strong> solo se è anche un valore raggiunto dalla funzione, cioè se esiste $x_M \\in A$ con $f(x_M) = \\sup_{x\\in A} f(x)$. Esempio: $f(x)=x$ su $(-1,1)$ ha $\\sup f = 1$ ma non ha massimo."
    },
    {
      "type": "formula",
      "front": "Caratterizzazione del supremum: caso finito e caso infinito.",
      "back": "Se $M = \\sup_{x\\in A} f(x) \\in \\mathbb{R}$: (i) $f(x) \\le M$ per ogni $x \\in A$; (ii) $\\forall \\varepsilon \\gt 0 \\ \\exists x \\in A : f(x) \\gt M-\\varepsilon$. Se invece $f$ non è superiormente limitata: $\\sup_{x\\in A} f(x) = +\\infty \\iff \\forall K \\in \\mathbb{R} \\ \\exists x \\in A : f(x) \\gt K$. La scrittura $M-\\varepsilon$ ha senso solo per $M$ finito!"
    },
    {
      "type": "formula",
      "front": "Enuncia il Teorema di Weierstrass.",
      "back": "Sia $f: [a,b] \\to \\mathbb{R}$ continua su un intervallo <strong>chiuso e limitato</strong>. Allora $f$ ammette massimo e minimo assoluti: esistono $x_m, x_M \\in [a,b]$ con $f(x_m) \\le f(x) \\le f(x_M)$ per ogni $x \\in [a,b]$."
    },
    {
      "type": "dimostrazione",
      "front": "Qual è la struttura della dimostrazione del Teorema di Weierstrass?",
      "back": "Posto $p = \\sup\\{f(x) \\mid x \\in [a,b]\\}$: <strong>Passo 0</strong> si esclude $p=+\\infty$ per assurdo (Bolzano-Weierstrass + teorema ponte: una successione non può convergere a $f(x_0) \\in \\mathbb{R}$ e divergere a $+\\infty$). <strong>Passo 1</strong> si costruisce $x_n$ con $p-\\frac{1}{n} \\lt f(x_n) \\le p$. <strong>Passo 2</strong> Bolzano-Weierstrass dà una sottosuccessione $x_{k_n} \\to x_0 \\in [a,b]$. <strong>Passo 3</strong> teorema ponte: $f(x_{k_n}) \\to f(x_0)$. <strong>Passo 4</strong> due carabinieri: $f(x_{k_n}) \\to p$, dunque $f(x_0)=p$. <strong>Passo 5</strong> il minimo si ottiene applicando il risultato a $-f$."
    },
    {
      "type": "domanda",
      "front": "Perché nella dimostrazione di Weierstrass serve il Passo 0 (esclusione di $p=+\\infty$)?",
      "back": "Perché la caratterizzazione del supremum con $p-\\varepsilon$ ha senso solo se $p$ è un numero reale. Il Passo 0 dimostra, come fatto interessante di per sé, che <strong>una funzione continua su un intervallo chiuso e limitato è superiormente limitata</strong>."
    },
    {
      "type": "domanda",
      "front": "Controesempio a Weierstrass se manca la continuità.",
      "back": "$f(x)=x^2$ su $[-1,1]$ con $x \\ne 0$, e $f(0)=2$. Il dominio è chiuso e limitato. $f$ ha massimo $2$ in $x=0$, ma $\\inf f = 0$ non è raggiunto: l'unico punto dove $x^2$ varrebbe $0$ è $x=0$, dove $f$ vale $2$. Il minimo non esiste."
    },
    {
      "type": "domanda",
      "front": "Controesempi a Weierstrass se il dominio non è chiuso o non è limitato.",
      "back": "<strong>Non chiuso</strong>: $f(x)=-x$ su $(-1,1)$ è continua, immagine $(-1,1)$, $\\sup f = 1$ e $\\inf f = -1$ non raggiunti: né max né min. <strong>Non limitato</strong>: $f(x)=e^x$ su $[1,+\\infty)$ ha minimo $f(1)=e$ ma $\\sup_{x\\ge 1} e^x = +\\infty$, quindi nessun massimo."
    },
    {
      "type": "tranello",
      "front": "Se le ipotesi di Weierstrass non sono verificate, la funzione non ha massimo né minimo. Vero o falso?",
      "back": "FALSO. Le ipotesi sono <strong>sufficienti, non necessarie</strong>: se mancano, la tesi può ancora valere, semplicemente non è garantita dal teorema. Esempio: $f(x)=\\sin x$ su $\\mathbb{R}$ (dominio chiuso ma illimitato) ha massimo $1$ e minimo $-1$. I controesempi servono solo a mostrare che l'ipotesi non può essere eliminata dall'enunciato."
    },
    {
      "type": "tranello",
      "front": "Weierstrass mi dice DOVE si trovano massimo e minimo?",
      "back": "NO. Weierstrass garantisce solo l'<strong>esistenza</strong>. Per <strong>determinare</strong> punti e valori serve uno studio della funzione (stime, monotonia, più avanti la derivata). Esempio: $f(x)=x^2$ su $[-1,2]$ ha minimo $0$ in $x=0$ (interno) e massimo $4$ in $x=2$ (estremo): il teorema non dice nulla sulla posizione."
    },
    {
      "type": "definizione",
      "front": "Corollario di limitatezza di Weierstrass.",
      "back": "Una funzione continua su un intervallo chiuso e limitato è <strong>limitata</strong>: esiste $C \\gt 0$ con $|f(x)| \\le C$ per ogni $x \\in [a,b]$; basta prendere $C = \\max\\{|f(x_m)|, |f(x_M)|\\}+1$. Tutte le ipotesi servono: $f(x)=\\frac{1}{2-x}$ su $[-2,2)$ è continua ma illimitata, perché il dominio non è chiuso."
    }
  ]
};
