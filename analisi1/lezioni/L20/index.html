<script>
const LESSON = {
    id: "L20", date: "Lezione 20 — 23 Ott 2026",
    title: "Limiti di Funzioni: Definizione, Negazione e Teorema Ponte",
    abstract: "Dalla nozione di limite di successione passiamo al limite di funzione: definizione $\\varepsilon$-$\\delta$, formulazione topologica con gli intorni, estensione ai casi infiniti, limiti unilateri e per eccesso/difetto. Chiudiamo con la negazione della definizione e il Teorema Ponte, strumento principe per dimostrare che un limite non esiste.",

    sections: [
      {
        id: "s20-introduzione",
        type: "section",
        title: "Introduzione e idea di limite",
        icon: "🎯",
        content: `<p>L'obiettivo della lezione è dare un significato rigoroso alla scrittura</p>
        <p>$$\\lim_{x \\to x_0} f(x) = L$$</p>
        <p>Questo concetto è un'<strong>estensione</strong> di quanto già visto per le successioni. Una successione è una funzione definita sui numeri naturali, $a_n = f(n)$, e ne abbiamo studiato il comportamento per $n \\to +\\infty$. In quel caso la variabile $n$ tendeva a un punto di accumulazione per i numeri naturali, ovvero $+\\infty$, e noi studiavamo il valore assunto dalla successione.</p>
        <p>Ora generalizziamo: vogliamo studiare il valore di una funzione $f(x)$ quando la variabile $x$ si avvicina a un certo punto $x_0$. Sia $f: A \\to \\mathbb{R}$ con $A \\subseteq \\mathbb{R}$. Sia il punto $x_0$ sia il valore $L$ possono essere numeri reali finiti oppure $\\pm\\infty$: formalmente diremo che $x_0$ e $L$ appartengono alla <strong>retta reale estesa</strong></p>
        <p>$$\\mathbb{R}^* = \\mathbb{R} \\cup \\{-\\infty, +\\infty\\}.$$</p>`,
        subsections: [
          {
            subtitle: "I ruoli asimmetrici di $x_0$ e $L$",
            content: `<p>Le due lettere hanno ruoli <strong>asimmetrici</strong> e vanno lette con attenzione:</p>
            <ul>
              <li>su $x_0$ si fa un'<strong>ipotesi vera e propria</strong>: $x_0 \\in \\mathbb{R}^*$ deve essere <strong>punto di accumulazione del dominio</strong> $A$. Senza questa ipotesi non ci sarebbero punti di $A$ arbitrariamente vicini a $x_0$ e la domanda «cosa fa $f$ vicino a $x_0$?» sarebbe priva di senso;</li>
              <li>su $L$ <strong>non</strong> si fa alcuna ipotesi: $L \\in \\mathbb{R}^*$ è semplicemente un <strong>candidato valore del limite</strong>, che la definizione dovrà confermare o smentire.</li>
            </ul>`
          },
          {
            subtitle: "Su $L$ non si richiede nulla",
            content: `<p>In particolare <strong>non</strong> si richiede che $L$ sia punto di accumulazione dell'immagine $f(A)$, né che $L$ sia un valore effettivamente assunto da $f$. Il controesempio più semplice è la funzione costante $f(x) = 3$ su $A = \\mathbb{R}$: si ha $\\lim_{x \\to 0} f(x) = 3$, ma l'immagine è $f(A) = \\{3\\}$, insieme che non ha punti di accumulazione. L'ipotesi di accumulazione riguarda dunque soltanto $x_0$ rispetto al dominio $A$.</p>`
          },
          {
            subtitle: "Idea intuitiva e lettura grafica",
            content: `<p>L'idea di base è capire come si comporta il valore $f(x)$ man mano che $x$ si avvicina a $x_0$, <strong>senza necessariamente assumere il valore $x_0$</strong>.</p>
            <p>Consideriamo una funzione definita su un intervallo $[a, b]$ e un punto $x_0 \\in (a, b)$. Il valore della funzione in $x_0$ è $f(x_0)$. Ci chiediamo quale sia il limite della funzione per $x$ che tende a $x_0$.</p>

            <p>Guardando il grafico, ci sembra che il limite sia $L$ perché, man mano che ci avviciniamo a $x_0$ (banda verticale attorno a $x_0$), i valori della funzione $f(x)$ si avvicinano sempre di più a $L$ (banda orizzontale attorno a $L$). Un altro valore, come quello indicato più in alto, non può essere il limite.</p>
            <p>Questa idea è la stessa che avevamo per le successioni: per ogni intorno del limite, la successione vi cadeva definitivamente. Qui la logica è analoga:</p>
            <blockquote><p>Per ogni intorno di $L$, esiste un intorno di $x_0$ (escluso $x_0$ stesso, poiché il valore in $x_0$ non è rilevante per il limite) tale che per ogni $x$ in questo intorno che appartenga al dominio $A$, il valore $f(x)$ cade nell'intorno di $L$.</p></blockquote>`
          }
        ]
      },
      {
        id: "s20-definizione-formale",
        type: "section",
        title: "Definizione formale di limite ($\\varepsilon$-$\\delta$)",
        icon: "📐",
        content: `<p>Iniziamo con il caso più comune, in cui sia $x_0$ sia $L$ sono numeri reali finiti.</p>`,
        subsections: [
          {
            subtitle: "Definizione: limite finito per $x$ tendente a un valore finito",
            content: `<p>Sia $f: A \\to \\mathbb{R}$ una funzione, con $A \\subseteq \\mathbb{R}$, e sia $x_0$ un <strong>punto di accumulazione per $A$</strong>. Si dice che il limite di $f(x)$ per $x$ che tende a $x_0$ è $L$, e si scrive $\\lim_{x \\to x_0} f(x) = L$, se vale la <strong>definizione $\\varepsilon$-$\\delta$</strong>:</p>
            <blockquote><p>Per ogni $\\varepsilon \\gt 0$, esiste un $\\delta \\gt 0$ tale che per ogni $x \\in A$ con $0 \\lt |x - x_0| \\lt \\delta$, si ha $|f(x) - L| \\lt \\varepsilon$.</p></blockquote>
            <p>La condizione $0 \\lt |x - x_0|$ significa esattamente che $x \\neq x_0$.</p>
            <p>Equivalentemente, usando la <strong>definizione topologica (con gli intorni)</strong>:</p>
            <blockquote><p>Per ogni intorno $U$ di $L$, esiste un intorno $V$ di $x_0$ tale che per ogni $x \\in (V \\setminus \\{x_0\\}) \\cap A$, si ha $f(x) \\in U$.</p></blockquote>`
          },
          {
            subtitle: "Come si legge l'ordine dei quantificatori",
            content: `<p>L'ordine è essenziale: <strong>prima</strong> viene assegnato $\\varepsilon$ (la tolleranza che vogliamo sui valori di $f$), <strong>poi</strong> si deve <em>trovare</em> $\\delta$. Quindi $\\delta$ può dipendere da $\\varepsilon$ (di solito $\\varepsilon$ piccolo costringe $\\delta$ piccolo), ma una volta scelto $\\delta$ la disuguaglianza $|f(x) - L| \\lt \\varepsilon$ deve valere per <strong>tutti</strong> gli $x \\in A$ con $0 \\lt |x-x_0| \\lt \\delta$, non solo per qualcuno.</p>`
          },
          {
            subtitle: "Esempio illustrativo: verifica della definizione",
            content: `<p>Sia $f(x) = 2x$, definita su $A = \\mathbb{R}$, e verifichiamo che $\\lim_{x \\to 1} 2x = 2$, cioè $x_0 = 1$ e $L = 2$.</p>
            <p><strong>Passo 1: si scrive la quantità da rendere piccola.</strong></p>
            <p>$$|f(x) - L| = |2x - 2| = 2|x - 1| .$$</p>
            <p><strong>Passo 2: si lega questa quantità a $|x - x_0|$.</strong> Qui il legame è immediato: $|f(x)-L| = 2|x-1|$.</p>
            <p><strong>Passo 3: si sceglie $\\delta$.</strong> Fissiamo $\\varepsilon \\gt 0$ e poniamo $\\delta = \\dfrac{\\varepsilon}{2} \\gt 0$. Allora, per ogni $x \\in \\mathbb{R}$ con $0 \\lt |x - 1| \\lt \\delta$, si ha</p>
            <p>$$|f(x) - 2| = 2|x-1| \\lt 2\\delta = 2 \\cdot \\frac{\\varepsilon}{2} = \\varepsilon .$$</p>
            <p>Poiché $\\varepsilon \\gt 0$ era arbitrario, la definizione è soddisfatta e il limite è $2$.</p>
            <p><strong>Lettura numerica.</strong> Se vogliamo $|f(x)-2| \\lt 0{,}1$ basta prendere $\\delta = 0{,}05$: ogni $x$ con $0 \\lt |x-1| \\lt 0{,}05$ dà $f(x) \\in (1{,}9\\,;\\,2{,}1)$. Se invece pretendiamo $\\varepsilon = 0{,}001$, dobbiamo stringere a $\\delta = 0{,}0005$. Si vede bene che $\\delta$ <strong>dipende</strong> da $\\varepsilon$, ma per ciascun $\\varepsilon$ il $\\delta$ trovato funziona per <em>tutti</em> gli $x$ ammessi.</p>`
          },
          {
            subtitle: "Proprietà valida definitivamente",
            content: `<p>Per rendere le definizioni più compatte, introduciamo un concetto che generalizza quello di «definitivamente» visto per le successioni.</p>
            <p>Sia $P(x)$ una proposizione che dipende da $x \\in A$, e sia $x_0$ un punto di accumulazione per $A$. Diremo che $P(x)$ è <strong>vera definitivamente per $x \\to x_0$</strong> se esiste un intorno $V$ di $x_0$ tale che $P(x)$ è vera per ogni $x \\in (V \\setminus \\{x_0\\}) \\cap A$.</p>
            <p>Con questa terminologia la definizione di limite si riformula in modo molto elegante: la scrittura $\\lim_{x \\to x_0} f(x) = L$ equivale ad affermare che</p>
            <blockquote><p>Per ogni intorno $U$ di $L$, la proprietà $f(x) \\in U$ è vera definitivamente per $x \\to x_0$.</p></blockquote>`
          },
          {
            subtitle: "Lettura grafica: una verifica numerica",
            content: `<p>Per $f(x)=4x-3$, in $x_0=2$ il limite è $L=5$. Fissato $\\varepsilon=0{,}02$, scegliamo $\\delta=0{,}005$: infatti $|f(x)-5|=4|x-2|\\lt 0{,}02$ se $0\\lt|x-2|\\lt 0{,}005$.</p><figure class="figura" data-id="analisi1_lez20a_gp1"><svg xmlns:xlink="http://www.w3.org/1999/xlink" width="640pt" height="400pt" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" version="1.1">

          { label: "Definizione con intorni", latex: "\\forall U \\text{ intorno di } L\\ \\exists V \\text{ intorno di } x_0 : \\forall x \\in (V \\setminus \\{x_0\\}) \\cap A,\\ f(x) \\in U" },

        type: "alert_box",
        title: "Il limite ignora il valore in $x_0$",
        icon: "⚠️",
        content: `<p>La cosa fondamentale da notare è che la definizione di limite <strong>non si interessa di cosa fa la funzione nel punto $x_0$</strong>. Il valore $f(x_0)$ potrebbe non esistere (se $x_0 \\notin A$) oppure essere diverso da $L$. Il limite descrive il comportamento della funzione <em>vicino</em> a $x_0$, mai <em>in</em> $x_0$.</p>

            <p>Il grafico mostra una funzione con asintoto verticale in $x = 2$.</p>`
          },
          {
            subtitle: "Esempio illustrativo: scelta di $\\delta$ in funzione di $M$",
            content: `<p>Sia $f(x) = \\dfrac{1}{(x-2)^2}$ su $A = \\mathbb{R} \\setminus \\{2\\}$, la funzione del grafico precedente, e verifichiamo che $\\lim_{x \\to 2} f(x) = +\\infty$.</p>
            <p>Fissiamo $M \\in \\mathbb{R}$; possiamo supporre $M \\gt 0$ (se $M \\le 0$ la condizione $f(x) \\gt M$ è automatica, perché $f \\gt 0$). Vogliamo</p>
            <p>$$\\frac{1}{(x-2)^2} \\gt M \\iff (x-2)^2 \\lt \\frac{1}{M} \\iff |x - 2| \\lt \\frac{1}{\\sqrt{M}} .$$</p>
            <p>Basta quindi scegliere $\\delta = \\dfrac{1}{\\sqrt{M}} \\gt 0$: per ogni $x$ con $0 \\lt |x-2| \\lt \\delta$ si ha $f(x) \\gt M$. Ad esempio, per $M = 10^4$ si prende $\\delta = 10^{-2}$.</p>`
          },
          {
            subtitle: "Limite finito per $x$ tendente a infinito",
            content: `<p>Consideriamo il caso $x \\to -\\infty$, cioè $\\lim_{x \\to -\\infty} f(x) = L$. Gli intorni di $-\\infty$ sono della forma $(-\\infty, M)$.</p>
            <p><strong>Definizione.</strong> Si dice che $\\lim_{x \\to -\\infty} f(x) = L$ se:</p>
            <blockquote><p>Per ogni $\\varepsilon \\gt 0$, esiste un $M \\in \\mathbb{R}$ tale che per ogni $x \\in A$ con $x \\lt M$, si ha $|f(x) - L| \\lt \\varepsilon$.</p></blockquote>`
          },
          {
            subtitle: "Definizione generale di limite",
            content: `<p>Tutti i casi visti (e quelli non esplicitati, come $x_0 = \\infty$, $L = \\infty$) si unificano in un'unica definizione generale, nel linguaggio degli intorni.</p>
            <p>Sia $f: A \\to \\mathbb{R}$ con $A \\subseteq \\mathbb{R}$. Siano $x_0, L \\in \\mathbb{R}^*$, con $x_0$ punto di accumulazione per $A$. Si dice che $\\lim_{x \\to x_0} f(x) = L$ se per ogni intorno $U$ di $L$ esiste un intorno $V$ di $x_0$ tale che</p>
            <p>$$\\forall x \\in (V \\setminus \\{x_0\\}) \\cap A : \\quad f(x) \\in U .$$</p>
            <p>Questa definizione è potente perché si adatta automaticamente a seconda che $x_0$ e $L$ siano finiti o infiniti, semplicemente cambiando la forma degli intorni: per $L$ finito si prende $U = (L-\\varepsilon, L+\\varepsilon)$, per $L = +\\infty$ si prende $U = (M, +\\infty)$, per $L = -\\infty$ si prende $U = (-\\infty, M)$; analogamente per $V$ attorno a $x_0$.</p>`
          }
        ],
        formulas: [
          { label: "Limite $+\\infty$ in $x_0$ finito", latex: "\\forall M \\in \\mathbb{R}\\ \\exists \\delta \\gt 0 : 0 \\lt |x-x_0| \\lt \\delta \\Rightarrow f(x) \\gt M" },
          { label: "Limite finito per $x \\to -\\infty$", latex: "\\forall \\varepsilon \\gt 0\\ \\exists M \\in \\mathbb{R} : x \\lt M \\Rightarrow |f(x)-L| \\lt \\varepsilon" }
        ],
        table_compare: {
          headers: ["Caso", "Forma dell'intorno", "Parametro"],
          rows: [
            ["$L \\in \\mathbb{R}$", "$U = (L-\\varepsilon, L+\\varepsilon)$", "$\\varepsilon \\gt 0$"],
            ["$L = +\\infty$", "$U = (M, +\\infty)$", "$M \\in \\mathbb{R}$"],
            ["$L = -\\infty$", "$U = (-\\infty, M)$", "$M \\in \\mathbb{R}$"],
            ["$x_0 \\in \\mathbb{R}$", "$V = (x_0-\\delta, x_0+\\delta)$", "$\\delta \\gt 0$"],
            ["$x_0 = +\\infty$", "$V = (N, +\\infty)$", "$N \\in \\mathbb{R}$"],
            ["$x_0 = -\\infty$", "$V = (-\\infty, N)$", "$N \\in \\mathbb{R}$"]
          ]
        }
      },
      {
        id: "s20-unilateri",
        type: "section",
        title: "Limiti unilateri (destro e sinistro)",
        icon: "↔️",
        content: `<p>A volte è utile specificare <em>come</em> la variabile $x$ si avvicina a $x_0$. Possiamo studiare il comportamento della funzione quando ci avviciniamo a $x_0$ solo <strong>da destra</strong> (valori più grandi di $x_0$) o solo <strong>da sinistra</strong> (valori più piccoli).</p>
        <p>Qui compare un'ipotesi nuova, che non va dimenticata: se vogliamo avvicinarci a $x_0$ <em>da un lato</em>, in quel lato devono effettivamente esserci punti del dominio arbitrariamente vicini a $x_0$. Altrimenti la condizione «per ogni $x \\in (x_0, x_0+\\delta) \\cap A$» riguarderebbe un insieme vuoto e sarebbe banalmente vera per <em>qualunque</em> valore $L$, rendendo la definizione priva di significato.</p>`,
        subsections: [
          {
            subtitle: "Definizione: limite destro",
            content: `<p>Sia $f: A \\to \\mathbb{R}$ e sia $x_0 \\in \\mathbb{R}$ un punto di accumulazione dell'insieme</p>
            <p>$$A^+ := A \\cap (x_0, +\\infty),$$</p>
            <p>cioè si suppone che esistano punti del dominio arbitrariamente vicini a $x_0$ <strong>a destra</strong> di $x_0$. Il <strong>limite destro</strong> si indica con $\\lim_{x \\to x_0^+} f(x) = L$ ed è per definizione il limite della restrizione $f|_{A^+}$ per $x \\to x_0$: la definizione è identica a quella generale, ma si considerano solo intorni destri di $x_0$.</p>
            <p>Per $x_0 \\in \\mathbb{R}$ e $L \\in \\mathbb{R}$ <strong>finiti</strong>:</p>
            <blockquote><p>Per ogni $\\varepsilon \\gt 0$, esiste $\\delta \\gt 0$ tale che per ogni $x \\in (x_0, x_0 + \\delta) \\cap A$, si ha $|f(x) - L| \\lt \\varepsilon$.</p></blockquote>
            <p>Se invece $L = \\pm\\infty$ si usa la formulazione con gli intorni: per ogni intorno $U$ di $L$ (cioè $U = (M,+\\infty)$ se $L = +\\infty$, $U = (-\\infty, M)$ se $L = -\\infty$) esiste $\\delta \\gt 0$ tale che $f(x) \\in U$ per ogni $x \\in (x_0, x_0+\\delta) \\cap A$.</p>`
          },
          {
            subtitle: "Definizione: limite sinistro",
            content: `<p>Sia $f: A \\to \\mathbb{R}$ e sia $x_0 \\in \\mathbb{R}$ un punto di accumulazione dell'insieme</p>
            <p>$$A^- := A \\cap (-\\infty, x_0),$$</p>
            <p>cioè si suppone che esistano punti del dominio arbitrariamente vicini a $x_0$ <strong>a sinistra</strong> di $x_0$. Il <strong>limite sinistro</strong> si indica con $\\lim_{x \\to x_0^-} f(x) = L$ e si ottiene considerando solo intorni sinistri di $x_0$.</p>
            <p>Per $x_0 \\in \\mathbb{R}$ e $L \\in \\mathbb{R}$ <strong>finiti</strong>:</p>
            <blockquote><p>Per ogni $\\varepsilon \\gt 0$, esiste $\\delta \\gt 0$ tale che per ogni $x \\in (x_0 - \\delta, x_0) \\cap A$, si ha $|f(x) - L| \\lt \\varepsilon$.</p></blockquote>
            <p>Se $L = \\pm\\infty$ si sostituisce la condizione $|f(x)-L| \\lt \\varepsilon$ con $f(x) \\in U$, dove $U$ è un generico intorno di $+\\infty$ o di $-\\infty$ come sopra.</p>`
          },
          {
            subtitle: "Perché serve l'ipotesi di accumulazione laterale",
            content: `<p>Si consideri $f: A \\to \\mathbb{R}$ con $A = (-\\infty, 0]$ e $x_0 = 0$. L'insieme $A \\cap (0, +\\infty)$ è vuoto, quindi $0$ non è punto di accumulazione di $A$ da destra: per ogni $\\delta \\gt 0$ l'insieme $(0, \\delta) \\cap A$ è vuoto e la condizione «$|f(x)-L| \\lt \\varepsilon$ per ogni $x \\in (0,\\delta) \\cap A$» sarebbe verificata per <em>ogni</em> $L \\in \\mathbb{R}$. Il limite destro, in questo caso, semplicemente <strong>non si definisce</strong>.</p>`
          },
          {
            subtitle: "Legame fra limite bilatero e limiti laterali",
            content: `<p><strong>Da notare, prima dell'esempio.</strong> Supponiamo che esista il limite bilatero $\\lim_{x \\to x_0} f(x) = L$. La condizione della definizione vale per <em>tutti</em> gli $x \\in (V \\setminus \\{x_0\\}) \\cap A$; in particolare essa continua a valere se restringiamo l'attenzione ai soli $x$ di un lato, cioè agli $x \\in (V \\setminus \\{x_0\\}) \\cap A^+$ oppure agli $x \\in (V \\setminus \\{x_0\\}) \\cap A^-$. Dunque, <strong>quando $x_0$ è punto di accumulazione da entrambi i lati</strong>, l'esistenza del limite bilatero obbliga entrambi i limiti laterali a esistere e a valere lo stesso $L$.</p>
            <p>Letta al contrario, questa osservazione è un criterio operativo di <strong>non esistenza</strong>: se i due limiti laterali esistono ma sono <strong>diversi</strong>, il limite bilatero non può esistere, perché dovrebbe coincidere con entrambi.</p>`
          },
          {
            subtitle: "Esempio illustrativo: limite destro e sinistro diversi",
            content: `<p>Sia $f(x) = \\dfrac{|x|}{x}$, definita su $A = \\mathbb{R} \\setminus \\{0\\}$, e sia $x_0 = 0$. Entrambe le ipotesi laterali sono soddisfatte: $A \\cap (0,+\\infty) = (0,+\\infty)$ e $A \\cap (-\\infty, 0) = (-\\infty, 0)$ hanno $0$ come punto di accumulazione.</p>
            <ul>
              <li>Per $x \\gt 0$ si ha $|x| = x$, quindi $f(x) = 1$ costantemente: dato $\\varepsilon \\gt 0$, ogni $\\delta \\gt 0$ va bene e $\\lim_{x \\to 0^+} f(x) = 1$.</li>
              <li>Per $x \\lt 0$ si ha $|x| = -x$, quindi $f(x) = -1$: analogamente $\\lim_{x \\to 0^-} f(x) = -1$.</li>
            </ul>
            <p>I due limiti unilateri sono diversi; per l'osservazione appena fatta, il limite (bilatero) per $x \\to 0$ <strong>non esiste</strong>.</p>`
          },
          {
            subtitle: "Lettura grafica: limiti laterali infiniti",
            content: `<p>Per $f(x)=\\dfrac{1}{x-3}$ il dominio è $\\mathbb{R}\\setminus\\{3\\}$. Avvicinandosi a $3$ da destra i valori crescono senza limite; da sinistra diventano negativi con modulo sempre più grande.</p><figure class="figura" data-id="analisi1_lez20a_gp2"><svg xmlns:xlink="http://www.w3.org/1999/xlink" width="640pt" height="400pt" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" version="1.1">

</svg></figure><p>La retta tratteggiata $x=3$ è l’asintoto verticale. Si ha $\\lim_{x\\to3^+}f(x)=+\\infty$ e $\\lim_{x\\to3^-}f(x)=-\\infty$: i due limiti laterali sono diversi, quindi il limite bilatero non esiste.</p>`
          }
        ]
      },
      {
        id: "s20-eccesso-difetto",
        type: "section",
        title: "Limite per eccesso e per difetto",
        icon: "🔀",
        content: `<p>Possiamo anche specificare se la funzione si avvicina al limite $L$ da valori più grandi (<strong>per eccesso</strong>) o più piccoli (<strong>per difetto</strong>). In questo caso il valore $L$ deve necessariamente essere <strong>finito</strong>: le scritture $(+\\infty)^+$ o $(-\\infty)^-$ non hanno senso.</p>
        <p>Conviene esprimere le definizioni usando la nozione di proprietà vera <em>definitivamente</em>, già introdotta: in questa forma esse valgono anche quando $x_0 = \\pm\\infty$.</p>`,
        subsections: [
          {
            subtitle: "Definizione: limite per eccesso",
            content: `<p>Sia $f: A \\to \\mathbb{R}$, sia $x_0 \\in \\mathbb{R}^*$ un punto di accumulazione per $A$ e sia $L \\in \\mathbb{R}$ <strong>finito</strong>. Si dice che il limite di $f(x)$ per $x \\to x_0$ è $L$ <strong>per eccesso</strong>, e si scrive $\\lim_{x \\to x_0} f(x) = L^+$, se valgono entrambe le condizioni:</p>
            <ol>
              <li>$\\lim_{x \\to x_0} f(x) = L$;</li>
              <li>$f(x) \\gt L$ definitivamente per $x \\to x_0$, cioè esiste un intorno $V$ di $x_0$ tale che $f(x) \\gt L$ per ogni $x \\in (V \\setminus \\{x_0\\}) \\cap A$.</li>
            </ol>
            <p>Esplicitando con i quantificatori: per ogni $\\varepsilon \\gt 0$ esiste un intorno $V$ di $x_0$ tale che</p>
            <p>$$\\forall x \\in (V \\setminus \\{x_0\\}) \\cap A: \\quad f(x) \\in (L, L + \\varepsilon), \\quad \\text{ovvero} \\quad L \\lt f(x) \\lt L + \\varepsilon .$$</p>
            <p>Nel caso $x_0 \\in \\mathbb{R}$ l'intorno $V$ si può scrivere come $(x_0 - \\delta, x_0 + \\delta)$ e la condizione diventa: per ogni $\\varepsilon \\gt 0$ esiste $\\delta \\gt 0$ tale che $L \\lt f(x) \\lt L+\\varepsilon$ per ogni $x \\in A$ con $0 \\lt |x - x_0| \\lt \\delta$.</p>`
          },
          {
            subtitle: "Definizione: limite per difetto",
            content: `<p>Con le stesse ipotesi ($x_0 \\in \\mathbb{R}^*$ punto di accumulazione per $A$, $L \\in \\mathbb{R}$ finito), si dice che il limite è $L$ <strong>per difetto</strong>, e si scrive $\\lim_{x \\to x_0} f(x) = L^-$, se:</p>
            <ol>
              <li>$\\lim_{x \\to x_0} f(x) = L$;</li>
              <li>$f(x) \\lt L$ definitivamente per $x \\to x_0$.</li>
            </ol>
            <p>Con i quantificatori: per ogni $\\varepsilon \\gt 0$ esiste un intorno $V$ di $x_0$ tale che</p>
            <p>$$\\forall x \\in (V \\setminus \\{x_0\\}) \\cap A: \\quad f(x) \\in (L - \\varepsilon, L), \\quad \\text{ovvero} \\quad L - \\varepsilon \\lt f(x) \\lt L .$$</p>`
          },
          {
            subtitle: "Esempio illustrativo: notazioni combinate con $f(x) = -x$",
            content: `<p>Sia $f(x) = -x$ su $A = \\mathbb{R}$ e consideriamo $x_0 = 0$ con avvicinamento <em>da destra</em>. Mostriamo che</p>
            <p>$$\\lim_{x \\to 0^+} (-x) = 0^- .$$</p>
            <ul>
              <li><strong>Il valore del limite è $0$.</strong> Fissato $\\varepsilon \\gt 0$, scegliamo $\\delta = \\varepsilon$: per ogni $x \\in (0, \\delta)$ si ha $|f(x) - 0| = |-x| = x \\lt \\delta = \\varepsilon$.</li>
              <li><strong>L'avvicinamento è per difetto.</strong> Per ogni $x$ considerato vale $x \\gt 0$ (ci avviciniamo da destra), e quindi $f(x) = -x \\lt 0 = L$: la condizione $f(x) \\lt L$ è vera definitivamente per $x \\to 0^+$.</li>
            </ul>
            <p>Mettendo insieme le due informazioni: $x$ arriva a $0$ <em>da destra</em> ($x \\gt 0$), mentre $f(x)$ arriva a $0$ <em>da sinistra</em>, cioè dal basso ($-x \\lt 0$). Numericamente: per $x = 0{,}1;\\ 0{,}01;\\ 0{,}001$ si ottiene $f(x) = -0{,}1;\\ -0{,}01;\\ -0{,}001$, valori sempre negativi che si avvicinano a $0$. Questo spiega la scrittura $x \\to 0^+$ accanto a $L = 0^-$: i due segni si riferiscono a <strong>due assi diversi</strong>.</p>`
          },
          {
            subtitle: "Esempio svolto: due limiti diversi, entrambi per eccesso",
            content: `<p>Consideriamo $f(x)=\\dfrac{x^2-4}{|x-2|}$, definita su $\\mathbb{R}\\setminus\\{2\\}$. Il punto $2$ è di accumulazione del dominio da entrambi i lati.</p><p>Se $x\\gt2$, si semplifica $|x-2|=x-2$ e risulta $f(x)=x+2\\gt4$: dunque $\\lim_{x\\to2^+}f(x)=4^+$. Se $x\\lt2$, si ha $|x-2|=2-x$ e $f(x)=-(x+2)\\gt-4$: dunque $\\lim_{x\\to2^-}f(x)=(-4)^+$.</p><p>In entrambi i casi la distanza dal rispettivo limite è $|x-2|$: fissato $\\varepsilon\\gt0$, basta scegliere $\\delta=\\varepsilon$.</p><figure class="figura" data-id="analisi1_lez20a_gp3"><svg xmlns:xlink="http://www.w3.org/1999/xlink" width="640pt" height="400pt" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" version="1.1">

        icon: "🌉",
        content: `<p>Come si può verificare un limite nella pratica? Un'idea intuitiva, per esempio con una calcolatrice, è quella di calcolare i valori della funzione per punti sempre più vicini a $x_0$. Ad esempio, per verificare che $\\lim_{x \\to +\\infty} x^2 = +\\infty$, potremmo calcolare $f(1), f(5), f(10), f(25), \\dots$ e osservare che i valori crescono.</p>

        <p>Il seguente teorema, noto come <strong>Teorema Ponte</strong>, formalizza questa connessione fondamentale tra limiti di funzioni e limiti di successioni.</p>`,
        subsections: [

            content: `<p>Sia $f: A \\to \\mathbb{R}$ una funzione, con $A \\subseteq \\mathbb{R}$, e sia $x_0$ un punto di accumulazione per $A$. Sia $L \\in \\mathbb{R}^*$. Allora</p>

            <p>$$\\lim_{n \\to +\\infty} f(a_n) = L.$$</p>`

          {
            subtitle: "Dimostrazione ($\\Rightarrow$)",
            content: `<p><strong>Ipotesi:</strong> $\\lim_{x \\to x_0} f(x) = L$. <strong>Tesi:</strong> per ogni successione $a_n \\to x_0$ si ha $f(a_n) \\to L$.</p>
            <p>Per definizione di limite di funzione, per ogni intorno $U$ di $L$ esiste un intorno $V$ di $x_0$ tale che per ogni $x \\in V \\cap A$ con $x \\neq x_0$, si ha $f(x) \\in U$.</p>
            <p>Consideriamo una generica successione $\\{a_n\\}$ in $A \\setminus \\{x_0\\}$ tale che $\\lim_{n \\to +\\infty} a_n = x_0$. Per definizione di limite di successione, per ogni intorno $V$ di $x_0$ la successione $a_n$ appartiene definitivamente a $V$: esiste $n_0 \\in \\mathbb{N}$ tale che per ogni $n \\gt n_0$ si ha $a_n \\in V$.</p>
            <p>Mettiamo insieme le due cose:</p>

            </ol>
            <p>Questo significa che $f(a_n)$ appartiene definitivamente a $U$. Poiché $U$ era un intorno arbitrario di $L$, abbiamo dimostrato che $\\lim_{n \\to +\\infty} f(a_n) = L$.</p>`

            <p>$$V_n = \\left(x_0 - \\tfrac{1}{n},\\ x_0 + \\tfrac{1}{n}\\right), \\qquad n \\in \\mathbb{N},\\ n \\ge 1 .$$</p>

            <p>Abbiamo così costruito una successione $\\{x_n\\}_{n \\in \\mathbb{N}}$. Analizziamola:</p>

            <p>L'assurdo nasce dall'aver supposto che $\\lim_{x \\to x_0} f(x) \\neq L$. Dunque deve essere vero il contrario, cioè $\\lim_{x \\to x_0} f(x) = L$. $\\blacksquare$</p>`

        content: `<p>Una domanda frequente all'orale: perché nel Teorema Ponte si richiede che la convergenza $f(a_n) \\to L$ valga per <strong>ogni</strong> successione $a_n \\to x_0$, e non basta una sola?</p>

        id: "s20-es-teoria-1",
        type: "esercizio",
        title: "Teoria 1",
        kind: "teoria",
        source: "integrazione",
        content: `<p>Enuncia la definizione $\\varepsilon$-$\\delta$ di $\\lim_{x \\to x_0} f(x) = L$ nel caso $x_0 \\in \\mathbb{R}$, $L \\in \\mathbb{R}$, e spiega il ruolo di due elementi: (a) la condizione $0 \\lt |x - x_0|$; (b) l'ipotesi che $x_0$ sia punto di accumulazione del dominio $A$.</p>`,
        solution: `<p><strong>Definizione.</strong> Sia $f : A \\to \\mathbb{R}$ con $A \\subseteq \\mathbb{R}$ e sia $x_0$ punto di accumulazione di $A$. Si dice che $\\lim_{x\\to x_0} f(x) = L$ se</p>
        <p>$$\\forall \\varepsilon \\gt 0\\ \\exists \\delta \\gt 0 : \\forall x \\in A,\\ 0 \\lt |x-x_0| \\lt \\delta \\Rightarrow |f(x)-L| \\lt \\varepsilon .$$</p>
        <p>L'ordine dei quantificatori è essenziale: $\\delta$ si cerca <em>dopo</em> aver fissato $\\varepsilon$ e in generale dipende da $\\varepsilon$, ma una volta scelto deve funzionare per <strong>tutti</strong> gli $x$ ammessi.</p>
        <p><strong>(a) Il ruolo di $0 \\lt |x-x_0|$.</strong> Questa condizione equivale a $x \\neq x_0$: il limite descrive il comportamento di $f$ <em>vicino</em> a $x_0$ e non <em>in</em> $x_0$. Grazie a essa il limite ha senso anche se $x_0 \\notin A$ (come in $\\lim_{x\\to 2} \\frac{1}{(x-2)^2}$) e il valore $f(x_0)$, se esiste, può essere diverso da $L$.</p>
        <p><strong>(b) Il ruolo dell'ipotesi di accumulazione.</strong> Se $x_0$ non fosse punto di accumulazione di $A$ esisterebbe $\\delta_0 \\gt 0$ con $(x_0-\\delta_0, x_0+\\delta_0) \\cap A \\subseteq \\{x_0\\}$: allora per $\\delta = \\delta_0$ l'insieme degli $x \\in A$ con $0 \\lt |x-x_0| \\lt \\delta$ sarebbe vuoto e la condizione «$|f(x)-L| \\lt \\varepsilon$ per ogni tale $x$» sarebbe banalmente vera per <strong>ogni</strong> $L \\in \\mathbb{R}$. Il limite perderebbe senso e in particolare l'unicità. L'ipotesi di accumulazione garantisce invece che in ogni intorno di $x_0$ ci siano punti di $A$ diversi da $x_0$, cioè che la domanda «cosa fa $f$ vicino a $x_0$?» sia non vuota.</p>`

        title: "Teoria 2",
        kind: "teoria",
        source: "integrazione",
        content: `<p>Sia $f: A \\to \\mathbb{R}$ e sia $x_0 \\in \\mathbb{R}$ un punto di accumulazione di $A$, con $L \\in \\mathbb{R}$. Scrivere con i quantificatori la definizione di $\\lim_{x \\to x_0} f(x) = L$ e la sua negazione, sia in forma $\\varepsilon$-$\\delta$ sia in termini di intorni.</p>`,
        solution: `<p><strong>Definizione ($\\varepsilon$-$\\delta$).</strong></p>
        <p>$$\\forall \\varepsilon \\gt 0\\ \\exists \\delta \\gt 0 : \\forall x \\in A,\\ 0 \\lt |x - x_0| \\lt \\delta \\Rightarrow |f(x) - L| \\lt \\varepsilon .$$</p>
        <p><strong>Definizione (intorni).</strong> Per ogni intorno $U$ di $L$ esiste un intorno $V$ di $x_0$ tale che $f(x) \\in U$ per ogni $x \\in V \\cap A$, $x \\neq x_0$.</p>
        <p><strong>Negazione ($\\varepsilon$-$\\delta$).</strong> Si scambiano i quantificatori e si nega la conclusione:</p>
        <p>$$\\exists \\varepsilon \\gt 0 : \\forall \\delta \\gt 0\\ \\exists x \\in A,\\ 0 \\lt |x - x_0| \\lt \\delta \\ \\text{e}\\ |f(x) - L| \\ge \\varepsilon .$$</p>
        <p><strong>Negazione (intorni).</strong> Esiste un intorno $U$ di $L$ tale che per ogni intorno $V$ di $x_0$ esiste almeno un punto $x \\in V \\cap A$, $x \\neq x_0$, con $f(x) \\notin U$.</p>
        <p><strong>Osservazione.</strong> $\\lim_{x\\to x_0} f(x) \\neq L$ <em>non</em> significa che il limite esista e valga un altro valore: comprende anche il caso in cui il limite non esista affatto.</p>`

        kind: "teoria",
        source: "integrazione",
        content: `<p>Enunciare il Teorema Ponte e dimostrarne l'implicazione diretta ($\\Rightarrow$).</p>`,
        solution: `<p><strong>Enunciato.</strong> Sia $f: A \\to \\mathbb{R}$, $A \\subseteq \\mathbb{R}$, $x_0$ punto di accumulazione per $A$ e $L \\in \\mathbb{R}^*$. Allora $\\lim_{x \\to x_0} f(x) = L$ se e solo se per ogni successione $\\{a_n\\}$ a valori in $A \\setminus \\{x_0\\}$ con $\\lim_{n \\to +\\infty} a_n = x_0$ si ha $\\lim_{n \\to +\\infty} f(a_n) = L$.</p>
        <p><strong>Dimostrazione di ($\\Rightarrow$).</strong> Supponiamo $\\lim_{x\\to x_0} f(x) = L$ e sia $\\{a_n\\} \\subseteq A \\setminus \\{x_0\\}$ con $a_n \\to x_0$.</p>
        <p>Fissiamo un intorno arbitrario $U$ di $L$: per definizione di limite di funzione esiste un intorno $V$ di $x_0$ tale che $f(x) \\in U$ per ogni $x \\in V \\cap A$ con $x \\neq x_0$.</p>
        <p>Poiché $a_n \\to x_0$, esiste $n_0 \\in \\mathbb{N}$ tale che $a_n \\in V$ per ogni $n \\gt n_0$; inoltre $a_n \\in A$ e $a_n \\neq x_0$ per ipotesi. Dunque per ogni $n \\gt n_0$ vale $a_n \\in V \\cap A$, $a_n \\neq x_0$, e quindi $f(a_n) \\in U$.</p>
        <p>Ciò significa che $f(a_n)$ appartiene definitivamente a $U$; essendo $U$ un intorno arbitrario di $L$, si conclude $\\lim_{n \\to +\\infty} f(a_n) = L$. $\\blacksquare$</p>`

        kind: "scritto",
        source: "integrazione",
        content: `<p>Verifica, usando la definizione $\\varepsilon$-$\\delta$, che $\\lim_{x \\to 2} (4x-3) = 5$, esplicitando il legame fra $\\delta$ e $\\varepsilon$ e indicando il più grande $\\delta$ che funziona per $\\varepsilon = 0{,}02$.</p>`,
        solution: `<p><strong>Impostazione.</strong> Poniamo $f(x) = 4x-3$ su $A = \\mathbb{R}$, $x_0 = 2$ (punto di accumulazione di $\\mathbb{R}$) e $L = 5$.</p>
        <p><strong>Passo 1 — la quantità da rendere piccola.</strong></p>
        <p>$$|f(x)-L| = |4x-3-5| = |4x-8| = 4|x-2| .$$</p>
        <p><strong>Passo 2 — legame con $|x-x_0|$.</strong> Fissato $\\varepsilon \\gt 0$, la disuguaglianza richiesta equivale a</p>
        <p>$$4|x-2| \\lt \\varepsilon \\iff |x-2| \\lt \\frac{\\varepsilon}{4} .$$</p>
        <p><strong>Passo 3 — scelta del raggio.</strong> Si sceglie $\\delta = \\dfrac{\\varepsilon}{4} \\gt 0$. Allora per ogni $x \\in \\mathbb{R}$ con $0 \\lt |x-2| \\lt \\delta$ si ha</p>
        <p>$$|f(x)-5| = 4|x-2| \\lt 4\\delta = 4\\cdot\\frac{\\varepsilon}{4} = \\varepsilon .$$</p>
        <p>Poiché $\\varepsilon \\gt 0$ era arbitrario, la definizione è soddisfatta e $\\lim_{x\\to 2}(4x-3) = 5$.</p>
        <p><strong>Ottimalità di $\\delta$.</strong> Poiché nel passo 2 le due condizioni sono <em>equivalenti</em>, $\\delta = \\frac{\\varepsilon}{4}$ è anche il valore più grande utilizzabile: se $|x-2| \\ge \\frac{\\varepsilon}{4}$ allora $|f(x)-5| \\ge \\varepsilon$.</p>
        <p><strong>Caso numerico.</strong> Per $\\varepsilon = 0{,}02$ si ottiene $\\delta = 0{,}005$: ogni $x \\in (1{,}995;\\, 2{,}005)$ con $x \\neq 2$ dà $f(x) \\in (4{,}98;\\, 5{,}02)$.</p>
        <p>Il grafico è nella <a href="#s20-definizione-formale">sezione teorica corrispondente</a>.</p>
        <p>Nella figura, con $\\delta = 0{,}005$ ogni $x$ della banda verticale (escluso $x_0 = 2$) ha $f(x)$ nella banda orizzontale, cioè $|f(x)-5| \\lt 0{,}02$.</p>`

        content: `<p>Usando il Teorema Ponte, dimostrare che $\\lim_{x \\to 0} \\cos\\left(\\dfrac{1}{x}\\right)$ non esiste.</p>`,
        solution: `<p><strong>Dominio.</strong> La funzione $f(x) = \\cos\\left(\\frac{1}{x}\\right)$ è definita su $A = \\mathbb{R} \\setminus \\{0\\}$ e $x_0 = 0$ è punto di accumulazione di $A$.</p>

        <p>$$f(a_n) = \\cos(2n\\pi) = 1 \\quad \\Longrightarrow \\quad \\lim_{n \\to +\\infty} f(a_n) = 1,$$</p>

        kind: "scritto",
        source: "integrazione",
        content: `<p>Sia $f(x) = \\dfrac{1}{x-3}$. Determina il dominio, verifica con la definizione (trovando $\\delta$ in funzione di $M$) che $\\lim_{x\\to 3^+} f(x) = +\\infty$ e $\\lim_{x\\to 3^-} f(x) = -\\infty$, e stabilisci se esiste il limite bilatero per $x \\to 3$.</p>`,
        solution: `<p><strong>Dominio e ipotesi laterali.</strong> Il dominio è $A = \\mathbb{R} \\setminus \\{3\\}$, perché serve $x-3 \\neq 0$. Il punto $3$ è punto di accumulazione sia di $A \\cap (3,+\\infty) = (3,+\\infty)$ sia di $A \\cap (-\\infty,3) = (-\\infty,3)$, quindi entrambi i limiti unilateri sono definiti.</p>
        <p><strong>Limite destro.</strong> Fissiamo $M \\in \\mathbb{R}$ e possiamo supporre $M \\gt 0$ (per $M \\le 0$ la condizione $f(x) \\gt M$ è automatica per $x \\gt 3$, dove $f(x) \\gt 0$). Per $x \\gt 3$ si ha $x - 3 \\gt 0$, dunque moltiplicando per $x-3$ il verso <em>si conserva</em>:</p>
        <p>$$\\frac{1}{x-3} \\gt M \\iff 1 \\gt M(x-3) \\iff x-3 \\lt \\frac{1}{M} .$$</p>
        <p>Scegliendo $\\delta = \\dfrac{1}{M} \\gt 0$, per ogni $x \\in (3, 3+\\delta)$ si ha $f(x) \\gt M$: dunque $\\lim_{x\\to 3^+} \\frac{1}{x-3} = +\\infty$ (per esempio con $M = 10^3$ basta $\\delta = 10^{-3}$).</p>
        <p><strong>Limite sinistro.</strong> Fissiamo $M \\gt 0$ e cerchiamo $f(x) \\lt -M$ (gli intorni di $-\\infty$ sono $(-\\infty,-M)$). Per $x \\lt 3$ si ha $x-3 \\lt 0$, quindi moltiplicando per $x-3$ <strong>il verso si inverte</strong>:</p>
        <p>$$\\frac{1}{x-3} \\lt -M \\iff 1 \\gt -M(x-3) \\iff M(3-x) \\lt 1 \\iff 3-x \\lt \\frac{1}{M} .$$</p>
        <p>Scegliendo di nuovo $\\delta = \\dfrac{1}{M}$, per ogni $x \\in (3-\\delta, 3)$ si ha $f(x) \\lt -M$: dunque $\\lim_{x\\to 3^-} \\frac{1}{x-3} = -\\infty$.</p>
        <p><strong>Conclusione.</strong> Poiché i due limiti unilateri sono diversi, il limite bilatero per $x\\to 3$ non esiste (in particolare <strong>non</strong> è $+\\infty$, a differenza di quanto accade per $\\frac{1}{(x-2)^2}$ in $x=2$); la retta $x = 3$ è asintoto verticale.</p>
        <p>Il grafico è nella <a href="#s20-unilateri">sezione teorica corrispondente</a>.</p>
        <p>A destra di $3$ la funzione diverge a $+\\infty$, a sinistra a $-\\infty$: il limite bilatero non esiste.</p>`

        content: `<p>Sia $f: \\mathbb{R} \\to \\mathbb{R}$ la funzione di Dirichlet: $f(x) = 1$ se $x \\in \\mathbb{Q}$, $f(x) = 0$ se $x \\in \\mathbb{R} \\setminus \\mathbb{Q}$. Dimostrare che $f$ non ammette limite in nessun punto $x_0 \\in \\mathbb{R}$.</p>`,
        solution: `<p><strong>Impostazione.</strong> Fissiamo $x_0 \\in \\mathbb{R}$; esso è punto di accumulazione di $A = \\mathbb{R}$.</p>
        <p><strong>Successione di razionali.</strong> Per la densità di $\\mathbb{Q}$ in $\\mathbb{R}$, per ogni $n \\ge 1$ esiste $a_n \\in \\mathbb{Q} \\cap \\left(x_0, x_0 + \\frac{1}{n}\\right)$; in particolare $a_n \\neq x_0$ e $x_0 \\lt a_n \\lt x_0 + \\frac{1}{n}$, da cui, per il teorema dei carabinieri, $a_n \\to x_0$. Poiché $a_n \\in \\mathbb{Q}$ si ha $f(a_n) = 1$ per ogni $n$, dunque $\\lim_{n \\to +\\infty} f(a_n) = 1$.</p>
        <p><strong>Successione di irrazionali.</strong> Analogamente, per la densità degli irrazionali, per ogni $n \\ge 1$ esiste $b_n \\in (\\mathbb{R} \\setminus \\mathbb{Q}) \\cap \\left(x_0, x_0 + \\frac{1}{n}\\right)$, con $b_n \\neq x_0$ e $b_n \\to x_0$; qui $f(b_n) = 0$ per ogni $n$, dunque $\\lim_{n \\to +\\infty} f(b_n) = 0$.</p>

        back: "Per assurdo: se $\\lim_{x\\to x_0} f(x) \\neq L$, per la negazione esiste un intorno «anomalo» $U$ di $L$ tale che in ogni intorno $V$ di $x_0$ c'è un punto $x \\in V\\cap A$, $x \\neq x_0$, con $f(x) \\notin U$. Prendendo $V_n = (x_0-\\frac{1}{n}, x_0+\\frac{1}{n})$ si costruisce $x_n \\in V_n \\cap A$, $x_n \\neq x_0$, con $f(x_n) \\notin U$. Per i carabinieri $x_n \\to x_0$, dunque per ipotesi $f(x_n) \\to L$ e quindi $f(x_n) \\in U$ definitivamente: contraddizione con $f(x_n) \\notin U$ per ogni $n$."
      },
      {
        type: "domanda",
        front: "Come si usa il Teorema Ponte per provare che un limite non esiste?",
        back: "Basta trovare due successioni $a_n, b_n$ a valori in $A \\setminus \\{x_0\\}$, entrambe tendenti a $x_0$, tali che $f(a_n)$ e $f(b_n)$ abbiano limiti <strong>diversi</strong>: se il limite della funzione esistesse e valesse $L$, entrambe le successioni di immagini dovrebbero tendere a $L$. Esempio: $\\sin x$ per $x \\to +\\infty$ con $a_n = 2n\\pi$ ($\\sin a_n = 0$) e $b_n = \\frac{\\pi}{2}+2n\\pi$ ($\\sin b_n = 1$)."
      },
      {
        type: "dimostrazione",
        front: "Verifica che $\\lim_{x \\to 2} \\dfrac{1}{(x-2)^2} = +\\infty$ trovando $\\delta$ in funzione di $M$.",
        back: "Fissiamo $M \\in \\mathbb{R}$, supponendo $M \\gt 0$ (se $M \\le 0$ la condizione è automatica perché $f \\gt 0$). Si ha $\\frac{1}{(x-2)^2} \\gt M \\iff (x-2)^2 \\lt \\frac{1}{M} \\iff |x-2| \\lt \\frac{1}{\\sqrt{M}}$. Basta quindi $\\delta = \\frac{1}{\\sqrt{M}}$. Ad esempio per $M = 10^4$ si prende $\\delta = 10^{-2}$."
      }
    ]
};
