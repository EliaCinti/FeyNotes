    abstract: "Parte intera e parte frazionaria, definizione di limite di successione (finito e infinito), verifica con la definizione, limiti elementari e algebra dei limiti. Nella seconda parte, esercizi svolti sul dominio di funzioni composte con logaritmi, radici e valori assoluti.",

    sections: [
      {
        id: "s13-parte-intera",
        type: "section",
        title: "La funzione parte intera (o funzione pavimento)",
        icon: "🪜",
        content: `<p>Iniziamo con la definizione della funzione parte intera.</p>
<p><strong>Definizione (Parte Intera).</strong> Dato un numero reale $x \\in \\mathbb{R}$, la sua <strong>parte intera</strong>, indicata con $[x]$, è il più grande intero minore o uguale a $x$. Formalmente:</p>
<p>$$[x] = \\max \\{ n \\in \\mathbb{Z} \\mid n \\le x \\}$$</p>`,
        subsections: [
          {
            subtitle: "Esempi",
            content: `<ul>
<li>Se consideriamo il numero $2.14$, la sua parte intera è $2$. Infatti, gli interi minori o uguali a $2.14$ sono $2, 1, 0, -1, \\dots$ e il più grande tra questi è $2$. Quindi $[2.14] = 2$.</li>
<li>La parte intera di $\\pi \\approx 3.14159$ è $[\\pi] = 3$.</li>
<li>La parte intera di $e \\approx 2.718$ è $[e] = 2$.</li>
</ul>`
          },
          {
            subtitle: "Attenzione: parte intera di numeri negativi",
            content: `<p>Attenzione a come si calcola la parte intera per i numeri negativi. La definizione richiede il più grande intero <em>minore o uguale</em> al numero.</p>
<p>Ad esempio, per calcolare $[-0.5]$, dobbiamo cercare il più grande intero che sta "sotto" (a sinistra sulla retta reale) di $-0.5$. Gli interi minori o uguali a $-0.5$ sono $-1, -2, -3, \\dots$. Il più grande di questi è $-1$.</p>
<p>Quindi:</p>
<p>$$[-0.5] = -1$$</p>
<p>Analogamente:</p>
<p>$$[-1.5] = -2$$</p>
<p>L'<strong>errore comune</strong> è pensare che la parte intera sia semplicemente il numero senza le cifre decimali. Questo è vero per i numeri positivi, ma <strong>non</strong> per quelli negativi.</p>`
          },
          {
            subtitle: "Il grafico: una funzione a gradini",
            content: `<p>Il grafico della funzione parte intera è una funzione a gradini (o a scala).</p>
<ul>
<li>Per tutti i numeri $x$ nell'intervallo $[0, 1)$, la parte intera è $0$.</li>
<li>Per tutti i numeri $x$ nell'intervallo $[1, 2)$, la parte intera è $1$.</li>
<li>Per tutti i numeri $x$ nell'intervallo $[2, 3)$, la parte intera è $2$.</li>
<li>Per i negativi, per $x \\in [-1, 0)$, la parte intera è $-1$.</li>
</ul>

      {
        id: "s13-parte-frazionaria",
        type: "section",
        title: "La funzione parte frazionaria (o mantissa)",
        icon: "🦷",
        content: `<p>Strettamente legata alla parte intera è la funzione parte frazionaria.</p>
<p><strong>Definizione (Parte Frazionaria).</strong> Dato un numero reale $x \\in \\mathbb{R}$, la sua <strong>parte frazionaria</strong> (o <strong>mantissa</strong>), indicata con $\\{x\\}$, è la differenza tra il numero stesso e la sua parte intera:</p>
<p>$$\\{x\\} = x - [x]$$</p>`,
        subsections: [
          {
            subtitle: "Esempi",
            content: `<ul>
<li>$\\{2.14\\} = 2.14 - [2.14] = 2.14 - 2 = 0.14$</li>
<li>$\\{\\pi\\} = \\pi - [\\pi] = \\pi - 3 \\approx 0.14159$</li>
<li>Per i numeri negativi: $\\{-0.5\\} = -0.5 - [-0.5] = -0.5 - (-1) = 0.5$</li>
</ul>
<p><strong>Osservazione.</strong> La parte frazionaria di un numero è sempre un numero nell'intervallo $[0, 1)$.</p>`
          },
          {
            subtitle: "Il grafico: onda a dente di sega",
            content: `<p>Il grafico della funzione parte frazionaria è una "onda a dente di sega".</p>
<ul>
<li>Per $x \\in [0, 1)$, $\\{x\\} = x - 0 = x$.</li>
<li>Per $x \\in [1, 2)$, $\\{x\\} = x - 1$.</li>
<li>Per $x \\in [2, 3)$, $\\{x\\} = x - 2$.</li>
</ul>

      {
        id: "s13-def-limite",
        type: "section",
        title: "Limiti di successioni: la definizione",
        icon: "🎯",
        content: `<p>Ricordiamo la definizione formale di limite di una successione.</p>
<p><strong>Definizione (Limite di una successione).</strong> Sia $(a_n)_{n \\in \\mathbb{N}}$ una successione a valori reali e sia $l \\in \\mathbb{R}$. Si dice che la successione $a_n$ converge al limite $l$ per $n$ che tende a infinito, e si scrive</p>
<p>$$\\lim_{n \\to +\\infty} a_n = l$$</p>
<p>se, per ogni $\\epsilon \\gt 0$, la disuguaglianza $|a_n - l| \\lt \\epsilon$ è soddisfatta <strong>definitivamente</strong>.</p>
<p>"Definitivamente" significa che esiste un indice $n_0 \\in \\mathbb{N}$ tale che la proprietà vale per ogni $n \\gt n_0$. In simboli:</p>
<p>$$\\forall \\epsilon \\gt 0, \\ \\exists n_0 \\in \\mathbb{N} \\text{ tale che } \\quad n \\gt n_0 \\Rightarrow |a_n - l| \\lt \\epsilon$$</p>
<p>La quantità $|a_n - l|$ rappresenta la <strong>distanza</strong> tra il termine $a_n$ della successione e il limite $l$.</p>`,
        subsections: [
          {
            subtitle: "Limiti infiniti: successioni divergenti",
            content: `<p>La definizione appena data riguarda soltanto il caso di un limite $l$ <em>reale</em>: in tal caso si parla di successione <strong>convergente</strong>. Molte successioni, però, crescono (o decrescono) oltre ogni soglia: per queste serve una definizione distinta, che non fa uso della distanza $|a_n - l|$ (non esiste infatti alcun numero reale $l$ a cui confrontarsi).</p>
<p><strong>Definizione.</strong> Sia $(a_n)_{n \\in \\mathbb{N}}$ una successione a valori reali.</p>
<p>Si dice che $a_n$ <strong>diverge a $+\\infty$</strong>, e si scrive $\\lim_{n \\to +\\infty} a_n = +\\infty$, se per ogni $M \\gt 0$ la disuguaglianza $a_n \\gt M$ è soddisfatta definitivamente:</p>
<p>$$\\forall M \\gt 0, \\ \\exists n_0 \\in \\mathbb{N} \\text{ tale che } \\quad n \\gt n_0 \\Rightarrow a_n \\gt M$$</p>
<p>Si dice che $a_n$ <strong>diverge a $-\\infty$</strong>, e si scrive $\\lim_{n \\to +\\infty} a_n = -\\infty$, se per ogni $M \\gt 0$ la disuguaglianza $a_n \\lt -M$ è soddisfatta definitivamente:</p>
<p>$$\\forall M \\gt 0, \\ \\exists n_0 \\in \\mathbb{N} \\text{ tale che } \\quad n \\gt n_0 \\Rightarrow a_n \\lt -M$$</p>`
          },
          {
            subtitle: "Divergere non è convergere",
            content: `<p>I simboli $+\\infty$ e $-\\infty$ <strong>non</strong> sono numeri reali: una successione che diverge <strong>non</strong> è convergente, perché non si avvicina ad alcun numero reale. Quando diciamo "la successione ammette limite" intendiamo che si verifica uno dei tre casi: limite finito $l \\in \\mathbb{R}$ (convergenza), limite $+\\infty$ oppure limite $-\\infty$ (divergenza).</p>
<p>La parola chiave "definitivamente" ha invece sempre lo stesso significato nei tre casi: la proprietà vale da un certo indice $n_0$ in poi.</p>
<p>Operativamente, il ruolo che $\\epsilon$ ha nel caso finito ("distanza piccola a piacere") è giocato nel caso infinito da $M$ ("soglia grande a piacere"): per verificare che $a_n \\to +\\infty$ si fissa $M \\gt 0$ e si cerca $n_0$ tale che $a_n \\gt M$ per ogni $n \\gt n_0$.</p>`
          },
          {
            subtitle: "Convenzione sugli indici",
            content: `<p>Alcune delle successioni che incontreremo non sono definite per $n = 0$: è il caso di $1/n$, di $\\log_a(n)$ e di $n^\\alpha$ con $\\alpha \\lt 0$. Per queste successioni intendiamo sempre $n \\ge 1$.</p>
<p>Poiché il concetto di limite dipende solo dal comportamento <em>definitivo</em> della successione, escludere un numero finito di indici iniziali non altera in alcun modo il limite.</p>`
          }
        ],
        formulas: [
          { label: "Limite finito", latex: "\\forall \\epsilon \\gt 0 \\ \\exists n_0 : \\ n \\gt n_0 \\Rightarrow |a_n - l| \\lt \\epsilon" },
          { label: "Divergenza a +∞", latex: "\\forall M \\gt 0 \\ \\exists n_0 : \\ n \\gt n_0 \\Rightarrow a_n \\gt M" },
          { label: "Divergenza a −∞", latex: "\\forall M \\gt 0 \\ \\exists n_0 : \\ n \\gt n_0 \\Rightarrow a_n \\lt -M" }
        ]
      },
      {
        id: "s13-verifica-definizione",
        type: "section",
        title: "Verifica del limite con la definizione",
        icon: "🔍",
        content: `<p>Vediamo come applicare la definizione per verificare un limite.</p>`,
        subsections: [
          {
            subtitle: "Esempio: $\\lim_{n \\to +\\infty} 1/n = 0$",
            content: `<p>Verifichiamo che $\\displaystyle \\lim_{n \\to +\\infty} \\frac{1}{n} = 0$ (successione considerata, come detto, per $n \\ge 1$).</p>
<p>In questo caso $a_n = 1/n$ e il limite presunto è $l = 0$. Dobbiamo mostrare che la definizione è soddisfatta.</p>
<p><strong>1. Fissiamo un $\\epsilon \\gt 0$ arbitrario.</strong> Dobbiamo trovare un indice $n_0$ che dipenderà da questo $\\epsilon$.</p>
<p><strong>2. Impostiamo la disuguaglianza.</strong> Vogliamo che $|a_n - l| \\lt \\epsilon$, cioè:</p>
<p>$$\\left| \\frac{1}{n} - 0 \\right| \\lt \\epsilon$$</p>
<p>Poiché stiamo considerando indici $n \\ge 1$, si ha $n \\gt 0$ e quindi $|1/n| = 1/n$. La disuguaglianza diventa:</p>
<p>$$\\frac{1}{n} \\lt \\epsilon$$</p>
<p><strong>3. Risolviamo rispetto a $n$.</strong></p>
<p>$$n \\gt \\frac{1}{\\epsilon}$$</p>
<p><strong>4. Troviamo $n_0$.</strong> Abbiamo trovato che la condizione $|1/n - 0| \\lt \\epsilon$ è vera per tutti gli $n$ maggiori di $1/\\epsilon$. Possiamo quindi scegliere come $n_0$ un qualsiasi numero naturale che soddisfi questa condizione. Una scelta sicura è prendere la parte intera di $1/\\epsilon$ e aggiungere $1$:</p>
<p>$$n_0 = \\left[ \\frac{1}{\\epsilon} \\right] + 1$$</p>
<p>Con questa scelta, per ogni $n \\gt n_0$, sarà sicuramente vero che $n \\gt 1/\\epsilon$, e quindi la disuguaglianza di partenza sarà soddisfatta.</p>
<p>Poiché siamo riusciti a trovare un $n_0$ per ogni $\\epsilon \\gt 0$, abbiamo verificato secondo la definizione che il limite è corretto.</p>`
          },
          {
            subtitle: "Esempio illustrativo: verifica di un limite infinito",
            content: `<p>Verifichiamo con la definizione che $\\displaystyle \\lim_{n \\to +\\infty} n = +\\infty$.</p>
<p>Fissiamo $M \\gt 0$ arbitrario. Vogliamo che valga $a_n = n \\gt M$. Basta scegliere</p>
<p>$$n_0 = [M] + 1,$$</p>
<p>perché per ogni $n \\gt n_0$ si ha $n \\gt [M] + 1 \\gt M$. Poiché per ogni $M \\gt 0$ abbiamo trovato un tale $n_0$, la definizione di divergenza a $+\\infty$ è soddisfatta.</p>
<p>Si noti la <strong>differenza strutturale</strong> rispetto all'esempio precedente: qui non compare alcun valore assoluto $|a_n - l|$, ma solo il confronto con la soglia $M$.</p>`
          }
        ],
        quote: {
          text: "Come vedete, verificare un limite con la definizione è un processo laborioso. Non possiamo fare così per ogni limite. Abbiamo bisogno di sviluppare un linguaggio, un'algebra dei limiti, che ci permetta di calcolarli in modo più agevole.",
          src: "Nota del Prof."
        }
      },
      {
        id: "s13-unicita",
        type: "section",
        title: "Unicità del limite",
        icon: "☝️",
        content: `<p>Un risultato fondamentale è che se una successione ammette un limite, questo limite deve essere unico.</p>
<p><strong>Teorema (Unicità del Limite).</strong> Se una successione $(a_n)_{n \\in \\mathbb{N}}$ ammette limite (finito o infinito, nel senso delle due definizioni precedenti), allora tale limite è unico.</p>
<p><strong>Osservazione.</strong> La dimostrazione è stata rimandata dal professore e verrà presentata nelle lezioni successive. L'idea intuitiva è che una successione non può essere "definitivamente vicina" a due numeri diversi contemporaneamente, né può stare definitivamente sopra ogni soglia e contemporaneamente avvicinarsi a un numero reale.</p>`
      },
      {
        id: "s13-limiti-elementari",
        type: "section",
        title: "Limiti di successioni elementari",
        icon: "🧱",
        content: `<p>Presentiamo ora i limiti di alcune successioni fondamentali, che useremo come <strong>mattoni</strong> per costruire limiti più complessi. Conviene raccoglierli in un unico enunciato, perché sono le regole di base a cui ricondurremo quasi tutti gli esercizi.</p>`,
        subsections: [
          {
            subtitle: "1. Successione geometrica $b^n$",
            content: `<p>Con $b \\in \\mathbb{R}$. Consideriamo la successione per $n \\ge 1$ (per $b = 0$ la restrizione è necessaria, altrimenti il termine iniziale sarebbe $0^0$; i limiti indicati restano comunque invariati):</p>
<p>$$\\lim_{n \\to +\\infty} b^n = \\begin{cases} +\\infty & \\text{se } b \\gt 1 \\\\ 1 & \\text{se } b = 1 \\\\ 0 & \\text{se } -1 \\lt b \\lt 1 \\\\ \\text{non esiste} & \\text{se } b \\le -1 \\end{cases}$$</p>
<p><strong>Nota sul caso $b \\le -1$.</strong> La successione geometrica non ammette limite. Ad esempio, se $b = -1$ la successione $(-1)^n$ oscilla tra $1$ e $-1$ e non si avvicina definitivamente ad alcun valore. Se $b = -2$, la successione $(-2)^n$ oscilla tra valori di modulo crescente: elencando i termini a partire da $n = 1$ si ottiene $-2, 4, -8, 16, \\dots$ (se si parte dall'indice $n = 0$ il primo termine è $(-2)^0 = 1$).</p>`
          },
          {
            subtitle: "2. Successione potenza $n^\\alpha$",
            content: `<p>Con $\\alpha \\in \\mathbb{R}$ e $n \\ge 1$ (la restrizione $n \\ge 1$ è necessaria quando $\\alpha \\le 0$, perché $0^\\alpha$ non è definito):</p>

          },

        content: `<p>I seguenti teoremi ci permettono di calcolare limiti di successioni ottenute tramite operazioni algebriche.</p>
<p><strong>Teorema (Algebra dei Limiti Finiti).</strong> Siano $(a_n)$ e $(b_n)$ due successioni convergenti a limiti finiti:</p>
<p>$$\\lim_{n \\to +\\infty} a_n = l \\in \\mathbb{R} \\quad \\text{e} \\quad \\lim_{n \\to +\\infty} b_n = m \\in \\mathbb{R}$$</p>
<p>Allora:</p>
<p><strong>1. Limite della somma:</strong> $\\displaystyle \\lim_{n \\to +\\infty} (a_n + b_n) = l + m$</p>
<p><strong>2. Limite del prodotto:</strong> $\\displaystyle \\lim_{n \\to +\\infty} (a_n \\cdot b_n) = l \\cdot m$</p>
<p><strong>3. Limite del quoziente:</strong> se $m \\ne 0$ e $b_n \\ne 0$ definitivamente, allora $\\displaystyle \\lim_{n \\to +\\infty} \\frac{a_n}{b_n} = \\frac{l}{m}$</p>
<p><strong>4. Prodotto per una costante:</strong> se $c \\in \\mathbb{R}$, allora $\\displaystyle \\lim_{n \\to +\\infty} (c \\cdot a_n) = c \\cdot l$</p>`,
        subsections: [

            subtitle: "Attenzione all'ipotesi di finitezza",
            content: `<p>Il teorema precedente richiede <strong>entrambi</strong> i limiti finiti: non può essere invocato quando uno dei due fattori diverge. Per i casi con un fattore divergente serve un enunciato separato, che useremo negli esercizi.</p>`
          },
          {

<p>Allora</p>
<p>$$\\lim_{n \\to +\\infty} (c_n \\cdot r_n) = +\\infty.$$</p>
<p><strong>Dimostrazione.</strong> Supponiamo $L \\in \\mathbb{R}$, $L \\gt 0$ (il caso $L = +\\infty$ è analogo e più semplice). Applicando la definizione di limite con $\\epsilon = L/2 \\gt 0$, si ha definitivamente $|r_n - L| \\lt L/2$, dunque</p>

<p>Di conseguenza, per $n \\gt n_1$,</p>
<p>$$n \\, r_n \\gt \\frac{n}{2}.$$</p>
<p>Fissiamo ora $M \\gt 0$ arbitrario: se scegliamo anche $n \\gt 2M$, cioè $n \\gt \\max\\{n_1, 2M\\}$, otteniamo</p>

<p>Poiché per ogni $M \\gt 0$ la disuguaglianza $n r_n \\gt M$ vale definitivamente, per definizione di limite infinito si conclude che $n r_n \\to +\\infty$.</p>`

        solution: `<p><strong>Definizioni.</strong> Per definizione</p>
<p>$$[x] = \\max \\{ n \\in \\mathbb{Z} \\mid n \\le x \\},$$</p>
<p>cioè il più grande intero minore o uguale a $x$, mentre $\\{x\\} = x - [x]$.</p>
<p><strong>Calcolo per $x = -2.7$.</strong> Gli interi minori o uguali a $-2.7$ sono $-3, -4, -5, \\dots$ e il più grande è $-3$, quindi</p>
<p>$$[-2.7] = -3$$</p>
<p>(non $-2$: per i numeri negativi la parte intera non si ottiene cancellando le cifre decimali). Di conseguenza</p>
<p>$$\\{-2.7\\} = -2.7 - (-3) = 0.3$$</p>
<p><strong>Dimostrazione della disuguaglianza.</strong> Posto $m = [x]$, per definizione $m \\le x$, dunque</p>
<p>$$\\{x\\} = x - m \\ge 0.$$</p>
<p>Inoltre $m+1$ è un intero strettamente maggiore di $m$; poiché $m$ è il massimo degli interi $\\le x$, non può valere $m+1 \\le x$, quindi $x \\lt m+1$ e perciò</p>
<p>$$\\{x\\} = x - m \\lt 1.$$</p>
<p>In conclusione $\\{x\\} \\in [0,1)$ per ogni $x \\in \\mathbb{R}$, come affermato nell'osservazione della lezione.</p>`

        kind: "teoria",
        source: "integrazione",
        content: `<p>Sia $h = f \\circ g$, cioè $h(x) = f(g(x))$. Enuncia la regola generale per determinare $\\mathrm{Dom}(h)$ e applicala per elencare le condizioni di esistenza di una funzione del tipo $x \\mapsto \\log_3\\big(\\log_3(u(x))\\big)$.</p>`,
        solution: `<p><strong>Regola generale.</strong> Per definizione</p>
<p>$$\\mathrm{Dom}(f \\circ g) = \\{ x \\in \\mathrm{Dom}(g) \\ : \\ g(x) \\in \\mathrm{Dom}(f) \\}$$</p>
<p>Non basta che $g$ sia definita in $x$: serve anche che il valore $g(x)$ sia accettabile per $f$.</p>
<p><strong>Applicazione.</strong> Nel caso $h(x) = \\log_3(\\log_3(u(x)))$ si impone, procedendo dall'esterno verso l'interno:</p>
<p>(i) $x \\in \\mathrm{Dom}(u)$;</p>
<p>(ii) $u(x) \\gt 0$, perché $u(x)$ è argomento del logaritmo interno;</p>
<p>(iii) $\\log_3(u(x)) \\gt 0$, perché è argomento del logaritmo esterno.</p>
<p><strong>Semplificazione.</strong> Poiché la base è $3 \\gt 1$, la condizione (iii) equivale a $u(x) \\gt 1$, che implica già (ii). Quindi il sistema si riduce a</p>
<p>$$x \\in \\mathrm{Dom}(u) \\quad \\text{e} \\quad u(x) \\gt 1.$$</p>
<p>La condizione più esterna è la più stringente e ingloba quelle interne, ma va verificato caso per caso: se la base fosse in $(0,1)$ la (iii) diventerebbe $0 \\lt u(x) \\lt 1$.</p>`

        id: "s13-es-teoria-3",

        title: "Teoria 3",
        kind: "teoria",
        source: "integrazione",
        content: `<p>Enuncia la definizione di successione convergente a $l \\in \\mathbb{R}$ e la definizione di successione divergente a $+\\infty$. Spiega il significato di "definitivamente" e dimostra che una successione divergente a $+\\infty$ non può convergere ad alcun $l \\in \\mathbb{R}$.</p>`,
        solution: `<p><strong>Convergenza.</strong> Si dice che $a_n \\to l \\in \\mathbb{R}$ se per ogni $\\epsilon \\gt 0$ esiste $n_0 \\in \\mathbb{N}$ tale che</p>
<p>$$n \\gt n_0 \\Rightarrow |a_n - l| \\lt \\epsilon$$</p>
<p>la distanza $|a_n - l|$ è piccola a piacere da un certo indice in poi.</p>
<p><strong>Divergenza a $+\\infty$.</strong> Si dice che $a_n \\to +\\infty$ se per ogni $M \\gt 0$ esiste $n_0 \\in \\mathbb{N}$ tale che</p>
<p>$$n \\gt n_0 \\Rightarrow a_n \\gt M$$</p>
<p>In questa definizione non compare alcun valore assoluto $|a_n - l|$, perché $+\\infty$ non è un numero reale e non c'è nessuna distanza da misurare; il ruolo di $\\epsilon$ (distanza piccola a piacere) è giocato da $M$ (soglia grande a piacere).</p>
<p><strong>"Definitivamente".</strong> Significa: esiste un indice $n_0$ tale che la proprietà vale per ogni $n \\gt n_0$. Poiché il limite dipende solo dal comportamento definitivo, escludere o modificare un numero finito di termini iniziali non lo altera.</p>
<p><strong>Dimostrazione.</strong> Sia $a_n \\to +\\infty$ e supponiamo per assurdo $a_n \\to l$ con $l \\in \\mathbb{R}$. Scegliendo $M = |l| + 1 \\gt 0$, esiste $n_1$ con $a_n \\gt |l| + 1$ per ogni $n \\gt n_1$, dunque</p>
<p>$$a_n - l \\gt |l| + 1 - l \\ge 1$$</p>
<p>e perciò $|a_n - l| \\gt 1$ per ogni $n \\gt n_1$. Ma la convergenza con $\\epsilon = 1$ richiederebbe $|a_n - l| \\lt 1$ definitivamente: <strong>contraddizione</strong>.</p>
<p>Quindi la successione diverge e non converge, coerentemente con il teorema di unicità del limite.</p>`
      },

        solution: `<p><strong>Impostazione.</strong> Si parte dall'osservazione $0 = \\log_a(1)$, valida per ogni base ammissibile $a \\gt 0$, $a \\neq 1$. Allora $\\log_a(u) \\gt 0$ si riscrive</p>
<p>$$\\log_a(u) \\gt \\log_a(1)$$</p>
<p><strong>Caso $a \\gt 1$.</strong> La funzione $t \\mapsto \\log_a t$ è strettamente crescente su $(0,+\\infty)$, quindi conserva il verso della disuguaglianza fra gli argomenti:</p>
<p>$$\\log_a(u) \\gt \\log_a(1) \\iff u \\gt 1$$</p>
<p>(la positività di $u$ è automatica).</p>
<p><strong>Caso $0 \\lt a \\lt 1$.</strong> La funzione è strettamente decrescente, quindi il verso si inverte:</p>
<p>$$\\log_a(u) \\gt 0 \\iff 0 \\lt u \\lt 1$$</p>
<p><strong>Applicazione.</strong> Di conseguenza</p>
<p>$$\\log_{1/2}(u) \\ge 0 \\iff \\log_{1/2}(u) \\ge \\log_{1/2}(1) \\iff 0 \\lt u \\le 1$$</p>
<p>Va tenuta esplicitamente la condizione $u \\gt 0$, mentre l'uguaglianza si ha solo per $u = 1$.</p>`

        solution: `<p><strong>Impostazione.</strong> La successione $a_n = \\frac{2n+1}{n}$ è definita per $n \\ge 1$ e si riscrive come</p>
<p>$$a_n = 2 + \\frac{1}{n}$$</p>
<p>Dunque</p>
<p>$$|a_n - 2| = \\left| \\frac{1}{n} \\right| = \\frac{1}{n},$$</p>
<p>perché $n \\gt 0$.</p>
<p><strong>Trasformazione della condizione.</strong> Fissiamo $\\epsilon \\gt 0$ arbitrario: la condizione $|a_n - 2| \\lt \\epsilon$ equivale a</p>
<p>$$\\frac{1}{n} \\lt \\epsilon,$$</p>

<p><strong>Limiti dei pezzi.</strong> Per i limiti delle successioni elementari, $n^{\\alpha} \\to 0$ se $\\alpha \\lt 0$, quindi</p>

<p>$$t \\lt 1 \\ \\lor \\ t \\gt 2$$</p>

<p>$$|x| \\lt 1 \\iff -1 \\lt x \\lt 1, \\qquad |x| \\gt 2 \\iff x \\lt -2 \\ \\lor \\ x \\gt 2$$</p>

<p>$$\\mathrm{Dom}(f) = (-\\infty,-2) \\cup (-1,1) \\cup (2,+\\infty)$$</p>
