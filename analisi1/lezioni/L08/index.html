<p>La funzione inversa $f^{-1}$ ha come <strong>dominio l'immagine</strong> della funzione originale e come <strong>codominio il dominio</strong> della funzione originale. Quindi $f^{-1} \\colon [0, +\\infty) \\to [0, +\\infty)$.</p>`
          },
          {
            subtitle: "Come leggere il grafico",
            content: `<p>La funzione in esame è la <strong>restrizione</strong> $f \\colon [0,+\\infty) \\to [0,+\\infty)$, cioè solo il ramo della parabola con $x \\geq 0$: un eventuale tratto di parabola con $x \\lt 0$ visibile nella finestra di rappresentazione <em>non</em> appartiene alla funzione che stiamo invertendo.</p>
<p>La simmetria rispetto alla bisettrice $y = x$ va dunque verificata confrontando il ramo $x \\geq 0$ della parabola con il grafico di $\\sqrt{x}$: ai punti $P$ e $P'$ indicati corrispondono le <strong>coordinate scambiate</strong>, come deve essere per una funzione e la sua inversa.</p>
<p>Se tenessimo anche il tratto con $x \\lt 0$, la corrispondenza per simmetria produrrebbe <strong>due valori di $y$ per la stessa $x$</strong>: segno che quella funzione più ampia non è invertibile.</p>`
          }
        ]
      },

      {
        id: "s03-identita-fondamentali",
        type: "section",
        title: "Le identità fondamentali e i loro domini",
        icon: "🧩",
        content: `<p>La proprietà fondamentale della funzione inversa è che <strong>“inverte”</strong> l'azione della funzione di partenza. È però essenziale precisare <em>dove</em> vive la variabile in ciascuna delle due identità: le due composizioni sono definite su <strong>insiemi diversi</strong>.</p>`,
        subsections: [
          {
            subtitle: "Proposizione (identità fondamentali)",
            content: `<p>Sia $f \\colon X \\to Y$ biettiva e sia $f^{-1} \\colon Y \\to X$ la sua funzione inversa. Allora valgono le due identità</p>
<p>$$f^{-1}\\bigl(f(x)\\bigr) = x \\qquad \\text{per ogni } x \\in X,$$</p>
<p>$$f\\bigl(f^{-1}(y)\\bigr) = y \\qquad \\text{per ogni } y \\in Y.$$</p>
<p>In notazione di composizione:</p>
<p>$$f^{-1} \\circ f = \\mathrm{id}_X, \\qquad f \\circ f^{-1} = \\mathrm{id}_Y,$$</p>
<p>dove $\\mathrm{id}_X \\colon X \\to X$ e $\\mathrm{id}_Y \\colon Y \\to Y$ sono le funzioni identità rispettivamente su $X$ e su $Y$.</p>`
          },
          {
            subtitle: "I due domini non sono lo stesso",
            content: `<p>La composizione $f^{-1} \\circ f$ ha senso solo se la variabile sta nel dominio $X$ di $f$: la sua “variabile naturale” è $x \\in X$ e il risultato è un elemento di $X$.</p>
<p>La composizione $f \\circ f^{-1}$, invece, ha senso solo se la variabile sta nel dominio $Y$ di $f^{-1}$, cioè nell'<strong>immagine di $f$</strong>: la sua variabile naturale è $y \\in Y$ e il risultato è un elemento di $Y$.</p>
<p>Per questo motivo è <strong>scorretto</strong> dire che le due identità valgono “sullo stesso insieme”: esse valgono su $X$ la prima e su $Y$ la seconda. Nell'esempio di $f(x)=x^2$ con $X = Y = [0,+\\infty)$ i due insiemi coincidono e la distinzione resta nascosta.</p>
<p>Riprendendo infatti l'esempio di $f(x) = x^2$ con $X = Y = [0, +\\infty)$:</p>
<ul>
  <li>per ogni $y \\in Y = [0,+\\infty)$: $f(f^{-1}(y)) = (\\sqrt{y})^2 = y$;</li>
  <li>per ogni $x \\in X = [0,+\\infty)$: $f^{-1}(f(x)) = \\sqrt{x^2} = x$.</li>
</ul>`
          },
          {
            subtitle: "Esempio illustrativo: dominio e immagine differenti",
            content: `<p>Consideriamo</p>
<p>$$f \\colon [0, +\\infty) \\to [1, +\\infty), \\qquad f(x) = x^2 + 1 .$$</p>
<p>Qui $X = [0,+\\infty)$ e $Y = [1,+\\infty)$ sono insiemi <em>diversi</em>. La funzione è strettamente crescente su $X$, dunque iniettiva, e la sua immagine è esattamente $[1,+\\infty)$: è quindi biettiva. Risolvendo $y = x^2+1$ con $x \\geq 0$ si ottiene $x = \\sqrt{y-1}$, cioè</p>
<p>$$f^{-1} \\colon [1,+\\infty) \\to [0,+\\infty), \\qquad f^{-1}(y) = \\sqrt{y-1}.$$</p>
<p>Verifichiamo le due identità, <strong>ciascuna sul proprio insieme</strong>:</p>
<ul>
  <li>per ogni $x \\in X = [0,+\\infty)$: $f^{-1}(f(x)) = \\sqrt{(x^2+1)-1} = \\sqrt{x^2} = |x| = x$, dove l'ultimo passaggio usa $x \\geq 0$;</li>
  <li>per ogni $y \\in Y = [1,+\\infty)$: $f(f^{-1}(y)) = \\bigl(\\sqrt{y-1}\\bigr)^2 + 1 = (y-1) + 1 = y$, dove il passaggio $(\\sqrt{y-1})^2 = y-1$ richiede $y - 1 \\geq 0$, cioè $y \\geq 1$.</li>
</ul>
<p>Si vede bene che <strong>scambiare i due insiemi produce espressioni prive di senso</strong>: ad esempio $f(f^{-1}(0))$ non è definita, perché $0 \\notin Y$ e quindi $f^{-1}(0) = \\sqrt{-1}$ non esiste in $\\mathbb{R}$.</p>`
          }
        ],
        formulas: [
          { label: "Prima identità (su $X$)", latex: "f^{-1}(f(x)) = x \\quad \\forall x \\in X" },
          { label: "Seconda identità (su $Y$)", latex: "f(f^{-1}(y)) = y \\quad \\forall y \\in Y" },
          { label: "Forma compatta", latex: "f^{-1} \\circ f = \\mathrm{id}_X, \\qquad f \\circ f^{-1} = \\mathrm{id}_Y" }
        ]
      },

      {
        id: "s04-radice-quadrato",
        type: "alert_box",
        title: "Attenzione: $\\sqrt{x^2} = |x|$, non $x$",
        icon: "⚠️",
        content: `<p>È fondamentale prestare attenzione al dominio in cui valgono le identità. Consideriamo la funzione $g(x) = \\sqrt{x^2}$. A differenza dell'esempio precedente, questa funzione è definita su <strong>tutto</strong> $\\mathbb{R}$. Analizziamola:</p>
<ul>
  <li>Se $x \\in [0, +\\infty)$, allora $\\sqrt{x^2} = x$.</li>
  <li>Se $x \\in (-\\infty, 0)$, allora $x$ è negativo. Il suo quadrato $x^2$ è positivo e la radice quadrata di $x^2$ è un numero positivo. Per esempio, se $x=-2$, $x^2=4$ e $\\sqrt{4}=2$. Quindi, per $x$ negativo, $\\sqrt{x^2} = -x$.</li>
</ul>
<p>Mettendo insieme i due casi, otteniamo che la funzione $\\sqrt{x^2}$ coincide con la funzione <strong>valore assoluto</strong>:</p>
<p>$$\\sqrt{x^2} = |x| = \\begin{cases} x & \\text{se } x \\geq 0 \\\\ -x & \\text{se } x \\lt 0 \\end{cases}$$</p>
<p>Quindi l'identità $f^{-1}(f(x)) = \\sqrt{x^2} = x$ è valida <strong>solo nel dominio $[0, +\\infty)$</strong>, dove abbiamo definito l'invertibilità di $f(x)=x^2$.</p>`,
        formulas: [
          { label: "Identità da ricordare", latex: "\\sqrt{x^2} = |x| \\quad \\forall x \\in \\mathbb{R}" }
        ]
      },

      {
        id: "s05-monotonia-inversa",
        type: "section",
        title: "Monotonia della Funzione Inversa",
        icon: "📈",
        content: `<p>Esiste un legame importante tra la monotonia di una funzione e quella della sua inversa.</p>`,
        subsections: [
          {
            subtitle: "Proposizione",
            content: `<p>Sia $f \\colon X \\to Y$ una funzione <strong>strettamente monotona</strong>. Allora:</p>
<ol>
  <li>$f$ è biettiva da $X$ alla sua immagine $\\mathrm{Im}(f)$;</li>
  <li>esiste la funzione inversa $f^{-1} \\colon \\mathrm{Im}(f) \\to X$;</li>
  <li>se $f$ è strettamente <strong>crescente</strong>, allora anche $f^{-1}$ è strettamente crescente;</li>
  <li>se $f$ è strettamente <strong>decrescente</strong>, allora anche $f^{-1}$ è strettamente decrescente.</li>
</ol>`
          },
          {
            subtitle: "Dimostrazione (caso crescente)",
            content: `<p>La prima parte, ovvero che la monotonia stretta implica l'iniettività (e quindi la biettività sull'immagine), è già stata dimostrata. Dimostriamo ora la terza parte (il caso decrescente è analogo).</p>
<p>Supponiamo che $f$ sia strettamente crescente. Per definizione di funzione crescente, dobbiamo mostrare che per ogni $y_1, y_2 \\in \\mathrm{Im}(f)$ con $y_1 \\lt y_2$ risulta $f^{-1}(y_1) \\lt f^{-1}(y_2)$.</p>
<p>Siano $y_1, y_2 \\in \\mathrm{Im}(f)$ con $y_1 \\lt y_2$. Poiché $y_1$ e $y_2$ appartengono all'immagine di $f$, esistono <strong>unici</strong> $x_1, x_2 \\in X$ tali che</p>
<p>$$f(x_1) = y_1 \\quad \\text{e} \\quad f(x_2) = y_2 .$$</p>
<p>Per definizione di funzione inversa, abbiamo</p>
<p>$$x_1 = f^{-1}(y_1) \\quad \\text{e} \\quad x_2 = f^{-1}(y_2).$$</p>
<p>L'ipotesi $y_1 \\lt y_2$ può essere riscritta come $f(x_1) \\lt f(x_2)$.</p>
<p>Ora, poiché $f$ è strettamente crescente, questa disuguaglianza tra le immagini implica la stessa disuguaglianza tra le preimmagini: deve essere $x_1 \\lt x_2$. Infatti, se per assurdo fosse $x_1 \\geq x_2$, poiché $f$ è strettamente crescente seguirebbe $f(x_1) \\geq f(x_2)$, ovvero $y_1 \\geq y_2$, il che contraddice l'ipotesi iniziale $y_1 \\lt y_2$.</p>
<p>Quindi $x_1 \\lt x_2$ e, sostituendo di nuovo le espressioni per $x_1$ e $x_2$,</p>
<p>$$f^{-1}(y_1) \\lt f^{-1}(y_2),$$</p>
<p>che dimostra che $f^{-1}$ è strettamente crescente. $\\square$</p>`
          },
          {
            subtitle: "Esempio illustrativo: un'inversa decrescente",
            content: `<p>Applichiamo la proposizione al caso decrescente, che è quello in cui si sbaglia più facilmente. Consideriamo</p>
<p>$$f \\colon \\mathbb{R} \\to \\mathbb{R}, \\qquad f(x) = -x^3 .$$</p>
<p><strong>Passo 1 (monotonia).</strong> Se $x_1 \\lt x_2$ allora $x_1^3 \\lt x_2^3$ (la funzione cubo è strettamente crescente su $\\mathbb{R}$), e moltiplicando per $-1$ la disuguaglianza si rovescia: $-x_1^3 \\gt -x_2^3$, cioè $f(x_1) \\gt f(x_2)$. Dunque $f$ è strettamente decrescente, quindi iniettiva.</p>
<p><strong>Passo 2 (immagine e inversa).</strong> Per ogni $y \\in \\mathbb{R}$ l'equazione $-x^3 = y$ ha l'unica soluzione $x = -\\sqrt[3]{y}$, quindi $\\mathrm{Im}(f) = \\mathbb{R}$ e</p>
<p>$$f^{-1} \\colon \\mathbb{R} \\to \\mathbb{R}, \\qquad f^{-1}(y) = -\\sqrt[3]{y}.$$</p>
<p><strong>Passo 3 (monotonia dell'inversa).</strong> Se $y_1 \\lt y_2$ allora $\\sqrt[3]{y_1} \\lt \\sqrt[3]{y_2}$ e quindi $-\\sqrt[3]{y_1} \\gt -\\sqrt[3]{y_2}$, cioè $f^{-1}(y_1) \\gt f^{-1}(y_2)$: l'inversa è strettamente decrescente, come previsto dal punto 4 della proposizione.</p>
<p><strong>Verifica delle identità.</strong> Qui $X = Y = \\mathbb{R}$, e si ha $f^{-1}(f(x)) = -\\sqrt[3]{-x^3} = -(-x) = x$ per ogni $x \\in \\mathbb{R}$, e $f(f^{-1}(y)) = -\\bigl(-\\sqrt[3]{y}\\bigr)^3 = -(-y) = y$ per ogni $y \\in \\mathbb{R}$.</p>`
          }
        ]
      },

      {
        id: "s06-valore-assoluto",
        type: "section",
        title: "Richiami sulle Funzioni Elementari: il Valore Assoluto",
        icon: "📐",
        content: `<p>Ripassiamo ora le principali funzioni elementari, analizzandone dominio e proprietà. Iniziamo dal valore assoluto (o modulo), una funzione fondamentale nell'analisi matematica.</p>`,
        subsections: [
          {
            subtitle: "Definizione (valore assoluto)",
            content: `<p>La funzione valore assoluto, indicata con $f(x) = |x|$, è la funzione $f \\colon \\mathbb{R} \\to [0,+\\infty)$ definita come</p>
<p>$$|x| = \\begin{cases} x & \\text{se } x \\geq 0 \\\\ -x & \\text{se } x \\lt 0 \\end{cases}$$</p>
<p>Il suo <strong>dominio naturale</strong> è tutto $\\mathbb{R}$; l'<strong>immagine</strong> è l'insieme dei reali non negativi $[0, +\\infty)$.</p>
<p>In sostanza, il valore assoluto di un numero positivo o nullo è il numero stesso, mentre il valore assoluto di un numero negativo è il suo opposto (che è positivo). Per esempio $|5| = 5$ e $|-5| = -(-5) = 5$.</p>`
          },
          {
            subtitle: "Il grafico a “V”",
            content: `<p>Il grafico della funzione valore assoluto è caratteristico e ha una forma a <strong>“V”</strong>, con il vertice nell'origine. Per $x \\geq 0$ coincide con la retta $y=x$ (bisettrice del primo quadrante), mentre per $x \\lt 0$ coincide con la retta $y=-x$ (bisettrice del secondo quadrante).</p>

            subtitle: "Proposizione: proprietà del valore assoluto",
            content: `<p>Per ogni $x, y \\in \\mathbb{R}$ e per ogni costante $c \\gt 0$ valgono:</p>
<ol>
  <li><strong>Non negatività:</strong> $|x| \\geq 0$ per ogni $x \\in \\mathbb{R}$;</li>
  <li><strong>Annullamento:</strong> $|x| = 0 \\iff x = 0$;</li>
  <li><strong>Moltiplicatività:</strong> $|x \\cdot y| = |x| \\cdot |y|$ (il modulo di un prodotto è il prodotto dei moduli);</li>
  <li><strong>Disuguaglianza con una costante:</strong> $|x| \\leq c \\iff -c \\leq x \\leq c$;</li>
  <li><strong>Relazione con l'argomento:</strong> $-|x| \\leq x \\leq |x|$;</li>
  <li><strong>Disuguaglianza triangolare:</strong> $|x+y| \\leq |x| + |y|$;</li>
  <li><strong>Disuguaglianza triangolare inversa:</strong> $\\bigl||x| - |y|\\bigr| \\leq |x-y|$.</li>
</ol>
<p>Punto chiave: nel seguito faremo riferimento a queste proprietà con questa numerazione; sono <strong>le stesse</strong> proprietà anche quando compaiono con nomi descrittivi (non negatività, moltiplicatività, ecc.).</p>`
          }

          { label: "Disuguaglianza triangolare", latex: "|x+y| \\leq |x| + |y|" },
          { label: "Triangolare inversa", latex: "\\bigl||x| - |y|\\bigr| \\leq |x-y|" }

      {
        id: "s07-triangolare",
        type: "section",
        title: "La Disuguaglianza Triangolare",
        icon: "🔺",
        content: `<p>La disuguaglianza triangolare è una delle proprietà più importanti e utilizzate; la sua tecnica di dimostrazione è molto istruttiva.</p>`,
        quote: {
          text: "La disuguaglianza triangolare è una delle proprietà più importanti e utilizzate. Il nome deriva dalla geometria: in un triangolo, la lunghezza di un lato è sempre minore o uguale alla somma delle lunghezze degli altri due lati.",
          src: "Nota del Prof."
        },
        subsections: [
          {
            subtitle: "Teorema e dimostrazione",
            content: `<p><strong>Teorema.</strong> Per ogni $x, y \\in \\mathbb{R}$ si ha $|x+y| \\leq |x| + |y|$.</p>
<p><strong>Dimostrazione.</strong> La dimostrazione si basa sulla proprietà 4: una disuguaglianza della forma $|A| \\leq C$ (con $C \\geq 0$) è equivalente a $-C \\leq A \\leq C$.</p>
<p>Nel nostro caso poniamo $A = x+y$ e $C = |x|+|y|$ (se $|x| + |y| = 0$ allora $x = y = 0$ e la disuguaglianza è banalmente vera, quindi possiamo supporre $C \\gt 0$). La tesi diventa</p>
<p>$$-(|x|+|y|) \\leq x+y \\leq |x|+|y| .$$</p>
<p>Per dimostrare questa doppia disuguaglianza partiamo dalla proprietà 5, che vale per qualsiasi numero reale:</p>
<p>$$-|x| \\leq x \\leq |x|, \\qquad -|y| \\leq y \\leq |y| .$$</p>
<p>Sommando membro a membro queste due doppie disuguaglianze otteniamo</p>
<p>$$-|x| - |y| \\leq x+y \\leq |x| + |y| ,$$</p>
<p>che si riscrive come $-(|x|+|y|) \\leq x+y \\leq |x|+|y|$. Essendo equivalente a $|x+y| \\leq |x|+|y|$, la dimostrazione è conclusa. $\\square$</p>`
          },
          {
            subtitle: "Estensione a più termini (per induzione)",
            content: `<p>La disuguaglianza triangolare si può estendere per induzione alla somma di un numero finito di termini. Ad esempio, per tre termini scriviamo $|x+y+z| = |(x+y)+z|$ e applichiamo la disuguaglianza una prima volta, considerando $(x+y)$ come un unico blocco:</p>
<p>$$|(x+y)+z| \\leq |x+y| + |z| .$$</p>
<p>Applicandola una seconda volta al termine $|x+y|$:</p>
<p>$$|x+y| + |z| \\leq (|x|+|y|) + |z| = |x|+|y|+|z| .$$</p>
<p>Quindi $|x+y+z| \\leq |x|+|y|+|z|$. In generale, per $n$ termini:</p>
<p>$$\\left|\\sum_{i=1}^n x_i\\right| \\leq \\sum_{i=1}^n |x_i| .$$</p>`
          },
          {
            subtitle: "Esempio illustrativo: usare la disuguaglianza triangolare",
            content: `<p>Le proprietà elencate non servono solo in teoria: sono lo strumento con cui si <strong>stimano</strong> le quantità negli esercizi. Vediamo due usi tipici.</p>
<p><strong>(a) Stimare $|x|$ sapendo che $x$ è vicino a un valore noto.</strong> Supponiamo di sapere che $|x - 2| \\leq \\tfrac{1}{10}$. Quanto può valere al massimo $|x|$? Il trucco standard è “sommare e sottrarre” il valore noto e poi applicare la proprietà 6:</p>
<p>$$|x| = |(x-2) + 2| \\leq |x-2| + |2| \\leq \\frac{1}{10} + 2 = \\frac{21}{10}.$$</p>
<p>Dunque $|x| \\leq 2.1$.</p>
<p><strong>(b) Stimare una somma.</strong> Supponiamo che $|x - 2| \\leq 1$ e $|y + 3| \\leq 2$. Vogliamo stimare quanto $x + y$ si discosta da $2 + (-3) = -1$. Scriviamo la quantità da stimare come somma dei due “errori” noti e applichiamo di nuovo la proprietà 6:</p>
<p>$$|(x+y) - (-1)| = |(x-2) + (y+3)| \\leq |x-2| + |y+3| \\leq 1 + 2 = 3 .$$</p>
<p>Quindi $x+y$ dista da $-1$ al più $3$, cioè, per la proprietà 4, $-4 \\leq x+y \\leq 2$.</p>`
          }
        ]
      },

      {
        id: "s08-potenze-dominio",
        type: "section",
        title: "Funzioni Potenza: Esponente Razionale e Dominio",
        icon: "🧮",
        content: `<p>Consideriamo le funzioni della forma $f(x) = x^q$ con $q \\in \\mathbb{Q}$. Il loro comportamento e, soprattutto, il loro <strong>dominio</strong>, dipendono in modo cruciale dalla natura dell'esponente.</p>`,
        subsections: [
          {
            subtitle: "Scrittura normalizzata dell'esponente",
            content: `<p>Ogni razionale $q$ si può scrivere in modo unico come</p>
<p>$$q = \\frac{n}{m}, \\qquad n \\in \\mathbb{Z}, \\quad m \\in \\mathbb{N} \\text{ con } m \\gt 0, \\quad \\mathrm{MCD}(|n|, m) = 1 ,$$</p>
<p>cioè come frazione <strong>ridotta ai minimi termini con denominatore positivo</strong>. Questa normalizzazione è indispensabile: senza di essa il segno del denominatore sarebbe ambiguo e la scrittura $x^{n/m} = \\sqrt[m]{x^n}$ (che richiede $m \\gt 0$) non avrebbe senso. Con questa convenzione il caso “$q$ intero” corrisponde esattamente a $m = 1$.</p>
<p>Un'osservazione che useremo per i domini: se $m$ è <strong>pari</strong>, allora $n$ è necessariamente <strong>dispari</strong>, perché la frazione è ridotta (se anche $n$ fosse pari, numeratore e denominatore avrebbero il fattore comune $2$). Di conseguenza, quando $m$ è pari e $n \\gt 0$, la condizione $x^n \\geq 0$ sulla base della radice equivale a $x \\geq 0$: una potenza con esponente dispari ha infatti lo stesso segno della base.</p>`
          },
          {
            subtitle: "Proposizione: dominio naturale delle funzioni potenza",
            content: `<p>Sia $q = n/m$ scritto come sopra ($n \\in \\mathbb{Z}$, $m \\in \\mathbb{N}$, $m \\gt 0$, $\\mathrm{MCD}(|n|,m)=1$). Il dominio naturale di $f(x) = x^q$ è il seguente. <em>Questa è l'unica classificazione dei domini a cui faremo riferimento in tutta la lezione.</em></p>
<p><strong>Caso 1: $q$ intero ($m=1$, $q=n \\in \\mathbb{Z}$).</strong> La funzione è un polinomio o una funzione razionale fratta.</p>
<ul>
  <li>Se $n \\gt 0$ (es. $x^2$, $x^3$): il dominio è $\\mathbb{R}$.</li>
  <li>Se $n = 0$: $x^0 = 1$ per $x \\neq 0$, funzione costante con dominio $\\mathbb{R} \\setminus \\{0\\}$.</li>
  <li>Se $n \\lt 0$ (es. $x^{-2} = \\frac{1}{x^2}$): serve denominatore non nullo, dominio $\\mathbb{R} \\setminus \\{0\\}$.</li>
</ul>
<p><strong>Caso 2: $q = n/m \\gt 0$ non intero</strong> (quindi $m \\geq 2$, $n \\gt 0$). La funzione è $f(x) = x^{n/m} = \\sqrt[m]{x^n}$.</p>
<ul>
  <li>Se $m$ è <strong>pari</strong> (es. $\\sqrt{x} = x^{1/2}$, $x^{3/2} = \\sqrt{x^3}$): l'argomento della radice deve essere non negativo, cioè $x^n \\geq 0$; poiché in questo caso $n$ è dispari, ciò equivale a $x \\geq 0$. Dominio $[0, +\\infty)$.</li>
  <li>Se $m$ è <strong>dispari</strong> (es. $\\sqrt[3]{x} = x^{1/3}$): la radice di indice dispari è definita per ogni base reale. Dominio $\\mathbb{R}$.</li>
</ul>
<p><strong>Caso 3: $q = n/m \\lt 0$ non intero</strong> (quindi $m \\geq 2$, $n \\lt 0$). La funzione è al denominatore: $x^{n/m} = \\dfrac{1}{\\sqrt[m]{x^{|n|}}}$. Le condizioni sono le stesse del Caso 2, ma bisogna escludere i valori che annullano il denominatore.</p>
<ul>
  <li>Se $m$ è <strong>pari</strong> (es. $x^{-1/2} = \\frac{1}{\\sqrt{x}}$): serve $x \\geq 0$ per la radice e $x \\neq 0$ per il denominatore. Dominio $(0, +\\infty)$.</li>
  <li>Se $m$ è <strong>dispari</strong> (es. $x^{-2/3} = \\frac{1}{\\sqrt[3]{x^2}}$, $x^{-1/3} = \\frac{1}{\\sqrt[3]{x}}$): serve solo $x \\neq 0$. Dominio $\\mathbb{R} \\setminus \\{0\\}$.</li>
</ul>
<p>I grafici di $x^2$ (esponente pari) e $x^3$ (esponente dispari) con i punti notevoli $(0,0)$, $(1,1)$, $(-1,1)$, $(-1,-1)$:</p>

          {
            subtitle: "Esempi rapidi di dominio",
            content: `<p>Determiniamo il dominio delle seguenti funzioni applicando direttamente la classificazione:</p>
<ol>
  <li>$f(x) = x^{3/4} = \\sqrt[4]{x^3}$: qui $q = 3/4 \\gt 0$ e $m = 4$ è pari, quindi il dominio è $[0, +\\infty)$.</li>
  <li>$g(x) = x^{-2/3} = \\frac{1}{\\sqrt[3]{x^2}}$: qui $q = -2/3 \\lt 0$ e $m = 3$ è dispari, quindi il dominio è $\\mathbb{R} \\setminus \\{0\\}$.</li>
  <li>$h(x) = x^{5/3} = \\sqrt[3]{x^5}$: qui $q = 5/3 \\gt 0$ e $m = 3$ è dispari, quindi il dominio è $\\mathbb{R}$.</li>
</ol>`
          },
          {
            subtitle: "Esempio illustrativo: determinare un dominio con argomento composto",
            content: `<p>Vediamo come la classificazione si traduce in un esercizio concreto. Determiniamo il dominio naturale di</p>
<p>$$h(x) = (x-1)^{-1/2}.$$</p>
<p><strong>Passo 1: riconoscere il tipo di esponente.</strong> Scriviamo l'esponente come frazione ridotta con denominatore positivo: $q = -\\tfrac{1}{2}$, cioè $n = -1$ e $m = 2$. Abbiamo $m$ pari, $n \\lt 0$: siamo nel <strong>Caso 3 con $m$ pari</strong>, per il quale il dominio della potenza $t \\mapsto t^{-1/2}$ è $(0, +\\infty)$.</p>
<p><strong>Passo 2: imporre la condizione sull'argomento.</strong> La nostra funzione è la composizione di $t \\mapsto t^{-1/2}$ con $t = x - 1$. Dobbiamo quindi richiedere che l'argomento $t = x-1$ stia nel dominio della potenza:</p>
<p>$$x - 1 \\gt 0 \\iff x \\gt 1 .$$</p>
<p><strong>Passo 3: conclusione.</strong> Il dominio naturale è $\\mathrm{dom}(h) = (1, +\\infty)$. Equivalentemente, scrivendo $h(x) = \\dfrac{1}{\\sqrt{x-1}}$, si vede direttamente che serve $x-1 \\geq 0$ per la radice e $\\sqrt{x-1} \\neq 0$ per il denominatore, cioè $x - 1 \\gt 0$.</p>
<p><strong>Attenzione al confronto.</strong> Se l'esponente fosse stato $-\\tfrac{1}{3}$, cioè $h(x) = (x-1)^{-1/3} = \\frac{1}{\\sqrt[3]{x-1}}$, con $m = 3$ dispari la condizione sarebbe stata soltanto $x - 1 \\neq 0$, e il dominio $\\mathbb{R} \\setminus \\{1\\}$. Se invece l'esponente fosse stato $+\\tfrac{1}{2}$, avremmo ottenuto $x - 1 \\geq 0$, cioè $[1, +\\infty)$: il punto $x=1$ è incluso perché non c'è più un denominatore da annullare.</p>`
          }
        ],
        formulas: [
          { label: "Scrittura normalizzata", latex: "q = \\frac{n}{m}, \\quad n \\in \\mathbb{Z},\\ m \\in \\mathbb{N},\\ m \\gt 0,\\ \\mathrm{MCD}(|n|,m)=1" },
          { label: "Interpretazione radicale", latex: "x^{n/m} = \\sqrt[m]{x^n}" },
          { label: "Esponente negativo", latex: "x^{n/m} = \\frac{1}{\\sqrt[m]{x^{|n|}}} \\quad (n \\lt 0)" }
        ]

      {
        id: "s09-monotonia-potenze",
        type: "section",
        title: "Monotonia delle Funzioni Potenza",
        icon: "↗️",
        content: `<p>La monotonia delle funzioni potenza ha un comportamento semplice quando la <strong>base $x$ è positiva</strong>.</p>`,
        subsections: [
          {
            subtitle: "Proposizione (monotonia per basi positive)",
            content: `<p>Sia $f(x) = x^q$ e si consideri il suo dominio ristretto a $(0, +\\infty)$. Allora:</p>
<ul>
  <li>se $q \\gt 0$, la funzione è <strong>strettamente crescente</strong>;</li>
  <li>se $q \\lt 0$, la funzione è <strong>strettamente decrescente</strong>.</li>
</ul>
<p>In formule, per ogni $0 \\lt x_1 \\lt x_2$:</p>
<p>$$\\begin{cases} x_1^q \\lt x_2^q & \\text{se } q \\gt 0 \\\\ x_1^q \\gt x_2^q & \\text{se } q \\lt 0 \\end{cases}$$</p>
<p><strong>Attenzione:</strong> in questa proposizione l'esponente $q$ è <strong>fissato</strong> e varia la <strong>base</strong>. Più avanti useremo anche l'altro confronto (base fissata, esponente variabile): sono due affermazioni diverse.</p>`
          },
          {
            subtitle: "Esempio numerico",
            content: `<p>Siano $x_1 = 2$ e $x_2 = 3$.</p>
<ul>
  <li>Se $q = 2 \\gt 0$, allora $2^2 = 4 \\lt 3^2 = 9$: la funzione $x^2$ è crescente su $(0,+\\infty)$.</li>
  <li>Se $q = -1 \\lt 0$, allora $2^{-1} = 1/2 \\gt 3^{-1} = 1/3$: la funzione $x^{-1}$ è decrescente su $(0,+\\infty)$.</li>
</ul>
<p>Combinando questa proposizione con quella sulla monotonia dell'inversa si ottiene subito, per esempio, che $x \\mapsto x^{1/2} = \\sqrt{x}$ è strettamente crescente su $[0,+\\infty)$ in quanto inversa della funzione strettamente crescente $x \\mapsto x^2$ su $[0,+\\infty)$, mentre $x \\mapsto x^{-1/2}$ è strettamente decrescente su $(0,+\\infty)$.</p>`
          },
          {
            subtitle: "Monotonia per basi negative",
            content: `<p>Quando la base $x$ può essere negativa (cioè quando il dominio lo permette), la situazione è più complessa e la funzione potrebbe <strong>non essere monotona</strong> su tutto il suo dominio.</p>
<ul>
  <li>$f(x) = x^2$ <strong>non</strong> è monotona su $\\mathbb{R}$: è decrescente su $(-\\infty, 0]$ e crescente su $[0, +\\infty)$.</li>
  <li>$f(x) = x^3$ è strettamente crescente su tutto $\\mathbb{R}$.</li>
</ul>
<p>In generale, per $x$ negativi la monotonia dipende dalla parità di numeratore e denominatore dell'esponente. Studieremo questi comportamenti più in dettaglio caso per caso quando avremo a disposizione gli strumenti dell'analisi differenziale. <strong>Per ora, la regola generale da ricordare è quella per basi positive.</strong></p>`
          }
        ],
        formulas: [
          { label: "Crescente ($q \\gt 0$, base variabile)", latex: "0 \\lt x_1 \\lt x_2 \\Rightarrow x_1^q \\lt x_2^q" },
          { label: "Decrescente ($q \\lt 0$, base variabile)", latex: "0 \\lt x_1 \\lt x_2 \\Rightarrow x_1^q \\gt x_2^q" }
        ]
      },

        icon: "📊",
        content: `<p>Consolidiamo la comprensione delle funzioni potenza analizzando l'andamento di alcuni casi noti.</p>`,

<ul>
  <li>Per $x \\gt 0$ la funzione è positiva e strettamente crescente.</li>
  <li>La funzione è <strong>dispari</strong>: infatti $f(-x) = (-x)^3 = -x^3 = -f(x)$. Il suo grafico è quindi simmetrico rispetto all'origine.</li>
</ul>

            subtitle: "Funzione $f(x) = \\frac{1}{x^2} = x^{-2}$",
            content: `<p>L'esponente è intero negativo. Il dominio è $\\mathbb{R} \\setminus \\{0\\}$.</p>
<ul>
  <li>La funzione è <strong>pari</strong>, poiché $f(-x) = (-x)^{-2} = x^{-2} = f(x)$: il grafico è simmetrico rispetto all'asse $y$.</li>
  <li>È sempre positiva.</li>
  <li>Per $x \\to \\pm\\infty$ la funzione tende a $0$.</li>
  <li>Per $x \\to 0$ la funzione tende a $+\\infty$: si dice che ha un <strong>asintoto verticale</strong> in $x=0$.</li>
</ul>

      {
        id: "s11-esponente-irrazionale",
        type: "section",
        title: "Potenze con Esponente Irrazionale",
        icon: "♾️",
        content: `<p>Abbiamo definito $x^q$ per $q \\in \\mathbb{Q}$. Ma cosa succede se l'esponente è un numero <strong>irrazionale</strong>?</p>`,
        quote: {
          text: "Ci sono questioni curiose che ci possiamo chiedere, per esempio: chi è $x^\\pi$? O chi è $2^{\\sqrt{2}}$?",
          src: "Nota del Prof."
        },
        subsections: [
          {
            subtitle: "L'idea: approssimare con i razionali",
            content: `<p>L'idea è di definire queste quantità in modo analogo a come abbiamo definito i numeri irrazionali stessi: attraverso un processo di <strong>approssimazione con numeri razionali</strong>. Ricordiamo di aver definito $\\sqrt{2}$ come l'estremo superiore dell'insieme dei numeri razionali il cui quadrato è minore di $2$. Applichiamo un'idea simile.</p>`
          },
          {
            subtitle: "Definizione (potenza con esponente irrazionale)",
            content: `<p>Sia $x \\in \\mathbb{R}$, $x \\geq 0$, e sia $r \\in \\mathbb{R} \\setminus \\mathbb{Q}$ un numero irrazionale.</p>
<p><strong>Caso $x \\gt 1$ e $r \\gt 0$:</strong></p>
<p>$$x^r := \\sup \\{ x^q \\mid q \\in \\mathbb{Q},\\ 0 \\lt q \\lt r \\}$$</p>
<p>Intuitivamente, approssimiamo $r$ con numeri razionali $q$ “per difetto” e prendiamo l'estremo superiore dei valori $x^q$. Ad esempio, per calcolare $2^\\pi$ consideriamo le approssimazioni di $\\pi \\approx 3.14159\\ldots$ e calcoliamo $2^3, 2^{3.1}, 2^{3.14}, \\dots$: l'estremo superiore di questa sequenza di valori definisce $2^\\pi$.</p>
<p><strong>Caso $0 \\lt x \\lt 1$ e $r \\gt 0$:</strong> qui, al variare dell'esponente razionale $q$, la quantità $x^q$ è decrescente. La definizione viene adattata di conseguenza, ad esempio definendo</p>
<p>$$x^r := \\left( \\frac{1}{x} \\right)^{-r} = \\frac{1}{(1/x)^r}$$</p>
<p>Poiché $1/x \\gt 1$, il termine a denominatore ricade nel caso precedente.</p>
<p><strong>Casi di base:</strong> per coerenza con le potenze razionali poniamo</p>
<p>$$1^r := 1 \\qquad \\text{e} \\qquad 0^r := 0 \\quad (\\text{per } r \\gt 0).$$</p>
<p><strong>Caso $r \\lt 0$:</strong> si definisce, <strong>soltanto per $x \\gt 0$</strong>,</p>
<p>$$x^r := \\frac{1}{x^{-r}}$$</p>
<p>dove $-r$ è un esponente positivo, così che $x^{-r}$ ricade in uno dei casi precedenti. La restrizione $x \\gt 0$ è necessaria: per $x = 0$ il denominatore sarebbe $0^{-r} = 0$ e quindi $0^r$ <strong>non è definito</strong> per $r \\lt 0$ (ad esempio $0^{-\\sqrt{2}}$ non ha significato).</p>`
          },
          {
            subtitle: "Perché quel sup esiste?",
            content: `<p>Nella definizione per $x \\gt 1$ e $r \\gt 0$ scriviamo $\\sup$ di un insieme di numeri reali: dobbiamo accertarci che tale estremo superiore <strong>esista</strong>, e questo richiede due verifiche.</p>
<ol>
  <li><strong>L'insieme non è vuoto.</strong> Per la densità di $\\mathbb{Q}$ in $\\mathbb{R}$ esiste almeno un razionale $q$ con $0 \\lt q \\lt r$, quindi $\\{ x^q \\mid q \\in \\mathbb{Q},\\ 0 \\lt q \\lt r \\} \\neq \\emptyset$.</li>
  <li><strong>L'insieme è limitato superiormente.</strong> Scegliamo un numero intero $N \\gt r$ (esiste sempre). Se $q \\in \\mathbb{Q}$ e $0 \\lt q \\lt r \\lt N$, allora — fissata la base $x \\gt 1$ e facendo variare l'<strong>esponente</strong> — si ha $x^q \\lt x^N$. Il richiamo è immediato: $\\dfrac{x^N}{x^q} = x^{N-q} \\gt 1$ perché $N - q \\gt 0$ e $x \\gt 1$, dunque $x^q \\lt x^N$. (Per $0 \\lt x \\lt 1$ il verso si inverte, ed è per questo che quel caso si tratta separatamente.) Dunque $x^N$ è un maggiorante dell'insieme.</li>
</ol>
<p>Un insieme non vuoto e limitato superiormente di numeri reali ammette estremo superiore per l'<strong>assioma di completezza</strong> di $\\mathbb{R}$: il $\\sup$ non è quindi un'operazione “sempre lecita”, ma lo è qui proprio grazie alle due verifiche appena fatte.</p>`
          },
          {
            subtitle: "Dominio delle potenze con esponente irrazionale",
            content: `<p>Un punto fondamentale da ricordare: quando l'esponente $\\alpha$ è un numero <strong>irrazionale</strong>, la funzione potenza $f(x) = x^\\alpha$ <strong>non è definita per basi negative</strong>, e il dominio dipende dal <strong>segno dell'esponente</strong>:</p>
<ul>
  <li>se $\\alpha \\gt 0$, il dominio è $[0, +\\infty)$ (il valore $x=0$ è ammesso, con $0^\\alpha = 0$);</li>
  <li>se $\\alpha \\lt 0$, il dominio è $(0, +\\infty)$ (il valore $x=0$ <strong>non</strong> è ammesso, perché $x^\\alpha = 1/x^{-\\alpha}$ richiede $x \\neq 0$).</li>
</ul>
<p>Il motivo dell'esclusione delle basi negative è legato al processo di approssimazione: un numero irrazionale può essere approssimato da frazioni $m/n$ con denominatore $n$ sia pari che dispari. Per garantire che la potenza sia sempre definita durante l'approssimazione (evitando radici di indice pari di numeri negativi), si restringe la base $x$ ai soli valori non negativi.</p>`
          }
        ],
        formulas: [
          { label: "Definizione via sup ($x \\gt 1$, $r \\gt 0$)", latex: "x^r := \\sup \\{ x^q \\mid q \\in \\mathbb{Q},\\ 0 \\lt q \\lt r \\}" },
          { label: "Caso $0 \\lt x \\lt 1$", latex: "x^r := \\left(\\frac{1}{x}\\right)^{-r} = \\frac{1}{(1/x)^r}" },
          { label: "Caso $r \\lt 0$ (solo $x \\gt 0$)", latex: "x^r := \\frac{1}{x^{-r}}" }
        ]
      },

      {
        id: "s12-esponenziale",
        type: "section",
        title: "La Funzione Esponenziale",
        icon: "🚀",
        content: `<p>Fino ad ora, nelle funzioni potenza $x^\\alpha$, la variabile era la <strong>base</strong>. Ora invertiamo i ruoli: la base sarà una costante e la variabile sarà l'<strong>esponente</strong>.</p>`,
        subsections: [
          {
            subtitle: "Definizione",
            content: `<p>Si definisce <strong>funzione esponenziale</strong> di base $a$ la funzione</p>
<p>$$f(x) = a^x$$</p>
<p>dove la base $a$ è una costante reale positiva e diversa da $1$ ($a \\in \\mathbb{R}$, $a \\gt 0$, $a \\neq 1$).</p>`
          },
          {
            subtitle: "Monotonia dell'esponenziale",
            content: `<p>Sia $a \\gt 0$, $a \\neq 1$ e sia $f(x) = a^x$ definita su $\\mathbb{R}$. Allora:</p>
<ul>
  <li>se $a \\gt 1$, la funzione $f$ è <strong>strettamente crescente</strong> su tutto $\\mathbb{R}$;</li>
  <li>se $0 \\lt a \\lt 1$, la funzione $f$ è <strong>strettamente decrescente</strong> su tutto $\\mathbb{R}$.</li>
</ul>
<p>In entrambi i casi $f$ è dunque <strong>strettamente monotona</strong> su $\\mathbb{R}$, e quindi <strong>iniettiva</strong>. Il caso $a = 1$ è escluso proprio perché $1^x = 1$ è costante e non monotona in senso stretto.</p>`
          },
          {
            subtitle: "Caso 1: base $a \\gt 1$ (es. $a = 2$)",
            content: `<p>La funzione $f(x) = a^x$ è <strong>strettamente crescente</strong> su tutto $\\mathbb{R}$.</p>
<ul>
  <li>Per $x \\to +\\infty$, $a^x \\to +\\infty$.</li>
  <li>Per $x \\to -\\infty$, $a^x \\to 0$. Ad esempio $2^{-1000} = 1/2^{1000}$, un numero molto piccolo.</li>
  <li>Il grafico passa sempre per il punto $(0, 1)$, poiché $a^0 = 1$.</li>
</ul>

          {
            subtitle: "Caso 2: base $0 \\lt a \\lt 1$ (es. $a = 1/2$)",
            content: `<p>La funzione $f(x) = a^x$ è <strong>strettamente decrescente</strong> su tutto $\\mathbb{R}$. Possiamo vederla come $f(x) = (1/b)^x = b^{-x}$ con $b \\gt 1$.</p>
<ul>
  <li>Per $x \\to +\\infty$, $a^x \\to 0$.</li>
  <li>Per $x \\to -\\infty$, $a^x \\to +\\infty$.</li>
  <li>Anche in questo caso il grafico passa per $(0, 1)$.</li>
</ul>

          },
          {
            subtitle: "Caso 3: base $a = 1$ (escluso)",
            content: `<p>La funzione diventa $f(x) = 1^x = 1$. È una funzione costante, che di solito non viene classificata tra le funzioni esponenziali perché non è monotona in senso stretto e quindi <strong>non invertibile</strong>.</p>`
          },
          {
            subtitle: "Dominio, immagine e positività",
            content: `<p>La funzione esponenziale $f(x) = a^x$ (con $a \\gt 0$, $a \\neq 1$) ha come <strong>dominio tutto $\\mathbb{R}$</strong> e come <strong>immagine</strong> l'intervallo $(0, +\\infty)$. È importante notare che</p>
<p>$$a^x \\gt 0 \\qquad \\text{per ogni } x \\in \\mathbb{R}:$$</p>
<p>l'esponenziale è una funzione <strong>strettamente positiva</strong>.</p>`
          }
        ],
        formulas: [
          { label: "Esponenziale", latex: "f \\colon \\mathbb{R} \\to (0,+\\infty), \\qquad f(x) = a^x \\quad (a \\gt 0,\\ a \\neq 1)" },
          { label: "Punto fisso del grafico", latex: "a^0 = 1" },
          { label: "Positività", latex: "a^x \\gt 0 \\quad \\forall x \\in \\mathbb{R}" }
        ]
      },

      {
        id: "s13-logaritmo",
        type: "section",
        title: "La Funzione Logaritmica",
        icon: "🔑",
        content: `<p>Poiché le funzioni esponenziali con $a \\neq 1$ sono strettamente monotone, esse sono <strong>iniettive</strong>. Sono anche suriettive sulla loro immagine $(0, +\\infty)$. Di conseguenza sono funzioni <strong>biettive</strong> e ammettono una funzione inversa.</p>`,
        subsections: [
          {
            subtitle: "Definizione (funzione logaritmica)",
            content: `<p>La funzione inversa della funzione esponenziale $f(x) = a^x$ (con $a \\gt 0$, $a \\neq 1$) è la <strong>funzione logaritmica</strong> in base $a$, indicata con $f^{-1}(x) = \\log_a(x)$. Essa è, per costruzione,</p>
<p>$$\\log_a \\colon (0, +\\infty) \\to \\mathbb{R} .$$</p>
<p>Il dominio $(0,+\\infty)$ e l'immagine $\\mathbb{R}$ fanno dunque parte della definizione stessa, perché derivano dallo scambio di dominio e immagine dell'esponenziale:</p>
<ul>
  <li>Funzione esponenziale: $f \\colon \\mathbb{R} \\to (0, +\\infty)$;</li>
  <li>Funzione logaritmica: $f^{-1} \\colon (0, +\\infty) \\to \\mathbb{R}$.</li>
</ul>
<p>Questo significa che il <strong>dominio</strong> della funzione logaritmica è $(0, +\\infty)$ — l'argomento di un logaritmo deve essere sempre <strong>strettamente positivo</strong> — e la sua <strong>immagine</strong> è tutto $\\mathbb{R}$.</p>`
          },
          {
            subtitle: "Definizione operativa e relazione fondamentale",
            content: `<p>Il valore $\\log_a(x)$ rappresenta <strong>“l'esponente da dare alla base $a$ per ottenere l'argomento $x$”</strong>. Questa definizione porta direttamente alla relazione fondamentale che lega logaritmo ed esponenziale:</p>
<p>$$y = \\log_a(x) \\quad \\iff \\quad a^y = x$$</p>`
          },
          {
            subtitle: "Lettura grafica: simmetria rispetto alla bisettrice",
            content: `<p>Poiché $\\log_a$ è l'inversa di $a^x$, il grafico di $y = \\log_a(x)$ si ottiene da quello di $y = a^x$ per <strong>simmetria rispetto alla retta $y = x$</strong>: ogni punto $(u, v)$ del grafico dell'esponenziale corrisponde al punto $(v, u)$ del grafico del logaritmo, perché dominio e immagine si scambiano.</p>
<p>Nel caso $a = 2$, confrontando il grafico di $2^x$ (quello mostrato sopra nella sezione sull'esponenziale, Caso 1) con quello della sua inversa $\\log_2 x$:</p>
<ul>
  <li>il punto $(0,1)$ del grafico di $2^x$ (intersezione con l'asse $y$) diventa il punto $(1,0)$ del grafico di $\\log_2 x$ (intersezione con l'asse $x$);</li>
  <li>il punto $(1,2)$ diventa il punto $(2,1)$;</li>
  <li>l'asintoto <strong>orizzontale</strong> $y = 0$ dell'esponenziale diventa l'asintoto <strong>verticale</strong> $x = 0$ del logaritmo.</li>
</ul>
<p>Nel grafico seguente le due funzioni sono tracciate sugli stessi assi insieme alla bisettrice $y=x$ (tratteggiata): si vede immediatamente che l'una è il riflesso dell'altra, e i punti evidenziati sono le coppie con le coordinate scambiate.</p>

          {
            subtitle: "Identità fondamentali esponenziale–logaritmo",
            content: `<p>Dalle proprietà delle funzioni inverse $f(f^{-1}(x))=x$ e $f^{-1}(f(x))=x$ otteniamo le due identità fondamentali, ciascuna valida <strong>sul dominio della funzione applicata per prima</strong>:</p>
<ol>
  <li>$a^{\\log_a(x)} = x$, per ogni $x \\in (0, +\\infty)$ (dominio del logaritmo);</li>
  <li>$\\log_a(a^x) = x$, per ogni $x \\in \\mathbb{R}$ (dominio dell'esponenziale).</li>
</ol>
<p>Le condizioni sono essenziali: nella prima identità $x$ deve essere strettamente positivo, altrimenti $\\log_a(x)$ non esiste; nella seconda, invece, $x$ può essere qualunque numero reale, perché $a^x$ è sempre positivo e quindi sempre accettabile come argomento del logaritmo. Ad esempio $2^{\\log_2 8} = 8$ e $\\log_2(2^{-5}) = -5$.</p>`
          }
        ],
        formulas: [
          { label: "Logaritmo come inversa", latex: "\\log_a \\colon (0,+\\infty) \\to \\mathbb{R}" },
          { label: "Relazione fondamentale", latex: "y = \\log_a(x) \\iff a^y = x" },
          { label: "Prima identità (su $(0,+\\infty)$)", latex: "a^{\\log_a(x)} = x" },
          { label: "Seconda identità (su $\\mathbb{R}$)", latex: "\\log_a(a^x) = x" }
        ],
        quote: {
          text: "La prima identità, $a^{\\log_a(x)} = x$, è la diretta conseguenza della definizione di logaritmo. Se $\\log_a(x)$ è l'esponente che devo dare ad $a$ per ottenere $x$, allora se do quell'esponente ad $a$, ottengo proprio $x$. Questa è la definizione di funzione inversa: applico una funzione e poi la sua inversa, e torno al punto di partenza.",
          src: "Nota del Prof."
        }

      {
        id: "s14-integrazione-log",
        type: "integrazione_box",
        title: "Integrazione — non detto dal docente",
        icon: "➕",
        content: `<p><strong>Esempio illustrativo: come si usa in pratica la relazione $y=\\log_a(x) \\iff a^y = x$.</strong></p>
<p>Il modo più rapido per calcolare un logaritmo “a mano” è porsi la domanda operativa: <em>a che potenza devo elevare la base per ottenere l'argomento?</em></p>
<ol>
  <li>$\\log_2 8 = 3$, perché $2^3 = 8$.</li>
  <li>$\\log_2\\!\\left(\\dfrac{1}{4}\\right) = -2$, perché $2^{-2} = \\dfrac{1}{2^2} = \\dfrac{1}{4}$.
    <p>Si noti che il risultato è <strong>negativo</strong>: ciò accade, con base $a \\gt 1$, ogni volta che l'argomento è compreso tra $0$ e $1$. Questo è coerente col fatto che l'immagine del logaritmo è tutto $\\mathbb{R}$, quindi i valori negativi sono perfettamente legittimi (ciò che non è ammesso è un <em>argomento</em> negativo).</p>
  </li>
  <li>$\\log_{1/2} 4 = -2$, perché $\\left(\\dfrac{1}{2}\\right)^{-2} = 2^{2} = 4$.
    <p>Qui la base è minore di $1$: il logaritmo è allora una funzione <strong>decrescente</strong>, e infatti ad un argomento “grande” ($4 \\gt 1$) corrisponde un valore negativo.</p>
  </li>
  <li>Per confronto, $\\log_{1/2}\\!\\left(\\dfrac{1}{8}\\right) = 3$, perché $\\left(\\dfrac{1}{2}\\right)^{3} = \\dfrac{1}{8}$: con base minore di $1$ gli argomenti compresi tra $0$ e $1$ danno valori positivi.</li>
</ol>
<p>In ogni caso la verifica è sempre la stessa: si riscrive l'uguaglianza $y = \\log_a(x)$ nella forma esponenziale $a^y = x$ e si controlla che l'identità numerica sia vera.</p>`
      },

      {
        id: "s16-teoria1",
        type: "esercizio",
        title: "Teoria 1",
        kind: "teoria",
        source: "integrazione",
        icon: "✎",
        content: `<p>Enuncia le due identità fondamentali della funzione inversa, precisando su quale insieme vale ciascuna delle due, e spiega perché l'identità $\\sqrt{x^2} = x$ non vale su tutto $\\mathbb{R}$.</p>`,
        solution: `<p>Sia $f \\colon X \\to Y$ biettiva e sia $f^{-1} \\colon Y \\to X$ la sua inversa. Valgono le due identità</p>
<p>$$f^{-1}\\bigl(f(x)\\bigr) = x \\quad \\forall x \\in X, \\qquad f\\bigl(f^{-1}(y)\\bigr) = y \\quad \\forall y \\in Y;$$</p>
<p>in notazione di composizione $f^{-1} \\circ f = \\mathrm{id}_X$ e $f \\circ f^{-1} = \\mathrm{id}_Y$.</p>
<p>I due insiemi su cui le identità valgono sono in generale <strong>diversi</strong>: la prima ha senso solo per $x$ nel dominio $X$ di $f$, la seconda solo per $y$ nel dominio $Y = \\mathrm{Im}(f)$ di $f^{-1}$. Per esempio, per $f \\colon [0,+\\infty) \\to [1,+\\infty)$, $f(x) = x^2+1$, si ha $f^{-1}(y) = \\sqrt{y-1}$ e $f(f^{-1}(0))$ non ha senso perché $0 \\notin Y$.</p>
<p>Quanto a $\\sqrt{x^2}$: prendendo $f(x) = x^2$ con $X = Y = [0,+\\infty)$ si ha $f^{-1}(x) = \\sqrt{x}$ e dunque $f^{-1}(f(x)) = \\sqrt{x^2} = x$ <em>solo</em> per $x \\in X = [0,+\\infty)$. Infatti la funzione $x \\mapsto \\sqrt{x^2}$ è definita su tutto $\\mathbb{R}$ e coincide con il valore assoluto:</p>
<p>$$\\sqrt{x^2} = |x|, \\qquad \\text{cioè } \\sqrt{x^2} = x \\text{ se } x \\geq 0, \\quad \\sqrt{x^2} = -x \\text{ se } x \\lt 0 .$$</p>
<p>Per esempio con $x = -2$ si ottiene $\\sqrt{(-2)^2} = \\sqrt{4} = 2 \\neq -2$. L'identità $f^{-1}(f(x)) = x$ vale quindi solo sull'insieme $[0,+\\infty)$ su cui $x^2$ è stata resa invertibile, e non su tutto $\\mathbb{R}$ (dove $x^2$ non è nemmeno iniettiva).</p>`
      },

      {
        id: "s17-teoria2",
        type: "esercizio",
        title: "Teoria 2",
        kind: "teoria",
        source: "integrazione",
        icon: "✎",
        content: `<p>Dai la definizione della funzione valore assoluto, precisandone dominio e immagine, descrivi il suo grafico e dimostra che $|x|=0$ se e solo se $x=0$.</p>`,
        solution: `<p>La funzione valore assoluto è la funzione $f \\colon \\mathbb{R} \\to [0,+\\infty)$ definita per casi da $|x|=x$ se $x \\geq 0$ e $|x|=-x$ se $x \\lt 0$.</p>
<p>Il <strong>dominio</strong> naturale è tutto $\\mathbb{R}$, perché ogni reale ricade in uno dei due casi. L'<strong>immagine</strong> è $[0,+\\infty)$: infatti per $x \\geq 0$ si ottiene $|x|=x \\geq 0$ e per $x \\lt 0$ si ottiene $|x|=-x \\gt 0$; inoltre ogni $y \\geq 0$ è assunto, essendo $|y|=y$.</p>
<p>Il <strong>grafico</strong> è la spezzata a forma di V con vertice nell'origine: per $x \\geq 0$ coincide con la bisettrice $y=x$ del primo quadrante, per $x \\lt 0$ con la bisettrice $y=-x$ del secondo quadrante.</p>
<p><strong>Dimostrazione dell'equivalenza $|x|=0 \\iff x=0$.</strong> Se $x=0$ allora, essendo $0 \\geq 0$, vale il primo caso della definizione e quindi $|0|=0$. Viceversa, sia $|x|=0$ e distinguiamo i due casi: se $x \\geq 0$ allora $|x|=x$, dunque $x=0$; se $x \\lt 0$ allora $|x|=-x \\gt 0$, in contraddizione con $|x|=0$. Quindi l'unico caso possibile è $x=0$.</p>`
      },

      {
        id: "s18-teoria3",
        type: "esercizio",
        title: "Teoria 3",
        kind: "teoria",
        source: "integrazione",
        icon: "✎",
        content: `<p>Definisci la funzione logaritmica $\\log_a$ (con $a \\gt 0$, $a \\neq 1$), precisandone dominio e immagine, ed enuncia la relazione che la lega all'esponenziale. Spiega inoltre perché l'argomento di un logaritmo deve essere strettamente positivo.</p>`,
        solution: `<p>La funzione esponenziale $f(x)=a^x$, con $a \\gt 0$ e $a \\neq 1$, ha dominio $\\mathbb{R}$ e immagine $(0,+\\infty)$; essendo strettamente monotona (crescente se $a \\gt 1$, decrescente se $0 \\lt a \\lt 1$) è iniettiva, e quindi biettiva da $\\mathbb{R}$ a $(0,+\\infty)$.</p>
<p>Si definisce allora $\\log_a := f^{-1}$, cioè $\\log_a \\colon (0,+\\infty) \\to \\mathbb{R}$. Di conseguenza il <strong>dominio</strong> di $\\log_a$ è $(0,+\\infty)$ e la sua <strong>immagine</strong> è tutto $\\mathbb{R}$. La relazione fondamentale è</p>
<p>$$y=\\log_a(x) \\iff a^y=x,$$</p>
<p>ovvero $\\log_a(x)$ è l'esponente da dare ad $a$ per ottenere $x$.</p>
<p>L'argomento deve essere strettamente positivo proprio perché l'immagine dell'esponenziale è $(0,+\\infty)$: non esiste alcun $y \\in \\mathbb{R}$ con $a^y=0$ oppure $a^y \\lt 0$, dato che $a^y \\gt 0$ per ogni $y$. Quindi espressioni come $\\log_2(0)$ o $\\log_2(-4)$ non hanno significato, mentre un <em>valore</em> negativo del logaritmo è del tutto legittimo: per esempio $\\log_2\\left(\\frac{1}{4}\\right)=-2$ perché $2^{-2}=\\frac{1}{4}$.</p>`
      },

      {
        id: "s19-teoria4",
        type: "esercizio",
        title: "Teoria 4",
        kind: "teoria",
        source: "integrazione",
        icon: "✎",
        content: `<p>Sia $f \\colon X \\to \\mathbb{R}$ strettamente decrescente. Dimostra che $f$ è invertibile su $\\mathrm{Im}(f)$ e che $f^{-1} \\colon \\mathrm{Im}(f) \\to X$ è strettamente decrescente.</p>`,
        solution: `<p><strong>Iniettività.</strong> Siano $x_1, x_2 \\in X$ con $x_1 \\neq x_2$; possiamo supporre $x_1 \\lt x_2$. Per la decrescenza stretta $f(x_1) \\gt f(x_2)$, in particolare $f(x_1) \\neq f(x_2)$. Dunque $f$ è iniettiva, quindi biettiva da $X$ su $\\mathrm{Im}(f)$ ed esiste $f^{-1} \\colon \\mathrm{Im}(f) \\to X$.</p>
<p><strong>Monotonia dell'inversa.</strong> Siano $y_1, y_2 \\in \\mathrm{Im}(f)$ con $y_1 \\lt y_2$ e poniamo $x_1 = f^{-1}(y_1)$, $x_2 = f^{-1}(y_2)$, così che $f(x_1) = y_1$ e $f(x_2) = y_2$. Supponiamo per assurdo $x_1 \\leq x_2$.</p>
<ul>
  <li>Se $x_1 = x_2$, applicando $f$ si ottiene $y_1 = y_2$, contro $y_1 \\lt y_2$.</li>
  <li>Se $x_1 \\lt x_2$, la decrescenza stretta dà $f(x_1) \\gt f(x_2)$, cioè $y_1 \\gt y_2$, di nuovo in contraddizione con $y_1 \\lt y_2$.</li>
</ul>
<p>Resta dunque $x_1 \\gt x_2$, ossia</p>
<p>$$f^{-1}(y_1) \\gt f^{-1}(y_2),$$</p>
<p>che è esattamente la decrescenza stretta di $f^{-1}$.</p>
<p><strong>Esempio.</strong> $f(x) = -x^3$ è strettamente decrescente su $\\mathbb{R}$ con $\\mathrm{Im}(f) = \\mathbb{R}$ e $f^{-1}(y) = -\\sqrt[3]{y}$, che è a sua volta strettamente decrescente: se $y_1 \\lt y_2$ allora $\\sqrt[3]{y_1} \\lt \\sqrt[3]{y_2}$ e quindi $-\\sqrt[3]{y_1} \\gt -\\sqrt[3]{y_2}$.</p>`
      },

      {
        id: "s20-scritto1",
        type: "esercizio",
        title: "Scritto 1",
        kind: "scritto",
        source: "integrazione",
        icon: "✎",
        content: `<p>Determinare il dominio naturale di $f(x) = (x^2-4)^{-1/2}$.</p>`,
        solution: `<p><strong>Passo 1 (tipo di esponente).</strong> Scriviamo l'esponente come frazione ridotta con denominatore positivo: $-\\tfrac{1}{2} = \\tfrac{n}{m}$ con $n = -1$ e $m = 2$. Poiché $m$ è pari e $n \\lt 0$, siamo nel Caso 3 con $m$ pari: il dominio naturale della potenza $t \\mapsto t^{-1/2} = \\frac{1}{\\sqrt{t}}$ è $(0,+\\infty)$ (serve $t \\geq 0$ per la radice e $t \\neq 0$ per il denominatore).</p>
<p><strong>Passo 2 (condizione sull'argomento).</strong> La funzione è la composizione di $t \\mapsto t^{-1/2}$ con $t = x^2-4$, quindi occorre</p>
<p>$$x^2 - 4 \\gt 0 .$$</p>
<p><strong>Passo 3 (disequazione).</strong> Si ha $x^2 - 4 = (x-2)(x+2)$, parabola con la concavità verso l'alto e zeri $x = -2$, $x = 2$: dunque $x^2-4 \\gt 0$ all'esterno dell'intervallo delle radici. Equivalentemente</p>
<p>$$x^2 \\gt 4 \\iff |x| \\gt 2 \\iff x \\lt -2 \\ \\text{oppure} \\ x \\gt 2 .$$</p>
<p><strong>Conclusione.</strong> $\\mathrm{dom}(f) = (-\\infty,-2) \\cup (2,+\\infty)$. Si noti che gli estremi $x = \\pm 2$ sono <strong>esclusi</strong>: scrivendo $f(x) = \\frac{1}{\\sqrt{x^2-4}}$, in $x = \\pm 2$ si annullerebbe il denominatore.</p>

        source: "integrazione",
        icon: "✎",
        content: `<p>Risolvere la disequazione $|2x-1| \\leq 5$.</p>`,
        solution: `<p>Poiché $5 \\gt 0$, applichiamo la proprietà $|A| \\leq c \\iff -c \\leq A \\leq c$ con $A=2x-1$ e $c=5$: la disequazione equivale alla doppia disuguaglianza</p>
<p>$$-5 \\leq 2x-1 \\leq 5 .$$</p>
<p>Sommando $1$ a tutti i membri si ottiene $-4 \\leq 2x \\leq 6$ e, dividendo per $2 \\gt 0$ (il verso non cambia),</p>
<p>$$-2 \\leq x \\leq 3 .$$</p>
<p>L'insieme delle soluzioni è dunque $S=[-2,3]$.</p>
<p><strong>Verifica agli estremi:</strong> $|2\\cdot(-2)-1|=|-5|=5 \\leq 5$ e $|2\\cdot 3-1|=|5|=5 \\leq 5$, mentre per esempio in $x=4$ si ha $|7|=7 \\gt 5$.</p>

        id: "s22-scritto3",
        type: "esercizio",
        title: "Scritto 3",
        kind: "scritto",
        source: "integrazione",
        icon: "✎",
        content: `<p>Calcolare, giustificando ogni passaggio con la relazione $y=\\log_a(x) \\iff a^y=x$: (a) $\\log_3 81$; (b) $\\log_{1/2} 8$; (c) $\\log_5\\dfrac{1}{25}$; (d) $5^{\\log_5 11}$; (e) $\\log_7\\left(7^{-4}\\right)$.</p>`,
        solution: `<p><strong>(a)</strong> Cerchiamo $y$ con $3^y=81$:</p>
<p>$$81=3^4 \\quad \\Rightarrow \\quad \\log_3 81 = 4 .$$</p>
<p><strong>(b)</strong> Cerchiamo $y$ con $\\left(\\frac{1}{2}\\right)^y=8$:</p>
<p>$$\\left(\\frac{1}{2}\\right)^{-3} = 2^3 = 8 \\quad \\Rightarrow \\quad \\log_{1/2} 8 = -3 .$$</p>
<p>Il valore è negativo coerentemente col fatto che per base $0 \\lt a \\lt 1$ il logaritmo è decrescente e agli argomenti maggiori di $1$ corrispondono valori negativi.</p>
<p><strong>(c)</strong> Cerchiamo $y$ con $5^y=\\frac{1}{25}$:</p>
<p>$$5^{-2}=\\frac{1}{5^2}=\\frac{1}{25} \\quad \\Rightarrow \\quad \\log_5 \\frac{1}{25} = -2 .$$</p>
<p><strong>(d)</strong> Per l'identità $a^{\\log_a(x)}=x$, valida per $x \\gt 0$: essendo $11 \\gt 0$,</p>
<p>$$5^{\\log_5 11} = 11 .$$</p>
<p><strong>(e)</strong> Per l'identità $\\log_a(a^x)=x$, valida per ogni $x \\in \\mathbb{R}$ (perché $a^x \\gt 0$ è sempre un argomento accettabile):</p>
<p>$$\\log_7\\left(7^{-4}\\right) = -4 .$$</p>`
      },

      {
        id: "s23-scritto4",
        type: "esercizio",
        title: "Scritto 4",
        kind: "scritto",
        source: "integrazione",
        icon: "✎",
        content: `<p>Risolvere la disequazione $|2x-1| \\leq 3$.</p>`,
        solution: `<p><strong>Metodo 1 (proprietà del valore assoluto).</strong> Per la proprietà $|t| \\leq c \\iff -c \\leq t \\leq c$, valida per $c \\gt 0$, con $t = 2x-1$ e $c = 3$ si ottiene</p>
<p>$$-3 \\leq 2x-1 \\leq 3 .$$</p>
<p>Sommando $1$ a tutti i membri: $-2 \\leq 2x \\leq 4$; dividendo per $2 \\gt 0$ (il senso delle disuguaglianze non cambia): $-1 \\leq x \\leq 2$.</p>
<p><strong>Metodo 2 (per casi, come controllo).</strong> Se $x \\geq \\tfrac{1}{2}$ si ha $|2x-1| = 2x-1$ e la disequazione diventa $2x-1 \\leq 3$, cioè $x \\leq 2$: in questo caso le soluzioni sono $\\tfrac{1}{2} \\leq x \\leq 2$. Se $x \\lt \\tfrac{1}{2}$ si ha $|2x-1| = 1-2x$ e la disequazione diventa $1-2x \\leq 3$, cioè $-2x \\leq 2$, ossia $x \\geq -1$: in questo caso le soluzioni sono $-1 \\leq x \\lt \\tfrac{1}{2}$. L'unione dei due casi è $[-1,2]$.</p>
<p><strong>Conclusione.</strong> L'insieme delle soluzioni è $[-1,2]$.</p>

        content: `<p>Tre nuclei su cui il professore insiste e che compaiono tipicamente all'orale:</p>
<ul>
  <li><strong>Dove valgono le identità dell'inversa?</strong> Non basta scriverle: va detto che la prima vale su $X$ e la seconda su $Y = \\mathrm{Im}(f)$, con un esempio in cui $X \\neq Y$.</li>
  <li><strong>Perché $\\sqrt{x^2} = |x|$?</strong> È il controesempio standard che mostra la necessità di restringere il dominio per invertire $x^2$.</li>
  <li><strong>Perché nella definizione di $x^r$ con $r$ irrazionale il $\\sup$ esiste?</strong> Insieme non vuoto (densità di $\\mathbb{Q}$) + limitato superiormente ($x^N$ con $N \\gt r$ intero) + assioma di completezza.</li>
</ul>`,

            ["$q \\gt 0$ non intero", "$m$ dispari", "$\\mathbb{R}$"],
            ["$q \\lt 0$ non intero", "$m$ pari", "$(0, +\\infty)$"],
            ["$q \\lt 0$ non intero", "$m$ dispari", "$\\mathbb{R} \\setminus \\{0\\}$"],

    oral_cards: [
      {
        type: "definizione",
        front: "Enuncia le due identità fondamentali della funzione inversa precisando su quale insieme vale ciascuna.",
        back: "Se $f \\colon X \\to Y$ è biettiva con inversa $f^{-1} \\colon Y \\to X$, allora $f^{-1}(f(x)) = x$ per ogni $x \\in X$ e $f(f^{-1}(y)) = y$ per ogni $y \\in Y$. In notazione di composizione: $f^{-1} \\circ f = \\mathrm{id}_X$ e $f \\circ f^{-1} = \\mathrm{id}_Y$. I due insiemi sono in generale <strong>diversi</strong>: la prima composizione ha senso solo per $x$ nel dominio $X$ di $f$, la seconda solo per $y \\in Y = \\mathrm{Im}(f)$."
      },
      {
        type: "tranello",
        front: "È vero che $\\sqrt{x^2} = x$ per ogni $x \\in \\mathbb{R}$?",
        back: "No. La funzione $x \\mapsto \\sqrt{x^2}$ è definita su tutto $\\mathbb{R}$ e coincide con il valore assoluto: $\\sqrt{x^2} = |x|$, cioè $x$ se $x \\geq 0$ e $-x$ se $x \\lt 0$. Per esempio $\\sqrt{(-2)^2} = \\sqrt{4} = 2 \\neq -2$. L'identità $\\sqrt{x^2} = x$ vale <strong>solo</strong> su $[0,+\\infty)$, cioè sull'insieme in cui abbiamo reso invertibile $f(x) = x^2$."
      },
      {
        type: "tranello",
        front: "Perché nell'esempio $f \\colon [0,+\\infty) \\to [1,+\\infty)$, $f(x) = x^2+1$, l'espressione $f(f^{-1}(0))$ non ha senso?",
        back: "Perché $f^{-1}(y) = \\sqrt{y-1}$ ha dominio $Y = [1,+\\infty)$ e $0 \\notin Y$: si otterrebbe $f^{-1}(0) = \\sqrt{-1}$, che non esiste in $\\mathbb{R}$. È l'esempio che mostra concretamente che le due identità valgono su insiemi diversi: qui $X = [0,+\\infty) \\neq Y = [1,+\\infty)$."
      },
      {
        type: "dimostrazione",
        front: "Dimostra che se $f$ è strettamente crescente anche $f^{-1}$ è strettamente crescente.",
        back: "Siano $y_1, y_2 \\in \\mathrm{Im}(f)$ con $y_1 \\lt y_2$. Esistono unici $x_1, x_2 \\in X$ con $f(x_1)=y_1$, $f(x_2)=y_2$, cioè $x_1 = f^{-1}(y_1)$, $x_2 = f^{-1}(y_2)$. L'ipotesi diventa $f(x_1) \\lt f(x_2)$. Se per assurdo fosse $x_1 \\geq x_2$, dalla crescenza stretta seguirebbe $f(x_1) \\geq f(x_2)$, cioè $y_1 \\geq y_2$: contraddizione. Dunque $x_1 \\lt x_2$, cioè $f^{-1}(y_1) \\lt f^{-1}(y_2)$."
      },
      {
        type: "dimostrazione",
        front: "Dimostra la disuguaglianza triangolare $|x+y| \\leq |x|+|y|$.",
        back: "Per la proprietà $|A| \\leq C \\iff -C \\leq A \\leq C$ (con $C \\geq 0$), posti $A = x+y$ e $C = |x|+|y|$, la tesi equivale a $-(|x|+|y|) \\leq x+y \\leq |x|+|y|$. Dalla proprietà $-|x| \\leq x \\leq |x|$ e $-|y| \\leq y \\leq |y|$, sommando membro a membro si ottiene $-|x|-|y| \\leq x+y \\leq |x|+|y|$, che è esattamente la tesi. (Se $|x|+|y|=0$ allora $x=y=0$ e la disuguaglianza è banale.)"
      },
      {
        type: "formula",
        front: "Dominio di $x^q$ con $q = n/m$ ridotta, $m \\gt 0$: elenca i casi.",
        back: "<strong>$q$ intero</strong> ($m=1$): dominio $\\mathbb{R}$ se $n \\gt 0$; $\\mathbb{R}\\setminus\\{0\\}$ se $n \\leq 0$.<br><strong>$q \\gt 0$ non intero</strong>: $[0,+\\infty)$ se $m$ pari, $\\mathbb{R}$ se $m$ dispari.<br><strong>$q \\lt 0$ non intero</strong>: $(0,+\\infty)$ se $m$ pari, $\\mathbb{R}\\setminus\\{0\\}$ se $m$ dispari.<br><strong>$q$ irrazionale</strong>: $[0,+\\infty)$ se $q \\gt 0$, $(0,+\\infty)$ se $q \\lt 0$ (mai basi negative)."
      },
      {
        type: "domanda",
        front: "Perché, se $m$ è pari e $n \\gt 0$ nella frazione ridotta $q=n/m$, la condizione $x^n \\geq 0$ equivale a $x \\geq 0$?",
        back: "Perché se $m$ è pari allora $n$ è necessariamente <strong>dispari</strong>: la frazione è ridotta ai minimi termini, quindi se anche $n$ fosse pari numeratore e denominatore avrebbero il fattore comune $2$. Una potenza con esponente dispari ha lo stesso segno della base, dunque $x^n \\geq 0 \\iff x \\geq 0$. Il dominio di $x^{n/m} = \\sqrt[m]{x^n}$ è allora $[0,+\\infty)$."
      },
      {
        type: "dimostrazione",
        front: "Nella definizione $x^r := \\sup\\{x^q : q \\in \\mathbb{Q},\\ 0 \\lt q \\lt r\\}$ (con $x \\gt 1$, $r$ irrazionale positivo), perché quel sup esiste?",
        back: "Servono due verifiche. <strong>(1) Insieme non vuoto:</strong> per la densità di $\\mathbb{Q}$ in $\\mathbb{R}$ esiste un razionale $q$ con $0 \\lt q \\lt r$. <strong>(2) Limitato superiormente:</strong> preso un intero $N \\gt r$, per ogni razionale $q$ con $0 \\lt q \\lt r \\lt N$ si ha $x^N/x^q = x^{N-q} \\gt 1$ (perché $N-q \\gt 0$ e $x \\gt 1$), dunque $x^q \\lt x^N$: $x^N$ è un maggiorante. Per l'<strong>assioma di completezza</strong> di $\\mathbb{R}$ il sup esiste. Qui varia l'<strong>esponente</strong>, con la base fissata."
      },
      {
        type: "tranello",
        front: "Perché nella definizione di esponenziale $a^x$ si escludono $a \\leq 0$ e $a = 1$?",
        back: "Le basi $a \\leq 0$ sono escluse perché la potenza non sarebbe definita per tutti gli esponenti (già per esponenti razionali con denominatore pari, e per esponenti irrazionali il processo di approssimazione richiede basi non negative). Il caso $a = 1$ è escluso perché $1^x = 1$ è <strong>costante</strong>: non è monotona in senso stretto, quindi non è iniettiva e non è invertibile — e sarebbe impossibile definire $\\log_1$."
      },

        type: "definizione",

        back: "$\\log_a$ è la <strong>funzione inversa</strong> dell'esponenziale $f(x)=a^x$ (con $a \\gt 0$, $a \\neq 1$), che è biettiva da $\\mathbb{R}$ a $(0,+\\infty)$. Quindi $\\log_a \\colon (0,+\\infty) \\to \\mathbb{R}$: il dominio è $(0,+\\infty)$ (argomento strettamente positivo) e l'immagine è tutto $\\mathbb{R}$. Relazione fondamentale: $y = \\log_a(x) \\iff a^y = x$, cioè $\\log_a(x)$ è l'esponente da dare ad $a$ per ottenere $x$."
      },

        type: "tranello",
        front: "$\\log_a(a^x) = x$ e $a^{\\log_a(x)} = x$: valgono per gli stessi $x$?",
        back: "No. $a^{\\log_a(x)} = x$ vale per ogni $x \\in (0,+\\infty)$, cioè sul dominio del logaritmo (per $x \\leq 0$ il logaritmo non esiste). $\\log_a(a^x) = x$ vale invece per ogni $x \\in \\mathbb{R}$, cioè sul dominio dell'esponenziale, perché $a^x \\gt 0$ è sempre un argomento accettabile. Esempi: $2^{\\log_2 8} = 8$ e $\\log_2(2^{-5}) = -5$."

      },
      {
        type: "domanda",
        front: "Come si giustifica che $\\sqrt{x}$ è strettamente crescente su $[0,+\\infty)$ usando i risultati della lezione?",
        back: "$x \\mapsto x^2$ è strettamente crescente su $[0,+\\infty)$ e quindi biettiva su $[0,+\\infty)$. Per la proposizione sulla monotonia dell'inversa, l'inversa di una funzione strettamente crescente è strettamente crescente: dunque $x \\mapsto x^{1/2} = \\sqrt{x}$ è strettamente crescente su $[0,+\\infty)$. Analogamente $x \\mapsto x^{-1/2}$ è strettamente decrescente su $(0,+\\infty)$."

        type: "tranello",
        front: "La funzione $x^q$ è monotona su tutto il suo dominio?",
        back: "Non necessariamente. La regola semplice vale per <strong>basi positive</strong>: su $(0,+\\infty)$, $x^q$ è strettamente crescente se $q \\gt 0$ e strettamente decrescente se $q \\lt 0$. Quando il dominio include basi negative la situazione è più complessa: $x^2$ non è monotona su $\\mathbb{R}$ (decresce su $(-\\infty,0]$ e cresce su $[0,+\\infty)$), mentre $x^3$ è strettamente crescente su tutto $\\mathbb{R}$. La monotonia per $x \\lt 0$ dipende dalla parità di numeratore e denominatore dell'esponente."
      },

        front: "Come si stima $|x|$ sapendo che $|x-2| \\leq \\frac{1}{10}$?",
