    title: "Suriettività, Iniettività, Invertibilità e Composizione",
    abstract: "Dalle proprietà che classificano le funzioni (suriettività e iniettività) alla loro combinazione — la biettività — fino al legame con la monotonia, alla composizione e alla costruzione della funzione inversa.",

    sections: [
      {
        id: "s07-intro",
        type: "section",
        title: "Il percorso della lezione",
        icon: "🧭",
        content: `<p>Nella lezione precedente abbiamo analizzato massimo e minimo di una funzione. Oggi introduciamo altre proprietà fondamentali, che permettono di classificare le funzioni e di capire quando è possibile <strong>tornare indietro</strong>, cioè invertire il processo descritto dalla funzione.</p>
<p>L'ordine di marcia è: prima la <strong>suriettività</strong> (il codominio viene coperto tutto?), poi l'<strong>iniettività</strong> (i valori vengono assunti una sola volta?), quindi la loro combinazione (la <strong>biettività</strong>), il legame con la <strong>monotonia</strong>, la <strong>composizione</strong> di funzioni e infine la <strong>funzione inversa</strong>.</p>`,
        quote: {
          text: "Immaginate di essere in un negozio di magliette. Se io entro e dico: «Voglio la maglietta da 20 euro», sto cercando di invertire la funzione. Ma questo è possibile solo se a quel prezzo corrisponde una e una sola maglietta.",
          src: "Nota del Prof."
        },
        extra_content: `<p>L'analogia del professore copre tutti i concetti della lezione:</p>
<ul>
  <li><strong>Iniettività</strong> — se ci sono più magliette da 20 euro, la richiesta non è univoca. L'idea di corrispondenza uno-a-uno è il cuore dell'iniettività.</li>
  <li><strong>Suriettività</strong> — se il negozio ha prezzi da 10 a 50 euro, non posso chiedere una maglietta da 5 euro. L'insieme dei prezzi effettivamente presenti (l'immagine) potrebbe non coincidere con tutti i prezzi immaginabili (il codominio). Quando coincidono, la funzione è suriettiva.</li>
  <li><strong>Composizione</strong> — se una funzione associa a una maglietta il suo tessuto e una seconda associa al tessuto il costo di produzione, componendole si ottiene una funzione che va direttamente dalla maglietta al costo di produzione.</li>
</ul>`
      },

      {
        id: "s07-suriettive",
        type: "section",
        title: "Funzioni Suriettive",
        icon: "🎯",
        content: `<p>La prima proprietà che analizziamo formalizza l'idea che il codominio della funzione sia <em>completamente coperto</em> dai valori che la funzione assume.</p>`,
        subsections: [
          {
            subtitle: "Definizione",
            content: `<p>Una funzione $f: X \\to Y$ si dice <strong>suriettiva</strong> se la sua immagine coincide con il codominio:</p>
<p>$$\\text{Im}(f) = Y$$</p>
<p>Equivalentemente, $f$ è suriettiva se per ogni elemento $y$ del codominio esiste almeno un elemento $x$ del dominio tale che $f(x) = y$:</p>
<p>$$\\forall y \\in Y, \\ \\exists x \\in X \\text{ tale che } f(x) = y$$</p>`
          },
          {
            subtitle: "Come si verifica in pratica",
            content: `<p>La suriettività <strong>non è una proprietà della sola formula</strong> $f(x)$: dipende in modo essenziale dal <strong>codominio dichiarato</strong>.</p>
<ul>
  <li><strong>Per dimostrarla:</strong> si parte da un $y \\in Y$ <em>arbitrario</em> e si <em>esibisce</em> un $x \\in X$ con $f(x) = y$ (tipicamente risolvendo l'equazione $f(x) = y$ nell'incognita $x$).</li>
  <li><strong>Per negarla:</strong> basta esibire un singolo $y_0 \\in Y$ per cui l'equazione $f(x) = y_0$ non ha soluzioni in $X$.</li>
</ul>

<p>Nel diagramma, su ogni elemento di $Y$ arriva <em>almeno</em> una freccia; $y_1$ è immagine di due elementi distinti ($x_1$ e $x_3$): la suriettività non vieta questa situazione, dunque la funzione è suriettiva ma <em>non</em> iniettiva.</p>`
          },
          {
            subtitle: "Esempio: $f(x) = x^3$ è suriettiva",
            content: `<p>Consideriamo $f: \\R \\to \\R$ definita da $f(x) = x^3$. Fissato un qualunque $y \\in \\R$ (il codominio), possiamo <em>costruire</em> un valore $x$ nel dominio tale che $f(x) = y$: basta porre $x = \\sqrt[3]{y}$, che è un numero reale ben definito per ogni $y \\in \\R$ (la radice cubica è definita anche per argomenti negativi). Si ha allora</p>
<p>$$\\forall y \\in \\R, \\quad \\exists\\, x = \\sqrt[3]{y} \\in \\R \\ : \\ f(x) = f\\!\\left(\\sqrt[3]{y}\\right) = \\left(\\sqrt[3]{y}\\right)^{3} = y$$</p>
<p>Ad esempio, per $y = -8$ si ottiene $x = \\sqrt[3]{-8} = -2$ e infatti $f(-2) = (-2)^3 = -8$.</p>

          },
          {
            subtitle: "Esempio: $f(x) = x^2$ non è suriettiva",
            content: `<p>Consideriamo $f: \\R \\to \\R$ definita da $f(x) = x^2$. Il suo codominio è $\\R$, ma la sua immagine è</p>
<p>$$\\text{Im}(f) = [0, +\\infty),$$</p>
<p>perché il quadrato di un numero reale è sempre non negativo. Poiché $\\text{Im}(f) \\neq \\R$, la funzione non è suriettiva.</p>
<p>Per negare la suriettività è sufficiente un solo controesempio: scegliamo $y = -1$ nel codominio; l'equazione $x^2 = -1$ non ha soluzioni in $\\R$, dunque $-1 \\notin \\text{Im}(f)$.</p>

          },
          {
            subtitle: "Si può sempre rendere suriettiva una funzione",
            content: `<p>Una qualsiasi funzione $f: X \\to Y$ diventa <strong>sempre</strong> suriettiva se la consideriamo come una funzione da $X$ alla sua immagine. In altre parole</p>
<p>$$f: X \\to \\text{Im}(f)$$</p>
<p>è sempre suriettiva per definizione: ogni elemento di $\\text{Im}(f)$ è, per costruzione, immagine di almeno un punto di $X$.</p>
<p>Ad esempio, $f(x) = x^2$ considerata come $f: \\R \\to [0, +\\infty)$ è suriettiva, perché abbiamo ristretto il codominio in modo che coincida con l'immagine. <strong>Morale:</strong> la suriettività è una proprietà della <em>terna</em> (dominio, codominio, legge), non della sola legge.</p>`
          }
        ],
        formulas: [
          { label: "Suriettività (immagine)", latex: "\\text{Im}(f) = Y" },
          { label: "Suriettività (quantificatori)", latex: "\\forall y \\in Y \\ \\exists x \\in X : f(x) = y" }
        ]
      },

      {
        id: "s07-iniettive",
        type: "section",
        title: "Funzioni Iniettive",
        icon: "🔗",
        content: `<p>L'iniettività cattura l'idea che elementi distinti del dominio vengano mappati in elementi distinti del codominio.</p>`,
        subsections: [
          {
            subtitle: "Definizione",
            content: `<p>Una funzione $f: X \\to Y$ si dice <strong>iniettiva</strong> se a elementi distinti del dominio $X$ corrispondono elementi distinti del codominio $Y$. Formalmente, questo si esprime in due modi equivalenti:</p>
<p><strong>1.</strong> Per ogni coppia $x_1, x_2 \\in X$, se le immagini sono uguali allora gli elementi di partenza devono essere uguali:</p>
<p>$$\\forall x_1, x_2 \\in X, \\quad f(x_1) = f(x_2) \\Rightarrow x_1 = x_2$$</p>
<p><strong>2.</strong> (Forma contronominale) Se due elementi del dominio sono diversi, allora anche le loro immagini devono essere diverse:</p>
<p>$$\\forall x_1, x_2 \\in X, \\quad x_1 \\neq x_2 \\Rightarrow f(x_1) \\neq f(x_2)$$</p>
<p>Un altro modo per dirlo: per ogni $y \\in Y$ esiste <strong>al più</strong> un elemento $x \\in X$ tale che $f(x) = y$.</p>`
          },
          {
            subtitle: "Test della retta orizzontale",
            content: `<p>La formulazione «per ogni $y$ esiste al più un $x$ con $f(x) = y$» si traduce in un criterio grafico molto comodo: $f$ è iniettiva se e solo se <strong>ogni retta orizzontale</strong> $y = c$ interseca il grafico di $f$ <em>in al massimo un punto</em>. Confrontando i tre criteri:</p>
<ul>
  <li><strong>suriettiva</strong> $\\iff$ ogni retta orizzontale $y=c$ con $c \\in Y$ interseca il grafico <em>almeno</em> una volta;</li>
  <li><strong>iniettiva</strong> $\\iff$ ogni retta orizzontale interseca il grafico <em>al più</em> una volta;</li>
  <li><strong>biettiva</strong> $\\iff$ ogni retta orizzontale $y=c$ con $c \\in Y$ interseca il grafico <em>esattamente</em> una volta.</li>
</ul>

<p>Nel diagramma, su ogni elemento di $Y$ arriva <em>al più</em> una freccia. Si noti che $y_4$ non è immagine di alcun elemento: dunque questa funzione è iniettiva ma <em>non</em> suriettiva, perché $\\text{Im}(f)=\\{y_1,y_2,y_3\\}\\neq Y$.</p>`
          },
          {
            subtitle: "Esempio: $f(x) = x^2$ non è iniettiva",
            content: `<p>La funzione $f(x) = x^2$ da $\\R$ in $\\R$ <strong>non</strong> è iniettiva. Possiamo trovare due valori $x$ diversi con la stessa immagine:</p>
<p>$$x_1 = 2, \\quad x_2 = -2 \\ \\Rightarrow \\ x_1 \\neq x_2$$</p>
<p>ma</p>
<p>$$f(2) = 2^2 = 4 \\quad \\text{e} \\quad f(-2) = (-2)^2 = 4.$$</p>
<p>Quindi $f(x_1) = f(x_2)$ anche se $x_1 \\neq x_2$: la retta orizzontale $y = 4$ taglia la parabola in due punti.</p>`
          },
          {
            subtitle: "Esempio illustrativo: verifica diretta dell'iniettività",
            content: `<p>Verifichiamo che $f: \\R \\to \\R$, $f(x) = 3x - 5$, è iniettiva usando la definizione. Supponiamo $f(x_1) = f(x_2)$, cioè</p>
<p>$$3x_1 - 5 = 3x_2 - 5.$$</p>
<p>Sommando $5$ a entrambi i membri si ottiene $3x_1 = 3x_2$ e, dividendo per $3 \\neq 0$, si conclude $x_1 = x_2$. Dunque $f$ è iniettiva.</p>
<p>Questo è lo <strong>schema standard</strong>: <em>si parte dall'uguaglianza delle immagini e si risale, con passaggi reversibili, all'uguaglianza degli argomenti</em>.</p>`
          },
          {
            subtitle: "Si può rendere iniettiva una funzione restringendo il dominio",
            content: `<p>Come per la suriettività, possiamo rendere una funzione iniettiva restringendo opportunamente il suo dominio. Per $f(x) = x^2$, se restringiamo il dominio a $X = [0, +\\infty)$, la funzione diventa iniettiva: se $x_1, x_2 \\ge 0$ e $x_1^2 = x_2^2$, allora $x_1 = x_2$ (le due radici $\\pm\\sqrt{\\,\\cdot\\,}$ sono state ridotte a una sola dal vincolo di segno).</p>
<p>Avremmo potuto scegliere anche il dominio $X = (-\\infty, 0]$. La scelta dipende dal problema che stiamo affrontando.</p>`
          }
        ],
        formulas: [
          { label: "Iniettività", latex: "f(x_1) = f(x_2) \\Rightarrow x_1 = x_2" },
          { label: "Iniettività (contronominale)", latex: "x_1 \\neq x_2 \\Rightarrow f(x_1) \\neq f(x_2)" }
        ]
      },

      {
        id: "s07-biettive",
        type: "section",
        title: "Funzioni Biettive",
        icon: "↔️",
        content: `<p>Una funzione che possiede entrambe le proprietà di iniettività e suriettività è detta <strong>biettiva</strong>. Queste funzioni stabiliscono una corrispondenza perfetta, «uno a uno», tra gli elementi del dominio e del codominio.</p>
<p>Una funzione $f: X \\to Y$ si dice <strong>biettiva</strong> (o biunivoca) se è sia iniettiva che suriettiva. Equivalentemente:</p>
<p>$$\\forall y \\in Y \\quad \\exists!\\, x \\in X \\ : \\ f(x) = y$$</p>
<p>dove $\\exists!$ si legge «esiste uno e un solo».</p>

      {
        id: "s07-alert-indipendenti",
        type: "alert_box",
        title: "Attenzione all'errore tipico",
        icon: "⚠️",
        content: `<p>Iniettività e suriettività sono proprietà <strong>indipendenti</strong>: nessuna delle due implica l'altra, come mostrano i due diagrammi precedenti (una funzione suriettiva non iniettiva e una iniettiva non suriettiva).</p>
<p>Per concludere che una funzione è biettiva vanno quindi verificate <strong>entrambe</strong>, e la suriettività va sempre verificata <strong>rispetto al codominio dichiarato</strong>.</p>`
      },

      {
        id: "s07-monotonia",
        type: "section",
        title: "Monotonia e Iniettività",
        icon: "📈",
        content: `<p>Esiste un legame importante tra la monotonia di una funzione e la sua iniettività.</p>
<p><strong>Teorema.</strong> Se una funzione $f: X \\to \\R$ (con $X \\subseteq \\R$) è <strong>strettamente monotona</strong> (cioè strettamente crescente o strettamente decrescente) in $X$, allora $f$ è iniettiva in $X$.</p>`,
        subsections: [
          {
            subtitle: "Dimostrazione",
            content: `<p>Vogliamo dimostrare che se $f$ è strettamente monotona, allora è iniettiva. Usiamo la definizione contronominale di iniettività: dobbiamo mostrare che per ogni $x_1, x_2 \\in X$ con $x_1 \\neq x_2$ segue $f(x_1) \\neq f(x_2)$.</p>
<p>Poiché $\\R$ è un insieme totalmente ordinato, se $x_1 \\neq x_2$ deve valere una delle due possibilità: $x_1 \\lt x_2$ oppure $x_2 \\lt x_1$.</p>
<p><strong>Caso 1: $f$ strettamente crescente.</strong></p>
<ul>
  <li>Se $x_1 \\lt x_2$, per definizione di funzione strettamente crescente si ha $f(x_1) \\lt f(x_2)$.</li>
  <li>Se $x_2 \\lt x_1$, allora $f(x_2) \\lt f(x_1)$.</li>
</ul>
<p>In entrambi i casi vale una disuguaglianza <em>stretta</em>, quindi se $x_1 \\neq x_2$ allora $f(x_1) \\neq f(x_2)$.</p>
<p><strong>Caso 2: $f$ strettamente decrescente.</strong></p>
<ul>
  <li>Se $x_1 \\lt x_2$, per definizione di funzione strettamente decrescente si ha $f(x_1) \\gt f(x_2)$.</li>
  <li>Se $x_2 \\lt x_1$, allora $f(x_2) \\gt f(x_1)$.</li>
</ul>
<p>Anche in questo caso, se $x_1 \\neq x_2$ allora $f(x_1) \\neq f(x_2)$.</p>
<p>In conclusione, una funzione strettamente monotona è sempre iniettiva. $\\square$</p>`
          },
          {
            subtitle: "Che cosa il teorema NON dice",
            content: `<p>Il teorema fornisce soltanto l'<strong>iniettività</strong>: non dice nulla sulla suriettività. Una funzione strettamente monotona può non essere suriettiva: per esempio $f: \\R \\to \\R$, $f(x) = e^x$, è strettamente crescente (dunque iniettiva) ma</p>
<p>$$\\text{Im}(f) = (0,+\\infty) \\neq \\R.$$</p>
<p>Per concludere la biettività serve <strong>sempre</strong> una verifica aggiuntiva sulla suriettività.</p>`
          },
          {
            subtitle: "Il viceversa non vale — Controesempio 1: $f(x) = 1/x$",
            content: `<p>Una funzione può essere iniettiva senza essere strettamente monotona sul suo dominio.</p>
<p>Consideriamo $f(x) = \\dfrac{1}{x}$ definita su $X = \\R \\setminus \\{0\\}$. Questa funzione è <strong>iniettiva</strong>: se $f(x_1) = f(x_2)$, allora $\\frac{1}{x_1} = \\frac{1}{x_2}$; moltiplicando entrambi i membri per $x_1 x_2 \\neq 0$ si ottiene $x_2 = x_1$.</p>
<p>Tuttavia <strong>non</strong> è strettamente decrescente su tutto il suo dominio. È decrescente separatamente su $(-\\infty, 0)$ e su $(0, +\\infty)$, ma non globalmente. Prendiamo $x_1 = -1$ e $x_2 = 1$: si ha $x_1 \\lt x_2$, ma</p>
<p>$$f(x_1) = -1 \\ \\lt \\ 1 = f(x_2),$$</p>
<p>mentre la decrescenza richiederebbe $f(x_1) \\gt f(x_2)$. <strong>Il punto chiave</strong> è che il dominio non è un intervallo: i due rami sono separati dal punto $0$.</p>

          {
            subtitle: "Controesempio 2: una funzione definita a tratti",
            content: `<p>Consideriamo</p>
<p>$$f(x) = \\begin{cases} x & \\text{se } x \\in [0, 1] \\\\[2pt] -x+4 & \\text{se } x \\in (1, 2] \\end{cases}$$</p>
<p>il cui dominio è $X = [0,2]$.</p>
<p><strong>Perché è iniettiva.</strong> Ragioniamo in due passi.</p>
<p><strong>1. Ciascun ramo è iniettivo.</strong> Sul primo tratto $f(x) = x$ è strettamente crescente, sul secondo $f(x) = -x+4$ è strettamente decrescente; per il teorema precedente ogni ramo, preso separatamente, è iniettivo.</p>
<p><strong>2. Le immagini dei due rami sono disgiunte.</strong> Infatti</p>
<p>$$f\\big([0,1]\\big) = [0,1], \\qquad f\\big((1,2]\\big) = [2,3),$$</p>
<p>poiché per $x \\in (1,2]$ la quantità $-x+4$ decresce da $3$ (escluso, perché $x=1$ non appartiene al secondo tratto) fino a $f(2) = -2+4 = 2$ (incluso). Dato che $[0,1] \\cap [2,3) = \\varnothing$, due punti appartenenti a rami diversi non possono mai avere la stessa immagine.</p>
<p>Mettendo insieme i due punti: se $f(x_1) = f(x_2)$, allora $x_1$ e $x_2$ stanno nello stesso ramo (punto 2) e quindi $x_1 = x_2$ (punto 1). Dunque $f$ è iniettiva su $[0,2]$ e $\\text{Im}(f) = [0,1] \\cup [2,3)$.</p>
<p><strong>Perché non è monotona.</strong> Esibiamo due coppie di punti che escludono entrambe le monotonie:</p>
<ul>
  <li><strong>non è decrescente</strong>: $x_1 = 0 \\lt x_2 = 1$ con $f(0) = 0 \\lt 1 = f(1)$;</li>
  <li><strong>non è crescente</strong>: $x_1 = \\frac{3}{2} \\lt x_2 = 2$ con $f\\!\\left(\\frac{3}{2}\\right) = -\\frac{3}{2}+4 = \\frac{5}{2} \\gt 2 = f(2)$.</li>
</ul>
<p>Poiché nessuna delle due definizioni di monotonia può valere, $f$ non è monotona su $[0,2]$ pur essendo iniettiva.</p>

      {
        id: "s07-composizione",
        type: "section",
        title: "Composizione di Funzioni",
        icon: "🔄",
        content: `<p>Spesso in matematica si applicano più funzioni in sequenza. Questo processo è formalizzato dal concetto di composizione di funzioni.</p>`,
        subsections: [
          {
            subtitle: "Definizione di funzione composta",
            content: `<p>Date due funzioni $g: X \\to Y$ e $f: V \\to Z$ con $V = \\text{Dom}(f)$, si definisce la <strong>funzione composta</strong> $f \\circ g$ (si legge «f composto g») come la funzione che si ottiene applicando prima $g$ e poi $f$:</p>
<p>$$(f \\circ g)(x) = f\\big(g(x)\\big).$$</p>
<p>Perché la scrittura $f(g(x))$ abbia senso occorre che $g(x)$ appartenga al dominio di $f$. Si distinguono due situazioni.</p>
<p><strong>Caso «globale».</strong> Se</p>
<p>$$\\text{Im}(g) \\subseteq V = \\text{Dom}(f),$$</p>
<p>allora $f(g(x))$ è definita per <em>ogni</em> $x \\in X$ e si ha una funzione</p>
<p>$$f \\circ g : X \\to Z, \\qquad \\text{Dom}(f \\circ g) = X.$$</p>
<p><strong>Caso generale (dominio naturale della composta).</strong> Se la condizione precedente non vale, si considera il sottoinsieme di $X$ formato dai punti per cui la composizione ha senso:</p>
<p>$$D \\ = \\ \\{\\, x \\in X \\ : \\ g(x) \\in \\text{Dom}(f) \\,\\} \\ \\subseteq \\ X,$$</p>
<p>e si definisce $f \\circ g$ sulla <em>restrizione</em> $g|_{D}$. In tal caso</p>
<p>$$f \\circ g : D \\to Z, \\qquad \\text{Dom}(f \\circ g) = D.$$</p>
<p>Per costruzione $\\text{Im}\\big(g|_{D}\\big) \\subseteq \\text{Dom}(f)$: ci si è ricondotti al caso 1 restringendo il dominio di $g$.</p>
<p>In entrambi i casi il codominio della composta è il codominio di $f$, cioè $Z$. D'ora in avanti, salvo avviso contrario, adotteremo la <strong>convenzione del dominio naturale</strong>: $\\text{Dom}(f\\circ g) = D$.</p>`
          },
          {
            subtitle: "Le due formulazioni non sono in contrasto",
            content: `<p>Il caso 1 è il caso particolare del caso 2 in cui $D = X$: se $\\text{Im}(g) \\subseteq \\text{Dom}(f)$, nessun punto di $X$ viene escluso. La seconda formulazione è quella che si usa negli esercizi, dove tipicamente $f$ e $g$ sono date da formule e i domini vanno determinati.</p>

<p>Nel diagramma la composizione è definita su tutto $X$ perché $\\text{Im}(g) \\subseteq V = \\text{Dom}(f)$: l'ellisse grigia è interamente contenuta in $V$. Se ciò non accade, si restringe il dominio di $g$ a $D = \\{x \\in X : g(x) \\in \\text{Dom}(f)\\}$.</p>`
          },
          {
            subtitle: "Esempio: $g(x) = x+1$ e $f(x) = \\sqrt{x}$",
            content: `<p>La funzione composta $f \\circ g$ è, formalmente,</p>
<p>$$(f \\circ g)(x) = f\\big(g(x)\\big) = f(x+1) = \\sqrt{x+1}.$$</p>
<p>Analizziamo domini e immagini:</p>
<ul>
  <li>$g: \\R \\to \\R$, con $\\text{Dom}(g) = \\R$ e $\\text{Im}(g) = \\R$;</li>
  <li>$f: [0, +\\infty) \\to [0, +\\infty)$, con $\\text{Dom}(f) = [0, +\\infty)$.</li>
</ul>
<p>La condizione del caso «globale» $\\text{Im}(g) \\subseteq \\text{Dom}(f)$ <strong>non</strong> è soddisfatta, perché $\\R \\not\\subseteq [0, +\\infty)$. Questo significa che non possiamo calcolare $f(g(x))$ per tutti gli $x$ nel dominio di $g$. Ad esempio, per $x = -5$ si ha $g(-5) = -4$, ma $f(g(-5)) = f(-4) = \\sqrt{-4}$ non è definita in $\\R$.</p>
<p>Siamo dunque nel caso generale: determiniamo il sottoinsieme</p>
<p>$$D = \\{\\, x \\in \\R : g(x) \\in \\text{Dom}(f) \\,\\} = \\{\\, x \\in \\R : x+1 \\ge 0 \\,\\} = [-1, +\\infty),$$</p>
<p>cioè l'insieme degli $x$ per cui l'argomento della radice è non negativo. Considerando la <em>restrizione</em> $g|_{D} : [-1,+\\infty) \\to \\R$ si ha ora</p>
<p>$$\\text{Im}\\big(g|_{D}\\big) = [0, +\\infty) \\subseteq \\text{Dom}(f),$$</p>
<p>e la composizione è ben definita. Concludiamo che</p>
<p>$$f \\circ g : [-1, +\\infty) \\to [0, +\\infty), \\qquad (f\\circ g)(x) = \\sqrt{x+1},$$</p>
<p>con $\\text{Dom}(f \\circ g) = [-1, +\\infty)$, in accordo con la convenzione del dominio naturale.</p>`
          },
          {
            subtitle: "La composizione non è commutativa",
            content: `<p>In generale $f \\circ g \\neq g \\circ f$: l'ordine in cui si applicano le funzioni conta. Con le funzioni dell'esempio precedente,</p>
<p>$$(f \\circ g)(x) = \\sqrt{x+1}, \\qquad (g \\circ f)(x) = g\\big(\\sqrt{x}\\big) = \\sqrt{x} + 1,$$</p>
<p>che sono funzioni diverse e con domini diversi: $[-1,+\\infty)$ la prima, $[0,+\\infty)$ la seconda.</p>`
          }
        ],
        formulas: [
          { label: "Funzione composta", latex: "(f \\circ g)(x) = f(g(x))" },
          { label: "Dominio naturale della composta", latex: "\\text{Dom}(f \\circ g) = \\{x \\in \\text{Dom}(g) : g(x) \\in \\text{Dom}(f)\\}" },
          { label: "Composta definita su tutto Dom(g)", latex: "\\text{Im}(g) \\subseteq \\text{Dom}(f)" }
        ]
      },

      {
        id: "s07-inversa",
        type: "section",
        title: "Funzione Inversa",
        icon: "↩️",
        content: `<p>Se una funzione è biettiva, possiamo «tornare indietro» dal codominio al dominio. Questa operazione è definita dalla funzione inversa.</p>`,
        subsections: [
          {
            subtitle: "Definizione",
            content: `<p>Sia $f: X \\to Y$ una funzione <strong>biettiva</strong>. Si definisce <strong>funzione inversa</strong> di $f$, e si indica con $f^{-1}$, la funzione</p>
<p>$$f^{-1}: Y \\to X$$</p>
<p>che associa a ogni elemento $y \\in Y$ l'unico elemento $x \\in X$ tale che $f(x) = y$:</p>
<p>$$f^{-1}(y) = x \\iff f(x) = y.$$</p>
<p>L'<strong>unicità</strong> di tale $x$ è garantita dall'iniettività di $f$, mentre l'<strong>esistenza</strong> di $x$ per ogni $y \\in Y$ è garantita dalla suriettività. Entrambe le ipotesi sono quindi indispensabili perché $f^{-1}$ sia una funzione ben definita su tutto $Y$.</p>`
          },
          {
            subtitle: "Composizione con l'inversa",
            content: `<p>Sia $f: X \\to Y$ biettiva e sia $f^{-1}: Y \\to X$ la sua inversa. Dalla definizione seguono due identità fondamentali, che si usano continuamente negli esercizi:</p>
<p>$$f^{-1}\\big(f(x)\\big) = x \\qquad \\text{per ogni } x \\in X,$$</p>
<p>$$f\\big(f^{-1}(y)\\big) = y \\qquad \\text{per ogni } y \\in Y.$$</p>
<p>In termini di composizione, indicando con $\\text{id}_X$ e $\\text{id}_Y$ le funzioni identità su $X$ e su $Y$:</p>
<p>$$f^{-1} \\circ f = \\text{id}_X, \\qquad f \\circ f^{-1} = \\text{id}_Y.$$</p>
<p>È importante osservare che i <strong>domini di validità sono diversi</strong>: la prima identità vale per gli $x$ del dominio $X$, la seconda per gli $y$ del codominio $Y$. Inoltre, se $X \\neq Y$, $f^{-1} \\circ f$ e $f \\circ f^{-1}$ sono due funzioni distinte (hanno dominio diverso), pur essendo entrambe «l'identità»; se invece $X = Y$ esse coincidono con la stessa funzione $\\text{id}_X$.</p>
<p><em>Verifica della prima identità:</em> posto $y = f(x)$, per definizione di inversa $f^{-1}(y)$ è l'unico elemento del dominio la cui immagine è $y$; ma $x$ è un tale elemento, dunque $f^{-1}(f(x)) = f^{-1}(y) = x$. La seconda si ottiene in modo analogo partendo da $x = f^{-1}(y)$ e applicando $f$.</p>`
          },
          {
            subtitle: "Notazione: $f^{-1}$ non è il reciproco",
            content: `<p>Il simbolo $f^{-1}$ indica la funzione inversa e <strong>non</strong> il reciproco $\\frac{1}{f}$: per esempio, se $f(x) = 2x+1$ allora $f^{-1}(x) = \\frac{x-1}{2}$, mentre $\\frac{1}{f(x)} = \\frac{1}{2x+1}$ è un'altra funzione.</p>`
          },
          {
            subtitle: "Esempio completo: inversa di $f(x) = 2x+1$",
            content: `<p><strong>Passo 1: verifichiamo che $f$ è biettiva.</strong> Il grafico di $f$ è una retta di coefficiente angolare $2 \\gt 0$, dunque $f$ è strettamente crescente e, per il teorema sulla monotonia, è <strong>iniettiva</strong>. La stretta crescenza, però, garantisce soltanto l'iniettività: occorre verificare separatamente la suriettività rispetto al codominio dichiarato $\\R$. Sia dunque $y \\in \\R$ arbitrario; il numero</p>
<p>$$x = \\frac{y-1}{2}$$</p>
<p>appartiene a $\\R$ e soddisfa</p>
<p>$$f(x) = 2\\left(\\frac{y-1}{2}\\right) + 1 = (y-1) + 1 = y.$$</p>
<p>Quindi ogni $y \\in \\R$ è immagine di un elemento del dominio: $f$ è <strong>suriettiva</strong>. Essendo iniettiva e suriettiva, $f$ è <strong>biettiva</strong> e dunque invertibile.</p>
<p><strong>Passo 2: calcoliamo l'inversa.</strong> Poniamo $y = f(x)$ e ricaviamo $x$ in funzione di $y$:</p>
<p>$$y = 2x + 1 \\ \\Rightarrow \\ y - 1 = 2x \\ \\Rightarrow \\ x = \\frac{y-1}{2}.$$</p>
<p>La funzione inversa è quindi</p>
<p>$$f^{-1}: \\R \\to \\R, \\qquad f^{-1}(y) = \\frac{y-1}{2}.$$</p>
<p>Se vogliamo scriverla usando la variabile $x$, come è consuetudine: $f^{-1}(x) = \\frac{x-1}{2}$.</p>
<p><strong>Passo 3: controllo.</strong> Verifichiamo le due identità:</p>
<p>$$f^{-1}\\big(f(x)\\big) = \\frac{(2x+1)-1}{2} = \\frac{2x}{2} = x, \\qquad f\\big(f^{-1}(y)\\big) = 2\\cdot\\frac{y-1}{2} + 1 = y.$$</p>
<p>Entrambe sono soddisfatte, quindi il calcolo è corretto.</p>`
          },
          {
            subtitle: "Grafico della funzione inversa",
            content: `<p>Il grafico della funzione inversa $f^{-1}$ è il <strong>simmetrico</strong> del grafico di $f$ rispetto alla bisettrice del primo e terzo quadrante, cioè la retta di equazione $y=x$.</p>
<p>Questo accade perché se un punto $(x_0, y_0)$ appartiene al grafico di $f$, significa che $y_0 = f(x_0)$. Per definizione di inversa, questo equivale a dire che $x_0 = f^{-1}(y_0)$, cioè che il punto $(y_0, x_0)$ appartiene al grafico di $f^{-1}$. I punti $(x_0, y_0)$ e $(y_0, x_0)$ sono simmetrici rispetto alla retta $y=x$: lo scambio delle coordinate è esattamente la riflessione rispetto a tale bisettrice.</p>

<p>Si può controllare la simmetria su un punto concreto: $f(1) = 3$, quindi $(1,3)$ sta sul grafico di $f$; corrispondentemente $f^{-1}(3) = \\frac{3-1}{2} = 1$, cioè $(3,1)$ sta sul grafico di $f^{-1}$.</p>`

        formulas: [
          { label: "Definizione di inversa", latex: "f^{-1}(y) = x \\iff f(x) = y" },
          { label: "Identità con l'inversa", latex: "f^{-1} \\circ f = \\text{id}_X, \\qquad f \\circ f^{-1} = \\text{id}_Y" },
          { label: "Simmetria dei grafici", latex: "(x_0,y_0) \\in \\text{graf}(f) \\iff (y_0,x_0) \\in \\text{graf}(f^{-1})" }
        ]
      },

      {
        id: "s07-note-riepilogo-criteri",
        type: "note_box",
        title: "Riepilogo dei criteri — schema di lavoro per gli esercizi",
        icon: "📋",
        content: `<ul>
  <li><strong>Suriettiva</strong> ($\\text{Im}(f) = Y$): fissato $y \\in Y$ arbitrario, si risolve $f(x) = y$ e si verifica che la soluzione appartenga a $X$.</li>
  <li><strong>Iniettiva</strong>: si parte da $f(x_1) = f(x_2)$ e si deduce $x_1 = x_2$; per negarla basta una coppia $x_1 \\neq x_2$ con la stessa immagine.</li>
  <li><strong>Monotonia stretta</strong> $\\Rightarrow$ iniettività (il viceversa è falso: si vedano $1/x$ e la funzione a tratti).</li>
  <li><strong>Biettiva</strong> = iniettiva <em>e</em> suriettiva: solo allora esiste $f^{-1}: Y \\to X$, con $f^{-1}\\circ f = \\text{id}_X$ e $f \\circ f^{-1} = \\text{id}_Y$.</li>
  <li><strong>Composizione</strong>: controllare sempre il dominio $D = \\{x : g(x) \\in \\text{Dom}(f)\\}$ prima di scrivere $(f\\circ g)(x)$.</li>
</ul>`
      },

      {
        id: "s07-ripasso-intro",
        type: "note_box",
        title: "Seconda parte — ripasso e approfondimento",
        icon: "🔁",
        content: `<p>Le sezioni che seguono riprendono le due operazioni appena introdotte — composizione e inversione — in chiave <strong>operativa</strong>. Le definizioni sono le stesse già viste sopra: qui l'accento è sul <em>metodo di calcolo</em> (determinazione del dominio di una composta, procedura di inversione, restrizione del dominio) e sugli esercizi svolti. Se le definizioni sono chiare, si possono leggere queste sezioni come una raccolta di esempi applicativi.</p>`
      },

      {
        id: "s07-comp-dominio",
        type: "section",
        title: "Composizione: dominio e condizione di componibilità",
        icon: "🧮",
        content: `<p>Molte funzioni complesse possono essere viste come il risultato della composizione di funzioni più semplici. Ad esempio $h(x) = \\sqrt{x+1}$ può essere pensata come una sequenza di due operazioni: prima si calcola $g(x) = x+1$ e poi si applica la radice quadrata al risultato, ovvero $f(z) = \\sqrt{z}$. In questo caso $h(x) = f(g(x))$.</p>
<p>La domanda cruciale è: <strong>quando è possibile comporre due funzioni?</strong></p>`,
        subsections: [
          {
            subtitle: "Condizione di componibilità (proposizione)",
            content: `<p>Affinché la composizione $f(g(x))$ abbia senso, l'output della prima funzione, $g(x)$, deve essere un input valido per la seconda funzione, $f$. In altre parole il valore $g(x)$ deve appartenere al dominio di $f$.</p>
<p>La funzione composta $f \\circ g$ è definita <strong>su tutto il dominio di $g$ se e solo se</strong> l'immagine di $g$ è contenuta nel dominio di $f$:</p>
<p>$$\\text{Im}(g) \\subseteq \\text{Dom}(f);$$</p>
<p>in caso contrario essa resta definita soltanto sugli $x$ per cui $g(x) \\in \\text{Dom}(f)$. In generale:</p>
<p>$$\\text{Dom}(f \\circ g) = \\{ x \\in \\text{Dom}(g) \\mid g(x) \\in \\text{Dom}(f) \\}$$</p>
<p><strong>Da ricordare:</strong> l'ordine di composizione è importante — $f \\circ g$ significa che si applica prima $g$ e poi $f$.</p>`
          },
          {
            subtitle: "Esempio: $h(x) = \\sqrt{x+1}$",
            content: `<p>Questa è la composizione di $g(x) = x+1$ e $f(z) = \\sqrt{z}$.</p>
<ul>
  <li>Il dominio di $g$ è tutto $\\R$.</li>
  <li>Il dominio di $f$ è $\\text{Dom}(f) = [0, +\\infty)$.</li>
</ul>
<p>Per definire $h(x) = f(g(x))$ dobbiamo assicurarci che l'output di $g$ sia nel dominio di $f$. Imponiamo quindi:</p>
<p>$$g(x) \\in \\text{Dom}(f) \\ \\Rightarrow \\ x+1 \\geq 0 \\ \\Rightarrow \\ x \\geq -1$$</p>
<p>Il dominio di $h(x)$ è quindi $[-1, +\\infty)$. Se provassimo a calcolare $h(-5)$, avremmo $g(-5) = -4$, e $f(-4) = \\sqrt{-4}$ non è definito in $\\R$.</p>`
          }
        ],
        formulas: [
          { label: "Condizione di componibilità globale", latex: "\\text{Im}(g) \\subseteq \\text{Dom}(f)" },
          { label: "Dominio della composta", latex: "\\text{Dom}(f \\circ g) = \\{x \\in \\text{Dom}(g) \\mid g(x) \\in \\text{Dom}(f)\\}" }
        ]
      },

      {
        id: "s07-es-dominio-composta",
        type: "esercizio_svolto",
        title: "Esercizio svolto — Dominio di una funzione composta",
        icon: "✎",
        source: "docente",
        content: `<p>Calcolare il dominio della funzione $h(x) = \\sqrt{x^2 - 4}$.</p>`,
        steps: [
          `<strong>Scomposizione.</strong> La funzione è la composizione di $g(x) = x^2 - 4$ e $f(z) = \\sqrt{z}$, cioè $h = f \\circ g$.`,
          `<strong>Domini delle funzioni elementari.</strong> $\\text{Dom}(g) = \\R$ e $\\text{Dom}(f) = [0, +\\infty)$.`,
          `<strong>Condizione di componibilità.</strong> Poiché $\\text{Im}(g) = [-4, +\\infty) \\not\\subseteq [0, +\\infty)$, la composta non è definita su tutto $\\R$: ci restringiamo agli $x$ per cui $g(x)$ appartiene al dominio di $f$, cioè $$g(x) \\geq 0 \\ \\Rightarrow \\ x^2 - 4 \\geq 0.$$`,

      {
        id: "s07-oral-dominio",
        type: "oral_box",
        title: "Nota del Prof. — che cosa facevate già senza saperlo",
        icon: "🎤",
        content: `<blockquote><p>Quello che fate da sempre quando studiate il dominio di una funzione («l'argomento della radice deve essere maggiore o uguale a zero», «il denominatore diverso da zero», «l'argomento del logaritmo strettamente positivo») non è altro che verificare la condizione di componibilità tra le funzioni elementari che compongono la funzione data. Stiamo solo dando un nome formale a un procedimento che già conoscete.</p></blockquote>`
      },

      {
        id: "s07-inversa-calcolo",
        type: "section",
        title: "Funzione inversa: condizioni e calcolo",
        icon: "🔧",
        content: `<p>L'idea di funzione inversa nasce dalla necessità di «tornare indietro». Se una funzione $f$ associa a un input $x$ un output $y$, la sua funzione inversa $f^{-1}$ farà il percorso contrario: assocerà all'output $y$ l'input originale $x$.</p>`,
        subsections: [
          {
            subtitle: "Intuizione: la sbarra di metallo",
            content: `<p>Immaginiamo una sbarra di metallo dove la temperatura non è uniforme. Possiamo definire una funzione $T(p)$ che associa a ogni punto $p$ della sbarra la sua temperatura. La funzione inversa $T^{-1}(t)$ risponderebbe alla domanda: «in quale punto $p$ della sbarra si registra la temperatura $t$?».</p>
<p>Affinché questa sia una funzione ben definita, per ogni valore di temperatura deve esistere uno e un solo punto corrispondente. Questo significa che la funzione originale $T(p)$ deve essere <strong>biettiva</strong>.</p>`
          },
          {
            subtitle: "La biettività è necessaria e sufficiente",
            content: `<p>Data una funzione <strong>biettiva</strong> $f: X \\to Y$, si definisce <strong>funzione inversa</strong> $f^{-1}: Y \\to X$ la funzione che associa a ogni $y \\in Y$ l'unico $x \\in X$ tale che $f(x) = y$.</p>
<p>La biettività di $f$ è condizione <strong>necessaria e sufficiente</strong> per l'esistenza dell'inversa:</p>
<ul>
  <li>la <strong>suriettività</strong> garantisce che per ogni $y \\in Y$ esista <em>almeno</em> un $x \\in X$ tale che $f(x)=y$;</li>
  <li>l'<strong>iniettività</strong> garantisce che per ogni $y \\in Y$ esista <em>al più</em> un $x \\in X$ tale che $f(x)=y$.</li>
</ul>
<p>Insieme, garantiscono che per ogni $y \\in Y$ esista <em>uno e un solo</em> $x \\in X$ corrispondente. Dalla definizione seguono immediatamente:</p>
<p>$$(f^{-1} \\circ f)(x) = f^{-1}(f(x)) = x \\quad \\forall x \\in X,$$</p>
<p>$$(f \\circ f^{-1})(y) = f(f^{-1}(y)) = y \\quad \\forall y \\in Y.$$</p>`
          },
          {
            subtitle: "Procedura di calcolo",
            content: `<p>Per calcolare l'espressione analitica della funzione inversa si pone $y = f(x)$ e si risolve l'equazione rispetto a $x$, esprimendo $x$ in funzione di $y$.</p>`
          }
        ]
      },

      {
        id: "s07-es-inversa-lineare",
        type: "esercizio_svolto",
        title: "Esercizio svolto — Inversa di una funzione lineare",
        icon: "✎",
        source: "docente",
        content: `<p>Data la funzione $f: \\R \\to \\R$ definita da $f(x) = 2x+1$, calcolare la sua inversa.</p>`,
        steps: [
          `<strong>Verifica della biettività.</strong> La funzione è una retta con pendenza non nulla, quindi è strettamente monotona (crescente) e di conseguenza iniettiva. La sua immagine è $\\text{Im}(f) = \\R$ (ogni $y$ si ottiene da $x = (y-1)/2$) e coincide con il codominio, quindi è suriettiva. Essendo biettiva, ammette inversa.`,
          `<strong>Calcolo.</strong> Poniamo $y = f(x)$ e ricaviamo $x$: $$\\begin{align*} y &= 2x + 1 \\\\ y - 1 &= 2x \\\\ x &= \\frac{y-1}{2} \\end{align*}$$`,
          `<strong>Conclusione.</strong> L'espressione della funzione inversa è $f^{-1}(y) = \\frac{y-1}{2}$. Per convenzione si usa la lettera $x$ per la variabile indipendente, quindi si scrive $f^{-1}(x) = \\frac{x-1}{2}$.`
        ]
      },

      {
        id: "s07-es-inversa-quadratica",
        type: "esercizio_svolto",
        title: "Esercizio svolto — Inversa di una funzione quadratica",
        icon: "✎",
        source: "docente",
        content: `<p>Data la funzione $f(x) = x^2$, trovare la sua inversa.</p>`,
        steps: [
          `<strong>Analisi di biettività.</strong> La funzione $f: \\R \\to \\R$ non è né iniettiva (ad esempio $f(-1)=f(1)=1$) né suriettiva (l'immagine è $[0, +\\infty)$, non $\\R$). Per renderla invertibile dobbiamo restringere dominio e codominio.`,
          `<strong>Restrizione.</strong> Scegliamo di restringere la funzione a $f: [0, +\\infty) \\to [0, +\\infty)$. In questo nuovo dominio la funzione è strettamente crescente, quindi iniettiva; il codominio coincide con l'immagine, quindi è suriettiva. Ora la funzione è biettiva.`,
          `<strong>Calcolo.</strong> Poniamo $y = x^2$ e ricaviamo $x$: $$x = \\pm \\sqrt{y}.$$ Poiché abbiamo ristretto il dominio a $x \\geq 0$, dobbiamo scegliere la soluzione non negativa: $x = \\sqrt{y}$ (per $y = 0$ si ottiene $x = 0$).`,
          `<strong>Conclusione.</strong> L'inversa della funzione $f(x)=x^2$ ristretta è $f^{-1}(y) = \\sqrt{y}$, ovvero $f^{-1}(x) = \\sqrt{x}$, con $f^{-1}: [0,+\\infty) \\to [0,+\\infty)$.`
        ]
      },

      {
        id: "s07-restrizione-trigonometriche",
        type: "note_box",
        title: "Invertibilità locale e funzioni non monotone",
        icon: "🌀",
        content: `<p>La procedura di <strong>restrizione del dominio</strong> è una tecnica standard per invertire funzioni che non sono globalmente iniettive: si sceglie un intervallo in cui la funzione è strettamente monotona e si definisce un'inversa per quella restrizione.</p>
<p>È ciò che si fa per le funzioni trigonometriche. La funzione $\\sin(x)$, essendo periodica, non è iniettiva su $\\R$. Consideriamo allora la <strong>restrizione</strong></p>
<p>$$\\sin : \\left[-\\frac{\\pi}{2}, \\frac{\\pi}{2}\\right] \\to [-1, 1].$$</p>
<p>Su questo intervallo $\\sin$ è strettamente crescente, dunque <strong>iniettiva</strong>; inoltre, avendo scelto come codominio proprio $[-1,1]$, che coincide con l'immagine della restrizione, essa è anche <strong>suriettiva</strong>. Attenzione a questo punto: la stretta crescenza dà solo l'iniettività, la suriettività richiede la scelta del codominio giusto. La restrizione è quindi biettiva e ammette inversa</p>
<p>$$\\arcsin : [-1, 1] \\to \\left[-\\frac{\\pi}{2}, \\frac{\\pi}{2}\\right].$$</p>
<p>Il punto da memorizzare: non si inverte «$\\sin$», si inverte <em>una restrizione</em> di $\\sin$ con un codominio fissato.</p>`
      },

      {
        id: "s07-grafico-inversa",
        type: "section",
        title: "Grafico della funzione inversa: la simmetria rispetto a $y=x$",
        icon: "🪞",
        content: `<p>Esiste un'importante relazione geometrica tra il grafico di una funzione e quello della sua inversa. Se un punto $(x_0, y_0)$ appartiene al grafico di $f$, significa che $y_0 = f(x_0)$. Per definizione di inversa questo implica $x_0 = f^{-1}(y_0)$, cioè che il punto $(y_0, x_0)$ appartiene al grafico di $f^{-1}$.</p>
<p><strong>Proposizione (simmetria dei grafici).</strong> Il grafico della funzione inversa $f^{-1}$ è il simmetrico del grafico della funzione $f$ rispetto alla retta $y=x$ (la bisettrice del primo e terzo quadrante).</p>`,
        subsections: [
          {
            subtitle: "Esempio 1: $f(x) = x^2$ (per $x \\geq 0$) e $f^{-1}(x) = \\sqrt{x}$",
            content: `<p>I due grafici sono simmetrici rispetto a $y=x$: il punto $(2,4)$ sul grafico di $f$ corrisponde al punto $(4,2)$ sul grafico di $f^{-1}$, mentre $(1,1)$ sta sulla bisettrice e resta fisso.</p>

      {
        id: "s07-conclusioni",
        type: "alert_box",
        title: "Conclusioni — i concetti chiave da ricordare",
        icon: "🔑",
        content: `<ul>
  <li>La <strong>composizione</strong> $f(g(x))$ è definita sull'insieme $D = \\{x \\in \\text{Dom}(g) : g(x) \\in \\text{Dom}(f)\\}$; è definita su <em>tutto</em> $\\text{Dom}(g)$ se e solo se $\\text{Im}(g) \\subseteq \\text{Dom}(f)$. Non confondere le due affermazioni: l'inclusione $\\text{Im}(g) \\subseteq \\text{Dom}(f)$ non è una condizione di esistenza della composta, ma la condizione perché nessun punto del dominio di $g$ venga escluso.</li>
  <li>La <strong>funzione inversa</strong> $f^{-1}: Y \\to X$ esiste se e solo se $f: X \\to Y$ è <strong>biettiva</strong>: l'iniettività dà l'unicità, la suriettività l'esistenza.</li>
  <li>Per calcolare l'inversa si esplicita la $x$ dall'equazione $y=f(x)$, dopo aver verificato la biettività (eventualmente restringendo dominio e codominio).</li>
  <li>Il <strong>grafico</strong> di $f^{-1}$ è il simmetrico del grafico di $f$ rispetto alla retta $y=x$.</li>
</ul>`

      {
        id: "s07-ex-teoria-1",
        type: "esercizio",
        title: "Teoria 1 — Suriettività e iniettività con i quantificatori",
        kind: "teoria",
        source: "integrazione",
        content: `<p>Sia $f: X \\to Y$. Dare la definizione di funzione suriettiva e di funzione iniettiva, scrivendole con i quantificatori, e spiegare con l'esempio di $f(x) = x^2$ perché la suriettività non è una proprietà della sola legge $f(x)$.</p>`,
        solution: `<p><strong>Suriettività.</strong> $f$ è suriettiva se $\\text{Im}(f) = Y$, ovvero</p>
<p>$$\\forall y \\in Y \\ \\exists x \\in X : f(x) = y$$</p>
<p>(su ogni $y$ del codominio arriva <em>almeno</em> un elemento del dominio).</p>
<p><strong>Iniettività.</strong> $f$ è iniettiva se</p>
<p>$$\\forall x_1, x_2 \\in X, \\quad f(x_1) = f(x_2) \\Rightarrow x_1 = x_2,$$</p>
<p>equivalentemente, in forma contronominale, $x_1 \\neq x_2 \\Rightarrow f(x_1) \\neq f(x_2)$; cioè per ogni $y \\in Y$ esiste <em>al più</em> un $x \\in X$ con $f(x) = y$.</p>
<p><strong>Lettura grafica.</strong> Suriettiva se ogni retta $y = c$ con $c \\in Y$ taglia il grafico almeno una volta; iniettiva se ogni retta orizzontale lo taglia al più una volta.</p>
<p><strong>L'esempio.</strong> $f: \\R \\to \\R$, $f(x) = x^2$ <em>non</em> è suriettiva, perché $\\text{Im}(f) = [0, +\\infty) \\neq \\R$: per $y = -1$ l'equazione $x^2 = -1$ non ha soluzioni reali. La <strong>stessa legge</strong>, vista come $f: \\R \\to [0, +\\infty)$, è suriettiva: dato $y \\ge 0$ basta prendere $x = \\sqrt{y} \\in \\R$ e si ha $f(\\sqrt{y}) = y$.</p>
<p>Dunque la suriettività dipende dalla <strong>terna</strong> (dominio, codominio, legge) e non dalla sola formula. Analogamente l'iniettività dipende dal dominio: $f(x) = x^2$ non è iniettiva su $\\R$ (perché $f(2) = f(-2) = 4$) ma lo è su $[0, +\\infty)$, e $f: [0,+\\infty) \\to [0,+\\infty)$ risulta biettiva.</p>`
      },

      {
        id: "s07-ex-teoria-2",
        type: "esercizio",
        title: "Teoria 2 — Composta e condizione di componibilità",
        kind: "teoria",
        source: "integrazione",
        content: `<p>Enuncia la definizione di funzione composta $f \\circ g$ e la condizione di componibilità. Spiega perché $\\text{Dom}(f \\circ g) = \\{x \\in \\text{Dom}(g) \\mid g(x) \\in \\text{Dom}(f)\\}$ e applica la definizione a $f(z) = \\ln z$, $g(x) = x - 3$.</p>`,
        solution: `<p><strong>Definizione.</strong> Date $g$ e $f$ funzioni reali, la composta $f \\circ g$ è definita da $(f \\circ g)(x) = f(g(x))$ per ogni $x$ del dominio di $g$ tale che $g(x)$ appartenga al dominio di $f$.</p>
<p><strong>Perché quel dominio.</strong> Per poter applicare $f$ al numero $g(x)$ occorre che $g(x)$ sia un input ammissibile per $f$, cioè $g(x) \\in \\text{Dom}(f)$. Da qui</p>
<p>$$\\text{Dom}(f \\circ g) = \\{x \\in \\text{Dom}(g) \\mid g(x) \\in \\text{Dom}(f)\\}.$$</p>
<p>In particolare $f \\circ g$ è definita su <em>tutto</em> $\\text{Dom}(g)$ se e solo se $\\text{Im}(g) \\subseteq \\text{Dom}(f)$; se questa inclusione non vale, la composta è definita solo su un sottoinsieme proprio di $\\text{Dom}(g)$.</p>
<p><strong>Applicazione.</strong> $g(x) = x-3$ ha $\\text{Dom}(g) = \\R$ e $\\text{Im}(g) = \\R$, mentre $f(z) = \\ln z$ ha $\\text{Dom}(f) = (0, +\\infty)$. Poiché $\\R \\not\\subseteq (0,+\\infty)$, imponiamo $g(x) \\in \\text{Dom}(f)$:</p>
<p>$$x - 3 \\gt 0 \\quad \\Rightarrow \\quad x \\gt 3.$$</p>
<p>Dunque $(f \\circ g)(x) = \\ln(x-3)$ con $\\text{Dom}(f \\circ g) = (3, +\\infty)$.</p>
<p><strong>L'ordine conta:</strong> $(g \\circ f)(x) = \\ln x - 3$ ha dominio $(0, +\\infty)$, diverso dal precedente.</p>`
      },

      {
        id: "s07-ex-teoria-3",
        type: "esercizio",
        title: "Teoria 3 — Monotonia stretta e iniettività",
        kind: "teoria",
        source: "integrazione",
        content: `<p>Enunciare e dimostrare il teorema che lega la monotonia stretta all'iniettività. Vale il viceversa? Il teorema permette di concludere la biettività?</p>`,
        solution: `<p><strong>Teorema.</strong> Se $f: X \\to \\R$, con $X \\subseteq \\R$, è strettamente monotona su $X$, allora $f$ è iniettiva su $X$.</p>
<p><strong>Dimostrazione.</strong> Usiamo la forma contronominale: siano $x_1, x_2 \\in X$ con $x_1 \\neq x_2$; poiché $\\R$ è totalmente ordinato, vale $x_1 \\lt x_2$ oppure $x_2 \\lt x_1$.</p>
<p>Se $f$ è strettamente crescente, nel primo caso $f(x_1) \\lt f(x_2)$ e nel secondo $f(x_2) \\lt f(x_1)$; se $f$ è strettamente decrescente, nel primo caso $f(x_1) \\gt f(x_2)$ e nel secondo $f(x_2) \\gt f(x_1)$. In ogni caso la disuguaglianza è stretta, dunque $f(x_1) \\neq f(x_2)$: $f$ è iniettiva. $\\square$</p>
<p><strong>Il viceversa è falso.</strong> $f(x) = \\frac{1}{x}$ su $X = \\R \\setminus \\{0\\}$ è iniettiva (da $\\frac{1}{x_1} = \\frac{1}{x_2}$, moltiplicando per $x_1 x_2 \\neq 0$, si ottiene $x_2 = x_1$) ma non è monotona su $X$: con $x_1 = -1 \\lt x_2 = 1$ si ha $f(-1) = -1 \\lt 1 = f(1)$, che esclude la decrescenza, mentre con $1 \\lt 2$ si ha $f(1) = 1 \\gt \\frac{1}{2} = f(2)$, che esclude la crescenza (il dominio non è un intervallo).</p>
<p>Un altro controesempio è la funzione a tratti $f(x) = x$ su $[0,1]$ e $f(x) = -x+4$ su $(1,2]$: è iniettiva perché ogni ramo lo è e le immagini dei rami, $[0,1]$ e $[2,3)$, sono disgiunte, ma non è monotona.</p>
<p><strong>Biettività: no.</strong> Il teorema dà <em>solo</em> l'iniettività e non dice nulla sulla suriettività, che va verificata a parte rispetto al codominio dichiarato. Ad esempio $f: \\R \\to \\R$, $f(x) = e^x$, è strettamente crescente (quindi iniettiva) ma $\\text{Im}(f) = (0, +\\infty) \\neq \\R$, dunque non è biettiva.</p>`
      },

      {
        id: "s07-ex-teoria-4",
        type: "esercizio",
        title: "Teoria 4 — Biettività come condizione per l'inversa",
        kind: "teoria",
        source: "integrazione",
        content: `<p>Spiega perché la biettività è condizione necessaria e sufficiente per l'esistenza della funzione inversa, precisando il ruolo separato di iniettività e suriettività. Mostra con un esempio una funzione non invertibile e come si rimedia con una restrizione.</p>`,
        solution: `<p><strong>Il ruolo delle due proprietà.</strong> Sia $f: X \\to Y$. Per definire $f^{-1}: Y \\to X$ occorre associare a ogni $y \\in Y$ un unico $x \\in X$ con $f(x) = y$.</p>
<ul>
  <li>La <strong>suriettività</strong> garantisce che per ogni $y \\in Y$ esista <em>almeno</em> un tale $x$: quindi $f^{-1}$ è definita su tutto $Y$.</li>
  <li>L'<strong>iniettività</strong> garantisce che ne esista <em>al più</em> uno: quindi il valore $f^{-1}(y)$ è ben determinato, come richiede la definizione di funzione.</li>
</ul>
<p>Insieme danno esistenza e unicità, cioè la buona definizione di $f^{-1}$ (<em>sufficienza</em>).</p>
<p><strong>Necessità.</strong> Viceversa, se $f^{-1}: Y \\to X$ esiste, da $f^{-1}(f(x)) = x$ segue che $f$ è iniettiva e da $f(f^{-1}(y)) = y$ segue che $f$ è suriettiva.</p>
<p><strong>Esempio di funzione non invertibile.</strong> $f: \\R \\to \\R$, $f(x) = x^2$, non è iniettiva ($f(-1) = f(1) = 1$, quindi a $y=1$ corrisponderebbero due valori) né suriettiva ($\\text{Im}(f) = [0, +\\infty)$, quindi per $y = -1$ non esisterebbe nessun valore).</p>
<p><strong>Rimedio con la restrizione.</strong> Restringendo a $f: [0, +\\infty) \\to [0, +\\infty)$ la funzione è strettamente crescente, dunque iniettiva, e il codominio coincide con l'immagine, dunque è suriettiva: ora è biettiva e $f^{-1}(x) = \\sqrt{x}$.</p>
<p>Allo stesso modo $\\sin x$, non iniettiva su $\\R$, ristretta a $\\left[-\\frac{\\pi}{2}, \\frac{\\pi}{2}\\right]$ con codominio $[-1,1]$ diventa biettiva, e la sua inversa è $\\arcsin : [-1,1] \\to \\left[-\\frac{\\pi}{2}, \\frac{\\pi}{2}\\right]$.</p>`
      },

      {
        id: "s07-ex-scritto-1",
        type: "esercizio",
        title: "Scritto 1 — Biettività e inversa di $f(x) = 3 - 2x$",
        kind: "scritto",
        source: "integrazione",
        content: `<p>Sia $f: \\R \\to \\R$, $f(x) = 3 - 2x$.</p>
<p>(a) Dimostrare con le definizioni che $f$ è biettiva.</p>
<p>(b) Determinare $f^{-1}$ e verificare le identità $f^{-1} \\circ f = \\text{id}_{\\R}$ e $f \\circ f^{-1} = \\text{id}_{\\R}$.</p>`,
        solution: `<p><strong>(a) Iniettività.</strong> Supponiamo $f(x_1) = f(x_2)$, cioè $3 - 2x_1 = 3 - 2x_2$. Sottraendo $3$: $-2x_1 = -2x_2$ e dividendo per $-2 \\neq 0$ si ottiene $x_1 = x_2$. Dunque $f$ è iniettiva.</p>
<p><em>In alternativa:</em> il coefficiente angolare è $-2 \\lt 0$, quindi $f$ è strettamente decrescente e, per il teorema sulla monotonia, iniettiva.</p>
<p><strong>(a) Suriettività.</strong> Sia $y \\in \\R$ arbitrario. Poniamo $x = \\frac{3-y}{2} \\in \\R$; allora</p>
<p>$$f(x) = 3 - 2 \\cdot \\frac{3-y}{2} = 3 - (3-y) = y.$$</p>
<p>Quindi ogni $y$ del codominio è immagine di un punto del dominio: $f$ è suriettiva. Essendo iniettiva e suriettiva, $f$ è biettiva, dunque invertibile.</p>
<p><strong>(b) Calcolo dell'inversa.</strong> Da $y = 3 - 2x$ si ricava</p>
<p>$$\\begin{align*} 2x &= 3 - y \\\\ x &= \\frac{3-y}{2} \\end{align*}$$</p>
<p>Quindi $f^{-1}: \\R \\to \\R$, $f^{-1}(x) = \\frac{3-x}{2}$.</p>
<p><strong>(b) Verifica.</strong></p>
<p>$$\\begin{align*} f^{-1}(f(x)) &= \\frac{3 - (3-2x)}{2} = \\frac{2x}{2} = x \\quad \\forall x \\in \\R, \\\\ f(f^{-1}(y)) &= 3 - 2\\cdot\\frac{3-y}{2} = 3 - (3-y) = y \\quad \\forall y \\in \\R. \\end{align*}$$</p>
<p>I due grafici sono simmetrici rispetto a $y = x$ e si intersecano in $(1,1)$, poiché $f(1) = 1$.</p>

      {
        id: "s07-ex-scritto-2",
        type: "esercizio",
        title: "Scritto 2 — Dominio di $h(x) = \\sqrt{9 - x^2}$",
        kind: "scritto",
        source: "integrazione",
        content: `<p>Determina il dominio di $h(x) = \\sqrt{9 - x^2}$, scrivendola come composizione di due funzioni elementari e usando la condizione di componibilità.</p>`,
        solution: `<p><strong>Scomposizione.</strong> Scriviamo $h = f \\circ g$ con $g(x) = 9 - x^2$ e $f(z) = \\sqrt{z}$, così che $h(x) = f(g(x))$.</p>
<p><strong>Domini e immagini.</strong> Si ha $\\text{Dom}(g) = \\R$, $\\text{Im}(g) = (-\\infty, 9]$ e $\\text{Dom}(f) = [0, +\\infty)$.</p>
<p><strong>Condizione di componibilità.</strong> Poiché $\\text{Im}(g) \\not\\subseteq \\text{Dom}(f)$, la composta non è definita su tutto $\\R$: imponiamo la condizione puntuale $g(x) \\in \\text{Dom}(f)$, cioè</p>
<p>$$\\begin{align*} 9 - x^2 &\\geq 0 \\\\ x^2 &\\leq 9 \\\\ -3 \\leq x &\\leq 3 \\end{align*}$$</p>
<p><strong>Conclusione.</strong> $\\text{Dom}(h) = [-3, 3]$; su tale insieme $0 \\leq h(x) \\leq 3$, con $h(\\pm 3) = 0$ e massimo $h(0) = 3$.</p>

      {
        id: "s07-ex-scritto-3",
        type: "esercizio",
        title: "Scritto 3 — Restrizione biettiva di $f(x) = x^2 - 4x + 3$",
        kind: "scritto",
        source: "integrazione",
        content: `<p>Sia $f(x) = x^2 - 4x + 3$.</p>
<p>(a) Stabilire se $f: \\R \\to \\R$ è iniettiva e se è suriettiva.</p>
<p>(b) Mostrare che la restrizione $f: [2, +\\infty) \\to [-1, +\\infty)$ è biettiva e calcolarne l'inversa.</p>`,
        solution: `<p><strong>Forma di vertice.</strong> Conviene scrivere $f(x) = x^2 - 4x + 3 = (x-2)^2 - 1$.</p>
<p><strong>(a) Non è iniettiva.</strong> $f(1) = 1 - 4 + 3 = 0$ e $f(3) = 9 - 12 + 3 = 0$, quindi $f(1) = f(3)$ con $1 \\neq 3$ (la retta $y = 0$ taglia la parabola in due punti).</p>
<p><strong>(a) Non è suriettiva.</strong> Poiché $(x-2)^2 \\ge 0$ si ha $f(x) \\ge -1$ per ogni $x$, dunque $\\text{Im}(f) = [-1, +\\infty) \\neq \\R$. Per esempio $y = -2$ non è assunto, perché $(x-2)^2 - 1 = -2$ darebbe $(x-2)^2 = -1$, impossibile in $\\R$.</p>
<p><strong>(b) Iniettività della restrizione.</strong> Siano $2 \\le x_1 \\lt x_2$. Allora $0 \\le x_1 - 2 \\lt x_2 - 2$ e, elevando al quadrato due numeri non negativi, $(x_1-2)^2 \\lt (x_2-2)^2$, cioè $f(x_1) \\lt f(x_2)$: la restrizione è strettamente crescente su $[2,+\\infty)$ e quindi iniettiva per il teorema sulla monotonia.</p>
<p><strong>(b) Suriettività su $[-1,+\\infty)$.</strong> Sia $y \\ge -1$. Risolviamo $f(x) = y$:</p>
<p>$$\\begin{align*} (x-2)^2 - 1 &= y \\\\ (x-2)^2 &= y+1 \\quad (\\text{con } y+1 \\ge 0) \\\\ x &= 2 \\pm \\sqrt{y+1} \\end{align*}$$</p>
<p>La soluzione $x = 2 + \\sqrt{y+1}$ soddisfa $x \\ge 2$, quindi appartiene al dominio ristretto, e $f(2+\\sqrt{y+1}) = (\\sqrt{y+1})^2 - 1 = y$. Dunque la restrizione è suriettiva, e perciò biettiva.</p>
<p><strong>(b) Inversa.</strong> $f^{-1}: [-1, +\\infty) \\to [2, +\\infty)$, $f^{-1}(x) = 2 + \\sqrt{x+1}$.</p>
<p><strong>Controllo.</strong></p>
<p>$$\\begin{align*} f^{-1}(f(x)) &= 2 + \\sqrt{(x-2)^2 - 1 + 1} = 2 + |x-2| = 2 + (x-2) = x \\quad (x \\ge 2), \\\\ f(f^{-1}(y)) &= \\left(2+\\sqrt{y+1}-2\\right)^2 - 1 = (y+1) - 1 = y \\quad (y \\ge -1). \\end{align*}$$</p>

        title: "Scritto 4 — Omografica: dominio, immagine e inversa",
        kind: "scritto",
        source: "integrazione",
        content: `<p>Data $f(x) = \\dfrac{3x - 2}{x + 1}$, determina dominio e immagine, verifica che è iniettiva e calcola $f^{-1}$, precisando dominio e immagine dell'inversa.</p>`,
        solution: `<p><strong>1. Dominio.</strong> Deve essere $x + 1 \\neq 0$, quindi</p>
<p>$$\\text{Dom}(f) = \\R \\setminus \\{-1\\}.$$</p>
<p><strong>2. Risoluzione dell'equazione $f(x) = y$.</strong> Per studiare insieme iniettività e immagine ricaviamo $x$ da $y = \\dfrac{3x-2}{x+1}$. Moltiplicando per $x+1 \\neq 0$:</p>
<p>$$\\begin{align*} y(x+1) &= 3x - 2 \\\\ yx + y &= 3x - 2 \\\\ yx - 3x &= -y - 2 \\\\ x(y - 3) &= -y - 2 \\end{align*}$$</p>
<p><strong>3. Immagine — discussione dei due casi.</strong></p>
<p><em>Caso $y = 3$.</em> L'equazione diventa $0 = -5$, impossibile: dunque $3 \\notin \\text{Im}(f)$.</p>
<p><em>Caso $y \\neq 3$.</em> Si ha l'unica soluzione</p>
<p>$$x = \\frac{-y-2}{y-3} = \\frac{y+2}{3-y},$$</p>
<p>che è <strong>accettabile</strong>, cioè appartiene a $\\R \\setminus \\{-1\\}$: se fosse $\\dfrac{y+2}{3-y} = -1$ avremmo $y + 2 = y - 3$, cioè $2 = -3$, assurdo.</p>
<p>Quindi $\\text{Im}(f) = \\R \\setminus \\{3\\}$.</p>
<p><strong>4. Iniettività.</strong> Per ogni $y \\neq 3$ l'equazione $f(x) = y$ ha <em>esattamente una</em> soluzione $x \\in \\R\\setminus\\{-1\\}$: questo è precisamente l'enunciato dell'iniettività (al più una controimmagine per ogni $y$), unito alla suriettività su $\\R\\setminus\\{3\\}$. Dunque</p>
<p>$$f: \\R\\setminus\\{-1\\} \\to \\R\\setminus\\{3\\} \\quad \\text{è biettiva.}$$</p>
<p><strong>5. Inversa.</strong> Rinominando la variabile:</p>
<p>$$f^{-1}(x) = \\frac{x+2}{3-x}, \\qquad \\text{Dom}(f^{-1}) = \\R\\setminus\\{3\\}, \\qquad \\text{Im}(f^{-1}) = \\R\\setminus\\{-1\\}.$$</p>
<p><strong>6. Verifica.</strong> Su un punto concreto: $f(0) = \\dfrac{-2}{1} = -2$ e $f^{-1}(-2) = \\dfrac{0}{5} = 0$. In generale, per ogni $x \\neq -1$:</p>
<p>$$\\begin{align*} f^{-1}(f(x)) &= \\frac{\\dfrac{3x-2}{x+1} + 2}{\\,3 - \\dfrac{3x-2}{x+1}\\,} \\\\[6pt] &= \\frac{\\dfrac{(3x-2) + 2(x+1)}{x+1}}{\\dfrac{3(x+1) - (3x-2)}{x+1}} \\\\[6pt] &= \\frac{\\dfrac{3x-2+2x+2}{x+1}}{\\dfrac{3x+3-3x+2}{x+1}} \\\\[6pt] &= \\frac{5x}{5} = x. \\end{align*}$$</p>`
