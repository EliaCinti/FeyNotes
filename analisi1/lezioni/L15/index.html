<p><strong>2.</strong> Esiste $M \\gt 0$ tale che per ogni $n \\in \\mathbb{N}$: $\\;|a_n| \\le M$.</p>

<p>$$M' = \\max\\{1, |m|, |M|\\},$$</p>
<p>per vedere che la successione è anche compresa tra $-M'$ e $M'$.</p>
<p><strong>L'inserimento del valore $1$ nel massimo non è un dettaglio superfluo</strong>: serve a garantire $M' \\gt 0$, come richiesto dalla prima definizione. Se infatti scegliessimo $M' = \\max\\{|m|, |M|\\}$, nel caso degenere $m = M = 0$ (successione identicamente nulla) otterremmo $M' = 0$, che non soddisfa letteralmente la condizione di stretta positività.</p>
<p>Viceversa, la prima definizione è un caso particolare della terza, con $m = -M$.</p>
<p>In sostanza: <strong>una successione è limitata se l'insieme dei suoi valori è un sottoinsieme limitato di $\\mathbb{R}$.</strong></p>`

          {
            subtitle: "Proposizione: ogni successione convergente è limitata",
            content: `<p>L'idea intuitiva è che una successione non limitata deve avere termini che "scappano" verso $+\\infty$ o $-\\infty$, e quindi non può convergere a un valore finito. Formalizziamo.</p>
<p>Sia $(a_n)$ convergente, cioè esiste il limite finito $\\lim_{n \\to +\\infty} a_n = L$ con $L \\in \\mathbb{R}$. Per definizione di limite, scelto un qualunque $\\varepsilon \\gt 0$ (fissiamo $\\varepsilon = 1$), esiste $n_0 \\in \\mathbb{N}$ tale che per ogni $n \\ge n_0$:</p>
<p>$$|a_n - L| \\lt 1 \\;\\Rightarrow\\; L - 1 \\lt a_n \\lt L + 1.$$</p>
<p>Questo dice che la <strong>coda</strong> della successione, cioè tutti i termini dall'indice $n_0$ in poi, è limitata, perché contenuta nell'intervallo $(L-1, L+1)$.</p>
<p>Restano da considerare i primi termini, cioè l'insieme $\\{a_0, a_1, \\dots, a_{n_0-1}\\}$: è un insieme <strong>finito</strong> di numeri reali e, come tale, è necessariamente limitato.</p>
<p>Per trovare un limite inferiore e superiore validi per <em>tutti</em> i termini, definiamo</p>
<p>$$M_{sup} = \\max\\{a_0, a_1, \\dots, a_{n_0-1}, L+1\\}, \\qquad M_{inf} = \\min\\{a_0, a_1, \\dots, a_{n_0-1}, L-1\\}.$$</p>
<p>Per costruzione, per ogni $n \\in \\mathbb{N}$ vale $M_{inf} \\le a_n \\le M_{sup}$: la successione è limitata nel senso della terza definizione, e quindi — per l'equivalenza vista sopra — anche nel senso delle altre due.</p>`
          },
          {
            subtitle: "Il viceversa è FALSO: controesempio $a_n = (-1)^n$",
            content: `<p><strong>Attenzione: una successione limitata non è necessariamente convergente.</strong></p>
<p>Consideriamo $a_n = (-1)^n$, i cui termini sono $1, -1, 1, -1, \\dots$. È chiaramente limitata, poiché i valori sono compresi in $[-1, 1]$.</p>
<p>Tuttavia non è convergente. Dimostriamolo <strong>per assurdo</strong>: supponiamo che esista $L \\in \\mathbb{R}$ con $\\lim_{n \\to +\\infty} (-1)^n = L$. Scegliamo $\\varepsilon = \\frac{1}{2}$: dovrebbe esistere $n_0 \\in \\mathbb{N}$ tale che per ogni $n \\ge n_0$</p>
<p>$$|a_n - L| \\lt \\frac{1}{2},$$</p>
<p>cioè tutti i termini da $n_0$ in poi dovrebbero stare nell'intorno $\\left(L - \\frac{1}{2}, L + \\frac{1}{2}\\right)$, che ha ampiezza $1$.</p>
<p>Ma per quanto grande sia $n_0$, troveremo sempre indici $n \\gt n_0$ sia pari che dispari: quindi sia il valore $1$ sia il valore $-1$ dovrebbero appartenere a questo intorno. Allora la distanza tra $1$ e $-1$ dovrebbe essere minore dell'ampiezza dell'intorno:</p>
<p>$$|1 - (-1)| \\lt 1 \\;\\Rightarrow\\; 2 \\lt 1,$$</p>
<p>palese contraddizione. L'ipotesi che il limite esista è falsa: $a_n = (-1)^n$ è limitata ma non convergente, è una successione <strong>irregolare</strong> (o oscillante).</p>`
          }
        ],
        formulas: [
          { label: "Limitata", latex: "\\exists M \\gt 0 : |a_n| \\le M \\quad \\forall n \\in \\mathbb{N}" },
          { label: "Costante dalla forma (3)", latex: "M' = \\max\\{1, |m|, |M|\\}" },
          { label: "Implicazione (non invertibile)", latex: "\\text{convergente} \\;\\Rightarrow\\; \\text{limitata}" }
        ],
        extra_content: `<p>Un altro esempio di successione limitata ma non convergente è $a_n = \\sin(n)$. La dimostrazione della sua non convergenza è più complessa e si basa sul fatto che i valori di $\\sin(n)$ sono <strong>densi</strong> nell'intervallo $[-1, 1]$, cioè si avvicinano arbitrariamente a ogni punto di tale intervallo senza mai stabilizzarsi. La dimostrazione completa verrà presentata nelle lezioni successive.</p>`
      },

            content: `<p>Sia $(a_n)$ una successione e $L \\in \\mathbb{R}$.</p>

<p>Diciamo che $a_n$ tende a $L$ <strong>per difetto</strong> (o da sinistra), e scriviamo $\\lim_{n \\to +\\infty} a_n = L^-$, se $\\lim_{n \\to +\\infty} a_n = L$ e, definitivamente, $a_n \\lt L$ (disuguaglianza <em>stretta</em>). Formalmente: $\\forall \\varepsilon \\gt 0, \\exists n_0 \\in \\mathbb{N}$ tale che $\\forall n \\ge n_0$, $\\;L - \\varepsilon \\lt a_n \\lt L$.</p>
<p>Un caso particolarmente importante è $L = 0$: scriveremo $0^+$ per un limite nullo per eccesso (la successione è definitivamente <em>strettamente</em> positiva) e $0^-$ per un limite nullo per difetto (definitivamente <em>strettamente</em> negativa).</p>`

        solution: `<p><strong>Le tre condizioni</strong> per $(a_n)$ sono:</p>
<p>(1) esiste $M \\gt 0$ tale che $-M \\le a_n \\le M$ per ogni $n \\in \\mathbb{N}$;<br>
(2) esiste $M \\gt 0$ tale che $|a_n| \\le M$ per ogni $n$;<br>
(3) esistono $m, M \\in \\mathbb{R}$ tali che $m \\le a_n \\le M$ per ogni $n$.</p>

<p>$$M' = \\max\\{1, |m|, |M|\\}.$$</p>
<p>Anzitutto $M' \\ge 1 \\gt 0$, dunque $M'$ è ammissibile come costante della condizione (1). Inoltre valgono le due catene</p>
<p>$$a_n \\le M \\le |M| \\le M', \\qquad a_n \\ge m \\ge -|m| \\ge -M',$$</p>
<p>e quindi, mettendole insieme,</p>
<p>$$-M' \\le a_n \\le M' \\quad \\text{per ogni } n \\in \\mathbb{N}.$$</p>

<p><strong>Viceversa (1) $\\Rightarrow$ (3)</strong> è banale: basta prendere $m = -M$ e $M = M$.</p>`

        source: "integrazione",
        content: `<p>Dimostra, usando solo la definizione di limite, il punto 1 del teorema del confronto per limiti infiniti: se $a_n \\le b_n$ definitivamente e $\\lim_{n\\to+\\infty} a_n = +\\infty$, allora $\\lim_{n\\to+\\infty} b_n = +\\infty$.</p>`,
        solution: `<p>Sia $M \\gt 0$ arbitrario.</p>
<p>Poiché $\\lim_{n\\to+\\infty} a_n = +\\infty$, esiste $n_1 \\in \\mathbb{N}$ tale che $a_n \\gt M$ per ogni $n \\gt n_1$.</p>
<p>Poiché $a_n \\le b_n$ definitivamente, esiste $n_2 \\in \\mathbb{N}$ tale che $a_n \\le b_n$ per ogni $n \\gt n_2$.</p>
<p>Posto $n_0 = \\max\\{n_1, n_2\\}$, per ogni $n \\gt n_0$ valgono entrambe le disuguaglianze, quindi</p>
<p>$$b_n \\ge a_n \\gt M.$$</p>
<p>Dunque per ogni $M \\gt 0$ esiste $n_0$ tale che $b_n \\gt M$ per ogni $n \\gt n_0$, cioè $\\lim_{n\\to+\\infty} b_n = +\\infty$.</p>
<p>Si osservi che <strong>non serve alcuna maggiorazione dall'alto di $b_n$</strong>: a differenza del teorema dei due carabinieri, per i limiti infiniti basta il confronto da un solo lato.</p>`
      },

      {
        id: "s15-es-teoria-4",
        type: "esercizio",
        title: "Teoria 4",
        kind: "teoria",
        source: "integrazione",
        content: `<p>Spiega perché nella definizione di $a_n \\to 0^+$ si richiede la disuguaglianza <em>stretta</em> $a_n \\gt 0$ definitivamente, e perché la regola "numero non nullo fratto infinitesimo" richiede che il denominatore abbia segno definitivamente costante. Porta un esempio.</p>`,
        solution: `<p><strong>Perché la disuguaglianza stretta.</strong> Se si ammettessero disuguaglianze non strette, cioè $a_n \\ge 0$ definitivamente, la successione identicamente nulla $a_n = 0$ soddisferebbe contemporaneamente $a_n \\to 0^+$ e $a_n \\to 0^-$, ma $1/a_n$ non è nemmeno definito: le implicazioni "$b_n \\to 0^+ \\Rightarrow 1/b_n \\to +\\infty$" e "$b_n \\to 0^- \\Rightarrow 1/b_n \\to -\\infty$" perderebbero senso.</p>
<p>Con la convenzione stretta, invece, $b_n \\to 0^+$ garantisce $b_n \\gt 0$ definitivamente, quindi $b_n \\ne 0$ definitivamente e il reciproco è ben definito da un certo indice in poi.</p>
<p><strong>Perché serve il segno definitivamente costante.</strong> Se $b_n \\to 0$ ma il segno cambia infinite volte, non vale né $b_n \\to 0^+$ né $b_n \\to 0^-$ e la tabella non si applica. Ad esempio, con</p>
<p>$$a_n = 1, \\qquad b_n = \\frac{(-1)^n}{n},$$</p>
<p>si ha $a_n \\to 1 \\ne 0$ e $|b_n| = 1/n \\to 0$, ma</p>
<p>$$\\frac{a_n}{b_n} = (-1)^n n,$$</p>
<p>successione $-1, 2, -3, 4, \\dots$ che non ha limite: i termini di indice pari tendono a $+\\infty$, quelli di indice dispari a $-\\infty$. È irregolare e illimitata.</p>`
      },

      {
        id: "s15-es-scritto-1",
        type: "esercizio",
        title: "Scritto 1",
        kind: "scritto",
        source: "integrazione",
        content: `<p>Calcola $\\displaystyle\\lim_{n\\to+\\infty}\\frac{\\sin(n)+\\cos(n^3)}{n+1}$, giustificando ogni passaggio.</p>`,
        solution: `<p><strong>Perché non basta l'algebra dei limiti.</strong> Né $\\sin(n)$ né $\\cos(n^3)$ ammettono limite, quindi non possiamo applicare direttamente le regole su somme e quozienti.</p>
<p><strong>Impostazione.</strong> Poniamo</p>
<p>$$b_n = \\sin(n)+\\cos(n^3), \\qquad a_n = \\frac{1}{n+1}.$$</p>
<p><strong>Limitatezza di $b_n$.</strong> Per ogni $n$ vale $|\\sin(n)| \\le 1$ e $|\\cos(n^3)| \\le 1$, quindi</p>
<p>$$|b_n| \\le |\\sin(n)| + |\\cos(n^3)| \\le 2.$$</p>
<p><strong>Infinitesimalità di $a_n$.</strong> Si ha $\\lim_{n\\to+\\infty} \\frac{1}{n+1} = 0$.</p>
<p><strong>Conclusione.</strong> Per la proposizione sul prodotto di una successione limitata per una infinitesima, $\\lim_{n\\to+\\infty} a_n b_n = 0$, cioè</p>
<p>$$\\lim_{n\\to+\\infty}\\frac{\\sin(n)+\\cos(n^3)}{n+1} = 0.$$</p>
<p><strong>Alternativa (due carabinieri).</strong> Vale</p>
<p>$$-\\frac{2}{n+1} \\le \\frac{\\sin(n)+\\cos(n^3)}{n+1} \\le \\frac{2}{n+1},$$</p>
<p>e le due successioni esterne tendono a $0$.</p>`
      },

      {
        id: "s15-es-scritto-2",
        type: "esercizio",
        title: "Scritto 2",
        kind: "scritto",
        source: "integrazione",
        content: `<p>Calcola $\\lim_{n \\to +\\infty}\\left(2n^3 - 5n^2 + \\cos n\\right)$, giustificando ogni passaggio con le regole dell'algebra degli infiniti.</p>`,
        solution: `<p><strong>Riconoscimento della forma.</strong> Scritto così, il limite presenta la forma indeterminata $(+\\infty) + (-\\infty)$, perché $2n^3 \\to +\\infty$ e $-5n^2 \\to -\\infty$ (mentre $\\cos n$ è solo limitata).</p>
<p><strong>Raccoglimento del termine dominante $n^3$.</strong></p>
<p>$$2n^3 - 5n^2 + \\cos n = n^3\\left(2 - \\frac{5}{n} + \\frac{\\cos n}{n^3}\\right).$$</p>
<p><strong>Analisi dei fattori.</strong> $\\frac{5}{n} \\to 0$ per la regola del reciproco ($n \\to +\\infty$); inoltre $(\\cos n)$ è limitata e $n^3 \\to +\\infty$, dunque per la regola "limitata fratto infinito" $\\frac{\\cos n}{n^3} \\to 0$. Per l'algebra dei limiti finiti il secondo fattore tende a $2 - 0 + 0 = 2 \\gt 0$, mentre $n^3 \\to +\\infty$.</p>
<p><strong>Conclusione.</strong> Siamo nel caso "$+\\infty$ per limite finito positivo" della regola del prodotto, quindi</p>
<p>$$\\lim_{n \\to +\\infty}\\left(2n^3 - 5n^2 + \\cos n\\right) = +\\infty.$$</p>`
      },

      {
        id: "s15-es-scritto-3",
        type: "esercizio",
        title: "Scritto 3",
        kind: "scritto",
        source: "integrazione",
        content: `<p>Calcola $\\displaystyle\\lim_{n\\to+\\infty}\\left(2+\\sin(n)\\right)3^{\\,n}$, spiegando perché non si può concludere con l'algebra dei limiti e quale stima dal basso serve.</p>`,
        solution: `<p><strong>Perché l'algebra dei limiti non basta.</strong> La successione $\\sin(n)$ non ammette limite, quindi l'algebra dei limiti non è applicabile al primo fattore. La limitatezza del primo fattore e la divergenza del secondo, da sole, non determinano il comportamento del prodotto. Cerchiamo quindi una <strong>minorazione che tenda a $+\\infty$</strong>, cioè una stima dal basso con una costante strettamente positiva.</p>
<p><strong>Stima dal basso.</strong> Da $-1 \\le \\sin(n) \\le 1$ segue $2 + \\sin(n) \\ge 1 \\gt 0$ per ogni $n$, quindi, essendo $3^n \\gt 0$,</p>
<p>$$\\left(2+\\sin(n)\\right)3^n \\ge 3^n \\quad \\text{per ogni } n \\in \\mathbb{N}.$$</p>
<p><strong>Divergenza della minorante.</strong> Poiché $3 \\gt 1$, si ha $\\lim_{n\\to+\\infty} 3^n = +\\infty$.</p>
<p><strong>Conclusione.</strong> Applicando il punto 1 del teorema del confronto per limiti infiniti con successione minorante $3^n$ (il ruolo di $a_n$) e maggiorante $\\left(2+\\sin(n)\\right)3^n$ (il ruolo di $b_n$):</p>
<p>$$\\lim_{n\\to+\\infty}\\left(2+\\sin(n)\\right)3^n = +\\infty.$$</p>
<p><strong>Da notare.</strong> La stima grossolana $2+\\sin(n) \\ge 0$ darebbe solo $\\left(2+\\sin(n)\\right)3^n \\ge 0$, inutile ai fini della divergenza.</p>`
      },

      {
        id: "s15-es-scritto-4",
        type: "esercizio",
        title: "Scritto 4",
        kind: "scritto",
        source: "integrazione",
        content: `<p>Calcola $\\lim_{n \\to +\\infty}\\dfrac{3n^2 - 7n + 4}{5n^2 + 2n}$.</p>`,
        solution: `<p><strong>Riconoscimento della forma.</strong> Numeratore e denominatore tendono entrambi a $+\\infty$: la forma è $\\frac{\\infty}{\\infty}$, indeterminata, e come tale non determina il risultato.</p>
<p><strong>Raccoglimento del termine dominante</strong> sopra e sotto, per $n \\ge 1$:</p>
<p>$$\\frac{3n^2 - 7n + 4}{5n^2 + 2n} = \\frac{n^2\\left(3 - \\frac{7}{n} + \\frac{4}{n^2}\\right)}{n^2\\left(5 + \\frac{2}{n}\\right)} = \\frac{3 - \\frac{7}{n} + \\frac{4}{n^2}}{5 + \\frac{2}{n}},$$</p>
<p>dove la semplificazione di $n^2 \\ne 0$ è lecita per ogni $n \\ge 1$.</p>
<p><strong>Limiti dei due pezzi.</strong> Per la regola del reciproco $\\frac{1}{n} \\to 0$ e $\\frac{1}{n^2} \\to 0$, quindi il numeratore tende a $3$ e il denominatore a $5 \\ne 0$.</p>
<p><strong>Conclusione</strong> (algebra dei limiti finiti):</p>
<p>$$\\lim_{n \\to +\\infty}\\frac{3n^2 - 7n + 4}{5n^2 + 2n} = \\frac{3}{5}.$$</p>`
      },
