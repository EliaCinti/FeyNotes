<script>
const LESSON = {
    id: "L24", date: "Lezione 24 — 2 Nov 2026",
    title: "Asintoti, Continuità e Classificazione delle Discontinuità",
    abstract: "Introduciamo gli asintoti orizzontali, obliqui e verticali, con le formule per i coefficienti $m$ e $q$ e un approccio alternativo basato sul comportamento asintotico. Passiamo poi alla continuità di una funzione in un punto, alla permanenza del segno, all'algebra delle funzioni continue e infine alla classificazione dei punti di discontinuità (eliminabile, di salto, di seconda specie) con il prolungamento per continuità.",

    sections: [
      {
        id: "s24-asintoti-orizzontali",
        type: "section",
        title: "Asintoti Orizzontali",
        icon: "📏",
        content: `<p>In questa lezione introduciamo il concetto di <strong>asintoto</strong>, che descrive il comportamento di una funzione quando il suo argomento tende a infinito o a un punto di discontinuità.</p>
<p>Consideriamo il comportamento di una funzione $f(x)$ quando $x$ diventa molto grande. Se la funzione si avvicina a un valore costante, diciamo che ha un <strong>asintoto orizzontale</strong>.</p>`,
        subsections: [
          {
            subtitle: "Esempio introduttivo",
            content: `<p>Prendiamo la funzione $f(x) = \\frac{1}{x} + 5$. Calcoliamo il limite per $x$ che tende a più infinito:</p>
<p>$$\\lim_{x \\to +\\infty} \\left( \\frac{1}{x} + 5 \\right) = 0 + 5 = 5$$</p>
<p>Questo significa che, per valori di $x$ molto grandi, la funzione $f(x)$ si avvicina sempre di più al valore 5. La retta orizzontale $y=5$ descrive quindi il comportamento della funzione "all'infinito". Questa retta è chiamata asintoto orizzontale.</p>`
          },
          {
            subtitle: "Definizione (Asintoto Orizzontale)",
            content: `<p>Sia $f: A \\to \\mathbb{R}$ una funzione, con $A \\subseteq \\mathbb{R}$. Supponiamo che il dominio $A$ contenga un intorno di $+\\infty$ (ovvero, esista un $a \\in \\mathbb{R}$ tale che $(a, +\\infty) \\subseteq A$), o più in generale che $+\\infty$ sia un punto di accumulazione per $A$.</p>
<p>La retta di equazione $y=c$, con $c \\in \\mathbb{R}$, si dice <strong>asintoto orizzontale</strong> per la funzione $f(x)$ per $x \\to +\\infty$ se</p>
<p>$$\\lim_{x \\to +\\infty} f(x) = c$$</p>`
          },
          {
            subtitle: "Osservazione — il caso $x \\to -\\infty$",
            content: `<p>La definizione è analoga per $x \\to -\\infty$. La retta $y=c$ è un asintoto orizzontale per $x \\to -\\infty$ se $-\\infty$ è un punto di accumulazione per il dominio e</p>
<p>$$\\lim_{x \\to -\\infty} f(x) = c$$</p>
<p>Una funzione può avere asintoti orizzontali <strong>diversi</strong> per $x \\to +\\infty$ e $x \\to -\\infty$, oppure averne uno solo da un lato.</p>`
          },
          {
            subtitle: "Esempio — una funzione razionale",
            content: `<p>Troviamo gli asintoti orizzontali della funzione $f(x) = \\frac{x+1}{2x-1}$. Il dominio della funzione è $\\mathbb{R} \\setminus \\{\\frac{1}{2}\\}$, quindi possiamo calcolare i limiti a $+\\infty$ e $-\\infty$.</p>
<p>Per $x \\to +\\infty$:</p>
<p>$$\\lim_{x \\to +\\infty} \\frac{x+1}{2x-1} = \\lim_{x \\to +\\infty} \\frac{x\\left(1 + \\frac{1}{x}\\right)}{x\\left(2 - \\frac{1}{x}\\right)} = \\frac{1}{2}$$</p>
<p>Quindi la retta $y = \\frac{1}{2}$ è un asintoto orizzontale per $x \\to +\\infty$.</p>
<p>Per $x \\to -\\infty$:</p>
<p>$$\\lim_{x \\to -\\infty} \\frac{x+1}{2x-1} = \\frac{1}{2}$$</p>
<p>La stessa retta $y = \\frac{1}{2}$ è anche asintoto orizzontale per $x \\to -\\infty$.</p>

          {
            subtitle: "Esempio — l'esponenziale",
            content: `<p>Consideriamo la funzione $f(x) = e^x$.</p>
<p>Per $x \\to -\\infty$:</p>
<p>$$\\lim_{x \\to -\\infty} e^x = 0$$</p>
<p>Quindi la retta $y=0$ (l'asse delle ascisse) è un asintoto orizzontale per $x \\to -\\infty$.</p>
<p>Per $x \\to +\\infty$:</p>
<p>$$\\lim_{x \\to +\\infty} e^x = +\\infty$$</p>
<p>Poiché il limite è infinito, <strong>non esiste</strong> un asintoto orizzontale per $x \\to +\\infty$.</p>

        formulas: [
          { label: "Asintoto orizzontale a $+\\infty$", latex: "\\lim_{x \\to +\\infty} f(x) = c \\quad \\Rightarrow \\quad y = c" },
          { label: "Asintoto orizzontale a $-\\infty$", latex: "\\lim_{x \\to -\\infty} f(x) = c \\quad \\Rightarrow \\quad y = c" }
        ]
      },

      {
        id: "s24-asintoti-obliqui",
        type: "section",
        title: "Asintoti Obliqui",
        icon: "📐",
        content: `<p>Una funzione può avvicinarsi all'infinito non solo a una retta orizzontale, ma anche a una retta generica, non parallela agli assi. In questo caso parliamo di <strong>asintoto obliquo</strong>.</p>`,
        subsections: [
          {
            subtitle: "Definizione (Asintoto Obliquo)",
            content: `<p>Sia $f(x)$ una funzione definita in un intorno di $+\\infty$. La retta di equazione $y = mx + q$, con $m, q \\in \\mathbb{R}$ e $m \\neq 0$, si dice <strong>asintoto obliquo</strong> per $f(x)$ per $x \\to +\\infty$ se</p>
<p>$$\\lim_{x \\to +\\infty} \\left[ f(x) - (mx+q) \\right] = 0$$</p>
<p>Analogamente, la retta è asintoto obliquo per $x \\to -\\infty$ se il limite vale zero per $x \\to -\\infty$.</p>`
          },
          {
            subtitle: "Osservazione — lettura geometrica e scrittura con $o(1)$",
            content: `<p>La condizione della definizione significa che la <strong>distanza verticale</strong> tra il grafico della funzione $f(x)$ e la retta $y=mx+q$ tende a zero quando $x$ tende a infinito.</p>
<p>Possiamo riscrivere la condizione usando la notazione degli "o piccoli". <em>Promemoria di lettura:</em> scrivere $r(x) = o(1)$ per $x \\to +\\infty$ significa semplicemente che $r(x) \\to 0$, cioè che $r$ è un resto infinitesimo (il simbolo sarà ripreso in modo sistematico più avanti). Con questa convenzione:</p>
<p>$$f(x) - (mx+q) = o(1) \\quad \\text{per } x \\to +\\infty$$</p>
<p>ovvero</p>
<p>$$f(x) = mx + q + o(1) \\quad \\text{per } x \\to +\\infty$$</p>
<p>Questo ci dice che la retta $y=mx+q$ è un'ottima approssimazione della funzione $f(x)$ per valori di $x$ molto grandi.</p>`
          },
          {
            subtitle: "Osservazione — perché si chiede $m \\neq 0$",
            content: `<p>L'asintoto orizzontale può essere visto come un caso particolare di asintoto obliquo in cui il coefficiente angolare $m$ è uguale a zero. Se $m=0$, la retta diventa $y=q$, e la condizione</p>
<p>$$\\lim_{x \\to +\\infty} [f(x) - q] = 0$$</p>
<p>è esattamente la definizione di asintoto orizzontale. Per questo motivo, nella definizione di asintoto obliquo si richiede esplicitamente $m \\neq 0$.</p>`
          },
          {
            subtitle: "Calcolo dei coefficienti — Proposizione",
            content: `<p>Per trovare l'equazione dell'asintoto obliquo dobbiamo determinare i valori di $m$ e $q$.</p>
<p>Se la retta $y=mx+q$ è un asintoto obliquo per $f(x)$ per $x \\to +\\infty$, allora i coefficienti si calcolano con le seguenti formule:</p>
<p><strong>1. Coefficiente angolare $m$:</strong></p>
<p>$$m = \\lim_{x \\to +\\infty} \\frac{f(x)}{x}$$</p>
<p><strong>2. Termine noto $q$:</strong></p>
<p>$$q = \\lim_{x \\to +\\infty} [f(x) - mx]$$</p>
<p>Affinché esista un asintoto obliquo, <strong>entrambi i limiti devono esistere ed essere finiti</strong>, con $m \\neq 0$.</p>`
          },
          {
            subtitle: "Dimostrazione",
            content: `<p>Partiamo dalla definizione di asintoto obliquo:</p>
<p>$$\\lim_{x \\to +\\infty} [f(x) - mx - q] = 0$$</p>
<p>Questo è equivalente a scrivere $f(x) - mx - q = o(1)$ per $x \\to +\\infty$.</p>
<p><strong>1. Calcolo di $m$.</strong> Per trovare $m$ dividiamo tutta l'espressione per $x$ (possiamo farlo poiché $x \\to +\\infty$, quindi $x \\neq 0$):</p>
<p>$$\\frac{f(x)}{x} - m - \\frac{q}{x} = \\frac{o(1)}{x}$$</p>
<p>Ora calcoliamo il limite per $x \\to +\\infty$ di entrambi i membri:</p>
<p>$$\\lim_{x \\to +\\infty} \\left( \\frac{f(x)}{x} - m - \\frac{q}{x} \\right) = \\lim_{x \\to +\\infty} \\frac{o(1)}{x}$$</p>
<p>Sappiamo che $\\lim_{x \\to +\\infty} \\frac{q}{x} = 0$ (una costante divisa per un infinito) e $\\lim_{x \\to +\\infty} \\frac{o(1)}{x} = 0$ (un infinitesimo diviso per un infinito). Quindi l'equazione diventa</p>
<p>$$\\lim_{x \\to +\\infty} \\frac{f(x)}{x} - m = 0$$</p>
<p>da cui si ricava la formula per $m$:</p>
<p>$$m = \\lim_{x \\to +\\infty} \\frac{f(x)}{x}$$</p>
<p><strong>2. Calcolo di $q$.</strong> Una volta calcolato $m$ (e verificato che sia un numero reale finito e non nullo), possiamo trovare $q$. Torniamo alla definizione:</p>
<p>$$\\lim_{x \\to +\\infty} [f(x) - mx - q] = 0$$</p>
<p>Per le proprietà dei limiti possiamo scrivere</p>
<p>$$\\lim_{x \\to +\\infty} [f(x) - mx] - \\lim_{x \\to +\\infty} q = 0$$</p>
<p>Poiché $q$ è una costante, $\\lim_{x \\to +\\infty} q = q$. Quindi</p>
<p>$$\\lim_{x \\to +\\infty} [f(x) - mx] - q = 0$$</p>
<p>da cui si ottiene la formula per $q$:</p>
<p>$$q = \\lim_{x \\to +\\infty} [f(x) - mx]$$</p>
<p><strong>Nota.</strong> Le stesse formule valgono per la ricerca di un asintoto obliquo per $x \\to -\\infty$, semplicemente sostituendo $+\\infty$ con $-\\infty$ nei limiti. Una funzione può avere asintoti obliqui diversi a destra e a sinistra.</p>`
          },
          {
            subtitle: "Esempio — $f(x) = \\frac{x^2+1}{x-1}$",
            content: `<p><strong>Asintoto per $x \\to +\\infty$.</strong></p>
<p>1. Calcoliamo $m$:</p>
<p>$$m = \\lim_{x \\to +\\infty} \\frac{f(x)}{x} = \\lim_{x \\to +\\infty} \\frac{\\frac{x^2+1}{x-1}}{x} = \\lim_{x \\to +\\infty} \\frac{x^2+1}{x(x-1)} = \\lim_{x \\to +\\infty} \\frac{x^2+1}{x^2-x}$$</p>
<p>$$= \\lim_{x \\to +\\infty} \\frac{x^2\\left(1 + \\frac{1}{x^2}\\right)}{x^2\\left(1 - \\frac{1}{x}\\right)} = 1$$</p>
<p>Poiché $m=1$ (finito e non nullo), potrebbe esistere un asintoto obliquo. Procediamo con il calcolo di $q$.</p>
<p>2. Calcoliamo $q$:</p>
<p>$$q = \\lim_{x \\to +\\infty} [f(x) - mx] = \\lim_{x \\to +\\infty} \\left[ \\frac{x^2+1}{x-1} - 1 \\cdot x \\right] = \\lim_{x \\to +\\infty} \\frac{x^2+1 - x(x-1)}{x-1}$$</p>
<p>$$= \\lim_{x \\to +\\infty} \\frac{x^2+1 - x^2+x}{x-1} = \\lim_{x \\to +\\infty} \\frac{x+1}{x-1} = 1$$</p>
<p>Poiché anche $q=1$ è finito, la retta $y = 1 \\cdot x + 1$, cioè $y=x+1$, è asintoto obliquo per $x \\to +\\infty$.</p>
<p><strong>Asintoto per $x \\to -\\infty$.</strong> I calcoli per $m$ e $q$ per $x \\to -\\infty$ sono identici, poiché si tratta di rapporti di polinomi e i termini di grado massimo dominano allo stesso modo:</p>
<p>$$m = \\lim_{x \\to -\\infty} \\frac{x^2+1}{x^2-x} = 1, \\qquad q = \\lim_{x \\to -\\infty} \\frac{x+1}{x-1} = 1$$</p>
<p>Quindi la retta $y=x+1$ è anche asintoto obliquo per $x \\to -\\infty$.</p>

        ],
        formulas: [
          { label: "Definizione di asintoto obliquo", latex: "\\lim_{x \\to +\\infty} [f(x) - (mx+q)] = 0, \\quad m \\neq 0" },
          { label: "Coefficiente angolare", latex: "m = \\lim_{x \\to +\\infty} \\frac{f(x)}{x}" },
          { label: "Termine noto", latex: "q = \\lim_{x \\to +\\infty} [f(x) - mx]" }
        ]
      },

      {
        id: "s24-es-svolto-radice",
        type: "esercizio_svolto",
        title: "Esercizio svolto — Studio degli asintoti di $f(x) = \\sqrt{x^2+x}-x$",
        icon: "✎",
        source: "docente",
        content: `<p>Analizziamo il comportamento della funzione $f(x) = \\sqrt{x^2+x}-x$ agli estremi del suo dominio: determiniamo il dominio, poi il comportamento a $+\\infty$ e a $-\\infty$.</p>`,
        steps: [
          `<strong>Dominio della funzione.</strong> La condizione di esistenza della radice quadrata è che il suo argomento sia non negativo: $x^2+x \\geq 0 \\Rightarrow x(x+1) \\geq 0$. Questa disequazione è soddisfatta per valori esterni all'intervallo delle radici $(-1,0)$, quindi $$D = (-\\infty, -1] \\cup [0, +\\infty).$$ Poiché il dominio si estende a $+\\infty$ e $-\\infty$, ha senso cercare asintoti orizzontali o obliqui in entrambe le direzioni.`,
          `<strong>Comportamento per $x \\to +\\infty$: forma indeterminata.</strong> $$\\lim_{x \\to +\\infty} (\\sqrt{x^2+x} - x)$$ è una forma indeterminata del tipo $\\infty - \\infty$. Moltiplichiamo e dividiamo per il coniugato $\\sqrt{x^2+x} + x$: $$\\lim_{x \\to +\\infty} \\frac{(\\sqrt{x^2+x} - x)(\\sqrt{x^2+x} + x)}{\\sqrt{x^2+x} + x} = \\lim_{x \\to +\\infty} \\frac{(x^2+x) - x^2}{\\sqrt{x^2+x} + x} = \\lim_{x \\to +\\infty} \\frac{x}{\\sqrt{x^2+x} + x}$$`,
          `<strong>Raccogliamo il termine dominante.</strong> $$\\lim_{x \\to +\\infty} \\frac{x}{\\sqrt{x^2\\left(1+\\frac{1}{x}\\right)} + x} = \\lim_{x \\to +\\infty} \\frac{x}{|x|\\sqrt{1+\\frac{1}{x}} + x}$$ Poiché $x \\to +\\infty$, $x$ è positivo, quindi $|x|=x$: $$\\lim_{x \\to +\\infty} \\frac{x}{x\\left(\\sqrt{1+\\frac{1}{x}} + 1\\right)} = \\lim_{x \\to +\\infty} \\frac{1}{\\sqrt{1+\\frac{1}{x}} + 1} = \\frac{1}{\\sqrt{1+0} + 1} = \\frac{1}{2}$$ Dato che il limite è finito, esiste un <strong>asintoto orizzontale</strong> per $x \\to +\\infty$ di equazione $y = \\frac{1}{2}$.`,
          `<strong>Comportamento per $x \\to -\\infty$.</strong> Analizziamo i termini: $\\sqrt{x^2+x} \\to +\\infty$ e $-x \\to +\\infty$ (poiché $x$ è negativo). Quindi il limite è della forma $+\\infty + \\infty$, che <strong>non</strong> è una forma indeterminata: $$\\lim_{x \\to -\\infty} (\\sqrt{x^2+x} - x) = +\\infty$$ Non esiste un asintoto orizzontale per $x \\to -\\infty$. Potrebbe però esistere un asintoto obliquo: cerchiamo $m$ e $q$ della retta $y=mx+q$.`,
          `<strong>Calcolo di $m$.</strong> $$m = \\lim_{x \\to -\\infty} \\frac{f(x)}{x} = \\lim_{x \\to -\\infty} \\frac{\\sqrt{x^2+x} - x}{x} = \\lim_{x \\to -\\infty} \\frac{|x|\\sqrt{1+\\frac{1}{x}} - x}{x}$$ <blockquote><strong>Nota del Prof.</strong> Ricordate sempre che $\\sqrt{x^2} = |x|$. Se $x$ è un numero negativo, come $-4$, si ha $(-4)^2=16$ e $\\sqrt{16}=4$. Quindi $\\sqrt{(-4)^2} = 4 = -(-4)$, cioè $|-4|$. Questo è un punto cruciale quando si lavora con limiti a $-\\infty$.</blockquote>`,
          `Poiché $x \\to -\\infty$, $x$ è negativo, quindi $|x|=-x$: $$m = \\lim_{x \\to -\\infty} \\frac{-x\\sqrt{1+\\frac{1}{x}} - x}{x} = \\lim_{x \\to -\\infty} \\frac{-x\\left(\\sqrt{1+\\frac{1}{x}} + 1\\right)}{x} = \\lim_{x \\to -\\infty} -\\left(\\sqrt{1+\\frac{1}{x}} + 1\\right) = -(\\sqrt{1+0} + 1) = -2$$ Poiché $m=-2$ è finito e non nullo, potrebbe esistere un asintoto obliquo.`,
          `<strong>Calcolo di $q$.</strong> $$q = \\lim_{x \\to -\\infty} [f(x) - mx] = \\lim_{x \\to -\\infty} [(\\sqrt{x^2+x} - x) - (-2)x] = \\lim_{x \\to -\\infty} (\\sqrt{x^2+x} + x)$$ Questa è di nuovo una forma indeterminata $\\infty - \\infty$: usiamo il coniugato. $$q = \\lim_{x \\to -\\infty} \\frac{(\\sqrt{x^2+x} + x)(\\sqrt{x^2+x} - x)}{\\sqrt{x^2+x} - x} = \\lim_{x \\to -\\infty} \\frac{(x^2+x) - x^2}{\\sqrt{x^2+x} - x} = \\lim_{x \\to -\\infty} \\frac{x}{\\sqrt{x^2+x} - x}$$`,
          `Proseguiamo usando di nuovo $\\sqrt{x^2} = |x| = -x$ per $x \\lt 0$: $$q = \\lim_{x \\to -\\infty} \\frac{x}{|x|\\sqrt{1+\\frac{1}{x}} - x} = \\lim_{x \\to -\\infty} \\frac{x}{-x\\sqrt{1+\\frac{1}{x}} - x} = \\lim_{x \\to -\\infty} \\frac{x}{-x\\left(\\sqrt{1+\\frac{1}{x}} + 1\\right)}$$ $$= \\lim_{x \\to -\\infty} \\frac{1}{-\\left(\\sqrt{1+\\frac{1}{x}} + 1\\right)} = \\frac{1}{-(\\sqrt{1+0}+1)} = -\\frac{1}{2}$$ Poiché anche $q = -1/2$ è finito, la retta $y = -2x - \\frac{1}{2}$ è <strong>asintoto obliquo</strong> per $x \\to -\\infty$.`,
          `<strong>Conclusione.</strong> Questo esempio mostra come una funzione possa avere comportamenti molto diversi a $+\\infty$ e a $-\\infty$: un asintoto orizzontale da un lato ($y=1/2$) e un asintoto obliquo dall'altro ($y=-2x-\\tfrac{1}{2}$).<br><figure class="figura" data-id="analisi1_lez24b_g1"><svg xmlns:xlink="http://www.w3.org/1999/xlink" width="640pt" height="400pt" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" version="1.1">

      {
        id: "s24-unicita-asintoto",
        type: "note_box",
        title: "Unicità dell'asintoto",
        icon: "🔒",
        content: `<p>Se esiste un asintoto (orizzontale o obliquo) per $x \\to +\\infty$ (o per $x \\to -\\infty$), questo è <strong>unico</strong>. Una funzione non può avere due asintoti diversi nello stesso verso.</p>`
      },

      {
        id: "s24-comportamento-asintotico",
        type: "section",
        title: "Approccio alternativo: comportamento asintotico",
        icon: "🧮",
        content: `<p>Un altro modo per determinare l'asintoto, senza calcolare separatamente i limiti per $m$ e $q$, è studiare il <strong>comportamento asintotico</strong> della funzione. Questo metodo richiede una buona padronanza delle manipolazioni algebriche e degli sviluppi asintotici.</p>`,
        subsections: [
          {
            subtitle: "Richiamo sui simboli $\\sim$ e $o(1)$",
            content: `<p>Prima di procedere, richiamiamo il significato preciso dei due simboli che useremo.</p>
<p>• Scriviamo $a(x) \\sim b(x)$ per $x \\to x_0$ (dove $x_0$ può anche essere $\\pm\\infty$) e diciamo che $a$ e $b$ sono <strong>asintoticamente equivalenti</strong> (supponendo $b(x) \\neq 0$ per $x$ vicino a $x_0$, con $x \\neq x_0$, così che il rapporto abbia senso), se</p>
<p>$$\\lim_{x \\to x_0} \\frac{a(x)}{b(x)} = 1$$</p>
<p>Intuitivamente: le due quantità hanno lo stesso ordine di grandezza e lo stesso "coefficiente dominante".</p>
<p>• Scriviamo $r(x) = o(1)$ per $x \\to x_0$ se</p>
<p>$$\\lim_{x \\to x_0} r(x) = 0$$</p>
<p>cioè se $r$ è un resto infinitesimo, trascurabile rispetto alla costante $1$.</p>
<p>Con questa notazione, l'affermazione $f(x) = mx + q + o(1)$ per $x \\to +\\infty$ è <strong>esattamente</strong> la definizione di asintoto obliquo $y = mx+q$: la differenza fra la funzione e la retta tende a zero.</p>`
          },
          {
            subtitle: "Esempio — $f(x) = \\ln(e^x + 2)$",
            content: `<p>Studiamo il comportamento per $x \\to +\\infty$. Possiamo raccogliere il termine dominante $e^x$ all'interno del logaritmo:</p>
<p>$$f(x) = \\ln\\left(e^x \\left(1 + \\frac{2}{e^x}\\right)\\right) = \\ln(e^x) + \\ln\\left(1 + 2e^{-x}\\right) = x + \\ln\\left(1 + 2e^{-x}\\right)$$</p>
<p>Ora analizziamo il secondo termine. Per $x \\to +\\infty$, l'argomento $t = 2e^{-x}$ tende a $0$. Ricordando il limite notevole $\\lim_{t \\to 0} \\frac{\\ln(1+t)}{t} = 1$, possiamo dire che $\\ln(1+t) \\sim t$ per $t \\to 0$, cioè che il rapporto $\\ln(1+t)/t$ tende a $1$. Quindi, per $x \\to +\\infty$:</p>
<p>$$\\ln\\left(1 + 2e^{-x}\\right) \\sim 2e^{-x}$$</p>
<p>Il termine $2e^{-x}$ tende a $0$ per $x \\to +\\infty$; di conseguenza anche il resto logaritmico tende a zero,</p>
<p>$$\\lim_{x \\to +\\infty} \\ln\\left(1 + 2e^{-x}\\right) = \\ln(1+0) = 0$$</p>
<p>ed è dunque proprio $\\ln(1+2e^{-x})$ a essere un $o(1)$ per $x \\to +\\infty$. La nostra funzione può essere scritta come</p>
<p>$$f(x) = x + o(1) \\quad \\text{per } x \\to +\\infty$$</p>
<p>Questa scrittura è equivalente a dire $\\lim_{x \\to +\\infty} (f(x) - x) = 0$. Confrontando con la definizione di asintoto obliquo $y=mx+q$, dove $\\lim_{x \\to +\\infty} (f(x) - (mx+q)) = 0$, vediamo che nel nostro caso $m=1$ e $q=0$. Pertanto la retta $y=x$ è asintoto obliquo per $f(x)$ per $x \\to +\\infty$.</p>`
          }
        ]
      },

      {
        id: "s24-asintoti-verticali",
        type: "section",
        title: "Asintoti Verticali",
        icon: "⬆️",
        content: `<p>Passiamo ora al comportamento di una funzione nei punti finiti in cui "esplode" verso l'infinito.</p>`,
        subsections: [
          {
            subtitle: "Definizione (Asintoto Verticale)",
            content: `<p>Sia $f: A \\to \\mathbb{R}$ una funzione e sia $x_0 \\in \\mathbb{R}$.</p>
<p>• Supponiamo che $x_0$ sia punto di accumulazione per $A$ <strong>da destra</strong>, cioè che $x_0$ sia di accumulazione per l'insieme $A \\cap (x_0, +\\infty)$ (in modo che il limite destro abbia senso). La retta di equazione $x=x_0$ si dice <strong>asintoto verticale da destra</strong> per $f$ se</p>
<p>$$\\lim_{x \\to x_0^+} f(x) = +\\infty \\quad \\text{oppure} \\quad \\lim_{x \\to x_0^+} f(x) = -\\infty$$</p>
<p>• Supponiamo che $x_0$ sia punto di accumulazione per $A$ <strong>da sinistra</strong>, cioè per l'insieme $A \\cap (-\\infty, x_0)$. La retta $x=x_0$ si dice <strong>asintoto verticale da sinistra</strong> per $f$ se</p>
<p>$$\\lim_{x \\to x_0^-} f(x) = +\\infty \\quad \\text{oppure} \\quad \\lim_{x \\to x_0^-} f(x) = -\\infty$$</p>
<p>• La retta $x=x_0$ si dice <strong>asintoto verticale</strong> (o bilaterale) se $x_0$ è punto di accumulazione da entrambi i lati e la retta è asintoto verticale sia da destra sia da sinistra.</p>`
          },
          {
            subtitle: "Osservazione — perché la precisazione sul lato è essenziale",
            content: `<p>La sola ipotesi "$x_0$ è punto di accumulazione per $A$" non garantisce che si possa avvicinare $x_0$ da entrambe le direzioni. Per esempio, con $A = (0, +\\infty)$ il punto $x_0 = 0$ è di accumulazione per $A$, ma <strong>solo da destra</strong>: il limite per $x \\to 0^-$ non è nemmeno definibile.</p>
<p>Inoltre: gli asintoti verticali si cercano tipicamente nei punti finiti che sono agli <strong>estremi del dominio</strong> di definizione della funzione (punti in cui la funzione non è definita ma che sono di accumulazione per il dominio).</p>`
          },
          {
            subtitle: "Esempio — $f(x) = \\frac{1}{x}$",
            content: `<p>Il dominio è $\\mathbb{R} \\setminus \\{0\\}$. Il punto $x_0=0$ è un punto di accumulazione da destra e da sinistra.</p>
<p>$$\\lim_{x \\to 0^+} \\frac{1}{x} = +\\infty \\quad \\text{e} \\quad \\lim_{x \\to 0^-} \\frac{1}{x} = -\\infty$$</p>
<p>Quindi la retta $x=0$ (l'asse $y$) è un asintoto verticale.</p>

          {
            subtitle: "Esempio — $f(x) = \\ln(x)$",
            content: `<p>Il dominio è $(0, +\\infty)$. Il punto $x_0=0$ è di accumulazione <strong>solo da destra</strong>.</p>
<p>$$\\lim_{x \\to 0^+} \\ln(x) = -\\infty$$</p>
<p>Quindi la retta $x=0$ è un asintoto verticale da destra. Si noti che non ha senso chiedersi se sia asintoto da sinistra: a sinistra di $0$ la funzione non è definita.</p>

      {
        id: "s24-continuita",
        type: "section",
        title: "Continuità di una funzione",
        icon: "🔗",
        content: `<p>Introduciamo ora la nozione di <strong>continuità</strong>, che lega il valore del limite al valore effettivo della funzione nel punto.</p>`,
        subsections: [
          {
            subtitle: "Definizione (Funzione continua in un punto)",
            content: `<p>Sia $f: A \\to \\mathbb{R}$ una funzione e sia $x_0 \\in A$ un punto di accumulazione per $A$. La funzione $f$ si dice <strong>continua</strong> nel punto $x_0$ se</p>
<p>$$\\lim_{x \\to x_0} f(x) = f(x_0)$$</p>
<p>dove il limite è inteso <strong>relativamente al dominio</strong> $A$: si fanno tendere a $x_0$ soltanto i punti $x \\in A$.</p>`
          },
          {
            subtitle: "Osservazione — \"relativamente ad $A$\" non è un dettaglio formale",
            content: `<p>Se per esempio $A = [0,1]$ e $x_0 = 0$, i soli punti disponibili per il passaggio al limite sono quelli a destra di $0$: la continuità in $x_0=0$ coincide allora con la continuità da destra. In generale, in un punto che è di accumulazione per $A$ da un solo lato, la continuità si riduce automaticamente a quella laterale.</p>
<p>Inoltre, se $x_0 \\in A$ è un <strong>punto isolato</strong> del dominio (cioè non è un punto di accumulazione), la funzione si considera per convenzione continua in $x_0$.</p>`
          },
          {
            subtitle: "Definizione (Funzione continua su un insieme)",
            content: `<p>Una funzione $f: A \\to \\mathbb{R}$ si dice <strong>continua su $A$</strong> se è continua in ogni punto $x_0 \\in A$. L'insieme delle funzioni continue su $A$ si denota con $C(A)$.</p>
<p>Le funzioni elementari (potenze, esponenziali, logaritmi, funzioni trigonometriche) e le loro inverse sono continue nei rispettivi domini di definizione.</p>`
          },
          {
            subtitle: "Osservazione — Caratterizzazione $\\varepsilon$-$\\delta$ della continuità",
            content: `<p>La definizione di continuità può essere riespressa in termini di $\\varepsilon$-$\\delta$. La condizione $\\lim_{x \\to x_0} f(x) = f(x_0)$ equivale a:</p>
<p>$$\\forall \\varepsilon \\gt 0 \\quad \\exists \\delta \\gt 0 \\quad \\text{t.c.} \\quad \\forall x \\in A, \\quad |x-x_0| \\lt \\delta \\;\\Rightarrow\\; |f(x) - f(x_0)| \\lt \\varepsilon$$</p>
<p><strong>Nota.</strong> A differenza della definizione di limite, qui <strong>non</strong> si richiede $x \\neq x_0$ (ossia $0 \\lt |x-x_0|$), poiché se $x=x_0$ la disuguaglianza $|f(x_0)-f(x_0)| \\lt \\varepsilon$ diventa $0 \\lt \\varepsilon$, che è sempre vera.</p>`
          },
          {
            subtitle: "Teorema (Permanenza del segno per funzioni continue)",
            content: `<p>Sia $f: A \\to \\mathbb{R}$ una funzione continua in $x_0 \\in A$. Se $f(x_0) \\gt 0$, allora esiste un intorno $N$ di $x_0$ tale che $f(x) \\gt 0$ per ogni $x \\in N \\cap A$. Analogamente, se $f(x_0) \\lt 0$, allora esiste un intorno $N$ di $x_0$ tale che $f(x) \\lt 0$ per ogni $x \\in N \\cap A$.</p>
<p><strong>Dimostrazione.</strong> È una conseguenza diretta della definizione di limite: scegliendo $\\varepsilon = |f(x_0)|/2 \\gt 0$, si ottiene un $\\delta \\gt 0$ tale che per ogni $x \\in A$ con $|x - x_0| \\lt \\delta$ vale</p>
<p>$$|f(x) - f(x_0)| \\lt \\frac{|f(x_0)|}{2}$$</p>
<p>Esplicitiamo il passaggio finale, che è quello da saper riprodurre:</p>
<p>• se $f(x_0) \\gt 0$, allora $|f(x_0)| = f(x_0)$ e dalla disuguaglianza segue $f(x) \\gt f(x_0) - \\frac{f(x_0)}{2} = \\frac{f(x_0)}{2} \\gt 0$;</p>
<p>• se $f(x_0) \\lt 0$, allora $|f(x_0)| = -f(x_0)$ e dalla disuguaglianza segue $f(x) \\lt f(x_0) + \\frac{|f(x_0)|}{2} = \\frac{f(x_0)}{2} \\lt 0$.</p>
<p>In entrambi i casi $f(x)$ ha lo stesso segno di $f(x_0)$ per ogni $x \\in N \\cap A$, con $N = (x_0-\\delta, x_0+\\delta)$. $\\blacksquare$</p>`
          }
        ],
        formulas: [
          { label: "Continuità in $x_0$", latex: "\\lim_{x \\to x_0} f(x) = f(x_0)" },
          { label: "Caratterizzazione $\\varepsilon$-$\\delta$", latex: "\\forall \\varepsilon \\gt 0 \\; \\exists \\delta \\gt 0 : \\forall x \\in A, \\; |x-x_0| \\lt \\delta \\Rightarrow |f(x)-f(x_0)| \\lt \\varepsilon" },
          { label: "Permanenza del segno (scelta chiave)", latex: "\\varepsilon = \\frac{|f(x_0)|}{2}" }
        ]
      },

      {
        id: "s24-int-permanenza",
        type: "integrazione_box",
        title: "Integrazione — non detto dal docente",
        icon: "➕",
        content: `<p><strong>Esempio illustrativo: il teorema della permanenza del segno all'opera.</strong></p>
<p>Sia $f(x) = x+1$, continua su tutto $\\mathbb{R}$, e prendiamo $x_0 = 2$. Si ha $f(2) = 3 \\gt 0$, dunque il teorema garantisce l'esistenza di un intorno di $2$ su cui $f$ resta positiva. Seguiamo la dimostrazione per <em>esibirlo</em>: con $\\varepsilon = f(2)/2 = 3/2$ cerchiamo $\\delta$ tale che</p>
<p>$$|x-2| \\lt \\delta \\;\\Rightarrow\\; |(x+1)-3| \\lt \\tfrac{3}{2}$$</p>
<p>Poiché $|(x+1)-3| = |x-2|$, basta prendere $\\delta = 3/2$: sull'intorno $N = \\left(\\tfrac{1}{2}, \\tfrac{7}{2}\\right)$ si ha $f(x) \\gt 3 - \\tfrac{3}{2} = \\tfrac{3}{2} \\gt 0$.</p>
<p>Si noti che l'intorno fornito dal teorema non è "il più grande possibile": in questo caso $x+1 \\gt 0$ per ogni $x \\gt -1$. Il teorema afferma soltanto che <em>un</em> intorno buono esiste, ed è questa esistenza a essere utile nelle dimostrazioni (per esempio per garantire che un denominatore non si annulli vicino a un punto).</p>`
      },

      {
        id: "s24-algebra-continue",
        type: "section",
        title: "Algebra delle funzioni continue",
        icon: "➗",
        content: `<p>Dalle proprietà dei limiti seguono immediatamente le proprietà delle funzioni continue.</p>`,
        subsections: [
          {
            subtitle: "Proposizione (somma, prodotto, multiplo, quoziente)",
            content: `<p>Siano $f, g: A \\to \\mathbb{R}$ due funzioni continue in un punto $x_0 \\in A$. Allora:</p>
<p>• La somma $f+g$ è continua in $x_0$.</p>
<p>• Il prodotto $f \\cdot g$ è continuo in $x_0$.</p>
<p>• Per ogni $\\alpha \\in \\mathbb{R}$, la funzione $\\alpha f$ è continua in $x_0$.</p>
<p>• Se $g(x_0) \\neq 0$, il quoziente $f/g$ è definito su $N \\cap A$ per un opportuno intorno $N$ di $x_0$ — infatti per la permanenza del segno $g$ non si annulla nei punti di $A$ vicini a $x_0$ — ed è continuo in $x_0$ relativamente al proprio dominio.</p>`
          },
          {
            subtitle: "Proposizione (Continuità della funzione composta)",
            content: `<p>Siano $g: A \\to B$ e $f: B \\to \\mathbb{R}$, con $A, B \\subseteq \\mathbb{R}$, così che la composta $f \\circ g: A \\to \\mathbb{R}$ sia ben definita. Sia $x_0 \\in A$. Se $g$ è continua in $x_0$ e $f$ è continua in $y_0 = g(x_0) \\in B$, allora $f \\circ g$ è continua in $x_0$.</p>
<p><strong>Osservazione.</strong> L'ipotesi che i valori di $g$ cadano nel dominio di $f$ è indispensabile: se scrivessimo semplicemente $f, g : A \\to \\mathbb{R}$, la scrittura $f(g(x))$ potrebbe non avere senso in alcun punto di $A$. Per esempio con $A = \\mathbb{R}$, $g(x) = -1-x^2$ e $f(y) = \\sqrt{y}$ (definita su $B = [0,+\\infty)$) la composta non è definita in nessun punto.</p>`
          }
        ]
      },

      {
        id: "s24-int-domini",
        type: "integrazione_box",
        title: "Integrazione — non detto dal docente",
        icon: "➕",
        content: `<p><strong>Esempio illustrativo: dominio di continuità di una composta e di un quoziente.</strong></p>
<p><strong>(a) Una funzione composta.</strong> Consideriamo $h(x) = \\sqrt{x+1}$. Scriviamo $h = f \\circ g$ con $g(x) = x+1$ e $f(y) = \\sqrt{y}$. La funzione $g$ è un polinomio, dunque continua su $\\mathbb{R}$; la funzione $f$ è continua su $B = [0, +\\infty)$. Perché la composta sia definita serve $g(x) \\in B$, cioè $x+1 \\geq 0$, ossia $x \\geq -1$. Su $A = [-1, +\\infty)$ sono soddisfatte tutte le ipotesi della proposizione precedente, quindi $h$ è continua in ogni punto di $[-1,+\\infty)$. Nell'estremo $x_0 = -1$, che è punto di accumulazione per $A$ solo da destra, la continuità va intesa come continuità da destra:</p>
<p>$$\\lim_{x \\to (-1)^+} \\sqrt{x+1} = 0 = h(-1)$$</p>
<p><strong>(b) Un quoziente.</strong> Consideriamo $k(x) = \\dfrac{x+1}{x^2-4}$. Numeratore e denominatore sono polinomi, quindi continui su tutto $\\mathbb{R}$. Per la regola del quoziente, $k$ è continua in ogni punto $x_0$ in cui il denominatore non si annulla: $x^2-4 = 0$ se e solo se $x = \\pm 2$. Dunque il dominio di continuità è</p>
<p>$$\\mathbb{R} \\setminus \\{-2, 2\\} = (-\\infty,-2) \\cup (-2,2) \\cup (2,+\\infty)$$</p>
<p>Per esempio in $x_0 = 0$ si ha $0^2-4 = -4 \\neq 0$: per la permanenza del segno il denominatore resta negativo (in particolare non nullo) in un intorno di $0$, e si può concludere</p>
<p>$$\\lim_{x \\to 0} k(x) = \\frac{0+1}{0-4} = -\\frac{1}{4} = k(0)$$</p>`
      },

      {
        id: "s24-punti-discontinuita",
        type: "section",
        title: "Punti di discontinuità e continuità laterale",
        icon: "✂️",
        content: `<p>Quando una funzione non è continua in un punto, si dice che ha una <strong>discontinuità</strong>.</p>`,
        subsections: [
          {
            subtitle: "Esempio — $f(x)=e^{1/x}$ prolungata con $f(0)=0$",
            content: `<p>Consideriamo la funzione definita a tratti</p>
<p>$$f(x) = \\begin{cases} e^{1/x} & \\text{se } x \\neq 0 \\\\ 0 & \\text{se } x = 0 \\end{cases}$$</p>
<p>Per verificare la continuità in $x_0=0$ dobbiamo calcolare il limite per $x \\to 0$ e confrontarlo con $f(0)=0$. Calcoliamo i limiti destro e sinistro:</p>
<p>$$\\lim_{x \\to 0^+} e^{1/x} = e^{+\\infty} = +\\infty, \\qquad \\lim_{x \\to 0^-} e^{1/x} = e^{-\\infty} = 0$$</p>
<p>Poiché il limite destro e il limite sinistro non sono uguali (e il destro non è nemmeno finito), la funzione <strong>non è continua</strong> in $x_0=0$.</p>

          },
          {
            subtitle: "Definizione (Continuità da destra e da sinistra)",
            content: `<p>Sia $f: A \\to \\mathbb{R}$ e $x_0 \\in A$.</p>
<p>• Se $x_0$ è punto di accumulazione per $A$ da destra (cioè per $A \\cap (x_0,+\\infty)$), si dice che $f$ è <strong>continua da destra</strong> in $x_0$ se $\\lim_{x \\to x_0^+} f(x) = f(x_0)$.</p>
<p>• Se $x_0$ è punto di accumulazione per $A$ da sinistra (cioè per $A \\cap (-\\infty,x_0)$), si dice che $f$ è <strong>continua da sinistra</strong> in $x_0$ se $\\lim_{x \\to x_0^-} f(x) = f(x_0)$.</p>`
          },
          {
            subtitle: "Osservazione — legame con la continuità",
            content: `<p>Se $x_0 \\in A$ è punto di accumulazione per $A$ da entrambi i lati, allora $f$ è continua in $x_0$ <strong>se e solo se</strong> è continua sia da destra sia da sinistra in $x_0$: infatti il limite bilaterale esiste e vale $f(x_0)$ se e solo se entrambi i limiti laterali esistono e valgono $f(x_0)$. Se invece $x_0$ è punto di accumulazione da un solo lato, la continuità in $x_0$ coincide con la corrispondente continuità laterale.</p>
<p>Tornando all'esempio precedente, la funzione $f$ con $f(x)=e^{1/x}$ per $x\\neq0$ e $f(0)=0$ è <strong>continua da sinistra</strong> in $x_0 = 0$, perché $\\lim_{x \\to 0^-} f(x) = 0 = f(0)$, ma non è continua da destra, perché $\\lim_{x \\to 0^+} f(x) = +\\infty \\neq f(0)$. Di conseguenza $f$ non è continua in $0$: questo è esattamente il modo in cui si descrive una discontinuità "da un solo lato".</p>`
          }
        ]
      },

      {
        id: "s24-classificazione",
        type: "section",
        title: "Classificazione dei punti di discontinuità",
        icon: "🗂️",
        content: `<p>Per poter parlare di continuità di una funzione $f$ in un punto $x_0$ è necessario che $f$ sia definita in quel punto; per classificare invece il comportamento di $f$ in $x_0$ basta che $x_0$ sia un punto di accumulazione del dominio di $f$ e che $f$ sia definita in un intorno di $x_0$, eventualmente escluso $x_0$ stesso (caso che si presenta nelle discontinuità eliminabili con $x_0 \\notin \\text{dom}(f)$).</p>
<p>La classificazione dei punti di discontinuità si basa sul confronto di <strong>tre quantità fondamentali</strong>:</p>
<p>• il limite destro della funzione in $x_0$: $\\lim_{x \\to x_0^+} f(x)$;</p>
<p>• il limite sinistro della funzione in $x_0$: $\\lim_{x \\to x_0^-} f(x)$;</p>
<p>• il valore della funzione nel punto: $f(x_0)$.</p>
<p>A seconda del comportamento di questi limiti e del loro rapporto con $f(x_0)$, possiamo classificare le discontinuità in tre tipi principali.</p>`,
        subsections: [
          {
            subtitle: "Discontinuità eliminabile",
            content: `<p>Una discontinuità eliminabile si verifica quando la funzione ha un "buco" che potrebbe essere "riempito" per renderla continua.</p>
<p><strong>Definizione.</strong> Sia $f: A \\to \\mathbb{R}$ e $x_0$ un punto di accumulazione per $A$. Si dice che $f$ ha una <strong>discontinuità eliminabile</strong> in $x_0$ se il limite della funzione per $x \\to x_0$ esiste ed è finito, ma è diverso dal valore della funzione nel punto, oppure la funzione non è definita in $x_0$. In simboli:</p>
<p>$$\\lim_{x \\to x_0} f(x) = L \\in \\mathbb{R}, \\quad \\text{ma} \\quad L \\neq f(x_0) \\quad (\\text{oppure } x_0 \\notin \\text{dom}(f))$$</p>
<p>Questo tipo di discontinuità è detto "eliminabile" perché è possibile "riparare" la funzione e renderla continua in $x_0$ semplicemente (ri)definendo il suo valore in quel punto, ponendo $f(x_0) = L$.</p>
<p><strong>Esempio.</strong> Consideriamo</p>
<p>$$f(x) = \\begin{cases} x^2 & \\text{se } x \\neq 0 \\\\ 4 & \\text{se } x = 0 \\end{cases}$$</p>
<p>Il limite per $x \\to 0$ è $\\lim_{x \\to 0} f(x) = \\lim_{x \\to 0} x^2 = 0$, mentre il valore della funzione in $x=0$ è $f(0) = 4$. Poiché il limite esiste finito ma è diverso dal valore della funzione nel punto ($0 \\neq 4$), la funzione ha una discontinuità eliminabile in $x_0 = 0$.</p><!-- L24 REPAIR g1 --><figure class="figura" data-id="analisi1_lez24c_g1"><svg xmlns:xlink="http://www.w3.org/1999/xlink" width="640pt" height="400pt" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" version="1.1">

          },
          {
            subtitle: "Discontinuità di salto (o di prima specie)",
            content: `<p>Questo tipo di discontinuità si presenta quando la funzione "salta" da un valore a un altro in un punto.</p>
<p><strong>Definizione.</strong> Sia $f: A \\to \\mathbb{R}$ e sia $x_0$ un punto di accumulazione di $A$ sia da destra sia da sinistra (in modo che entrambi i limiti laterali abbiano senso). Si dice che $f$ ha una <strong>discontinuità di salto</strong> (o di prima specie) in $x_0$ se i limiti destro e sinistro della funzione in $x_0$ esistono entrambi finiti, ma sono diversi tra loro:</p>
<p>$$\\lim_{x \\to x_0^+} f(x) = L_1 \\in \\mathbb{R}, \\quad \\lim_{x \\to x_0^-} f(x) = L_2 \\in \\mathbb{R}, \\quad \\text{e} \\quad L_1 \\neq L_2$$</p>
<p>La quantità $|L_1 - L_2|$ è chiamata <strong>salto</strong> della funzione in $x_0$.</p>
<p><strong>Esempio.</strong> La funzione segno è un classico esempio di discontinuità di salto in $x_0=0$:</p>
<p>$$\\text{sgn}(x) = \\begin{cases} 1 & \\text{se } x \\gt 0 \\\\ 0 & \\text{se } x = 0 \\\\ -1 & \\text{se } x \\lt 0 \\end{cases}$$</p>
<p>$$\\lim_{x \\to 0^+} \\text{sgn}(x) = 1, \\qquad \\lim_{x \\to 0^-} \\text{sgn}(x) = -1$$</p>
<p>I limiti destro e sinistro esistono finiti ma sono diversi ($1 \\neq -1$). Il valore della funzione nel punto è $f(0)=0$. Il salto della funzione è $|1 - (-1)| = 2$.</p><!-- L24 REPAIR g2 --><figure class="figura" data-id="analisi1_lez24c_g2"><svg xmlns:xlink="http://www.w3.org/1999/xlink" width="640pt" height="400pt" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" version="1.1">

          },
          {
            subtitle: "Discontinuità di seconda specie",
            content: `<p>Questa categoria include tutti i casi di discontinuità più "gravi", in cui la funzione ha un comportamento divergente o oscillante.</p>
<p><strong>Definizione.</strong> Si dice che $f$ ha una <strong>discontinuità di seconda specie</strong> in $x_0$ se $f$ non è continua in $x_0$ e la discontinuità non è né eliminabile né di salto. Ciò accade quando almeno uno dei due limiti, destro o sinistro, non esiste o è infinito.</p>
<p><strong>Esempio 1.</strong> Consideriamo</p>
<p>$$f(x) = \\begin{cases} 1/x & \\text{se } x \\neq 0 \\\\ 0 & \\text{se } x = 0 \\end{cases}$$</p>
<p>I limiti laterali in $x_0=0$ sono $\\lim_{x \\to 0^+} \\frac{1}{x} = +\\infty$ e $\\lim_{x \\to 0^-} \\frac{1}{x} = -\\infty$. Poiché entrambi i limiti laterali sono infiniti, la funzione ha una discontinuità di seconda specie in $0$.</p>

</svg><figcaption><strong>Discontinuità di seconda specie: f(x) = 1/x</strong><span class="figure-explanation">I limiti laterali sono infiniti anche se la funzione ha il valore assegnato $f(0)=0$.</span></figcaption></figure><!-- END L24 REPAIR g3 --><p><strong>Esempio 2.</strong> La funzione</p>

<p>ha una discontinuità di seconda specie in $x_0=0$ perché i limiti $\\lim_{x \\to 0^+} \\sin(1/x)$ e $\\lim_{x \\to 0^-} \\sin(1/x)$ <strong>non esistono</strong>: la funzione oscilla infinitamente tra $-1$ e $1$ in qualsiasi intorno di $0$.</p><!-- L24 REPAIR g4 --><figure class="figura" data-id="analisi1_lez24c_g4"><svg xmlns:xlink="http://www.w3.org/1999/xlink" width="640pt" height="400pt" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" version="1.1">

      {
        id: "s24-prolungamento",
        type: "section",
        title: "Prolungamento per continuità",
        icon: "🩹",
        content: `<p>Come suggerisce il nome, una discontinuità eliminabile può essere "rimossa" modificando la funzione in un singolo punto.</p>`,
        subsections: [
          {
            subtitle: "Definizione",
            content: `<p>Sia $f$ una funzione con una discontinuità eliminabile in $x_0$, e sia $L = \\lim_{x \\to x_0} f(x)$. La funzione $\\tilde{f}$, definita come</p>
<p>$$\\tilde{f}(x) = \\begin{cases} f(x) & \\text{se } x \\in \\text{dom}(f) \\setminus \\{x_0\\} \\\\ L & \\text{se } x = x_0 \\end{cases}$$</p>
<p>è detta <strong>prolungamento per continuità</strong> di $f$ in $x_0$.</p>`
          },
          {
            subtitle: "Osservazione",
            content: `<p>La funzione $\\tilde{f}$ è, per costruzione, continua in $x_0$. Questa operazione è possibile <strong>solo</strong> per le discontinuità eliminabili, poiché richiede che il limite $L$ esista e sia finito. Non è possibile "riparare" in questo modo una discontinuità di salto o di seconda specie.</p>`
          }
        ]

      {
        id: "s24-esercizi-intro",
        type: "integrazione_box",

        icon: "📝",

      {
        id: "s24-es-teoria-1",
        type: "esercizio",
        title: "Teoria 1",
        kind: "teoria",
        source: "integrazione",
        icon: "📘",
        content: `<p>Dai la definizione di asintoto orizzontale per $x\\to+\\infty$ e per $x\\to-\\infty$. Poi spiega perché la funzione $f(x)=e^x$ ammette asintoto orizzontale solo per $x\\to-\\infty$.</p>`,
        solution: `<p>Sia $f:A\\to\\mathbb{R}$ con $A\\subseteq\\mathbb{R}$ e sia $+\\infty$ punto di accumulazione per $A$ (per esempio $(a,+\\infty)\\subseteq A$ per qualche $a\\in\\mathbb{R}$). La retta $y=c$, con $c\\in\\mathbb{R}$, si dice asintoto orizzontale per $f$ per $x\\to+\\infty$ se $\\lim_{x\\to+\\infty}f(x)=c$. Analogamente, se $-\\infty$ è punto di accumulazione per $A$, la retta $y=c$ è asintoto orizzontale per $x\\to-\\infty$ se $\\lim_{x\\to-\\infty}f(x)=c$.</p>
<p>È essenziale che $c$ sia un <strong>numero reale</strong>: se il limite è infinito o non esiste, l'asintoto orizzontale non c'è.</p>
<p>Per $f(x)=e^x$, che ha dominio $\\mathbb{R}$, si ha $\\lim_{x\\to-\\infty}e^x=0$: il limite è finito e vale $0$, dunque $y=0$ (l'asse delle ascisse) è asintoto orizzontale per $x\\to-\\infty$. Invece $\\lim_{x\\to+\\infty}e^x=+\\infty$: il limite non è finito, quindi per $x\\to+\\infty$ nessuna retta orizzontale $y=c$ può soddisfare la definizione e l'asintoto orizzontale non esiste.</p>
<p>Si noti che i due comportamenti sono indipendenti: una funzione può avere asintoto orizzontale da un solo lato, da entrambi (eventualmente con valori diversi) o da nessuno.</p>`
      },

      {
        id: "s24-es-teoria-2",
        type: "esercizio",
        title: "Teoria 2",
        kind: "teoria",
        source: "integrazione",
        icon: "📘",
        content: `<p>Dai la definizione di asintoto verticale da destra, da sinistra e bilaterale, precisando le ipotesi di accumulazione, e applicala alle funzioni $f(x)=\\frac{1}{x}$, $g(x)=\\frac{1}{x^2}$ e $h(x)=\\ln x$ nel punto $x_0=0$.</p>`,
        solution: `<p>Sia $f:A\\to\\mathbb{R}$ e $x_0\\in\\mathbb{R}$. Se $x_0$ è punto di accumulazione per $A\\cap(x_0,+\\infty)$, la retta $x=x_0$ si dice asintoto verticale da destra per $f$ quando $\\lim_{x\\to x_0^+}f(x)=+\\infty$ oppure $\\lim_{x\\to x_0^+}f(x)=-\\infty$; simmetricamente, se $x_0$ è di accumulazione per $A\\cap(-\\infty,x_0)$, la retta $x=x_0$ è asintoto verticale da sinistra quando $\\lim_{x\\to x_0^-}f(x)=\\pm\\infty$. Si parla di asintoto verticale (bilaterale) se $x_0$ è di accumulazione da entrambi i lati e la retta è asintoto sia da destra sia da sinistra. L'ipotesi di accumulazione dal lato giusto serve perché altrimenti il limite laterale non è nemmeno definibile.</p>
<p><strong>Esempi.</strong> Per $f(x)=1/x$ si ha $A=\\mathbb{R}\\setminus\\{0\\}$ e $0$ è di accumulazione da entrambi i lati; poiché $\\lim_{x\\to0^+}\\frac1x=+\\infty$ e $\\lim_{x\\to0^-}\\frac1x=-\\infty$, la retta $x=0$ è asintoto verticale bilaterale (con limiti di segno opposto).</p>
<p>Per $g(x)=1/x^2$ si ha $\\lim_{x\\to0^+}\\frac{1}{x^2}=\\lim_{x\\to0^-}\\frac{1}{x^2}=+\\infty$: anche qui $x=0$ è asintoto verticale bilaterale, ma con lo stesso segno dai due lati.</p>
<p>Per $h(x)=\\ln x$ il dominio è $(0,+\\infty)$ e $0$ è punto di accumulazione solo da destra: da $\\lim_{x\\to0^+}\\ln x=-\\infty$ segue che $x=0$ è asintoto verticale da destra, mentre la questione "da sinistra" non si pone, perché a sinistra di $0$ la funzione non è definita.</p>`
      },

      {
        id: "s24-es-teoria-3",
        type: "esercizio",
        title: "Teoria 3",
        kind: "teoria",
        source: "integrazione",
        icon: "📘",
        content: `<p>Enuncia la definizione di discontinuità eliminabile di una funzione $f$ in un punto $x_0$ e quella di prolungamento per continuità; verifica poi che il prolungamento $\\tilde f$ è effettivamente continuo in $x_0$.</p>`,
        solution: `<p>Sia $f: A \\to \\mathbb{R}$ e sia $x_0$ un punto di accumulazione di $A$. Si dice che $f$ ha in $x_0$ una discontinuità eliminabile se esiste finito $L=\\lim_{x\\to x_0} f(x)$ e si ha $L\\neq f(x_0)$, oppure $x_0\\notin \\text{dom}(f)$.</p>
<p>In tal caso si definisce il prolungamento per continuità $\\tilde f:\\ \\text{dom}(f)\\cup\\{x_0\\}\\to\\mathbb{R}$ ponendo $\\tilde f(x)=f(x)$ se $x\\in \\text{dom}(f)\\setminus\\{x_0\\}$ e $\\tilde f(x_0)=L$.</p>
<p><strong>Verifica della continuità.</strong> Poiché $\\tilde f(x)=f(x)$ per ogni $x\\neq x_0$, il limite per $x\\to x_0$ dipende solo dai valori in punti diversi da $x_0$, dunque</p>
<p>$$\\lim_{x\\to x_0}\\tilde f(x)=\\lim_{x\\to x_0} f(x)=L=\\tilde f(x_0)$$</p>
<p>che è esattamente la definizione di continuità di $\\tilde f$ in $x_0$.</p>
<p>L'operazione è possibile solo in questo caso, perché la continuità in $x_0$ richiede che il limite esista e sia finito: con un salto i due limiti laterali sono diversi e nessuna scelta di $\\tilde f(x_0)$ può coincidere con entrambi; con una discontinuità di seconda specie il limite non esiste o è infinito.</p>`
      },

      {
        id: "s24-es-teoria-4",
        type: "esercizio",
        title: "Teoria 4",
        kind: "teoria",
        source: "integrazione",
        icon: "📘",
        content: `<p>Enuncia la proposizione che fornisce i coefficienti dell'asintoto obliquo e dimostra la formula $m=\\lim_{x\\to+\\infty}\\frac{f(x)}{x}$.</p>`,
        solution: `<p><strong>Enunciato.</strong> Se la retta $y=mx+q$, con $m,q\\in\\mathbb{R}$ e $m\\neq 0$, è asintoto obliquo per $f$ per $x\\to+\\infty$, cioè se $\\lim_{x\\to+\\infty}[f(x)-(mx+q)]=0$, allora $m=\\lim_{x\\to+\\infty}\\frac{f(x)}{x}$ e $q=\\lim_{x\\to+\\infty}[f(x)-mx]$; viceversa, se questi due limiti esistono, sono finiti e $m\\neq 0$, la retta $y=mx+q$ è asintoto obliquo.</p>
<p><strong>Dimostrazione della formula per $m$.</strong> Poniamo $g(x)=f(x)-mx-q$, cosicché per ipotesi $g(x)\\to 0$ per $x\\to+\\infty$, ossia $g(x)=o(1)$. Per $x$ in un intorno di $+\\infty$ si ha $x\\neq 0$, quindi possiamo dividere per $x$ l'identità $f(x)=mx+q+g(x)$ ottenendo</p>
<p>$$\\frac{f(x)}{x}=m+\\frac{q}{x}+\\frac{g(x)}{x}$$</p>
<p>Ora $\\lim_{x\\to+\\infty}\\frac{q}{x}=0$ (costante diviso infinito) e $\\lim_{x\\to+\\infty}\\frac{g(x)}{x}=0$ (infinitesimo diviso infinito, cioè $\\frac{o(1)}{x}=o(1)$). Per l'algebra dei limiti il membro di destra tende a $m$, dunque $\\lim_{x\\to+\\infty}\\frac{f(x)}{x}=m$.</p>
<p>Per $q$ basta osservare che $f(x)-mx=q+g(x)\\to q$, da cui $q=\\lim_{x\\to+\\infty}[f(x)-mx]$. Le stesse formule, con $+\\infty$ sostituito da $-\\infty$, valgono per l'asintoto obliquo sinistro.</p>`
      },

      {
        id: "s24-es-scritto-1",
        type: "esercizio",
        title: "Scritto 1",
        kind: "scritto",
        source: "integrazione",
        icon: "✏️",
        content: `<p>Determina il dominio e tutti gli asintoti (verticali, orizzontali, obliqui) della funzione $f(x)=\\dfrac{3x-2}{x+4}$.</p>`,
        solution: `<p><strong>Dominio.</strong> Serve $x+4\\neq 0$, dunque $A=\\mathbb{R}\\setminus\\{-4\\}$.</p>
<p><strong>Zero.</strong> $3x-2=0\\iff x=\\frac{2}{3}$, quindi $f$ incontra l'asse $x$ in $\\left(\\frac{2}{3},0\\right)$; inoltre $f(0)=-\\frac{1}{2}$.</p>
<p><strong>Asintoto verticale.</strong> In $x=-4$ il numeratore vale $3(-4)-2=-14\\neq 0$, mentre il denominatore si annulla, quindi</p>
<p>$$\\lim_{x\\to-4^{+}}\\frac{3x-2}{x+4}=\\frac{-14}{0^{+}}=-\\infty,\\qquad \\lim_{x\\to-4^{-}}\\frac{3x-2}{x+4}=\\frac{-14}{0^{-}}=+\\infty$$</p>
<p>dunque la retta $x=-4$ è asintoto verticale.</p>
<p><strong>Asintoti orizzontali.</strong></p>
<p>$$\\lim_{x\\to\\pm\\infty}\\frac{3x-2}{x+4}=\\lim_{x\\to\\pm\\infty}\\frac{x\\left(3-\\frac{2}{x}\\right)}{x\\left(1+\\frac{4}{x}\\right)}=3$$</p>
<p>quindi $y=3$ è asintoto orizzontale sia per $x\\to+\\infty$ sia per $x\\to-\\infty$.</p>
<p><strong>Asintoti obliqui.</strong> Non ce ne sono, perché la presenza dell'asintoto orizzontale forza $m=\\lim_{x\\to\\pm\\infty}\\frac{f(x)}{x}=0$, mentre un asintoto obliquo richiede $m\\neq 0$.</p>
<p>Utile anche la riscrittura $f(x)=3-\\frac{14}{x+4}$, che mostra subito entrambi gli asintoti e che $f(x)\\lt 3$ per $x\\gt-4$, $f(x)\\gt 3$ per $x\\lt-4$.</p>

      {
        id: "s24-es-scritto-2",
        type: "esercizio",
        title: "Scritto 2",
        kind: "scritto",
        source: "integrazione",
        icon: "✏️",
        content: `<p>Determina il dominio, gli zeri e tutti gli asintoti (verticali, orizzontali, obliqui) della funzione $f(x)=\\dfrac{2x^2-1}{x-1}$.</p>`,
        solution: `<p>Il denominatore si annulla solo per $x=1$, quindi $D=\\mathbb{R}\\setminus\\{1\\}$ e su $D$ la funzione è continua, essendo quoziente di polinomi con denominatore non nullo.</p>
<p><strong>Zeri.</strong> $2x^2-1=0$ per $x=\\pm\\frac{1}{\\sqrt2}$, entrambi in $D$. Eseguendo la divisione, $2x^2-1=(x-1)(2x+2)+1$, cioè</p>
<p>$$f(x)=2x+2+\\frac{1}{x-1}$$</p>
<p><strong>Asintoto verticale.</strong> $x_0=1$ è punto di accumulazione per $D$ da entrambi i lati e il numeratore in $1$ vale $2\\cdot1^2-1=1\\gt 0$; poiché $x-1\\to0^+$ per $x\\to1^+$ e $x-1\\to0^-$ per $x\\to1^-$,</p>
<p>$$\\lim_{x\\to1^+}f(x)=+\\infty ,\\qquad \\lim_{x\\to1^-}f(x)=-\\infty$$</p>
<p>dunque $x=1$ è asintoto verticale bilaterale.</p>
<p><strong>Comportamento a $\\pm\\infty$.</strong> $\\lim_{x\\to\\pm\\infty}f(x)=\\pm\\infty$, quindi non ci sono asintoti orizzontali. Calcoliamo</p>
<p>$$m=\\lim_{x\\to\\pm\\infty}\\frac{f(x)}{x}=\\lim_{x\\to\\pm\\infty}\\frac{2x^2-1}{x^2-x}=2$$</p>
<p>$$q=\\lim_{x\\to\\pm\\infty}\\left(f(x)-2x\\right)=\\lim_{x\\to\\pm\\infty}\\frac{2x^2-1-2x(x-1)}{x-1}=\\lim_{x\\to\\pm\\infty}\\frac{2x-1}{x-1}=2$$</p>
<p>Entrambi i limiti sono finiti con $m\\neq0$, quindi $y=2x+2$ è asintoto obliquo sia per $x\\to+\\infty$ sia per $x\\to-\\infty$. La verifica diretta conferma: $f(x)-(2x+2)=\\frac{1}{x-1}=o(1)$ per $x\\to\\pm\\infty$.</p>

      {
        id: "s24-es-scritto-3",
        type: "esercizio",
        title: "Scritto 3",
        kind: "scritto",
        source: "integrazione",
        icon: "✏️",
        content: `<p>Sia $f(x)=\\dfrac{x^2-3x}{x}$ per $x\\neq 0$ e $f(0)=1$. Classifica il punto $x_0=0$ e, se possibile, scrivi il prolungamento per continuità di $f$.</p>`,
        solution: `<p>Per $x\\neq 0$ si semplifica: $f(x)=\\dfrac{x(x-3)}{x}=x-3$. Quindi</p>
<p>$$\\lim_{x\\to 0^-}f(x)=\\lim_{x\\to 0^+}f(x)=\\lim_{x\\to 0}(x-3)=-3$$</p>
<p>il limite esiste, è finito e i limiti laterali coincidono. Poiché però $f(0)=1\\neq -3$, la funzione non è continua in $0$ e la discontinuità è <strong>eliminabile</strong>.</p>
<p>Il prolungamento per continuità si ottiene ridefinendo il valore nel punto: $\\tilde f(x)=x-3$ per ogni $x\\in\\mathbb{R}$, cioè $\\tilde f(x)=f(x)$ per $x\\neq 0$ e $\\tilde f(0)=-3$. In particolare $\\tilde f$ è continua su tutto $\\mathbb{R}$ (è un polinomio).</p>

      {
        id: "s24-es-scritto-4",
        type: "esercizio",
        title: "Scritto 4",
        kind: "scritto",
        source: "integrazione",
        icon: "✏️",
        content: `<p>Data $f(x)=\\dfrac{2x^2-3x+1}{x+1}$, determina dominio, asintoto verticale e asintoto obliquo per $x\\to+\\infty$ e per $x\\to-\\infty$.</p>`,
        solution: `<p><strong>Dominio.</strong> $x+1\\neq 0$, quindi $A=\\mathbb{R}\\setminus\\{-1\\}$.</p>
<p><strong>Zeri.</strong> $2x^2-3x+1=(2x-1)(x-1)=0\\iff x=\\frac{1}{2}$ oppure $x=1$.</p>
<p><strong>Asintoto verticale.</strong> In $x=-1$ il numeratore vale $2+3+1=6\\neq 0$, dunque</p>
<p>$$\\lim_{x\\to-1^{+}}f(x)=\\frac{6}{0^{+}}=+\\infty,\\qquad \\lim_{x\\to-1^{-}}f(x)=\\frac{6}{0^{-}}=-\\infty$$</p>
<p>e $x=-1$ è asintoto verticale.</p>
<p><strong>Asintoti orizzontali.</strong> $\\lim_{x\\to\\pm\\infty}f(x)=\\pm\\infty$ (grado del numeratore maggiore di uno rispetto al denominatore), quindi non ce ne sono e cerchiamo l'obliquo.</p>
<p><strong>Coefficiente angolare.</strong></p>
<p>$$m=\\lim_{x\\to+\\infty}\\frac{f(x)}{x}=\\lim_{x\\to+\\infty}\\frac{2x^2-3x+1}{x^2+x}=\\lim_{x\\to+\\infty}\\frac{x^2\\left(2-\\frac{3}{x}+\\frac{1}{x^2}\\right)}{x^2\\left(1+\\frac{1}{x}\\right)}=2$$</p>
<p>finito e non nullo.</p>
<p><strong>Termine noto.</strong></p>
<p>$$q=\\lim_{x\\to+\\infty}[f(x)-2x]=\\lim_{x\\to+\\infty}\\frac{2x^2-3x+1-2x(x+1)}{x+1}=\\lim_{x\\to+\\infty}\\frac{-5x+1}{x+1}=-5$$</p>
<p>Dunque $y=2x-5$ è asintoto obliquo per $x\\to+\\infty$. Per $x\\to-\\infty$ i calcoli sono identici (rapporto di polinomi, dominano i termini di grado massimo): $m=2$ e $q=-5$, quindi $y=2x-5$ è asintoto obliquo anche a $-\\infty$.</p>
<p>Verifica con la divisione dei polinomi: $f(x)=2x-5+\\dfrac{6}{x+1}$, e infatti $f(x)-(2x-5)=\\dfrac{6}{x+1}\\to 0$ per $x\\to\\pm\\infty$; dal segno di $\\frac{6}{x+1}$ si vede che il grafico sta sopra l'asintoto per $x\\gt-1$ e sotto per $x\\lt-1$.</p>

        back: "Se $+\\infty$ è punto di accumulazione per il dominio $A$ (per esempio $(a,+\\infty) \\subseteq A$) e $\\lim_{x \\to +\\infty} f(x) = c$ con $c \\in \\mathbb{R}$. Se il limite è infinito o non esiste, l'asintoto orizzontale non c'è. La definizione è analoga per $x \\to -\\infty$, e i due comportamenti sono indipendenti."

        back: "La retta $y=mx+q$ (con $m,q \\in \\mathbb{R}$, $m \\neq 0$) è asintoto obliquo per $x \\to +\\infty$ se $\\lim_{x \\to +\\infty} [f(x)-(mx+q)] = 0$, cioè la distanza verticale fra grafico e retta tende a zero. Si richiede $m \\neq 0$ perché con $m=0$ la condizione $\\lim_{x\\to+\\infty}[f(x)-q]=0$ è esattamente la definizione di asintoto orizzontale."

      },
