            content: `<p>Il numero di Nepero, indicato con $e$, è un numero reale <strong>irrazionale</strong>, il cui valore approssimato è</p>

<p>Esso è un numero <strong>trascendente</strong> e, in particolare, è <strong>maggiore di 1</strong>.</p>`

            content: `<p>Si definisce <strong>funzione esponenziale</strong> con base $e$ la funzione $f: \\mathbb{R} \\to \\mathbb{R}^+$ definita da</p>

          },
          {
            subtitle: "Funzione logaritmica naturale",
            content: `<p>Si definisce <strong>funzione logaritmica</strong> con base $e$ la funzione inversa dell'esponenziale, $f: \\mathbb{R}^+ \\to \\mathbb{R}$. Essa si indica in diversi modi:</p>
<p>$$f(x) = \\log_e(x) = \\ln(x) = \\log(x)$$</p>
<p>Quando la base del logaritmo non è specificata, in questo corso si intenderà quasi sempre la base $e$. Questo logaritmo è detto <strong>logaritmo naturale</strong>.</p>`
          }

        content: `<p>Introduciamo ora una famiglia di funzioni molto importanti, costruite a partire dalla funzione esponenziale: le <strong>funzioni iperboliche</strong>.</p>
<p><strong>Coseno iperbolico</strong>:</p>
<p>$$\\cosh(x) := \\frac{e^x + e^{-x}}{2}$$</p>
<p><strong>Seno iperbolico</strong>:</p>
<p>$$\\sinh(x) := \\frac{e^x - e^{-x}}{2}$$</p>`,

          {
            subtitle: "Dominio, immagine e monotonia",
            content: `<p><strong>Dominio.</strong> Il dominio naturale di $\\cosh(x)$ è tutto $\\mathbb{R}$, poiché l'esponenziale è definito per ogni numero reale:</p>
<p>$$D = \\mathbb{R}$$</p>
<p><strong>Monotonia.</strong> La funzione è strettamente decrescente per $x \\lt 0$ e strettamente crescente per $x \\gt 0$.</p>
<p><strong>Immagine.</strong> La funzione ha un punto di minimo assoluto in $x = 0$; calcoliamo il suo valore:</p>
<p>$$\\cosh(0) = \\frac{e^0 + e^{-0}}{2} = \\frac{1+1}{2} = 1$$</p>
<p>Poiché $\\cosh(x) \\ge \\cosh(0) = 1$ per ogni $x \\in \\mathbb{R}$ (il valore $1$ è il minimo assoluto), $\\cosh$ è continua e $\\cosh(x) \\to +\\infty$ per $x \\to \\pm\\infty$, per il <strong>teorema dei valori intermedi</strong> la sua immagine è l'intervallo $[1, +\\infty)$:</p>
<p>$$\\cosh: \\mathbb{R} \\to [1, +\\infty)$$</p>
<p><strong>Biettività.</strong> La funzione, considerata su tutto $\\mathbb{R}$, non è iniettiva (essendo pari, ad esempio $\\cosh(-1) = \\cosh(1)$), e quindi non è biettiva. Tuttavia, se la restringiamo al dominio $[0, +\\infty)$, la funzione diventa strettamente crescente e quindi biettiva su $[1, +\\infty)$.</p>`
          }

      {
        id: "s10-es-segno-sinh",
        type: "esercizio_svolto",
        title: "Esercizio svolto — Studio del segno di $\\sinh(x)$",
        icon: "✎",
        source: "docente",
        content: `<p>Studiamo per quali valori di $x$ la funzione $\\sinh(x)$ è positiva, negativa o nulla.</p>`,
        steps: [
          `<p>Impostiamo la disequazione $\\sinh(x) \\ge 0$:</p><p>$$\\frac{e^x - e^{-x}}{2} \\ge 0$$</p>`,
          `<p>Poiché il denominatore $2$ è positivo, la disequazione è equivalente a:</p><p>$$e^x - e^{-x} \\ge 0$$</p>`,
          `<p>Scriviamo $e^{-x}$ come $1/e^x$:</p><p>$$e^x - \\frac{1}{e^x} \\ge 0$$</p>`,
          `<p>Facciamo il denominatore comune:</p><p>$$\\frac{(e^x)^2 - 1}{e^x} \\ge 0 \\quad \\Rightarrow \\quad \\frac{e^{2x} - 1}{e^x} \\ge 0$$</p>`,
          `<p>Il denominatore $e^x$ è sempre strettamente positivo: quindi il segno della frazione dipende solo dal numeratore.</p><p>$$e^{2x} - 1 \\ge 0 \\quad \\Rightarrow \\quad e^{2x} \\ge 1$$</p>`,
          `<p>Poiché $1 = e^0$, abbiamo:</p><p>$$e^{2x} \\ge e^0$$</p>`,
          `<p>La funzione esponenziale $f(t) = e^t$ è strettamente crescente: possiamo quindi passare alla disuguaglianza tra gli esponenti mantenendo il verso.</p><p>$$2x \\ge 0 \\quad \\Rightarrow \\quad x \\ge 0$$</p>`,
          `<p><strong>Conclusione:</strong> $\\sinh(x) \\gt 0$ per $x \\gt 0$, $\\sinh(x) \\lt 0$ per $x \\lt 0$ e $\\sinh(x) = 0$ per $x = 0$.</p>`
        ]
      },

      {
        id: "s10-settsenh",
        type: "section",
        title: "Settore seno iperbolico",
        icon: "🔄",
        content: `<p>Poiché le funzioni iperboliche (o loro opportune restrizioni) sono biettive, possiamo definirne le funzioni inverse.</p>
<p>La funzione $f(x) = \\sinh(x)$ è strettamente crescente da $\\mathbb{R}$ in $\\mathbb{R}$. Pertanto è <strong>biettiva</strong> e ammette funzione inversa.</p>`,
        subsections: [
          {
            subtitle: "Definizione: settore seno iperbolico",
            content: `<p>La funzione inversa del seno iperbolico è chiamata <strong>settore seno iperbolico</strong> e si denota con $\\text{settsenh}(x)$ oppure $\\sinh^{-1}(x)$. È una funzione definita da $\\mathbb{R}$ in $\\mathbb{R}$:</p>
<p>$$\\text{settsenh}: \\mathbb{R} \\to \\mathbb{R}$$</p>`
          },
          {
            subtitle: "Grafico dell'inversa",
            content: `<p>Come per ogni funzione invertibile, il grafico della funzione inversa — il settore seno iperbolico — si ottiene per <strong>simmetria</strong> del grafico di $\\sinh(x)$ rispetto alla bisettrice del primo e terzo quadrante, ovvero la retta $y = x$.</p>`
          }
        ]
      },

      {
        id: "s10-es-settsenh",
        type: "esercizio_svolto",
        title: "Esercizio svolto — Calcolo esplicito di $\\text{settsenh}(x)$",
        icon: "✎",
        source: "docente",
        content: `<p>Vogliamo trovare l'espressione analitica di $y = \\text{settsenh}(x)$. Questo equivale a risolvere l'equazione $x = \\sinh(y)$ rispetto a $y$. Per comodità di notazione, risolviamo $y = \\sinh(x)$ rispetto a $x$.</p>`,
        steps: [
          `<p>Partiamo dall'equazione $y = \\sinh(x)$:</p><p>$$y = \\frac{e^x - e^{-x}}{2}$$</p>`,
          `<p>Moltiplichiamo per $2$ e scriviamo $e^{-x}$ come $1/e^x$:</p><p>$$2y = e^x - \\frac{1}{e^x}$$</p>`,
          `<p>Moltiplichiamo entrambi i membri per $e^x$ (che è sempre diverso da zero) per eliminare il denominatore:</p><p>$$2y\\,e^x = (e^x)^2 - 1$$</p>`,
          `<p>Riorganizziamo i termini per ottenere un'equazione di secondo grado nell'incognita $t = e^x$:</p><p>$$(e^x)^2 - 2y(e^x) - 1 = 0$$</p>`,
          `<p>Poniamo $t = e^x$ e risolviamo $t^2 - 2yt - 1 = 0$ con la formula risolutiva:</p><p>$$\\begin{aligned} t_{1,2} &= \\frac{-(-2y) \\pm \\sqrt{(-2y)^2 - 4(1)(-1)}}{2(1)} = \\frac{2y \\pm \\sqrt{4y^2 + 4}}{2} \\\\ &= \\frac{2y \\pm \\sqrt{4(y^2+1)}}{2} = \\frac{2y \\pm 2\\sqrt{y^2+1}}{2} = y \\pm \\sqrt{y^2+1} \\end{aligned}$$</p>`,
          `<p>Abbiamo quindi due possibili soluzioni per $t = e^x$:</p><p>$$e^x = y + \\sqrt{y^2+1} \\quad \\lor \\quad e^x = y - \\sqrt{y^2+1}$$</p>`,
          `<p><strong>Scartiamo la soluzione non accettabile.</strong> Poiché $t = e^x$, il suo valore deve essere sempre strettamente positivo. Ora</p><p>$$\\sqrt{y^2+1} \\gt \\sqrt{y^2} = |y| \\ge y \\qquad \\forall y \\in \\mathbb{R}$$</p><p>dunque $y - \\sqrt{y^2+1} \\lt 0$ sempre: questa soluzione va scartata.</p>`,
          `<p><strong>La radice rimasta è effettivamente positiva.</strong> Poiché $\\sqrt{y^2+1} \\gt |y|$, si ha</p><p>$$y + \\sqrt{y^2+1} \\gt y + |y| \\ge 0$$</p><p>l'argomento del logaritmo è quindi strettamente positivo per ogni $y$ reale, e possiamo applicare il logaritmo senza restrizioni. L'unica soluzione accettabile è dunque</p><p>$$e^x = y + \\sqrt{y^2+1}$$</p>`,
          `<p>Per ricavare $x$, applichiamo il logaritmo naturale a entrambi i membri:</p><p>$$x = \\ln\\!\\left(y + \\sqrt{y^2+1}\\right)$$</p>`,
          `<p>Scambiando le variabili $x$ e $y$ per ottenere la forma standard della funzione inversa, troviamo l'espressione analitica del settore seno iperbolico:</p><p>$$\\text{settsenh}(x) = \\ln\\!\\left(x + \\sqrt{x^2+1}\\right)$$</p>`
        ]
      },

      {
        id: "s10-settcosh",
        type: "section",
        title: "Settore coseno iperbolico",
        icon: "✂️",
        content: `<p>Consideriamo ora la funzione coseno iperbolico, $f(x) = \\cosh(x)$. Sappiamo che il suo dominio è tutto $\\mathbb{R}$, ma la sua immagine è l'intervallo $[1, +\\infty)$. La funzione <strong>non è iniettiva</strong>, poiché è pari ($\\cosh(x) = \\cosh(-x)$). Per poterla invertire dobbiamo <strong>restringere il dominio</strong>.</p>`,
        subsections: [
          {
            subtitle: "Definizione: restrizione del coseno iperbolico",
            content: `<p>Scegliamo di restringere il dominio a $[0, +\\infty)$: in questo intervallo $\\cosh(x)$ è strettamente crescente. Consideriamo dunque</p>
<p>$$\\cosh: [0, +\\infty) \\to [1, +\\infty)$$</p>
<p>Questa funzione è <strong>biiettiva</strong> e quindi invertibile.</p>`
          },
          {
            subtitle: "Definizione: settore coseno iperbolico",
            content: `<p>La funzione inversa della restrizione appena introdotta è chiamata <strong>settore coseno iperbolico</strong> e si denota con $\\text{settcosh}(x)$. Il suo dominio è $[1, +\\infty)$ e il suo codominio è $[0, +\\infty)$:</p>
<p>$$\\text{settcosh}: [1, +\\infty) \\to [0, +\\infty)$$</p>`
          },
          {
            subtitle: "Osservazione: calcolo dell'espressione analitica",
            content: `<p>Il procedimento per trovare l'espressione analitica di $\\text{settcosh}(x)$ è analogo a quello visto per $\\text{settsenh}(x)$. Si parte dall'equazione $y = \\cosh(x)$, si esplicita in termini di esponenziali e si risolve l'equazione di secondo grado rispetto a $e^x$. In questo caso, per $y \\gt 1$ si otterranno due soluzioni reali e positive distinte (coincidenti e uguali a $1$ per $y = 1$), ma solo quella maggiore o uguale a $1$ sarà accettabile poiché, avendo ristretto il dominio di $\\cosh(x)$ a $x \\ge 0$, dobbiamo avere $e^x \\ge e^0 = 1$.</p>`
          },
          {
            subtitle: "Osservazione: la formula (derivazione lasciata per esercizio)",
            content: `<p>La derivazione della formula è <strong>lasciata per esercizio</strong>. Il risultato finale è:</p>
<p>$$\\text{settcosh}(x) = \\ln\\!\\left(x + \\sqrt{x^2-1}\\right)$$</p>
<p>Il dominio di questa funzione è $x \\in [1, +\\infty)$, come ci aspettavamo.</p>`
          },
          {
            subtitle: "Grafico dell'inversa",
            content: `<p>Anche in questo caso il grafico di $\\text{settcosh}(x)$ è il simmetrico del grafico di $\\cosh(x)$ (ristretta a $x \\ge 0$) rispetto alla retta $y = x$. Il punto $(0,1)$ sul grafico di $\\cosh(x)$ corrisponde al punto $(1,0)$ sul grafico di $\\text{settcosh}(x)$.</p>`
          }
        ]
      },

      {
        id: "s10-setttanh",
        type: "section",
        title: "Tangente iperbolica e settore tangente iperbolica",
        icon: "🧮",
        content: `<p>La <strong>tangente iperbolica</strong> è definita come il rapporto tra il seno iperbolico e il coseno iperbolico:</p>
<p>$$\\tanh(x) = \\frac{\\sinh(x)}{\\cosh(x)} = \\frac{e^x - e^{-x}}{e^x + e^{-x}}$$</p>
<p>Moltiplicando numeratore e denominatore per $e^x$ otteniamo una forma più comoda:</p>
<p>$$\\tanh(x) = \\frac{e^{2x} - 1}{e^{2x} + 1}$$</p>`,
        subsections: [
          {
            subtitle: "Dominio, immagine, monotonia",
            content: `<p>Il dominio della tangente iperbolica è tutto $\\mathbb{R}$, poiché $\\cosh(x) \\ge 1$ e quindi non si annulla mai. Si può dimostrare che la sua immagine è l'intervallo $(-1, 1)$. La funzione è strettamente crescente su tutto $\\mathbb{R}$ e quindi <strong>invertibile</strong>.</p>`
          },
          {
            subtitle: "Definizione: settore tangente iperbolica",
            content: `<p>La funzione inversa di $\\tanh$ è il <strong>settore tangente iperbolica</strong>, denotato con $\\text{setttanh}(x)$. Il suo dominio è $(-1,1)$ (l'immagine di $\\tanh$) e il suo codominio è $\\mathbb{R}$:</p>
<p>$$\\text{setttanh}: (-1, 1) \\to \\mathbb{R}$$</p>`
          },
          {
            subtitle: "Osservazione: la formula (derivazione lasciata per esercizio)",
            content: `<p>Anche in questo caso la formula si può ricavare invertendo l'espressione analitica; la derivazione è <strong>lasciata per esercizio</strong>. Il risultato è:</p>
<p>$$\\text{setttanh}(x) = \\frac{1}{2} \\ln\\!\\left(\\frac{1+x}{1-x}\\right)$$</p>
<p>Il dominio di questa funzione è l'intervallo $(-1,1)$, che corrisponde all'immagine di $\\tanh(x)$.</p>`
          }
        ],
        formulas: [
          { label: "Tangente iperbolica", latex: "\\tanh(x) = \\frac{e^{2x}-1}{e^{2x}+1}" },
          { label: "Settore seno iperbolico", latex: "\\text{settsenh}(x) = \\ln\\!\\left(x+\\sqrt{x^2+1}\\right)" },
          { label: "Settore coseno iperbolico", latex: "\\text{settcosh}(x) = \\ln\\!\\left(x+\\sqrt{x^2-1}\\right)" },
          { label: "Settore tangente iperbolica", latex: "\\text{setttanh}(x) = \\frac{1}{2}\\ln\\!\\left(\\frac{1+x}{1-x}\\right)" }
        ]
      },

      {
        id: "s10-riepilogo-domini",
        type: "alert_box",
        title: "Riepilogo dei domini delle funzioni iperboliche inverse",
        icon: "⚠️",
        content: `<p>È importante ricordare i domini di queste nuove funzioni: all'esame sono la prima cosa che viene chiesta quando compaiono in una funzione composta.</p>`,
        table_compare: {
          headers: ["Funzione inversa", "Dominio", "Immagine"],
          rows: [
            ["$\\text{settsenh}(x)$", "$\\mathbb{R}$", "$\\mathbb{R}$"],
            ["$\\text{settcosh}(x)$", "$[1, +\\infty)$", "$[0, +\\infty)$"],
            ["$\\text{setttanh}(x)$", "$(-1, 1)$", "$\\mathbb{R}$"]
          ]
        }
      },

      {
        id: "s10-nome-settore",
        type: "note_box",
        title: "Origine del nome «Settore»",
        icon: "📝",
        content: `<p>Il nome "settore" per queste funzioni inverse deriva da un'interpretazione geometrica legata all'<strong>area di un settore di iperbole</strong>, in analogia a come le funzioni trigonometriche inverse (arcoseno, arcocoseno) sono legate alla <strong>lunghezza di un arco</strong> di circonferenza. Non approfondiremo questo aspetto nel corso.</p>`
      },

      {
        id: "s10-trasf-panoramica",
        type: "section",
        title: "Trasformazioni elementari dei grafici — panoramica",
        icon: "🗺️",
        content: `<p>Data una funzione $f(x)$ di cui conosciamo il grafico, è possibile ottenere i grafici di altre funzioni correlate tramite semplici trasformazioni geometriche. Questa sezione è solo una <strong>panoramica</strong>: ciascuna trasformazione è ripresa in dettaglio nelle sezioni successive.</p>
<p>Le trasformazioni che studieremo sono quattro:</p>
<p>1. <strong>valore assoluto</strong> $|f(x)|$ — ribaltamento verso l'alto delle parti negative;<br>
2. <strong>parte positiva e parte negativa</strong> $f_+(x)$, $f_-(x)$ — "spegnimento" di una delle due metà;<br>
3. <strong>traslazioni</strong> $f(x)+a$ e $f(x-a)$ — spostamenti rigidi verticali e orizzontali;<br>
4. <strong>dilatazioni e compressioni</strong> $a\\,f(x)$ e $f(a\\,x)$ — riscalamenti delle ordinate e delle ascisse.</p>`
      },

      {
        id: "s10-valore-assoluto",
        type: "section",
        title: "Valore assoluto di una funzione",
        icon: "🔺",
        content: `<p>Consideriamo una funzione $f(x)$. Ci chiediamo: chi è il grafico della funzione $g(x) = |f(x)|$? Il valore assoluto (o modulo) di una funzione si comporta esattamente come il valore assoluto di un numero.</p>`,
        subsections: [
          {
            subtitle: "Definizione",
            content: `<p>Data una funzione $f: D \\to \\mathbb{R}$, la sua funzione valore assoluto, denotata con $|f(x)|$, è definita come:</p>
<p>$$|f(x)| = \\begin{cases} f(x) & \\text{se } f(x) \\ge 0 \\\\ -f(x) & \\text{se } f(x) \\lt 0 \\end{cases}$$</p>`
          },
          {
            subtitle: "Interpretazione grafica",
            content: `<p>Dal punto di vista grafico, per ottenere il grafico di $|f(x)|$ a partire da quello di $f(x)$ si procede così:</p>
<p>• le parti del grafico di $f(x)$ che si trovano <strong>sopra o sull'asse delle ascisse</strong> (dove $f(x) \\ge 0$) rimangono invariate;<br>
• le parti del grafico di $f(x)$ che si trovano <strong>sotto l'asse delle ascisse</strong> (dove $f(x) \\lt 0$) vengono "ribaltate", ovvero riflesse simmetricamente rispetto all'asse $x$.</p>
<p>Si noti che <strong>il dominio non cambia</strong>: $|f|$ è definita esattamente sullo stesso insieme $D$ su cui è definita $f$.</p>`
          },
          {
            subtitle: "Esempio: $g(x) = |x^2-1|$",
            content: `<p>Consideriamo la funzione $f(x) = x^2 - 1$. Il suo grafico è una parabola con vertice in $(0,-1)$ che interseca l'asse $x$ in $x = -1$ e $x = 1$.</p>

<p>Vogliamo disegnare il grafico di $g(x) = |x^2-1|$. Per prima cosa studiamo il segno di $f(x)$:</p>
<p>$$x^2 - 1 \\ge 0 \\quad \\Rightarrow \\quad x^2 \\ge 1 \\quad \\Rightarrow \\quad x \\le -1 \\ \\lor \\ x \\ge 1$$</p>
<p>Quindi la funzione $|x^2-1|$ può essere scritta a tratti:</p>
<p>$$|x^2-1| = \\begin{cases} x^2 - 1 & \\text{se } x \\le -1 \\ \\lor \\ x \\ge 1 \\\\ -(x^2-1) = 1 - x^2 & \\text{se } -1 \\lt x \\lt 1 \\end{cases}$$</p>
<p>Il grafico di $|x^2-1|$ coincide con quello di $x^2-1$ per $x \\in (-\\infty,-1] \\cup [1,+\\infty)$. Nell'intervallo $(-1,1)$, dove la parabola era negativa, il grafico diventa quello di $1-x^2$, che è una parabola con la concavità verso il basso e vertice in $(0,1)$.</p>

      {
        id: "s10-parti",
        type: "section",
        title: "Parte positiva e parte negativa di una funzione",
        icon: "➕",
        content: `<p>Oltre al valore assoluto, possiamo definire altre due funzioni molto utili a partire da una funzione $f(x)$: la sua <strong>parte positiva</strong> e la sua <strong>parte negativa</strong>.</p>`,
        subsections: [
          {
            subtitle: "Definizione: parte positiva",
            content: `<p>Data una funzione $f(x)$, la sua <strong>parte positiva</strong> $f_+(x)$ è definita come:</p>
<p>$$f_+(x) = \\begin{cases} f(x) & \\text{se } f(x) \\ge 0 \\\\ 0 & \\text{se } f(x) \\lt 0 \\end{cases}$$</p>
<p>Graficamente, si tiene la parte del grafico di $f(x)$ sopra l'asse $x$ e si annulla la parte sotto. Un modo equivalente per definirla è:</p>
<p>$$f_+(x) = \\max\\{f(x), 0\\}$$</p>`
          },
          {
            subtitle: "Definizione: parte negativa",
            content: `<p>Data una funzione $f(x)$, la sua <strong>parte negativa</strong> $f_-(x)$ è definita come:</p>
<p>$$f_-(x) = \\begin{cases} 0 & \\text{se } f(x) \\ge 0 \\\\ -f(x) & \\text{se } f(x) \\lt 0 \\end{cases}$$</p>
<p>Graficamente, si annulla la parte del grafico di $f(x)$ sopra l'asse $x$ e si "ribalta" verso l'alto la parte che si trovava sotto. Un modo equivalente per definirla è:</p>
<p>$$f_-(x) = \\max\\{-f(x), 0\\}$$</p>
<p><strong>Osservazione.</strong> Per convenzione, sia $f_+(x)$ sia $f_-(x)$ sono funzioni <strong>sempre non negative</strong>: $f_+(x) \\ge 0$ e $f_-(x) \\ge 0$ per ogni $x$.</p>`
          },
          {
            subtitle: "Proposizione: relazioni fondamentali",
            content: `<p>Per ogni funzione $f(x)$ valgono le seguenti identità:</p>
<p>$$|f(x)| = f_+(x) + f_-(x), \\qquad f(x) = f_+(x) - f_-(x)$$</p>
<p><strong>Dimostrazione.</strong> Analizziamo i due casi possibili per il segno di $f(x)$.</p>
<p><strong>Caso 1: $f(x) \\ge 0$.</strong> Per definizione $f_+(x) = f(x)$, $f_-(x) = 0$, $|f(x)| = f(x)$. Allora</p>
<p>$$f_+(x) + f_-(x) = f(x) + 0 = f(x) = |f(x)|, \\qquad f_+(x) - f_-(x) = f(x) - 0 = f(x)$$</p>
<p><strong>Caso 2: $f(x) \\lt 0$.</strong> Per definizione $f_+(x) = 0$, $f_-(x) = -f(x)$, $|f(x)| = -f(x)$. Allora</p>
<p>$$f_+(x) + f_-(x) = 0 + (-f(x)) = -f(x) = |f(x)|, \\qquad f_+(x) - f_-(x) = 0 - (-f(x)) = f(x)$$</p>
<p>Poiché le relazioni valgono in entrambi i casi, la proposizione è dimostrata. $\\square$</p>`
          }
        ],
        formulas: [
          { label: "Decomposizione di $f$", latex: "f(x) = f_+(x) - f_-(x)" },
          { label: "Decomposizione di $|f|$", latex: "|f(x)| = f_+(x) + f_-(x)" }
        ]
      },

      {
        id: "s10-traslazioni",
        type: "section",
        title: "Traslazioni",
        icon: "↔️",
        content: `<p>Le traslazioni sono le trasformazioni più semplici: spostano rigidamente il grafico senza deformarlo. La cosa a cui fare attenzione è <strong>il dominio</strong> e <strong>il segno</strong> del parametro.</p>`,
        subsections: [
          {
            subtitle: "Proposizione: traslazione verticale",
            content: `<p>Sia $f: D \\to \\mathbb{R}$ e sia $a \\in \\mathbb{R}$ una costante. La funzione</p>
<p>$$g(x) = f(x) + a, \\qquad x \\in D$$</p>
<p>ha lo <strong>stesso dominio</strong> $D$ di $f$ e il suo grafico si ottiene da quello di $f$ mediante una traslazione verticale. Più precisamente vale la corrispondenza tra punti</p>
<p>$$(x_0, y_0) \\in \\mathrm{graf}(f) \\iff (x_0,\\, y_0 + a) \\in \\mathrm{graf}(g)$$</p>
<p>cioè: se $y_0 = f(x_0)$, allora $g(x_0) = y_0 + a$. Quanto al segno del parametro:</p>
<p>• se $a \\gt 0$, la traslazione è verso l'<strong>alto</strong> di $a$;<br>
• se $a \\lt 0$, la traslazione è verso il <strong>basso</strong> di $|a|$;<br>
• se $a = 0$, il grafico resta invariato.</p>`
          },
          {
            subtitle: "Proposizione: traslazione orizzontale",
            content: `<p>Sia $f: D \\to \\mathbb{R}$ e sia $a \\in \\mathbb{R}$ una costante. La funzione</p>
<p>$$g(x) = f(x-a)$$</p>
<p>è definita per tutti gli $x$ tali che $x - a \\in D$: il suo dominio è dunque l'insieme traslato</p>
<p>$$D_g = \\{x \\in \\mathbb{R} : x - a \\in D\\} = D + a$$</p>
<p>Il grafico di $g$ si ottiene da quello di $f$ mediante una traslazione orizzontale, secondo la corrispondenza</p>
<p>$$(x_0, y_0) \\in \\mathrm{graf}(f) \\iff (x_0 + a,\\, y_0) \\in \\mathrm{graf}(g)$$</p>
<p>poiché $g(x_0+a) = f(x_0 + a - a) = f(x_0) = y_0$. Quanto al segno del parametro:</p>
<p>• se $a \\gt 0$, la trasformazione $f(x-a)$ corrisponde a una traslazione verso <strong>destra</strong> di $a$;<br>
• se $a \\lt 0$, la trasformazione $f(x-a)$ (che diventa $f(x+|a|)$) corrisponde a una traslazione verso <strong>sinistra</strong> di $|a|$.</p>`
          },
          {
            subtitle: "Spiegazione del segno",
            content: `<p>Vogliamo che la nuova funzione $g$ si comporti nel punto $x+a$ esattamente come la vecchia funzione $f$ si comportava nel punto $x$. Cioè vogliamo che $g(x+a) = f(x)$.</p>
<p>Se poniamo $t = x+a$, allora $x = t-a$. Sostituendo nell'uguaglianza otteniamo $g(t) = f(t-a)$. Questo significa che la funzione traslata è</p>
<p>$$g(x) = f(x-a)$$</p>`
          },
          {
            subtitle: "Attenzione al dominio",
            content: `<p>Quando $D \\neq \\mathbb{R}$ l'insieme di definizione <strong>non</strong> resta invariato e va ricalcolato imponendo la condizione sull'argomento. Per esempio, sia $f(x) = \\sqrt{x}$, con dominio $D = [0,+\\infty)$. Allora</p>
<p>$$g(x) = \\sqrt{x-2} \\quad \\text{è definita per } x-2 \\ge 0, \\ \\text{cioè } x \\in [2,+\\infty)$$</p>
<p>coerentemente con il fatto che il grafico (e quindi anche il suo punto iniziale, che da $(0,0)$ passa a $(2,0)$) è traslato di $2$ verso destra. Al contrario, $\\sqrt{x}+2$ ha ancora dominio $[0,+\\infty)$: la traslazione verticale non modifica il dominio.</p>`
          },
          {
            subtitle: "Esempio: traslazioni della parabola",
            content: `<p>Partiamo da $f(x) = x^2$, il cui grafico è una parabola con vertice in $V = (0,0)$, e confrontiamola con le due funzioni traslate</p>
<p>$$g(x) = x^2 + 2 \\quad \\text{(traslazione verticale, } a = 2\\text{)}, \\qquad h(x) = (x-2)^2 \\quad \\text{(traslazione orizzontale, } a = 2\\text{)}$$</p>
<p>I tre grafici hanno la stessa forma (stessa parabola, stessa concavità e stessa apertura) e differiscono solo per la posizione del vertice:</p>
<p>• vertice di $f$: $V_f = (0,0)$;<br>
• vertice di $g$: $V_g = (0,2)$, ottenuto da $V_f$ alzandolo di $2$ (le ascisse non cambiano);<br>
• vertice di $h$: $V_h = (2,0)$, ottenuto da $V_f$ spostandolo di $2$ verso destra (le ordinate non cambiano).</p>
<p>Lo si può controllare punto per punto: il punto $(1,1)$ del grafico di $f$ diventa $(1,3)$ sul grafico di $g$ (stessa $x$, ordinata aumentata di $2$) e diventa $(3,1)$ sul grafico di $h$ (stessa $y$, ascissa aumentata di $2$), perché $h(3) = (3-2)^2 = 1$. Si noti infine che $h(x) = (x-2)^2$ si annulla in $x=2$ e non in $x=0$: è questa la verifica più rapida del fatto che il segno meno nell'argomento produce uno spostamento verso destra.</p>`
          }
        ]
      },

      {
        id: "s10-alert-segno",
        type: "alert_box",
        title: "Attenzione al segno nelle traslazioni orizzontali",
        icon: "⚠️",
        content: `<p>L'errore comune è associare il segno "$-$" a una traslazione a <em>sinistra</em>. Ricordate: <strong>$f(x-a)$ con $a \\gt 0$ sposta il grafico a destra</strong>.</p>
<p>Esempio di controllo immediato: per $f(x) = x^2$, il vertice di $g(x) = (x-2)^2$ si trova in $x = 2$, quindi il grafico è traslato a destra.</p>`

      {
        id: "s10-dilatazioni",
        type: "section",
        title: "Dilatazioni e compressioni",
        icon: "🔍",
        content: `<p>Sia $a \\gt 0$ un fattore di scala. Distinguiamo il caso in cui $a$ moltiplica la funzione (effetto verticale) dal caso in cui moltiplica la variabile (effetto orizzontale, <strong>controintuitivo</strong>).</p>`,
        subsections: [
          {
            subtitle: "Proposizione: dilatazione/compressione verticale",
            content: `<p>Sia $f: D \\to \\mathbb{R}$ e sia $a \\gt 0$ una costante. La funzione</p>
<p>$$g(x) = a \\cdot f(x), \\qquad x \\in D$$</p>
<p>ha lo <strong>stesso dominio</strong> $D$ di $f$ e il suo grafico si ottiene moltiplicando per $a$ tutte le ordinate, secondo la corrispondenza</p>
<p>$$(x_0, y_0) \\in \\mathrm{graf}(f) \\iff (x_0,\\, a\\,y_0) \\in \\mathrm{graf}(g)$$</p>
<p>In altri termini, le distanze dei punti dall'asse orizzontale vengono moltiplicate per $a$, mentre gli zeri di $f$ restano fissi (se $f(x_0) = 0$ allora $g(x_0) = 0$).</p>
<p>• se $a \\gt 1$, si ha una <strong>dilatazione</strong> (il grafico si "allunga" verticalmente);<br>
• se $0 \\lt a \\lt 1$, si ha una <strong>compressione</strong> (il grafico si "schiaccia" verticalmente);<br>
• se $a = 1$, il grafico resta invariato.</p>`
          },
          {
            subtitle: "Esempio: dilatazione verticale della parabola",
            content: `<p>Confrontiamo $f(x) = x^2$ con $g(x) = 2x^2$, cioè il caso $a = 2 \\gt 1$. Il vertice $(0,0)$ non si muove, perché $2 \\cdot 0 = 0$. Prendiamo allora un punto non nullo: il punto $(1,1)$ del grafico di $f$ ha come corrispondente</p>
<p>$$(1,\\, 2 \\cdot 1) = (1,2) \\in \\mathrm{graf}(g), \\qquad \\text{infatti } g(1) = 2 \\cdot 1^2 = 2$$</p>
<p>Analogamente $(2,4)$ diventa $(2,8)$ e $(-1,1)$ diventa $(-1,2)$: l'ascissa resta la stessa, l'ordinata raddoppia. Il grafico di $2x^2$ è dunque una parabola "più stretta", perché per ogni $x \\neq 0$ sta due volte più lontano dall'asse delle ascisse rispetto a quello di $x^2$. Con $a = 1/2$ accadrebbe l'opposto: $(1,1)$ diventerebbe $(1,1/2)$ e la parabola apparirebbe più "aperta".</p>`
          },
          {
            subtitle: "Proposizione: dilatazione/compressione orizzontale",
            content: `<p>Sia $f: D \\to \\mathbb{R}$ e sia $a \\gt 0$ una costante. La funzione</p>
<p>$$g(x) = f(a \\cdot x)$$</p>
<p>è definita per tutti gli $x$ tali che $ax \\in D$: il suo dominio è dunque l'insieme riscalato</p>
<p>$$D_g = \\{x \\in \\mathbb{R} : ax \\in D\\} = \\tfrac{1}{a} D$$</p>
<p>La corrispondenza tra i punti dei due grafici è</p>
<p>$$(x_0, y_0) \\in \\mathrm{graf}(f) \\iff \\Bigl(\\tfrac{x_0}{a},\\, y_0\\Bigr) \\in \\mathrm{graf}(g)$$</p>
<p>cioè le ascisse vengono moltiplicate per $\\tfrac{1}{a}$, mentre le ordinate non cambiano.</p>
<p>• se $a \\gt 1$, si ha una <strong>compressione</strong> orizzontale (fattore $1/a \\lt 1$);<br>
• se $0 \\lt a \\lt 1$, si ha una <strong>dilatazione</strong> orizzontale (fattore $1/a \\gt 1$).</p>`
          },
          {
            subtitle: "Perché le ascisse si dividono per $a$",
            content: `<p>L'effetto è "controintuitivo" rispetto al caso verticale, ma la ragione è immediata se si ragiona sui punti. Supponiamo che $(x_0, y_0)$ appartenga al grafico di $f$, cioè $y_0 = f(x_0)$. Allora</p>
<p>$$g\\!\\left(\\frac{x_0}{a}\\right) = f\\!\\left(a \\cdot \\frac{x_0}{a}\\right) = f(x_0) = y_0$$</p>
<p>e dunque il punto corrispondente sul grafico di $g$ è $\\left(\\dfrac{x_0}{a},\\, y_0\\right)$: la funzione $g$ assume lo <strong>stesso valore</strong> $y_0$, ma <strong>l'ascissa diventa $x_0/a$</strong>. Per $a \\gt 1$ il punto si <strong>avvicina all'asse verticale</strong>, mentre per $0 \\lt a \\lt 1$ se ne <strong>allontana</strong>, salvo i punti con ascissa nulla, che restano fermi. Geometricamente, tutte le distanze dall'asse verticale vengono moltiplicate per il fattore $1/a$, mentre le altezze restano invariate. Per questo $a \\gt 1$ <em>comprime</em> e $0 \\lt a \\lt 1$ <em>dilata</em>.</p>
<p>Anche qui va ricalcolato il dominio: se $f(x) = \\sqrt{x}$ con $D = [0,+\\infty)$, allora $f(2x) = \\sqrt{2x}$ è definita per $2x \\ge 0$, cioè ancora su $[0,+\\infty)$; ma se $D = [1,3]$, allora $f(2x)$ è definita per $2x \\in [1,3]$, cioè su $[1/2,\\,3/2]$, intervallo di lunghezza dimezzata.</p>`
          },
          {
            subtitle: "Esempio: $\\sin(2x)$ e $\\sin(x/2)$",
            content: `<p>Consideriamo $f(x) = \\sin(x)$, che ha periodo $2\\pi$. Se prendiamo $g(x) = \\sin(2x)$, cioè con $a = 2 \\gt 1$, il grafico si <strong>comprime</strong>. Verifichiamo che il periodo diventa $\\pi$:</p>
<p>$$g(x+\\pi) = \\sin\\bigl(2(x+\\pi)\\bigr) = \\sin(2x + 2\\pi) = \\sin(2x) = g(x) \\qquad \\forall x \\in \\mathbb{R}$$</p>
<p>dove si è usata la periodicità di $\\sin$ di periodo $2\\pi$. Dunque $\\pi$ è un periodo di $g$.</p>
<p>Che $\\pi$ sia il periodo <em>minimo</em> si vede così: se $T \\gt 0$ è un periodo di $g$, allora $\\sin(2x+2T) = \\sin(2x)$ per ogni $x$; ma allora $2T$ è un periodo di $\\sin$, il cui periodo minimo è $2\\pi$, dunque $2T = 2k\\pi$ con $k$ intero positivo, cioè $T = k\\pi$, e il più piccolo periodo positivo è $T = \\pi$. Coerentemente con la proposizione precedente, l'ascissa $x_0 = 2\\pi$ (dove $f$ completa un'oscillazione) corrisponde all'ascissa $x_0/a = \\pi$ per $g$: il periodo si è dimezzato.</p>

<p>Se invece prendiamo $h(x) = \\sin(x/2)$, cioè con $a = 1/2 \\lt 1$, il grafico si <strong>dilata</strong>. Con lo stesso conto:</p>
<p>$$h(x + 4\\pi) = \\sin\\!\\left(\\frac{x+4\\pi}{2}\\right) = \\sin\\!\\left(\\frac{x}{2} + 2\\pi\\right) = \\sin\\!\\left(\\frac{x}{2}\\right) = h(x)$$</p>
<p>e poiché ogni periodo $T \\gt 0$ di $h$ deve soddisfare $T/2 = 2k\\pi$ con $k$ intero positivo, il periodo minimo corrisponde a $k = 1$, cioè $T = 4\\pi$: il periodo raddoppia. Si osservi che il massimo di $f$ in $x_0 = \\pi/2$ si ritrova, per $h$, nell'ascissa $x_0/a = 2x_0 = \\pi$, con la stessa ordinata $1$.</p>

      {
        id: "s10-nota-prof-segnali",
        type: "note_box",
        title: "Nota del Prof. — Trasformazioni e analisi dei segnali",
        icon: "🎧",
        content: `<p>Queste trasformazioni sono più di un semplice esercizio matematico. Hanno applicazioni profonde, per esempio nell'<strong>analisi dei segnali</strong>. Un suono, per esempio, può essere visto come una somma di tante funzioni sinusoidali (seni e coseni) con frequenze diverse. La frequenza è legata al coefficiente $a$ nell'argomento $f(a \\cdot x)$. L'orecchio umano, quando sente un suono, non fa altro che scomporre il segnale complesso nelle sue frequenze fondamentali. Il fatto che possiamo sommare e manipolare queste onde è una conseguenza della <strong>linearità</strong> delle equazioni che le governano.</p>`

      {
        id: "s10-integrazione-esercizi",
        type: "integrazione_box",

      {
        id: "s10-ex-teoria-1",
        type: "esercizio",
        title: "Teoria 1",
        kind: "teoria",
        source: "integrazione",
        icon: "📘",
        content: `<p>Spiega perché $\\cosh$ non è iniettiva su $\\mathbb{R}$ e indica una restrizione del dominio su cui risulta biettiva, precisando l'immagine.</p>`,
        solution: `<p>La funzione è <strong>pari</strong>:</p>
<p>$$\\cosh(-x) = \\frac{e^{-x}+e^{x}}{2} = \\cosh(x)$$</p>
<p>Dunque per ogni $x \\neq 0$ i due punti distinti $x$ e $-x$ hanno la stessa immagine (ad esempio $\\cosh(-1) = \\cosh(1)$): $\\cosh$ non è iniettiva su $\\mathbb{R}$ e quindi non è biettiva.</p>
<p>Restringiamola a $[0,+\\infty)$: su tale intervallo è strettamente crescente, vale</p>
<p>$$\\cosh(0) = \\frac{1+1}{2} = 1 \\quad \\text{(minimo assoluto)}$$</p>
<p>ed è $\\cosh(x) \\to +\\infty$ per $x \\to +\\infty$; essendo continua, per il teorema dei valori intermedi assume tutti i valori di $[1,+\\infty)$. Pertanto</p>
<p>$$\\cosh: [0,+\\infty) \\to [1,+\\infty) \\quad \\text{è biettiva}$$</p>
<p>Per parità, l'immagine di $\\cosh$ su tutto $\\mathbb{R}$ è la stessa, cioè $[1,+\\infty)$.</p>`
      },

      {
        id: "s10-ex-teoria-2",
        type: "esercizio",
        title: "Teoria 2",
        kind: "teoria",
        source: "integrazione",
        icon: "📘",
        content: `<p>Spiega perché $\\cosh(x)$ non è invertibile su $\\mathbb{R}$, indica la restrizione adottata e scrivi dominio e immagine di $\\cosh$ ristretta e della sua inversa $\\text{settcosh}$.</p>`,
        solution: `<p>La funzione $\\cosh(x) = \\frac{e^x+e^{-x}}{2}$ è pari: $\\cosh(-x) = \\cosh(x)$ per ogni $x \\in \\mathbb{R}$. Quindi per ogni $x \\neq 0$ i due punti distinti $x$ e $-x$ hanno la stessa immagine (ad esempio $\\cosh(1) = \\cosh(-1)$): la funzione non è iniettiva su $\\mathbb{R}$ e dunque non invertibile.</p>
<p>Inoltre la sua immagine è $[1,+\\infty)$, perché $\\cosh(x) \\ge 1$ con uguaglianza solo in $x = 0$; infatti</p>
<p>$$e^x + e^{-x} \\ge 2 \\quad \\Longleftrightarrow \\quad \\left(e^{x/2} - e^{-x/2}\\right)^2 \\ge 0$$</p>
<p>Restringendo il dominio a $[0,+\\infty)$ la funzione è strettamente crescente, quindi iniettiva, e la sua immagine resta $[1,+\\infty)$: perciò</p>
<p>$$\\cosh: [0,+\\infty) \\to [1,+\\infty) \\quad \\text{è biiettiva}$$</p>
<p>La sua inversa è</p>
<p>$$\\text{settcosh}: [1,+\\infty) \\to [0,+\\infty), \\qquad \\text{settcosh}(x) = \\ln\\!\\left(x+\\sqrt{x^2-1}\\right)$$</p>
<p>Valgono $\\text{settcosh}(\\cosh x) = x$ per $x \\ge 0$ e $\\cosh(\\text{settcosh}\\,x) = x$ per $x \\ge 1$; il grafico di $\\text{settcosh}$ è il simmetrico di quello di $\\cosh$ ristretta a $[0,+\\infty)$ rispetto alla retta $y = x$, e al punto $(0,1)$ corrisponde $(1,0)$.</p>`
      },

      {
        id: "s10-ex-teoria-3",
        type: "esercizio",
        title: "Teoria 3",
        kind: "teoria",
        source: "integrazione",
        icon: "📘",
        content: `<p>Dare la definizione di parte positiva $f_+$ e di parte negativa $f_-$ di una funzione $f$ e dimostrare che</p>
<p>$$f_+(x) = \\frac{|f(x)| + f(x)}{2}, \\qquad f_-(x) = \\frac{|f(x)| - f(x)}{2}$$</p>`,
        solution: `<p>Per definizione $f_+(x) = \\max\\{f(x), 0\\}$, cioè $f_+(x) = f(x)$ se $f(x) \\ge 0$ e $f_+(x) = 0$ se $f(x) \\lt 0$; analogamente $f_-(x) = \\max\\{-f(x), 0\\}$, cioè $f_-(x) = 0$ se $f(x) \\ge 0$ e $f_-(x) = -f(x)$ se $f(x) \\lt 0$. In particolare $f_+ \\ge 0$ e $f_- \\ge 0$, e tutte e tre le funzioni hanno lo stesso dominio di $f$.</p>
<p>Valgono le identità</p>
<p>$$|f| = f_+ + f_-, \\qquad f = f_+ - f_-$$</p>
<p>infatti se $f(x) \\ge 0$ si ha $f_+ + f_- = f(x) + 0 = |f(x)|$ e $f_+ - f_- = f(x)$, mentre se $f(x) \\lt 0$ si ha $f_+ + f_- = 0 + (-f(x)) = -f(x) = |f(x)|$ e $f_+ - f_- = 0 - (-f(x)) = f(x)$.</p>
<p><strong>Sommando</strong> le due identità:</p>
<p>$$|f(x)| + f(x) = 2 f_+(x) \\quad \\Rightarrow \\quad f_+(x) = \\frac{|f(x)| + f(x)}{2}$$</p>
<p><strong>Sottraendo</strong> la seconda dalla prima:</p>
<p>$$|f(x)| - f(x) = 2 f_-(x) \\quad \\Rightarrow \\quad f_-(x) = \\frac{|f(x)| - f(x)}{2}$$</p>
<p><strong>Verifica diretta.</strong> Se $f(x) \\ge 0$ allora $\\frac{f+f}{2} = f$ e $\\frac{f-f}{2} = 0$; se $f(x) \\lt 0$ allora $\\frac{-f+f}{2} = 0$ e $\\frac{-f-f}{2} = -f$.</p>`
      },

      {
        id: "s10-ex-teoria-4",
        type: "esercizio",
        title: "Teoria 4",
        kind: "teoria",
        source: "integrazione",
        icon: "📘",
        content: `<p>Dimostra, usando soltanto la monotonia della funzione esponenziale, che $\\sinh$ è strettamente crescente su $\\mathbb{R}$; deducine l'iniettività e spiega perché $\\sinh$ è invertibile su tutto $\\mathbb{R}$.</p>`,
        solution: `<p>Siano $a \\lt b$. Poiché $t \\mapsto e^{t}$ è strettamente crescente, si ha</p>
<p>$$e^{a} \\lt e^{b}$$</p>
<p>Inoltre $-a \\gt -b$ implica $e^{-a} \\gt e^{-b}$, cioè</p>
<p>$$-e^{-a} \\lt -e^{-b}$$</p>
<p>Sommando le due disuguaglianze strette:</p>
<p>$$e^{a} - e^{-a} \\lt e^{b} - e^{-b}$$</p>
<p>e dividendo per $2 \\gt 0$ otteniamo $\\sinh(a) \\lt \\sinh(b)$. Quindi $\\sinh$ è strettamente crescente su $\\mathbb{R}$.</p>
<p>Da ciò segue l'<strong>iniettività</strong>: se $a \\neq b$, supponendo senza perdita di generalità $a \\lt b$, si ha $\\sinh(a) \\lt \\sinh(b)$, dunque $\\sinh(a) \\neq \\sinh(b)$.</p>
<p>Poiché $\\sinh$ è anche suriettiva su $\\mathbb{R}$ (la sua immagine è $\\mathbb{R}$), essa è biettiva da $\\mathbb{R}$ in $\\mathbb{R}$ e ammette funzione inversa $\\mathrm{settsenh}: \\mathbb{R} \\to \\mathbb{R}$.</p>`
      },

      {
        id: "s10-ex-scritto-1",
        type: "esercizio",
        title: "Scritto 1",
        kind: "scritto",
        source: "integrazione",
        icon: "✏️",
        content: `<p>Risolvi la disequazione $\\sinh(x) \\le \\dfrac{3}{2}$.</p>`,
        solution: `<p>La disequazione è</p>
<p>$$\\frac{e^{x}-e^{-x}}{2} \\le \\frac{3}{2} \\quad \\Longleftrightarrow \\quad e^{x}-e^{-x} \\le 3$$</p>
<p><strong>Sostituzione.</strong> Poniamo $t = e^{x}$, con il vincolo $t \\gt 0$:</p>
<p>$$t - \\frac{1}{t} \\le 3$$</p>
<p><strong>Disequazione polinomiale.</strong> Moltiplichiamo per $t \\gt 0$ (il verso non cambia):</p>
<p>$$t^{2} - 1 \\le 3t \\quad \\Longleftrightarrow \\quad t^{2} - 3t - 1 \\le 0$$</p>
<p>Le radici sono $t = \\frac{3 \\pm \\sqrt{13}}{2}$ e, poiché la parabola ha coefficiente direttore positivo, la disequazione vale fra le radici:</p>
<p>$$\\frac{3-\\sqrt{13}}{2} \\le t \\le \\frac{3+\\sqrt{13}}{2}$$</p>
<p><strong>Intersezione con $t \\gt 0$.</strong> Essendo $\\frac{3-\\sqrt{13}}{2} \\lt 0$, resta</p>
<p>$$0 \\lt e^{x} \\le \\frac{3+\\sqrt{13}}{2}$$</p>
<p><strong>Ritorno a $x$.</strong> Applichiamo il logaritmo naturale, che è strettamente crescente:</p>
<p>$$x \\le \\ln\\frac{3+\\sqrt{13}}{2} \\approx 1.19$$</p>
<p><strong>Controllo con l'inversa.</strong> Il risultato coincide con quanto dà $\\mathrm{settsenh}$:</p>
<p>$$\\mathrm{settsenh}\\!\\left(\\frac{3}{2}\\right) = \\ln\\!\\left(\\frac{3}{2} + \\sqrt{\\frac{9}{4}+1}\\right) = \\ln\\frac{3+\\sqrt{13}}{2}$$</p>
<p>Dunque l'insieme soluzione è</p>
<p>$$S = \\left(-\\infty,\\ \\ln\\frac{3+\\sqrt{13}}{2}\\right]$$</p>

      {
        id: "s10-ex-scritto-2",
        type: "esercizio",
        title: "Scritto 2",
        kind: "scritto",
        source: "integrazione",
        icon: "✏️",
        content: `<p>Determinare il dominio di $f(x) = \\text{settcosh}\\left(x^2-3\\right)$.</p>`,
        solution: `<p><strong>Condizione da imporre.</strong> Il dominio di $\\text{settcosh}$ è $[1,+\\infty)$, quindi</p>
<p>$$x^2 - 3 \\ge 1 \\quad \\Longleftrightarrow \\quad x^2 - 4 \\ge 0$$</p>
<p><strong>Studio del segno.</strong> Il trinomio $x^2-4$ ha gli zeri $x = -2$ e $x = 2$; essendo il coefficiente di $x^2$ positivo, è $\\ge 0$ all'esterno dell'intervallo delle radici (estremi inclusi, perché la disuguaglianza è larga):</p>
<p>$$x \\le -2 \\quad \\text{oppure} \\quad x \\ge 2$$</p>
<p><strong>Conclusione.</strong></p>
<p>$$\\mathrm{dom}(f) = (-\\infty, -2] \\cup [2, +\\infty)$$</p>
<p><strong>Verifica.</strong> Per $x = 2$ si ha $x^2-3 = 1$ e $f(2) = \\text{settcosh}(1) = \\ln(1+0) = 0$; per $x = 0$ si ha $x^2-3 = -3 \\lt 1$ e infatti $f(0)$ non è definita.</p>

      {
        id: "s10-ex-scritto-3",
        type: "esercizio",
        title: "Scritto 3",
        kind: "scritto",
        source: "integrazione",
        icon: "✏️",
        content: `<p>Partendo dal grafico di $f(x) = x^2$, descrivere le trasformazioni che portano a $g(x) = 2(x+1)^2 - 3$, determinarne vertice e zeri e disegnarne il grafico.</p>`,
        solution: `<p><strong>Le trasformazioni, nell'ordine.</strong></p>
<p>$$x^2 \\ \\longmapsto \\ 2x^2 \\qquad \\text{dilatazione verticale di fattore } 2 \\ \\text{(le ordinate raddoppiano)}$$</p>
<p>$$2x^2 \\ \\longmapsto \\ 2(x+1)^2 \\qquad \\text{traslazione orizzontale con } a = -1 \\ \\text{(di } 1 \\text{ verso sinistra)}$$</p>
<p>$$2(x+1)^2 \\ \\longmapsto \\ 2(x+1)^2 - 3 \\qquad \\text{traslazione verticale con } a = -3 \\ \\text{(di } 3 \\text{ verso il basso)}$$</p>
<p>Il dominio resta $\\mathbb{R}$ in tutti i passaggi.</p>
<p><strong>Vertice.</strong> Il vertice $V_f = (0,0)$ di $f$ resta fermo sotto la dilatazione verticale (perché $2 \\cdot 0 = 0$) e poi si sposta in</p>
<p>$$V_g = (-1, -3)$$</p>
<p><strong>Zeri.</strong></p>
<p>$$2(x+1)^2 - 3 = 0 \\iff (x+1)^2 = \\frac{3}{2} \\iff x+1 = \\pm\\sqrt{\\frac{3}{2}} = \\pm\\frac{\\sqrt{6}}{2}$$</p>
<p>$$x = -1 \\pm \\frac{\\sqrt{6}}{2} \\qquad \\text{numericamente } x \\approx -2{,}225 \\ \\text{e} \\ x \\approx 0{,}225$$</p>
<p><strong>Controllo di un punto.</strong> Il punto $(1,1)$ di $f$ diventa $(1,2)$ dopo la dilatazione, poi $(0,2)$ dopo la traslazione orizzontale, infine $(0,-1)$; e in effetti $g(0) = 2(0+1)^2 - 3 = -1$.</p>

      {
        id: "s10-ex-scritto-4",
        type: "esercizio",
        title: "Scritto 4",
        kind: "scritto",
        source: "integrazione",
        icon: "✏️",
        content: `<p>Risolvi la disequazione $\\cosh(x) \\ge \\dfrac{5}{4}$.</p>`,
        solution: `<p>La disequazione è</p>
<p>$$\\frac{e^{x}+e^{-x}}{2} \\ge \\frac{5}{4} \\quad \\Longleftrightarrow \\quad e^{x}+e^{-x} \\ge \\frac{5}{2}$$</p>
<p><strong>Sostituzione.</strong> Posto $t = e^{x} \\gt 0$:</p>
<p>$$t + \\frac{1}{t} \\ge \\frac{5}{2}$$</p>
<p><strong>Disequazione polinomiale.</strong> Moltiplicando per $2t \\gt 0$:</p>
<p>$$2t^{2} + 2 \\ge 5t \\quad \\Longleftrightarrow \\quad 2t^{2} - 5t + 2 \\ge 0$$</p>
<p>Le radici sono $t = \\frac{1}{2}$ e $t = 2$; poiché il coefficiente direttore è positivo, la disequazione vale all'esterno:</p>
<p>$$t \\le \\frac{1}{2} \\quad \\text{oppure} \\quad t \\ge 2$$</p>
<p><strong>Intersezione con $t \\gt 0$.</strong></p>
<p>$$0 \\lt e^{x} \\le \\frac{1}{2} \\quad \\text{oppure} \\quad e^{x} \\ge 2$$</p>
<p><strong>Ritorno a $x$</strong> passando al logaritmo naturale (strettamente crescente):</p>
<p>$$x \\le -\\ln 2 \\quad \\text{oppure} \\quad x \\ge \\ln 2$$</p>
<p><strong>Verifica.</strong> $\\cosh(\\ln 2) = \\frac{2+\\frac{1}{2}}{2} = \\frac{5}{4}$ e, per parità, $\\cosh(-\\ln 2) = \\frac{5}{4}$: l'insieme soluzione è infatti simmetrico rispetto all'origine. Dunque</p>
<p>$$S = (-\\infty, -\\ln 2] \\cup [\\ln 2, +\\infty), \\qquad \\ln 2 \\approx 0.69$$</p>

      {
        type: "definizione",
        front: "Definisci coseno iperbolico e seno iperbolico.",
        back: "$\\cosh(x) = \\dfrac{e^x + e^{-x}}{2}$ e $\\sinh(x) = \\dfrac{e^x - e^{-x}}{2}$. Entrambe hanno dominio $\\mathbb{R}$. Non sono funzioni periodiche: il nome richiama le funzioni trigonometriche solo per analogia, ma descrivono la geometria di un'iperbole anziché di un cerchio."
      },
      {
        type: "dimostrazione",
        front: "Dimostra che $\\cosh$ è pari e $\\sinh$ è dispari.",
        back: "$\\cosh(-x) = \\dfrac{e^{-x}+e^{x}}{2} = \\cosh(x)$: pari. $\\sinh(-x) = \\dfrac{e^{-x}-e^{x}}{2} = -\\dfrac{e^{x}-e^{-x}}{2} = -\\sinh(x)$: dispari."
      },
      {
        type: "domanda",
        front: "Qual è l'immagine di $\\cosh$ e come si giustifica?",
        back: "L'immagine è $[1,+\\infty)$. Infatti $\\cosh(0) = \\dfrac{1+1}{2} = 1$ è il minimo assoluto, $\\cosh$ è continua e $\\cosh(x) \\to +\\infty$ per $x \\to \\pm\\infty$: per il teorema dei valori intermedi assume tutti i valori di $[1,+\\infty)$."
      },
      {
        type: "tranello",
        front: "Perché $\\cosh$ non è invertibile su $\\mathbb{R}$? Come si rimedia?",
        back: "Perché è pari: $\\cosh(-1) = \\cosh(1)$, quindi non è iniettiva. Si restringe il dominio a $[0,+\\infty)$, dove è strettamente crescente: $\\cosh:[0,+\\infty) \\to [1,+\\infty)$ è biiettiva e la sua inversa è $\\text{settcosh}: [1,+\\infty) \\to [0,+\\infty)$."
      },
      {
        type: "dimostrazione",
        front: "Ricava l'espressione esplicita di $\\text{settsenh}(x)$.",
        back: "Da $y = \\dfrac{e^x-e^{-x}}{2}$ si ottiene, posto $t = e^x$, l'equazione $t^2 - 2yt - 1 = 0$, con radici $t = y \\pm \\sqrt{y^2+1}$. Poiché $\\sqrt{y^2+1} \\gt |y| \\ge y$, la radice con il meno è sempre negativa e va scartata; quella con il più soddisfa $y+\\sqrt{y^2+1} \\gt y+|y| \\ge 0$, quindi è lecito applicare il logaritmo per ogni $y$ reale. Si ha $x = \\ln(y+\\sqrt{y^2+1})$, cioè $\\text{settsenh}(x) = \\ln\\left(x+\\sqrt{x^2+1}\\right)$."
      },
      {
        type: "formula",
        front: "Scrivi le tre formule delle funzioni iperboliche inverse con i rispettivi domini.",
        back: "$\\text{settsenh}(x) = \\ln\\left(x+\\sqrt{x^2+1}\\right)$, dominio $\\mathbb{R}$. $\\text{settcosh}(x) = \\ln\\left(x+\\sqrt{x^2-1}\\right)$, dominio $[1,+\\infty)$. $\\text{setttanh}(x) = \\dfrac{1}{2}\\ln\\left(\\dfrac{1+x}{1-x}\\right)$, dominio $(-1,1)$."
      },
      {
        type: "definizione",
        front: "Definisci la tangente iperbolica e indicane dominio e immagine.",
        back: "$\\tanh(x) = \\dfrac{\\sinh(x)}{\\cosh(x)} = \\dfrac{e^x-e^{-x}}{e^x+e^{-x}} = \\dfrac{e^{2x}-1}{e^{2x}+1}$. Il dominio è $\\mathbb{R}$ perché $\\cosh(x) \\ge 1$ non si annulla mai; l'immagine è $(-1,1)$ e la funzione è strettamente crescente, dunque invertibile."
      },
      {
        type: "domanda",
        front: "Da dove viene il nome «settore» nelle funzioni iperboliche inverse?",
        back: "Da un'interpretazione geometrica legata all'area di un settore di iperbole, in analogia con le funzioni trigonometriche inverse (arcoseno, arcocoseno), legate invece alla lunghezza di un arco di circonferenza. Nel corso non si approfondisce questo aspetto."
      },
      {
        type: "definizione",
        front: "Definisci parte positiva e parte negativa di $f$ e scrivi le due relazioni fondamentali.",
        back: "$f_+(x) = \\max\\{f(x),0\\}$ e $f_-(x) = \\max\\{-f(x),0\\}$: entrambe sono sempre non negative. Valgono $f(x) = f_+(x) - f_-(x)$ e $|f(x)| = f_+(x) + f_-(x)$."
      },
      {
        type: "tranello",
        front: "Il grafico di $f(x-a)$ con $a \\gt 0$ si sposta a destra o a sinistra?",
        back: "A <strong>destra</strong> di $a$. L'errore comune è associare il segno meno a uno spostamento a sinistra. Controllo rapido: per $f(x) = x^2$, $g(x) = (x-2)^2$ si annulla in $x = 2$, non in $x = 0$. Inoltre il dominio va ricalcolato: $D_g = D + a$ (es. $\\sqrt{x-2}$ ha dominio $[2,+\\infty)$)."
      },
      {
        type: "tranello",
        front: "Perché $f(ax)$ con $a \\gt 1$ comprime il grafico invece di dilatarlo?",
        back: "Se $y_0 = f(x_0)$, allora $g(x_0/a) = f(a \\cdot x_0/a) = f(x_0) = y_0$: il valore $y_0$ viene assunto all'ascissa $x_0/a$. Tutte le ascisse vengono moltiplicate per $1/a$: per $a \\gt 1$ i punti si avvicinano all'asse verticale (compressione), per $0 \\lt a \\lt 1$ se ne allontanano (dilatazione); i punti di ascissa nulla restano fermi. Le ordinate non cambiano."
      },
      {
        type: "domanda",
        front: "Qual è il periodo minimo di $g(x) = \\sin(2x)$ e come lo si dimostra?",
        back: "È $\\pi$. Si verifica che $g(x+\\pi) = \\sin(2x+2\\pi) = \\sin(2x) = g(x)$. Per la minimalità: se $T \\gt 0$ è periodo di $g$, allora $2T$ è periodo di $\\sin$, il cui periodo minimo è $2\\pi$, dunque $2T = 2k\\pi$ cioè $T = k\\pi$; il più piccolo è $T = \\pi$. Coerentemente, l'ascissa $x_0 = 2\\pi$ di $f$ corrisponde a $x_0/a = \\pi$ per $g$."
