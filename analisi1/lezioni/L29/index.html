<script>
const LESSON = {
  "id": "L29",
  "date": "Lezione 29 — 10 Nov 2026",
  "title": "Studio di Funzione: Esempi Completi e Ricerca degli Asintoti",
  "abstract": "Uno studio di funzione completo con valore assoluto sotto radice (dominio a tre intervalli, semitangenti verticali, punto angoloso) e due esercizi dedicati alla ricerca degli asintoti obliqui, con esponenziali/arcotangente e con logaritmi.",
  "sections": [
    {
      "id": "s01-intro",
      "type": "section",
      "title": "Impostazione: lo studio di funzione come tema d'esame",
      "icon": "📈",
      "content": "<p>In questa lezione affrontiamo <strong>studi di funzione completi</strong>, applicando tutti gli strumenti sviluppati finora: dominio, simmetrie, segno, limiti e asintoti, derivata prima, monotonia, estremi e punti di non derivabilità. È un classico tema d'esame.</p>\n        <p>La parte relativa a concavità e convessità verrà trattata nelle lezioni successive (compare qui solo in un'integrazione finale).</p>",
      "quote": {
        "text": "Potete trovare numerosi esercizi simili, tratti da appelli d'esame passati, sul mio sito web. Vi incoraggio a esercitarvi con quelli. Spesso, il testo dell'esercizio contiene un parametro (ad esempio, una lettera $a$) che varia a seconda della fila. Potete sceglierne un valore a piacere e svolgere l'esercizio.",
        "src": "Nota del Prof."
      }
    },
    {
      "id": "s02-def-asintoti",
      "type": "section",
      "title": "Definizione — Asintoto verticale, orizzontale, obliquo",
      "icon": "📐",
      "content": "<p>Prima di iniziare, richiamiamo le tre nozioni che useremo, per sapere esattamente che cosa stiamo cercando.</p>\n        <ul>\n          <li>La retta $x = a$ è <strong>asintoto verticale</strong> se almeno uno dei limiti $\\lim_{x \\to a^{\\pm}} f(x)$ vale $+\\infty$ oppure $-\\infty$.</li>\n          <li>La retta $y = L$ è <strong>asintoto orizzontale</strong> a $+\\infty$ (rispettivamente a $-\\infty$) se $\\lim_{x \\to +\\infty} f(x) = L \\in \\mathbb{R}$ (rispettivamente $\\lim_{x \\to -\\infty} f(x) = L$).</li>\n          <li>La retta $y = mx + q$ con $m \\neq 0$ è <strong>asintoto obliquo</strong> a $+\\infty$ se esistono finiti\n          <p>$$m = \\lim_{x \\to +\\infty} \\frac{f(x)}{x}, \\qquad q = \\lim_{x \\to +\\infty}\\bigl[f(x) - mx\\bigr],$$</p>\n          e analogamente a $-\\infty$.</li>\n        </ul>\n        <p>I due limiti vanno calcolati <strong>in quest'ordine</strong>: senza conoscere $m$ non si può nemmeno scrivere il secondo limite.</p>\n        <p>Da notare: asintoto orizzontale e asintoto obliquo, <strong>allo stesso infinito</strong>, si escludono a vicenda. Per questo l'obliquo si cerca solo <em>dopo</em> aver verificato che il limite della funzione sia infinito.</p>",
      "formulas": [
        {
          "label": "Coefficiente angolare",
          "latex": "m = \\lim_{x \\to \\pm\\infty} \\frac{f(x)}{x}"
        },
        {
          "label": "Intercetta",
          "latex": "q = \\lim_{x \\to \\pm\\infty}\\bigl[f(x) - mx\\bigr]"
        }
      ]
    },
    {
      "id": "s03-teorema-limite-derivata",
      "type": "section",
      "title": "Teorema — Limite della derivata e derivate laterali",
      "icon": "📜",
      "content": "<p>Lo strumento che useremo per calcolare le derivate laterali negli estremi del dominio è il seguente.</p>\n        <p><strong>Teorema.</strong> Se $f$ è continua in $x_0$ (dal lato considerato), derivabile in un intorno (unilaterale) bucato di $x_0$ e il limite $\\lim_{x \\to x_0^{\\pm}} f'(x)$ esiste (finito o infinito), allora il corrispondente limite laterale del rapporto incrementale esiste e coincide con tale limite.</p>\n        <p><strong>Attenzione:</strong> questa uguaglianza <strong>non è la definizione</strong> di derivata laterale, che è per definizione il limite del <em>rapporto incrementale</em>. È una conseguenza del teorema, e le sue ipotesi (continuità in $x_0$, derivabilità nell'intorno bucato, esistenza del limite di $f'$) vanno sempre controllate.</p><p><strong>Precisazione di notazione.</strong> Se il limite è finito, è la derivata laterale. Se vale $\\pm\\infty$, non esiste una derivata laterale finita: nelle pagine seguenti la scrittura $f^{\\prime}_{\\pm}(x_0)=\\pm\\infty$ indica per comodità il limite infinito del rapporto incrementale, che descrive una semitangente verticale.</p>",
      "subsections": [
        {
          "subtitle": "Perché serve negli studi di funzione",
          "content": "<p>La formula esplicita di $f'$ vale in generale solo sugli intervalli <em>aperti</em> (dove l'argomento di una radice è strettamente positivo, dove le espressioni a tratti non si raccordano, ...). La <strong>continuità</strong> di $f$ negli estremi è esattamente l'ipotesi che permette di trasferire l'informazione dall'interno agli estremi.</p>"
        }
      ],
      "formulas": [
        {
          "label": "Limiti laterali del rapporto incrementale",
          "latex": "\\lim_{h\\to0^{\\pm}}\\frac{f(x_0+h)-f(x_0)}{h}=\\lim_{x\\to x_0^{\\pm}}f^{\\prime}(x)"
        }
      ]
    },
    {
      "id": "s04-es-radice-modulo",
      "type": "esercizio_svolto",
      "title": "Esercizio svolto — Studio di $f(x) = \\sqrt{x^2 - 3|x| + 2}$",
      "icon": "✎",
      "source": "docente",
      "content": "<p>Tracciare il grafico della funzione $f(x) = \\sqrt{x^2 - 3|x| + 2}$ specificando: dominio, eventuali asintoti, punti di massimo e di minimo, eventuali punti di non derivabilità. La parte relativa a concavità e convessità verrà trattata in lezioni successive.</p>",
      "steps": [
        "<p><strong>1. Espressione analitica a tratti.</strong> La presenza del valore assoluto $|x|$ suggerisce di dividere lo studio in due casi:</p>\n          <p>$$f(x) = \\begin{cases} \\sqrt{x^2 - 3x + 2} & \\text{se } x \\ge 0 \\\\[4pt] \\sqrt{x^2 + 3x + 2} & \\text{se } x \\lt 0 \\end{cases}$$</p>\n          <p>Per determinare il dominio imponiamo che l'argomento della radice sia non negativo.</p>",
        "<p><strong>Caso A: $x \\ge 0$.</strong> Risolviamo $x^2 - 3x + 2 \\ge 0$. L'equazione associata ha soluzioni</p>\n          <p>$$x = \\frac{3 \\pm \\sqrt{9 - 8}}{2} = \\frac{3 \\pm 1}{2} \\;\\Rightarrow\\; x_1 = 1,\\quad x_2 = 2$$</p>\n          <p>La parabola ha concavità verso l'alto, quindi la disequazione è soddisfatta per valori <em>esterni</em> alle radici: $x \\le 1 \\lor x \\ge 2$. Intersecando con $x \\ge 0$:</p>\n          <p>$$S_A = [0, 1] \\cup [2, +\\infty)$$</p>",
        "<p><strong>Caso B: $x \\lt 0$.</strong> Osserviamo che la funzione è <strong>pari</strong>:</p>\n          <p>$$f(-x) = \\sqrt{(-x)^2 - 3|-x| + 2} = \\sqrt{x^2 - 3|x| + 2} = f(x)$$</p>\n          <p>Essendo pari, il dominio è simmetrico rispetto all'origine, dunque</p>\n          <p>$$S_B = (-\\infty, -2] \\cup [-1, 0)$$</p>\n          <p><em>In alternativa</em> si risolve esplicitamente $x^2 + 3x + 2 \\ge 0$: le radici sono $x = \\frac{-3 \\pm \\sqrt{9-8}}{2}$, cioè $x_1 = -2$ e $x_2 = -1$, e la disequazione vale per $x \\le -2 \\lor x \\ge -1$. Intersecando con $x \\lt 0$ si ottiene lo stesso risultato.</p>",
        "<p><strong>Dominio completo.</strong> Unendo i due casi:</p>\n          <p>$$D_f = (-\\infty, -2] \\cup [-1, 1] \\cup [2, +\\infty)$$</p>\n          <p><strong>Struttura del dominio (da fissare subito, perché da essa dipende tutto il resto):</strong></p>\n          <p>$$D_f = \\{x \\in \\mathbb{R} : x \\le -2\\} \\cup \\{x \\in \\mathbb{R} : -1 \\le x \\le 1\\} \\cup \\{x \\in \\mathbb{R} : x \\ge 2\\}$$</p>\n          <p>È l'unione di tre intervalli <strong>chiusi</strong> e a due a due disgiunti. I punti $x = \\pm 1$ e $x = \\pm 2$ <strong>appartengono</strong> al dominio e ne sono estremi: ciascuno è raggiungibile da un solo lato all'interno di $D_f$. Gli intervalli $(-2,-1)$ e $(1,2)$ sono esclusi, e il grafico non avrà alcun punto al di sopra di essi.</p>",
        "<p><strong>2. Simmetrie, segno e intersezioni con gli assi.</strong></p>\n          <ul>\n            <li><strong>Simmetrie:</strong> la funzione è <strong>pari</strong>, il grafico è simmetrico rispetto all'asse $y$.</li>\n            <li><strong>Segno:</strong> essendo una radice quadrata, $f(x) \\ge 0$ per ogni $x \\in D_f$: il grafico sta interamente nel semipiano $y \\ge 0$.</li>\n            <li><strong>Asse $y$:</strong> $f(0) = \\sqrt{0 - 0 + 2} = \\sqrt{2}$, punto $(0, \\sqrt{2})$.</li>\n            <li><strong>Asse $x$:</strong> $f(x) = 0$ quando si annulla il radicando, cioè per $x = \\pm 1$ e $x = \\pm 2$: punti $(-2,0)$, $(-1,0)$, $(1,0)$, $(2,0)$.</li>\n          </ul>",
        "<p><strong>3. Asintoti verticali: non ce ne sono.</strong> La funzione $f$ è composizione di funzioni continue (un polinomio e la radice quadrata), quindi è <strong>continua in ogni punto di $D_f$</strong>; in particolare è continua anche negli estremi $x = \\pm 1$ e $x = \\pm 2$, dove la continuità va intesa dal solo lato accessibile. Di conseguenza in tali punti il limite coincide con il valore della funzione e non può essere infinito:</p>\n          <p>$$\\lim_{x \\to -2^-} f(x) = f(-2) = \\sqrt{4 - 6 + 2} = 0, \\qquad \\lim_{x \\to -1^+} f(x) = f(-1) = \\sqrt{1 - 3 + 2} = 0$$</p>\n          <p>$$\\lim_{x \\to 1^-} f(x) = f(1) = 0, \\qquad \\lim_{x \\to 2^+} f(x) = f(2) = 0$$</p>\n          <p>Ogni punto di accumulazione finito di $D_f$ appartiene a $D_f$, che è chiuso, e in esso il limite di $f$ è finito: nessuna retta verticale è asintoto.</p>",
        "<p><strong>Attenzione a un errore frequente.</strong> Non è corretto concludere che non ci sono asintoti verticali <em>solo</em> perché i punti di frontiera appartengono al dominio: un asintoto verticale può presentarsi anche in un punto appartenente al dominio (per esempio per una funzione definita a tratti e non continua in quel punto). Ciò che esclude l'asintoto verticale è la <strong>continuità</strong> di $f$ su tutto $D_f$ unita al fatto che $D_f$ è <strong>chiuso</strong>, cosicché ogni punto di accumulazione finito di $D_f$ appartiene a $D_f$. La sola continuità su $D_f$ non basterebbe: $f(x) = 1/x$ è continua su tutto il suo dominio $\\mathbb{R} \\setminus \\{0\\}$ e ha asintoto verticale in $x = 0$.</p>",
        "<p><strong>Asintoti orizzontali.</strong></p>\n          <p>$$\\lim_{x \\to +\\infty} \\sqrt{x^2 - 3x + 2} = +\\infty$$</p>\n          <p>Il limite non è finito, quindi non ci sono asintoti orizzontali. Per simmetria anche il limite per $x \\to -\\infty$ vale $+\\infty$.</p>",
        "<p><strong>Asintoto obliquo per $x \\to +\\infty$.</strong> Calcoliamo $m$:</p>\n          <p>$$m = \\lim_{x \\to +\\infty} \\frac{\\sqrt{x^2 - 3x + 2}}{x} = \\lim_{x \\to +\\infty} \\frac{\\sqrt{x^2\\left(1 - \\frac{3}{x} + \\frac{2}{x^2}\\right)}}{x} = \\lim_{x \\to +\\infty} \\frac{|x|\\,\\sqrt{1 - \\frac{3}{x} + \\frac{2}{x^2}}}{x}$$</p>\n          <p>Poiché $x \\to +\\infty$ possiamo supporre $x \\gt 0$, quindi $|x| = x$; inoltre $\\frac{3}{x} \\to 0$ e $\\frac{2}{x^2} \\to 0$, da cui la radice tende a $1$:</p>\n          <p>$$m = \\lim_{x \\to +\\infty} \\sqrt{1 - \\frac{3}{x} + \\frac{2}{x^2}} = 1$$</p>",
        "<p>Calcoliamo $q$ razionalizzando:</p>\n          <p>$$q = \\lim_{x \\to +\\infty}\\left(\\sqrt{x^2 - 3x + 2} - x\\right) = \\lim_{x \\to +\\infty} \\frac{x^2 - 3x + 2 - x^2}{\\sqrt{x^2 - 3x + 2} + x}$$</p>\n          <p>$$= \\lim_{x \\to +\\infty} \\frac{x\\left(-3 + \\frac{2}{x}\\right)}{x\\left(\\sqrt{1 - \\frac{3}{x} + \\frac{2}{x^2}} + 1\\right)} = \\frac{-3 + 0}{\\sqrt{1 - 0 + 0} + 1} = -\\frac{3}{2}$$</p>\n          <p>L'asintoto obliquo per $x \\to +\\infty$ è $y = x - \\frac{3}{2}$.</p>",
        "<p><strong>Asintoto obliquo per $x \\to -\\infty$.</strong> Per simmetria pari sarà $y = -x - \\frac{3}{2}$. Verifichiamolo, ricordando che ora $x \\lt 0$ e quindi $|x| = -x$:</p>\n          <p>$$m = \\lim_{x \\to -\\infty} \\frac{\\sqrt{x^2 + 3x + 2}}{x} = \\lim_{x \\to -\\infty} \\frac{-x\\,\\sqrt{1 + \\frac{3}{x} + \\frac{2}{x^2}}}{x} = -\\sqrt{1+0+0} = -1$$</p>\n          <p>$$q = \\lim_{x \\to -\\infty}\\left(\\sqrt{x^2 + 3x + 2} + x\\right) = \\lim_{x \\to -\\infty} \\frac{3x + 2}{-x\\,\\sqrt{1 + \\frac{3}{x} + \\frac{2}{x^2}} - x}$$</p>\n          <p>$$= \\lim_{x \\to -\\infty} \\frac{3 + \\frac{2}{x}}{-\\left(\\sqrt{1 + \\frac{3}{x} + \\frac{2}{x^2}} + 1\\right)} = \\frac{3}{-2} = -\\frac{3}{2}$$</p>\n          <p>L'asintoto obliquo per $x \\to -\\infty$ è $y = -x - \\frac{3}{2}$.</p>",
        "<p><strong>4. Derivata prima.</strong> La formula di derivazione della radice si può applicare soltanto dove l'argomento è <em>strettamente</em> positivo, cioè nei punti <strong>interni</strong> agli intervalli del dominio:</p>\n          <p>$$f'(x) = \\begin{cases} \\dfrac{2x - 3}{2\\sqrt{x^2 - 3x + 2}} & \\text{se } x \\in (0, 1) \\cup (2, +\\infty) \\\\[8pt] \\dfrac{2x + 3}{2\\sqrt{x^2 + 3x + 2}} & \\text{se } x \\in (-\\infty, -2) \\cup (-1, 0) \\end{cases}$$</p>",
        "<p><strong>Segno di $f'$ per $x \\gt 0$.</strong> Il denominatore è sempre positivo, quindi il segno dipende da $2x - 3$:</p>\n          <p>$$2x - 3 \\gt 0 \\iff x \\gt \\frac{3}{2} = 1{,}5$$</p>\n          <p>Il punto $x = 1{,}5$ cade in $(1,2)$, dove la funzione non è definita. Dunque:</p>\n          <ul>\n            <li>in $(0,1)$: $x \\lt 1{,}5$, quindi $f'(x) \\lt 0 \\Rightarrow f$ <strong>decrescente</strong>;</li>\n            <li>in $(2,+\\infty)$: $x \\gt 1{,}5$, quindi $f'(x) \\gt 0 \\Rightarrow f$ <strong>crescente</strong>.</li>\n          </ul>",
        "<p><strong>Segno di $f'$ per $x \\lt 0$.</strong> Dipende da $2x + 3$:</p>\n          <p>$$2x + 3 \\gt 0 \\iff x \\gt -\\frac{3}{2} = -1{,}5$$</p>\n          <p>Il punto $x = -1{,}5$ cade in $(-2,-1)$, escluso dal dominio. Dunque:</p>\n          <ul>\n            <li>in $(-\\infty,-2)$: $x \\lt -1{,}5$, quindi $f'(x) \\lt 0 \\Rightarrow f$ <strong>decrescente</strong>;</li>\n            <li>in $(-1,0)$: $x \\gt -1{,}5$, quindi $f'(x) \\gt 0 \\Rightarrow f$ <strong>crescente</strong>.</li>\n          </ul>",
        "<p><strong>Estremi relativi.</strong></p>\n          <ul>\n            <li>I punti $x = \\pm 1$ e $x = \\pm 2$ sono punti di <strong>minimo locale</strong> (in ciascuno di essi la monotonia va letta dal solo lato appartenente al dominio). Poiché $f(x) \\ge 0$ e qui la funzione vale $0$, sono anche punti di <strong>minimo globale</strong>.</li>\n            <li>In $x = 0$ la funzione è crescente a sinistra ($f' \\gt 0$ in $(-1,0)$) e decrescente a destra ($f' \\lt 0$ in $(0,1)$): $x = 0$ è punto di <strong>massimo locale</strong>, con $f(0) = \\sqrt{2}$.</li>\n          </ul>",
        "<p><strong>5. Punti di non derivabilità.</strong> I candidati sono i punti in cui la formula per $f'$ non è applicabile, cioè quelli in cui si annulla l'argomento della radice, $x = \\pm 1, \\pm 2$, e il punto di raccordo $x = 0$ fra le due espressioni analitiche.</p>\n          <p>Applichiamo il teorema sul limite della derivata (le ipotesi di continuità in $\\pm 1, \\pm 2$ e in $0$ sono già state verificate al punto 3).</p>",
        "<p><strong>Gli estremi $x = \\pm 1, \\pm 2$.</strong> Ciascuno è un <em>estremo</em> di uno degli intervalli di $D_f$: il grafico lo raggiunge da un solo lato, quindi si può studiare soltanto il rapporto incrementale dal lato accessibile.</p>\n          <p>$$\\lim_{x \\to 1^-} f'(x) = \\lim_{x \\to 1^-} \\frac{2x-3}{2\\sqrt{x^2-3x+2}} = \\frac{-1}{0^+} = -\\infty$$</p>\n          <p>$$\\lim_{x \\to 2^+} f'(x) = \\lim_{x \\to 2^+} \\frac{2x-3}{2\\sqrt{x^2-3x+2}} = \\frac{1}{0^+} = +\\infty$$</p>\n          <p>Per simmetria (la funzione è pari): $\\lim_{x \\to -1^+} f'(x) = +\\infty$ e $\\lim_{x \\to -2^-} f'(x) = -\\infty$.</p>\n          <p>Dunque in $x = \\pm 1, \\pm 2$ la derivata laterale (l'unica che abbia senso) è infinita: il grafico arriva in questi punti con una <strong>semitangente verticale</strong>. Non si parla di \"tangente verticale\" in senso bilaterale, perché da un lato la funzione non è definita.</p>",
        "<p><strong>Verifica diretta con il rapporto incrementale in $x = 1$.</strong> Per convincersi del risultato senza invocare il teorema, calcoliamo il rapporto incrementale dal solo lato accessibile. Per $h \\lt 0$ piccolo in modulo:</p>\n          <p>$$\\frac{f(1+h) - f(1)}{h} = \\frac{\\sqrt{(1+h)^2 - 3(1+h) + 2}}{h} = \\frac{\\sqrt{h^2 - h}}{h} = -\\sqrt{\\frac{h^2-h}{h^2}} = -\\sqrt{1 - \\frac{1}{h}} \\to -\\infty \\quad (h \\to 0^-)$$</p>\n          <p>dove si è usato $h = -|h| \\lt 0$. Analogamente, per $h \\gt 0$ in $x = 2$ si trova $\\frac{\\sqrt{h^2+h}}{h} = \\sqrt{1 + \\frac{1}{h}} \\to +\\infty$.</p>",
        "<p><strong>Il punto $x = 0$.</strong> Qui $0$ è interno a $[-1,1]$ e la funzione è continua (infatti $f(0) = \\sqrt{2}$ e $\\lim_{x \\to 0} f(x) = \\sqrt{2}$), ma le due espressioni analitiche si raccordano. Calcoliamo le derivate laterali <strong>dalla definizione</strong>, razionalizzando il numeratore.</p>\n          <p>Per $h \\gt 0$ (dove $f(h) = \\sqrt{h^2 - 3h + 2}$):</p>\n          <p>$$\\frac{f(h) - f(0)}{h} = \\frac{\\sqrt{h^2 - 3h + 2} - \\sqrt{2}}{h} = \\frac{h^2 - 3h + 2 - 2}{h\\left(\\sqrt{h^2 - 3h + 2} + \\sqrt{2}\\right)} = \\frac{h - 3}{\\sqrt{h^2 - 3h + 2} + \\sqrt{2}}$$</p>\n          <p>$$f'_+(0) = \\lim_{h \\to 0^+} \\frac{h-3}{\\sqrt{h^2-3h+2} + \\sqrt{2}} = \\frac{-3}{2\\sqrt{2}}$$</p>\n          <p>Per $h \\lt 0$ (dove $f(h) = \\sqrt{h^2 + 3h + 2}$):</p>\n          <p>$$\\frac{f(h) - f(0)}{h} = \\frac{h + 3}{\\sqrt{h^2 + 3h + 2} + \\sqrt{2}} \\to \\frac{3}{2\\sqrt{2}} \\quad (h \\to 0^-)$$</p>\n          <p>cioè $f'_-(0) = \\dfrac{3}{2\\sqrt{2}}$.</p>",
        "<p><strong>Stesso risultato con il teorema sul limite della derivata</strong> (più rapido): $f$ è continua in $0$ e derivabile in $(-1,0)$ e in $(0,1)$, quindi</p>\n          <p>$$f'_+(0) = \\lim_{x \\to 0^+} \\frac{2x-3}{2\\sqrt{x^2-3x+2}} = \\frac{-3}{2\\sqrt{2}}, \\qquad f'_-(0) = \\lim_{x \\to 0^-} \\frac{2x+3}{2\\sqrt{x^2+3x+2}} = \\frac{3}{2\\sqrt{2}}$$</p>\n          <p>Ricordare che questa uguaglianza non è la definizione di derivata laterale, ma una conseguenza del teorema, le cui ipotesi vanno controllate.</p>\n          <p>Le derivate destra e sinistra sono <strong>finite ma diverse</strong>: $x = 0$ è un <strong>punto angoloso</strong>.</p>",
        "<p><strong>6. Grafico qualitativo.</strong> Mettendo insieme tutte le informazioni otteniamo il grafico di $f(x) = \\sqrt{x^2 - 3|x| + 2}$.</p>\n          <figure class=\"figura\" data-id=\"analisi1_lez29a_g1\"><svg xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"640pt\" height=\"400pt\" viewBox=\"0 0 640 400\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\">\n <metadata>\n  <rdf:RDF xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:cc=\"http://creativecommons.org/ns#\" xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\">\n   <cc:Work>\n    <dc:type rdf:resource=\"http://purl.org/dc/dcmitype/StillImage\"/>\n    <dc:format>image/svg+xml</dc:format>\n    <dc:creator>\n     <cc:Agent>\n      <dc:title>Matplotlib v3.11.2, https://matplotlib.org/</dc:title>\n     </cc:Agent>\n    </dc:creator>\n   </cc:Work>\n  </rdf:RDF>\n </metadata>\n <defs>\n  <style type=\"text/css\">*{stroke-linejoin: round; stroke-linecap: butt}</style>\n </defs>\n <g id=\"analisi1_lez29a_g1-figure_1\">\n  <g id=\"analisi1_lez29a_g1-patch_1\">\n   <path d=\"M 0 400 \nL 640 400 \nL 640 0 \nL 0 0 \nL 0 400 \nz\n\" style=\"fill: none; opacity: 0\"/>\n  </g>\n  <g id=\"analisi1_lez29a_g1-axes_1\">\n   <g id=\"analisi1_lez29a_g1-patch_2\">\n    <path d=\"M 44.8 364 \nL 614.4 364 \nL 614.4 24 \nL 44.8 24 \nL 44.8 364 \nz\n\" style=\"fill: none\"/>\n   </g>\n   <g id=\"analisi1_lez29a_g1-matplotlib.axis_1\">\n    <g id=\"analisi1_lez29a_g1-xtick_1\">\n     <g id=\"analisi1_lez29a_g1-line2d_1\">\n      <path d=\"M 101.76 364 \nL 101.76 24 \n\" clip-path=\"url(#analisi1_lez29a_g1-p567094f00f)\" style=\"fill: none; stroke: #9aa4b2; stroke-opacity: 0.3; stroke-width: 0.6; stroke-linecap: square\"/>\n     </g>\n     <g id=\"analisi1_lez29a_g1-line2d_2\">\n      <defs>\n       <path id=\"analisi1_lez29a_g1-mb739ec79ed\" d=\"M 0 0 \nL 0 3 \n\" style=\"stroke: currentColor; stroke-width: 0.8\"/>\n      </defs>\n      <g>\n       <use xlink:href=\"#analisi1_lez29a_g1-mb739ec79ed\" x=\"1 archi: due rami illimitati, sopra $(-\\infty,-2]$ e $[2,+\\infty)$, che si avvicinano rispettivamente alle rette $y = -x - \\frac{3}{2}$ e $y = x - \\frac{3}{2}$, e un arco \"a cupola\" sopra $[-1,1]$, con vertice angoloso in $\\left(0, \\sqrt{2}\\right)$. Nei quattro punti $(\\pm 1, 0)$ e $(\\pm 2, 0)$ il grafico tocca l'asse $x$ con semitangente verticale e si interrompe, perché sopra $(-2,-1)$ e $(1,2)$ la funzione non è definita.</p>"
      ],
      "extra_content": "<details><summary>Esempio aggiuntivo generato: un’altra radice con modulo</summary><p>Per $u(x)=\\sqrt{x^2-4|x|+3}$ si impone $(|x|-1)(|x|-3)\\ge0$, ottenendo $$D_u=(-\\infty,-3]\\cup[-1,1]\\cup[3,+\\infty).$$ Gli zeri sono $\\pm1,\\pm3$ e sono minimi assoluti con semitangenti verticali. In $0$ le derivate laterali valgono $2/\\sqrt3$ e $-2/\\sqrt3$: c’è un massimo relativo angoloso di valore $\\sqrt3$. Gli asintoti sono $y=-x-2$ a $-\\infty$ e $y=x-2$ a $+\\infty$.</p><figure class=\"figura\" data-id=\"analisi1_lez29a_gp3\"><svg xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"640pt\" height=\"400pt\" viewBox=\"0 0 640 400\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\">\n <metadata>\n  <rdf:RDF xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:cc=\"http://creativecommons.org/ns#\" xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\">\n   <cc:Work>\n    <dc:type rdf:resource=\"http://purl.org/dc/dcmitype/StillImage\"/>\n    <dc:format>image/svg+xml</dc:format>\n    <dc:creator>\n     <cc:Agent>\n      <dc:title>Matplotlib v3.11.2, https://matplotlib.org/</dc:title>\n     </cc:Agent>\n    </dc:creator>\n   </cc:Work>\n  </rdf:RDF>\n </metadata>\n <defs>\n  <style type=\"text/css\">*{stroke-linejoin: round; stroke-linecap: butt}</style>\n </defs>\n <g id=\"analisi1_lez29a_gp3-figure_1\">\n  <g id=\"analisi1_lez29a_gp3-patch_1\">\n   <path d=\"M 0 400 \nL 640 400 \nL 640 0 \nL 0 0 \nL 0 400 \nz\n\" style=\"fill: none; opacity: 0\"/>\n  </g>\n  <g id=\"analisi1_lez29a_gp3-axes_1\">\n   <g id=\"analisi1_lez29a_gp3-patch_2\">\n    <path d=\"M 44.8 364 \nL 614.4 364 \nL 614.4 24 \nL 44.8 24 \nL 44.8 364 \nz\n\" style=\"fill: none\"/>\n   </g>\n   <g id=\"analisi1_lez29a_gp3-matplotlib.axis_1\">\n    <g id=\"analisi1_lez29a_gp3-xtick_1\">\n     <g id=\"analisi1_lez29a_gp3-line2d_1\">\n      <path d=\"M 85.485714 364 \nL 85.485714 24 \n\" clip-path=\"url(#analisi1_lez29a_gp3-pc56f9bab32)\" style=\"fill: none; stroke: #9aa4b2; stroke     {
      "id": "s05-consiglio",

      "icon": "💡",
      "content": "<p>È importante fare tutti i passaggi ed essere sicuri che il grafico sia sempre coerente con le informazioni trovate. Una buona pratica è <strong>aggiornare un bozzetto del grafico di volta in volta</strong>, ad ogni nuovo risultato ottenuto (dominio, segno, limiti, monotonia, ecc.).</p>"

    {
      "id": "s06-es-arctan",
      "type": "esercizio_svolto",
      "title": "Esercizio svolto — Studio di $f(x) = x\\,e^{-|\\arctan x|}$",
      "icon": "✎",
      "source": "docente",
      "content": "<p>Studiamo la funzione $f(x) = x\\,e^{-|\\arctan x|}$, concentrandoci in particolare sulla <strong>ricerca degli asintoti</strong> e lasciando il resto dello studio per esercizio.</p>",
      "steps": [
        "<p><strong>1. Dominio.</strong> La funzione è definita per ogni $x \\in \\mathbb{R}$, poiché arcotangente ed esponenziale sono definiti su tutto $\\mathbb{R}$:</p>\n          <p>$$\\mathrm{Dom}(f) = \\mathbb{R}$$</p>\n          <p>Inoltre $f$ è <strong>continua</strong> su tutto $\\mathbb{R}$, essendo composizione e prodotto di funzioni continue ($x \\mapsto x$, $\\arctan$, il valore assoluto e l'esponenziale).</p>",
        "<p><strong>2. Esplicitazione del modulo.</strong> Ricordiamo che $\\arctan x \\ge 0$ se e solo se $x \\ge 0$:</p>\n          <ul>\n            <li>se $x \\ge 0$, allora $|\\arctan x| = \\arctan x$;</li>\n            <li>se $x \\lt 0$, allora $|\\arctan x| = -\\arctan x$.</li>\n          </ul>\n          <p>$$f(x) = \\begin{cases} x\\,e^{-\\arctan x} & \\text{se } x \\ge 0 \\\\[4pt] x\\,e^{\\arctan x} & \\text{se } x \\lt 0 \\end{cases}$$</p>",
        "<p><strong>Simmetria: una scorciatoia utile.</strong> La funzione $f$ è <strong>dispari</strong>. Infatti $x \\mapsto x$ è dispari, mentre $x \\mapsto e^{-|\\arctan x|}$ è pari, perché $|\\arctan(-x)| = |-\\arctan x| = |\\arctan x|$. Il prodotto di una funzione dispari per una pari è dispari, dunque</p>\n          <p>$$f(-x) = -f(x) \\qquad \\text{per ogni } x \\in \\mathbb{R}$$</p>\n          <p>Il grafico è simmetrico rispetto all'origine e tutte le informazioni ottenute per $x \\to +\\infty$ si trasportano per simmetria a $x \\to -\\infty$. Lo useremo alla fine come controllo dei conti.</p>",
        "<p><strong>3a. Asintoti verticali: non ce ne sono</strong>, perché $f$ è continua su tutto $\\mathbb{R}$: per ogni $a \\in \\mathbb{R}$ si ha</p>\n          <p>$$\\lim_{x \\to a} f(x) = f(a) = a\\,e^{-|\\arctan a|} \\in \\mathbb{R}$$</p>\n          <p>quindi nessun limite al finito può essere infinito.</p>\n          <p><strong>Attenzione all'argomento usato:</strong> non basta osservare che il dominio è tutto $\\mathbb{R}$. Una funzione può essere definita in ogni punto reale e tuttavia divergere avvicinandosi a un punto in cui le è stato assegnato un valore finito. Per esempio</p>\n          <p>$$g(x) = \\begin{cases} 1/x^2 & x \\neq 0 \\\\ 0 & x = 0 \\end{cases}$$</p>\n          <p>ha dominio $\\mathbb{R}$ ma $x = 0$ è asintoto verticale. Ciò che esclude gli asintoti verticali è la <strong>continuità</strong> su tutto $\\mathbb{R}$, non il dominio.</p>",
        "<p><strong>3b. Asintoti orizzontali: non ce ne sono.</strong> Per $x \\to +\\infty$ il fattore $e^{-\\arctan x}$ tende alla costante positiva $e^{-\\pi/2}$, mentre il fattore $x$ diverge:</p>\n          <p>$$\\lim_{x \\to +\\infty} x\\,e^{-\\arctan x} = +\\infty, \\qquad \\lim_{x \\to -\\infty} x\\,e^{\\arctan x} = -\\infty$$</p>\n          <p>Poiché i limiti sono infiniti, ha senso cercare gli asintoti obliqui.</p>",
        "<p><strong>3c. Asintoto obliquo a $+\\infty$ — calcolo di $m$.</strong> Usiamo il ramo $f(x) = x\\,e^{-\\arctan x}$ (per $x \\gt 0$ la divisione per $x$ è lecita):</p>\n          <p>$$m = \\lim_{x \\to +\\infty} \\frac{x\\,e^{-\\arctan x}}{x} = \\lim_{x \\to +\\infty} e^{-\\arctan x}$$</p>\n          <p>Poiché $\\lim_{x \\to +\\infty} \\arctan x = \\frac{\\pi}{2}$ e l'esponenziale è continua:</p>\n          <p>$$m = e^{-\\frac{\\pi}{2}} \\in \\mathbb{R} \\setminus \\{0\\}$$</p>",
        "<p><strong>Calcolo di $q$.</strong></p>\n          <p>$$q = \\lim_{x \\to +\\infty}\\left[x\\,e^{-\\arctan x} - x\\,e^{-\\frac{\\pi}{2}}\\right] = \\lim_{x \\to +\\infty} x\\left(e^{-\\arctan x} - e^{-\\frac{\\pi}{2}}\\right)$$</p>\n          <p>Dalla forma indeterminata $\\infty - \\infty$ siamo passati a $\\infty \\cdot 0$. Raccogliamo $e^{-\\pi/2}$ dentro la parentesi, così da ottenere la struttura $e^t - 1$:</p>\n          <p>$$e^{-\\arctan x} - e^{-\\frac{\\pi}{2}} = e^{-\\frac{\\pi}{2}}\\left(e^{\\frac{\\pi}{2} - \\arctan x} - 1\\right) \\;\\Rightarrow\\; q = \\lim_{x \\to +\\infty} x\\,e^{-\\frac{\\pi}{2}}\\left(e^{\\frac{\\pi}{2}-\\arctan x} - 1\\right)$$</p>",
        "<p><strong>Uso dell'identità dell'arcotangente.</strong> Vale $\\arctan x + \\arctan\\left(\\frac{1}{x}\\right) = \\frac{\\pi}{2}$ per $x \\gt 0$, da cui $\\frac{\\pi}{2} - \\arctan x = \\arctan\\left(\\frac{1}{x}\\right)$:</p>\n          <p>$$q = \\lim_{x \\to +\\infty} x\\,e^{-\\frac{\\pi}{2}}\\left(e^{\\arctan\\left(\\frac{1}{x}\\right)} - 1\\right)$$</p>\n          <p>Per $x \\to +\\infty$ si ha $\\frac{1}{x} \\to 0$ e quindi $t := \\arctan\\left(\\frac{1}{x}\\right) \\to 0$. Applichiamo, nell'ordine, le due equivalenze asintotiche</p>\n          <p>$$e^t - 1 \\sim t \\quad (t \\to 0), \\qquad \\arctan u \\sim u \\quad (u \\to 0)$$</p>\n          <p>$$e^{\\arctan\\left(\\frac{1}{x}\\right)} - 1 \\;\\sim\\; \\arctan\\left(\\frac{1}{x}\\right) \\;\\sim\\; \\frac{1}{x} \\qquad (x \\to +\\infty)$$</p>\n          <p>Poiché $x\\,e^{-\\pi/2}$ è un fattore moltiplicativo, possiamo sostituire l'equivalente asintotico:</p>\n          <p>$$q = \\lim_{x \\to +\\infty} x\\,e^{-\\frac{\\pi}{2}} \\cdot \\frac{1}{x} = e^{-\\frac{\\pi}{2}}$$</p>\n          <p>L'asintoto obliquo a $+\\infty$ è quindi</p>\n          <p>$$y = e^{-\\frac{\\pi}{2}} x + e^{-\\frac{\\pi}{2}} = e^{-\\frac{\\pi}{2}}(x+1)$$</p>",
        "<p><strong>Nota del Prof.</strong> Durante la lezione, per un errore di calcolo, il valore di $q$ era stato indicato come $1$. Il procedimento corretto porta a $q = e^{-\\pi/2}$: il fattore $e^{-\\pi/2}$ raccolto all'inizio non va dimenticato. L'idea chiave è usare l'identità dell'arcotangente per trasformare la forma indeterminata $\\infty \\cdot 0$ in un limite notevole.</p>",
        "<p><strong>Verifica numerica (controllo di plausibilità).</strong> Con $e^{-\\pi/2} \\approx 0{,}2079$ l'asintoto è $y \\approx 0{,}2079\\,(x+1)$. Confrontiamo alcuni valori (tutti <em>arrotondati</em>):</p>\n          <p>$$\\begin{array}{c|c|c} x & f(x) = x\\,e^{-\\arctan x} & 0{,}2079\\,(x+1) \\\\ \\hline 5 & 5\\,e^{-1{,}3734} \\approx 1{,}266 & 1{,}247 \\\\ 20 & 20\\,e^{-1{,}5208} \\approx 4{,}371 & 4{,}366 \\\\ 100 & 100\\,e^{-1{,}5608} \\approx 20{,}997 & 20{,}998 \\end{array}$$</p>\n          <p>I valori si avvicinano, come ci si aspetta. <strong>Attenzione però:</strong> ciò che tende a zero è la differenza con l'asintoto <em>esatto</em>, cioè $f(x) - e^{-\\pi/2}(x+1) \\to 0$, come dimostrato analiticamente sopra. La retta $y = 0{,}2079(x+1)$ è solo un'approssimazione: poiché $e^{-\\pi/2} \\lt 0{,}2079$, la differenza $f(x) - 0{,}2079(x+1)$ tende in realtà a $-\\infty$. Una tabella di pochi valori, inoltre, non dimostra mai un limite: serve solo come controllo a valori finiti.</p>",
        "<p><strong>3d. Asintoto obliquo a $-\\infty$ (lasciato per esercizio).</strong> Si deve usare il ramo $f(x) = x\\,e^{\\arctan x}$ e ricordare che $\\lim_{x \\to -\\infty} \\arctan x = -\\frac{\\pi}{2}$. <em>Hint per lo svolgimento:</em></p>\n          <p>$$m = \\lim_{x \\to -\\infty} \\frac{x\\,e^{\\arctan x}}{x} = \\lim_{x \\to -\\infty} e^{\\arctan x} = e^{-\\frac{\\pi}{2}}$$</p>\n          <p>Per $q$ si raccoglie come prima:</p>\n          <p>$$q = \\lim_{x \\to -\\infty} x\\,e^{-\\frac{\\pi}{2}}\\left(e^{\\arctan x + \\frac{\\pi}{2}} - 1\\right)$$</p>\n          <p>e si usa l'identità valida <em>per $x \\lt 0$</em>: $\\arctan x + \\arctan\\left(\\frac{1}{x}\\right) = -\\frac{\\pi}{2}$, cioè $\\arctan x + \\frac{\\pi}{2} = -\\arctan\\left(\\frac{1}{x}\\right)$. Con $e^t - 1 \\sim t$ e $\\arctan u \\sim u$:</p>\n          <p>$$q = \\lim_{x \\to -\\infty} x\\,e^{-\\frac{\\pi}{2}}\\left(-\\frac{1}{x}\\right) = -e^{-\\frac{\\pi}{2}}$$</p>\n          <p>L'asintoto obliquo a $-\\infty$ è $y = e^{-\\frac{\\pi}{2}}(x-1)$. Il risultato è coerente con la disparità di $f$: la simmetria rispetto all'origine manda la retta $y = e^{-\\pi/2}(x+1)$ nella retta $y = e^{-\\pi/2}(x-1)$, esattamente quella trovata. È un buon modo per accorgersi subito di eventuali errori di segno.</p>",
        "<p><strong>4. Derivata e monotonia (per esercizio).</strong> Lo studio della derivata prima, della derivata seconda e il tracciamento del grafico completo sono lasciati per esercizio. Si tenga presente che in $x = 0$ conviene calcolare separatamente le derivate destra e sinistra dei due rami:</p>\n          <p>$$f'(0^+) = \\lim_{x \\to 0^+} e^{-\\arctan x}\\left(1 - \\frac{x}{1+x^2}\\right) = 1, \\qquad f'(0^-) = \\lim_{x \\to 0^-} e^{\\arctan x}\\left(1 + \\frac{x}{1+x^2}\\right) = 1$$</p>\n          <p>Le due derivate laterali coincidono, dunque $f$ è derivabile in $0$ con $f'(0) = 1$: qui il valore assoluto <strong>non</strong> genera un punto angoloso, perché il fattore $x$ si annulla in $0$. In generale, invece, un modulo può generarlo, e va sempre controllato.</p>"
      ],
      "extra_content": "<p><strong>Disegno di riepilogo aggiunto nella revisione.</strong> La derivata è positiva in entrambi i rami: i fattori $1-x/(1+x^2)$ per $x\\gt0$ e $1+x/(1+x^2)$ per $x\\lt0$ sono almeno $1/2$. La funzione è quindi strettamente crescente su $\\mathbb{R}$; le due derivate laterali in $0$ valgono entrambe $1$.</p><figure class=\"figura\" data-id=\"analisi1_lez29b_g2\"><svg xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"800pt\" height=\"470pt\" viewBox=\"0 0 800 470\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\">\n <metadata>\n  <rdf:RDF xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:cc=\"http://creativecommons.org/ns#\" xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\">\n   <cc:Work>\n    <dc:type rdf:resource=\"http://purl.org/dc/dcmitype/StillImage\"/>\n    <dc:date>2026-11-13T20:34:14.781187</dc:date>\n    <dc:format>image/svg+xml</dc:format>\n    <dc:creator>\n     <cc:Agent>\n      <dc:title>Matplotlib v3.11.2, https://matplotlib.org/</dc:title>\n     </cc:Agent>\n    </dc:creator>\n   </cc:Work>\n  </rdf:RDF>\n </metadata>\n <defs>\n  <style type=\"text/css\">*{stroke-linejoin: round; stroke-linecap: butt}</style>\n </defs>\n <g id=\"analisi1_lez29b_g2-figure_1\">\n  <g id=\"analisi1_lez29b_g2-patch_1\">\n   <path d=\"M 0 470 \nL 800 470 \nL 800 0 \nL 0 0 \nL 0 470 \nz\n\" style=\"fill: none; opacity: 0\"/>\n  </g>\n  <g id=\"analisi1_lez29b_g2-axes_1\">\n   <g id=\"analisi1_lez29b_g2-patch_2\">\n    <path d=\"M 56 427.7 \nL 768 427.7 \nL 768 28.2 \nL 56 28.2 \nL 56 427.7 \nz\n\" style=\"fill: none\"/>\n   </g>\n   <g id=\"analisi1_lez29b_g2-matplotlib.axis_1\">\n    <g id=\"analisi1_lez29b_g2-xtick_1\">\n     <g id=\"analisi1_lez29b_g2-line2d_1\">\n      <path d=\"M 83.384615 427.7 \nL 83.384615 28.2 \n\" clip-path=\"url(#analisi1_lez29b_g2-p87ef9631f6)\" style=\"fill: none; stroke: #9aa4b2; stroke-opacity: 0.3; stroke-width: 0.6; stroke-linecap: square\"/>\n     </g>\n     <g id=\"analisi1_lez29b_g2-line2d_2\ 3434 1093 3506 \nQ 1184 3578 1300 3578 \nQ 1450 3578 1564 3479 \nQ 1678 3381 1678 3231 \nQ 1678 3166 1644 3084 \nL 488 319 \nQ 466 275 428 275 \nQ 394 275 320 306 \nQ 247 338 225 347 \nz\n\" transform=\"scale(0.015625)\"/>\n     </defs>\n     <use xlink:href=\"#analisi1_lez29b_g2-DejaVuSans-Oblique-49\" transform=\"translate(0 0.565625)\"/>\n     <use xlink:href=\"#analisi1_lez29b_g2-DejaVuSans-b\" transform=\"translate(35.205078 0.565625)\"/>\n     <use xlink:href=\"#analisi1_lez29b_g2-DejaVuSans-13\" transform=\"translate(74.21875 0.565625)\"/>\n     <use xlink:href=\"#analisi1_lez29b_g2-DejaVuSans-c\" transform=\"translate(137.841797 0.565625)\"/>\n     <use xlink:href=\"#analisi1_lez29b_g2-DejaVuSans-20\" transform=\"translate(196.337891 0.565625)\"/>\n     <use xlink:href=\"#analisi1_lez29b_g2-DejaVuSans-13\" transform=\"translate(299.609375 0.565625)\"/>\n     <use xlink:href=\"#analisi1_lez29b_g2-DejaVuSans-f\" transform=\"translate(363.232422 0.565625)\"/>\n     <use xlink:href=\"#analisi1_lez29b_g2-DejaVuSans-3\" transform=\"translate(395.019531 0.565625)\"/>\n     <use xlink:href=\"#analisi1_lez29b_g2-DejaVuSans-Oblique-49\" transform=\"translate(426.806641 0.565625)\"/>\n     <use xlink:href=\"#analisi1_lez29b_g2-Cmsy10-49\" transform=\"translate(469.459427 41.865625) scale(0.7)\"/>\n     <use xlink:href=\"#analisi1_lez29b_g2-DejaVuSans-b\" transform=\"translate(491.436966 0.565625)\"/>\n     <use xlink:href=\"#analisi1_lez29b_g2-DejaVuSans-13\" transform=\"translate(530.450638 0.565625)\"/>\n     <use xlink:href=\"#analisi1_lez29b_g2-DejaVuSans-c\" transform=\"translate(594.073685 0.565625)\"/>\n     <use xlink:href=\"#analisi1_lez29b_g2-DejaVuSans-20\" transform=\"translate(652.569779 0.565625)\"/>\n     <use xlink:href=\"#analisi1_lez29b_g2-DejaVuSans-14\" transform=\"translate(755.841263 0.565625)\"/>\n    </g>\n   </g>\n  </g>\n </g>\n <defs>\n  <clipPath id=\"analisi1_lez29b_g2-p87ef9631f6\">\n   <rect x=\"56\" y=\"28.2\" width=\"712\" height=\"399.5\"/>\n  </clipPath>\n </defs>\n</svg><figcaption>$f(x)=xe^{-|\\arctan x|}$ è dispari e strettamente crescente. Posto $m=e^{-\\pi/2}$, gli asintoti sono $y=m(x-1)$ a $-\\infty$ e $y=m(x+1)$ a $+\\infty$. In $0$ la tangente è $y=x$, perché $f^{\\prime}(0)=1$: non c’è un punto angoloso.</figcaption></figure>"

    {
      "id": "s07-es-log",
      "type": "esercizio_svolto",
      "title": "Esercizio svolto — Studio di $f(x) = \\ln\\sqrt{e^{2x}-3e^x+3}$",
      "icon": "✎",
      "source": "docente",
      "content": "<p>Studiamo la funzione $f(x) = \\ln\\sqrt{e^{2x}-3e^x+3}$: dominio, asintoti, monotonia e grafico.</p>",
      "steps": [
        "<p><strong>1. Dominio.</strong> Il logaritmo richiede argomento strettamente positivo; l'argomento è una radice quadrata, definita e strettamente positiva se e solo se il radicando è strettamente positivo:</p>\n          <p>$$e^{2x}-3e^x+3 \\gt 0$$</p>\n          <p>Poniamo $t = e^x$, osservando che $e^{2x} = (e^x)^2 = t^2$ e che $e^x \\gt 0$ per ogni $x$, quindi $t \\gt 0$. La disequazione diventa $t^2 - 3t + 3 \\gt 0$, con discriminante</p>\n          <p>$$\\Delta = (-3)^2 - 4 \\cdot 1 \\cdot 3 = 9 - 12 = -3$$</p>\n          <p>Poiché $\\Delta \\lt 0$ e $a = 1 \\gt 0$, il trinomio è sempre positivo: la condizione è sempre soddisfatta e</p>\n          <p>$$\\mathrm{Dom}(f) = \\mathbb{R}$$</p>",
        "<p><strong>Riscrittura utile.</strong> Essendo l'argomento del logaritmo strettamente positivo su tutto $\\mathbb{R}$, possiamo usare $\\ln\\sqrt{A} = \\frac{1}{2}\\ln A$ e scrivere, <em>per ogni</em> $x \\in \\mathbb{R}$,</p>\n          <p>$$f(x) = \\frac{1}{2}\\ln\\left(e^{2x}-3e^x+3\\right)$$</p>\n          <p>Da questa scrittura si vede anche che $f$ è continua (e derivabile) su tutto $\\mathbb{R}$, come composizione di funzioni continue (e derivabili) con argomento del logaritmo mai nullo.</p>",
        "<p><strong>2a. Asintoti verticali: non ce ne sono</strong>, perché $f$ è continua su tutto $\\mathbb{R}$: per ogni $a \\in \\mathbb{R}$</p>\n          <p>$$\\lim_{x \\to a} f(x) = f(a) = \\frac{1}{2}\\ln\\left(e^{2a}-3e^a+3\\right) \\in \\mathbb{R}$$</p>\n          <p>che è un numero finito. Come nell'esercizio precedente, è la <strong>continuità</strong> (non il semplice fatto che il dominio sia $\\mathbb{R}$) a garantire l'assenza di asintoti verticali.</p>",
        "<p><strong>2b. Comportamento a $+\\infty$.</strong> Poiché $e^{2x}-3e^x+3 \\to +\\infty$ (il termine $e^{2x}$ è dominante),</p>\n          <p>$$\\lim_{x \\to +\\infty} \\frac{1}{2}\\ln\\left(e^{2x}-3e^x+3\\right) = +\\infty$$</p>\n          <p>Non c'è asintoto orizzontale: cerchiamo l'obliquo. Calcoliamo $m$ raccogliendo $e^{2x}$ dentro il logaritmo:</p>\n          <p>$$m = \\lim_{x \\to +\\infty} \\frac{\\ln(e^{2x}-3e^x+3)}{2x} = \\lim_{x \\to +\\infty} \\frac{\\ln\\left(e^{2x}\\left(1-3e^{-x}+3e^{-2x}\\right)\\right)}{2x}$$</p>\n          <p>$$= \\lim_{x \\to +\\infty} \\frac{2x + \\ln\\left(1-3e^{-x}+3e^{-2x}\\right)}{2x} = \\lim_{x \\to +\\infty}\\left(1 + \\frac{\\ln\\left(1-3e^{-x}+3e^{-2x}\\right)}{2x}\\right) = 1 + 0 = 1$$</p>\n          <p>L'ultimo passaggio si giustifica così: per $x \\to +\\infty$ si ha $e^{-x} \\to 0$ e $e^{-2x} \\to 0$, dunque l'argomento del logaritmo tende a $1$ e il numeratore tende a $\\ln 1 = 0$, mentre il denominatore $2x \\to +\\infty$; il rapporto è del tipo $\\frac{0}{\\infty}$, che tende a $0$ (<strong>non</strong> è una forma indeterminata).</p>",
        "<p><strong>Calcolo di $q$.</strong> Il trucco è scrivere $x = \\frac{1}{2}\\ln(e^{2x})$, così da poter usare la differenza di logaritmi:</p>\n          <p>$$q = \\lim_{x \\to +\\infty}\\left[\\frac{1}{2}\\ln\\left(e^{2x}-3e^x+3\\right) - \\frac{1}{2}\\ln\\left(e^{2x}\\right)\\right] = \\frac{1}{2}\\lim_{x \\to +\\infty} \\ln\\left(\\frac{e^{2x}-3e^x+3}{e^{2x}}\\right)$$</p>\n          <p>$$= \\frac{1}{2}\\lim_{x \\to +\\infty} \\ln\\left(1-3e^{-x}+3e^{-2x}\\right) = \\frac{1}{2}\\ln 1 = 0$$</p>\n          <p>L'asintoto obliquo a $+\\infty$ è dunque la retta $y = x$.</p>",
        "<p><strong>Da che parte si avvicina il grafico?</strong> Per $x$ grande si ha $1-3e^{-x}+3e^{-2x} \\lt 1$ (il termine $-3e^{-x}$ domina su $+3e^{-2x}$), quindi</p>\n          <p>$$f(x) - x = \\frac{1}{2}\\ln\\left(1-3e^{-x}+3e^{-2x}\\right) \\lt 0$$</p>\n          <p>Il grafico si avvicina all'asintoto $y = x$ <strong>dal basso</strong>. Questa informazione è preziosa per disegnare correttamente il grafico.</p>",
        "<p><strong>2c. Comportamento a $-\\infty$.</strong> Per $x \\to -\\infty$ si ha $e^x \\to 0^+$ e $e^{2x} \\to 0^+$, quindi l'argomento tende a $3$ e, per continuità del logaritmo,</p>\n          <p>$$\\lim_{x \\to -\\infty} f(x) = \\frac{1}{2}\\ln(0 - 0 + 3) = \\frac{1}{2}\\ln 3 = \\ln\\sqrt{3}$$</p>\n          <p>Esiste dunque un <strong>asintoto orizzontale a $-\\infty$</strong> di equazione $y = \\ln\\sqrt{3} \\approx 0{,}549$.</p>",
        "<p><strong>3. Derivata prima e monotonia.</strong> Usiamo la forma $f(x) = \\frac{1}{2}\\ln\\left(e^{2x}-3e^x+3\\right)$ e la regola della catena:</p>\n          <p>$$f'(x) = \\frac{1}{2} \\cdot \\frac{1}{e^{2x}-3e^x+3} \\cdot \\left(2e^{2x}-3e^x\\right) = \\frac{e^x\\left(2e^x-3\\right)}{2\\left(e^{2x}-3e^x+3\\right)}$$</p>\n          <p>Il denominatore $2\\left(e^{2x}-3e^x+3\\right)$ è sempre strettamente positivo (come visto nello studio del dominio) e anche il fattore $e^x$ al numeratore lo è. Il segno dipende quindi solo da $2e^x - 3$:</p>\n          <p>$$2e^x - 3 \\ge 0 \\iff e^x \\ge \\frac{3}{2} \\iff x \\ge \\ln\\left(\\frac{3}{2}\\right)$$</p>\n          <p>dove nell'ultimo passaggio abbiamo usato la monotonia crescente del logaritmo. Dunque $f$ è strettamente <strong>decrescente</strong> per $x \\lt \\ln(3/2)$ e strettamente <strong>crescente</strong> per $x \\gt \\ln(3/2)$: il punto $x_0 = \\ln(3/2) \\approx 0{,}405$ è un punto di <strong>minimo assoluto</strong>.</p>",
        "<p><strong>Valore del minimo.</strong> Se $x_0 = \\ln(3/2)$, allora $e^{x_0} = 3/2$ e $e^{2x_0} = 9/4$:</p>\n          <p>$$y_{\\min} = \\frac{1}{2}\\ln\\left(\\frac{9}{4} - \\frac{9}{2} + 3\\right) = \\frac{1}{2}\\ln\\left(\\frac{9 - 18 + 12}{4}\\right) = \\frac{1}{2}\\ln\\left(\\frac{3}{4}\\right) = \\ln\\left(\\frac{\\sqrt{3}}{2}\\right) \\approx -0{,}144$$</p>\n          <p>Il punto di minimo è $M = \\left(\\ln\\frac{3}{2},\\; \\ln\\frac{\\sqrt{3}}{2}\\right)$.</p>",
        "<p><strong>Controllo di coerenza.</strong> Il valore minimo $\\ln\\frac{\\sqrt{3}}{2} \\approx -0{,}144$ è negativo, mentre il livello dell'asintoto orizzontale a $-\\infty$ è $\\ln\\sqrt{3} \\approx 0{,}549$: coerente, perché scendendo da $\\ln\\sqrt{3}$ verso il minimo la funzione deve assumere valori minori di $\\ln\\sqrt{3}$. Inoltre $f$ è negativa in un intorno del minimo e positiva per $x$ grande, quindi il grafico attraversa l'asse $x$ dopo il minimo. Gli zeri si trovano risolvendo $f(x) = 0$, cioè $e^{2x}-3e^x+3 = 1$: con $u = e^x \\gt 0$ si ottiene $u^2 - 3u + 2 = 0$, da cui $u = 1$ oppure $u = 2$, ossia $x = 0$ e $x = \\ln 2 \\approx 0{,}693$. Dunque $f \\gt 0$ per $x \\lt 0$, $f \\lt 0$ per $0 \\lt x \\lt \\ln 2$ e $f \\gt 0$ per $x \\gt \\ln 2$; in particolare $f(0) = \\frac{1}{2}\\ln(1-3+3) = \\frac{1}{2}\\ln 1 = 0$.</p>",
        "<p><strong>4. Derivata seconda e concavità.</strong> Il calcolo della derivata seconda è laborioso e in aula è stato omesso: in questa sede la concavità <em>non viene studiata</em>, e le informazioni già raccolte (dominio, asintoti, monotonia, minimo, zero in $x = 0$) sono sufficienti per tracciare un grafico qualitativo attendibile.</p>\n          <p><strong>Attenzione:</strong> è sbagliato dedurre dalla sola presenza di un unico punto di minimo che la funzione sia convessa su tutto $\\mathbb{R}$. Monotonia e concavità sono informazioni indipendenti: qui, come mostra l'integrazione a parte, la concavità cambia due volte.</p>",
        "<p><strong>5. Grafico della funzione.</strong> Riassumiamo:</p>\n          <ul>\n            <li>Dominio $\\mathbb{R}$; funzione continua e derivabile su $\\mathbb{R}$, senza asintoti verticali.</li>\n            <li>Asintoto orizzontale a $-\\infty$: $y = \\ln\\sqrt{3} \\approx 0{,}55$.</li>\n            <li>Asintoto obliquo a $+\\infty$: $y = x$, avvicinato dal basso.</li>\n            <li>Decrescente per $x \\lt \\ln(3/2)$, crescente per $x \\gt \\ln(3/2)$.</li>\n            <li>Minimo assoluto in $M = \\left(\\ln\\frac{3}{2}, \\ln\\frac{\\sqrt{3}}{2}\\right) \\approx (0{,}4;\\, -0{,}14)$.</li>\n            <li>Zeri in $x = 0$ e $x = \\ln 2 \\approx 0{,}69$; quindi $f \\gt 0$ per $x \\lt 0$, $f \\lt 0$ per $0 \\lt x \\lt \\ln 2$, $f \\gt 0$ per $x \\gt \\ln 2$.</li>\n          </ul>\n          <figure class=\"figura\" data-id=\"analisi1_lez29b_g1\"><svg xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"864pt\" height=\"360pt\" viewBox=\"0 0 864 360\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\">\n <metadata>\n  <rdf:RDF xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:cc=\"http://creativecommons.org/ns#\" xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\">\n   <cc:Work>\n    <dc:type rdf:resource=\"http://purl.org/dc/dcmitype/StillImage\"/>\n    <dc:date>2026-11-13T20:34:14.407078</dc:date>\n    <dc:format>image/svg+xml</dc:format>\n    <dc:creator>\n     <cc:Agent>\n      <dc:title>Matplotlib v3.11.2, https://matplotlib.org/</dc:title>\n     </cc:Agent>\n    </dc:creator>\n   </cc:Work>\n  </rdf:RDF>\n </metadata>\n <defs>\n  <style type=\"text/css\">*{stroke-linejoin: round; stroke-linecap: butt}</style>\n </defs>\n <g id=\"analisi1_lez29b_g1-figure_1\">\n  <g id=\"analisi1_lez29b_g1-patch_1\">\n   <path d=\"M 0 360 \nL 864 360 \nL 864 0 \nL 0 0 \nL 0 360 \nz\n\" style=\"fill: none; opacity: 0\"/>\n  </g>\n  <g id=\"analisi1_lez29b_g1-axes_1\">\n   <g id=\"analisi1_lez29b_g1-patch_2\">\n    <path d=\"M 60.48 306 \nL 394.213906 306       "content": "<p>Per completezza calcoliamo la derivata seconda di $f(x) = \\frac{1}{2}\\ln\\left(e^{2x}-3e^x+3\\right)$. Partendo da</p>\n        <p>$$f'(x) = \\frac{2e^{2x}-3e^{x}}{2\\left(e^{2x}-3e^{x}+3\\right)}$$</p>\n        <p>applichiamo la regola del quoziente con $N(x) = 2e^{2x}-3e^x$ e $D(x) = 2\\left(e^{2x}-3e^x+3\\right)$, da cui $N'(x) = 4e^{2x}-3e^x$ e $D'(x) = 2\\left(2e^{2x}-3e^x\\right)$:</p>\n        <p>$$f''(x) = \\frac{N'(x)D(x) - N(x)D'(x)}{D(x)^2} = \\frac{2\\left[\\left(4e^{2x}-3e^{x}\\right)\\left(e^{2x}-3e^{x}+3\\right) - \\left(2e^{2x}-3e^{x}\\right)^{2}\\right]}{4\\left(e^{2x}-3e^{x}+3\\right)^{2}}$$</p>\n        <p>Poniamo $u = e^x \\gt 0$ e sviluppiamo la parentesi quadra:</p>\n        <p>$$\\left(4u^{2}-3u\\right)\\left(u^{2}-3u+3\\right) - \\left(2u^{2}-3u\\right)^{2} = \\left(4u^{4}-15u^{3}+21u^{2}-9u\\right) - \\left(4u^{4}-12u^{3}+9u^{2}\\right)$$</p>\n        <p>$$= -3u^{3}+12u^{2}-9u = -3u\\left(u^{2}-4u+3\\right) = -3u(u-1)(u-3)$$</p>\n        <p>Tornando alla variabile $x$ e semplificando il fattore $2$:</p>\n        <p>$$f''(x) = -\\frac{3e^{x}\\left(e^{x}-1\\right)\\left(e^{x}-3\\right)}{2\\left(e^{2x}-3e^{x}+3\\right)^{2}}$$</p>\n        <p><strong>Segno.</strong> Il fattore $\\dfrac{3e^{x}}{2\\left(e^{2x}-3e^{x}+3\\right)^{2}}$ è sempre strettamente positivo, quindi</p>\n        <p>$$\\operatorname{sgn} f''(x) = -\\operatorname{sgn}\\left[\\left(e^{x}-1\\right)\\left(e^{x}-3\\right)\\right]$$</p>\n        <p>Con $u = e^x$, il prodotto $(u-1)(u-3)$ è positivo per $u \\lt 1$ oppure $u \\gt 3$, negativo per $1 \\lt u \\lt 3$. Poiché $u = e^x \\lt 1 \\iff x \\lt 0$ e $u \\gt 3 \\iff x \\gt \\ln 3$:</p>\n        <ul>\n          <li>$f''(x) \\lt 0$ per $x \\lt 0$ e per $x \\gt \\ln 3$: la funzione è <strong>concava</strong>;</li>\n          <li>$f''(x) \\gt 0$ per $0 \\lt x \\lt \\ln 3$: la funzione è <strong>convessa</strong>;</li>\n          <li>$f''(0) = f''(\\ln 3) = 0$ con cambio di segno: $x = 0$ e $x = \\ln 3 \\approx 1{,}099$ sono <strong>punti di flesso</strong>.</li>\n        </ul>\n        <p>I valori nei flessi sono</p>\n        <p>$$f(0) = \\frac{1}{2}\\ln(1-3+3) = 0, \\qquad f(\\ln 3) = \\frac{1}{2}\\ln(9-9+3) = \\frac{1}{2}\\ln 3 = \\ln\\sqrt{3}$$</p>\n        <p>Quadro coerente con il grafico: a $-\\infty$ la curva si appiattisce (concava) sull'asintoto $y = \\ln\\sqrt{3}$, scende attraversando il flesso in $x = 0$, risale convessa passando per il minimo in $x = \\ln(3/2)$, e dopo il flesso in $x = \\ln 3$ diventa concava avvicinandosi dal basso all'asintoto obliquo $y = x$. In particolare, <strong>non</strong> è vero che la funzione sia convessa su tutto $\\mathbb{R}$.</p><details><summary>Esempio aggiuntivo generato: una variante logaritmica</summary><p>La funzione $v(x)=\\frac12\\ln(e^{2x}-e^x+1)$ è definita su $\\mathbb{R}$ perché $t^2-t+1=(t-\\frac12)^2+\\frac34>0$. La derivata $$v^{\\prime}(x)=\\frac{e^x(2e^x-1)}{2(e^{2x}-e^x+1)}$$ cambia segno da negativa a positiva in $x=-\\ln2$, dove si raggiunge il minimo assoluto $\\frac12\\ln(3/4)$. Lo zero è $x=0$; gli asintoti sono $y=0$ a $-\\infty$ e $y=x$ a $+\\infty$.</p><figure class=\"figura\" data-id=\"analisi1_lez29b_gp3\"><svg xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"800pt\" height=\"470pt\" viewBox=\"0 0 800 470\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\">\n <metadata>\n  <rdf:RDF xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:cc=\"http://creativecommons.org/ns#\" xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\">\n   <cc:Work>\n    <dc:type rdf:resource=\"http://purl.org/dc/dcmitype/StillImage\"/>\n    <dc:date>2026-11-13T20:34:14.547036</dc:date>\n    <dc:format>image/svg+xml</dc:format>\n    <dc:creator>\n     <cc:Agent>\n      <dc:title>Matplotlib v3.11.2, https://matplotlib.org/</dc:title>\n     </cc:Agent>\n    </dc:creator>\n   </cc:Work>\n  </rdf:RDF>\n </metadata>\n <defs>\n  <style type=\"text/css\">*{stroke-linejoin: round; stroke-linecap: butt}</style>\n </defs>\n <g       "id": "s09-takeaway",
      "type": "note_box",
      "title": "Che cosa portarsi a casa",
      "icon": "🎒",
      "content": "<p>I due esercizi sugli asintoti mostrano due tecniche ricorrenti nella ricerca degli asintoti obliqui:</p>\n        <ol>\n          <li>con <strong>esponenziali e arcotangenti</strong>, si raccoglie il limite della parte \"costante\" per ricondursi a $e^t - 1 \\sim t$, usando l'identità $\\arctan x + \\arctan(1/x) = \\pm\\frac{\\pi}{2}$ (segno $+$ per $x \\gt 0$, $-$ per $x \\lt 0$);</li>\n          <li>con i <strong>logaritmi</strong>, si raccoglie il termine dominante dentro il logaritmo e si usa $\\ln(AB) = \\ln A + \\ln B$, oppure si scrive $mx$ come logaritmo per sfruttare $\\ln A - \\ln B = \\ln(A/B)$.</li>\n        </ol>\n        <p>In entrambi i casi, l'assenza di asintoti verticali si giustifica con la <strong>continuità</strong> della funzione su tutto il dominio, e ogni risultato va confrontato con il bozzetto del grafico.</p>"

    {
      "id": "s11-teoria-1",
      "type": "esercizio",
      "title": "Teoria 1",
      "kind": "teoria",
      "source": "integrazione",
      "icon": "🧠",
      "content": "<p>Sia $f$ continua in $x_0$. Dare la definizione di punto angoloso, di punto di cuspide e di punto a tangente verticale in termini di derivate laterali, e classificare in questi termini i punti $x = 0$, $x = 1$ e $x = 2$ per $f(x) = \\sqrt{x^2 - 3|x| + 2}$.</p>",
      "solution": "<p>Siano $f'_-(x_0) = \\lim_{h \\to 0^-}\\frac{f(x_0+h)-f(x_0)}{h}$ e $f'_+(x_0) = \\lim_{h \\to 0^+}\\frac{f(x_0+h)-f(x_0)}{h}$. Con $f$ continua in $x_0$ si dice che $x_0$ è:</p>\n        <ul>\n          <li><strong>punto angoloso</strong> se $f'_-(x_0)$ e $f'_+(x_0)$ esistono come limiti estesi, sono diversi e almeno uno è finito;</li>\n          <li><strong>punto di cuspide</strong> se sono entrambe infinite di segno opposto;</li>\n          <li><strong>punto a tangente verticale</strong> se sono entrambe infinite dello stesso segno.</li>\n        </ul>\n        <p>In tutti e tre i casi $f$ non è derivabile in $x_0$.</p>\n        <p>Per $f(x) = \\sqrt{x^2-3|x|+2}$ si ha $D_f = (-\\infty,-2] \\cup [-1,1] \\cup [2,+\\infty)$. In $x = 0$, punto interno a $[-1,1]$, le derivate laterali valgono $f'_-(0) = \\frac{3}{2\\sqrt{2}}$ e $f'_+(0) = -\\frac{3}{2\\sqrt{2}}$: finite e diverse, dunque $x = 0$ è un <strong>punto angoloso</strong> (ed è un massimo locale, perché $f'_-(0) \\gt 0 \\gt f'_+(0)$).</p>\n        <p>I punti $x = 1$ e $x = 2$ sono invece estremi di intervalli di $D_f$: a destra di $1$ e a sinistra di $2$ la funzione non è definita, quindi esiste una sola derivata laterale, e con il teorema del limite della derivata si trova</p>\n        <p>$$f'_-(1) = \\lim_{x \\to 1^-} \\frac{2x-3}{2\\sqrt{x^2-3x+2}} = -\\infty, \\qquad f'_+(2) = \\lim_{x \\to 2^+} \\frac{2x-3}{2\\sqrt{x^2-3x+2}} = +\\infty$$</p>\n        <p>Il grafico arriva in $(1,0)$ e in $(2,0)$ con una <strong>semitangente verticale</strong>: non si tratta né di cuspide né di tangente verticale bilaterale, perché la classificazione (ii)-(iii) richiede che $f$ sia definita da entrambi i lati.</p><p>Nelle scritture con $\\pm\\infty$ si intendono i limiti del rapporto incrementale: la derivata laterale in senso reale richiede un limite finito.</p>"
    },
    {
      "id": "s12-teoria-2",
      "type": "esercizio",
      "title": "Teoria 2",
      "kind": "teoria",
      "source": "integrazione",
      "icon": "🧠",
      "content": "<p>Enuncia la definizione di asintoto obliquo a $+\\infty$ per una funzione $f$ definita in un intorno di $+\\infty$. Spiega poi perché i due limiti vanno calcolati nell'ordine (prima $m$, poi $q$) e perché, allo stesso infinito, asintoto orizzontale e asintoto obliquo si escludono a vicenda.</p>",
      "solution": "<p>La retta $y = mx + q$ con $m \\neq 0$ è asintoto obliquo di $f$ a $+\\infty$ se esistono finiti $m = \\lim_{x \\to +\\infty}\\frac{f(x)}{x}$ e $q = \\lim_{x \\to +\\infty}\\bigl[f(x)-mx\\bigr]$; equivalentemente, se $\\lim_{x \\to +\\infty}\\bigl[f(x) - (mx+q)\\bigr] = 0$.</p>\n        <p><strong>Ordine dei limiti.</strong> È obbligato perché nel secondo limite compare $m$: senza conoscere $m$ l'espressione $f(x) - mx$ non è nemmeno scritta. Inoltre, se il primo limite non esiste o è infinito, l'asintoto obliquo non c'è e non ha senso passare al secondo.</p>\n        <p><strong>Esclusione reciproca.</strong> Se $f$ ha asintoto orizzontale a $+\\infty$, cioè $\\lim_{x \\to +\\infty} f(x) = L \\in \\mathbb{R}$, allora $\\lim_{x \\to +\\infty}\\frac{f(x)}{x} = 0$ (rapporto del tipo $\\frac{\\text{finito}}{\\infty}$): l'unico candidato sarebbe $m = 0$, escluso dalla definizione. Viceversa, se c'è asintoto obliquo con $m \\neq 0$, da $f(x) = mx + q + o(1)$ segue $f(x) \\to +\\infty$ se $m \\gt 0$ e $f(x) \\to -\\infty$ se $m \\lt 0$, quindi il limite finito non esiste e l'asintoto orizzontale non c'è. Per questo l'obliquo si cerca solo dopo aver verificato che $\\lim_{x \\to +\\infty} f(x) = \\pm\\infty$.</p>"
    },
    {
      "id": "s13-teoria-3",
      "type": "esercizio",
      "title": "Teoria 3",
      "kind": "teoria",
      "source": "integrazione",
      "icon": "🧠",
      "content": "<p>Enunciare il teorema sul limite della derivata usato nella lezione per calcolare le derivate laterali di $f$ in $x = 0$ e in $x = \\pm 1, \\pm 2$. Spiegare perché l'uguaglianza $f'_\\pm(x_0) = \\lim_{x \\to x_0^\\pm} f'(x)$ non è la definizione di derivata laterale e mostrare con un esempio che l'ipotesi di esistenza di $\\lim f'$ non può essere omessa.</p>",
      "solution": "<p><strong>Teorema.</strong> Sia $f$ continua in $x_0$ e derivabile in $(x_0, x_0+\\delta)$ per qualche $\\delta \\gt 0$; se esiste $\\lim_{x \\to x_0^+} f'(x) = L$, finito o infinito, allora il limite del rapporto incrementale da destra esiste e vale $L$ (analogamente da sinistra). Se $L$ è finito è la derivata laterale; per $L=\\pm\\infty$ si usa la notazione estesa e si ha una semitangente verticale.</p>\n        <p>La dimostrazione usa il teorema di Lagrange: per $h \\in (0,\\delta)$ esiste $\\xi_h \\in (x_0, x_0+h)$ con $\\frac{f(x_0+h)-f(x_0)}{h} = f'(\\xi_h)$, e poiché $\\xi_h \\to x_0^+$ si conclude passando al limite. La continuità in $x_0$ è essenziale, perché serve a scrivere il rapporto incrementale con il valore $f(x_0)$ e ad applicare Lagrange sull'intervallo chiuso $[x_0, x_0+h]$.</p>\n        <p><strong>Non è la definizione:</strong> la derivata laterale è per definizione il limite del <em>rapporto incrementale</em> di $f$, che riguarda solo $f$, mentre $\\lim f'$ riguarda la funzione derivata; la loro uguaglianza è una conseguenza del teorema e richiede che quel limite esista.</p>\n        <p><strong>L'ipotesi non si può togliere (e il teorema non si inverte).</strong> Sia $f(x) = x^2\\sin\\frac{1}{x}$ per $x \\neq 0$ e $f(0) = 0$. Allora</p>\n        <p>$$\\left|\\frac{f(h)-f(0)}{h}\\right| = \\left|h\\sin\\frac{1}{h}\\right| \\le |h| \\to 0$$</p>\n        <p>quindi $f'(0) = 0$ esiste; ma per $x \\neq 0$ si ha $f'(x) = 2x\\sin\\frac{1}{x} - \\cos\\frac{1}{x}$, che non ammette limite per $x \\to 0$ perché $\\cos\\frac{1}{x}$ oscilla fra $-1$ e $1$. Dunque $f$ è derivabile in $0$ pur non esistendo $\\lim_{x \\to 0} f'(x)$: il teorema dà una condizione <strong>sufficiente</strong>, non necessaria.</p>"
    },
    {
      "id": "s14-teoria-4",
      "type": "esercizio",
      "title": "Teoria 4",
      "kind": "teoria",
      "source": "integrazione",
      "icon": "🧠",
      "content": "<p>Dire se è vera l'implicazione: \"se $\\mathrm{Dom}(f) = \\mathbb{R}$ allora $f$ non ha asintoti verticali\". In caso negativo esibire un controesempio e indicare l'ipotesi corretta da usare, giustificandola.</p>",
      "solution": "<p>L'implicazione è <strong>falsa</strong>. Controesempio: $g(x) = \\frac{1}{x^2}$ per $x \\neq 0$ e $g(0) = 0$. Il dominio è tutto $\\mathbb{R}$, ma $\\lim_{x \\to 0^{\\pm}} g(x) = +\\infty$, quindi $x = 0$ è asintoto verticale: il fatto che a $0$ sia stato assegnato un valore finito non impedisce alla funzione di divergere avvicinandosi a $0$.</p>\n        <p>L'ipotesi corretta è la <strong>continuità</strong>. Se $f$ è continua in ogni punto $a$ del suo dominio aperto $\\mathbb{R}$, allora per definizione $\\lim_{x \\to a} f(x) = f(a) \\in \\mathbb{R}$: il limite al finito esiste ed è finito, quindi nessuna retta $x = a$ può essere asintoto verticale.</p>\n        <p>Più in generale, per avere asintoti verticali servono punti di accumulazione del dominio in cui almeno un limite laterale sia infinito: tipicamente punti esclusi dal dominio (denominatori nulli, argomenti nulli di un logaritmo) oppure punti di discontinuità. Nei due esercizi della lezione ($x e^{-|\\arctan x|}$ e $\\ln\\sqrt{e^{2x}-3e^x+3}$) è proprio la continuità su tutto $\\mathbb{R}$ a escludere gli asintoti verticali.</p>"
    },
    {
      "id": "s15-scritto-1",
      "type": "esercizio",
      "title": "Scritto 1",
      "kind": "scritto",
      "source": "integrazione",
      "icon": "✏️",
      "content": "<p>Determinare il dominio di $g(x) = \\sqrt{x^2 - 5|x| + 6}$ e i punti in cui $g$ si annulla.</p>",
      "solution": "<p>Il dominio richiede $h(x) = x^2 - 5|x| + 6 \\ge 0$. La funzione $h$ è pari, perché $h(-x) = x^2 - 5|-x| + 6 = h(x)$, quindi basta risolvere la disequazione per $x \\ge 0$ e poi simmetrizzare.</p>\n        <p>Per $x \\ge 0$ si ha $|x| = x$ e si risolve $x^2 - 5x + 6 \\ge 0$: l'equazione associata ha soluzioni $x = \\frac{5 \\pm \\sqrt{25-24}}{2} = \\frac{5 \\pm 1}{2}$, cioè $x_1 = 2$ e $x_2 = 3$. La parabola ha concavità verso l'alto, dunque la disequazione è verificata per valori esterni alle radici: $x \\le 2 \\lor x \\ge 3$. Intersecando con $x \\ge 0$: $[0,2] \\cup [3,+\\infty)$.</p>\n        <p>Per parità la parte con $x \\lt 0$ è il simmetrico rispetto all'origine, cioè $(-\\infty,-3] \\cup [-2,0)$ (lo si verifica anche direttamente: per $x \\lt 0$ si ha $x^2+5x+6 \\ge 0$, con radici $-3$ e $-2$, soddisfatta per $x \\le -3 \\lor x \\ge -2$). In definitiva</p>\n        <p>$$D_g = (-\\infty,-3] \\cup [-2,2] \\cup [3,+\\infty)$$</p>\n        <p>Gli zeri di $g$ sono i punti in cui si annulla il radicando, cioè $x = \\pm 2$ e $x = \\pm 3$; in tutti gli altri punti di $D_g$ risulta $g(x) \\gt 0$.</p>\n        <figure class=\"figura\" data-id=\"analisi1_lez29a_gp1\"><svg xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"640pt\" height=\"400pt\" viewBox=\"0 0 640 400\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\">\n <metadata>\n  <rdf:RDF xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:cc=\"http://creativecommons.org/ns#\" xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\">\n   <cc:Work>\n    <dc:type rdf:resource=\"http://purl.org/dc/dcmitype/StillImage\"/>\n    <dc:format>image/svg+xml</dc:format>\n    <dc:creator>\n     <cc:Agent>\n      <dc:title>Matplotlib v3.11.2, https://matplotlib.org/</dc:title>\n     </cc:Agent>\n    </dc:creator>\n   </cc:Work>\n  </rdf:RDF>\n </metadata>\n <defs>\n  <style type=\"text/css\">*{stroke-linejoin: round; stroke-linecap: butt}</style>\n </defs>\n <g id=\"analisi1_lez29a_gp1-figure_1\">\     {
      "id": "s16-scritto-2",
      "type": "esercizio",
      "title": "Scritto 2",
      "kind": "scritto",
      "source": "integrazione",
      "icon": "✏️",
      "content": "<p>Data $f(x) = \\ln\\left(1 + e^x\\right)$, determinare il dominio, tutti gli asintoti (specificando da che parte il grafico li raggiunge), la monotonia e il segno; tracciare infine il grafico.</p>",
      "solution": "<p><strong>Dominio.</strong> $1 + e^x \\gt 0$ per ogni $x \\in \\mathbb{R}$, quindi $\\mathrm{Dom}(f) = \\mathbb{R}$ e $f$ è continua e derivabile su $\\mathbb{R}$ come composizione di funzioni continue e derivabili con argomento del logaritmo mai nullo.</p>\n        <p><strong>Asintoti verticali.</strong> Nessuno: per continuità, per ogni $a \\in \\mathbb{R}$ si ha $\\lim_{x \\to a} f(x) = f(a) = \\ln(1+e^a) \\in \\mathbb{R}$.</p>\n        <p><strong>Comportamento a $-\\infty$.</strong> $e^x \\to 0^+$, dunque $\\lim_{x \\to -\\infty}\\ln(1+e^x) = \\ln 1 = 0$: asintoto orizzontale $y = 0$. Poiché $1 + e^x \\gt 1$ per ogni $x$, si ha $f(x) \\gt 0$ e il grafico raggiunge l'asintoto <strong>dall'alto</strong>.</p>\n        <p><strong>Comportamento a $+\\infty$.</strong> Raccogliendo il termine dominante dentro il logaritmo, $\\ln(1+e^x) = \\ln\\left(e^x(1+e^{-x})\\right) = x + \\ln(1+e^{-x}) \\to +\\infty$: non c'è asintoto orizzontale, quindi cerchiamo l'obliquo.</p>\n        <p>$$m = \\lim_{x \\to +\\infty}\\frac{x + \\ln(1+e^{-x})}{x} = \\lim_{x \\to +\\infty}\\left(1 + \\frac{\\ln(1+e^{-x})}{x}\\right) = 1 + 0 = 1$$</p>\n        <p>perché il numeratore tende a $\\ln 1 = 0$ e il denominatore a $+\\infty$ (forma $\\frac{0}{\\infty}$, non indeterminata). Essendo $m = 1$ finito e non nullo,</p>\n        <p>$$q = \\lim_{x \\to +\\infty}\\left[\\ln(1+e^x) - x\\right] = \\lim_{x \\to +\\infty}\\ln\\left(1+e^{-x}\\right) = \\ln 1 = 0$$</p>\n        <p>L'asintoto obliquo a $+\\infty$ è $y = x$; poiché $f(x) - x = \\ln(1+e^{-x}) \\gt 0$, il grafico lo raggiunge <strong>dall'alto</strong>.</p>\n        <p><strong>Monotonia e segno.</strong> $f'(x) = \\frac{e^x}{1+e^x} \\gt 0$ per ogni $x \\in \\mathbb{R}$: $f$ è strettamente crescente su $\\mathbb{R}$, senza punti stazionari né estremi. Inoltre $f(x) = \\ln(1+e^x) \\gt 0$ sempre, quindi non ci sono zeri; $f(0) = \\ln 2 \\approx 0{,}69$. Il codominio è $(0,+\\infty)$. Per completezza $f''(x) = \\frac{e^x}{(1+e^x)^2} \\gt 0$: $f$ è convessa su tutto $\\mathbb{R}$.</p>\n        <figure class=\"figura\" data-id=\"analisi1_lez29b_gp1\"><svg xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"640pt\" height=\"400pt\" viewBox=\"0 0 640 400\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\">\n <metadata>\n  <rdf:RDF xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:cc=\"http://creativecommons.org/ns#\" xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\">\n   <cc:Work>\n    <dc:type rdf:resource=\"http://purl.org/dc/dcmitype/StillImage\"/>\n    <dc:format>image/svg+xml</dc:format>\n    <dc:creator>\n     <cc:Agent>\n      <dc:title>Matplotlib v3.11.2, https://matplotlib.org/</dc:title>\n     </cc:Agent>\n    </dc:creator>\n   </cc:Work>\n  </rdf:RDF>\n </metadata>\n <defs>\n  <style type=\"text/css\">*{stroke-linejoin: round; stroke-linecap: butt}</style>\n </defs>\n <g id=\"analisi1_lez29b_gp1-figure_1\">\n  <g id=\"analisi1_lez29b_gp1-patch_1\">\n   <path d=\"M 0 400 \nL 640 400 \nL 640 0 \nL 0 0 \nL 0 400 \nz\n\" style=\"fill: none; opacity: 0\"/>\n  </g>\n  <g id=\"analisi1_lez29b_gp1-axes_1\">\n   <g id=\"analisi1_lez29b_gp1-patch_2\">\n    <path d=\"M 44.8 364 \nL 614.4 364 \nL 614.4 24 \nL 44.8 24 \nL 44.8 364 \nz\n\" style=\"fill: none\"/>\n   </g>\n   <g id=\"analisi1_lez29b_gp1-matplotlib.axis_1\">\n    <g id=\"analisi1_lez29b_gp1-xtick_1\">\n     <g id=\"analisi1_lez29b_gp1-line2d_1\">\n      <path d=\"M 44.8 364 \nL 44.8 24 \n\" clip-path=\"url(#analisi1_lez29b_gp1-p09c5e91400)\" style=\"fill: none; stroke: #9aa4b2; stroke-opacity: 0.3; stroke-width: 0.6; stroke-linecap: square\"/>\n     </g>\n     <g id=\"analisi1_lez29b_gp1-line2d_2\">\n      <defs>\n       <path id=\"analisi1_lez29b_gp1-m67e5749ebe\" d=\"M 0 0 \nL 0 3 \n\" style=\"stroke: currentColor; stroke-width: 0.8\"/>\n      </defs>\n      <g>\n       <use xlink:href=\"#analisi1_lez29b_gp1-m67e5749ebe\" x=\"44.8\" y=\"330\" style=\"fill: currentColor; stroke: currentColor; stroke-width: 0.8\"/     {
      "id": "s17-scritto-3",
      "type": "esercizio",
      "title": "Scritto 3",
      "kind": "scritto",
      "source": "integrazione",
      "icon": "✏️",
      "content": "<p>Data $f(x) = \\sqrt{x^2 + 4x}$, determinare il dominio e tutti gli asintoti, e stabilire il comportamento del grafico negli estremi finiti del dominio.</p>",
      "solution": "<p><strong>Dominio.</strong> Serve $x^2 + 4x = x(x+4) \\ge 0$, verificata per valori esterni alle radici $-4$ e $0$, cioè $D_f = (-\\infty,-4] \\cup [0,+\\infty)$. La funzione è composizione di funzioni continue, dunque continua su $D_f$, e $D_f$ è chiuso: ogni punto di accumulazione finito appartiene a $D_f$ e in esso il limite coincide con il valore della funzione, $f(-4) = f(0) = 0$. Non ci sono quindi asintoti verticali. Inoltre $\\lim_{x \\to \\pm\\infty} f(x) = +\\infty$, quindi non ci sono asintoti orizzontali.</p>\n        <p><strong>Asintoto obliquo per $x \\to +\\infty$</strong> (qui $|x| = x$):</p>\n        <p>$$m = \\lim_{x \\to +\\infty}\\frac{\\sqrt{x^2+4x}}{x} = \\lim_{x \\to +\\infty}\\frac{x\\sqrt{1+\\frac{4}{x}}}{x} = 1$$</p>\n        <p>$$q = \\lim_{x \\to +\\infty}\\left(\\sqrt{x^2+4x}-x\\right) = \\lim_{x \\to +\\infty}\\frac{4x}{x\\left(\\sqrt{1+\\frac{4}{x}}+1\\right)} = \\frac{4}{2} = 2$$</p>\n        <p>cioè $y = x+2$.</p>\n        <p><strong>Per $x \\to -\\infty$</strong> si ha $|x| = -x$:</p>\n        <p>$$m = \\lim_{x \\to -\\infty}\\frac{-x\\sqrt{1+\\frac{4}{x}}}{x} = -1, \\qquad q = \\lim_{x \\to -\\infty}\\frac{4x}{-x\\left(\\sqrt{1+\\frac{4}{x}}+1\\right)} = -2$$</p>\n        <p>cioè $y = -x-2$.</p>\n        <p><strong>Estremi finiti.</strong> Per $x$ interno al dominio $f'(x) = \\frac{2x+4}{2\\sqrt{x^2+4x}} = \\frac{x+2}{\\sqrt{x^2+4x}}$, e</p>\n        <p>$$\\lim_{x \\to 0^+} f'(x) = \\frac{2}{0^+} = +\\infty, \\qquad \\lim_{x \\to -4^-} f'(x) = \\frac{-2}{0^+} = -\\infty$$</p>\n        <p>Essendo $f$ continua in tali punti, per il teorema del limite della derivata le (uniche) derivate laterali sono infinite: il grafico tocca l'asse $x$ in $(-4,0)$ e $(0,0)$ con <strong>semitangente verticale</strong>, e questi punti sono minimi assoluti perché $f \\ge 0$.</p>\n        <figure class=\"figura\" data-id=\"analisi1_lez29a_gp2\"><svg xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"640pt\" height=\"400pt\" viewBox     {
      "id": "s18-scritto-4",
      "type": "esercizio",
      "title": "Scritto 4",
      "kind": "scritto",
      "source": "integrazione",
      "icon": "✏️",
      "content": "<p>Determinare il dominio e tutti gli asintoti (verticali, orizzontali, obliqui, a $+\\infty$ e a $-\\infty$) della funzione $f(x) = (x+2)\\,e^{1/x}$, studiandone anche il segno.</p>",
      "solution": "<p><strong>Dominio.</strong> Serve $x \\neq 0$: $\\mathrm{Dom}(f) = \\mathbb{R}\\setminus\\{0\\}$, dove $f$ è continua (quindi l'unico candidato ad asintoto verticale è la retta $x = 0$).</p>\n        <p><strong>Asintoto verticale.</strong> Per $x \\to 0^+$ si ha $\\frac{1}{x} \\to +\\infty$, dunque $e^{1/x} \\to +\\infty$, mentre $x+2 \\to 2 \\gt 0$:</p>\n        <p>$$\\lim_{x \\to 0^+}(x+2)e^{1/x} = +\\infty$$</p>\n        <p>Per $x \\to 0^-$ si ha $\\frac{1}{x} \\to -\\infty$, dunque $e^{1/x} \\to 0^+$ e $\\lim_{x \\to 0^-}(x+2)e^{1/x} = 2 \\cdot 0 = 0$. Basta che <em>uno</em> dei due limiti laterali sia infinito: $x = 0$ è asintoto verticale (solo da destra).</p>\n        <p><strong>A $\\pm\\infty$.</strong> Poiché $\\frac{1}{x} \\to 0$ si ha $e^{1/x} \\to 1$, quindi $f(x) \\to +\\infty$ per $x \\to +\\infty$ e $f(x) \\to -\\infty$ per $x \\to -\\infty$: nessun asintoto orizzontale. Cerchiamo gli obliqui.</p>\n        <p>$$m = \\lim_{x \\to \\pm\\infty}\\frac{(x+2)e^{1/x}}{x} = \\lim_{x \\to \\pm\\infty}\\left(1 + \\frac{2}{x}\\right)e^{1/x} = 1 \\cdot 1 = 1$$</p>\n        <p>Essendo $m = 1$ finito e non nullo,</p>\n        <p>$$q = \\lim_{x \\to \\pm\\infty}\\left[(x+2)e^{1/x} - x\\right] = \\lim_{x \\to \\pm\\infty}\\left[x\\left(e^{1/x}-1\\right) + 2e^{1/x}\\right]$$</p>\n        <p>Con la sostituzione $t = \\frac{1}{x} \\to 0$ (con $t \\neq 0$) si ha $x\\left(e^{1/x}-1\\right) = \\frac{e^t-1}{t} \\to 1$, per il limite notevole $e^t - 1 \\sim t$; inoltre $2e^{1/x} \\to 2$. Dunque $q = 1 + 2 = 3$, sia per $x \\to +\\infty$ sia per $x \\to -\\infty$.</p>\n        <p>In entrambe le direzioni l'asintoto obliquo è la retta $y = x+3$.</p>\n        <p><strong>Segno.</strong> $e^{1/x} \\gt 0$ per ogni $x \\neq 0$, quindi $\\operatorname{sgn} f(x) = \\operatorname{sgn}(x+2)$: $f \\lt 0$ per $x \\lt -2$, $f(-2) = 0$, $f \\gt 0$ per $-2 \\lt x \\lt 0$ e per $x \\gt 0$.</p>\n        <figure class=\"figura\" data-id=\"analisi1_lez29b_gp2\"><svg xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"800pt\" height=\"470pt\" viewBox=\"0 0 800 470\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\">\n <metadata>\n  <rdf:RDF xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:cc=\"http://creativecommons.org/ns#\" xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\">\n   <cc:Work>\n    <dc:type rdf:resource=\"http://purl.org/dc/dcmitype/StillImage\"/>\n    <dc:date>2026-11-13T20:34:14.678736</dc:date>\n    <dc:format>image/svg+xml</dc:format>\n    <dc:creator>\n     <cc:Agent>\n      <dc:title>Matplotlib v3.11.2, https://matplotlib.org/</dc:title>\n     </cc:Agent>\n    </dc:creator>\n   </cc:Work>\n  </rdf:RDF>\n </metadata>\n <defs>\n  <style type=\"text/css\">*{stroke-linejoin: round; stroke-linecap: butt}</style>\n </defs>\n <g id=\"analisi1_lez29b_gp2-figure_1\">\n  <g id=\"analisi1_lez29b_gp2-patch_1\">\n   <path d=\"M 0 470 \nL 800 470 \nL 800 0 \nL 0 0 \nL 0 470 \nz\n\" style=\"fill: none; opacity: 0\"/>\n  </g>\n  <g id=\"analisi1_lez29b_gp2-axes_1\">\n   <g id=\"analisi1_lez29b_gp2-patch_2\">\n    <path d=\"M 56 427.7 \nL 768 427.7 \nL 768 28.2 \nL 56 28.2 \nL 56 427.7 \nz\n\" style=\"fill: none\"/>\n   </g>\n   <g id=\"analisi1_lez29b_gp2-matplotlib.axis_1\">\n    <g id=\"analisi1_lez29b_gp2-xtick_1\">\n     <g id=\"analisi1_lez29b_gp2-line2d_1\">\n      <path d=\"M 56 427.7 \nL 56 28.2 \n\" clip-path=\"url(#analisi1_lez29b_gp2-p7afd9ca38e)\" style=\"fill: none; stroke: #9aa4b2; stroke-opacity: 0.3; stroke-width: 0.6; stroke-linecap: square\"/>\n     </g>\n     <g id=\"analisi1_lez29b_gp2-line2d_2\">\n      <defs>\n       <path id=\"analisi1_lez29b_gp2-m77f33130cc\" d=\"M 0 0 \nL 0 3 \n\" style=\"stroke: currentColor; stroke-width: 0.8\"/>\n      </defs>\n      <g>\n       <use xlink:href=\"#analisi1_lez29b_gp2-m77f33130cc\" x=\"56\" y=\"324.125926\" style=\"fill: currentColor; stroke: currentColor; stroke-width: 0.8\"/>\n      </g>\n     </g>\n     <g id=\"analisi1_lez29b_gp2-text_1\">\n      <!-- -8       "type": "domanda",
      "front": "Perché la funzione $f(x) = \\sqrt{x^2-3|x|+2}$ non ha asintoti verticali, pur avendo quattro punti di frontiera nel dominio?",
      "back": "Perché $f$ è <strong>continua</strong> su tutto $D_f$ (composizione di polinomio e radice) e $D_f = (-\\infty,-2]\\cup[-1,1]\\cup[2,+\\infty)$ è <strong>chiuso</strong>: ogni punto di accumulazione finito di $D_f$ appartiene a $D_f$, e lì il limite coincide con il valore della funzione, che è finito (vale $0$ in $\\pm 1, \\pm 2$). Non basta dire che i punti di frontiera appartengono al dominio: un asintoto verticale può esserci anche in un punto del dominio se la funzione non è continua lì."
    },
    {
      "type": "tranello",
      "front": "Vero o falso: se $\\mathrm{Dom}(f) = \\mathbb{R}$, allora $f$ non ha asintoti verticali.",
      "back": "<strong>Falso.</strong> Controesempio: $g(x) = 1/x^2$ per $x \\neq 0$ e $g(0) = 0$. Il dominio è tutto $\\mathbb{R}$, ma $\\lim_{x \\to 0^{\\pm}} g(x) = +\\infty$, quindi $x = 0$ è asintoto verticale. L'ipotesi corretta è la <strong>continuità</strong>: se $f$ è continua in $a$, allora $\\lim_{x \\to a} f(x) = f(a) \\in \\mathbb{R}$ e nessuna retta $x = a$ può essere asintoto."
    },
    {
      "type": "definizione",
      "front": "Definizione di asintoto obliquo a $+\\infty$ e perché l'ordine dei limiti è obbligato.",
      "back": "La retta $y = mx+q$ con $m \\neq 0$ è asintoto obliquo a $+\\infty$ se esistono finiti $m = \\lim_{x\\to+\\infty}\\frac{f(x)}{x}$ e $q = \\lim_{x\\to+\\infty}[f(x)-mx]$. L'ordine è obbligato perché nel secondo limite compare $m$: senza conoscerlo l'espressione $f(x)-mx$ non è nemmeno scritta. Inoltre, se il primo limite non esiste o è infinito, l'asintoto obliquo non c'è."
    },
    {
      "type": "domanda",
      "front": "Perché asintoto orizzontale e asintoto obliquo allo stesso infinito si escludono a vicenda?",
      "back": "Se c'è l'orizzontale, $f(x) \\to L \\in \\mathbb{R}$, quindi $\\frac{f(x)}{x} \\to 0$ (forma $\\frac{\\text{finito}}{\\infty}$) e l'unico candidato sarebbe $m = 0$, escluso dalla definizione. Viceversa, se c'è l'obliquo con $m \\neq 0$, da $f(x) = mx+q+o(1)$ segue $f(x) \\to \\pm\\infty$, quindi il limite finito non esiste. Per questo l'obliquo si cerca solo dopo aver verificato che $\\lim f(x) = \\pm\\infty$."

      "back": "Con $m = e^{-\\pi/2}$ si ha $q = \\lim_{x\\to+\\infty} x\\left(e^{-\\arctan x} - e^{-\\pi/2}\\right)$ (forma $\\infty\\cdot 0$). Si raccoglie $e^{-\\pi/2}$: $q = \\lim x\\,e^{-\\pi/2}\\left(e^{\\frac{\\pi}{2}-\\arctan x}-1\\right)$. Usando $\\arctan x + \\arctan(1/x) = \\frac{\\pi}{2}$ per $x\\gt 0$, l'esponente diventa $\\arctan(1/x) \\to 0$; con $e^t-1\\sim t$ e $\\arctan u \\sim u$ si ottiene $q = \\lim x\\,e^{-\\pi/2}\\cdot\\frac{1}{x} = e^{-\\pi/2}$. Asintoto: $y = e^{-\\pi/2}(x+1)$."

      "type": "tranello",
      "front": "In $f(x) = \\sqrt{x^2-3|x|+2}$, che differenza c'è fra il punto $x=0$ e i punti $x=\\pm 1, \\pm 2$?",
      "back": "In $x = 0$ (interno a $[-1,1]$) esistono entrambe le derivate laterali, <strong>finite e diverse</strong>: $f'_-(0) = \\frac{3}{2\\sqrt2}$, $f'_+(0) = -\\frac{3}{2\\sqrt2}$ → <strong>punto angoloso</strong> (e massimo locale). In $x = \\pm 1, \\pm 2$ la funzione è definita da un solo lato: esiste una sola derivata laterale, infinita → <strong>semitangente verticale</strong>. Non si parla di cuspide né di tangente verticale bilaterale, perché quelle classificazioni richiedono $f$ definita da entrambi i lati."
    },
    {
      "type": "formula",
      "front": "Enuncia il teorema sul limite della derivata.",
      "back": "Se $f$ è continua in $x_0$ dal lato considerato, derivabile nell’intorno unilaterale bucato ed esiste $\\lim_{x\\to x_0^{\\pm}}f^{\\prime}(x)=L$ (finito o infinito), allora il limite del rapporto incrementale dallo stesso lato vale $L$. Se $L$ è finito è la derivata laterale; se è infinito non c’è derivata laterale finita e la scrittura estesa descrive una semitangente verticale. È una conseguenza di Lagrange, non la definizione di derivata laterale."
    },
    {
      "type": "tranello",
      "front": "Il teorema sul limite della derivata si inverte? Cioè, se $f$ è derivabile in $x_0$, esiste $\\lim_{x\\to x_0} f'(x)$?",
      "back": "<strong>No.</strong> Sia $f(x) = x^2\\sin\\frac{1}{x}$ per $x \\neq 0$ e $f(0) = 0$. Allora $\\left|\\frac{f(h)-f(0)}{h}\\right| \\le |h| \\to 0$, quindi $f'(0) = 0$ esiste; ma $f'(x) = 2x\\sin\\frac1x - \\cos\\frac1x$ non ha limite per $x \\to 0$ perché $\\cos\\frac1x$ oscilla. Il teorema dà una condizione <strong>sufficiente</strong>, non necessaria."
    },
    {
      "type": "domanda",
      "front": "Per $f(x) = \\ln\\sqrt{e^{2x}-3e^x+3}$, da che parte il grafico si avvicina all'asintoto obliquo $y = x$?",
      "back": "<strong>Dal basso.</strong> Infatti $f(x) - x = \\frac{1}{2}\\ln\\left(1-3e^{-x}+3e^{-2x}\\right)$ e per $x$ grande l'argomento è minore di $1$ (il termine $-3e^{-x}$ domina su $+3e^{-2x}$), quindi il logaritmo è negativo e $f(x) \\lt x$."
    },
    {
      "type": "tranello",
      "front": "Si può dedurre che $f(x) = \\frac12\\ln(e^{2x}-3e^x+3)$ è convessa su $\\mathbb{R}$ dal fatto che ha un unico punto di minimo?",
      "back": "<strong>No:</strong> monotonia e concavità sono informazioni indipendenti. Qui il calcolo di $f''$ dà $f''(x) = -\\frac{3e^x(e^x-1)(e^x-3)}{2(e^{2x}-3e^x+3)^2}$: la funzione è concava per $x \\lt 0$ e per $x \\gt \\ln 3$, convessa per $0 \\lt x \\lt \\ln 3$, con due flessi in $x = 0$ e $x = \\ln 3$."
    },
    {
      "type": "tranello",
      "front": "Una tabella di valori numerici può dimostrare che una retta è asintoto?",
      "back": "<strong>No</strong>, serve solo come controllo di plausibilità a valori finiti. Inoltre va usata la retta <em>esatta</em>: per $f(x) = xe^{-\\arctan x}$ è $f(x) - e^{-\\pi/2}(x+1) \\to 0$ (dimostrato analiticamente). Se si arrotonda il coefficiente angolare a $0{,}2079 \\gt e^{-\\pi/2}$, la differenza $f(x) - 0{,}2079(x+1)$ tende a $-\\infty$: arrotondare $m$ cambia l'asintoto."
    },
    {
      "type": "domanda",
      "front": "In $f(x) = x e^{-|\\arctan x|}$ il valore assoluto genera un punto angoloso in $x = 0$?",
      "back": "<strong>No.</strong> Si calcolano le derivate laterali dei due rami: $f'(0^+) = \\lim_{x\\to0^+} e^{-\\arctan x}\\left(1-\\frac{x}{1+x^2}\\right) = 1$ e $f'(0^-) = \\lim_{x\\to0^-} e^{\\arctan x}\\left(1+\\frac{x}{1+x^2}\\right) = 1$: coincidono, quindi $f$ è derivabile in $0$ con $f'(0) = 1$. Il fattore $x$ si annulla in $0$ e \"spegne\" il salto. In generale però un modulo può generare un punto angoloso: va sempre controllato."
    }
  ]
};
