<script>
const LESSON = {
    id: "L14", date: "Lezione 14 — 14 Ott 2026",
    title: "La Retta Reale Estesa, Limiti di Successioni e Teorema del Confronto",
    abstract: "Introduciamo la retta reale estesa $\\mathbb{R}^*$ e la nozione unificata di intorno, che permette di dare una sola definizione di limite valida per limiti finiti e infiniti. Da qui dimostriamo con un unico ragionamento l'unicità del limite, il teorema della permanenza del segno nelle due forme e il teorema del confronto (dei due carabinieri), con l'applicazione classica alla successione limitata divisa per una divergente.",

    sections: [
      {
        id: "s14-retta-estesa",
        type: "section",
        title: "La retta reale estesa",
        icon: "➕",
        content: `<p>Nelle lezioni precedenti abbiamo introdotto il concetto di intorno di un punto $x_0 \\in \\mathbb{R}$, definendolo come un intervallo aperto e simmetrico del tipo $(x_0 - R, x_0 + R)$. Ci siamo anche chiesti come definire un intorno di infinito. Un intervallo del tipo $(a, +\\infty)$ sembra un buon candidato per essere un intorno di $+\\infty$, così come $(-\\infty, b)$ per $-\\infty$.</p>
        <p>Per formalizzare questa idea, introduciamo un nuovo insieme, la <strong>retta reale estesa</strong>.</p>`,
        subsections: [
          {
            subtitle: "Definizione — Retta reale estesa",
            content: `<p>Si definisce <strong>retta reale estesa</strong>, e si indica con $\\mathbb{R}^*$, l'insieme ottenuto unendo all'insieme dei numeri reali $\\mathbb{R}$ due nuovi simboli, $+\\infty$ (più infinito) e $-\\infty$ (meno infinito).</p>
            <p>$$\\mathbb{R}^* = \\mathbb{R} \\cup \\{+\\infty\\} \\cup \\{-\\infty\\}$$</p>`
          },
          {
            subtitle: "Osservazione — $\\mathbb{R}^*$ non è un campo",
            content: `<p>L'insieme $\\mathbb{R}^*$ <strong>non</strong> è un campo numerico. Non possiamo, in generale, definire le operazioni di somma e prodotto che coinvolgano i simboli $+\\infty$ e $-\\infty$ mantenendo le proprietà algebriche di $\\mathbb{R}$. Per esempio, espressioni come $+\\infty - \\infty$ sono indeterminate.</p>`
          },
          {
            subtitle: "Proposizione — Ordinamento su $\\mathbb{R}^*$",
            content: `<p>Tuttavia, possiamo estendere la relazione d'ordine di $\\mathbb{R}$ a $\\mathbb{R}^*$: l'insieme $\\mathbb{R}^*$ è un <strong>insieme totalmente ordinato</strong> estendendo l'ordinamento di $\\mathbb{R}$ con le seguenti relazioni:</p>
            <ul>
              <li>$\\forall x \\in \\mathbb{R}, \\quad -\\infty \\lt x$</li>
              <li>$\\forall x \\in \\mathbb{R}, \\quad x \\lt +\\infty$</li>
              <li>$-\\infty \\lt +\\infty$</li>
            </ul>
            <p>In sostanza, $-\\infty$ è l'elemento minimo di $\\mathbb{R}^*$ e $+\\infty$ è l'elemento massimo.</p>`
          }
        ],
        extra_content: `<p>Graficamente, possiamo rappresentare la retta reale estesa come la retta reale a cui aggiungiamo due "punti" agli estremi. La figura seguente mostra questa rappresentazione, insieme a due esempi di intorno: in blu un intorno simmetrico del punto finito $x_0$, in rosso un intorno di $+\\infty$; i pallini vuoti indicano gli estremi <em>esclusi</em>.</p>

      {
        id: "s14-intorni-rstar",
        type: "section",
        title: "Intorni nella retta estesa",
        icon: "🎯",
        content: `<p>Con la retta estesa, possiamo ora dare una definizione unificata di intorno per qualsiasi punto di $\\mathbb{R}^*$.</p>`,
        subsections: [
          {
            subtitle: "Definizione — Intorno di un punto in $\\mathbb{R}^*$",
            content: `<p><strong>1. Intorno di un punto finito.</strong> Sia $x_0 \\in \\mathbb{R}$. Un <strong>intorno</strong> di $x_0$ è un qualsiasi intervallo aperto che contiene $x_0$. Un caso particolare importante è l'intorno simmetrico:</p>
            <p>$$I_R(x_0) = \\{x \\in \\mathbb{R} : |x - x_0| \\lt R\\} = (x_0 - R, x_0 + R)$$</p>
            <p>per un qualche raggio $R \\gt 0$.</p>
            <p><strong>2. Intorno di $+\\infty$.</strong> Un <strong>intorno</strong> di $+\\infty$ è un qualsiasi insieme del tipo $(a, +\\infty]$ per un qualche $a \\in \\mathbb{R}$:</p>
            <p>$$I(+\\infty) = \\{x \\in \\mathbb{R}^* : x \\gt a\\} = (a, +\\infty]$$</p>
            <p><strong>3. Intorno di $-\\infty$.</strong> Un <strong>intorno</strong> di $-\\infty$ è un qualsiasi insieme del tipo $[-\\infty, b)$ per un qualche $b \\in \\mathbb{R}$:</p>
            <p>$$I(-\\infty) = \\{x \\in \\mathbb{R}^* : x \\lt b\\} = [-\\infty, b)$$</p>`
          },
          {
            subtitle: "Osservazione — gli intorni di infinito contengono il simbolo",
            content: `<p>Notiamo che gli intorni di $+\\infty$ e $-\\infty$ sono definiti in $\\mathbb{R}^*$, includendo i simboli stessi. Per esempio, $(a, +\\infty] = (a, +\\infty) \\cup \\{+\\infty\\}$.</p>`
          },
          {
            subtitle: "Nota — cosa significa «definitivamente»",
            content: `<p>Prima di procedere conviene fissare un linguaggio che useremo continuamente. Data una successione $(a_n)$ di numeri reali, dire che una proprietà $P(n)$ vale <strong>definitivamente</strong> significa che esiste un indice soglia $n_0 \\in \\mathbb{N}$ tale che $P(n)$ è vera per ogni $n \\gt n_0$.</p>
            <p>L'indice $n_0$ è dunque il punto da cui in poi la proprietà non viene più violata: i termini $a_0, a_1, \\dots, a_{n_0}$ possono comportarsi come vogliono, ciò che conta è la <em>coda</em> della successione.</p>`
          },
          {
            subtitle: "Proposizione — Riduzione agli intorni simmetrici",
            content: `<p>Nel caso di un punto finito abbiamo ammesso come intorni <em>tutti</em> gli intervalli aperti che contengono $x_0$, non soltanto quelli simmetrici. La proposizione seguente chiarisce che, ai fini della teoria dei limiti, i due punti di vista sono equivalenti: basta sempre controllare gli intorni simmetrici.</p>
            <p>Sia $L \\in \\mathbb{R}$ e sia $U$ un intervallo aperto con $L \\in U$. Allora esiste $\\varepsilon \\gt 0$ tale che</p>
            <p>$$(L - \\varepsilon,\\ L + \\varepsilon) \\subseteq U .$$</p>
            <p>Viceversa, ogni intorno simmetrico $(L-\\varepsilon, L+\\varepsilon)$ è esso stesso un intorno di $L$.</p>`
          },
          {
            subtitle: "Dimostrazione",
            content: `<p>Supponiamo prima $U = (a,b)$ con $a \\lt L \\lt b$ (il caso di intervalli illimitati si tratta in modo analogo: se $U = (a,+\\infty)$ si prende $\\varepsilon = L-a$, se $U = (-\\infty,b)$ si prende $\\varepsilon = b-L$, mentre se $U = \\mathbb{R}$ va bene qualunque $\\varepsilon \\gt 0$). Poniamo</p>
            <p>$$\\varepsilon = \\min\\{L - a,\\ b - L\\} .$$</p>
            <p>Poiché $a \\lt L$ e $L \\lt b$, entrambe le quantità $L-a$ e $b-L$ sono strettamente positive, dunque $\\varepsilon \\gt 0$. Se ora $x$ soddisfa $|x - L| \\lt \\varepsilon$, allora</p>
            <p>$$x \\gt L - \\varepsilon \\geq L - (L-a) = a, \\qquad x \\lt L + \\varepsilon \\leq L + (b - L) = b,$$</p>
            <p>cioè $a \\lt x \\lt b$ e quindi $x \\in U$. Questo prova $(L-\\varepsilon, L+\\varepsilon) \\subseteq U$.</p>
            <p>L'implicazione inversa è immediata: un intorno simmetrico $(L-\\varepsilon, L+\\varepsilon)$ è un intervallo aperto che contiene $L$, dunque è un intorno di $L$ secondo la definizione data. $\\blacksquare$</p>`
          },
          {
            subtitle: "Osservazione — perché si lavora solo con $|a_n - L| \\lt \\varepsilon$",
            content: `<p>La proposizione precedente è il motivo per cui, nella pratica, si lavora solo con la disuguaglianza $|a_n - L| \\lt \\varepsilon$. Il punto da enunciare con precisione è il seguente, e riguarda specificamente la proprietà di <em>appartenenza definitiva</em>, non una proprietà arbitraria: se la successione $(a_n)$ appartiene definitivamente a ogni intorno simmetrico di $L$, allora appartiene definitivamente a ogni intorno $U$ di $L$.</p>
            <p>Infatti, scelto per la Proposizione precedente un intorno simmetrico $(L-\\varepsilon, L+\\varepsilon) \\subseteq U$, l'appartenenza definitiva al primo implica l'appartenenza definitiva a $U$: <strong>lo stesso indice soglia $n_0$ funziona</strong>, perché da $a_n \\in (L-\\varepsilon, L+\\varepsilon)$ segue $a_n \\in U$.</p>
            <p>Il viceversa è banale, dato che gli intorni simmetrici sono casi particolari di intorni. Si noti che il passaggio funziona solo perché l'appartenenza a un insieme si conserva passando a un insieme più grande: in generale l'inclusione fra intorni <strong>non</strong> permette di trasferire una proprietà qualsiasi dagli intorni simmetrici a tutti gli intorni.</p>`
          }
        ]
      },

      {
        id: "s14-proprieta-intorni",
        type: "section",
        title: "Proprietà degli intorni",
        icon: "🧩",
        content: `<p>Gli intorni, come li abbiamo definiti, godono di alcune proprietà fondamentali che saranno cruciali per la teoria dei limiti.</p>`,
        subsections: [
          {
            subtitle: "Proposizione — Proprietà fondamentali degli intorni",
            content: `<p>Sia $x \\in \\mathbb{R}^*$. Valgono le seguenti proprietà.</p>
            <ol>
              <li><strong>Appartenenza:</strong> se $U$ è un intorno di $x$, allora $x \\in U$.</li>
              <li><strong>Intersezione:</strong> se $U$ e $V$ sono due intorni di $x$, allora anche la loro intersezione $U \\cap V$ è un intorno di $x$.</li>
              <li><strong>Apertura:</strong> se $U$ è un intorno di $x$ e $y \\in U$ con $y \\neq x$, allora esiste un intorno $V$ di $y$ tale che $V \\subseteq U$.</li>
              <li><strong>Proprietà di separazione (di Hausdorff):</strong> se $x, y \\in \\mathbb{R}^*$ e $x \\neq y$, allora esistono due intorni, $U$ di $x$ e $V$ di $y$, tali che $U \\cap V = \\emptyset$.</li>
            </ol>
            <p>La proprietà di appartenenza segue direttamente dalla definizione, in tutti e tre i casi (punto finito, $+\\infty$, $-\\infty$).</p>`
          },
          {
            subtitle: "Esempio — proprietà di intersezione",
            content: `<p>Se $x_0 \\in \\mathbb{R}$, $U = (x_0-R_1, x_0+R_1)$ e $V = (x_0-R_2, x_0+R_2)$, allora</p>
            <p>$$U \\cap V = (x_0-R, x_0+R), \\qquad R = \\min(R_1, R_2),$$</p>
            <p>che è ancora un intorno di $x_0$.</p>
            <p>Se $x = +\\infty$, $U = (a, +\\infty]$ e $V = (b, +\\infty]$, allora $U \\cap V = (\\max(a,b), +\\infty]$, che è ancora un intorno di $+\\infty$.</p>`
          },
          {
            subtitle: "Osservazione — sul significato dell'apertura",
            content: `<p>La proprietà di apertura esprime il fatto che gli intorni sono "aperti": ogni punto al loro interno è a sua volta "circondato" da altri punti dell'intorno. Per esempio, se $U = (0,1)$ e $y = 1/2$, basta scegliere $V = (1/4, 3/4) \\subseteq U$.</p>`
          },
          {
            subtitle: "Osservazione — sulla proprietà di separazione",
            content: `<p>Questa proprietà è fondamentale. Ci dice che possiamo sempre "separare" due punti distinti con due intorni disgiunti. Questo sarà il cardine della dimostrazione dell'unicità del limite.</p>
            <p>Concretamente: se $x, y \\in \\mathbb{R}$ con $x \\lt y$, posto $d = y - x \\gt 0$ e $\\varepsilon = d/2$, gli intorni $U = (x-\\varepsilon, x+\\varepsilon)$ e $V = (y-\\varepsilon, y+\\varepsilon)$ sono disgiunti. Si osservi che con questa scelta i due intervalli sono <em>adiacenti</em>: il loro estremo comune è il punto medio $(x+y)/2$, che però non appartiene a nessuno dei due, essendo gli intervalli aperti.</p>
            <p>Se invece $x \\in \\mathbb{R}$ e $y = +\\infty$, basta scegliere $U = (x-1, x+1)$ e $V = (x+1, +\\infty]$, e di nuovo il punto $x+1$ è escluso da entrambi.</p>`
          }

        <p>La figura illustra i due casi. In alto: due punti finiti distinti $L \\neq M$ separati dai due intorni simmetrici di raggio $|M-L|/2$, cioè $U = \\left(L - \\frac{|M-L|}{2},\\, L + \\frac{|M-L|}{2}\\right)$ e $V = \\left(M - \\frac{|M-L|}{2},\\, M + \\frac{|M-L|}{2}\\right)$; i due intervalli hanno come estremo comune il punto medio $(L+M)/2$, che però è escluso da entrambi (pallino vuoto), per cui l'intersezione è vuota.</p>
        <p>In basso: il caso $M = +\\infty$, in cui $+\\infty$ non è un punto a distanza finita ma un estremo simbolico e l'intorno $V$ è una semiretta; anche qui il punto di contatto $L+1$ è escluso sia da $U$ sia da $V$. In entrambi i casi <strong>nessun termine $a_n$ può appartenere contemporaneamente a $U$ e a $V$</strong>.</p>`

      {
        id: "s14-definizione-limite",
        type: "section",
        title: "Definizione unificata di limite di successione",
        icon: "🔭",
        content: `<p>L'introduzione degli intorni in $\\mathbb{R}^*$ ci permette di dare una definizione di limite di successione molto più generale ed elegante, che tiene insieme i casi di limite finito, $+\\infty$ e $-\\infty$.</p>`,
        subsections: [
          {
            subtitle: "Definizione — Limite di successione",
            content: `<p>Sia $(a_n)_{n \\in \\mathbb{N}}$ una successione di numeri reali e sia $L \\in \\mathbb{R}^*$. Si dice che la successione $a_n$ <strong>tende a $L$</strong> (e, nel caso $L \\in \\mathbb{R}$, che <strong>converge a $L$</strong>, mentre nei casi $L = +\\infty$ e $L = -\\infty$ che <strong>diverge a $L$</strong>), e si scrive</p>
            <p>$$\\lim_{n \\to +\\infty} a_n = L$$</p>
            <p>se per ogni intorno $U$ di $L$, la successione $a_n$ appartiene a $U$ <strong>definitivamente</strong> (nel senso fissato nella nota precedente: esiste un indice soglia $n_0$ oltre il quale tutti i termini stanno in $U$).</p>
            <p>In simboli:</p>
            <p>$$\\lim_{n \\to +\\infty} a_n = L \\quad \\iff \\quad \\forall U \\text{ intorno di } L, \\ \\exists n_0 \\in \\mathbb{N} : \\forall n \\gt n_0, \\ a_n \\in U$$</p>`
          },
          {
            subtitle: "Coerenza con le definizioni precedenti",
            content: `<p>Questa nuova definizione è perfettamente coerente con quelle date in precedenza.</p>
            <p><strong>Se $L \\in \\mathbb{R}$ (limite finito):</strong> gli intorni di $L$ sono gli intervalli <em>aperti</em> che contengono $L$. In particolare, possiamo considerare gli intorni simmetrici $U = (L-\\varepsilon, L+\\varepsilon)$. La condizione $a_n \\in U$ diventa $|a_n - L| \\lt \\varepsilon$. La frase "per ogni intorno $U$" si traduce in "per ogni $\\varepsilon \\gt 0$": questo è lecito grazie all'osservazione sulla riduzione agli intorni simmetrici, perché ogni intervallo aperto $U$ contenente $L$ contiene un intorno simmetrico $(L-\\varepsilon, L+\\varepsilon)$ (si prende $\\varepsilon = \\min\\{L-a, b-L\\}$ se $U = (a,b)$) e l'appartenenza a quest'ultimo implica l'appartenenza a $U$; viceversa, ogni intorno simmetrico è un intorno. Ritroviamo così la definizione originale:</p>
            <p>$$\\forall \\varepsilon \\gt 0\\ \\exists n_0 \\in \\mathbb{N} : \\forall n \\gt n_0, \\quad |a_n - L| \\lt \\varepsilon .$$</p>
            <p><strong>Se $L = +\\infty$ (limite infinito):</strong> gli intorni di $+\\infty$ sono del tipo $U = (M, +\\infty]$ con $M \\in \\mathbb{R}$. La condizione $a_n \\in U$ diventa $a_n \\gt M$. La frase "per ogni intorno $U$" si traduce in "per ogni $M \\in \\mathbb{R}$":</p>
            <p>$$\\forall M \\in \\mathbb{R}\\ \\exists n_0 \\in \\mathbb{N} : \\forall n \\gt n_0, \\quad a_n \\gt M .$$</p>
            <p><strong>Se $L = -\\infty$:</strong> il caso è analogo a quello di $+\\infty$, ma con il <em>verso della disuguaglianza invertito</em>. Gli intorni di $-\\infty$ sono del tipo $U = [-\\infty, b)$ con $b \\in \\mathbb{R}$, e la condizione $a_n \\in U$ diventa $a_n \\lt b$. Dunque</p>
            <p>$$\\lim_{n \\to +\\infty} a_n = -\\infty \\quad \\iff \\quad \\forall b \\in \\mathbb{R}\\ \\exists n_0 \\in \\mathbb{N} : \\forall n \\gt n_0, \\quad a_n \\lt b .$$</p>
            <p>Si noti che qui $b$ può essere un numero negativo molto grande in modulo: la condizione chiede che i termini della successione scendano <em>sotto</em> qualunque soglia prefissata.</p>
            <p>Il grande vantaggio di questa formulazione è che ci permette di dimostrare teoremi sui limiti in modo unificato, senza dover distinguere i vari casi.</p>`
          }
        ],
        formulas: [
          { label: "Limite (forma unificata)", latex: "\\lim_{n \\to +\\infty} a_n = L \\iff \\forall U \\text{ intorno di } L,\\ \\exists n_0 : \\forall n \\gt n_0,\\ a_n \\in U" },
          { label: "Caso $L$ finito", latex: "\\forall \\varepsilon \\gt 0\\ \\exists n_0 : \\forall n \\gt n_0,\\ |a_n - L| \\lt \\varepsilon" },
          { label: "Caso $L = +\\infty$", latex: "\\forall M \\in \\mathbb{R}\\ \\exists n_0 : \\forall n \\gt n_0,\\ a_n \\gt M" },
          { label: "Caso $L = -\\infty$", latex: "\\forall b \\in \\mathbb{R}\\ \\exists n_0 : \\forall n \\gt n_0,\\ a_n \\lt b" }
        ]
      },

      {
        id: "s14-esempi-definizione",
        type: "section",
        title: "Due verifiche con la definizione",
        icon: "✅",
        content: `<p>Vediamo su due casi concreti come si usa la definizione: il punto delicato è sempre <em>scegliere</em> l'indice $n_0$ a partire dall'intorno assegnato.</p>`,
        subsections: [
          {
            subtitle: "Esempio illustrativo — verifica che $1/(n+1) \\to 0$",
            content: `<p>Consideriamo la successione</p>
            <p>$$a_n = \\frac{1}{n+1}, \\qquad n \\in \\mathbb{N},$$</p>
            <p>e mostriamo con la definizione che $\\displaystyle \\lim_{n \\to +\\infty} a_n = 0$.</p>
            <p><strong>Passo 1 (traduzione dell'intorno).</strong> Sia $U$ un intorno di $L = 0$. Per la Proposizione sulla riduzione agli intorni simmetrici esiste $\\varepsilon \\gt 0$ con $(-\\varepsilon, \\varepsilon) \\subseteq U$; basta dunque mostrare che $|a_n - 0| \\lt \\varepsilon$ definitivamente.</p>
            <p><strong>Passo 2 (scelta di $n_0$).</strong> La disuguaglianza da verificare è</p>
            <p>$$\\left| \\frac{1}{n+1} - 0 \\right| = \\frac{1}{n+1} \\lt \\varepsilon \\quad \\Longleftrightarrow \\quad n + 1 \\gt \\frac{1}{\\varepsilon} \\quad \\Longleftrightarrow \\quad n \\gt \\frac{1}{\\varepsilon} - 1 .$$</p>
            <p>Scegliamo allora $n_0 \\in \\mathbb{N}$ con $n_0 \\geq 1/\\varepsilon$ (tale $n_0$ esiste perché $\\mathbb{N}$ non è superiormente limitato in $\\mathbb{R}$: è la proprietà di Archimede). Questa è una scelta <em>sufficiente</em>, non la minima possibile: va bene qualunque soglia che renda vera la disuguaglianza.</p>
            <p><strong>Passo 3 (verifica).</strong> Se $n \\gt n_0$ allora $n \\geq 1/\\varepsilon$, quindi $n + 1 \\gt 1/\\varepsilon$ e di conseguenza</p>
            <p>$$|a_n - 0| = \\frac{1}{n+1} \\lt \\varepsilon ,$$</p>
            <p>cioè $a_n \\in (-\\varepsilon, \\varepsilon) \\subseteq U$ per ogni $n \\gt n_0$. Poiché $U$ era un intorno arbitrario di $0$, concludiamo che $a_n \\to 0$.</p>
            <p><strong>Esempio numerico.</strong> Se $\\varepsilon = 10^{-2}$, allora $1/\\varepsilon = 100$ e possiamo prendere $n_0 = 100$: per ogni $n \\gt 100$ si ha $1/(n+1) \\leq 1/102 \\lt 10^{-2}$. Qui la soglia $n_0 = 100$ è meno restrittiva di quella prescritta in generale, ma la verifica diretta mostra che funziona già.</p>`
          },
          {
            subtitle: "Esempio illustrativo — verifica che $-n \\to -\\infty$",
            content: `<p>Applichiamo ora la definizione a una successione con limite <em>infinito</em>, per vedere all'opera il caso $L = -\\infty$. Consideriamo</p>
            <p>$$a_n = -n, \\qquad n \\in \\mathbb{N}.$$</p>
            <p><strong>Passo 1 (traduzione dell'intorno).</strong> Sia $U$ un intorno di $-\\infty$: allora $U = [-\\infty, b)$ per un qualche $b \\in \\mathbb{R}$, e la condizione $a_n \\in U$ si scrive semplicemente</p>
            <p>$$a_n \\lt b, \\qquad \\text{cioè} \\qquad -n \\lt b .$$</p>
            <p><strong>Passo 2 (scelta di $n_0$).</strong> La disuguaglianza $-n \\lt b$ equivale a $n \\gt -b$. Scegliamo quindi un indice</p>
            <p>$$n_0 \\in \\mathbb{N} \\quad \\text{con} \\quad n_0 \\geq \\max\\{0, -b\\} ,$$</p>
            <p>che esiste per la proprietà di Archimede. Il $\\max$ con $0$ serve solo a coprire il caso $b \\gt 0$, in cui la disuguaglianza $n \\gt -b$ è automaticamente vera per ogni $n \\in \\mathbb{N}$.</p>
            <p><strong>Passo 3 (verifica).</strong> Se $n \\gt n_0$, allora $n \\gt -b$ e dunque</p>
            <p>$$a_n = -n \\lt b ,$$</p>
            <p>cioè $a_n \\in [-\\infty, b) = U$ per ogni $n \\gt n_0$. Poiché $U$ era un intorno arbitrario di $-\\infty$, concludiamo che $a_n \\to -\\infty$.</p>
            <p><strong>Esempio numerico.</strong> Se $b = -1000$, allora $-b = 1000$ e possiamo prendere $n_0 = 1000$: per ogni $n \\gt 1000$ si ha $a_n = -n \\lt -1000 = b$. Anche qui la soglia numerica è meno restrittiva della prescrizione generale, ma la verifica diretta la convalida.</p>`
          }
        ]
      },

      {
        id: "s14-unicita",
        type: "section",
        title: "Unicità del limite",
        icon: "🔒",
        content: `<p>Vediamo ora come la nuova definizione semplifichi la dimostrazione di proprietà fondamentali.</p>
        <p><strong>Teorema (Unicità del limite).</strong> Se una successione $(a_n)_{n \\in \\mathbb{N}}$ ammette limite, allora tale limite è unico.</p>`,
        subsections: [
          {
            subtitle: "Dimostrazione",
            content: `<p>Dimostriamo il teorema per assurdo. Supponiamo che la successione $(a_n)$ ammetta due limiti distinti, $L$ e $M$, con $L, M \\in \\mathbb{R}^*$ e $L \\neq M$:</p>
            <p>$$\\lim_{n \\to +\\infty} a_n = L \\quad \\text{e} \\quad \\lim_{n \\to +\\infty} a_n = M .$$</p>
            <p>Poiché $L \\neq M$, per la proprietà di separazione (di Hausdorff) degli intorni, esistono un intorno $U$ di $L$ e un intorno $V$ di $M$ tali che la loro intersezione è vuota:</p>
            <p>$$U \\cap V = \\emptyset$$</p>
            <p>(si veda la figura sulla separazione per i due casi tipici).</p>
            <p>Ora usiamo la definizione di limite:</p>
            <ul>

              <li>poiché $\\lim_{n \\to +\\infty} a_n = M$, per l'intorno $V$ di $M$ esiste un indice $n_1 \\in \\mathbb{N}$ tale che per ogni $n \\gt n_1$ si ha $a_n \\in V$.</li>

            <p>Scegliamo ora un indice $n \\gt \\max(n_0, n_1)$. Per un tale $n$ devono valere entrambe le condizioni:</p>

            <p>Questo implicherebbe che $a_n$ appartiene all'intersezione $U \\cap V$. Ma noi avevamo scelto $U$ e $V$ in modo che $U \\cap V = \\emptyset$: siamo giunti a una contraddizione.</p>
            <p>L'assunzione iniziale che potessero esistere due limiti distinti deve essere falsa. Pertanto il limite, se esiste, è unico. $\\blacksquare$</p>`

      {
        id: "s14-es-teoria-1",
        type: "esercizio",
        title: "Teoria 1",
        kind: "teoria",
        source: "integrazione",
        content: `<p>Enunciare la definizione di intorno di un punto $x \\in \\mathbb{R}^*$ nei tre casi $x \\in \\mathbb{R}$, $x = +\\infty$, $x = -\\infty$. Stabilire poi se l'insieme $A = \\{x \\in \\mathbb{R} : x \\gt 7\\}$ è un intorno di $+\\infty$ secondo tale definizione, e spiegare perché la risposta non cambia nulla nella verifica dei limiti di successioni reali.</p>`,
        solution: `<p><strong>Definizioni.</strong></p>
        <p>(i) Se $x_0 \\in \\mathbb{R}$, un intorno di $x_0$ è un qualunque intervallo aperto di $\\mathbb{R}$ che contiene $x_0$; caso particolare è l'intorno simmetrico</p>
        <p>$$I_R(x_0) = \\{x \\in \\mathbb{R} : |x-x_0| \\lt R\\} = (x_0-R,\\ x_0+R), \\qquad R \\gt 0 .$$</p>
        <p>(ii) Un intorno di $+\\infty$ è un insieme del tipo $(a,+\\infty] = \\{x \\in \\mathbb{R}^* : x \\gt a\\}$ con $a \\in \\mathbb{R}$.</p>
        <p>(iii) Un intorno di $-\\infty$ è un insieme del tipo $[-\\infty,b) = \\{x \\in \\mathbb{R}^* : x \\lt b\\}$ con $b \\in \\mathbb{R}$.</p>
        <p><strong>Risposta sull'insieme $A$.</strong> Si ha $A = (7,+\\infty)$, cioè $A \\subseteq \\mathbb{R}$ e quindi $+\\infty \\notin A$. Poiché gli intorni di $+\\infty$ contengono per definizione il simbolo $+\\infty$ (infatti $(a,+\\infty] = (a,+\\infty) \\cup \\{+\\infty\\}$, e vale la proprietà di appartenenza $x \\in U$ per ogni intorno $U$ di $x$), l'insieme $A$ non è un intorno di $+\\infty$ in senso stretto: l'intorno associato è $A \\cup \\{+\\infty\\} = (7,+\\infty]$, ottenuto con $a = 7$.</p>
        <p><strong>Perché la distinzione è innocua nei limiti.</strong> I termini $a_n$ di una successione reale sono numeri reali, dunque $a_n \\neq +\\infty$ e la condizione $a_n \\in (7,+\\infty]$ equivale a $a_n \\gt 7$, cioè a $a_n \\in A$. In generale, per ogni intorno $U = (a,+\\infty]$ di $+\\infty$ si ha</p>
        <p>$$a_n \\in U \\iff a_n \\in U \\cap \\mathbb{R} = (a,+\\infty) \\iff a_n \\gt a ,$$</p>
        <p>che è esattamente la traduzione usata nella definizione $\\forall M \\in \\mathbb{R}\\ \\exists n_0 \\in \\mathbb{N} : \\forall n \\gt n_0,\\ a_n \\gt M$.</p>`
      },

      {
        id: "s14-es-teoria-2",
        type: "esercizio",
        title: "Teoria 2",
        kind: "teoria",
        source: "integrazione",
        content: `<p>Enunciare il Teorema della permanenza del segno nella prima forma per successioni. Nel caso $L \\in \\mathbb{R}$ con $L \\gt 0$, spiegare perché nella dimostrazione la scelta $\\varepsilon = \\frac{L}{2}$ è lecita e quali altre scelte di $\\varepsilon$ andrebbero ugualmente bene.</p>`,
        solution: `<p><strong>Enunciato.</strong> Sia $(a_n)_{n\\in\\mathbb{N}}$ una successione reale con $\\lim_{n\\to+\\infty}a_n = L$, $L \\in \\mathbb{R}^*$. Se $L \\gt 0$ oppure $L = +\\infty$, allora esiste $\\bar n \\in \\mathbb{N}$ tale che $a_n \\gt 0$ per ogni $n \\gt \\bar n$ (la successione è definitivamente positiva).</p>
        <p>Nel caso $L \\in \\mathbb{R}$, $L \\gt 0$, l'intorno simmetrico di $L$ è $U = (L-\\varepsilon, L+\\varepsilon)$ e serve che esso contenga solo numeri positivi, cioè $L-\\varepsilon \\geq 0$, ossia</p>
        <p>$$0 \\lt \\varepsilon \\leq L .$$</p>
        <p>Con $\\varepsilon = \\frac{L}{2}$ si ha $\\varepsilon \\gt 0$ (perché $L \\gt 0$) e $U = \\left(\\frac{L}{2},\\frac{3L}{2}\\right) \\subset (0,+\\infty)$: la scelta è dunque lecita. Per definizione di limite esiste $\\bar n$ tale che $a_n \\in U$ per ogni $n \\gt \\bar n$, quindi $a_n \\gt \\frac{L}{2} \\gt 0$ definitivamente.</p>
        <p>Va bene qualunque $\\varepsilon$ con $0 \\lt \\varepsilon \\leq L$: ad esempio $\\varepsilon = \\frac{L}{3}$ dà $U = \\left(\\frac{2L}{3},\\frac{4L}{3}\\right)$, e anche $\\varepsilon = L$ dà $U = (0,2L) \\subset (0,+\\infty)$ (l'estremo $0$ è escluso, essendo l'intervallo aperto). Non va bene $\\varepsilon \\gt L$, perché allora $0 \\in U$ e l'intorno conterrebbe anche numeri negativi.</p>`
      },

      {
        id: "s14-es-teoria-3",
        type: "esercizio",
        title: "Teoria 3",
        kind: "teoria",
        source: "integrazione",
        content: `<p>Dimostrare, a partire dalla definizione di intorno in $\\mathbb{R}^*$, le due proprietà seguenti: (a) l'intersezione di due intorni di $+\\infty$ è ancora un intorno di $+\\infty$; (b) se $L \\in \\mathbb{R}$, esistono un intorno $U$ di $L$ e un intorno $V$ di $+\\infty$ con $U \\cap V = \\emptyset$ (proprietà di separazione nel caso misto).</p>`,
        solution: `<p><strong>(a)</strong> Siano $U = (a,+\\infty]$ e $V = (b,+\\infty]$ due intorni di $+\\infty$, con $a,b \\in \\mathbb{R}$, e sia $c = \\max\\{a,b\\} \\in \\mathbb{R}$. Per ogni $x \\in \\mathbb{R}^*$ si ha</p>
        <p>$$x \\in U \\cap V \\iff (x \\gt a \\text{ e } x \\gt b) \\iff x \\gt \\max\\{a,b\\} = c ,$$</p>
        <p>perché una quantità supera entrambi i numeri $a$ e $b$ se e solo se supera il maggiore dei due. Dunque $U \\cap V = (c,+\\infty]$, che è un intorno di $+\\infty$ (con il parametro $c \\in \\mathbb{R}$). Si noti che l'intersezione non è mai vuota: contiene sempre $+\\infty$.</p>
        <p><strong>(b)</strong> Sia $L \\in \\mathbb{R}$ e poniamo</p>
        <p>$$U = (L-1,\\ L+1), \\qquad V = (L+1,\\ +\\infty] .$$</p>
        <p>$U$ è un intervallo aperto che contiene $L$, quindi è un intorno di $L$; $V$ è un intorno di $+\\infty$ (con $a = L+1 \\in \\mathbb{R}$). Se per assurdo esistesse $x \\in U \\cap V$, da $x \\in U$ seguirebbe $x \\lt L+1$ e da $x \\in V$ seguirebbe $x \\gt L+1$: le due disuguaglianze sono incompatibili. Dunque $U \\cap V = \\emptyset$.</p>
        <p>Il punto di contatto $L+1$ è escluso da entrambi gli insiemi, essendo $U$ aperto a destra e $V$ aperto a sinistra. Più in generale funziona ogni coppia $U = (L-\\delta, L+\\delta)$, $V = (L+\\delta, +\\infty]$ con $\\delta \\gt 0$.</p>`
      },

      {
        id: "s14-es-teoria-4",
        type: "esercizio",
        title: "Teoria 4",
        kind: "teoria",
        source: "integrazione",
        content: `<p>È vero che se $a_n \\gt 0$ per ogni $n$ e $\\lim_{n\\to+\\infty}a_n = L$, allora $L \\gt 0$? Giustificare la risposta, enunciare correttamente la seconda forma del teorema della permanenza del segno e spiegare perché l'ipotesi di esistenza del limite non può essere omessa.</p>`,
        solution: `<p>L'affermazione è <strong>falsa</strong>. Controesempio: $a_n = \\frac{1}{n}$ per $n \\geq 1$ ha $a_n \\gt 0$ per ogni $n$, ma</p>
        <p>$$\\lim_{n\\to+\\infty}\\frac{1}{n} = 0 ,$$</p>
        <p>quindi $L = 0$ e non $L \\gt 0$.</p>
        <p><strong>Enunciato corretto (seconda forma).</strong> Se $a_n \\geq 0$ definitivamente e la successione ammette limite $L \\in \\mathbb{R}^*$, allora $L \\geq 0$. Dall'ipotesi stretta $a_n \\gt 0$ si può dedurre solo $L \\geq 0$: la disuguaglianza stretta "passa al limite" solo in forma debole.</p>
        <p><strong>Dimostrazione (per assurdo).</strong> Se fosse $L \\lt 0$ oppure $L = -\\infty$, per la prima forma la successione sarebbe definitivamente negativa, cioè esisterebbe $\\bar n$ con $a_n \\lt 0$ per ogni $n \\gt \\bar n$, in contraddizione con $a_n \\geq 0$ definitivamente. Quindi $L \\geq 0$.</p>
        <p><strong>Perché serve l'esistenza del limite.</strong> La successione $a_n = 1+(-1)^n$ soddisfa $a_n \\geq 0$ per ogni $n$ ma non ammette limite (i valori oscillano fra $0$ e $2$), quindi non c'è alcun $L$ di cui discutere il segno.</p>`
      },

      {
        id: "s14-es-scritto-1",
        type: "esercizio",
        title: "Scritto 1",
        kind: "scritto",
        source: "integrazione",
        content: `<p>(a) Sia $U = (-3,5)$ e $L = 2$: determinare il più grande $\\varepsilon \\gt 0$ tale che $(L-\\varepsilon, L+\\varepsilon) \\subseteq U$.</p>
        <p>(b) Ripetere la richiesta con $U = (1,+\\infty)$ e $L = 4$.</p>
        <p>(c) Stabilire se $[-\\infty,3)$ è un intorno di $-\\infty$ e se è un intorno di $0$.</p>`,
        solution: `<p><strong>(a)</strong> Siamo nel caso $U = (a,b)$ con $a = -3$, $b = 5$ e $a \\lt L \\lt b$. La Proposizione di riduzione agli intorni simmetrici dà</p>
        <p>$$\\varepsilon = \\min\\{L-a,\\ b-L\\} = \\min\\{2-(-3),\\ 5-2\\} = \\min\\{5,3\\} = 3 .$$</p>
        <p>Verifica: con $\\varepsilon = 3$ si ha $(2-3,\\ 2+3) = (-1,5) \\subseteq (-3,5)$. Massimalità: se $\\varepsilon \\gt 3$ allora $2+\\varepsilon \\gt 5$, quindi il punto $5$ appartiene a $(2-\\varepsilon, 2+\\varepsilon)$ ma non a $U$; dunque l'inclusione cade. Il valore massimo è $\\varepsilon = 3$.</p>
        <p><strong>(b)</strong> Ora $U = (1,+\\infty)$ è illimitato superiormente, quindi l'unico vincolo è sull'estremo sinistro:</p>
        <p>$$(4-\\varepsilon,\\ 4+\\varepsilon) \\subseteq (1,+\\infty) \\iff 4-\\varepsilon \\geq 1 \\iff \\varepsilon \\leq 3 .$$</p>
        <p>Il massimo è $\\varepsilon = 3$, e infatti $(1,7) \\subseteq (1,+\\infty)$; se $\\varepsilon \\gt 3$ il punto $1$ sta in $(4-\\varepsilon, 4+\\varepsilon)$ ma non in $U$.</p>
        <p><strong>(c)</strong> $[-\\infty,3)$ è un intorno di $-\\infty$: è esattamente della forma $[-\\infty,b)$ con $b = 3 \\in \\mathbb{R}$, cioè $\\{x \\in \\mathbb{R}^* : x \\lt 3\\}$.</p>
        <p>Non è invece un intorno di $0$: gli intorni di un punto finito sono, per definizione, intervalli aperti di $\\mathbb{R}$, mentre $[-\\infty,3)$ contiene il simbolo $-\\infty$, che non è un numero reale (in particolare non è un insieme del tipo $(a,b)$ con $a,b \\in \\mathbb{R}$ né una semiretta reale aperta). La sua parte reale $[-\\infty,3) \\cap \\mathbb{R} = (-\\infty,3)$ è invece un intervallo aperto che contiene $0$, quindi un intorno di $0$; e per la riduzione agli intorni simmetrici contiene $(-\\varepsilon,\\varepsilon)$ con, per esempio, $\\varepsilon = 3$.</p>`
      },

      {
        id: "s14-es-scritto-2",
        type: "esercizio",
        title: "Scritto 2",
        kind: "scritto",
        source: "integrazione",
        content: `<p>Calcolare, giustificando il procedimento, $\\displaystyle\\lim_{n\\to+\\infty}\\frac{\\cos(n^2)}{\\sqrt{n}}$.</p>`,
        solution: `<p>La successione $\\cos(n^2)$ non ammette limite, ma è limitata: $|\\cos(n^2)| \\leq 1$ per ogni $n$, cioè</p>
        <p>$$-1 \\leq \\cos(n^2) \\leq 1 \\qquad \\forall n \\geq 1 .$$</p>
        <p>Per $n \\geq 1$ si ha $\\sqrt{n} \\gt 0$, quindi dividendo per $\\sqrt{n}$ il verso delle disuguaglianze non cambia:</p>
        <p>$$-\\frac{1}{\\sqrt{n}} \\leq \\frac{\\cos(n^2)}{\\sqrt{n}} \\leq \\frac{1}{\\sqrt{n}} .$$</p>
        <p>Le due successioni "carabinieri" sono $a_n = -\\frac{1}{\\sqrt{n}}$ e $c_n = \\frac{1}{\\sqrt{n}}$, e</p>
        <p>$$\\lim_{n\\to+\\infty}\\left(-\\frac{1}{\\sqrt{n}}\\right) = 0, \\qquad \\lim_{n\\to+\\infty}\\frac{1}{\\sqrt{n}} = 0 .$$</p>
        <p>Per il Teorema del Confronto</p>
        <p>$$\\lim_{n\\to+\\infty}\\frac{\\cos(n^2)}{\\sqrt{n}} = 0 .$$</p>
        <p>In alternativa si applica direttamente il teorema "successione limitata diviso successione divergente", con $a_n = \\cos(n^2)$ limitata ($M = 1$) e $b_n = \\sqrt{n} \\to +\\infty$.</p>`

      {
        id: "s14-es-scritto-3",
        type: "esercizio",
        title: "Scritto 3",
        kind: "scritto",
        source: "integrazione",
        content: `<p>Usando la definizione di limite con gli intorni, verificare che:</p>
        <p>(a) $\\displaystyle \\lim_{n \\to +\\infty} \\frac{3n-1}{n+2} = 3$, determinando esplicitamente un indice $n_0$ adatto a $\\varepsilon = 10^{-3}$;</p>
        <p>(b) $\\displaystyle \\lim_{n \\to +\\infty} \\left(-\\sqrt{n}\\right) = -\\infty$, determinando esplicitamente un indice $n_0$ adatto all'intorno $[-\\infty,-50)$.</p>`,
        solution: `<p><strong>(a)</strong> Sia $a_n = \\dfrac{3n-1}{n+2}$. Per ogni $n \\in \\mathbb{N}$ si ha $n+2 \\gt 0$ e il calcolo centrale è</p>
        <p>$$\\begin{aligned}
        |a_n - 3| &= \\left| \\frac{3n-1-3(n+2)}{n+2} \\right| \\\\
        &= \\left| \\frac{3n-1-3n-6}{n+2} \\right| \\\\
        &= \\left| \\frac{-7}{n+2} \\right| = \\frac{7}{n+2} .
        \\end{aligned}$$</p>
        <p>Sia $U$ un intorno di $3$: per la Proposizione di riduzione agli intorni simmetrici esiste $\\varepsilon \\gt 0$ con $(3-\\varepsilon,3+\\varepsilon) \\subseteq U$, quindi basta rendere definitivamente vera $|a_n-3| \\lt \\varepsilon$. Essendo $n+2 \\gt 0$ e $\\varepsilon \\gt 0$, risolviamo la disuguaglianza:</p>
        <p>$$\\begin{aligned}
        \\frac{7}{n+2} \\lt \\varepsilon
        &\\iff n+2 \\gt \\frac{7}{\\varepsilon} \\\\
        &\\iff n \\gt \\frac{7}{\\varepsilon} - 2 .
        \\end{aligned}$$</p>
        <p>Per la proprietà di Archimede esiste $n_0 \\in \\mathbb{N}$ con $n_0 \\geq \\dfrac{7}{\\varepsilon}$; allora per ogni $n \\gt n_0$ si ha $n \\gt 7/\\varepsilon - 2$, dunque $n+2 \\gt 7/\\varepsilon$ e quindi $|a_n-3| = \\frac{7}{n+2} \\lt \\varepsilon$, cioè $a_n \\in (3-\\varepsilon,3+\\varepsilon) \\subseteq U$. Poiché $U$ era arbitrario, $a_n \\to 3$.</p>
        <p><strong>Caso $\\varepsilon = 10^{-3}$.</strong> La condizione è $n \\gt 7\\cdot 10^{3} - 2 = 6998$, quindi $n_0 = 6998$ è il più piccolo indice ammissibile. Controllo: per $n \\gt 6998$ si ha $n \\geq 6999$, cioè $n+2 \\geq 7001$ e</p>
        <p>$$|a_n-3| = \\frac{7}{n+2} \\leq \\frac{7}{7001} \\lt 10^{-3} .$$</p>
        <p>La scelta è ottimale, perché per $n = 6998$ si ottiene $\\frac{7}{7000} = 10^{-3}$, che non è $\\lt \\varepsilon$.</p>
        <p><strong>(b)</strong> Sia $a_n = -\\sqrt{n}$ e sia $U = [-\\infty,b)$ un generico intorno di $-\\infty$, con $b \\in \\mathbb{R}$. La condizione $a_n \\in U$ si scrive</p>
        <p>$$-\\sqrt{n} \\lt b \\iff \\sqrt{n} \\gt -b .$$</p>
        <p>Se $b \\gt 0$ la disuguaglianza è vera per ogni $n \\in \\mathbb{N}$ (perché $\\sqrt{n} \\geq 0 \\gt -b$). Se $b \\leq 0$ allora $-b \\geq 0$ ed elevando al quadrato (entrambi i membri non negativi) si ottiene l'equivalenza $\\sqrt{n} \\gt -b \\iff n \\gt b^2$.</p>
        <p>In entrambi i casi basta scegliere $n_0 \\in \\mathbb{N}$ con $n_0 \\geq b^2$: per ogni $n \\gt n_0$ si ha $n \\gt b^2$, dunque $\\sqrt n \\gt |b| \\geq -b$ e quindi $a_n = -\\sqrt{n} \\lt b$, cioè $a_n \\in [-\\infty,b) = U$. Poiché $U$ era arbitrario, $a_n \\to -\\infty$.</p>
        <p><strong>Caso $b = -50$.</strong> Si ha $b^2 = 2500$, quindi $n_0 = 2500$. Controllo: per $n \\gt 2500$ si ha $\\sqrt{n} \\gt 50$ e dunque $a_n = -\\sqrt{n} \\lt -50 = b$; la scelta è ottimale perché per $n = 2500$ si ha $a_n = -50 = b$, che non appartiene a $[-\\infty,-50)$.</p>`
      },

      {
        id: "s14-es-scritto-4",
        type: "esercizio",
        title: "Scritto 4",
        kind: "scritto",
        source: "integrazione",
        content: `<p>Calcolare $\\displaystyle\\lim_{n\\to+\\infty}\\frac{n+\\sin n}{2n+\\cos n}$ usando il Teorema del Confronto.</p>`,
        solution: `<p>Per ogni $n \\geq 1$ valgono $-1 \\leq \\sin n \\leq 1$ e $-1 \\leq \\cos n \\leq 1$, dunque</p>
        <p>$$n-1 \\leq n+\\sin n \\leq n+1, \\qquad 2n-1 \\leq 2n+\\cos n \\leq 2n+1 .$$</p>
        <p>Per $n \\geq 1$ si ha $2n-1 \\geq 1 \\gt 0$, quindi il denominatore è positivo e la successione è ben definita. Maggiorando il numeratore e minorando il denominatore (e viceversa) si ottiene, per ogni $n \\geq 1$ (il numeratore $n-1$ è $\\geq 0$, quindi le maggiorazioni conservano il verso):</p>
        <p>$$\\frac{n-1}{2n+1} \\leq \\frac{n+\\sin n}{2n+\\cos n} \\leq \\frac{n+1}{2n-1} .$$</p>
        <p>Calcoliamo i limiti delle due successioni esterne:</p>
        <p>$$\\lim_{n\\to+\\infty}\\frac{n-1}{2n+1} = \\lim_{n\\to+\\infty}\\frac{1-\\frac{1}{n}}{2+\\frac{1}{n}} = \\frac{1}{2}, \\qquad \\lim_{n\\to+\\infty}\\frac{n+1}{2n-1} = \\lim_{n\\to+\\infty}\\frac{1+\\frac{1}{n}}{2-\\frac{1}{n}} = \\frac{1}{2} .$$</p>
        <p>Poiché entrambe tendono a $\\frac{1}{2}$, per il Teorema del Confronto</p>
        <p>$$\\lim_{n\\to+\\infty}\\frac{n+\\sin n}{2n+\\cos n} = \\frac{1}{2} .$$</p>`
      },

        back: "Con la definizione. Sia $\\varepsilon \\gt 0$: poiché $b_n \\to +\\infty$, applicando la definizione all'intorno $\\left(\\frac{M}{\\varepsilon}, +\\infty\\right]$ si ottiene che definitivamente $b_n \\gt \\frac{M}{\\varepsilon} \\gt 0$, da cui, passando ai reciproci, $0 \\lt \\frac{M}{b_n} \\lt \\varepsilon$. Dunque $\\frac{M}{b_n} \\to 0$ (e analogamente $-\\frac{M}{b_n} \\to 0$). Si noti anche che $b_n \\gt 0$ solo <em>definitivamente</em>: il quoziente $a_n/b_n$ è definito almeno definitivamente, e ciò basta perché il limite dipende solo dalla coda."
      },
      {
        type: "domanda",
        front: "Quali sono le quattro proprietà fondamentali degli intorni in $\\mathbb{R}^*$ e quale serve per l'unicità del limite?",
        back: "(1) <strong>Appartenenza</strong>: se $U$ è intorno di $x$ allora $x \\in U$. (2) <strong>Intersezione</strong>: $U, V$ intorni di $x$ $\\Rightarrow$ $U \\cap V$ intorno di $x$ (es. $\\min(R_1,R_2)$ nel caso finito, $\\max(a,b)$ per $+\\infty$). (3) <strong>Apertura</strong>: se $y \\in U$, $y \\neq x$, esiste un intorno $V$ di $y$ con $V \\subseteq U$. (4) <strong>Separazione (Hausdorff)</strong>: $x \\neq y$ $\\Rightarrow$ esistono intorni disgiunti. È la (4) il cardine della dimostrazione dell'unicità del limite."
      },
      {
        type: "domanda",
        front: "Come si separano concretamente due punti di $\\mathbb{R}^*$ con intorni disgiunti?",
        back: "Se $x, y \\in \\mathbb{R}$ con $x \\lt y$: posto $\\varepsilon = (y-x)/2$, gli intorni $(x-\\varepsilon,x+\\varepsilon)$ e $(y-\\varepsilon,y+\\varepsilon)$ sono disgiunti; sono <em>adiacenti</em>, con estremo comune il punto medio $(x+y)/2$, che però è escluso da entrambi perché gli intervalli sono aperti. Se $x \\in \\mathbb{R}$ e $y = +\\infty$: si prendono $U = (x-1,x+1)$ e $V = (x+1,+\\infty]$, e il punto di contatto $x+1$ è escluso da entrambi."
      },
      {
        type: "dimostrazione",
        front: "Verifica con la definizione che $1/(n+1) \\to 0$.",
        back: "Sia $U$ intorno di $0$: per riduzione esiste $\\varepsilon \\gt 0$ con $(-\\varepsilon,\\varepsilon) \\subseteq U$. Si ha $\\left|\\frac{1}{n+1}\\right| \\lt \\varepsilon \\iff n+1 \\gt \\frac{1}{\\varepsilon} \\iff n \\gt \\frac{1}{\\varepsilon} - 1$. Per la proprietà di Archimede esiste $n_0 \\in \\mathbb{N}$ con $n_0 \\geq 1/\\varepsilon$ (scelta sufficiente, non minima). Allora per $n \\gt n_0$ vale $n+1 \\gt 1/\\varepsilon$, dunque $|a_n| \\lt \\varepsilon$ e $a_n \\in U$. Essendo $U$ arbitrario, $a_n \\to 0$."
      }
    ]
};
