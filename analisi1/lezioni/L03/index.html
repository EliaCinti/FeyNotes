<script>
const LESSON = {
    id: "L03", date: "Lezione 3 — 24 Set 2026",
    title: "Topologia della Retta Reale — Intervalli, Intorni, Estremi",
    abstract: "Dalla completezza di $\\mathbb{R}$ alla struttura della retta reale: intervalli, valore assoluto e distanza, intorni, punti interni e di frontiera, insiemi aperti e chiusi. Seconda parte: maggioranti, minoranti, massimo, minimo, estremo superiore e inferiore con la loro caratterizzazione con $\\varepsilon$.",

    sections: [
      {
        id: "s03-completezza",
        type: "section",
        title: "La Retta Reale e la sua Completezza",
        icon: "📏",
        content: `<p>Riprendiamo il concetto di completezza dei numeri reali introdotto nella lezione precedente. L'insieme dei numeri reali $\\mathbb{R}$ è in corrispondenza biunivoca con i punti di una retta: per ogni numero reale c'è un punto sulla retta e, viceversa, per ogni punto della retta c'è un numero reale.</p>`,
        subsections: [
          {
            subtitle: "Assioma di Completezza",
            content: `<p><strong>Definizione.</strong> Dati due insiemi non vuoti $A, B \\subset \\mathbb{R}$ tali che per ogni $a \\in A$ e per ogni $b \\in B$ si ha $a \\le b$, allora esiste almeno un elemento separatore $c \\in \\mathbb{R}$ tale che $a \\le c \\le b$ per ogni $a \\in A$ e $b \\in B$.</p>
            <p>Questa proprietà è ciò che distingue $\\mathbb{R}$ da $\\mathbb{Q}$: nei razionali si possono costruire due insiemi che soddisfano l'ipotesi dell'assioma ma per i quali <strong>nessun razionale funziona da separatore</strong>.</p>`
          },
          {
            subtitle: "Esempio — il separatore mancante in $\\mathbb{Q}$",
            content: `<p>Consideriamo i due sottoinsiemi di $\\mathbb{Q}$:</p>
            <p>$$A = \\{ q \\in \\mathbb{Q} \\mid q \\ge 0, \\; q^2 \\lt 2 \\}, \\qquad B = \\{ q \\in \\mathbb{Q} \\mid q \\ge 0, \\; q^2 \\gt 2 \\}.$$</p>
            <p>Entrambi sono non vuoti: ad esempio $1 \\in A$ (poiché $1^2 = 1 \\lt 2$) e $2 \\in B$ (poiché $2^2 = 4 \\gt 2$).</p>
            <p><strong>Verifica dell'ipotesi dell'assioma.</strong> Siano $a \\in A$ e $b \\in B$. Entrambi sono non negativi, con $a^2 \\lt 2 \\lt b^2$. Se fosse $a \\gt b \\ge 0$, elevando al quadrato (operazione che conserva l'ordine sui numeri non negativi) otterremmo $a^2 \\gt b^2$, in contraddizione con $a^2 \\lt b^2$. Dunque $a \\le b$ per ogni $a \\in A$ e ogni $b \\in B$: le ipotesi dell'assioma di completezza sono soddisfatte.</p>
            <p><strong>Perché la restrizione $q \\ge 0$ è essenziale.</strong> Senza la condizione di non negatività avremmo $0 \\in A$ (perché $0^2 = 0 \\lt 2$) e $-2 \\in B$ (perché $(-2)^2 = 4 \\gt 2$), ma $0 \\le -2$ è falso: l'ipotesi dell'assioma non sarebbe verificata e l'esempio non direbbe nulla sulla completezza.</p>
            <p><strong>Conclusione.</strong> In $\\mathbb{R}$ l'assioma di completezza garantisce l'esistenza di un separatore. Qui <em>assumiamo</em> due fatti: l'irrazionalità di $\\sqrt{2}$ e l'unicità del separatore per questa coppia di insiemi; ne segue che l'unico numero reale $c$ con $a \\le c \\le b$ per ogni $a \\in A$, $b \\in B$ è $c = \\sqrt{2}$. Poiché $\\sqrt{2} \\notin \\mathbb{Q}$, in $\\mathbb{Q}$ non esiste alcun elemento separatore: <strong>i razionali non soddisfano l'assioma di completezza</strong>.</p>`
          }
        ],
        extra_content: `<p>La dimostrazione completa dell'irrazionalità di $\\sqrt{2}$ e dell'unicità del separatore non viene svolta qui: quello che ci interessa è che essa mette in luce la differenza strutturale fra $\\mathbb{Q}$ e $\\mathbb{R}$.</p>
        <p>La corrispondenza tra numeri e punti ci permette di "disporre" i numeri reali su una retta ordinata. Fissata un'origine (lo $0$) e un'unità di misura, possiamo associare a ogni numero la sua posizione, e quindi visualizzare e manipolare insiemi di numeri reali in modo geometrico.</p>`
      },

      {
        id: "s03-intervalli",
        type: "section",
        title: "Intervalli sulla Retta Reale",
        icon: "📐",
        content: `<p>Gli intervalli sono sottoinsiemi di $\\mathbb{R}$ che corrispondono a "segmenti" della retta reale.</p>`,
        subsections: [
          {
            subtitle: "Intervalli limitati",
            content: `<p>Dati $a, b \\in \\mathbb{R}$ con $a \\lt b$:</p>
            <p><strong>Intervallo aperto</strong> — gli estremi sono esclusi:</p>
            <p>$$(a, b) = \\{ x \\in \\mathbb{R} \\mid a \\lt x \\lt b \\}$$</p>
            <p><strong>Intervallo chiuso</strong> — gli estremi sono inclusi:</p>
            <p>$$[a, b] = \\{ x \\in \\mathbb{R} \\mid a \\le x \\le b \\}$$</p>
            <p><strong>Intervalli semiaperti (o semichiusi)</strong> — solo uno dei due estremi è incluso:</p>
            <p>$$(a, b] = \\{ x \\in \\mathbb{R} \\mid a \\lt x \\le b \\}$$</p>
            <p>$$[a, b) = \\{ x \\in \\mathbb{R} \\mid a \\le x \\lt b \\}$$</p>`
          },
          {
            subtitle: "Esempio grafico — $[-1, 2)$",
            content: `<p>L'insieme $[-1,2)$ contiene tutti i numeri reali $x$ tali che $-1 \\le x \\lt 2$. L'estremo $-1$ è incluso, l'estremo $2$ è escluso. Graficamente si rappresenta un estremo incluso con un "pallino pieno" e un estremo escluso con una "croce" o un "pallino vuoto".</p>

          },
          {
            subtitle: "Intervalli illimitati",
            content: `<p>Dato $a \\in \\mathbb{R}$:</p>
            <p>$$(a, +\\infty) = \\{ x \\in \\mathbb{R} \\mid x \\gt a \\}$$</p>
            <p>$$[a, +\\infty) = \\{ x \\in \\mathbb{R} \\mid x \\ge a \\}$$</p>
            <p>$$(-\\infty, a) = \\{ x \\in \\mathbb{R} \\mid x \\lt a \\}$$</p>
            <p>$$(-\\infty, a] = \\{ x \\in \\mathbb{R} \\mid x \\le a \\}$$</p>
            <p>L'insieme di tutti i numeri reali $\\mathbb{R}$ può essere visto come l'intervallo illimitato $(-\\infty, +\\infty)$.</p>`
          }
        ],
        extra_content: `<p><strong>Da ricordare:</strong> i simboli $+\\infty$ e $-\\infty$ <strong>non sono numeri reali</strong>. Indicano semplicemente che l'intervallo non ha un limite superiore o inferiore. Per questo motivo gli intervalli sono <strong>sempre aperti</strong> in corrispondenza di $\\pm\\infty$.</p>`
      },

      {
        id: "s03-valore-assoluto",
        type: "section",
        title: "Valore Assoluto e Distanza",
        icon: "📊",
        content: `<p>Il valore assoluto è lo strumento essenziale per misurare "grandezze" e distanze sulla retta reale.</p>`,
        subsections: [
          {
            subtitle: "Valore assoluto",
            content: `<p>Dato $x \\in \\mathbb{R}$:</p>
            <p>$$|x| = \\begin{cases} x & \\text{se } x \\ge 0 \\\\ -x & \\text{se } x \\lt 0 \\end{cases}$$</p>
            <p><strong>Interpretazione geometrica:</strong> $|x|$ rappresenta la distanza del punto $x$ dall'origine $0$ sulla retta reale. La distanza è sempre una quantità non negativa.</p>`
          },
          {
            subtitle: "Distanza tra due punti",
            content: `<p>Dati $x, y \\in \\mathbb{R}$, la distanza fra di essi è il valore assoluto della loro differenza:</p>
            <p>$$d(x, y) = |x - y|$$</p>
            <p>Proprietà:</p>
            <ul>
              <li>È sempre non negativa: $|x - y| \\ge 0$.</li>
              <li>È simmetrica: $|x - y| = |y - x|$.</li>
              <li>Si annulla se e solo se i punti coincidono: $|x - y| = 0 \\iff x = y$.</li>
            </ul>
            <p><strong>Esempio.</strong> La distanza tra $1$ e $-3$ è</p>
            <p>$$d(1, -3) = |1 - (-3)| = |1 + 3| = |4| = 4,$$</p>
            <p>come ci aspettiamo: sulla retta reale ci sono $4$ unità di distanza tra $1$ e $-3$.</p>`
          }
        ],
        formulas: [
          { label: "Valore assoluto", latex: "|x| = x \\text{ se } x \\ge 0, \\quad |x| = -x \\text{ se } x \\lt 0" },
          { label: "Distanza", latex: "d(x,y) = |x - y|" }
        ]
      },

      {
        id: "s03-intorni",
        type: "section",
        title: "Intorni di un Punto",
        icon: "🎯",
        content: `<p>Il concetto di "intorno" formalizza l'idea di <strong>vicinanza</strong> a un punto: un intorno di un punto è un insieme che contiene tutti i punti sufficientemente vicini a quel punto.</p>
        <p><strong>Definizione.</strong> Dato $x_0 \\in \\mathbb{R}$ e un numero reale $R \\gt 0$ (il <em>raggio</em>), si definisce <strong>intorno</strong> di $x_0$ di raggio $R$ l'insieme dei punti la cui distanza da $x_0$ è minore di $R$:</p>
        <p>$$I_R(x_0) = \\{ x \\in \\mathbb{R} \\mid |x - x_0| \\lt R \\}$$</p>`,
        subsections: [
          {
            subtitle: "Un intorno è un intervallo aperto centrato",
            content: `<p>La disequazione $|x - x_0| \\lt R$ è equivalente a</p>
            <p>$$-R \\lt x - x_0 \\lt R.$$</p>
            <p>Sommando $x_0$ a tutti i membri:</p>
            <p>$$x_0 - R \\lt x \\lt x_0 + R.$$</p>
            <p>Quindi l'intorno coincide con l'intervallo aperto</p>
            <p>$$I_R(x_0) = (x_0 - R, x_0 + R).$$</p>`
          },
          {
            subtitle: "Esempio",
            content: `<p>L'intorno del punto $1$ di raggio $2$ è</p>
            <p>$$I_2(1) = \\{ x \\in \\mathbb{R} \\mid |x - 1| \\lt 2 \\},$$</p>
            <p>che corrisponde all'intervallo $(1 - 2,\\, 1 + 2) = (-1, 3)$.</p>`
          }
        ],
        formulas: [
          { label: "Intorno di raggio R", latex: "I_R(x_0) = \\{ x \\in \\mathbb{R} \\mid |x - x_0| \\lt R \\} = (x_0 - R,\\, x_0 + R)" }
        ]
      },

      {
        id: "s03-interni-frontiera",
        type: "section",
        title: "Punti Interni e Punti di Frontiera",
        icon: "🚧",
        content: `<p>Usando gli intorni possiamo classificare i punti in base alla loro posizione rispetto a un insieme. <strong>La differenza cruciale fra le due definizioni che seguono sta nel quantificatore:</strong> per il punto interno basta che <em>esista</em> un raggio buono, per il punto di frontiera la condizione deve valere per <em>ogni</em> raggio.</p>`,
        subsections: [
          {
            subtitle: "Punto interno",
            content: `<p>Sia $A \\subseteq \\mathbb{R}$ e sia $x_0 \\in A$. Il punto $x_0$ si dice <strong>punto interno</strong> ad $A$ se esiste un raggio $R \\gt 0$ tale che l'intero intorno $I_R(x_0)$ è contenuto in $A$:</p>
            <p>$$\\exists R \\gt 0 \\text{ tale che } I_R(x_0) \\subseteq A.$$</p>
            <p>Un punto interno è, in un certo senso, "ben dentro" l'insieme, circondato solo da altri punti dell'insieme.</p>`
          },
          {
            subtitle: "Punto di frontiera",
            content: `<p>Sia $A \\subseteq \\mathbb{R}$ e sia $x_0 \\in \\mathbb{R}$ (notare che $x_0$ <strong>può appartenere o non appartenere</strong> ad $A$). Il punto $x_0$ si dice <strong>punto di frontiera</strong> per $A$ se ogni suo intorno contiene sia punti di $A$ sia punti del complementare $A^c = \\mathbb{R} \\setminus A$:</p>
            <p>$$\\forall R \\gt 0, \\quad I_R(x_0) \\cap A \\neq \\emptyset \\quad \\text{e} \\quad I_R(x_0) \\cap A^c \\neq \\emptyset.$$</p>
            <p>Un punto di frontiera è un punto "di confine", arbitrariamente vicino sia a punti dentro $A$ sia a punti fuori da $A$.</p>`
          },

            subtitle: "Lettura grafica su $A = [-1, 2)$",
            content: `<p>Riprendiamo $A = [-1, 2)$ e confrontiamo visivamente i tre casi tipici: un punto interno e i due punti di frontiera.</p>

      {
        id: "s03-aperti-chiusi",
        type: "section",
        title: "Insiemi Aperti e Chiusi",
        icon: "🔓",
        content: `<p>La classificazione dei punti porta a due importantissime classi di insiemi.</p>
        <p><strong>Insieme aperto.</strong> Un insieme $A \\subseteq \\mathbb{R}$ si dice <strong>aperto</strong> se tutti i suoi punti sono punti interni.</p>
        <p><strong>Insieme chiuso.</strong> Un insieme $A \\subseteq \\mathbb{R}$ si dice <strong>chiuso</strong> se soddisfa una delle seguenti condizioni equivalenti:</p>
        <ol>
          <li>Il suo complementare $A^c$ è un insieme aperto.</li>
          <li>L'insieme $A$ contiene tutti i suoi punti di frontiera.</li>
        </ol>`,
        subsections: [
          {
            subtitle: "L'intervallo aperto $(a,b)$ è un insieme aperto",
            content: `<p>Sia $x \\in (a, b)$, cioè $a \\lt x \\lt b$. Le due quantità $x - a$ e $b - x$ sono entrambe strettamente positive, quindi possiamo scegliere <em>esplicitamente</em></p>
            <p>$$R = \\frac{\\min\\{x - a,\\; b - x\\}}{2} \\gt 0.$$</p>
            <p>Verifichiamo che questo raggio funziona. Sia $y \\in I_R(x)$, cioè $x - R \\lt y \\lt x + R$. Poiché $R \\le \\dfrac{x-a}{2} \\lt x - a$, si ha</p>
            <p>$$a = x - (x - a) \\lt x - R \\lt y,$$</p>
            <p>e poiché $R \\le \\dfrac{b-x}{2} \\lt b - x$, si ha</p>
            <p>$$y \\lt x + R \\lt x + (b - x) = b.$$</p>
            <p>Mettendo insieme le due catene otteniamo $a \\lt x - R \\lt y \\lt x + R \\lt b$, cioè $y \\in (a,b)$. Poiché $y$ era un elemento arbitrario dell'intorno, concludiamo $I_R(x) \\subseteq (a,b)$: ogni punto di $(a,b)$ è interno e l'insieme è aperto. I punti di frontiera sono $a$ e $b$, che non appartengono all'insieme.</p>`
          },
          {
            subtitle: "L'intervallo chiuso $[a,b]$ è un insieme chiuso",
            content: `<p>I suoi punti di frontiera sono $a$ e $b$, ed entrambi appartengono a $[a,b]$. Quindi l'insieme contiene tutta la sua frontiera.</p>`
          },
          {
            subtitle: "L'intervallo semiaperto $[a,b)$ non è né aperto né chiuso",
            content: `<p><strong>Non è aperto</strong> perché il punto $a \\in [a,b)$ non è un punto interno: ogni intorno di $a$ contiene numeri minori di $a$, che non sono nell'insieme.</p>
            <p><strong>Non è chiuso</strong> perché il punto $b$ è un punto di frontiera, ma non appartiene a $[a,b)$.</p>`
          },

            content: `<p>Prendiamo l'intervallo $(a,b) = (1,5)$ e il punto $x = 2$. Allora</p>
            <p>$$x - a = 2 - 1 = 1, \\qquad b - x = 5 - 2 = 3, \\qquad R = \\frac{\\min\\{1,3\\}}{2} = \\frac{1}{2}.$$</p>
            <p>L'intorno corrispondente è</p>
            <p>$$I_{1/2}(2) = \\left(2 - \\tfrac{1}{2},\\; 2 + \\tfrac{1}{2}\\right) = \\left(\\tfrac{3}{2}, \\tfrac{5}{2}\\right),$$</p>
            <p>e in effetti $1 \\lt \\tfrac{3}{2}$ e $\\tfrac{5}{2} \\lt 5$, dunque $I_{1/2}(2) \\subseteq (1,5)$. Lo stesso procedimento applicato a un punto molto vicino a un estremo (ad esempio $x = 1{,}01$, per cui $R = 0{,}005$) produce semplicemente un raggio più piccolo: la formula funziona sempre, purché $x$ sia strettamente interno all'intervallo.</p>`
          }
        ],
        formulas: [
          { label: "Raggio buono per un punto di $(a,b)$", latex: "R = \\frac{\\min\\{x - a,\\; b - x\\}}{2}" }
        ],
        extra_content: `<p><strong>Un caso speciale: $\\mathbb{R}$ e $\\emptyset$.</strong> Esistono due insiemi in $\\mathbb{R}$ che sono <strong>sia aperti sia chiusi</strong>:</p>
        <ul>
          <li><strong>$\\mathbb{R}$:</strong> è aperto perché ogni suo punto è interno (qualsiasi intorno è contenuto in $\\mathbb{R}$); è chiuso perché il suo complementare, l'insieme vuoto $\\emptyset$, è aperto.</li>
          <li><strong>$\\emptyset$:</strong> è aperto per definizione (la condizione "tutti i suoi punti sono interni" è vacuamente vera, non essendoci punti); è chiuso perché il suo complementare, $\\mathbb{R}$, è aperto.</li>
        </ul>
        <p>In $\\mathbb{R}$ questi sono gli unici due insiemi ad avere questa doppia proprietà. La dimostrazione di questo fatto (cioè la <em>connessione</em> della retta reale) verrà presentata nelle lezioni successive.</p>`

      {
        id: "s03-alert-frontiera",
        type: "alert_box",
        title: "Precisazione sui punti di frontiera",
        icon: "⚠️",
        content: `<p><strong>Un punto di frontiera di un insieme non deve necessariamente appartenere all'insieme stesso.</strong> Può trovarsi nell'insieme, ma può anche appartenere al suo complementare.</p>
        <p>Un <strong>punto interno</strong>, per definizione, <strong>deve</strong> appartenere all'insieme. Un punto di frontiera, invece, ha questa libertà.</p>
        <p>Esempio: consideriamo $A = (1,3)$. Il numero $3$ è punto di frontiera per $A$, poiché ogni suo intorno contiene sia punti di $A$ (numeri poco più piccoli di $3$) sia punti non in $A$ (numeri poco più grandi di $3$, e $3$ stesso). Tuttavia $3 \\notin A$. Allo stesso modo $1$ è punto di frontiera ma non appartiene ad $A$.</p>`
      },

      {
        id: "s03-maggioranti",
        type: "section",
        title: "Maggioranti, Minoranti e Insiemi Limitati",
        icon: "⬆️",
        content: `<p>Torniamo all'intervallo $A = (1,3)$. Che ruolo speciale gioca il numero $3$? È il più grande dei punti dell'insieme? No, perché $3$ non appartiene all'insieme. Tuttavia ha intuitivamente una relazione speciale con la "grandezza" degli elementi di $A$.</p>
        <p>Non è il più grande in assoluto: ci sono numeri come $4$, $5$ e infiniti altri più grandi di tutti gli elementi di $A$. Allora come descriviamo il ruolo di $3$? Una formulazione precisa è questa: <strong>$3$ è il più piccolo dei numeri che sono più grandi di tutti gli elementi dell'insieme.</strong> Questa idea porta a definire "maggiorante" e "minorante".</p>`,
        subsections: [
          {
            subtitle: "Maggiorante e minorante",
            content: `<p><strong>Maggiorante.</strong> Sia $A \\subseteq \\mathbb{R}$. Un elemento $k \\in \\mathbb{R}$ si dice <strong>maggiorante</strong> di $A$ se $k \\ge a$ per ogni $a \\in A$.</p>
            <p>Esempio: dato $A = [-1,3]$, il numero $4$ è un maggiorante, poiché $4 \\ge a$ per ogni $a \\in [-1,3]$. Anche $3.5$, $5$ e $100$ sono maggioranti. Lo stesso numero $3$ è un maggiorante.</p>
            <p><strong>Minorante.</strong> Sia $A \\subseteq \\mathbb{R}$. Un elemento $k \\in \\mathbb{R}$ si dice <strong>minorante</strong> di $A$ se $k \\le a$ per ogni $a \\in A$.</p>
            <p>Esempio: dato $A = [-1,3]$, il numero $-5$ è un minorante, poiché $-5 \\le a$ per ogni $a \\in [-1,3]$. Anche $-2$ e $-1$ sono minoranti.</p>`

            subtitle: "Insiemi limitati",
            content: `<p>Sia $A \\subseteq \\mathbb{R}$.</p>
            <ul>
              <li>$A$ si dice <strong>limitato superiormente</strong> se ammette almeno un maggiorante.</li>
              <li>$A$ si dice <strong>limitato inferiormente</strong> se ammette almeno un minorante.</li>
              <li>$A$ si dice <strong>limitato</strong> se è limitato sia superiormente che inferiormente.</li>
            </ul>
            <p>Esempi:</p>
            <ul>
              <li>$(-\\infty, 1)$ è limitato superiormente (ad esempio $1$ è un maggiorante) ma non inferiormente.</li>
              <li>$(13, +\\infty)$ è limitato inferiormente (ad esempio $13$ è un minorante) ma non superiormente.</li>
              <li>$[1, 16]$ è limitato, poiché ammette sia maggioranti (es. $16$) che minoranti (es. $1$).</li>
            </ul>`
          }

      {
        id: "s03-max-min",
        type: "section",
        title: "Massimo e Minimo di un Insieme",
        icon: "🏔️",
        content: `<p>Tra tutti i possibili maggioranti e minoranti, alcuni possono avere una proprietà speciale: <strong>appartenere all'insieme stesso</strong>.</p>
        <p><strong>Massimo.</strong> Sia $A \\subseteq \\mathbb{R}$. Un elemento $x_0 \\in A$ si dice <strong>massimo</strong> di $A$ se $x_0$ è un maggiorante di $A$. In altre parole, un massimo è un maggiorante che appartiene all'insieme. Si indica con $\\max A$.</p>
        <p><strong>Minimo.</strong> Sia $A \\subseteq \\mathbb{R}$. Un elemento $x_0 \\in A$ si dice <strong>minimo</strong> di $A$ se $x_0$ è un minorante di $A$. Si indica con $\\min A$.</p>`,
        subsections: [
          {
            subtitle: "Esempi",
            content: `<ul>
              <li>Sia $A = [1,3]$. Il numero $3$ è un maggiorante e $3 \\in A$, quindi $3 = \\max A$. Il numero $1$ è un minorante e $1 \\in A$, quindi $1 = \\min A$.</li>
              <li>Sia $B = (1,3]$. Il numero $3$ è il massimo. Il numero $1$ è un minorante, ma <strong>non</strong> è il minimo perché $1 \\notin B$. Questo insieme non ha minimo.</li>
            </ul>`
          },
          {
            subtitle: "Teorema — unicità del massimo e del minimo",
            content: `<p><strong>Enunciato.</strong> Se un insieme $A \\subseteq \\mathbb{R}$ ammette massimo, allora esso è unico. Analogamente, se ammette minimo, esso è unico.</p>
            <p><strong>Dimostrazione (per il massimo; per il minimo è analoga).</strong> Procediamo per assurdo. Supponiamo che $A$ ammetta due massimi distinti $M_1$ e $M_2$, con $M_1 \\neq M_2$. Per definizione di massimo:</p>
            <ol>
              <li>$M_1 \\in A$ ed $M_1$ è un maggiorante di $A$;</li>
              <li>$M_2 \\in A$ ed $M_2$ è un maggiorante di $A$.</li>
            </ol>
            <p>Poiché $M_1$ è un maggiorante di $A$ e $M_2 \\in A$, deve valere</p>
            <p>$$M_2 \\le M_1.$$</p>
            <p>Poiché $M_2$ è un maggiorante di $A$ e $M_1 \\in A$, deve valere</p>
            <p>$$M_1 \\le M_2.$$</p>
            <p>Mettendo insieme, $M_1 \\le M_2$ e $M_2 \\le M_1$: l'unica possibilità è $M_1 = M_2$, contro l'ipotesi $M_1 \\neq M_2$. Pertanto il massimo, se esiste, è unico. $\\blacksquare$</p>`

            content: `<p><strong>Estremo superiore (supremum).</strong> Sia $A \\subseteq \\mathbb{R}$ non vuoto e limitato superiormente. Si definisce $\\sup A$ il <strong>minimo dell'insieme dei maggioranti</strong> di $A$:</p>
            <p>$$\\sup A = \\min \\{ k \\in \\mathbb{R} \\mid k \\ge a, \\ \\forall a \\in A \\}$$</p>
            <p><strong>Estremo inferiore (infimum).</strong> Sia $A \\subseteq \\mathbb{R}$ non vuoto e limitato inferiormente. Si definisce $\\inf A$ il <strong>massimo dell'insieme dei minoranti</strong> di $A$:</p>
            <p>$$\\inf A = \\max \\{ k \\in \\mathbb{R} \\mid k \\le a, \\ \\forall a \\in A \\}$$</p>
            <p>La <strong>proprietà di completezza</strong> di $\\mathbb{R}$ garantisce che questi minimi e massimi esistano sempre, a patto che l'insieme sia non vuoto e limitato (superiormente per il sup, inferiormente per l'inf).</p>`

              <li>Se un insieme $A$ ha massimo, allora $\\sup A = \\max A$.</li>
              <li>Se un insieme $A$ ha minimo, allora $\\inf A = \\min A$.</li>
            </ul>
            <p>Se $A$ è non vuoto e limitato superiormente (rispettivamente inferiormente), il sup (rispettivamente l'inf) <strong>esiste anche quando il massimo (rispettivamente il minimo) non esiste</strong>.</p>`

            <ul>
              <li>L'elemento più grande è $1$. Poiché $1 \\in C$, esso è il massimo: $\\max C = \\sup C = 1$.</li>
              <li>L'insieme è limitato inferiormente ($0$ è un minorante). Gli elementi diventano sempre più piccoli e si "avvicinano" a $0$: il più grande dei minoranti è proprio $0$, quindi $\\inf C = 0$.</li>

            </ul>
            <p>Consideriamo ora un insieme finito, $A = \\{1, 4, 6, 8\\}$: si ha $\\max A = \\sup A = 8$ e $\\min A = \\inf A = 1$. Per gli insiemi finiti e non vuoti massimo e minimo esistono sempre.</p>`

              <li>$L$ è un maggiorante di $A$ (cioè $x \\le L$ per ogni $x \\in A$);</li>

      {
        id: "s03-es-teoria-1",
        type: "esercizio",
        title: "Teoria 1",
        kind: "teoria",
        source: "integrazione",
        content: `<p>Sia $x_0 \\in \\mathbb{R}$ e sia $R \\gt 0$. Dai la definizione di intorno $I_R(x_0)$ e dimostra che $I_R(x_0) = (x_0 - R,\\, x_0 + R)$. Determina poi centro e raggio dell'intorno che coincide con l'intervallo $(-4, 2)$.</p>`,
        solution: `<p><strong>Definizione.</strong> $I_R(x_0) = \\{ x \\in \\mathbb{R} \\mid |x - x_0| \\lt R \\}$, cioè l'insieme dei punti la cui distanza da $x_0$ è minore di $R$.</p>
        <p><strong>Dimostrazione dell'uguaglianza.</strong> Per la definizione di valore assoluto, $|x - x_0| \\lt R$ è equivalente alla doppia disuguaglianza</p>
        <p>$$-R \\lt x - x_0 \\lt R;$$</p>
        <p>sommando $x_0$ a tutti i membri si ottiene</p>
        <p>$$x_0 - R \\lt x \\lt x_0 + R,$$</p>
        <p>cioè $x \\in (x_0 - R,\\, x_0 + R)$. Poiché tutti i passaggi sono equivalenze, vale l'uguaglianza insiemistica $I_R(x_0) = (x_0 - R,\\, x_0 + R)$: un intorno è esattamente un intervallo aperto centrato in $x_0$ e di ampiezza $2R$.</p>
        <p><strong>Impostazione per $(-4,2)$.</strong> Cerchiamo $x_0$ e $R$ che risolvono il sistema</p>
        <p>$$\\begin{cases} x_0 - R = -4 \\\\ x_0 + R = 2 \\end{cases}$$</p>
        <p><strong>Calcolo.</strong> Sommando le due equazioni: $2x_0 = -2$, cioè $x_0 = -1$. Sottraendo la prima dalla seconda: $2R = 6$, cioè $R = 3$.</p>
        <p><strong>Conclusione.</strong> $(-4,2) = I_3(-1)$, in accordo con le formule generali</p>
        <p>$$x_0 = \\frac{-4+2}{2} = -1, \\qquad R = \\frac{2-(-4)}{2} = 3.$$</p>`
      },

      {
        id: "s03-es-teoria-2",
        type: "esercizio",
        title: "Teoria 2",
        kind: "teoria",
        source: "integrazione",
        content: `<p>Dare le definizioni di maggiorante di un insieme $A \\subseteq \\mathbb{R}$ e di massimo di $A$. Spiegare perché ogni massimo è un maggiorante ma non ogni maggiorante è un massimo, ed esibire un insieme non vuoto e limitato superiormente che non ammette massimo.</p>`,
        solution: `<p><strong>Definizioni.</strong> Sia $A \\subseteq \\mathbb{R}$. Un numero $k \\in \\mathbb{R}$ si dice <em>maggiorante</em> di $A$ se $k \\ge a$ per ogni $a \\in A$. Un elemento $x_0$ si dice <em>massimo</em> di $A$ se $x_0 \\in A$ e $x_0$ è un maggiorante di $A$, cioè $x_0 \\ge a$ per ogni $a \\in A$.</p>
        <p><strong>Ogni massimo è un maggiorante.</strong> Segue subito dalla definizione: il massimo è per definizione un maggiorante, con in più la richiesta di appartenere ad $A$.</p>
        <p><strong>Il viceversa è falso</strong> perché un maggiorante non deve necessariamente appartenere ad $A$.</p>
        <p><strong>Controesempio.</strong> Sia $A = (1,3)$. L'insieme dei maggioranti di $A$ è $[3, +\\infty)$, quindi $A$ è limitato superiormente. Ma $A$ non ha massimo: se fosse $x_0 = \\max A$, allora $x_0 \\in (1,3)$ e il numero</p>
        <p>$$y = \\frac{x_0 + 3}{2}$$</p>
        <p>soddisfa $x_0 \\lt y \\lt 3$, dunque $y \\in A$ e $y \\gt x_0$, contro il fatto che $x_0$ sia un maggiorante.</p>
        <p><strong>Conclusione.</strong> Si ha comunque $\\sup A = 3$, perché $3$ è il minimo dei maggioranti.</p>`
      },

      {
        id: "s03-es-teoria-3",
        type: "esercizio",
        title: "Teoria 3",
        kind: "teoria",
        source: "integrazione",
        content: `<p>Enuncia le definizioni di punto interno ad $A$ e di punto di frontiera per $A$, evidenziando i quantificatori, e dimostra che uno stesso punto non può essere contemporaneamente interno ad $A$ e di frontiera per $A$. Illustra poi le due nozioni su $A = [-1, 2)$.</p>`,
        solution: `<p><strong>Definizioni.</strong> $x_0 \\in A$ si dice <em>interno</em> ad $A$ se $\\exists R \\gt 0$ tale che $I_R(x_0) \\subseteq A$ (basta un solo raggio buono). $x_0 \\in \\mathbb{R}$ (che può appartenere o no ad $A$) si dice <em>di frontiera</em> per $A$ se $\\forall R \\gt 0$ si ha $I_R(x_0) \\cap A \\neq \\emptyset$ e $I_R(x_0) \\cap A^c \\neq \\emptyset$, dove $A^c = \\mathbb{R} \\setminus A$.</p>
        <p><strong>Incompatibilità.</strong> Se $x_0$ è interno, esiste $\\bar R \\gt 0$ con $I_{\\bar R}(x_0) \\subseteq A$; allora</p>
        <p>$$I_{\\bar R}(x_0) \\cap A^c = \\emptyset,$$</p>
        <p>perché un punto dell'intersezione starebbe sia in $A$ sia nel suo complementare. La condizione di frontiera richiede invece che l'intersezione col complementare sia non vuota per <em>ogni</em> raggio, in particolare per $R = \\bar R$: essa è quindi violata e $x_0$ non è di frontiera.</p>
        <p><strong>Illustrazione su $A = [-1,2)$.</strong></p>
        <p><em>Punto interno.</em> Il punto $0$ è interno, poiché con $R = 1/2$ si ha $I_{1/2}(0) = (-1/2, 1/2) \\subseteq [-1,2)$.</p>
        <p><em>Il punto $-1$ è di frontiera.</em> Per ogni $R \\gt 0$, $I_R(-1) = (-1-R,\\, -1+R)$ contiene $-1 \\in A$ e contiene punti minori di $-1$, che stanno in $A^c$.</p>
        <p><em>Il punto $2$ è di frontiera.</em> Fissato un qualunque $R \\gt 0$, poniamo</p>
        <p>$$y = 2 - \\frac{\\min\\{R, 2\\}}{2}.$$</p>
        <p>Allora $1 \\le y \\lt 2$, quindi $y \\in A$; inoltre $|y - 2| = \\frac{\\min\\{R,2\\}}{2} \\lt R$, quindi $y \\in I_R(2)$. Dunque $I_R(2) \\cap A \\neq \\emptyset$ per ogni $R$. D'altra parte $2 \\in I_R(2)$ e $2 \\notin A$, quindi $I_R(2) \\cap A^c \\neq \\emptyset$.</p>
        <p><strong>Conclusione.</strong> Si noti che $-1 \\in A$ mentre $2 \\notin A$: l'appartenenza ad $A$ è indipendente dall'essere di frontiera.</p>`
      },

      {
        id: "s03-es-teoria-4",
        type: "esercizio",
        title: "Teoria 4",
        kind: "teoria",
        source: "integrazione",
        content: `<p>Enunciare e dimostrare il teorema di unicità del massimo di un insieme $A \\subseteq \\mathbb{R}$.</p>`,
        solution: `<p><strong>Enunciato.</strong> Se $A \\subseteq \\mathbb{R}$ ammette massimo, allora tale massimo è unico.</p>
        <p><strong>Dimostrazione.</strong> Siano $M_1$ e $M_2$ due massimi di $A$. Per definizione $M_1 \\in A$ e $M_1 \\ge a$ per ogni $a \\in A$; analogamente $M_2 \\in A$ e $M_2 \\ge a$ per ogni $a \\in A$.</p>
        <p>Applicando la proprietà di maggiorante di $M_1$ all'elemento $a = M_2 \\in A$ si ottiene</p>
        <p>$$M_2 \\le M_1.$$</p>
        <p>Applicando la proprietà di maggiorante di $M_2$ all'elemento $a = M_1 \\in A$ si ottiene</p>
        <p>$$M_1 \\le M_2.$$</p>
        <p>Per l'antisimmetria della relazione $\\le$ in $\\mathbb{R}$ segue $M_1 = M_2$.</p>
        <p><strong>Conclusione.</strong> Il massimo, se esiste, è unico. La dimostrazione per il minimo è identica scambiando i versi delle disuguaglianze. Lo stesso argomento, applicato all'insieme dei maggioranti, prova l'unicità di $\\sup A$.</p>`
      },

      {
        id: "s03-es-scritto-1",
        type: "esercizio",
        title: "Scritto 1",
        kind: "scritto",
        source: "integrazione",
        content: `<p>Risolvi le disequazioni $|x - 3| \\lt 2$ e $|x + 1| \\le 4$. Scrivi l'insieme delle soluzioni come intervallo (e, quando possibile, come intorno $I_R(x_0)$), indica i punti di frontiera e stabilisci se l'insieme è aperto, chiuso o nessuno dei due.</p>`,
        solution: `<p><strong>Prima disequazione.</strong></p>
        <p>$$|x-3| \\lt 2 \\iff -2 \\lt x - 3 \\lt 2 \\iff 1 \\lt x \\lt 5,$$</p>
        <p>cioè $S_1 = (1,5) = I_2(3)$, intorno di centro $3$ e raggio $2$.</p>
        <p><em>Natura topologica.</em> Ogni suo punto è interno: se $x \\in (1,5)$, con</p>
        <p>$$R = \\frac{\\min\\{x-1,\\ 5-x\\}}{2} \\gt 0$$</p>
        <p>si ha $I_R(x) \\subseteq (1,5)$. Quindi $S_1$ è <strong>aperto</strong>; i suoi punti di frontiera sono $1$ e $5$, che non gli appartengono, dunque $S_1$ <strong>non è chiuso</strong>.</p>
        <p><strong>Seconda disequazione.</strong></p>
        <p>$$|x+1| \\le 4 \\iff -4 \\le x + 1 \\le 4 \\iff -5 \\le x \\le 3,$$</p>
        <p>cioè $S_2 = [-5, 3]$ (non è un intorno, perché gli intorni sono intervalli aperti).</p>
        <p><em>Frontiera.</em> I punti di frontiera sono $-5$ e $3$: per ogni $R \\gt 0$, $I_R(-5)$ contiene $-5 \\in S_2$ e punti minori di $-5$ che stanno in $S_2^c$; analogamente per $3$.</p>
        <p><em>Conclusione.</em> Poiché $-5, 3 \\in S_2$, l'insieme contiene tutta la sua frontiera: $S_2$ è <strong>chiuso</strong>. Non è aperto, perché $-5 \\in S_2$ non è interno (ogni suo intorno contiene punti minori di $-5$).</p>`
      },

      {
        id: "s03-es-scritto-2",
        type: "esercizio",
        title: "Scritto 2",
        kind: "scritto",
        source: "integrazione",
        content: `<p>Sia $A = (-2,5] \\cup \\{7\\}$. Stabilire se $A$ è limitato, determinare $\\sup A$, $\\inf A$ e dire se esistono $\\max A$ e $\\min A$, giustificando le risposte.</p>`,
        solution: `<p><strong>Limitatezza.</strong> Ogni $a \\in A$ soddisfa $-2 \\lt a \\le 7$, quindi $7$ è un maggiorante e $-2$ è un minorante: $A$ è limitato.</p>
        <p><strong>Massimo ed estremo superiore.</strong> Poiché $7 \\in A$ ed è un maggiorante, si ha $7 = \\max A$ e quindi $\\sup A = \\max A = 7$.</p>
        <p><strong>Estremo inferiore: verifica della caratterizzazione con $l = -2$.</strong></p>
        <p><em>(i) $-2$ è un minorante.</em> Per ogni $a \\in A$ vale $-2 \\le a$, anzi $-2 \\lt a$.</p>
        <p><em>(ii) Condizione con $\\varepsilon$.</em> Dato $\\varepsilon \\gt 0$ poniamo $\\delta = \\min\\{\\varepsilon, 1\\}$ e</p>
        <p>$$x = -2 + \\frac{\\delta}{2}.$$</p>
        <p>Allora</p>
        <p>$$-2 \\lt x \\le -\\frac{3}{2} \\lt 5 \\ \\Rightarrow \\ x \\in A,$$</p>
        <p>$$x = -2 + \\frac{\\delta}{2} \\lt -2 + \\varepsilon.$$</p>
        <p>Entrambe le condizioni valgono, quindi $\\inf A = -2$.</p>
        <p><strong>Minimo.</strong> Poiché $-2 \\notin A$, e il minimo — se esiste — coincide con l'inf, l'insieme $A$ <strong>non ha minimo</strong>.</p>`
      },

      {
        id: "s03-es-scritto-3",
        type: "esercizio",
        title: "Scritto 3",
        kind: "scritto",
        source: "integrazione",
        content: `<p>Sia $A = (-2, 0] \\cup \\{2\\}$. Determina l'insieme dei punti interni e l'insieme dei punti di frontiera di $A$, giustificando le risposte con la definizione di intorno, e stabilisci se $A$ è aperto, chiuso o nessuno dei due.</p>`,
        solution: `<p><strong>Punti interni.</strong> Se $x \\in (-2,0)$, posto</p>
        <p>$$R = \\frac{\\min\\{x+2,\\ -x\\}}{2} \\gt 0$$</p>
        <p>si ha $I_R(x) = (x-R,\\, x+R) \\subseteq (-2,0) \\subseteq A$: tutti i punti di $(-2,0)$ sono interni.</p>
        <p><em>Il punto $0$ non è interno.</em> Fissato un qualunque $R \\gt 0$, poniamo</p>
        <p>$$y = \\min\\left\\{\\frac{R}{2},\\, 1\\right\\}.$$</p>
        <p>Allora $0 \\lt y \\lt R$, quindi $y \\in I_R(0) = (-R, R)$; inoltre $y \\le 1 \\lt 2$ e $y \\gt 0$, quindi $y \\notin (-2,0]$ e $y \\neq 2$, cioè $y \\notin A$. Dunque nessun intorno di $0$ è contenuto in $A$.</p>
        <p><em>Il punto $2$ non è interno:</em> ogni $I_R(2)$ contiene punti diversi da $2$ e vicini a $2$ (ad esempio $2 + \\frac{\\min\\{R,1\\}}{2}$), che non appartengono ad $A$.</p>
        <p>Quindi l'insieme dei punti interni è $(-2, 0)$.</p>
        <p><strong>Punti di frontiera.</strong></p>
        <p><em>$x_0 = -2$:</em> ogni $I_R(-2)$ contiene punti di $A$ — ad esempio $-2 + \\frac{\\min\\{R,2\\}}{2} \\in (-2,0)$ — e contiene $-2 \\notin A$. Quindi $-2$ è di frontiera.</p>
        <p><em>$x_0 = 0$:</em> ogni $I_R(0)$ contiene $0 \\in A$ e contiene il punto $y = \\min\\{R/2, 1\\} \\notin A$ costruito sopra. Quindi $0$ è di frontiera.</p>
        <p><em>$x_0 = 2$:</em> ogni $I_R(2)$ contiene $2 \\in A$ e punti di $A^c$ (ad esempio $2 + \\frac{\\min\\{R,1\\}}{2}$). Quindi $2$ è di frontiera: è un <strong>punto isolato</strong> di $A$.</p>
        <p>Nessun altro punto è di frontiera: i punti di $(-2,0)$ sono interni, e ogni $x_0 \\notin [-2,0] \\cup \\{2\\}$ ha un intorno tutto contenuto in $A^c$. Quindi la frontiera è $\\{-2, 0, 2\\}$.</p>
        <p><strong>Conclusioni.</strong> $A$ <strong>non è aperto</strong>, perché $0 \\in A$ non è interno; $A$ <strong>non è chiuso</strong>, perché $-2$ è di frontiera ma $-2 \\notin A$.</p>`

        <p><strong>Limitatezza.</strong> Poiché $\\frac{1}{n} \\in (0,1]$ per $n \\ge 1$, si ha</p>
        <p>$$0 \\le 1 - \\frac{1}{n} \\lt 1 \\qquad \\text{per ogni } n \\ge 1:$$</p>

        <p><em>(ii) Condizione con $\\varepsilon$.</em> Sia $\\varepsilon \\gt 0$: cerchiamo $n$ con</p>
        <p>$$1 - \\frac{1}{n} \\gt 1 - \\varepsilon \\iff \\frac{1}{n} \\lt \\varepsilon \\iff n \\gt \\frac{1}{\\varepsilon}.$$</p>
        <p>Per la proprietà archimedea un tale $n \\in \\mathbb{N}$ esiste, e l'elemento corrispondente $x = 1 - \\frac{1}{n} \\in B$ soddisfa $x \\gt 1 - \\varepsilon$.</p>
        <p>Quindi $\\sup B = 1$.</p>
        <p><strong>Massimo.</strong> Si ha $1 \\notin B$ (sarebbe $\\frac{1}{n} = 0$, impossibile), perciò $B$ <strong>non ha massimo</strong>.</p>`
