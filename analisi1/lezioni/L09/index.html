        icon: "🧭",
        content: `<p>Il materiale è lungo e alcuni argomenti compaiono due volte, ma con scopi diversi. Conviene sapere fin da subito dove si trova cosa:</p>
        <ul>
          <li><strong>Prima parte (esponenziale e logaritmo)</strong> — materiale nuovo: definizioni, grafici, proprietà, segno.</li>
          <li><strong>Seconda parte (prima esposizione trigonometrica)</strong> — definizioni di seno, coseno, tangente, inverse e primo formulario.</li>
          <li><strong>Terza parte (approfondimento sulla circonferenza)</strong> — <em>riprende</em> le stesse definizioni ma le <em>dimostra</em>: distinzione codominio/immagine, dimostrazione che l'immagine è esattamente $[-1,1]$, interpretazione geometrica rigorosa della tangente.</li>
          <li><strong>Quarta parte (formulario completo)</strong> — <em>riprende</em> addizione, duplicazione e inverse con le derivazioni dettagliate e le <strong>condizioni di validità</strong>, e aggiunge formule parametriche e prostaferesi.</li>
        </ul>
        <p>Quando un paragrafo è un ripasso lo segnaliamo esplicitamente: la seconda volta che incontri un argomento, il contenuto nuovo sono le <strong>dimostrazioni</strong> e le <strong>condizioni di esistenza</strong>.</p>`

        type: "section",
        title: "La Funzione Esponenziale",
        icon: "📈",
        content: `<p>Riprendiamo lo studio delle funzioni elementari partendo dall'esponenziale.</p>
        <p><strong>Definizione (funzione esponenziale).</strong> Dato un numero reale $a \\gt 0$ con $a \\neq 1$, detto <strong>base</strong>, si definisce la funzione esponenziale</p>
        <p>$$f: \\mathbb{R} \\to \\mathbb{R}, \\qquad f(x) = a^x$$</p>
        <p>Il suo dominio è tutto $\\mathbb{R}$. L'immagine, come vedremo, è l'intervallo $(0, +\\infty)$.</p>`,
        subsections: [
          {
            subtitle: "Caso I: base maggiore di 1 ($a \\gt 1$)",
            content: `<p>Se $a \\gt 1$ la funzione $f(x)=a^x$ è <strong>strettamente crescente</strong> su tutto il dominio. La crescenza segue direttamente dalle proprietà delle potenze: per ogni $x,y \\in \\mathbb{R}$</p>
            <p>$$x \\lt y \\iff a^x \\lt a^y$$</p>
            <p>Questa proprietà garantisce anche che la funzione è <strong>iniettiva</strong>.</p>
            <p>Punti notevoli:</p>
            <ul>
              <li>Se $x = 0$ allora $f(0) = a^0 = 1$: il grafico passa sempre per $(0,1)$.</li>
              <li>La funzione è sempre positiva: l'equazione $a^x = 0$ non ha soluzioni, quindi il grafico sta sempre sopra l'asse delle $x$.</li>
            </ul>

            subtitle: "Caso II: base compresa tra 0 e 1 ($0 \\lt a \\lt 1$)",
            content: `<p>Se $0 \\lt a \\lt 1$ la funzione è <strong>strettamente decrescente</strong>: la disuguaglianza si inverte,</p>
            <p>$$x \\lt y \\iff a^x \\gt a^y$$</p>

        extra_content: `<blockquote><strong>Nota del Prof.</strong> — Perché escludiamo i casi $a \\lt 0$, $a = 0$ e $a = 1$?
        <ul>
          <li>Se $a \\lt 0$, la funzione non sarebbe definita per molti valori di $x$: per $x = 1/2$ avremmo $f(1/2) = \\sqrt{a}$, che non è un numero reale se $a$ è negativo. Il dominio diventerebbe molto complicato e discontinuo.</li>
          <li>Se $a = 0$, $f(x) = 0^x$ è definita solo per $x \\gt 0$ e vale sempre $0$: non è una funzione interessante.</li>
          <li>Se $a = 1$, $f(x) = 1^x = 1$ è costante, quindi non iniettiva: non potremmo definirne l'inversa.</li>
        </ul>
        Per questi motivi la base si restringe a $a \\in (0,1) \\cup (1,+\\infty)$.</blockquote>`
      },
      {
        id: "s09-logaritmo",
        type: "section",
        title: "La Funzione Logaritmica",
        icon: "🔁",
        content: `<p>L'esponenziale $f(x)=a^x$, con $a \\gt 0$ e $a \\neq 1$, è strettamente monotona e quindi iniettiva, e la sua immagine è $(0,+\\infty)$. Vista come $f : \\mathbb{R} \\to (0,+\\infty)$ è <strong>biiettiva</strong>: possiamo dunque definirne l'inversa.</p>
        <p><strong>Definizione (funzione logaritmica).</strong> L'inversa di $y = a^x$ si chiama <strong>funzione logaritmica</strong> in base $a$ e si scrive $x = \\log_a(y)$:</p>
        <p>$$f^{-1}: (0,+\\infty) \\to \\mathbb{R}, \\qquad f^{-1}(x) = \\log_a(x)$$</p>
        <p>Il dominio è $(0,+\\infty)$ e il codominio è $\\mathbb{R}$.</p>
        <p><strong>Teorema (identità fondamentali esponenziale–logaritmo).</strong> Sia $a \\gt 0$, $a \\neq 1$. Allora</p>
        <ul>
          <li>$a^{\\log_a(x)} = x$ per ogni $x \\in (0,+\\infty)$;</li>
          <li>$\\log_a(a^x) = x$ per ogni $x \\in \\mathbb{R}$.</li>
        </ul>
        <p>In altri termini $\\log_a$ e $a^{(\\cdot)}$ sono una inversa dell'altra: componendole, nell'ordine consentito dai domini, si ottiene l'identità.</p>
        <p><strong>Come leggere un logaritmo.</strong> $\\log_a(x)$ è, per definizione, «l'esponente da dare ad $a$ per ottenere $x$». Questa lettura permette di calcolare a mente molti valori: $\\log_2(8) = 3$ perché $2^3 = 8$, e $\\log_{1/3}(9) = -2$ perché $(1/3)^{-2} = 9$.</p>`,
        subsections: [
          {
            subtitle: "Monotonia e grafici",
            content: `<p>La monotonia del logaritmo è la stessa dell'esponenziale corrispondente.</p>
            <p><strong>Caso $a \\gt 1$</strong>: poiché $a^x$ è strettamente crescente, anche $\\log_a(x)$ è <strong>strettamente crescente</strong>. Il grafico si ottiene per simmetria rispetto alla bisettrice $y = x$ del grafico di $a^x$, e passa per $(1,0)$ perché $\\log_a(1) = 0$ (infatti $a^0 = 1$).</p>

          {
            subtitle: "Come leggere la simmetria rispetto a $y = x$",
            content: `<p>Nelle due figure precedenti la finestra parte da ascisse positive, perché il logaritmo è definito solo per $x \\gt 0$: per questo <strong>manca il ramo dell'esponenziale con ascissa negativa</strong>, mentre una parte del ramo di logaritmo che gli corrisponderebbe per simmetria è sì visibile, ma <em>priva della sua controparte</em> esponenziale. Le figure, quindi, non mostrano la simmetria «completa»: metà di ogni coppia di punti simmetrici cade fuori dalla finestra.</p>
            <p>La corrispondenza da tenere a mente è: il punto $(x_0, a^{x_0})$ del grafico dell'esponenziale si riflette nel punto $(a^{x_0}, x_0)$ del grafico del logaritmo. Dunque, se $x_0 \\lt 0$:</p>
            <ul>
              <li>l'<em>ordinata</em> del punto riflesso è $x_0$, quindi è <strong>negativa in entrambi i casi</strong>, qualunque sia la base $a$;</li>
              <li>la sua <em>ascissa</em> è $a^{x_0}$, e qui le due situazioni si distinguono: se $a \\gt 1$ si ha $a^{x_0} \\in (0,1)$, mentre se $0 \\lt a \\lt 1$ si ha $a^{x_0} \\gt 1$.</li>
            </ul>
            <p>In altre parole: per $a \\gt 1$ il tratto di logaritmo corrispondente alle ascisse negative dell'esponenziale è quello compreso fra $x = 0$ e $x = 1$; per $0 \\lt a \\lt 1$ è invece quello con $x \\gt 1$. In entrambi i casi è il tratto in cui il logaritmo assume valori negativi. La figura seguente, tracciata con la <em>stessa scala sui due assi</em> e con una finestra che include le ascisse negative, mostra la simmetria completa fra $y = 2^x$ e $y = \\log_2 x$ rispetto alla retta $y = x$.</p>

            <p>I due punti grigi evidenziati, $(-1,\\tfrac12)$ sull'esponenziale e $(\\tfrac12,-1)$ sul logaritmo, sono simmetrici rispetto alla bisettrice: è la stessa informazione letta «da due parti», cioè $2^{-1} = \\tfrac12$ e $\\log_2(\\tfrac12) = -1$. Si noti che l'ascissa negativa $x_0 = -1$ è diventata l'<em>ordinata</em> negativa del punto riflesso, mentre la sua ascissa $\\tfrac12$ cade in $(0,1)$ perché qui la base è $a = 2 \\gt 1$.</p>`
          },
          {
            subtitle: "Proprietà dei logaritmi",
            content: `<p><strong>Teorema.</strong> Sia $a \\gt 0$, $a \\neq 1$, e siano $x, y \\gt 0$. Valgono:</p>
            <ol>
              <li><strong>Logaritmo di un prodotto</strong>: $\\log_a(x \\cdot y) = \\log_a(x) + \\log_a(y)$;</li>
              <li><strong>Logaritmo di un quoziente</strong>: $\\log_a\\left(\\frac{x}{y}\\right) = \\log_a(x) - \\log_a(y)$;</li>
              <li><strong>Logaritmo di 1</strong>: $\\log_a(1) = 0$;</li>
              <li><strong>Logaritmo di una potenza</strong>: $\\log_a(x^{\\alpha}) = \\alpha \\cdot \\log_a(x)$ per ogni $\\alpha \\in \\mathbb{R}$;</li>
              <li><strong>Cambiamento di base</strong>: per ogni $c \\gt 0$, $c \\neq 1$, e ogni $b \\gt 0$, $\\log_a(b) = \\dfrac{\\log_c(b)}{\\log_c(a)}$.</li>
            </ol>
            <p><strong>Il logaritmo naturale.</strong> Si indica con $\\ln$ ed è il logaritmo in base $e \\approx 2{,}718$, cioè $\\ln(x) = \\log_e(x)$. Tutte le proprietà precedenti valgono anche per $\\ln$, con $a = e$. Sulle calcolatrici il tasto <code>log</code> indica di solito il logaritmo in base $10$ e il tasto <code>ln</code> quello in base $e$.</p>`
          },
          {
            subtitle: "Esempio: uso del cambiamento di base",
            content: `<p>Calcoliamo $\\log_8(32)$ riportandoci alla base 2, che è la base «naturale» per le potenze di 2:</p>
            <p>$$\\log_8(32) = \\frac{\\log_2(32)}{\\log_2(8)} = \\frac{5}{3},$$</p>
            <p>perché $32 = 2^5$ e $8 = 2^3$. Verifica: $8^{5/3} = (2^3)^{5/3} = 2^5 = 32$.</p>
            <p>Lo stesso meccanismo serve con la calcolatrice, che di solito ha solo $\\log_{10}$ e $\\ln$: scegliendo $c = e$,</p>
            <p>$$\\log_5(7) = \\frac{\\ln(7)}{\\ln(5)}.$$</p>
            <p>Il cambiamento di base, con $b = c$, fornisce anche l'utile relazione</p>
            <p>$$\\log_a(c) = \\frac{\\log_c(c)}{\\log_c(a)} = \\frac{1}{\\log_c(a)}.$$</p>`
          },
          {
            subtitle: "Studio del segno del logaritmo",
            content: `<p>Il segno dipende dalla base $a$ e dal valore dell'argomento $x$.</p>
            <p><strong>Caso $a \\gt 1$</strong> (funzione crescente, $\\log_a(1)=0$):</p>
            <ul>
              <li>$\\log_a(x) \\gt 0 \\iff x \\gt 1$</li>
              <li>$\\log_a(x) \\lt 0 \\iff 0 \\lt x \\lt 1$</li>
            </ul>
            <p><strong>Caso $0 \\lt a \\lt 1$</strong> (funzione decrescente, $\\log_a(1)=0$):</p>
            <ul>
              <li>$\\log_a(x) \\gt 0 \\iff 0 \\lt x \\lt 1$</li>
              <li>$\\log_a(x) \\lt 0 \\iff x \\gt 1$</li>
            </ul>
            <p><strong>Verifica con un esempio.</strong> Con $a = 2 \\gt 1$: $\\log_2(2) = 1 \\gt 0$, e infatti l'argomento è $2 \\gt 1$. Con $a = 1/2 \\lt 1$: $\\log_{1/2}(2) = -1 \\lt 0$, e infatti l'argomento è $2 \\gt 1$. I risultati sono coerenti con le regole del segno.</p>`
          }
        ],
        formulas: [
          { label: "Identità inverse", latex: "a^{\\log_a(x)} = x, \\qquad \\log_a(a^x) = x" },
          { label: "Prodotto", latex: "\\log_a(x \\cdot y) = \\log_a(x) + \\log_a(y)" },
          { label: "Quoziente", latex: "\\log_a\\left(\\frac{x}{y}\\right) = \\log_a(x) - \\log_a(y)" },
          { label: "Potenza", latex: "\\log_a(x^{\\alpha}) = \\alpha \\log_a(x)" },
          { label: "Cambiamento di base", latex: "\\log_a(b) = \\frac{\\log_c(b)}{\\log_c(a)}" }
        ]
      },
      {
        id: "s09-errore-log",
        type: "alert_box",
        title: "Errore comune: $\\log_a(x^\\alpha)$ non è $(\\log_a(x))^\\alpha$",
        icon: "⚠️",
        content: `<p>Attenzione a non confondere le due scritture. Per esempio:</p>
        <p>$$\\log_a(x^2) = 2\\log_a(x) \\qquad \\text{ma} \\qquad (\\log_a(x))^2 = \\log_a(x) \\cdot \\log_a(x)$$</p>
        <p>Le due espressioni sono <strong>diverse</strong>. Nel primo caso l'esponente sta <em>dentro</em> l'argomento e può essere portato davanti; nel secondo caso si eleva a potenza il <em>risultato</em> del logaritmo.</p>`
      },
      {
        id: "s09-circonferenza",
        type: "section",
        title: "Funzioni Trigonometriche: la circonferenza goniometrica",
        icon: "🔵",
        content: `<p>Le funzioni trigonometriche (o goniometriche) sono funzioni di un angolo. Consideriamo la <strong>circonferenza goniometrica</strong>, cioè la circonferenza di raggio 1 centrata nell'origine del piano cartesiano.</p>
        <p><strong>Definizione (misura in radianti di un angolo orientato).</strong> Fissiamo il punto $A = (1,0)$ sulla circonferenza goniometrica. Un numero reale $x$ si interpreta come la misura in <strong>radianti</strong> di un <strong>arco orientato</strong> che parte da $A$ e si avvolge sulla circonferenza:</p>
        <ul>
          <li>il valore assoluto $|x|$ è la <em>lunghezza</em> dell'arco percorso (per questo un giro completo misura $2\\pi$, cioè la lunghezza della circonferenza di raggio 1);</li>
          <li>il <em>segno</em> di $x$ indica il verso: $x \\gt 0$ corrisponde al verso <strong>antiorario</strong>, $x \\lt 0$ al verso <strong>orario</strong>;</li>
          <li>se $|x| \\gt 2\\pi$ l'arco compie più di un giro, e questo è perfettamente lecito: l'avvolgimento può continuare indefinitamente.</li>
        </ul>
        <p>Il punto $P$ associato a $x$ è il punto di arrivo di questo avvolgimento.</p>`,
        subsections: [
          {
            subtitle: "Perché serve l'orientazione",
            content: `<p>La sola coppia di estremi $A$ e $P$ non basta a determinare il numero reale $x$: una lunghezza geometrica è non negativa e non «ricorda» quante volte si è girato. Ad esempio il punto $P = (0,1)$ è raggiunto da</p>
            <p>$$x = \\frac{\\pi}{2}, \\qquad x = \\frac{\\pi}{2} + 2\\pi, \\qquad x = \\frac{\\pi}{2} - 2\\pi, \\quad \\dots$$</p>
            <p>In generale, $x$ e $x + 2k\\pi$ (con $k \\in \\mathbb{Z}$) individuano <strong>lo stesso punto</strong> $P$. È proprio questa ambiguità che rende seno e coseno funzioni definite su tutto $\\mathbb{R}$ ma <em>periodiche</em> di periodo $2\\pi$, e che impedisce di invertirle senza prima restringere il dominio.</p>
            <p>Nella figura seguente l'angolo $x$ è l'arco orientato da $A=(1,0)$ al punto $P$, con le due possibili direzioni di percorrenza.</p>

          },
          {
            subtitle: "Seno, coseno e tangente",
            content: `<p><strong>Definizione (seno e coseno).</strong> Dato $x \\in \\mathbb{R}$, il <strong>coseno</strong> $\\cos(x)$ e il <strong>seno</strong> $\\sin(x)$ sono rispettivamente l'ascissa e l'ordinata del punto $P$ sulla circonferenza goniometrica associato all'arco orientato di misura $x$:</p>
            <p>$$\\cos : \\mathbb{R} \\to [-1,1], \\qquad \\sin : \\mathbb{R} \\to [-1,1]$$</p>
            <p>Il dominio di entrambe è $\\mathbb{R}$, l'immagine è l'intervallo $[-1,1]$.</p>
            <p><strong>Periodicità.</strong> Seno e coseno sono <strong>periodici</strong> di periodo $T = 2\\pi$:</p>
            <p>$$\\cos(x + 2\\pi) = \\cos(x), \\qquad \\sin(x + 2\\pi) = \\sin(x) \\quad \\forall x \\in \\mathbb{R}$$</p>
            <p>La ragione è immediata: $x$ e $x + 2\\pi$ individuano lo stesso punto $P$, quindi hanno la stessa ascissa e la stessa ordinata.</p>
            <p><strong>Definizione (tangente).</strong> La <strong>tangente</strong> è il rapporto fra seno e coseno:</p>
            <p>$$\\tan(x) = \\frac{\\sin(x)}{\\cos(x)}$$</p>
            <p>Il dominio esclude i punti in cui il coseno si annulla:</p>
            <p>$$\\mathrm{Dom}(\\tan) = \\mathbb{R} \\setminus \\left\\{ \\frac{\\pi}{2} + k\\pi,\\ k \\in \\mathbb{Z} \\right\\}$$</p>`
          },
          {
            subtitle: "Periodicità della tangente: due argomenti",
            content: `<p>La tangente è periodica di periodo $T = \\pi$. Lo si vede in due modi.</p>
            <p><strong>(a) Via geometrica.</strong> Aggiungere $\\pi$ all'angolo significa percorrere mezzo giro: il punto $P$ si trasforma nel punto <em>diametralmente opposto</em> $-P$. Entrambe le coordinate cambiano segno, dunque</p>
            <p>$$\\cos(x+\\pi) = -\\cos(x), \\qquad \\sin(x+\\pi) = -\\sin(x),$$</p>
            <p>e nel rapporto i due segni meno si elidono:</p>
            <p>$$\\tan(x+\\pi) = \\frac{-\\sin(x)}{-\\cos(x)} = \\tan(x).$$</p>
            <p><strong>(b) Via formule di addizione.</strong> Lo stesso risultato segue dalle formule di addizione (enunciate più avanti), con $a = x$ e $b = \\pi$, usando $\\cos(\\pi) = -1$ e $\\sin(\\pi) = 0$:</p>
            <p>$$\\tan(x+\\pi) = \\frac{\\sin(x)\\cos(\\pi) + \\cos(x)\\sin(\\pi)}{\\cos(x)\\cos(\\pi) - \\sin(x)\\sin(\\pi)} = \\frac{-\\sin(x)}{-\\cos(x)} = \\tan(x).$$</p>
            <p>L'uguaglianza vale per ogni $x$ del dominio della tangente.</p>`
          }
        ],
        formulas: [
          { label: "Punto sulla circonferenza", latex: "P = (\\cos x,\\ \\sin x)" },
          { label: "Periodo di seno e coseno", latex: "\\sin(x+2k\\pi) = \\sin(x), \\quad \\cos(x+2k\\pi) = \\cos(x)" },
          { label: "Periodo della tangente", latex: "\\tan(x+\\pi) = \\tan(x)" }
        ]

        id: "s09-grafici-parita",

        title: "Grafici di seno, coseno e tangente. Parità",
        icon: "〰️",
        content: `<p>Il grafico del <strong>seno</strong> parte da $0$ in $x=0$, sale al massimo $1$ in $x=\\frac{\\pi}{2}$, torna a $0$ in $x=\\pi$, scende al minimo $-1$ in $x=\\frac{3\\pi}{2}$ e torna a $0$ in $x=2\\pi$.</p>

        subsections: [
          {
            subtitle: "Parità e disparità",
            content: `<ul>
              <li>Il <strong>coseno è pari</strong>: $\\cos(-x) = \\cos(x)$. Il suo grafico è simmetrico rispetto all'asse $y$.</li>
              <li>Il <strong>seno è dispari</strong>: $\\sin(-x) = -\\sin(x)$. Il suo grafico è simmetrico rispetto all'origine.</li>
              <li>La <strong>tangente è dispari</strong>: $\\tan(-x) = \\dfrac{\\sin(-x)}{\\cos(-x)} = \\dfrac{-\\sin(x)}{\\cos(x)} = -\\tan(x)$.</li>
            </ul>
            <p>Anche queste proprietà si leggono sulla circonferenza: percorrere l'arco in verso orario invece che antiorario (cioè passare da $x$ a $-x$) significa riflettere il punto $P$ rispetto all'asse delle ascisse, operazione che lascia invariata l'ascissa (il coseno) e cambia segno all'ordinata (il seno).</p>`
          }
        ]
      },
      {
        id: "s09-addizione",
        type: "section",
        title: "Formule di Addizione e Sottrazione",
        icon: "➕",
        content: `<p><strong>Teorema.</strong> Per ogni $a, b \\in \\mathbb{R}$ valgono</p>
        <p>$$\\cos(a \\pm b) = \\cos(a)\\cos(b) \\mp \\sin(a)\\sin(b)$$</p>
        <p>$$\\sin(a \\pm b) = \\sin(a)\\cos(b) \\pm \\cos(a)\\sin(b)$$</p>
        <p>Si presti attenzione ai segni: nella formula del coseno il segno al secondo membro è <em>opposto</em> a quello del primo membro, in quella del seno è lo <em>stesso</em>. Queste identità valgono per <em>ogni</em> coppia di reali, senza condizioni aggiuntive: seno e coseno sono definiti su tutto $\\mathbb{R}$.</p>`,
        subsections: [
          {
            subtitle: "Esempio: calcolo di $\\sin\\left(\\frac{\\pi}{12}\\right)$",
            content: `<p>L'angolo $\\frac{\\pi}{12}$ (cioè $15^\\circ$) non è fra quelli notevoli, ma si scrive come <em>differenza</em> di due angoli notevoli:</p>
            <p>$$\\frac{\\pi}{12} = \\frac{\\pi}{3} - \\frac{\\pi}{4}.$$</p>
            <p>Applichiamo $\\sin(a-b) = \\sin(a)\\cos(b) - \\cos(a)\\sin(b)$ con $a = \\frac{\\pi}{3}$, $b = \\frac{\\pi}{4}$, sostituendo i valori notevoli $\\sin\\!\\left(\\frac{\\pi}{3}\\right) = \\frac{\\sqrt{3}}{2}$, $\\cos\\!\\left(\\frac{\\pi}{3}\\right) = \\frac{1}{2}$, $\\sin\\!\\left(\\frac{\\pi}{4}\\right) = \\cos\\!\\left(\\frac{\\pi}{4}\\right) = \\frac{\\sqrt{2}}{2}$:</p>
            <p>$$\\sin\\!\\left(\\frac{\\pi}{12}\\right) = \\frac{\\sqrt{3}}{2}\\cdot\\frac{\\sqrt{2}}{2} - \\frac{1}{2}\\cdot\\frac{\\sqrt{2}}{2} = \\frac{\\sqrt{6}}{4} - \\frac{\\sqrt{2}}{4} = \\frac{\\sqrt{6} - \\sqrt{2}}{4}.$$</p>
            <p>Numericamente $\\frac{\\sqrt{6}-\\sqrt{2}}{4} \\approx \\frac{2{,}449 - 1{,}414}{4} \\approx 0{,}259$: positivo e piccolo, coerente col fatto che $\\frac{\\pi}{12}$ è un angolo del primo quadrante vicino a $0$.</p>
            <p>Si osservi dove agiscono i segni: nella formula del seno il segno del secondo membro è lo <em>stesso</em> del primo (qui un meno). Con il coseno, invece, il segno si <em>inverte</em>:</p>
            <p>$$\\cos\\!\\left(\\frac{\\pi}{12}\\right) = \\cos\\!\\left(\\frac{\\pi}{3}\\right)\\cos\\!\\left(\\frac{\\pi}{4}\\right) + \\sin\\!\\left(\\frac{\\pi}{3}\\right)\\sin\\!\\left(\\frac{\\pi}{4}\\right) = \\frac{\\sqrt{2}}{4} + \\frac{\\sqrt{6}}{4} = \\frac{\\sqrt{6} + \\sqrt{2}}{4}.$$</p>`
          }
        ],
        formulas: [
          { label: "Coseno della somma/differenza", latex: "\\cos(a \\pm b) = \\cos a \\cos b \\mp \\sin a \\sin b" },
          { label: "Seno della somma/differenza", latex: "\\sin(a \\pm b) = \\sin a \\cos b \\pm \\cos a \\sin b" }
        ],
        quote: {
          text: "Attenzione ai segni! Il coseno si comporta in modo controintuitivo: quando si ha la somma di angoli, nella formula compare il segno meno, e viceversa. Il seno, invece, mantiene il segno.",
          src: "Nota del Prof."
        }
      },
      {
        id: "s09-inverse",
        type: "section",
        title: "Funzioni Trigonometriche Inverse",
        icon: "↩️",
        content: `<p>Le funzioni trigonometriche sono periodiche, quindi non sono iniettive sul loro dominio naturale: lo stesso valore viene assunto infinite volte. Per definirne le inverse dobbiamo restringere il dominio a un intervallo in cui la funzione sia <strong>strettamente monotona</strong>, e prendere come codominio la sua immagine.</p>`,
        subsections: [
          {
            subtitle: "Arcoseno",
            content: `<p>$f(x) = \\sin(x)$ è strettamente crescente su $\\left[-\\frac{\\pi}{2}, \\frac{\\pi}{2}\\right]$, dove la sua immagine è $[-1,1]$: la restrizione è biiettiva e ammette inversa.</p>
            <p><strong>Definizione.</strong> L'<strong>arcoseno</strong> è l'inversa di questa restrizione:</p>
            <p>$$\\arcsin: [-1,1] \\to \\left[-\\frac{\\pi}{2}, \\frac{\\pi}{2}\\right]$$</p>
            <p>Per $t \\in [-1,1]$, $\\arcsin(t)$ è l'<em>unico</em> angolo di $\\left[-\\frac{\\pi}{2}, \\frac{\\pi}{2}\\right]$ il cui seno vale $t$. La funzione è strettamente crescente e dispari.</p>

          {
            subtitle: "Arcotangente",
            content: `<p>$f(x) = \\tan(x)$ è strettamente crescente su $\\left(-\\frac{\\pi}{2}, \\frac{\\pi}{2}\\right)$, dove la sua immagine è tutto $\\mathbb{R}$.</p>
            <p><strong>Definizione.</strong> L'<strong>arcotangente</strong> è l'inversa di questa restrizione:</p>
            <p>$$\\arctan: \\mathbb{R} \\to \\left(-\\frac{\\pi}{2}, \\frac{\\pi}{2}\\right)$$</p>
            <p>Il dominio è tutto $\\mathbb{R}$, l'insieme dei valori è l'intervallo <em>aperto</em> $\\left(-\\frac{\\pi}{2}, \\frac{\\pi}{2}\\right)$: i valori $\\pm\\frac{\\pi}{2}$ non vengono mai raggiunti e le rette $y = \\pm\\frac{\\pi}{2}$ sono asintoti orizzontali. La funzione è strettamente crescente e dispari; inoltre $\\arctan(x) \\ge 0$ se e solo se $x \\ge 0$.</p>

      {
        id: "s09-int-composizioni",
        type: "integrazione_box",
        title: "Integrazione — non detto dal docente",
        icon: "🧩",
        content: `<p><strong>Esempio illustrativo: comporre una funzione trigonometrica con la sua inversa.</strong></p>
        <p>Il punto delicato nell'uso delle inverse trigonometriche è che le due composizioni possibili <em>non</em> si comportano allo stesso modo.</p>
        <p><strong>(1) Composizione «facile».</strong> Per ogni $t \\in [-1,1]$ si ha</p>
        <p>$$\\sin(\\arcsin(t)) = t.$$</p>
        <p>Infatti $\\arcsin(t)$ è per definizione un angolo il cui seno vale $t$. Ad esempio $\\sin(\\arcsin(0{,}3)) = 0{,}3$. (Se $t \\notin [-1,1]$ l'espressione non ha senso: $\\arcsin(2)$ non è definito.)</p>
        <p><strong>(2) Composizione «da sorvegliare».</strong> L'uguaglianza $\\arcsin(\\sin(x)) = x$ vale <strong>solo</strong> se $x \\in \\left[-\\frac{\\pi}{2}, \\frac{\\pi}{2}\\right]$, perché il risultato di $\\arcsin$ cade sempre in quell'intervallo. Se $x$ sta fuori, il risultato è l'unico angolo di $\\left[-\\frac{\\pi}{2}, \\frac{\\pi}{2}\\right]$ con lo stesso seno di $x$. Con $x = \\frac{3\\pi}{4}$:</p>
        <p>$$\\sin\\!\\left(\\frac{3\\pi}{4}\\right) = \\frac{\\sqrt{2}}{2}, \\qquad \\arcsin\\!\\left(\\frac{\\sqrt{2}}{2}\\right) = \\frac{\\pi}{4},$$</p>
        <p>dunque $\\arcsin\\!\\left(\\sin\\frac{3\\pi}{4}\\right) = \\frac{\\pi}{4} \\neq \\frac{3\\pi}{4}$. Il motivo geometrico è che $\\frac{\\pi}{4}$ e $\\frac{3\\pi}{4}$ hanno la stessa ordinata sulla circonferenza (sono simmetrici rispetto all'asse $y$), ma solo $\\frac{\\pi}{4}$ sta nell'intervallo in cui il seno è stato invertito.</p>
        <p><strong>(3) Caso analogo con l'arcotangente.</strong> Per ogni $t \\in \\mathbb{R}$ si ha $\\tan(\\arctan(t)) = t$, mentre</p>
        <p>$$\\arctan\\!\\left(\\tan\\frac{3\\pi}{4}\\right) = \\arctan(-1) = -\\frac{\\pi}{4} \\neq \\frac{3\\pi}{4},$$</p>
        <p>coerentemente col fatto che $\\arctan$ restituisce valori in $\\left(-\\frac{\\pi}{2}, \\frac{\\pi}{2}\\right)$ e che la tangente ha periodo $\\pi$ (qui $-\\frac{\\pi}{4} = \\frac{3\\pi}{4} - \\pi$).</p>
        <p><strong>Regola operativa:</strong> prima di scrivere $\\arcsin(\\sin(x)) = x$ (o l'analoga per coseno e tangente), controllare sempre che $x$ appartenga all'intervallo di restrizione; altrimenti riportarvi $x$ usando periodicità e simmetrie.</p>`
      },
      {
        id: "s09-formule-notevoli",
        type: "section",
        title: "Formule Trigonometriche Notevoli",
        icon: "🧮",
        content: `<p><strong>Teorema (identità trigonometrica fondamentale).</strong> Per ogni $x \\in \\mathbb{R}$ vale</p>
        <p>$$\\cos^2(x) + \\sin^2(x) = 1.$$</p>
        <p><strong>Lettura geometrica.</strong> L'identità esprime semplicemente il fatto che il punto $P = (\\cos x, \\sin x)$ sta su una circonferenza di raggio 1: la sua distanza dall'origine, calcolata col teorema di Pitagora, è $\\sqrt{\\cos^2(x)+\\sin^2(x)}$ e deve valere $1$. Da qui si ricava anche $|\\cos(x)| \\le 1$ e $|\\sin(x)| \\le 1$, cioè che l'immagine di seno e coseno è contenuta in $[-1,1]$.</p>`,
        subsections: [
          {
            subtitle: "Formule di duplicazione",
            content: `<p>Per ogni $x \\in \\mathbb{R}$:</p>
            <p>$$\\cos(2x) = \\cos^2(x) - \\sin^2(x) = 1 - 2\\sin^2(x) = 2\\cos^2(x) - 1$$</p>
            <p>$$\\sin(2x) = 2\\sin(x)\\cos(x)$$</p>
            <p>Inoltre, <strong>a condizione che</strong> $\\cos(x) \\neq 0$ (perché deve esistere $\\tan(x)$) <strong>e</strong> $\\cos(2x) \\neq 0$, cioè $\\tan^2(x) \\neq 1$ (perché il denominatore non si annulli), vale</p>
            <p>$$\\tan(2x) = \\frac{2\\tan(x)}{1 - \\tan^2(x)}.$$</p>`
          },
          {
            subtitle: "Formule di riduzione di potenza (o bisezione)",
            content: `<p>Per ogni $x \\in \\mathbb{R}$:</p>
            <p>$$\\cos^2(x) = \\frac{1 + \\cos(2x)}{2}, \\qquad \\sin^2(x) = \\frac{1 - \\cos(2x)}{2}$$</p>
            <p>Inoltre, <strong>se</strong> $\\cos(x) \\neq 0$ (condizione equivalente a $1 + \\cos(2x) \\neq 0$, così che il denominatore non si annulli e $\\tan(x)$ sia definita):</p>
            <p>$$\\tan^2(x) = \\frac{1 - \\cos(2x)}{1 + \\cos(2x)}.$$</p>
            <p>Le prime due si ottengono isolando $\\cos^2(x)$ in $\\cos(2x) = 2\\cos^2(x)-1$ e $\\sin^2(x)$ in $\\cos(2x) = 1-2\\sin^2(x)$. La terza è il loro rapporto, lecito esattamente quando il denominatore $1+\\cos(2x) = 2\\cos^2(x)$ è non nullo, cioè quando $\\cos(x) \\neq 0$.</p>`
          }
        ],
        formulas: [
          { label: "Identità fondamentale", latex: "\\cos^2 x + \\sin^2 x = 1" },
          { label: "Duplicazione del seno", latex: "\\sin(2x) = 2\\sin x \\cos x" },
          { label: "Duplicazione del coseno", latex: "\\cos(2x) = 2\\cos^2 x - 1 = 1 - 2\\sin^2 x" },
          { label: "Riduzione di potenza", latex: "\\sin^2 x = \\frac{1-\\cos 2x}{2}, \\qquad \\cos^2 x = \\frac{1+\\cos 2x}{2}" }
        ]
      },
      {
        id: "s09-alert-tan2x",
        type: "alert_box",
        title: "Attenzione alle condizioni di validità di $\\tan(2x)$",
        icon: "🚨",
        content: `<p>La formula per $\\tan(2x)$ <strong>non</strong> è un'identità valida «sempre»: il membro destro può perdere senso anche quando il membro sinistro esiste. Due esempi tipici:</p>
        <ul>
          <li>$x = \\frac{\\pi}{2}$: il primo membro $\\tan(\\pi) = 0$ esiste, ma il secondo membro non è definito perché $\\tan\\!\\left(\\frac{\\pi}{2}\\right)$ non esiste ($\\cos(x) = 0$);</li>
          <li>$x = \\frac{\\pi}{4}$: qui $\\tan(x) = 1$, quindi il denominatore $1-\\tan^2(x)$ si annulla; coerentemente $\\cos(2x) = \\cos\\!\\left(\\frac{\\pi}{2}\\right) = 0$ e $\\tan(2x)$ non esiste.</li>
        </ul>
        <p>Riassumendo: la formula va usata solo per $x$ tale che $\\cos(x) \\neq 0$ e $\\cos(2x) \\neq 0$.</p>`
      },
      {
        id: "s09-int-riduzione",
        type: "integrazione_box",
        title: "Integrazione — non detto dal docente",
        icon: "🧩",
        content: `<p><strong>Esempio illustrativo: usare la riduzione di potenza.</strong></p>
        <p><strong>(1) Riscrivere una potenza come espressione di primo grado.</strong> L'uso tipico di queste formule è eliminare il quadrato, sostituendo $\\sin^2$ o $\\cos^2$ con un coseno di argomento doppio:</p>
        <p>$$\\sin^2(x) = \\frac{1 - \\cos(2x)}{2} = \\frac{1}{2} - \\frac{1}{2}\\cos(2x).$$</p>
        <p>Il vantaggio è evidente: a destra non c'è più nessuna potenza, ma solo una costante e un coseno. Questo è il motivo per cui la formula si chiama «di riduzione di potenza».</p>
        <p>Allo stesso modo si tratta una potenza quarta, applicando la formula due volte:</p>
        <p>$$\\sin^4(x) = \\left(\\sin^2(x)\\right)^2 = \\left(\\frac{1-\\cos(2x)}{2}\\right)^2 = \\frac{1 - 2\\cos(2x) + \\cos^2(2x)}{4},$$</p>
        <p>e ora si riduce $\\cos^2(2x)$ ponendo $t = 2x$ nella prima formula, cioè $\\cos^2(t) = \\frac{1+\\cos(2t)}{2}$, da cui $\\cos^2(2x) = \\frac{1+\\cos(4x)}{2}$. Sostituendo:</p>
        <p>$$\\sin^4(x) = \\frac{1}{4}\\left(1 - 2\\cos(2x) + \\frac{1+\\cos(4x)}{2}\\right) = \\frac{3}{8} - \\frac{1}{2}\\cos(2x) + \\frac{1}{8}\\cos(4x).$$</p>
        <p>Si noti la <em>sostituzione</em> chiave: la formula è valida per ogni argomento, quindi si può applicare con $x$ sostituito da $2x$.</p>
        <p><strong>(2) Un calcolo numerico.</strong> Troviamo $\\sin^2\\!\\left(\\frac{\\pi}{8}\\right)$: qui l'argomento doppio è $2\\cdot\\frac{\\pi}{8} = \\frac{\\pi}{4}$, un angolo notevole.</p>
        <p>$$\\sin^2\\!\\left(\\frac{\\pi}{8}\\right) = \\frac{1 - \\cos\\!\\left(\\frac{\\pi}{4}\\right)}{2} = \\frac{1 - \\frac{\\sqrt{2}}{2}}{2} = \\frac{2 - \\sqrt{2}}{4}.$$</p>
        <p>Poiché $\\frac{\\pi}{8}$ sta nel primo quadrante, dove il seno è positivo, possiamo estrarre la radice:</p>
        <p>$$\\sin\\!\\left(\\frac{\\pi}{8}\\right) = \\frac{\\sqrt{2-\\sqrt{2}}}{2} \\approx 0{,}383.$$</p>
        <p><strong>Attenzione al segno:</strong> la formula fornisce il <em>quadrato</em> del seno, quindi il segno della radice va deciso guardando in quale quadrante si trova l'angolo. Per $\\sin\\!\\left(\\frac{9\\pi}{8}\\right)$ — stesso quadrato, perché $\\cos\\!\\left(\\frac{9\\pi}{4}\\right) = \\cos\\!\\left(\\frac{\\pi}{4}\\right)$ — avremmo dovuto prendere il segno meno, poiché $\\frac{9\\pi}{8}$ sta nel terzo quadrante.</p>`
      },

        id: "s09-approfondimento-circonferenza",

        title: "Approfondimento — Dominio, immagine e periodicità: le dimostrazioni",
        icon: "🔍",
        content: `<p><em>Questa sezione riprende le definizioni già date sulla circonferenza goniometrica; il contenuto nuovo sono le dimostrazioni e la distinzione fra codominio e immagine.</em></p>
        <p><strong>Definizione (circonferenza goniometrica).</strong> È la circonferenza di centro l'origine e raggio unitario, di equazione $x^2 + y^2 = 1$, cioè</p>
        <p>$$C = \\{ (x,y) \\in \\mathbb{R}^2 \\mid x^2 + y^2 = 1 \\}.$$</p>
        <p>Un punto $P$ che si muove su $C$ è individuato da un angolo $x$, e le sue coordinate cartesiane sono per definizione $P = (\\cos(x), \\sin(x))$: $\\cos(x)$ è l'ascissa, $\\sin(x)$ l'ordinata.</p>
        <p>L'angolo $x$ è misurato in <strong>radianti</strong>: è la <em>lunghezza orientata</em> dell'arco percorso a partire da $A = (1,0)$ fino a $P$, con segno $+$ se il verso è antiorario e $-$ se è orario; il percorso può comprendere uno o più giri completi, che vengono contati nel valore di $x$. La lunghezza effettiva del cammino, non negativa per sua natura, è $|x|$.</p>

        <p>Nella figura si leggono il raggio unitario, l'arco orientato da $A$ a $P$, e le due proiezioni che danno coseno (sull'asse delle ascisse) e seno (in verticale).</p>
        <p><strong>Non confondere</strong> il numero $x$ con il solo arco $\\widehat{AP}$ individuato dagli estremi: $x = \\frac{\\pi}{3}$ e $x = \\frac{\\pi}{3} + 2\\pi$ corrispondono allo stesso punto $P$ e allo stesso arco «geometrico», ma a percorsi di lunghezza diversa (il secondo compie un giro in più). Analogamente $x = -\\frac{\\pi}{3}$ descrive un percorso di lunghezza $\\frac{\\pi}{3}$ in senso orario. Segno e giri sono informazioni contenute in $x$, non nel disegno dell'arco.</p>
        <p>Poiché la lunghezza dell'intera circonferenza è $2\\pi R = 2\\pi$ (essendo $R=1$), valgono le corrispondenze: angolo giro $360^\\circ \\to 2\\pi$, angolo piatto $180^\\circ \\to \\pi$, angolo retto $90^\\circ \\to \\frac{\\pi}{2}$ radianti.</p>`,
        subsections: [
          {
            subtitle: "Codominio e immagine non sono la stessa cosa",
            content: `<p>Quando scriviamo $f: A \\to B$, l'insieme $B$ è il <strong>codominio</strong>, cioè l'insieme di arrivo che <em>scegliamo</em> per comodità: deve soltanto contenere tutti i valori assunti dalla funzione. L'<strong>immagine</strong> $f(A) = \\{ f(x) \\mid x \\in A \\}$ è invece l'insieme dei valori <em>effettivamente raggiunti</em>, ed è determinata dalla funzione, non dalla nostra scelta.</p>
            <p>Si ha sempre $f(A) \\subseteq B$, ma l'uguaglianza $f(A) = B$ non è automatica: vale solo se la funzione è surgettiva sul codominio scelto. Ad esempio $\\cos: \\mathbb{R} \\to \\mathbb{R}$ è una scrittura perfettamente lecita, ma in questo caso il codominio $\\mathbb{R}$ è molto più grande dell'immagine.</p>`
          },
          {
            subtitle: "Proposizione: dominio e immagine di seno e coseno",
            content: `<p>Le funzioni seno e coseno sono definite su tutto $\\mathbb{R}$ e la loro immagine è esattamente $[-1,1]$:</p>
            <p>$$\\mathrm{Dom}(\\cos) = \\mathrm{Dom}(\\sin) = \\mathbb{R}, \\qquad \\cos(\\mathbb{R}) = \\sin(\\mathbb{R}) = [-1,1].$$</p>
            <p>Scegliendo come codominio proprio l'immagine, $\\cos: \\mathbb{R} \\to [-1,1]$ e $\\sin: \\mathbb{R} \\to [-1,1]$ sono surgettive.</p>
            <p><strong>Dimostrazione.</strong></p>
            <p><em>Dominio.</em> Per ogni $x \\in \\mathbb{R}$ possiamo percorrere sulla circonferenza, a partire da $A=(1,0)$, un cammino orientato di lunghezza $|x|$ nel verso indicato dal segno di $x$: questo individua un unico punto $P$, le cui coordinate sono per definizione $(\\cos x, \\sin x)$. Dunque entrambe le funzioni sono definite su tutto $\\mathbb{R}$.</p>
            <p><em>L'immagine è contenuta in $[-1,1]$.</em> Se $P = (\\cos x, \\sin x)$ sta sulla circonferenza, allora $\\cos^2(x) + \\sin^2(x) = 1$, da cui $\\cos^2(x) \\le 1$ e $\\sin^2(x) \\le 1$, cioè $-1 \\le \\cos(x) \\le 1$ e $-1 \\le \\sin(x) \\le 1$. Questo prova <strong>soltanto</strong> l'inclusione $\\cos(\\mathbb{R}) \\subseteq [-1,1]$ e $\\sin(\\mathbb{R}) \\subseteq [-1,1]$.</p>
            <p><em>Ogni valore di $[-1,1]$ viene raggiunto.</em> Sia $c \\in [-1,1]$ e poniamo $s = \\sqrt{1-c^2}$, ben definito perché $1-c^2 \\ge 0$. Allora</p>
            <p>$$c^2 + s^2 = c^2 + (1-c^2) = 1,$$</p>
            <p>quindi $Q = (c,s)$ appartiene alla circonferenza goniometrica. Dato che $P(x)$ percorre <em>tutta</em> la circonferenza al variare di $x$ in $[0,2\\pi]$, esiste $x_0$ con $P(x_0) = Q$; la sua ascissa è $\\cos(x_0) = c$. Dunque $[-1,1] \\subseteq \\cos(\\mathbb{R})$. Allo stesso modo, posto $R = (\\sqrt{1-c^2}, c)$, si ottiene un punto della circonferenza di <em>ordinata</em> $c$, e quindi $[-1,1] \\subseteq \\sin(\\mathbb{R})$. Unendo le due inclusioni, l'immagine è esattamente $[-1,1]$. $\\blacksquare$</p>
            <p>Geometricamente: le proiezioni della circonferenza unitaria sull'asse delle ascisse e su quello delle ordinate ricoprono tutto il segmento da $-1$ a $1$, nessun valore intermedio viene «saltato». È questo fatto, e non la sola disuguaglianza $|\\cos x| \\le 1$, a garantire che l'immagine sia tutto $[-1,1]$ e non un suo sottoinsieme proprio.</p>`
          },
          {
            subtitle: "Periodicità: la definizione generale",
            content: `<p><strong>Definizione (funzione periodica).</strong> Una funzione $f: D \\to \\mathbb{R}$ si dice <strong>periodica</strong> di <strong>periodo</strong> $T \\gt 0$ se per ogni $x \\in D$ si ha che anche $x+T \\in D$ <strong>e</strong> $x-T \\in D$ (cioè il dominio è invariante per traslazioni di $\\pm T$) e vale</p>
            <p>$$f(x+T) = f(x).$$</p>
            <p>L'invarianza del dominio in <em>entrambe</em> le direzioni è essenziale: senza di essa anche una funzione costante definita su $[0,+\\infty)$ soddisferebbe la condizione, pur avendo un dominio che non è invariante per traslazioni di $-T$. Quando esiste, il più piccolo periodo positivo si chiama <strong>periodo fondamentale</strong>.</p>
            <p><strong>Proposizione.</strong> Seno e coseno sono periodici di periodo $2\\pi$: per ogni $x \\in \\mathbb{R}$ e ogni $k \\in \\mathbb{Z}$</p>
            <p>$$\\cos(x + 2k\\pi) = \\cos(x), \\qquad \\sin(x + 2k\\pi) = \\sin(x).$$</p>
            <p>Se a un angolo $x$ aggiungiamo un giro completo torniamo allo stesso punto $P$: le coordinate, e quindi i valori di seno e coseno, restano invariati. La periodicità permette di studiare queste funzioni su un intervallo di ampiezza $2\\pi$ (ad esempio $[0,2\\pi]$) e poi estendere i risultati a tutto $\\mathbb{R}$.</p>
            <p><strong>Esempio: ridurre un angolo al primo giro.</strong> Calcoliamo $\\cos\\!\\left(\\frac{13\\pi}{3}\\right)$. Cerchiamo $k$ tale che $\\frac{13\\pi}{3} - 2k\\pi \\in [0,2\\pi)$: scrivendo $2k\\pi = \\frac{6k\\pi}{3}$, per $k=2$ otteniamo $\\frac{13\\pi}{3} - \\frac{12\\pi}{3} = \\frac{\\pi}{3}$. Dunque</p>
            <p>$$\\cos\\!\\left(\\frac{13\\pi}{3}\\right) = \\cos\\!\\left(\\frac{\\pi}{3} + 2\\cdot 2\\cdot\\pi\\right) = \\cos\\!\\left(\\frac{\\pi}{3}\\right) = \\frac{1}{2}.$$</p>
            <p>Geometricamente: percorrere un cammino di lunghezza $\\frac{13\\pi}{3}$ equivale a compiere due giri completi (lunghezza $4\\pi$) e poi avanzare ancora di $\\frac{\\pi}{3}$.</p>`
          },
          {
            subtitle: "Grafici: che cosa confermano davvero",
            content: `<p>Il grafico del <strong>coseno</strong> parte dal massimo $1$ per $x=0$, decresce fino a $0$ in $x=\\frac{\\pi}{2}$, raggiunge il minimo $-1$ in $x=\\pi$, torna a $0$ in $x=\\frac{3\\pi}{2}$ e di nuovo a $1$ in $x=2\\pi$, completando un periodo.</p>

            <p>Le due curve oscillano fra le rette $y=-1$ e $y=1$ e illustrano il fatto che <strong>ogni ordinata compresa fra $-1$ e $1$ viene raggiunta</strong>, cosa già dimostrata sopra mediante le proiezioni della circonferenza. Attenzione: toccare gli estremi $-1$ e $1$ e restare fra di essi non basterebbe, da solo, a garantire che siano assunti anche tutti i valori intermedi — è la dimostrazione, non il disegno, a stabilirlo.</p>`

            subtitle: "Parità e disparità sulla circonferenza",

            <p>Dalla figura si osserva che i punti corrispondenti a $x$ e $-x$ hanno la <strong>stessa ascissa</strong> (la simmetria rispetto all'asse $x$ non modifica la prima coordinata) e <strong>ordinata opposta</strong>. Quindi, per ogni $x \\in \\mathbb{R}$,</p>
            <p>$$\\cos(-x) = \\cos(x), \\qquad \\sin(-x) = -\\sin(x):$$</p>
            <p>il <strong>coseno è pari</strong> (grafico simmetrico rispetto all'asse $y$) e il <strong>seno è dispari</strong> (grafico simmetrico rispetto all'origine).</p>
            <p><strong>Esempio (periodicità + disparità).</strong> Calcoliamo $\\sin\\!\\left(-\\frac{5\\pi}{2}\\right)$: usiamo <em>prima</em> la periodicità, poi la disparità.</p>
            <p>$$\\sin\\!\\left(-\\frac{5\\pi}{2}\\right) = \\sin\\!\\left(-\\frac{\\pi}{2} - 2\\pi\\right) = \\sin\\!\\left(-\\frac{\\pi}{2}\\right) = -\\sin\\!\\left(\\frac{\\pi}{2}\\right) = -1.$$</p>
            <p>Geometricamente: partendo da $A=(1,0)$ e percorrendo $\\frac{5\\pi}{2}$ in senso orario compiamo un giro completo e poi un ulteriore quarto di giro, arrivando in $(0,-1)$, la cui ordinata è $-1$.</p>
            <p><strong>Esempio (parità del coseno).</strong></p>
            <p>$$\\cos\\!\\left(-\\frac{7\\pi}{3}\\right) = \\cos\\!\\left(\\frac{7\\pi}{3}\\right) = \\cos\\!\\left(\\frac{\\pi}{3} + 2\\pi\\right) = \\cos\\!\\left(\\frac{\\pi}{3}\\right) = \\frac{1}{2}.$$</p>
            <p>Differenza operativa fra i due casi: per il coseno il segno dell'argomento si può semplicemente cancellare, mentre per il seno esso «esce» dalla funzione trasformandosi in un segno meno davanti al valore.</p>`
          }

      {
        id: "s09-tangente-geometria",
        type: "section",
        title: "La Funzione Tangente: dominio e interpretazione geometrica",
        icon: "📐",
        content: `<p><strong>Definizione.</strong> La tangente, denotata $\\tan(x)$ o $\\operatorname{tg}(x)$, è il rapporto fra seno e coseno,</p>
        <p>$$\\tan(x) = \\frac{\\sin(x)}{\\cos(x)},$$</p>
        <p>definita dove il denominatore non si annulla.</p>
        <p><strong>Come si ottiene il dominio.</strong> Il coseno si annulla quando l'ascissa del punto $P$ è zero, e questo accade esattamente nei due punti $(0,1)$ e $(0,-1)$, corrispondenti agli angoli $x = \\frac{\\pi}{2}$ e $x = \\frac{3\\pi}{2}$, e a tutti gli angoli ottenuti aggiungendo a questi un multiplo intero di $2\\pi$:</p>
        <p>$$x = \\frac{\\pi}{2} + 2k\\pi \\quad \\text{oppure} \\quad x = \\frac{3\\pi}{2} + 2k\\pi, \\qquad k \\in \\mathbb{Z}.$$</p>
        <p>Osserviamo che $\\frac{3\\pi}{2} = \\frac{\\pi}{2} + \\pi$: le due famiglie si riuniscono in una sola scrittura, perché passando dall'una all'altra si aggiunge $\\pi$. In generale $\\cos(x) = 0$ se e solo se $x = \\frac{\\pi}{2} + k\\pi$ con $k \\in \\mathbb{Z}$ (i $k$ pari danno la prima famiglia, i dispari la seconda). Pertanto</p>
        <p>$$\\mathrm{Dom}(\\tan) = \\mathbb{R} \\setminus \\left\\{ \\frac{\\pi}{2} + k\\pi \\mid k \\in \\mathbb{Z} \\right\\}.$$</p>`,
        subsections: [
          {
            subtitle: "Interpretazione geometrica",
            content: `<p>Tracciamo la retta tangente alla circonferenza goniometrica nel punto $A = (1,0)$, cioè la retta verticale $x = 1$, e consideriamo la <em>retta</em> $OP$ passante per l'origine e per $P(x) = (\\cos x, \\sin x)$. Il punto $Q$ è l'intersezione fra la retta $OP$ e la retta $x=1$: la sua ordinata è proprio $\\tan(x)$.</p>

            <p><strong>Il disegno illustra il primo quadrante.</strong> Là $\\cos(x) \\gt 0$ e $\\sin(x) \\gt 0$: il punto $Q$ si trova sulla <em>semiretta</em> $OP$ (basta prolungare il raggio oltre $P$) e tutte le lunghezze in gioco sono positive. In questo caso particolare si può argomentare con la similitudine dei triangoli rettangoli $OP_xP$ e $OAQ$, dove $P_x = (\\cos x, 0)$ è la proiezione di $P$:</p>
            <p>$$\\frac{\\overline{AQ}}{\\overline{OA}} = \\frac{\\overline{P_xP}}{\\overline{OP_x}} \\Rightarrow \\frac{\\overline{AQ}}{1} = \\frac{\\sin(x)}{\\cos(x)} = \\tan(x).$$</p>
            <p>Questo ragionamento, però, confronta lunghezze non negative e quindi <strong>non</strong> è sufficiente negli altri quadranti, dove $\\tan(x)$ può essere negativa: un rapporto di lunghezze non può esserlo. Serve un argomento valido in generale.</p>`
          },
          {
            subtitle: "Proposizione e dimostrazione (valida in tutti i quadranti)",
            content: `<p><strong>Proposizione.</strong> Sia $x \\in \\mathrm{Dom}(\\tan)$. Allora la retta $OP$ passante per l'origine e per $P(x) = (\\cos x, \\sin x)$ interseca la retta $x=1$ in un unico punto, ed esso è $Q = (1, \\tan(x))$.</p>
            <p><strong>Dimostrazione.</strong> La retta per l'origine e per $P$ si descrive in forma parametrica come l'insieme dei punti</p>
            <p>$$t\\cdot(\\cos x, \\sin x) = (t\\cos x,\\ t\\sin x), \\qquad t \\in \\mathbb{R}.$$</p>
            <p>Imponiamo che l'ascissa valga $1$: $t\\cos(x) = 1$. Poiché $x$ appartiene al dominio della tangente si ha $\\cos(x) \\neq 0$, quindi l'equazione ha l'unica soluzione $t = \\frac{1}{\\cos(x)}$. Sostituendo nella seconda coordinata:</p>
            <p>$$y_Q = t\\sin(x) = \\frac{\\sin(x)}{\\cos(x)} = \\tan(x).$$</p>
            <p>Dunque $Q = (1, \\tan x)$. $\\blacksquare$</p>
            <p>Il calcolo chiarisce anche il ruolo dei segni, che la similitudine non riusciva a catturare:</p>
            <ul>
              <li>se $\\cos(x) \\gt 0$ allora $t \\gt 0$ e $Q$ si ottiene prolungando la semiretta $OP$ <em>nella direzione di</em> $P$;</li>
              <li>se $\\cos(x) \\lt 0$ allora $t \\lt 0$ e $Q$ si trova sulla semiretta <em>opposta</em>, dalla parte contraria rispetto all'origine: per questo è necessario parlare della retta $OP$ e non del solo prolungamento del raggio;</li>
              <li>se $\\cos(x) = 0$ la retta $OP$ è verticale, dunque parallela a $x=1$: non c'è intersezione, coerentemente col fatto che $\\tan(x)$ non è definita.</li>
            </ul>
            <p>Il valore $\\tan(x)$ è quindi l'ordinata di $Q$, cioè la lunghezza <em>con segno</em> del segmento verticale $AQ$: positiva se $Q$ sta sopra l'asse delle ascisse, negativa se sta sotto.</p>
            <p><strong>Esempio.</strong> Per $x = \\frac{3\\pi}{4}$ (secondo quadrante) si ha $\\cos(x) = -\\frac{\\sqrt{2}}{2} \\lt 0$ e $\\sin(x) = \\frac{\\sqrt{2}}{2} \\gt 0$, quindi</p>
            <p>$$\\tan\\!\\left(\\frac{3\\pi}{4}\\right) = \\frac{\\frac{\\sqrt{2}}{2}}{-\\frac{\\sqrt{2}}{2}} = -1,$$</p>
            <p>e infatti $t = \\frac{1}{\\cos x} = -\\sqrt{2} \\lt 0$: il punto $Q = (1,-1)$ sta sulla semiretta opposta a quella che contiene $P$, sotto l'asse delle ascisse. Nessun rapporto di lunghezze potrebbe dare $-1$, mentre l'ordinata con segno sì.</p>`
          }
        ],
        formulas: [
          { label: "Dominio della tangente", latex: "\\mathrm{Dom}(\\tan) = \\mathbb{R} \\setminus \\left\\{ \\tfrac{\\pi}{2} + k\\pi \\mid k \\in \\mathbb{Z} \\right\\}" },
          { label: "Intersezione con la retta x=1", latex: "Q = (1, \\tan x), \\qquad t = \\frac{1}{\\cos x}" }
        ]
      },
      {
        id: "s09-es-periodo-tangente",
        type: "esercizio_svolto",
        title: "Esercizio svolto — Periodicità della funzione tangente",
        icon: "✎",
        source: "docente",
        content: `<p>Dimostrare che la funzione tangente ha periodo $\\pi$, ovvero che $\\tan(x) = \\tan(x+\\pi)$ per ogni $x$ nel suo dominio, e che $\\pi$ è il <strong>periodo minimo</strong>.</p>`,
        steps: [
          `Per definizione $\\tan(x) = \\frac{\\sin(x)}{\\cos(x)}$, con $x \\neq \\frac{\\pi}{2} + k\\pi$, $k \\in \\mathbb{Z}$. Dobbiamo verificare che $\\tan(x+\\pi) = \\tan(x)$: scriviamo $\\tan(x+\\pi)$ usando la definizione e applichiamo le formule di addizione a numeratore e denominatore.`,
          `<strong>Numeratore.</strong> Formula di addizione del seno con $a=x$ e $b=\\pi$: <p>$$\\sin(x+\\pi) = \\sin(x)\\cos(\\pi) + \\sin(\\pi)\\cos(x).$$</p> Dai valori notevoli sulla circonferenza, $\\cos(\\pi) = -1$ e $\\sin(\\pi) = 0$ (il punto associato a $\\pi$ è $P=(-1,0)$), quindi <p>$$\\sin(x+\\pi) = -\\sin(x).$$</p> <figure class="figura" data-id="analisi1_lez09c_d1"><?xml version="1.0" encoding="UTF-8"?>

</svg></figure>`,
          `<strong>Denominatore.</strong> Formula di addizione del coseno: <p>$$\\cos(x+\\pi) = \\cos(x)\\cos(\\pi) - \\sin(x)\\sin(\\pi) = -\\cos(x).$$</p> In particolare $\\cos(x+\\pi) \\neq 0$ esattamente quando $\\cos(x) \\neq 0$: il dominio della tangente è dunque esso stesso invariante per traslazioni di $\\pi$.`,
          `<strong>Conclusione (π è un periodo).</strong> <p>$$\\tan(x+\\pi) = \\frac{\\sin(x+\\pi)}{\\cos(x+\\pi)} = \\frac{-\\sin(x)}{-\\cos(x)} = \\tan(x).$$</p>`,
          `<strong>π è il periodo minimo.</strong> Sia $T \\gt 0$ un periodo della tangente. Allora $0$ appartiene al dominio e, per definizione di periodo, anche $T$ vi appartiene e vale $\\tan(T) = \\tan(0) = 0$. Ma $\\tan(T) = \\frac{\\sin(T)}{\\cos(T)} = 0$ implica $\\sin(T) = 0$, cioè $T = k\\pi$ con $k \\in \\mathbb{Z}$. Il più piccolo valore <em>positivo</em> possibile è dunque $T = \\pi$, che abbiamo appena dimostrato essere effettivamente un periodo. Quindi il periodo fondamentale della tangente è $\\pi$.`,
          `Il grafico riflette questa periodicità: la curva si ripete identica ogni $\\pi$ e presenta asintoti verticali dove il coseno si annulla, cioè in $x = \\frac{\\pi}{2} + k\\pi$. <figure class="figura" data-id="analisi1_lez09c_g1"><svg xmlns:xlink="http://www.w3.org/1999/xlink" width="640pt" height="400pt" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" version="1.1">

      {
        id: "s09-inverse-approfondimento",
        type: "section",
        title: "Approfondimento — Le inverse trigonometriche: costruzione e calcoli",
        icon: "🧭",
        content: `<p><em>Questa sezione riprende le definizioni di arcoseno, arcocoseno e arcotangente; il contenuto nuovo è la discussione delle tre nozioni (monotonia, iniettività, biettività) e una serie di calcoli espliciti.</em></p>
        <p>Per poter definire una funzione inversa è necessario che la funzione di partenza sia <strong>biettiva</strong>. Le funzioni trigonometriche sono periodiche, quindi non iniettive sul dominio naturale. Si procede così: si sceglie un intervallo su cui la funzione è <em>strettamente</em> monotona (così da renderla iniettiva) e si prende come codominio la sua immagine (così da renderla suriettiva). La restrizione ottenuta è biettiva e quindi invertibile.</p>
        <p><strong>Tre nozioni da non confondere.</strong> La monotonia <em>stretta</em> implica l'iniettività, ma non viceversa; l'iniettività da sola non basta per invertire: serve anche la suriettività, che si ottiene «per costruzione» restringendo il codominio all'immagine. La biettività è la congiunzione delle due proprietà ed è l'unica condizione che garantisce l'esistenza dell'inversa.</p>`,
        subsections: [
          {
            subtitle: "Arcoseno: restrizione, grafico, calcoli",
            content: `<p>$\\sin$ non è iniettiva su $\\mathbb{R}$; ristretta a $\\left[-\\frac{\\pi}{2}, \\frac{\\pi}{2}\\right]$ diventa strettamente crescente, con immagine $[-1,1]$.</p>

            <p><strong>Calcolo di valori.</strong> Per $\\arcsin\\!\\left(\\frac{1}{2}\\right)$ cerchiamo $\\theta$ con $\\sin(\\theta) = \\frac{1}{2}$ e $\\theta \\in \\left[-\\frac{\\pi}{2}, \\frac{\\pi}{2}\\right]$. Sulla circonferenza gli angoli con seno $\\frac{1}{2}$ sono $\\frac{\\pi}{6}$ e $\\frac{5\\pi}{6}$ (a meno di multipli di $2\\pi$), ma solo $\\frac{\\pi}{6}$ appartiene all'intervallo principale: $\\arcsin\\!\\left(\\frac{1}{2}\\right) = \\frac{\\pi}{6}$. Analogamente $\\arcsin(0) = 0$, $\\arcsin(1) = \\frac{\\pi}{2}$ e, per disparità, $\\arcsin\\!\\left(-\\frac{\\sqrt{2}}{2}\\right) = -\\frac{\\pi}{4}$.</p>
            <p><strong>Perché le composizioni non si semplificano sempre.</strong> Si ha $\\arcsin(\\sin(x)) = x$ <em>soltanto</em> se $x \\in \\left[-\\frac{\\pi}{2}, \\frac{\\pi}{2}\\right]$. Un caso in cui fallisce:</p>
            <p>$$\\arcsin\\!\\left(\\sin\\!\\left(\\frac{5\\pi}{6}\\right)\\right) = \\arcsin\\!\\left(\\frac{1}{2}\\right) = \\frac{\\pi}{6} \\neq \\frac{5\\pi}{6}.$$</p>
            <p>Vale invece sempre $\\sin(\\arcsin(y)) = y$ per ogni $y \\in [-1,1]$, perché in quel caso si parte già da un valore del codominio.</p>`

            content: `<p>Anche $\\cos$ non è iniettiva. L'intervallo di restrizione standard è $[0,\\pi]$, dove la funzione è strettamente decrescente e ha immagine $[-1,1]$. La restrizione $f: [0,\\pi] \\to [-1,1]$ è biettiva, e la sua inversa è $\\arccos: [-1,1] \\to [0,\\pi]$.</p>

            <p><strong>Calcolo di valori.</strong> Per $\\arccos\\!\\left(-\\frac{1}{2}\\right)$ cerchiamo $\\theta \\in [0,\\pi]$ con $\\cos(\\theta) = -\\frac{1}{2}$: gli angoli con tale coseno sono $\\frac{2\\pi}{3}$ e $\\frac{4\\pi}{3}$ (a meno di $2k\\pi$), e solo il primo sta in $[0,\\pi]$, quindi $\\arccos\\!\\left(-\\frac{1}{2}\\right) = \\frac{2\\pi}{3}$.</p>
            <p>Si noti che l'arcocoseno, a differenza dell'arcoseno, <strong>non è né pari né dispari</strong>: ad esempio $\\arccos\\!\\left(\\frac{1}{2}\\right) = \\frac{\\pi}{3}$, e infatti $\\frac{\\pi}{3} + \\frac{2\\pi}{3} = \\pi$. Altri valori immediati: $\\arccos(1) = 0$, $\\arccos(0) = \\frac{\\pi}{2}$, $\\arccos(-1) = \\pi$.</p>`
          },
          {
            subtitle: "Arcotangente: restrizione, grafico, calcoli",
            content: `<p>$\\tan$ è periodica; la restrizione standard è a $\\left(-\\frac{\\pi}{2}, \\frac{\\pi}{2}\\right)$, dove è strettamente crescente e ha immagine tutto $\\mathbb{R}$. La restrizione $f: \\left(-\\frac{\\pi}{2}, \\frac{\\pi}{2}\\right) \\to \\mathbb{R}$ è biettiva, e la sua inversa è $\\arctan: \\mathbb{R} \\to \\left(-\\frac{\\pi}{2}, \\frac{\\pi}{2}\\right)$. Il grafico ha due asintoti orizzontali, $y = -\\frac{\\pi}{2}$ e $y = \\frac{\\pi}{2}$.</p>

            <p><strong>Calcolo di valori.</strong> Per $\\arctan(1)$ cerchiamo $\\theta \\in \\left(-\\frac{\\pi}{2}, \\frac{\\pi}{2}\\right)$ con $\\tan(\\theta) = 1$, cioè $\\sin(\\theta) = \\cos(\\theta)$: l'unico angolo dell'intervallo principale che soddisfa questa condizione è $\\frac{\\pi}{4}$, dunque $\\arctan(1) = \\frac{\\pi}{4}$. L'angolo $\\frac{5\\pi}{4}$ ha anch'esso tangente $1$, ma viene scartato perché fuori dall'intervallo principale. Analogamente $\\arctan(0) = 0$, $\\arctan(\\sqrt{3}) = \\frac{\\pi}{3}$, $\\arctan(-1) = -\\frac{\\pi}{4}$.</p>
            <p>L'arcotangente è dispari, $\\arctan(-x) = -\\arctan(x)$, ed è positiva per $x \\gt 0$ e negativa per $x \\lt 0$.</p>`

      {
        id: "s09-altre-formule",
        type: "section",
        title: "Altre formule trigonometriche notevoli: derivazioni e condizioni",
        icon: "📜",
        content: `<p><em>Riprendiamo duplicazione e bisezione, questa volta con le derivazioni complete e le condizioni di validità, e aggiungiamo due nuove famiglie: parametriche e prostaferesi.</em></p>`,
        subsections: [
          {
            subtitle: "Duplicazione: le derivazioni",
            content: `<p><strong>Coseno.</strong> Ponendo $a = b = x$ nella formula di addizione:</p>
            <p>$$\\cos(2x) = \\cos(x)\\cos(x) - \\sin(x)\\sin(x) = \\cos^2(x) - \\sin^2(x)$$</p>
            <p>Usando l'identità pitagorica otteniamo le altre due forme:</p>
            <p>$$\\cos(2x) = \\cos^2(x) - (1-\\cos^2(x)) = 2\\cos^2(x) - 1$$</p>
            <p>$$\\cos(2x) = (1-\\sin^2(x)) - \\sin^2(x) = 1 - 2\\sin^2(x)$$</p>
            <p><strong>Seno.</strong></p>
            <p>$$\\sin(2x) = \\sin(x)\\cos(x) + \\cos(x)\\sin(x) = 2\\sin(x)\\cos(x)$$</p>
            <p><strong>Tangente.</strong> Non disponiamo (ancora) di una formula di addizione per la tangente, quindi partiamo dalla definizione. Supponiamo $\\cos(2x) \\neq 0$ (così che $\\tan(2x)$ sia definita) e $\\cos(x) \\neq 0$ (così che lo sia anche $\\tan(x)$):</p>
            <p>$$\\tan(2x) = \\frac{\\sin(2x)}{\\cos(2x)} = \\frac{2\\sin(x)\\cos(x)}{\\cos^2(x) - \\sin^2(x)}$$</p>
            <p>Poiché $\\cos(x) \\neq 0$, dividiamo numeratore e denominatore per $\\cos^2(x)$:</p>
            <p>$$\\tan(2x) = \\frac{2\\dfrac{\\sin(x)}{\\cos(x)}}{1 - \\dfrac{\\sin^2(x)}{\\cos^2(x)}} = \\frac{2\\tan(x)}{1 - \\tan^2(x)}$$</p>
            <p>Le condizioni esplicite sono $x \\neq \\frac{\\pi}{2} + k\\pi$ e $x \\neq \\frac{\\pi}{4} + k\\frac{\\pi}{2}$, con $k \\in \\mathbb{Z}$: sotto l'ipotesi $\\cos(x) \\neq 0$, la condizione $\\cos(2x) \\neq 0$ equivale a $1 - \\tan^2(x) \\neq 0$.</p>`
          },
          {
            subtitle: "Riduzione di potenza: le derivazioni",
            content: `<p>Dalla formula $\\cos(2x) = 2\\cos^2(x) - 1$, isolando $\\cos^2(x)$:</p>
            <p>$$\\cos^2(x) = \\frac{1 + \\cos(2x)}{2}$$</p>
            <p>Dalla formula $\\cos(2x) = 1 - 2\\sin^2(x)$, isolando $\\sin^2(x)$:</p>
            <p>$$\\sin^2(x) = \\frac{1 - \\cos(2x)}{2}$$</p>
            <p>Per la tangente si prende il rapporto delle due; il passaggio è lecito solo se $\\cos(x) \\neq 0$, e in tal caso $1 + \\cos(2x) = 2\\cos^2(x) \\neq 0$, cosicché anche il denominatore finale non si annulla:</p>
            <p>$$\\tan^2(x) = \\frac{\\sin^2(x)}{\\cos^2(x)} = \\frac{1 - \\cos(2x)}{1 + \\cos(2x)}$$</p>
            <p>Queste formule sono molto utili per abbassare il grado di espressioni trigonometriche, ad esempio nel calcolo di integrali.</p>`
          },
          {
            subtitle: "Formule parametriche",
            content: `<p><strong>Proposizione.</strong> Sia $x \\neq (2k+1)\\pi$ con $k \\in \\mathbb{Z}$ (condizione equivalente a $\\cos(x/2) \\neq 0$, necessaria affinché $\\tan(x/2)$ sia definita). Posto $t = \\tan(x/2)$, valgono</p>
            <p>$$\\sin(x) = \\frac{2t}{1+t^2}, \\qquad \\cos(x) = \\frac{1-t^2}{1+t^2}.$$</p>
            <p><strong>Derivazione.</strong> Si parte dalle formule di duplicazione per l'angolo $x$, visto come $2\\cdot(x/2)$:</p>
            <p>$$\\sin(x) = 2\\sin(x/2)\\cos(x/2), \\qquad \\cos(x) = \\cos^2(x/2) - \\sin^2(x/2)$$</p>
            <p>Dividiamo numeratore e denominatore per l'identità pitagorica $1 = \\cos^2(x/2) + \\sin^2(x/2)$. Prima di dividere ulteriormente per $\\cos^2(x/2)$ dobbiamo garantire che tale quantità sia diversa da zero: ciò accade se e solo se $x/2 \\neq \\frac{\\pi}{2} + k\\pi$, cioè $x \\neq (2k+1)\\pi$. Sotto questa ipotesi:</p>
            <p>$$\\sin(x) = \\frac{2\\sin(x/2)\\cos(x/2)}{\\cos^2(x/2) + \\sin^2(x/2)} = \\frac{2\\tan(x/2)}{1 + \\tan^2(x/2)}$$</p>
            <p>$$\\cos(x) = \\frac{\\cos^2(x/2) - \\sin^2(x/2)}{\\cos^2(x/2) + \\sin^2(x/2)} = \\frac{1 - \\tan^2(x/2)}{1 + \\tan^2(x/2)}$$</p>
            <p><strong>Gli angoli esclusi vanno controllati a parte.</strong> Seno e coseno sono definiti anche negli angoli $x = (2k+1)\\pi$, dove invece $\\tan(x/2)$ non esiste: le formule parametriche, a differenza di quelle di duplicazione, <em>non</em> coprono tutta la circonferenza. Quando si usa la sostituzione $t = \\tan(x/2)$ per risolvere un'equazione goniometrica, bisogna verificare separatamente, direttamente nell'equazione di partenza, se gli angoli $x = (2k+1)\\pi$ siano soluzioni: la sostituzione da sola li perderebbe.</p>`
          },
          {
            subtitle: "Formule di prostaferesi",
            content: `<p>Trasformano <strong>somme</strong> di funzioni trigonometriche in <strong>prodotti</strong>. Per ogni $p, q \\in \\mathbb{R}$:</p>
            <p>$$\\sin(p) + \\sin(q) = 2\\sin\\!\\left(\\frac{p+q}{2}\\right)\\cos\\!\\left(\\frac{p-q}{2}\\right)$$</p>
            <p>$$\\sin(p) - \\sin(q) = 2\\cos\\!\\left(\\frac{p+q}{2}\\right)\\sin\\!\\left(\\frac{p-q}{2}\\right)$$</p>
            <p>$$\\cos(p) + \\cos(q) = 2\\cos\\!\\left(\\frac{p+q}{2}\\right)\\cos\\!\\left(\\frac{p-q}{2}\\right)$$</p>
            <p>$$\\cos(p) - \\cos(q) = -2\\sin\\!\\left(\\frac{p+q}{2}\\right)\\sin\\!\\left(\\frac{p-q}{2}\\right)$$</p>
            <p>Come per le formule di addizione, <strong>non vi sono condizioni di validità</strong>: compaiono solo seno e coseno, definiti su tutto $\\mathbb{R}$.</p>
            <p><strong>Derivazione.</strong> Ponendo $p = a+b$ e $q = a-b$, si ha $a = \\frac{p+q}{2}$ e $b = \\frac{p-q}{2}$. Sommando e sottraendo le formule di addizione per $\\sin(a+b)$ e $\\sin(a-b)$, e per $\\cos(a+b)$ e $\\cos(a-b)$, si ottengono le quattro formule enunciate.</p>
            <p><strong>Formule di Werner.</strong> Le formule inverse, che trasformano prodotti in somme, si ricavano dallo stesso punto di partenza. Sono generalmente meno utilizzate.</p>`
          }
        ],
        formulas: [
          { label: "Parametriche", latex: "\\sin x = \\frac{2t}{1+t^2}, \\quad \\cos x = \\frac{1-t^2}{1+t^2}, \\quad t = \\tan\\frac{x}{2}" },
          { label: "Prostaferesi (somma di seni)", latex: "\\sin p + \\sin q = 2\\sin\\frac{p+q}{2}\\cos\\frac{p-q}{2}" },
          { label: "Prostaferesi (differenza di coseni)", latex: "\\cos p - \\cos q = -2\\sin\\frac{p+q}{2}\\sin\\frac{p-q}{2}" }
        ]
      },
      {
        id: "s09-int-parametriche-prostaferesi",
        type: "integrazione_box",
        title: "Integrazione — non detto dal docente",
        icon: "🧩",
        content: `<p><strong>Quando usare le parametriche e quando la prostaferesi: due mini-esercizi.</strong></p>
        <p><strong>(A) Formule parametriche — risolvere $\\sin(x) + \\cos(x) = 1$.</strong> Le parametriche servono quando nell'equazione compaiono <em>sia</em> $\\sin x$ <em>sia</em> $\\cos x$ al primo grado: sostituendo $t = \\tan(x/2)$ tutto diventa un'equazione razionale in $t$.</p>
        <ol>
          <li><strong>Angoli esclusi.</strong> La sostituzione richiede $x \\neq (2k+1)\\pi$. Verifichiamo <em>a parte</em> se $x = \\pi$ è soluzione: $\\sin(\\pi) + \\cos(\\pi) = 0 - 1 = -1 \\neq 1$. Non lo è, quindi non perdiamo nulla.</li>
          <li><strong>Sostituzione.</strong> Con $t = \\tan(x/2)$: <p>$$\\frac{2t}{1+t^2} + \\frac{1-t^2}{1+t^2} = 1.$$</p></li>
          <li><strong>Equazione razionale.</strong> Poiché $1+t^2 \\gt 0$ sempre, moltiplichiamo: $2t + 1 - t^2 = 1 + t^2$, cioè $2t^2 - 2t = 0$, cioè $2t(t-1) = 0$.</li>
          <li><strong>Soluzioni in $t$ e ritorno a $x$.</strong> $t = 0$ dà $\\tan(x/2) = 0$, cioè $x/2 = k\\pi$, cioè $x = 2k\\pi$. $t = 1$ dà $\\tan(x/2) = 1$, cioè $x/2 = \\frac{\\pi}{4} + k\\pi$, cioè $x = \\frac{\\pi}{2} + 2k\\pi$.</li>
          <li><strong>Verifica.</strong> $\\sin(0)+\\cos(0) = 0+1 = 1$ ✓ ; $\\sin\\!\\left(\\frac{\\pi}{2}\\right)+\\cos\\!\\left(\\frac{\\pi}{2}\\right) = 1+0 = 1$ ✓.</li>
        </ol>
        <p><strong>(B) Formule di prostaferesi — risolvere $\\sin(3x) + \\sin(x) = 0$.</strong> La prostaferesi serve quando si ha una <em>somma</em> (o differenza) di due seni o due coseni che si vuole annullare: trasformandola in un prodotto, l'equazione si spezza nei due fattori.</p>
        <ol>
          <li><strong>Trasformazione.</strong> Con $p = 3x$ e $q = x$: $\\frac{p+q}{2} = 2x$ e $\\frac{p-q}{2} = x$, quindi <p>$$\\sin(3x) + \\sin(x) = 2\\sin(2x)\\cos(x) = 0.$$</p></li>
          <li><strong>Legge di annullamento del prodotto.</strong> $\\sin(2x) = 0$ oppure $\\cos(x) = 0$.</li>
          <li><strong>Primo fattore.</strong> $\\sin(2x) = 0 \\iff 2x = k\\pi \\iff x = \\frac{k\\pi}{2}$.</li>
          <li><strong>Secondo fattore.</strong> $\\cos(x) = 0 \\iff x = \\frac{\\pi}{2} + k\\pi$, che è già contenuto nella famiglia precedente (corrisponde ai $k$ dispari).</li>
          <li><strong>Soluzione.</strong> $x = \\frac{k\\pi}{2}$, con $k \\in \\mathbb{Z}$.</li>
        </ol>
        <p><strong>In sintesi:</strong> parametriche quando occorre ridurre tutto a una sola incognita razionale (ricordando di controllare gli angoli esclusi); prostaferesi quando una somma deve diventare un prodotto da annullare fattore per fattore.</p>`
      },
      {
        id: "s09-es-equazione",
        type: "esercizio_svolto",
        title: "Esercizio svolto — Equazione goniometrica elementare",
        icon: "✎",
        source: "docente",
        content: `<p>Risolvere l'equazione $\\sin(x) = \\frac{1}{2}$.</p>`,
        steps: [
          `<strong>Interpretazione geometrica.</strong> Cerchiamo i punti sulla circonferenza goniometrica la cui ordinata (il seno) è uguale a $\\frac{1}{2}$: equivale a intersecare la circonferenza con la retta orizzontale $y = \\frac{1}{2}$.`,
          `<strong>Individuazione delle soluzioni base.</strong> L'intersezione produce due punti, nel primo e nel secondo quadrante. La soluzione nel primo quadrante è quella fornita dall'arcoseno: <p>$$x_1 = \\arcsin\\!\\left(\\frac{1}{2}\\right) = \\frac{\\pi}{6}.$$</p> Quella nel secondo quadrante si ottiene per simmetria rispetto all'asse $y$: <p>$$x_2 = \\pi - \\frac{\\pi}{6} = \\frac{5\\pi}{6}.$$</p>`,
          `<strong>Generalizzazione con la periodicità.</strong> Poiché il seno ha periodo $2\\pi$, aggiungiamo i multipli interi di $2\\pi$ a ciascuna soluzione: <p>$$x = \\frac{\\pi}{6} + 2k\\pi \\quad \\lor \\quad x = \\frac{5\\pi}{6} + 2k\\pi, \\qquad k \\in \\mathbb{Z}.$$</p>`,
          `Sulla circonferenza, la retta $y=1/2$ taglia i due punti $P_1$ e $P_2$ corrispondenti agli angoli $\\frac{\\pi}{6}$ e $\\frac{5\\pi}{6}$. <figure class="figura" data-id="analisi1_lez09c_d2"><?xml version="1.0" encoding="UTF-8"?>

        id: "s09-es-disequazione",
        type: "esercizio_svolto",
        title: "Esercizio svolto — Disequazione goniometrica elementare",
        icon: "✎",
        source: "docente",
        content: `<p>Risolvere la disequazione $\\sin(x) \\gt \\frac{1}{2}$.</p>`,
        steps: [
          `<strong>Interpretazione geometrica.</strong> Cerchiamo i punti sulla circonferenza goniometrica la cui ordinata è maggiore di $\\frac{1}{2}$.`,
          `<strong>Individuazione dell'arco soluzione.</strong> Sono i punti dell'arco che si trova <em>strettamente</em> al di sopra della retta $y = \\frac{1}{2}$. Gli estremi dell'arco sono i punti corrispondenti a $\\frac{\\pi}{6}$ e $\\frac{5\\pi}{6}$, trovati nell'esercizio precedente; essi sono <strong>esclusi</strong>, perché lì si ha $\\sin(x) = \\frac{1}{2}$ e non $\\sin(x) \\gt \\frac{1}{2}$.`,
          `<strong>Soluzione in $[0,2\\pi)$.</strong> L'arco soluzione corrisponde agli angoli con $\\frac{\\pi}{6} \\lt x \\lt \\frac{5\\pi}{6}$ (disuguaglianze strette).`,
          `<strong>Generalizzazione con la periodicità.</strong> Aggiungiamo $2k\\pi$ a entrambi gli estremi: <p>$$\\frac{\\pi}{6} + 2k\\pi \\lt x \\lt \\frac{5\\pi}{6} + 2k\\pi, \\qquad k \\in \\mathbb{Z}.$$</p>`,
          `Nella figura l'arco rosso è l'insieme soluzione; i due cerchietti vuoti agli estremi ricordano che gli angoli $\\frac{\\pi}{6}$ e $\\frac{5\\pi}{6}$ sono esclusi, coerentemente con le disuguaglianze strette. <figure class="figura" data-id="analisi1_lez09c_d3"><?xml version="1.0" encoding="UTF-8"?>

      },
      {
        id: "s09-es-teoria-1",
        type: "esercizio",
        title: "Teoria 1",
        kind: "teoria",
        source: "integrazione",
        icon: "📚",
        content: `<p>Dare la definizione di funzione logaritmica in base $a$ (con $a \\gt 0$, $a \\neq 1$), specificandone dominio e insieme dei valori, e dimostrare, a partire dalle proprietà delle potenze, che $\\log_a(xy) = \\log_a(x) + \\log_a(y)$ per ogni $x, y \\gt 0$.</p>`,
        solution: `<p><strong>Definizione.</strong> La funzione esponenziale $f(x) = a^x$, con $a \\gt 0$ e $a \\neq 1$, è strettamente monotona (crescente se $a \\gt 1$, decrescente se $0 \\lt a \\lt 1$) e quindi iniettiva; la sua immagine è $(0,+\\infty)$. Vista come $f: \\mathbb{R} \\to (0,+\\infty)$ è biiettiva e ammette inversa: tale inversa si chiama logaritmo in base $a$,</p>
        <p>$$\\log_a : (0,+\\infty) \\to \\mathbb{R}.$$</p>
        <p>Dunque $\\log_a(x)$ è l'unico esponente $t \\in \\mathbb{R}$ tale che $a^t = x$; in particolare $a^{\\log_a(x)} = x$ per ogni $x \\gt 0$ e $\\log_a(a^t) = t$ per ogni $t \\in \\mathbb{R}$. Il dominio è $(0,+\\infty)$ e l'insieme dei valori è $\\mathbb{R}$.</p>
        <p><strong>Dimostrazione della proprietà del prodotto.</strong></p>
        <ol>
          <li>Siano $x, y \\gt 0$ e poniamo $u = \\log_a(x)$, $v = \\log_a(y)$, cioè <p>$$a^u = x, \\qquad a^v = y.$$</p></li>
          <li>Per la proprietà delle potenze con la stessa base, <p>$$xy = a^u \\cdot a^v = a^{u+v}.$$</p></li>
          <li>Applicando $\\log_a$ a entrambi i membri e usando $\\log_a(a^{u+v}) = u+v$: <p>$$\\log_a(xy) = u + v = \\log_a(x) + \\log_a(y). \\qquad \\blacksquare$$</p></li>
        </ol>
        <p><strong>Osservazione sull'ipotesi.</strong> La condizione $x, y \\gt 0$ è essenziale: se cadesse, i logaritmi al secondo membro non sarebbero nemmeno definiti. Si noti che $\\log_a(xy)$ potrebbe invece esistere, ad esempio con $x$ e $y$ entrambi negativi: la formula non si può quindi usare senza la condizione $x \\gt 0$, $y \\gt 0$.</p>`
      },
      {
        id: "s09-es-teoria-2",
        type: "esercizio",
        title: "Teoria 2",
        kind: "teoria",
        source: "integrazione",
        icon: "📚",
        content: `<p>Enunciare dominio e immagine delle funzioni $\\sin$ e $\\cos$, spiegando la differenza fra codominio e immagine. In particolare: perché la sola disuguaglianza $|\\cos x| \\le 1$ non basta a concludere che $\\cos(\\mathbb{R}) = [-1,1]$?</p>`,
        solution: `<p><strong>Dominio.</strong> Si ha $\\mathrm{Dom}(\\sin) = \\mathrm{Dom}(\\cos) = \\mathbb{R}$: per ogni $x \\in \\mathbb{R}$ si percorre sulla circonferenza goniometrica, a partire da $A = (1,0)$, un cammino di lunghezza $|x|$ (antiorario se $x \\gt 0$, orario se $x \\lt 0$), e questo individua un unico punto $P = (\\cos x, \\sin x)$; quindi i due valori sono definiti per ogni reale.</p>
        <p><strong>Immagine.</strong> $\\sin(\\mathbb{R}) = \\cos(\\mathbb{R}) = [-1,1]$.</p>
        <p><strong>Codominio vs immagine.</strong> Scrivendo $f: A \\to B$, l'insieme $B$ è il codominio, scelto da noi, e deve solo contenere tutti i valori assunti; l'immagine $f(A) = \\{ f(x) \\mid x \\in A \\}$ è invece l'insieme dei valori effettivamente raggiunti. Vale sempre $f(A) \\subseteq B$, mentre $f(A) = B$ accade solo se $f$ è surgettiva sul codominio scelto: per esempio $\\cos: \\mathbb{R} \\to \\mathbb{R}$ è una scrittura lecita, ma qui il codominio è molto più grande dell'immagine.</p>
        <p><strong>Perché $|\\cos x| \\le 1$ non basta.</strong> Questa disuguaglianza segue da $\\cos^2 x + \\sin^2 x = 1$ e dà soltanto l'inclusione</p>
        <p>$$\\cos(\\mathbb{R}) \\subseteq [-1,1];$$</p>
        <p>da sola non esclude che qualche valore intermedio venga «saltato». Per l'inclusione opposta:</p>
        <ol>
          <li>si fissa $c \\in [-1,1]$ e si pone $s = \\sqrt{1-c^2}$, ben definito perché $1-c^2 \\ge 0$;</li>
          <li>si osserva che $c^2 + s^2 = 1$, cioè $Q = (c,s)$ sta sulla circonferenza;</li>
          <li>poiché $P(x)$ percorre tutta la circonferenza al variare di $x \\in [0,2\\pi]$, esiste $x_0$ con $P(x_0) = Q$ e quindi $\\cos x_0 = c$;</li>
          <li>analogamente, con $R = (\\sqrt{1-c^2}, c)$ si trova $x_1$ con $\\sin x_1 = c$.</li>
        </ol>
        <p>Dalle due inclusioni segue $\\cos(\\mathbb{R}) = \\sin(\\mathbb{R}) = [-1,1]$, cioè $\\cos, \\sin : \\mathbb{R} \\to [-1,1]$ sono surgettive.</p>`
      },
      {
        id: "s09-es-teoria-3",
        type: "esercizio",
        title: "Teoria 3",
        kind: "teoria",
        source: "integrazione",
        icon: "📚",
        content: `<p>Spiegare perché la funzione $\\cos(x)$ non è invertibile su $\\mathbb{R}$, descrivere la restrizione standard con cui si definisce $\\arccos$ indicandone dominio e immagine, e dimostrare che $\\arccos(-x) = \\pi - \\arccos(x)$ per ogni $x \\in [-1,1]$.</p>`,
        solution: `<p><strong>Non invertibilità.</strong> La funzione $\\cos$ è periodica di periodo $2\\pi$, quindi non è iniettiva su $\\mathbb{R}$: ad esempio $\\cos(0) = \\cos(2\\pi) = 1$ con $0 \\neq 2\\pi$. Non essendo iniettiva, non è invertibile.</p>
        <p><strong>Restrizione standard.</strong> Si restringe il dominio a $[0,\\pi]$, dove $\\cos$ è strettamente decrescente e dunque iniettiva, e si prende come codominio la sua immagine su tale intervallo, cioè $[-1,1]$: la restrizione $\\cos: [0,\\pi] \\to [-1,1]$ è biettiva e quindi invertibile. La sua inversa è</p>
        <p>$$\\arccos : [-1,1] \\to [0,\\pi],$$</p>
        <p>cioè $\\arccos(x)$ è l'unico $\\theta \\in [0,\\pi]$ con $\\cos(\\theta) = x$.</p>
        <p><strong>Dimostrazione dell'identità.</strong></p>
        <ol>
          <li>Sia $x \\in [-1,1]$ e sia $\\theta = \\arccos(x)$, così che $\\theta \\in [0,\\pi]$ e $\\cos(\\theta) = x$.</li>
          <li>Posto $\\varphi = \\pi - \\theta$, si ha $\\varphi \\in [0,\\pi]$.</li>
          <li>Per la formula di sottrazione del coseno: <p>$$\\cos(\\varphi) = \\cos(\\pi)\\cos(\\theta) + \\sin(\\pi)\\sin(\\theta) = -\\cos(\\theta) + 0 = -x.$$</p></li>
          <li>Dunque $\\varphi$ è un elemento di $[0,\\pi]$ il cui coseno vale $-x$ e, per l'unicità garantita dall'iniettività della restrizione, <p>$$\\arccos(-x) = \\varphi = \\pi - \\arccos(x). \\qquad \\blacksquare$$</p></li>
        </ol>
        <p>In particolare $\\arccos$ non è né pari né dispari: ad esempio $\\arccos\\!\\left(\\frac{1}{2}\\right) = \\frac{\\pi}{3}$ e $\\arccos\\!\\left(-\\frac{1}{2}\\right) = \\pi - \\frac{\\pi}{3} = \\frac{2\\pi}{3}$.</p>`
      },
      {
        id: "s09-es-teoria-4",
        type: "esercizio",
        title: "Teoria 4",
        kind: "teoria",
        source: "integrazione",
        icon: "📚",
        content: `<p>Spiegare perché la funzione $\\sin$ non è invertibile su tutto $\\mathbb{R}$, dire come si definisce $\\arcsin$ (dominio, insieme dei valori, monotonia) e calcolare $\\arcsin\\!\\left(\\sin\\frac{7\\pi}{6}\\right)$, giustificando il risultato.</p>`,
        solution: `<p><strong>Non invertibilità.</strong> La funzione $\\sin$ è periodica di periodo $2\\pi$: $\\sin(x+2k\\pi) = \\sin(x)$ per ogni $k \\in \\mathbb{Z}$, quindi assume lo stesso valore infinite volte e non è iniettiva su $\\mathbb{R}$ (per esempio $\\sin(0) = \\sin(2\\pi) = 0$). Non essendo iniettiva, non è invertibile.</p>
        <p><strong>Definizione di arcoseno.</strong> Si restringe il dominio a $\\left[-\\frac{\\pi}{2}, \\frac{\\pi}{2}\\right]$, dove $\\sin$ è strettamente crescente e ha immagine $[-1,1]$: la restrizione è biiettiva e la sua inversa è</p>
        <p>$$\\arcsin : [-1,1] \\to \\left[-\\frac{\\pi}{2}, \\frac{\\pi}{2}\\right],$$</p>
        <p>strettamente crescente e dispari. Per $t \\in [-1,1]$, $\\arcsin(t)$ è l'unico angolo di $\\left[-\\frac{\\pi}{2}, \\frac{\\pi}{2}\\right]$ il cui seno vale $t$.</p>
        <p><strong>Calcolo.</strong></p>
        <ol>
          <li>Poiché $\\frac{7\\pi}{6} = \\pi + \\frac{\\pi}{6}$ e $\\sin(\\pi+t) = -\\sin(t)$: <p>$$\\sin\\!\\left(\\frac{7\\pi}{6}\\right) = -\\sin\\!\\left(\\frac{\\pi}{6}\\right) = -\\frac{1}{2}.$$</p></li>
          <li>Quindi <p>$$\\arcsin\\!\\left(\\sin\\frac{7\\pi}{6}\\right) = \\arcsin\\!\\left(-\\frac{1}{2}\\right) = -\\frac{\\pi}{6},$$</p> perché $-\\frac{\\pi}{6} \\in \\left[-\\frac{\\pi}{2}, \\frac{\\pi}{2}\\right]$ e $\\sin\\!\\left(-\\frac{\\pi}{6}\\right) = -\\frac{1}{2}$.</li>
        </ol>
        <p>Il risultato <strong>non</strong> è $\\frac{7\\pi}{6}$: l'uguaglianza $\\arcsin(\\sin x) = x$ vale solo per $x \\in \\left[-\\frac{\\pi}{2}, \\frac{\\pi}{2}\\right]$, e $\\frac{7\\pi}{6}$ non appartiene a tale intervallo.</p>`
      },
      {
        id: "s09-es-scritto-1",
        type: "esercizio",
        title: "Scritto 1",
        kind: "scritto",
        source: "integrazione",
        icon: "✏️",
        content: `<p>Risolvere la disequazione $4^x - 3\\cdot 2^x + 2 \\le 0$.</p>`,
        solution: `<ol>
          <li><strong>Sostituzione.</strong> Osserviamo che $4^x = (2^2)^x = (2^x)^2$. Poniamo $t = 2^x$, con il vincolo $t \\gt 0$ perché l'esponenziale è sempre strettamente positiva. La disequazione diventa <p>$$t^2 - 3t + 2 \\le 0.$$</p></li>
          <li><strong>Disequazione in $t$.</strong> Fattorizzando, $(t-1)(t-2) \\le 0$, soddisfatta per <p>$$1 \\le t \\le 2.$$</p> Entrambi gli estremi sono positivi, dunque compatibili con il vincolo $t \\gt 0$.</li>
          <li><strong>Ritorno alla variabile $x$.</strong> <p>$$1 \\le 2^x \\le 2 \\quad \\Longleftrightarrow \\quad 2^0 \\le 2^x \\le 2^1.$$</p></li>
          <li><strong>Uso della monotonia.</strong> La base è $2 \\gt 1$, quindi l'esponenziale è strettamente crescente e la disuguaglianza fra le potenze equivale alla stessa disuguaglianza fra gli esponenti: <p>$$0 \\le x \\le 1.$$</p></li>
          <li><strong>Soluzione.</strong> $S = [0,1]$.</li>
          <li><strong>Controllo.</strong> Per $x=0$: $1-3+2 = 0$; per $x=1$: $4-6+2 = 0$; per $x=\\frac{1}{2}$: $2 - 3\\sqrt{2} + 2 \\approx -0{,}24 \\lt 0$; per $x=2$: $16-12+2 = 6 \\gt 0$.</li>
        </ol>
        <p>Il grafico di $f(x) = 4^x - 3\\cdot 2^x + 2$ evidenzia l'intervallo in cui $f(x) \\le 0$, cioè $[0,1]$, con i due zeri in $x=0$ e $x=1$.</p>
