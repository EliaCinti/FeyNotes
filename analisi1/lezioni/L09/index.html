      {
        id: "s09-es-scritto-2",
        type: "esercizio",
        title: "Scritto 2",
        kind: "scritto",
        source: "integrazione",
        icon: "✏️",
        content: `<p>Usando periodicità e parità, calcolare $\\cos\\!\\left(\\frac{25\\pi}{3}\\right)$, $\\sin\\!\\left(-\\frac{9\\pi}{2}\\right)$ e $\\cos\\!\\left(-\\frac{13\\pi}{3}\\right)$.</p>`,
        solution: `<ol>
          <li><strong>Primo valore.</strong> Cerchiamo $k \\in \\mathbb{Z}$ tale che $\\frac{25\\pi}{3} - 2k\\pi \\in [0,2\\pi)$. Con $k=4$: $\\frac{25\\pi}{3} - \\frac{24\\pi}{3} = \\frac{\\pi}{3}$. Dunque <p>$$\\cos\\!\\left(\\frac{25\\pi}{3}\\right) = \\cos\\!\\left(\\frac{\\pi}{3} + 2\\cdot 4\\cdot\\pi\\right) = \\cos\\!\\left(\\frac{\\pi}{3}\\right) = \\frac{1}{2}$$</p> (quattro giri completi non cambiano il punto $P$).</li>
          <li><strong>Secondo valore.</strong> Per la disparità del seno, $\\sin\\!\\left(-\\frac{9\\pi}{2}\\right) = -\\sin\\!\\left(\\frac{9\\pi}{2}\\right)$. Poi $\\frac{9\\pi}{2} = \\frac{\\pi}{2} + 4\\pi$, quindi per periodicità $\\sin\\!\\left(\\frac{9\\pi}{2}\\right) = \\sin\\!\\left(\\frac{\\pi}{2}\\right) = 1$ e <p>$$\\sin\\!\\left(-\\frac{9\\pi}{2}\\right) = -1.$$</p> Geometricamente il punto di arrivo è $(0,-1)$.</li>
          <li><strong>Terzo valore.</strong> Per la parità del coseno, $\\cos\\!\\left(-\\frac{13\\pi}{3}\\right) = \\cos\\!\\left(\\frac{13\\pi}{3}\\right)$; poiché $\\frac{13\\pi}{3} = \\frac{\\pi}{3} + 4\\pi$, <p>$$\\cos\\!\\left(\\frac{13\\pi}{3}\\right) = \\cos\\!\\left(\\frac{\\pi}{3}\\right) = \\frac{1}{2}.$$</p></li>
        </ol>
        <p>I tre valori sono dunque $\\frac{1}{2}$, $-1$, $\\frac{1}{2}$.</p>`
      },
      {
        id: "s09-es-scritto-3",
        type: "esercizio",
        title: "Scritto 3",
        kind: "scritto",
        source: "integrazione",
        icon: "✏️",
        content: `<p>Calcolare, giustificando ogni passaggio: $\\arcsin\\!\\left(-\\frac{\\sqrt{3}}{2}\\right)$, $\\arccos\\!\\left(-\\frac{\\sqrt{2}}{2}\\right)$, $\\arctan(-\\sqrt{3})$, $\\arcsin\\!\\left(\\sin\\!\\left(\\frac{7\\pi}{6}\\right)\\right)$, $\\arccos\\!\\left(\\cos\\!\\left(-\\frac{\\pi}{4}\\right)\\right)$.</p>`,
        solution: `<p>Si usa sempre la definizione: il valore cercato è l'unico angolo dell'intervallo principale con il valore assegnato della funzione diretta.</p>
        <ol>
          <li><strong>$\\arcsin\\!\\left(-\\frac{\\sqrt{3}}{2}\\right)$.</strong> Cerchiamo $\\theta \\in \\left[-\\frac{\\pi}{2}, \\frac{\\pi}{2}\\right]$ con $\\sin(\\theta) = -\\frac{\\sqrt{3}}{2}$. Poiché $\\sin\\!\\left(-\\frac{\\pi}{3}\\right) = -\\frac{\\sqrt{3}}{2}$ e $-\\frac{\\pi}{3}$ sta nell'intervallo principale: <p>$$\\arcsin\\!\\left(-\\frac{\\sqrt{3}}{2}\\right) = -\\frac{\\pi}{3}.$$</p></li>
          <li><strong>$\\arccos\\!\\left(-\\frac{\\sqrt{2}}{2}\\right)$.</strong> Cerchiamo $\\theta \\in [0,\\pi]$ con $\\cos(\\theta) = -\\frac{\\sqrt{2}}{2}$. Gli angoli con tale coseno sono $\\frac{3\\pi}{4}$ e $\\frac{5\\pi}{4}$ (a meno di $2k\\pi$) e solo il primo sta in $[0,\\pi]$: <p>$$\\arccos\\!\\left(-\\frac{\\sqrt{2}}{2}\\right) = \\frac{3\\pi}{4}.$$</p></li>
          <li><strong>$\\arctan(-\\sqrt{3})$.</strong> Poiché $\\tan\\!\\left(\\frac{\\pi}{3}\\right) = \\sqrt{3}$ e l'arcotangente è dispari: <p>$$\\arctan(-\\sqrt{3}) = -\\frac{\\pi}{3} \\in \\left(-\\frac{\\pi}{2}, \\frac{\\pi}{2}\\right).$$</p></li>
          <li><strong>$\\arcsin\\!\\left(\\sin\\!\\left(\\frac{7\\pi}{6}\\right)\\right)$.</strong> Attenzione: non si può semplificare, perché $\\frac{7\\pi}{6} \\notin \\left[-\\frac{\\pi}{2}, \\frac{\\pi}{2}\\right]$. Si calcola prima il seno, <p>$$\\sin\\!\\left(\\frac{7\\pi}{6}\\right) = -\\frac{1}{2},$$</p> e poi <p>$$\\arcsin\\!\\left(-\\frac{1}{2}\\right) = -\\frac{\\pi}{6}.$$</p></li>
          <li><strong>$\\arccos\\!\\left(\\cos\\!\\left(-\\frac{\\pi}{4}\\right)\\right)$.</strong> Anche qui $-\\frac{\\pi}{4} \\notin [0,\\pi]$, quindi si calcola <p>$$\\cos\\!\\left(-\\frac{\\pi}{4}\\right) = \\frac{\\sqrt{2}}{2}$$</p> e poi <p>$$\\arccos\\!\\left(\\frac{\\sqrt{2}}{2}\\right) = \\frac{\\pi}{4},$$</p> coerentemente con il fatto che $\\cos$ è pari.</li>
        </ol>`
      },
      {
        id: "s09-es-scritto-4",
        type: "esercizio",
        title: "Scritto 4",
        kind: "scritto",
        source: "integrazione",
        icon: "✏️",
        content: `<p>Risolvere la disequazione $\\log_{1/2}(x^2-3x) \\ge -2$.</p>`,
        solution: `<ol>
          <li><strong>Condizione di esistenza.</strong> L'argomento del logaritmo deve essere strettamente positivo: <p>$$x^2 - 3x \\gt 0 \\quad \\Longleftrightarrow \\quad x(x-3) \\gt 0,$$</p> che dà <p>$$x \\lt 0 \\quad \\lor \\quad x \\gt 3.$$</p></li>
          <li><strong>Inversione della disuguaglianza.</strong> La base è $a = \\frac{1}{2} \\in (0,1)$, quindi $\\log_{1/2}$ è strettamente decrescente: passando dai logaritmi agli argomenti la disuguaglianza si inverte. Posto $A = x^2-3x \\gt 0$ e osservando che <p>$$-2 = \\log_{1/2}\\!\\left(\\left(\\tfrac{1}{2}\\right)^{-2}\\right) = \\log_{1/2}(4),$$</p> si ha <p>$$\\log_{1/2}(A) \\ge \\log_{1/2}(4) \\quad \\Longleftrightarrow \\quad A \\le 4.$$</p></li>
          <li><strong>Disequazione quadratica.</strong> La condizione $x^2 - 3x \\le 4$ si scrive <p>$$x^2 - 3x - 4 \\le 0 \\quad \\Longleftrightarrow \\quad (x+1)(x-4) \\le 0,$$</p> dunque <p>$$-1 \\le x \\le 4.$$</p></li>
          <li><strong>Intersezione finale.</strong> Intersecando $[-1,4]$ con il dominio $\\{x \\lt 0\\} \\cup \\{x \\gt 3\\}$ si ottiene <p>$$S = [-1,0) \\cup (3,4].$$</p></li>
          <li><strong>Controllo.</strong> Per $x = -1$: $x^2-3x = 4$ e $\\log_{1/2}(4) = -2$, quindi l'uguaglianza vale (estremo incluso). Per $x = 4$: di nuovo $x^2-3x = 4$ e si ottiene $-2$. Per $x = -2$: $x^2-3x = 10 \\gt 4$ e $\\log_{1/2}(10) \\lt -2$, quindi $x=-2$ non è soluzione, coerentemente.</li>
        </ol>
        <p>Il grafico di $f(x) = \\log_{1/2}(x^2-3x) + 2$ evidenzia i due tratti in cui $f(x) \\ge 0$, con gli asintoti verticali in $x=0$ e $x=3$ (bordi del dominio) e gli zeri in $x=-1$ e $x=4$.</p>

      {
        type: "definizione",
        front: "Come si definisce la funzione logaritmica e perché la definizione è lecita?",
        back: "L'esponenziale $f(x)=a^x$ con $a \\gt 0$, $a \\neq 1$, è strettamente monotona (crescente se $a \\gt 1$, decrescente se $0 \\lt a \\lt 1$) quindi iniettiva, e la sua immagine è $(0,+\\infty)$. Vista come $f:\\mathbb{R}\\to(0,+\\infty)$ è biiettiva, dunque invertibile: la sua inversa è $\\log_a:(0,+\\infty)\\to\\mathbb{R}$. Valgono le identità $a^{\\log_a(x)}=x$ per $x \\gt 0$ e $\\log_a(a^x)=x$ per $x\\in\\mathbb{R}$."
      },
      {
        type: "tranello",
        front: "Perché si escludono le basi $a \\lt 0$, $a=0$ e $a=1$ nell'esponenziale?",
        back: "Se $a \\lt 0$ la funzione non è definita per molti $x$: ad esempio $a^{1/2}=\\sqrt{a}$ non è reale, e il dominio diventerebbe complicato e discontinuo. Se $a=0$, $0^x$ è definita solo per $x \\gt 0$ e vale sempre $0$. Se $a=1$, $f(x)=1^x=1$ è costante, quindi non iniettiva e non invertibile. Resta $a \\in (0,1)\\cup(1,+\\infty)$."
      },
      {
        type: "tranello",
        front: "Qual è la differenza fra $\\log_a(x^\\alpha)$ e $(\\log_a(x))^\\alpha$?",
        back: "Sono espressioni diverse. In $\\log_a(x^\\alpha)=\\alpha\\log_a(x)$ l'esponente sta <em>dentro</em> l'argomento e può essere portato davanti; in $(\\log_a(x))^\\alpha$ si eleva a potenza il <em>risultato</em> del logaritmo. Ad esempio $\\log_a(x^2)=2\\log_a(x)$, mentre $(\\log_a(x))^2=\\log_a(x)\\cdot\\log_a(x)$."
      },

      },
      {
        type: "definizione",
        front: "Qual è la definizione di funzione periodica di periodo $T$?",
        back: "$f:D\\to\\mathbb{R}$ è periodica di periodo $T \\gt 0$ se per ogni $x\\in D$ anche $x+T\\in D$ e $x-T\\in D$ (dominio invariante per traslazioni di $\\pm T$) e vale $f(x+T)=f(x)$. L'invarianza in entrambe le direzioni è essenziale: senza di essa anche una costante definita su $[0,+\\infty)$ soddisferebbe la condizione. Il più piccolo periodo positivo, quando esiste, si chiama periodo fondamentale."
      },
      {
        type: "dimostrazione",
        front: "Dimostra che il periodo fondamentale della tangente è $\\pi$.",
        back: "Che $\\pi$ sia un periodo: $\\sin(x+\\pi)=-\\sin(x)$ e $\\cos(x+\\pi)=-\\cos(x)$ (formule di addizione con $\\cos\\pi=-1$, $\\sin\\pi=0$), quindi $\\tan(x+\\pi)=\\frac{-\\sin x}{-\\cos x}=\\tan(x)$; inoltre $\\cos(x+\\pi)\\neq 0$ esattamente quando $\\cos(x)\\neq 0$, quindi il dominio è invariante. Che sia minimo: se $T \\gt 0$ è un periodo, allora $T$ appartiene al dominio e $\\tan(T)=\\tan(0)=0$, cioè $\\sin(T)=0$, da cui $T=k\\pi$. Il più piccolo valore positivo possibile è $\\pi$, che abbiamo già visto essere un periodo."

        back: "$\\cos^2(x)=\\frac{1+\\cos(2x)}{2}$ e $\\sin^2(x)=\\frac{1-\\cos(2x)}{2}$; inoltre, se $\\cos(x)\\neq 0$, $\\tan^2(x)=\\frac{1-\\cos 2x}{1+\\cos 2x}$. Si ottengono isolando $\\cos^2$ e $\\sin^2$ nelle due forme della duplicazione del coseno. Servono ad abbassare il grado di un'espressione trigonometrica, sostituendo un quadrato con un coseno di argomento doppio (utile ad esempio negli integrali). Attenzione: danno il <em>quadrato</em>, quindi il segno della radice va deciso in base al quadrante."
