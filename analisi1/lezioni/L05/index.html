<script>
const LESSON = {
    id: "L05", date: "Lezione 5 — 28 Set 2026",
    title: "Disequazioni Irrazionali, Funzioni, Controimmagine e Monotonia",
    abstract: "Chiudiamo il riepilogo sulle disequazioni irrazionali distinguendo indice pari e dispari, poi entriamo nel cuore del corso: il concetto di funzione, grafico, immagine e codominio, dominio naturale, successioni, controimmagine di un insieme e infine la monotonia con le sue operazioni algebriche.",

    sections: [
      {
        id: "s05-irrazionali-intro",
        type: "section",
        title: "Riepilogo sulle disequazioni irrazionali",
        icon: "√",
        content: `<p>Una disequazione si dice <strong>irrazionale</strong> quando l'incognita compare sotto il segno di radice. La strategia risolutiva dipende in modo cruciale dalla <strong>parità dell'indice</strong> $n$ della radice.</p>
        <p>Il motivo è tutto qui: se $n$ è pari, $\\sqrt[n]{f(x)}$ esiste solo quando l'argomento è non negativo e il risultato è sempre non negativo; se $n$ è dispari, la radice è definita per ogni valore reale dell'argomento e ne conserva il segno.</p>`,
        table_compare: {
          headers: ["", "Indice $n$ pari", "Indice $n$ dispari"],
          rows: [
            ["Esistenza della radice", "richiede $f(x) \\ge 0$", "nessuna condizione aggiuntiva sul radicando"],
            ["Segno del risultato", "sempre $\\ge 0$", "concorde con il segno dell'argomento"],
            ["Elevamento a potenza", "lecito solo se entrambi i membri sono $\\ge 0$", "sempre lecito, il verso si conserva"],
            ["Discussione del segno di $g(x)$", "necessaria", "non necessaria"]
          ]
        }
      },
      {
        id: "s05-irrazionali-pari",
        type: "section",
        title: "Indice della radice n pari",
        icon: "⚖️",
        content: `<p>Quando l'indice $n$ è pari (radici quadrate, quarte, ...) la quantità $\\sqrt[n]{f(x)}$ è definita solo se il suo argomento è non negativo, e il suo risultato è sempre non negativo. Questo impone condizioni di esistenza fondamentali e obbliga a discutere il segno del secondo membro.</p>`,
        subsections: [
          {
            subtitle: "Caso $\\sqrt[n]{f(x)} \\ge g(x)$ — i due sistemi",
            content: `<p>La prima condizione da imporre sempre è quella di esistenza della radice:</p>
            <p>$$f(x) \\ge 0$$</p>
            <p><strong>Caso 1: $g(x) \\lt 0$.</strong> Se il secondo membro è negativo, la disequazione confronta una quantità non negativa con una negativa: la relazione è <strong>sempre vera</strong>, a patto che la radice esista. Basta quindi imporre la condizione di esistenza. Il primo sistema è</p>
            <p>$$\\begin{cases} f(x) \\ge 0 \\\\ g(x) \\lt 0 \\end{cases}$$</p>
            <p>con insieme di soluzioni $S_1$.</p>
            <p><strong>Caso 2: $g(x) \\ge 0$.</strong> Ora entrambi i membri sono non negativi, quindi possiamo elevare alla potenza $n$ senza alterare il verso della disuguaglianza:</p>
            <p>$$\\begin{cases} f(x) \\ge 0 & \\text{(esistenza)} \\\\ g(x) \\ge 0 & \\text{(ipotesi del caso)} \\\\ f(x) \\ge [g(x)]^n & \\text{(elevamento)} \\end{cases}$$</p>
            <p>con insieme di soluzioni $S_2$. La soluzione complessiva della disequazione è l'<strong>unione</strong> delle soluzioni dei due sistemi: $S = S_1 \\cup S_2$.</p>`
          },
          {
            subtitle: "Osservazione: nel secondo sistema $f(x) \\ge 0$ è superflua",
            content: `<p>Nel <strong>secondo</strong> sistema la condizione $f(x) \\ge 0$ è in realtà superflua. Infatti, se $g(x) \\ge 0$ allora $[g(x)]^n \\ge 0$; dalla terza condizione segue</p>
            <p>$$f(x) \\ge [g(x)]^n \\ge 0,$$</p>
            <p>quindi $f(x) \\ge 0$ è conseguenza delle altre due. Il sistema si semplifica in</p>
            <p>$$\\begin{cases} g(x) \\ge 0 \\\\ f(x) \\ge [g(x)]^n \\end{cases}$$</p>
            <p>Attenzione: nel <strong>primo</strong> sistema la condizione $f(x) \\ge 0$ non può essere omessa, perché lì non c'è nessun elevamento a potenza che la implichi.</p>`
          },
          {
            subtitle: "Caso $\\sqrt[n]{f(x)} \\le g(x)$ — un unico sistema",
            content: `<p>Qui il ragionamento è più diretto. Affinché la disequazione possa essere vera, il membro di destra $g(x)$ deve <strong>necessariamente</strong> essere non negativo: il membro di sinistra lo è per definizione, e "non negativo $\\le$ negativo" è impossibile.</p>
            <p>Le tre condizioni devono valere <strong>contemporaneamente</strong>:</p>
            <ol>
              <li>esistenza della radice: $f(x) \\ge 0$;</li>
              <li>concordanza dei segni: $g(x) \\ge 0$;</li>
              <li>elevamento alla $n$ (lecito perché entrambi i membri sono non negativi): $f(x) \\le [g(x)]^n$.</li>
            </ol>
            <p>$$\\begin{cases} f(x) \\ge 0 \\\\ g(x) \\ge 0 \\\\ f(x) \\le [g(x)]^n \\end{cases}$$</p>
            <p>La soluzione della disequazione è semplicemente la soluzione di questo unico sistema.</p>`
          }
        ],
        formulas: [
          { label: "Caso ≥, sistema 1", latex: "\\begin{cases} f(x) \\ge 0 \\\\ g(x) \\lt 0 \\end{cases}" },
          { label: "Caso ≥, sistema 2 (semplificato)", latex: "\\begin{cases} g(x) \\ge 0 \\\\ f(x) \\ge [g(x)]^n \\end{cases}" },
          { label: "Caso ≥, soluzione complessiva", latex: "S = S_1 \\cup S_2" },
          { label: "Caso ≤, sistema unico", latex: "\\begin{cases} f(x) \\ge 0 \\\\ g(x) \\ge 0 \\\\ f(x) \\le [g(x)]^n \\end{cases}" }
        ]
      },
      {
        id: "s05-irrazionali-dispari",
        type: "section",
        title: "Indice della radice n dispari",
        icon: "🔓",
        content: `<p>Quando l'indice $n$ è dispari (radici cubiche, quinte, ...) la situazione è molto più semplice. La radice $n$-esima di un numero reale è definita per qualsiasi valore dell'argomento (positivo, negativo o nullo) e <strong>conserva il segno</strong> dell'argomento.</p>
        <p>Questo significa che la radice dispari non impone alcuna restrizione di segno su $f(x)$, e possiamo sempre elevare entrambi i membri alla potenza $n$ (dispari) mantenendo il verso della disuguaglianza. Quindi, per $n$ dispari,</p>
        <p>$$\\sqrt[n]{f(x)} \\lessgtr g(x) \\quad \\Longleftrightarrow \\quad f(x) \\lessgtr [g(x)]^n$$</p>
        <p>Non è necessario discutere i segni di $g(x)$ né imporre condizioni di esistenza <em>legate alla radice</em>.</p>`,
        extra_content: `<div class="diagram-placeholder" style="border: 1px dashed var(--border-light); border-radius: 8px; padding: 20px; margin: 20px 0; text-align: center; color: var(--text-muted); font-size: 0.85rem;">
          <p><strong>⚠️ Precisazione importante</strong></p>
          <p><em>L'equivalenza vale nel <strong>dominio comune</strong> in cui $f(x)$ e $g(x)$ sono definite. La radice dispari non aggiunge restrizioni, ma le espressioni $f$ e $g$ possono averne di proprie: per esempio in $\\sqrt[3]{1/x}$ resta la condizione $x \\ne 0$.</em></p>
        </div>`,
        formulas: [
          { label: "Indice dispari", latex: "\\sqrt[n]{f(x)} \\lessgtr g(x) \\iff f(x) \\lessgtr [g(x)]^n \\quad (n \\text{ dispari})" }
        ]
      },
      {
        id: "s05-funzioni-intro",
        type: "section",
        title: "Introduzione alle funzioni",
        icon: "🔗",
        content: `<p>Il concetto di funzione è uno dei più importanti in tutta la matematica. Intuitivamente, una funzione è una <strong>regola</strong>, una <strong>mappa</strong>, una <strong>legge</strong> che associa a ogni elemento di un primo insieme un elemento di un secondo insieme.</p>
        <p>Pensiamo a una cartina geografica: a ogni punto della cartina (primo insieme) possiamo associare la sua altitudine sul livello del mare (secondo insieme). Oppure, in un negozio, a ogni maglietta (primo insieme) è associato un prezzo (secondo insieme).</p>
        <p>L'aspetto cruciale è che a ogni elemento del primo insieme deve corrispondere <strong>uno e un solo</strong> elemento del secondo. Una maglietta non può avere due prezzi diversi.</p>`,
        quote: {
          text: "Ad ogni elemento del primo insieme, un solo elemento del secondo. L'analogia è quella delle magliette e dei prezzi: ad ogni maglietta corrisponde un prezzo. Possono esserci magliette diverse che hanno lo stesso prezzo, ma l'importante è che ogni maglietta abbia un solo prezzo.",
          src: "Nota del Prof."
        },
        subsections: [
          {
            subtitle: "Definizione di funzione",
            content: `<p>Dati due insiemi non vuoti $X$ e $Y$, una <strong>funzione</strong> $f$ da $X$ a $Y$ è una legge che associa ad ogni elemento $x \\in X$ <strong>uno e un solo</strong> elemento $y \\in Y$. Si scrive $f \\colon X \\to Y$ e l'elemento associato a $x$ si indica con $y = f(x)$.</p>
            <ul>
              <li>$X$ è il <strong>dominio</strong> della funzione;</li>
              <li>$Y$ è il <strong>codominio</strong> della funzione;</li>
              <li>$x \\in X$ è l'<strong>argomento</strong> o <strong>variabile indipendente</strong>;</li>
              <li>$y = f(x) \\in Y$ è il <strong>valore</strong> della funzione, ossia l'<strong>immagine</strong> di $x$ tramite $f$.</li>
            </ul>`
          },
          {
            subtitle: "Grafico di una funzione",
            content: `<p>Data una funzione $f \\colon X \\to Y$, il suo <strong>grafico</strong> è il sottoinsieme del prodotto cartesiano $X \\times Y$ definito da</p>
            <p>$$Gr(f) = \\{ (x,y) \\in X \\times Y \\mid y = f(x) \\}.$$</p>
            <p>Il grafico è quindi l'insieme di tutte le coppie ordinate $(x, f(x))$ al variare di $x$ nel dominio.</p>`
          }
        ],
        formulas: [
          { label: "Funzione", latex: "f \\colon X \\to Y, \\qquad x \\mapsto y = f(x)" },
          { label: "Grafico", latex: "Gr(f) = \\{ (x,y) \\in X \\times Y \\mid y = f(x) \\}" }
        ]
      },
      {
        id: "s05-retta-verticale",
        type: "note_box",
        title: "Test della retta verticale — formulazione precisa",
        icon: "📏",
        content: `<p>Una curva nel piano cartesiano è il grafico di una funzione definita su $X$ se e solo se, per <strong>ogni</strong> ascissa $x \\in X$, la retta verticale di equazione $x = x_0$ interseca la curva <strong>esattamente una volta</strong>.</p>
        <p>Attenzione a distinguere le due richieste contenute in "uno e un solo $y$ per ogni $x$":</p>
        <ul>
          <li><strong>unicità</strong> — al massimo un punto di intersezione: garantisce che a $x$ non siano associati due valori diversi;</li>
          <li><strong>esistenza</strong> — almeno un punto di intersezione: garantisce che ogni $x \\in X$ abbia effettivamente un'immagine.</li>
        </ul>
        <p>Il criterio "al massimo una volta" da solo non basta su un dominio $X$ già assegnato: identifica una funzione definita sull'insieme delle ascisse effettivamente incontrate dalla curva, che può essere un sottoinsieme proprio di $X$.</p>`
      },
      {
        id: "s05-immagine-codominio",
        type: "section",
        title: "Immagine e codominio: non confonderli",
        icon: "🎯",
        content: `<p>È importante non confondere il <strong>codominio</strong> con l'<strong>immagine</strong> di una funzione.</p>
        <ul>
          <li>Il <strong>codominio</strong> $Y$ è l'insieme "di arrivo" <em>dichiarato</em>: contiene tutti i valori che la funzione <em>potrebbe</em> assumere.</li>
          <li>L'<strong>immagine</strong> $Im(f)$ è il sottoinsieme del codominio costituito dai valori che la funzione <em>effettivamente</em> assume.</li>
        </ul>
        <p>Formalmente, data $f \\colon X \\to Y$,</p>
        <p>$$Im(f) = \\{ y \\in Y \\mid \\exists\\, x \\in X : y = f(x) \\} = \\{ f(x) \\mid x \\in X \\},$$</p>
        <p>e chiaramente $Im(f) \\subseteq Y$.</p>`,
        subsections: [
          {
            subtitle: "Esempio: $f(x) = x^2$",
            content: `<p>Consideriamo $f \\colon \\mathbb{R} \\to \\mathbb{R}$, $f(x) = x^2$. Il dominio è $\\mathbb{R}$ e il codominio dichiarato è $\\mathbb{R}$. L'immagine però <strong>non</strong> è tutto $\\mathbb{R}$: poiché $x^2$ è sempre non negativo, i valori effettivamente assunti sono solo i reali maggiori o uguali a zero:</p>
            <p>$$Im(f) = [0, +\\infty) \\subset \\mathbb{R}.$$</p>
            <p>Graficamente, l'immagine è la <strong>proiezione del grafico sull'asse $y$</strong>.</p>
            <figure class="figura" data-id="analisi1_lez05a_g1"><svg xmlns:xlink="http://www.w3.org/1999/xlink" width="640pt" height="400pt" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" version="1.1">

        content: `<p>Spesso una funzione viene assegnata solo tramite la sua espressione analitica (per esempio $f(x) = \\sqrt{x}$), senza specificare esplicitamente il dominio. In questi casi si considera il <strong>dominio naturale</strong>.</p>
        <p>Il <strong>dominio naturale</strong> (o campo di esistenza) di una funzione definita da un'espressione analitica è il <strong>più grande</strong> sottoinsieme di $\\mathbb{R}$ per cui l'espressione ha significato.</p>
        <ul>
          <li>$f(x) = \\sqrt{x}$ ha dominio naturale $D = \\{ x \\in \\mathbb{R} \\mid x \\ge 0 \\} = [0, +\\infty)$;</li>
          <li>$f(x) = \\sqrt[3]{x}$ ha dominio naturale tutto $\\mathbb{R}$, perché la radice cubica è definita per qualsiasi numero reale.</li>
        </ul>`
      },
      {
        id: "s05-successioni",
        type: "section",
        title: "Successioni: funzioni con dominio ℕ",
        icon: "🔢",
        content: `<p>Un tipo particolare e molto importante di funzione è la <strong>successione</strong>.</p>
        <p>Una successione di numeri reali è una funzione che ha come dominio l'insieme dei numeri naturali:</p>
        <p>$$a \\colon \\mathbb{N} \\to \\mathbb{R}.$$</p>
        <p>Invece della notazione funzionale $a(n)$, per le successioni si preferisce la <strong>notazione indiciale</strong> $a_n$. L'elemento $a_n$ è detto <strong>termine $n$-esimo</strong> della successione.</p>
        <p>A volte il dominio di una successione può essere un sottoinsieme dei naturali, per esempio i naturali a partire da un certo $n_0$, come $\\mathbb{N} \\setminus \\{0\\} = \\{ n \\in \\mathbb{N} \\mid n \\ge 1 \\}$.</p>
        <ul>
          <li>$a_n = \\dfrac{1}{n}$ è definita per $n \\ge 1$: il dominio naturale è $\\mathbb{N} \\setminus \\{0\\}$;</li>
          <li>$a_n = n^2 + 2n + 1$ è definita per ogni $n \\in \\mathbb{N}$, incluso $n = 0$.</li>
        </ul>`,
        formulas: [
          { label: "Successione", latex: "a \\colon \\mathbb{N} \\to \\mathbb{R}, \\qquad n \\mapsto a_n" }
        ]
      },
      {
        id: "s05-controimmagine",
        type: "section",
        title: "La controimmagine di un insieme",
        icon: "↩️",
        content: `<p>Oltre a chiederci qual è l'immagine di un punto, possiamo porci la domanda <strong>inversa</strong>: quali punti del dominio vengono "mandati" in un certo sottoinsieme del codominio?</p>
        <p>Riprendendo l'analogia del negozio: «Voglio tutte le magliette il cui prezzo è compreso tra 6 e 10 euro». Cosa fa il commesso? Va a prendere tutte le magliette che soddisfano la condizione e ce le porta. Questo concetto si chiama <strong>controimmagine</strong>.</p>
        <p>In pratica: io vi do un sottoinsieme dei valori di arrivo (le $y$, i prezzi) e vi chiedo di trovare tutti i valori di partenza (le $x$, le magliette) tali che la loro immagine cada in quell'insieme.</p>`,
        subsections: [
          {
            subtitle: "Definizione formale",
            content: `<p>Data una funzione $f \\colon X \\to Y$ e un sottoinsieme $B \\subseteq Y$ del codominio, si definisce <strong>controimmagine</strong> (o <em>preimmagine</em>) di $B$ tramite $f$ l'insieme</p>
            <p>$$f^{-1}(B) = \\{ x \\in X \\mid f(x) \\in B \\}.$$</p>
            <p>È l'insieme di tutti gli elementi del dominio la cui immagine appartiene a $B$.</p>`
          },
          {
            subtitle: "Attenzione al simbolo $f^{-1}$",
            content: `<p>Non confondere $f^{-1}(B)$ con la <strong>funzione inversa</strong>. Qui $f^{-1}$ non è una funzione che agisce su un punto, ma un'<strong>operazione che agisce su un insieme</strong> $B$ e restituisce un altro insieme, sottoinsieme del dominio. Non serve alcuna ipotesi di invertibilità di $f$.</p>`
          }
        ],
        formulas: [
          { label: "Controimmagine", latex: "f^{-1}(B) = \\{ x \\in X \\mid f(x) \\in B \\}" }
        ]
      },
      {
        id: "s05-es-controimmagine-lineare",
        type: "esercizio_svolto",
        title: "Esercizio svolto — Controimmagine, funzione lineare",
        icon: "✎",
        source: "docente",
        content: `<p>Data la funzione $f \\colon \\mathbb{R} \\to \\mathbb{R}$ definita da $f(x) = 2x + 1$, calcolare la controimmagine dell'intervallo $B = (1, +\\infty)$.</p>`,
        steps: [
          `<strong>Impostare la condizione di appartenenza.</strong> Dobbiamo trovare tutte le $x \\in \\mathbb{R}$ tali che $f(x) \\in B$, cioè $f(x) \\in (1, +\\infty)$, ovvero $$2x + 1 \\gt 1.$$`,
          `<strong>Risolvere la disequazione.</strong> $$\\begin{aligned} 2x + 1 &\\gt 1 \\\\ 2x &\\gt 0 \\\\ x &\\gt 0 \\end{aligned}$$`,
          `<strong>Scrivere la soluzione.</strong> L'insieme delle $x$ che soddisfano la condizione è l'intervallo $(0, +\\infty)$, quindi $$f^{-1}\\big((1,+\\infty)\\big) = (0, +\\infty).$$`,
          `Graficamente: la controimmagine è l'insieme delle ascisse la cui immagine supera il livello $y = 1$. <figure class="figura" data-id="analisi1_lez05b_g1"><svg xmlns:xlink="http://www.w3.org/1999/xlink" width="640pt" height="400pt" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" version="1.1">

        id: "s05-es-controimmagine-quadratica",
        type: "esercizio_svolto",
        title: "Esercizio svolto — Controimmagine, funzione quadratica",
        icon: "✎",
        source: "docente",
        content: `<p>Data la funzione $f \\colon \\mathbb{R} \\to \\mathbb{R}$ definita da $f(x) = x^2$, calcolare la controimmagine dell'intervallo $B = [1,4]$.</p>`,
        steps: [
          `<strong>Impostare la condizione di appartenenza.</strong> Cerchiamo le $x \\in \\mathbb{R}$ tali che $f(x) \\in [1,4]$: si traduce nella doppia disequazione $$1 \\le f(x) \\le 4 \\quad \\Rightarrow \\quad 1 \\le x^2 \\le 4.$$`,
          `<strong>Trasformare in sistema.</strong> Le due condizioni devono valere contemporaneamente: $$\\begin{cases} x^2 \\ge 1 \\\\ x^2 \\le 4 \\end{cases}$$`,
          `<strong>Risolvere separatamente.</strong> $x^2 \\ge 1 \\Rightarrow x \\le -1 \\ \\lor \\ x \\ge 1$, cioè $(-\\infty,-1] \\cup [1,+\\infty)$; $x^2 \\le 4 \\Rightarrow -2 \\le x \\le 2$, cioè $[-2,2]$.`,
          `<strong>Intersecare le soluzioni.</strong> Ci aiutiamo con lo schema grafico sulla retta reale: nella prima riga le soluzioni di $x^2 \\ge 1$, nella seconda quelle di $x^2 \\le 4$, nella terza la loro intersezione. <figure class="figura" data-id="analisi1_lez05b_d2"><?xml version="1.0" encoding="UTF-8"?>

      {
        id: "s05-controimmagine-vuota",
        type: "note_box",
        title: "La controimmagine può essere vuota",
        icon: "∅",
        content: `<p>Consideriamo sempre $f(x) = x^2$ e chiediamoci: qual è la controimmagine dell'intervallo $B = [-6,-5]$?</p>
        <p>Dobbiamo trovare le $x$ tali che $-6 \\le x^2 \\le -5$. Poiché $x^2 \\ge 0$ per ogni $x \\in \\mathbb{R}$, <strong>non esiste alcuna</strong> $x$ che soddisfi la condizione. Pertanto</p>
        <p>$$f^{-1}([-6,-5]) = \\emptyset,$$</p>
        <p>pur essendo $B \\neq \\emptyset$. Questo conferma che $f^{-1}$ applicata a insiemi è ben definita anche quando $f$ non è invertibile.</p>`
      },
      {
        id: "s05-monotonia-def",
        type: "section",
        title: "Funzioni monotòne",
        icon: "📈",
        content: `<p>Un concetto fondamentale nell'analisi delle funzioni è quello di <strong>monotonia</strong>: studiare dove una funzione "cresce" e dove "decresce".</p>
        <p>Per poter parlare di crescenza o decrescenza abbiamo bisogno che sia il dominio sia il codominio siano insiemi <strong>ordinati</strong>. Lavorando con funzioni reali di variabile reale questa condizione è sempre soddisfatta, perché $\\mathbb{R}$ è ordinato.</p>
        <p>La monotonia <strong>non è necessariamente una proprietà globale</strong>: una funzione può crescere su un certo insieme e decrescere su un altro. Per questo si definisce sempre <em>rispetto a un sottoinsieme</em> $A$ del dominio.</p>`,
        subsections: [
          {
            subtitle: "Funzione crescente",
            content: `<p>Sia $f \\colon X \\to Y$ con $X, Y \\subseteq \\mathbb{R}$ e sia $A \\subseteq X$. La funzione $f$ si dice <strong>crescente</strong> (o non decrescente) in $A$ se per ogni coppia $x_1, x_2 \\in A$ con $x_1 \\le x_2$ risulta</p>
            <p>$$f(x_1) \\le f(x_2).$$</p>
            <p>Se la disuguaglianza è stretta, cioè se per ogni $x_1 \\lt x_2$ risulta $f(x_1) \\lt f(x_2)$, la funzione si dice <strong>strettamente crescente</strong> in $A$.</p>`
          },
          {
            subtitle: "Funzione decrescente",
            content: `<p>Con le stesse notazioni, $f$ si dice <strong>decrescente</strong> (o non crescente) in $A$ se per ogni $x_1, x_2 \\in A$ con $x_1 \\le x_2$ risulta</p>
            <p>$$f(x_1) \\ge f(x_2),$$</p>
            <p>e <strong>strettamente decrescente</strong> se per ogni $x_1 \\lt x_2$ risulta $f(x_1) \\gt f(x_2)$.</p>`
          },
          {
            subtitle: "Funzione monotòna",
            content: `<p>$f$ si dice <strong>monotòna</strong> in $A$ se è crescente in $A$ <em>oppure</em> decrescente in $A$; si dice <strong>strettamente monotòna</strong> se è strettamente crescente oppure strettamente decrescente in $A$.</p>
            <p>Formulazione sintetica da ricordare: "monotòna" non significa "crescente", ma <strong>"di segno di variazione costante"</strong>. Di conseguenza, per dimostrare che una funzione <em>non</em> è monotòna su $A$ basta esibire <strong>due coppie</strong> di punti di $A$ che violano, rispettivamente, la condizione di crescenza e quella di decrescenza.</p>`
          },
          {
            subtitle: "Il caso della funzione costante",
            content: `<p>Una funzione costante $f(x) = c$ è, secondo le definizioni date, <strong>sia crescente sia decrescente</strong>, perché vale l'uguaglianza $f(x_1) = f(x_2)$. Tuttavia non è né strettamente crescente né strettamente decrescente. In particolare: una funzione costante è monotòna, ma <strong>non</strong> strettamente monotòna.</p>`
          }
        ],
        formulas: [
          { label: "Crescente in A", latex: "\\forall x_1, x_2 \\in A: \\ x_1 \\le x_2 \\Rightarrow f(x_1) \\le f(x_2)" },
          { label: "Strettamente crescente in A", latex: "\\forall x_1, x_2 \\in A: \\ x_1 \\lt x_2 \\Rightarrow f(x_1) \\lt f(x_2)" },
          { label: "Decrescente in A", latex: "\\forall x_1, x_2 \\in A: \\ x_1 \\le x_2 \\Rightarrow f(x_1) \\ge f(x_2)" }
        ]
      },

        <p>Analizziamo la monotonia nei vari intervalli:</p>
        <ul>
          <li>in $[a,b]$ la funzione è <strong>strettamente crescente</strong>;</li>
          <li>in $[b,c]$ la funzione è <strong>costante</strong>, quindi è sia crescente sia decrescente (ma non in senso stretto);</li>
          <li>in $[a,c]$, unendo i due tratti precedenti, la funzione è complessivamente <strong>crescente</strong> (non strettamente, per via del tratto costante);</li>
          <li>in $[c,d]$ la funzione è <strong>strettamente decrescente</strong>; di conseguenza in $[b,d]$ è decrescente in senso lato;</li>
          <li>in $[d,e]$ la funzione è <strong>strettamente crescente</strong>.</li>
        </ul>
        <p>In ciascuno di questi intervalli la funzione è dunque monotòna, secondo la definizione appena data.</p>

      {
        id: "s05-alert-unione",
        type: "alert_box",
        title: "Errore comune: la monotonia NON passa all'unione",
        icon: "⚠️",
        content: `<p>Domanda cruciale: la funzione dell'esempio precedente è crescente sull'unione $[a,c] \\cup [d,e]$?</p>
        <p>La risposta è <strong>NO</strong>.</p>
        <p>Perché? La definizione di funzione crescente deve valere <strong>per ogni coppia</strong> di punti presi <em>nell'insieme considerato</em>. Prendiamo $x_1 = c$ nel primo intervallo e $x_2 = d$ nel secondo: chiaramente $c \\lt d$. Tuttavia dal grafico si vede che</p>
        <p>$$f(c) \\gt f(d),$$</p>
        <p>cioè $x_1 \\lt x_2$ ma $f(x_1) \\gt f(x_2)$: la condizione $f(x_1) \\le f(x_2)$ è violata.</p>
        <p><strong>Morale:</strong> non possiamo concludere che una funzione sia monotòna sull'unione di due insiemi solo perché lo è su ciascuno separatamente. La monotonia va verificata su <strong>tutto l'insieme considerato</strong>, anche quando non è un intervallo: su un'unione di intervalli occorre controllare <em>anche</em> le coppie di punti appartenenti a intervalli diversi. È proprio lì che la proprietà può cadere.</p>`
      },
      {
        id: "s05-operazioni-monotone",
        type: "section",
        title: "Operazioni con funzioni monotone",
        icon: "➕",
        content: `<p>Vediamo come si comporta la monotonia rispetto alle operazioni algebriche fondamentali. Siano $f, g \\colon A \\subseteq \\mathbb{R} \\to \\mathbb{R}$.</p>
        <ol>
          <li>Se $f$ è crescente in $A$, allora $-f$ è decrescente in $A$.</li>
          <li>Se $f$ e $g$ sono crescenti in $A$, allora $f + g$ è crescente in $A$.</li>
          <li>Se $f$ e $g$ sono crescenti in $A$ e $f(x), g(x) \\ge 0$ per ogni $x \\in A$, allora il prodotto $f \\cdot g$ è crescente in $A$.</li>
          <li>Se $f$ è crescente in $A$ e $f$ ha <strong>segno costante</strong> in $A$ (cioè $f(x) \\gt 0$ ovunque, oppure $f(x) \\lt 0$ ovunque), allora $1/f$ è decrescente in $A$.</li>
        </ol>
        <p>Affermazioni analoghe valgono per le funzioni decrescenti.</p>
        <p><strong>Attenzione al punto 4:</strong> la sola ipotesi $f(x) \\ne 0$ non è sufficiente. Per esempio $f(x) = x$ su $\\mathbb{R} \\setminus \\{0\\}$ è crescente e mai nulla, ma $1/x$ <strong>non</strong> è decrescente su $\\mathbb{R} \\setminus \\{0\\}$.</p>`,
        subsections: [
          {
            subtitle: "Dimostrazione del punto 1",
            content: `<p>Per ipotesi $f$ è crescente: per ogni $x, y \\in A$ con $x \\le y$ si ha $f(x) \\le f(y)$. Vogliamo mostrare che per $x \\le y$ vale $(-f)(x) \\ge (-f)(y)$.</p>
            <p>Moltiplichiamo entrambi i membri dell'ipotesi per $-1$; ricordando che la moltiplicazione per un numero negativo <strong>inverte il verso</strong> della disuguaglianza:</p>
            <p>$$f(x) \\le f(y) \\quad \\Rightarrow \\quad -f(x) \\ge -f(y).$$</p>
            <p>Questa è esattamente la definizione di funzione decrescente per $-f$. $\\square$</p>`
          },
          {
            subtitle: "Dimostrazione del punto 2 (somma)",
            content: `<p>Per ipotesi, per ogni $x, y \\in A$ con $x \\le y$ valgono entrambe:</p>
            <p>$$\\begin{aligned} f(x) &\\le f(y) \\\\ g(x) &\\le g(y) \\end{aligned}$$</p>
            <p>Sommando membro a membro (operazione lecita fra disuguaglianze dello stesso verso):</p>
            <p>$$f(x) + g(x) \\le f(y) + g(y),$$</p>
            <p>cioè $(f+g)(x) \\le (f+g)(y)$: la tesi. $\\square$</p>`
          },
          {
            subtitle: "Suggerimento per il punto 3 (prodotto)",
            content: `<p>I punti 3 e 4 sono lasciati per esercizio. Per il prodotto si parte dalle ipotesi $f(x) \\le f(y)$ e $g(x) \\le g(y)$; poiché $f$ e $g$ sono non negative, si possono moltiplicare membro a membro le disuguaglianze (per esempio moltiplicando la prima per $g(x) \\ge 0$ e la seconda per $f(y) \\ge 0$) per ottenere la tesi.</p>`
          }
        ],
        formulas: [
          { label: "Opposto", latex: "f \\text{ crescente} \\Rightarrow -f \\text{ decrescente}" },
          { label: "Somma", latex: "f, g \\text{ crescenti} \\Rightarrow f+g \\text{ crescente}" },
          { label: "Prodotto (con $f,g \\ge 0$)", latex: "f, g \\text{ crescenti e } \\ge 0 \\Rightarrow f \\cdot g \\text{ crescente}" },
          { label: "Reciproco (con $f$ di segno costante)", latex: "f \\text{ crescente, } \\operatorname{sgn} f \\text{ costante} \\Rightarrow 1/f \\text{ decrescente}" }
        ]
      },

            <p>La funzione $f(x) = x^2$ è:</p>
            <ul>
              <li><strong>strettamente decrescente</strong> per $x \\in (-\\infty, 0]$;</li>
              <li><strong>strettamente crescente</strong> per $x \\in [0, +\\infty)$.</li>
            </ul>
            <p><strong>Monotonia e funzioni pari.</strong> La funzione $x^2$ è <em>pari</em>, cioè $f(-x) = f(x)$, e il suo grafico è simmetrico rispetto all'asse $y$. In generale, se una funzione pari è crescente per $x \\gt 0$, allora deve essere decrescente per $x \\lt 0$.</p>`

      {
        id: "s05-controesempio-iperbole",
        type: "alert_box",
        title: "Controesempio: $1/x$ non è decrescente sul suo dominio",
        icon: "🚨",
        content: `<p>La funzione $f(x) = 1/x$ è decrescente sul suo intero dominio $\\mathbb{R} \\setminus \\{0\\}$?</p>
        <p>La risposta è di nuovo <strong>NO</strong>. Per dimostrarlo basta un controesempio: scegliamo due punti appartenenti a <strong>rami diversi</strong> dell'iperbole, $x = -1$ e $y = 1$.</p>
        <p>Abbiamo $x \\lt y$. Se la funzione fosse decrescente dovrebbe valere $f(x) \\ge f(y)$. Calcoliamo:</p>
        <p>$$\\begin{aligned} f(x) &= f(-1) = \\frac{1}{-1} = -1 \\\\ f(y) &= f(1) = \\frac{1}{1} = 1 \\end{aligned}$$</p>
        <p>Otteniamo $f(x) = -1 \\lt 1 = f(y)$, cioè $f(x) \\lt f(y)$: la condizione di decrescenza è violata. Pertanto $1/x$ <strong>non è decrescente</strong> sull'unione dei due intervalli che costituiscono il suo dominio, pur essendolo su ciascuno di essi.</p>`
      },
      {
        id: "s05-integrazione-esercizi",
        type: "integrazione_box",
        title: "Integrazione — non detto dal docente",
        icon: "📝",
        content: `<p>Esercizi sui contenuti di questa lezione, generati dal verificatore e <strong>non svolti dal docente</strong>. Le soluzioni sono nel box sotto ogni traccia.</p>`
      },
      {
        id: "s05-ex-teoria-1",
        type: "esercizio",
        title: "Teoria 1 — Funzione, immagine e codominio",
        kind: "teoria",
        source: "integrazione",
        content: `<p>Dai la definizione di funzione $f \\colon X \\to Y$ e di immagine $Im(f)$. Spiega la differenza fra codominio e immagine e mostra con un esempio che l'inclusione $Im(f) \\subseteq Y$ può essere stretta.</p>`,
        solution: `<p>Dati due insiemi non vuoti $X$ e $Y$, una funzione $f \\colon X \\to Y$ è una legge che associa ad ogni $x \\in X$ <strong>uno e un solo</strong> elemento $y = f(x) \\in Y$; l'insieme $X$ si dice dominio, l'insieme $Y$ codominio.</p>
        <p>L'immagine è il sottoinsieme del codominio</p>
        <p>$$Im(f) = \\{ y \\in Y \\mid \\exists\\, x \\in X : y = f(x) \\} = \\{ f(x) \\mid x \\in X \\}.$$</p>
        <p>Il <strong>codominio</strong> è l'insieme di arrivo dichiarato, cioè dove i valori <em>possono</em> cadere; l'<strong>immagine</strong> è l'insieme dei valori <em>effettivamente</em> assunti. Vale sempre $Im(f) \\subseteq Y$, ma l'inclusione può essere stretta.</p>
        <p><strong>Esempio.</strong> $f \\colon \\mathbb{R} \\to \\mathbb{R}$, $f(x) = x^2$ ha codominio $\\mathbb{R}$, mentre $Im(f) = [0,+\\infty)$: infatti $x^2 \\ge 0$ per ogni $x \\in \\mathbb{R}$, quindi nessun $y \\lt 0$ è assunto; inoltre ogni $y \\ge 0$ è assunto perché $f(\\sqrt{y}) = y$. Dunque</p>
        <p>$$Im(f) = [0,+\\infty) \\subsetneq \\mathbb{R}.$$</p>`
      },
      {
        id: "s05-ex-teoria-2",
        type: "esercizio",
        title: "Teoria 2 — Controimmagine e simbolo $f^{-1}$",
        kind: "teoria",
        source: "integrazione",
        content: `<p>Dare la definizione di controimmagine $f^{-1}(B)$ di un insieme $B \\subseteq Y$ tramite una funzione $f \\colon X \\to Y$. Spiegare perché la scrittura $f^{-1}$ non presuppone che $f$ sia invertibile ed esibire una funzione $f$ e un insieme $B \\neq \\emptyset$ per cui $f^{-1}(B) = \\emptyset$.</p>`,
        solution: `<p>Per definizione</p>
        <p>$$f^{-1}(B) = \\{ x \\in X \\mid f(x) \\in B \\}:$$</p>
        <p>è il sottoinsieme del dominio formato da tutti gli elementi la cui immagine cade in $B$.</p>
        <p>Il simbolo $f^{-1}$ qui <strong>non</strong> denota una funzione da $Y$ a $X$, ma un'operazione che a un <em>insieme</em> $B \\subseteq Y$ associa un <em>insieme</em> $f^{-1}(B) \\subseteq X$: per calcolarlo basta saper risolvere la condizione $f(x) \\in B$, e non serve alcuna ipotesi di iniettività o surgettività. Infatti $f^{-1}(B)$ può essere vuoto, contenere un solo punto oppure infiniti punti, mentre una funzione inversa dovrebbe associare a ogni $y$ uno e un solo $x$.</p>
        <p><strong>Esempio con controimmagine vuota.</strong> $f \\colon \\mathbb{R} \\to \\mathbb{R}$, $f(x) = x^2$, e $B = [-6,-5]$. La condizione $-6 \\le x^2 \\le -5$ non è mai soddisfatta perché $x^2 \\ge 0$ per ogni $x \\in \\mathbb{R}$, dunque $f^{-1}([-6,-5]) = \\emptyset$ pur essendo $B \\neq \\emptyset$.</p>`
      },
      {
        id: "s05-ex-teoria-3",
        type: "esercizio",
        title: "Teoria 3 — Crescenza e funzione costante",
        kind: "teoria",
        source: "integrazione",
        content: `<p>Enuncia la definizione di funzione crescente e di funzione strettamente crescente su un insieme $A \\subseteq \\mathbb{R}$. Stabilisci poi se la funzione costante $f(x) = k$, $x \\in \\mathbb{R}$, sia crescente, decrescente, strettamente crescente o strettamente decrescente.</p>`,
        solution: `<p>Sia $f \\colon A \\subseteq \\mathbb{R} \\to \\mathbb{R}$. Si dice che $f$ è <strong>crescente</strong> (non decrescente) in $A$ se per ogni $x, y \\in A$ con $x \\le y$ si ha $f(x) \\le f(y)$; si dice <strong>strettamente crescente</strong> se per ogni $x, y \\in A$ con $x \\lt y$ si ha $f(x) \\lt f(y)$.</p>
        <p>Analogamente $f$ è decrescente se $x \\le y \\Rightarrow f(x) \\ge f(y)$ e strettamente decrescente se $x \\lt y \\Rightarrow f(x) \\gt f(y)$.</p>
        <p><strong>Funzione costante.</strong> Presi $x \\le y$ si ha $f(x) = k = f(y)$, dunque valgono sia $f(x) \\le f(y)$ sia $f(x) \\ge f(y)$: la funzione costante è contemporaneamente <strong>crescente e decrescente in senso lato</strong>. Non è però né strettamente crescente né strettamente decrescente, perché per $x \\lt y$ non vale mai $f(x) \\lt f(y)$ né $f(x) \\gt f(y)$.</p>
        <p>Questo mostra che "crescente" nel senso di "non decrescente" non esclude tratti costanti, come accade nell'intervallo $[b,c]$ della funzione a tratti studiata a lezione.</p>`
      },
      {
        id: "s05-ex-teoria-4",
        type: "esercizio",
        title: "Teoria 4 — Schema risolutivo per $\\sqrt[n]{f(x)} \\ge g(x)$, $n$ pari",
        kind: "teoria",
        source: "integrazione",
        content: `<p>Enuncia lo schema risolutivo della disequazione $\\sqrt[n]{f(x)} \\ge g(x)$ con $n$ pari, giustificando la necessità dei due casi, e spiega perché nel sistema del secondo caso la condizione $f(x) \\ge 0$ è superflua.</p>`,
        solution: `<p>Con $n$ pari la radice $\\sqrt[n]{f(x)}$ esiste solo se $f(x) \\ge 0$ ed è sempre una quantità non negativa. Si distinguono due casi in base al segno di $g(x)$.</p>
        <p><strong>Caso 1: $g(x) \\lt 0$.</strong> La disuguaglianza confronta una quantità non negativa con una negativa ed è automaticamente vera, purché la radice esista:</p>
        <p>$$\\begin{cases} f(x) \\ge 0 \\\\ g(x) \\lt 0 \\end{cases} \\quad \\longrightarrow \\quad S_1$$</p>
        <p><strong>Caso 2: $g(x) \\ge 0$.</strong> Entrambi i membri sono non negativi e la funzione $t \\mapsto t^n$ è crescente su $[0,+\\infty)$, quindi si può elevare alla $n$ conservando il verso:</p>
        <p>$$\\begin{cases} f(x) \\ge 0 \\\\ g(x) \\ge 0 \\\\ f(x) \\ge [g(x)]^n \\end{cases} \\quad \\longrightarrow \\quad S_2$$</p>
        <p>La soluzione della disequazione è $S = S_1 \\cup S_2$.</p>
        <p><strong>Perché $f(x) \\ge 0$ è superflua nel secondo sistema.</strong> Se $g(x) \\ge 0$ allora $[g(x)]^n \\ge 0$, e dalla terza condizione $f(x) \\ge [g(x)]^n \\ge 0$: dunque $f(x) \\ge 0$ è conseguenza delle altre due e il sistema si riduce a $g(x) \\ge 0$, $f(x) \\ge [g(x)]^n$. Si osservi che nel primo sistema, invece, $f(x) \\ge 0$ <strong>non</strong> può essere omessa.</p>`
      },
      {
        id: "s05-ex-scritto-1",
        type: "esercizio",
        title: "Scritto 1 — Disequazione irrazionale",
        kind: "scritto",
        source: "integrazione",
        content: `<p>Risolvi la disequazione irrazionale</p>
        <p>$$\\sqrt{x+3} \\ \\ge \\ x+1.$$</p>`,
        solution: `<p><strong>Impostazione.</strong> La radice ha indice pari, quindi si distinguono due casi secondo il segno di $g(x) = x+1$. Condizione di esistenza: $x+3 \\ge 0$, cioè $x \\ge -3$.</p>
        <p><strong>Caso 1: $x+1 \\lt 0$, cioè $x \\lt -1$.</strong> Il primo membro è non negativo e il secondo è negativo, quindi la disequazione è vera ogni volta che la radice esiste. Dal sistema</p>
        <p>$$\\begin{cases} x \\ge -3 \\\\ x \\lt -1 \\end{cases} \\quad \\Rightarrow \\quad S_1 = [-3,-1).$$</p>
        <p><strong>Caso 2: $x+1 \\ge 0$, cioè $x \\ge -1$.</strong> Entrambi i membri sono non negativi e si può elevare al quadrato conservando il verso:</p>
        <p>$$\\begin{aligned} x+3 &\\ge (x+1)^2 \\\\ x+3 &\\ge x^2+2x+1 \\\\ 0 &\\ge x^2 + x - 2 \\\\ x^2+x-2 &\\le 0 \\end{aligned}$$</p>
        <p>Fattorizzando, $x^2+x-2 = (x+2)(x-1)$, le cui radici sono $x = -2$ e $x = 1$; il trinomio è $\\le 0$ fra le radici, cioè $-2 \\le x \\le 1$. La condizione di esistenza è qui superflua (segue dalle altre due).</p>
        <p>Mettendo a sistema $x \\ge -1$ con $-2 \\le x \\le 1$:</p>

      {
        id: "s05-ex-scritto-2",
        type: "esercizio",
        title: "Scritto 2 — Controimmagine di una funzione affine",
        kind: "scritto",
        source: "integrazione",
        content: `<p>Sia $f \\colon \\mathbb{R} \\to \\mathbb{R}$ definita da $f(x) = 3 - 2x$. Determinare la controimmagine $f^{-1}([-1,5])$.</p>`,
        solution: `<p>Per definizione</p>
        <p>$$f^{-1}([-1,5]) = \\{ x \\in \\mathbb{R} \\mid -1 \\le 3-2x \\le 5 \\},$$</p>
        <p>quindi risolviamo la doppia disequazione:</p>
        <p>$$\\begin{aligned} -1 &\\le 3-2x \\le 5 \\\\ -4 &\\le -2x \\le 2 \\\\ 2 &\\ge x \\ge -1 \\end{aligned}$$</p>
        <p>(nel passaggio finale si divide per $-2 \\lt 0$, quindi <strong>entrambe</strong> le disuguaglianze si invertono). Dunque</p>
        <p>$$f^{-1}([-1,5]) = [-1,2].$$</p>
        <p><strong>Verifica.</strong> $f(-1) = 5$ e $f(2) = -1$: poiché $f$ è strettamente decrescente gli estremi si scambiano, ed è proprio quello che accade.</p>

        icon: "🧷",
        content: `<p>Prima dell'esercizio seguente serve una definizione non ancora introdotta a lezione.</p>
        <p>Una funzione $f \\colon X \\to Y$ si dice <strong>iniettiva</strong> se punti distinti del dominio hanno immagini distinte, cioè</p>
        <p>$$\\forall x, y \\in X: \\quad x \\ne y \\ \\Rightarrow \\ f(x) \\ne f(y),$$</p>
        <p>equivalentemente $f(x) = f(y) \\Rightarrow x = y$.</p>
        <p>Da questa definizione segue subito un criterio utile: <strong>ogni funzione strettamente monotòna è iniettiva</strong>.</p>`
      },
      {
        id: "s05-ex-scritto-3",
        type: "esercizio",
        title: "Scritto 3 — Monotonia stretta e iniettività",
        kind: "scritto",
        source: "integrazione",
        content: `<p>Dimostra, usando le proprietà algebriche delle funzioni monotone e la monotonia delle funzioni elementari viste a lezione, che</p>
        <p>$$h(x) = x^3 + \\sqrt[3]{x} - 5$$</p>
        <p>è strettamente crescente su $\\mathbb{R}$; deducine che $h$ è iniettiva.</p>`,
        solution: `<p><strong>Decomposizione.</strong> Poniamo $f(x) = x^3$, $g(x) = \\sqrt[3]{x}$, $c(x) = -5$; tutte hanno dominio $\\mathbb{R}$, quindi $h = f+g+c$ è definita su $\\mathbb{R}$.</p>
        <p><strong>Monotonia dei pezzi.</strong> $f(x) = x^3$ è una potenza a esponente dispari, dunque strettamente crescente su $\\mathbb{R}$; $g(x) = \\sqrt[3]{x}$ è la radice di indice dispari, anch'essa strettamente crescente su $\\mathbb{R}$; $c(x) = -5$ è costante, quindi crescente in senso lato.</p>
        <p><strong>Somma.</strong> Siano $x \\lt y$ reali. Allora $f(x) \\lt f(y)$, $g(x) \\lt g(y)$ e $c(x) = c(y)$. Sommando membro a membro (la somma di disuguaglianze con lo stesso verso, di cui almeno una stretta, resta stretta) si ottiene</p>
        <p>$$x^3 + \\sqrt[3]{x} - 5 \\ \\lt \\ y^3 + \\sqrt[3]{y} - 5,$$</p>
        <p>cioè $h(x) \\lt h(y)$: $h$ è strettamente crescente su $\\mathbb{R}$.</p>
        <p><strong>Iniettività.</strong> Se $x \\ne y$, allora $x \\lt y$ oppure $y \\lt x$; nel primo caso $h(x) \\lt h(y)$, nel secondo $h(y) \\lt h(x)$, e in entrambi $h(x) \\ne h(y)$. Per la definizione di iniettività richiamata sopra, $h$ è iniettiva.</p>
        <p><strong>Osservazione.</strong> Il prodotto $f \\cdot g = x^3 \\sqrt[3]{x} = x^{10/3}$ non sarebbe crescente su $\\mathbb{R}$: l'ipotesi di non negatività del punto 3 della proposizione qui non vale.</p>`
      },
      {
        id: "s05-ex-scritto-4",
        type: "esercizio",
        title: "Scritto 4 — Dominio naturale e controimmagine",
        kind: "scritto",
        source: "integrazione",
        content: `<p>Data $f(x) = \\sqrt{x^2-4}$, determina il dominio naturale $D$ e calcola la controimmagine $f^{-1}([0,3])$.</p>`,
        solution: `<p><strong>Dominio naturale.</strong> Occorre $x^2 - 4 \\ge 0$, cioè $x \\le -2$ oppure $x \\ge 2$, quindi</p>
        <p>$$D = (-\\infty,-2] \\cup [2,+\\infty).$$</p>
        <p><strong>Controimmagine.</strong> Per definizione $f^{-1}([0,3]) = \\{ x \\in D \\mid 0 \\le f(x) \\le 3 \\}$. La disuguaglianza $\\sqrt{x^2-4} \\ge 0$ è automaticamente vera su $D$. Resta</p>
        <p>$$\\sqrt{x^2-4} \\le 3.$$</p>
        <p>Essendo $3 \\ge 0$ ed entrambi i membri non negativi, si eleva al quadrato: $x^2 - 4 \\le 9$, cioè $x^2 \\le 13$, ossia $-\\sqrt{13} \\le x \\le \\sqrt{13}$. Mettendo a sistema con la condizione di esistenza $x^2 \\ge 4$ si ha $4 \\le x^2 \\le 13$.</p>

        id: "s05-oral-riepilogo",
        type: "oral_box",
        title: "Domande tipiche dell'orale su questa lezione",
        icon: "🎤",
        content: `<p>Gli snodi su cui si concentrano le domande sono quattro:</p>
        <ul>
          <li>saper <strong>giustificare</strong> (non solo ricordare) i sistemi delle disequazioni irrazionali con indice pari, e in particolare perché $f(x) \\ge 0$ è superflua in un caso e non nell'altro;</li>
          <li>distinguere con precisione <strong>codominio</strong> e <strong>immagine</strong>, con un esempio di inclusione stretta;</li>
          <li>definire la <strong>controimmagine</strong> chiarendo che $f^{-1}$ agisce su insiemi e non richiede invertibilità;</li>
          <li>spiegare perché la <strong>monotonia non passa all'unione</strong> di insiemi, con il controesempio di $1/x$.</li>
        </ul>`
      }
    ],

    oral_cards: [
      {
        type: "definizione",
        front: "Che cos'è una funzione $f \\colon X \\to Y$? Come si chiamano $X$, $Y$ e $f(x)$?",
        back: "Dati due insiemi non vuoti $X$ e $Y$, una funzione $f$ da $X$ a $Y$ è una legge che associa ad ogni $x \\in X$ <strong>uno e un solo</strong> elemento $y = f(x) \\in Y$. $X$ è il dominio, $Y$ il codominio, $x$ è l'argomento (variabile indipendente) e $y = f(x)$ è il valore, cioè l'immagine di $x$ tramite $f$. L'analogia usata a lezione: magliette e prezzi — magliette diverse possono avere lo stesso prezzo, ma ogni maglietta ha un solo prezzo."
      },
      {
        type: "tranello",
        front: "Codominio e immagine sono la stessa cosa?",
        back: "No. Il codominio $Y$ è l'insieme di arrivo <em>dichiarato</em>, l'immagine $Im(f) = \\{f(x) \\mid x \\in X\\}$ è l'insieme dei valori <em>effettivamente</em> assunti. Vale sempre $Im(f) \\subseteq Y$, ma l'inclusione può essere stretta: per $f \\colon \\mathbb{R} \\to \\mathbb{R}$, $f(x) = x^2$, il codominio è $\\mathbb{R}$ mentre $Im(f) = [0,+\\infty)$."
      },
      {
        type: "definizione",
        front: "Definisci la controimmagine $f^{-1}(B)$ e spiega perché non serve che $f$ sia invertibile.",
        back: "Data $f \\colon X \\to Y$ e $B \\subseteq Y$, si pone $f^{-1}(B) = \\{ x \\in X \\mid f(x) \\in B \\}$. Qui $f^{-1}$ non è una funzione che agisce su un punto, ma un'operazione che a un <em>insieme</em> $B$ associa un <em>insieme</em> contenuto nel dominio: basta saper risolvere la condizione $f(x) \\in B$. Infatti $f^{-1}(B)$ può essere vuoto, un singolo punto o infiniti punti; per esempio con $f(x)=x^2$ e $B = [-6,-5]$ si ha $f^{-1}(B) = \\emptyset$."
      },
      {
        type: "dimostrazione",
        front: "Calcola $f^{-1}([1,4])$ per $f(x) = x^2$.",
        back: "Cerchiamo le $x$ con $1 \\le x^2 \\le 4$, cioè il sistema $x^2 \\ge 1$ e $x^2 \\le 4$. Si ha $x^2 \\ge 1 \\Rightarrow x \\le -1 \\lor x \\ge 1$, ossia $(-\\infty,-1] \\cup [1,+\\infty)$; e $x^2 \\le 4 \\Rightarrow -2 \\le x \\le 2$. Intersecando: $f^{-1}([1,4]) = [-2,-1] \\cup [1,2]$."
      },
      {
        type: "formula",
        front: "Come si risolve $\\sqrt[n]{f(x)} \\ge g(x)$ con $n$ pari?",
        back: "Con l'unione di due sistemi. Caso $g(x) \\lt 0$: la disequazione è vera appena la radice esiste, quindi $\\{ f(x) \\ge 0,\\ g(x) \\lt 0 \\} \\to S_1$. Caso $g(x) \\ge 0$: si eleva alla $n$, $\\{ g(x) \\ge 0,\\ f(x) \\ge [g(x)]^n \\} \\to S_2$ (la condizione $f(x) \\ge 0$ qui è superflua). La soluzione è $S = S_1 \\cup S_2$."
      },
      {
        type: "domanda",
        front: "Perché nel secondo sistema di $\\sqrt[n]{f(x)} \\ge g(x)$ ($n$ pari) la condizione $f(x) \\ge 0$ si può omettere, mentre nel primo no?",
        back: "Nel secondo sistema si ha $g(x) \\ge 0$, quindi $[g(x)]^n \\ge 0$; dalla condizione $f(x) \\ge [g(x)]^n$ segue $f(x) \\ge 0$ automaticamente. Nel primo sistema invece non c'è alcuna disuguaglianza che coinvolga $f(x)$: senza imporre $f(x) \\ge 0$ la radice potrebbe non esistere, quindi la condizione è indispensabile."
      },
      {
        type: "tranello",
        front: "Per $n$ dispari basta scrivere $f(x) \\lessgtr [g(x)]^n$: non c'è davvero nulla da controllare?",
        back: "La radice di indice dispari non impone restrizioni di segno sul radicando e conserva il verso quando si eleva alla $n$, quindi non servono né la discussione del segno di $g(x)$ né condizioni di esistenza <em>dovute alla radice</em>. Però l'equivalenza vale nel dominio comune in cui $f$ e $g$ sono definite: per esempio in $\\sqrt[3]{1/x}$ rimane la condizione $x \\ne 0$."
      },
      {
        type: "definizione",
        front: "Quando una funzione si dice crescente, strettamente crescente e monotòna su $A$?",
        back: "$f$ è crescente in $A$ se per ogni $x_1, x_2 \\in A$ con $x_1 \\le x_2$ vale $f(x_1) \\le f(x_2)$; è strettamente crescente se $x_1 \\lt x_2 \\Rightarrow f(x_1) \\lt f(x_2)$. È monotòna in $A$ se è crescente <em>oppure</em> decrescente in $A$: «monotòna» non significa «crescente», ma «di segno di variazione costante»."
      },
      {
        type: "tranello",
        front: "Se $f$ è crescente su $I_1$ e su $I_2$, è crescente su $I_1 \\cup I_2$?",
        back: "No. La definizione va verificata su <strong>ogni coppia</strong> di punti dell'insieme considerato, comprese le coppie con un punto in $I_1$ e l'altro in $I_2$. Nell'esempio a tratti visto a lezione, presi $x_1 = c \\in [a,c]$ e $x_2 = d \\in [d,e]$ si ha $c \\lt d$ ma $f(c) \\gt f(d)$: la crescenza cade. La monotonia va quindi controllata su tutto l'insieme, anche se non è un intervallo."
      },
      {
        type: "domanda",
        front: "La funzione $1/x$ è decrescente sul suo dominio $\\mathbb{R} \\setminus \\{0\\}$?",
        back: "No: è strettamente decrescente su $(-\\infty,0)$ e su $(0,+\\infty)$ separatamente, ma non sull'unione. Controesempio: $x = -1 \\lt 1 = y$, però $f(-1) = -1 \\lt 1 = f(1)$, cioè $f(x) \\lt f(y)$, il che viola la decrescenza."
      },
      {
        type: "dimostrazione",
        front: "Dimostra che se $f$ e $g$ sono crescenti in $A$ allora $f+g$ è crescente in $A$.",
        back: "Siano $x, y \\in A$ con $x \\le y$. Per ipotesi $f(x) \\le f(y)$ e $g(x) \\le g(y)$. Sommando membro a membro le due disuguaglianze (lecito perché hanno lo stesso verso) si ottiene $f(x)+g(x) \\le f(y)+g(y)$, cioè $(f+g)(x) \\le (f+g)(y)$: la tesi."
      },
      {
        type: "tranello",
        front: "Se $f$ è crescente e non si annulla mai su $A$, allora $1/f$ è decrescente su $A$. Vero o falso?",
        back: "Falso così com'è enunciato: serve che $f$ abbia <strong>segno costante</strong> su $A$ (sempre positiva oppure sempre negativa). Controesempio: $f(x) = x$ su $\\mathbb{R}\\setminus\\{0\\}$ è crescente e mai nulla, ma $1/x$ non è decrescente su $\\mathbb{R}\\setminus\\{0\\}$."
      },
      {
        type: "definizione",
        front: "Che cos'è una successione e come si indica il suo termine generico?",
        back: "Una successione di numeri reali è una funzione $a \\colon \\mathbb{N} \\to \\mathbb{R}$, cioè una funzione il cui dominio è l'insieme dei naturali (eventualmente i naturali da un certo $n_0$ in poi). Si usa la notazione indiciale $a_n$ invece di $a(n)$; $a_n$ è il termine $n$-esimo. Esempio: $a_n = 1/n$ ha dominio $\\mathbb{N} \\setminus \\{0\\}$."
      },
      {
        type: "domanda",
        front: "Qual è la monotonia di $x^2$, $x^3$, $\\sqrt{x}$ e $\\sqrt[3]{x}$?",
        back: "$x^2$ (esponente pari, funzione pari) è strettamente decrescente su $(-\\infty,0]$ e strettamente crescente su $[0,+\\infty)$. $x^3$ (esponente dispari, funzione dispari) è strettamente crescente su tutto $\\mathbb{R}$. $\\sqrt{x}$ ha dominio $[0,+\\infty)$ ed è strettamente crescente lì. $\\sqrt[3]{x}$ ha dominio $\\mathbb{R}$ ed è strettamente crescente su tutto $\\mathbb{R}$."
      }
    ]
};
